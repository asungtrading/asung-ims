<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emails · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* so-emails — 보낸 문서 메일(판정 1496 A · mail-att-a3) · 모양은 so-backorders.html 의 Emails 탭과 같다 */
  .emwrap{padding:14px;display:flex;flex-direction:column;gap:14px}
  .mhead{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .mhead .ttl{font-size:14px;font-weight:600}
  .mhead .dim{font-size:12px}
  .bofilt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
  .bofilt select,.bofilt input{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
  .bofilt .sp{flex:1}
  .bofilt .dash{color:var(--muted);font-size:12px}
  .bofilt .cust{min-width:200px}
  .bofoot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .bofoot .sp{flex:1}
  .bofoot button{border:1px solid var(--line);background:var(--dk-bg-ffffff);border-radius:8px;padding:4px 10px;cursor:pointer}
  .bofoot button:disabled{opacity:.4;cursor:default}
  .mlist tbody tr{cursor:pointer}
  .mlist tbody tr:hover td{background:var(--dk-bg-fafbfd)}
  .st-sent{color:var(--good);font-weight:600}
  .st-fail{color:var(--bad);font-weight:600}
  .st-unk{color:var(--warn);font-weight:700}
  .st-wait{color:var(--dk-tx-4b5565);font-weight:600}
  .st-cxl{color:var(--muted)}
  .pomodal[hidden]{display:none}
  .pobox.wide{width:min(1100px,96vw);max-width:96vw}
  .pobox input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:300px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid var(--dk-ln-f1f3f7);cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:var(--dk-bg-fafbfd)}
  .mmeta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin-bottom:12px}
  .mmeta .k{color:var(--muted)}
  .mframe{width:100%;height:440px;border:1px solid var(--line);border-radius:10px;background:var(--dk-bg-ffffff)}
  .mtext{white-space:pre-wrap;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:440px;overflow:auto;background:var(--dk-bg-fafbfd);margin:0}
  .mact{border:1px solid var(--dk-ln-ecdcb4);background:var(--dk-bg-fffbf0);border-radius:10px;padding:12px;margin-bottom:12px}
  .mact p{margin:0 0 8px;font-size:12.5px}
  .mact textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;box-sizing:border-box}
  .mact .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .msec{font-size:13px;font-weight:600;margin:14px 0 6px}
  .custchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--dk-ln-c9d3ff);background:var(--dk-bg-eef2ff);border-radius:999px;padding:3px 6px 3px 11px;font-size:12px;color:var(--dk-tx-2f3f8f)}
  .custchip button{border:0;background:none;cursor:pointer;color:var(--dk-tx-2f3f8f);font-size:13px;padding:0 4px}
</style>
<style id="imsDarkPalette">/* dk v1 — 다크 모드(판정 1279) · 라이트 값 = 원래 글자 그대로 · so-backorders.html 과 같은 이름 · 같은 다크 값 */
:root{--dk-bg-eef2ff:#eef2ff;--dk-bg-fafbfd:#fafbfd;--dk-bg-fffbf0:#fffbf0;--dk-bg-ffffff:#ffffff;--dk-ln-c9d3ff:#c9d3ff;--dk-ln-ecdcb4:#ecdcb4;--dk-ln-f1f3f7:#f1f3f7;--dk-tx-2f3f8f:#2f3f8f;--dk-tx-4b5565:#4b5565}
html[data-theme="dark"]:is([data-ims-mode="ims"],[data-ims-mode="pos"]){--dk-bg-eef2ff:#162041;--dk-bg-fafbfd:#171b21;--dk-bg-fffbf0:#413516;--dk-bg-ffffff:#171b21;--dk-ln-c9d3ff:#2d3a76;--dk-ln-ecdcb4:#76612d;--dk-ln-f1f3f7:#2a313b;--dk-tx-2f3f8f:#8896dd;--dk-tx-4b5565:#88a9dd}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="emwrap">
  <div class="card">
    <div class="mhead"><span class="ttl">Document emails</span><span class="dim">Invoices, PROFORMAs, sales orders and credit notes emailed from IMS — newest first</span></div>
    <div class="bofilt">
      <select id="fStatus" title="Status">
        <option value="">Every status</option>
        <option value="unknown">Result unknown — needs a check</option>
        <option value="failed">Failed</option>
        <option value="waiting_pdf">Making the PDF</option>
        <option value="queued">Waiting to send</option>
        <option value="sending">Sending</option>
        <option value="sent">Sent</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="fKind" title="Document">
        <option value="">Every document</option>
        <option value="final_invoice">Invoice</option>
        <option value="ship_ready">PROFORMA</option>
        <option value="sales_order">Sales order</option>
        <option value="credit_note">Credit note</option>
      </select>
      <button class="pobtn cust" id="fCust" title="Only one customer — the bill-to, or the store on the document">All customers</button>
      <input type="search" id="fSo" placeholder="Order number (SO-…)" autocomplete="off" style="width:170px">
      <input type="date" id="fFrom" title="Created from"><span class="dash">—</span><input type="date" id="fTo" title="Created to">
      <span class="sp"></span>
      <button class="pobtn" id="fClear">Clear</button>
    </div>
    <div class="mlist" id="list"><div class="msg">Loading…</div></div>
    <div class="bofoot"><span class="range" id="range"></span><span class="sp"></span><button id="prev">←</button><button id="next">→</button></div>
  </div>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* so-emails.html — 보낸 문서 메일(판정 1496 A · 2026-11-21 · 대화 Claude · mail-att-a3)
   읽기: doc_mail_outbox_list(p_filters {status, kind, customer_id, so_number, from, to, limit, offset}) · doc_mail_outbox_detail(p_id)  (A-1b · asung-wms 16fb86c)
   쓰기: mail_outbox_close_sent · mail_outbox_retry · mail_outbox_cancel (p_id, p_note) — 단추는 창구의 can_* 칸으로만(so-backorders.html 과 같은 길 · 판정 514 · 516)
   내려받기: source upload = mail-files 서명 URL(120 초) · source doc = EF doc {action:"url", doc_file_id}
   ⭐ 본문 HTML 은 sandbox iframe(srcdoc · 스크립트 없음)으로만 보인다 */
const EM_BUILD = "2026-11-21 · em v1 · dk1";   // 대화 Claude — em v1(판정 1496 A · mail-att-a3 · asung-wms 16fb86c): 문서 메일 목록 · 거르기(상태 · 문서 · 손님 · 오더 번호 · 기간) · 상세(받는 이 · 본문 · 첨부 내려받기 · History) · 결과 모름 · 실패 단추

let sb = null, me = null;
const PAGE = 100;
let offset = 0, custId = null, custName = "", soQ = "";
const val = (id) => document.getElementById(id).value;

const KIND_LBL = { final_invoice: "Invoice", ship_ready: "PROFORMA", sales_order: "Sales order", credit_note: "Credit note" };
const M_ST = {
  waiting_pdf: ['<span class="st-wait">making the PDF</span>', "The document PDF is being made — it goes out right after."],
  queued: ['<span class="st-wait">waiting to send</span>', "Waiting for its turn to go out."],
  sending: ['<span class="st-wait">sending</span>', "Being sent right now."],
  sent: ['<span class="st-sent">sent</span>', "Gmail accepted it."],
  failed: ['<span class="st-fail">failed</span>', "Gmail or IMS refused it — see the last error."],
  unknown: ['<span class="st-unk">result unknown</span>', "The send was cut off, so we do not know if it went out. Check the ims@asung.ca Sent folder, then close it as sent or send it again."],
  cancelled: ['<span class="st-cxl">cancelled</span>', "Not sent and not sent again."],
};
const mSt = (s) => (M_ST[s] ? M_ST[s][0] : esc(s || ""));
const EV_LBL = { queued: "queued", claimed: "picked up to send", sent: "sent", failed: "failed", unknown: "result unknown", retry: "will try again",
  stale_recovered: "send was cut off", close_sent: "closed as sent", resend: "sent again", cancel: "cancelled", pdf: "PDF made", pdf_failed: "PDF failed" };
function fmtTs(ts){
  if(!ts) return '<span class="dim">—</span>';
  return esc(new Date(ts).toLocaleString("en-CA", { timeZone: "America/Toronto", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }));
}
function fmtBytes(n){
  n = Number(n || 0);
  if(n < 1024) return n + " B";
  if(n < 1024 * 1024) return Math.round(n / 1024) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
const docNo = (m) => {
  const bits = [];
  if(m.invoice_number) bits.push("Inv " + esc(m.invoice_number));
  if(m.credit_number) bits.push("CR " + esc(m.credit_number));
  if((m.so_numbers || []).length) bits.push((m.so_numbers || []).map(esc).join(", "));
  return bits.join(" · ") || '<span class="dim">—</span>';
};

function modalOpen(html){ const b = document.getElementById("modalBox"); b.classList.remove("wide"); b.innerHTML = html; document.getElementById("modal").hidden = false; }
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });
function wireModalClose(){ document.querySelectorAll('#modalBox [data-m="close"]').forEach(b => { b.onclick = modalClose; }); }
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}

/* ── 목록 ── */
function filters(){
  const f = { limit: PAGE, offset };
  const put = (k, v) => { if(v !== "" && v !== null && v !== undefined) f[k] = v; };
  put("status", val("fStatus")); put("kind", val("fKind")); put("from", val("fFrom")); put("to", val("fTo"));
  if(custId) f.customer_id = custId;
  if(soQ) f.so_number = soQ;
  return f;
}
async function load(){
  const box = document.getElementById("list");
  box.innerHTML = '<div class="msg">Loading…</div>';
  const { data, error } = await sb.rpc("doc_mail_outbox_list", { p_filters: filters() });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; document.getElementById("range").textContent = ""; return; }
  const ms = data.mails || [];
  if(!ms.length){ box.innerHTML = '<div class="msg">No emails match.</div>'; pager(data); return; }
  box.innerHTML = `<table><thead><tr><th>Created</th><th>Document</th><th>Customer</th><th>Order · invoice</th><th>To</th><th class="num">Files</th><th>Status</th><th class="num">Tries</th></tr></thead><tbody>${
    ms.map(m => `<tr data-mail="${esc(m.id)}" title="Open this email">
      <td>${fmtTs(m.created_at)}<div class="dim" style="font-size:11px">${m.auto ? "automatic" : esc(m.by_name || "")}</div></td>
      <td>${esc(KIND_LBL[m.doc_kind] || m.doc_kind || m.kind || "")}${m.doc_cancelled ? ' <span class="tag">cancelled</span>' : ""}</td>
      <td>${esc(m.customer_name || "")}${(m.stores || []).length ? `<div class="dim" style="font-size:11px">${(m.stores || []).map(esc).join(", ")}</div>` : ""}</td>
      <td class="mono" style="font-size:12px">${docNo(m)}</td>
      <td style="font-size:12px">${esc(m.to_address || "")}${(m.to_more || []).length ? ` <span class="dim">+${(m.to_more || []).length}</span>` : ""}${m.original_to ? `<div class="dim" style="font-size:11px">instead of ${esc(m.original_to)}</div>` : ""}</td>
      <td class="num">${esc(m.attachment_count ?? 0)}<div class="dim" style="font-size:11px">${fmtBytes(m.attachment_bytes)}</div></td>
      <td>${mSt(m.status)}${m.last_error && m.status !== "sent" ? `<div class="dim" style="font-size:11px">${esc(String(m.last_error).slice(0, 80))}</div>` : ""}</td>
      <td class="num">${esc(m.attempts ?? 0)}</td></tr>`).join("")}</tbody></table>`;
  box.querySelectorAll("[data-mail]").forEach(tr => { tr.onclick = () => detailOpen(tr.dataset.mail); });
  pager(data);
}
function pager(data){
  const n = (data.mails || []).length, tot = data.total || 0;
  const a = tot ? offset + 1 : 0, b = Math.min(offset + n, tot);
  document.getElementById("range").textContent = `${a.toLocaleString()}–${b.toLocaleString()} / ${tot.toLocaleString()}`;
  const p = document.getElementById("prev"), x = document.getElementById("next");
  p.disabled = offset === 0; x.disabled = offset + PAGE >= tot;
  p.onclick = () => { if(offset > 0){ offset = Math.max(0, offset - PAGE); load(); } };
  x.onclick = () => { offset += PAGE; load(); };
}

/* ── 상세 ── */
async function detailOpen(id){
  modalOpen(`<h4>Email</h4><div class="pbody"><div class="msg">Loading…</div></div><div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Close</button></div>`);
  document.getElementById("modalBox").classList.add("wide");
  wireModalClose();
  const { data: m, error } = await sb.rpc("doc_mail_outbox_detail", { p_id: id });
  if(error){ document.querySelector("#modalBox .pbody").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const acts = [];
  if(m.can_close_sent) acts.push(["close", "Close as sent", "I found it in the ims@asung.ca Sent folder."]);
  if(m.can_retry) acts.push(["retry", "Send again", "It is not in the ims@asung.ca Sent folder."]);
  if(m.can_cancel) acts.push(["cancel", "Cancel", "The customer does not need this email. It will not be emailed again."]);
  const actBox = acts.length ? `<div class="mact">
      <p><b>${m.status === "unknown" ? "We do not know if this email went out." : "This email has not gone out."}</b> ${m.status === "unknown" ? "Before you press a button, open the ims@asung.ca Sent folder and look for it: closing it as sent when it did not go means the customer never gets it; sending again when it did go means they get it twice." : ""}</p>
      <textarea id="mNote" placeholder="What did you check? (required)"></textarea>
      <div class="btns">${acts.map(a => `<button class="pobtn${a[0] === "close" ? " go" : ""}" data-act="${a[0]}" title="${esc(a[2])}">${esc(a[1])}</button>`).join("")}</div>
      <div id="mActMsg" style="font-size:12.5px;margin-top:6px"></div>
    </div>` : "";
  const atts = m.attachments || [];
  const evs = m.events || [];
  document.querySelector("#modalBox h4").textContent = m.subject || "Email (not written yet)";
  document.querySelector("#modalBox .pbody").innerHTML = `
    ${actBox}
    <div class="mmeta">
      <span class="k">Status</span><span>${mSt(m.status)} <span class="dim" style="font-size:12px">${esc(M_ST[m.status] ? M_ST[m.status][1] : "")}</span></span>
      <span class="k">Document</span><span>${esc(KIND_LBL[m.doc_kind] || m.doc_kind || "")} · <span class="mono">${docNo(m)}</span>${m.doc_cancelled ? ' <span class="tag">cancelled</span>' : ""}</span>
      <span class="k">Customer</span><span>${esc(m.customer_name || "")}${(m.stores || []).length ? ` <span class="dim">· ${(m.stores || []).map(esc).join(", ")}</span>` : ""}</span>
      <span class="k">To</span><span>${esc(m.to_address || "")}${(m.to_more || []).length ? ` <span class="dim">· also ${(m.to_more || []).map(esc).join(", ")}</span>` : ""}${m.original_to ? ` <span class="dim">— test mode, instead of ${esc(m.original_to)}</span>` : ""}</span>
      <span class="k">From</span><span>${esc(m.from_name || "")} &lt;${esc(m.from_address || "")}&gt;${m.reply_to ? ` <span class="dim">· replies go to ${esc(m.reply_to)}</span>` : ""}</span>
      <span class="k">Sent by</span><span>${m.auto ? "IMS (automatic)" : esc(m.by_name || "—")}</span>
      <span class="k">Created</span><span>${fmtTs(m.created_at)}</span>
      ${m.sent_at ? `<span class="k">Sent</span><span>${fmtTs(m.sent_at)}</span>` : ""}
      ${m.next_attempt_at && m.status === "queued" ? `<span class="k">Next try</span><span>${fmtTs(m.next_attempt_at)}</span>` : ""}
      <span class="k">Tries</span><span>${esc(m.attempts ?? 0)}</span>
      ${m.last_error ? `<span class="k">Last error</span><span class="off" style="font-weight:400">${esc(m.last_error)}</span>` : ""}
    </div>
    <div class="msec">Attachments (${atts.length})</div>
    ${atts.length ? `<table><thead><tr><th class="num">#</th><th>File</th><th>From</th><th class="num">Size</th><th></th></tr></thead><tbody>${atts.map((a, i) => `<tr>
        <td class="num">${esc(a.n ?? i + 1)}</td>
        <td>${esc(a.filename || "")}${a.main ? ' <span class="tag">the document</span>' : ""}${a.deleted ? ' <span class="dim" title="The upload was removed from the list later — the file itself is kept">(removed from list)</span>' : ""}</td>
        <td>${a.source === "upload" ? "uploaded" : "IMS document"}</td>
        <td class="num">${fmtBytes(a.bytes)}</td>
        <td><button class="pobtn" data-dl="${i}">Download</button></td></tr>`).join("")}</tbody></table><div id="dlMsg" style="font-size:12.5px;margin-top:6px"></div>`
      : '<div class="dim" style="font-size:12.5px">No files.</div>'}
    <div class="msec">What the customer sees</div>
    ${m.body_html ? `<div style="margin-bottom:6px"><button class="pobtn" id="mBodyTog">Show plain text</button></div><iframe class="mframe" id="mFrame" sandbox="" referrerpolicy="no-referrer" srcdoc="${esc(m.body_html)}"></iframe><pre class="mtext" id="mText" hidden>${esc(m.body_text || "")}</pre>`
      : m.body_text ? `<pre class="mtext">${esc(m.body_text)}</pre>` : '<div class="msg">Not written yet — the email is written at the moment it is sent.</div>'}
    <div class="msec">History</div>
    ${evs.length ? `<table><thead><tr><th>When</th><th>What</th><th>Who</th><th>Note</th></tr></thead><tbody>${evs.map(e => `<tr><td>${fmtTs(e.at)}</td><td>${esc(EV_LBL[e.action] || e.action || "")}${e.from_status || e.to_status ? ` <span class="dim">${esc(e.from_status || "")} → ${esc(e.to_status || "")}</span>` : ""}</td><td>${esc(e.staff_name || "system")}</td><td>${esc(e.note || "")}</td></tr>`).join("")}</tbody></table>` : '<div class="dim" style="font-size:12.5px">Nothing yet.</div>'}`;
  const tog = document.getElementById("mBodyTog");
  if(tog) tog.onclick = () => { const f = document.getElementById("mFrame"), t = document.getElementById("mText"); const showText = !f.hidden; f.hidden = showText; t.hidden = !showText; tog.textContent = showText ? "Show as the customer sees it" : "Show plain text"; };
  document.querySelectorAll("#modalBox [data-act]").forEach(b => { b.onclick = () => resolve(b.dataset.act, m.id); });
  document.querySelectorAll("#modalBox [data-dl]").forEach(b => { b.onclick = () => download(atts[Number(b.dataset.dl)]); });
}
async function resolve(act, id){
  const note = (document.getElementById("mNote")?.value || "").trim();
  if(!note){ say("mActMsg", "err", "Say what you checked first — the note is required."); return; }
  const fn = { close: "mail_outbox_close_sent", retry: "mail_outbox_retry", cancel: "mail_outbox_cancel" }[act];
  document.querySelectorAll("#modalBox [data-act]").forEach(b => { b.disabled = true; });
  say("mActMsg", "", "Saving…");
  const { error } = await sb.rpc(fn, { p_id: id, p_note: note });
  if(error){ say("mActMsg", "err", error.message); document.querySelectorAll("#modalBox [data-act]").forEach(b => { b.disabled = false; }); return; }
  load();
  detailOpen(id);
}
/* 내려받기 — 새 창을 먼저 열어 두고(팝업 막힘 피하기) 주소를 받으면 옮긴다 */
async function download(a){
  if(!a) return;
  const w = window.open("", "_blank");
  say("dlMsg", "", "Getting the file…");
  let url = null, err = null;
  if(a.source === "upload"){
    const r = await sb.storage.from(a.bucket || "mail-files").createSignedUrl(a.path, 120);
    if(r.error) err = r.error.message; else url = r.data && r.data.signedUrl;
  } else {
    const r = await sb.functions.invoke("doc", { body: { action: "url", doc_file_id: a.id } });
    if(r.error) err = r.error.message;
    else { const d = r.data || {}; url = d.url || d.signed_url || d.signedUrl || null; if(!url) err = d.error || "No download link came back for this document."; }
  }
  if(err || !url){ if(w) w.close(); say("dlMsg", "err", err || "No download link came back."); return; }
  say("dlMsg", "", "");
  if(w) w.location = url; else window.location.href = url;
}

/* ── 손님 고르기 — 이름으로 서버에서 ── */
function openCustPick(){
  modalOpen(`
    <h4>Emails of one customer</h4>
    <div class="pbody">
      <input type="search" id="cpQ" placeholder="Search customer by name" autocomplete="off">
      <div class="pick" id="cpList"><div class="msg">Type at least two letters.</div></div>
      <div class="dim" style="font-size:12px;margin-top:8px">Shows emails billed to this customer, and emails for documents of this store.</div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Close</button></div>`);
  wireModalClose();
  const q = document.getElementById("cpQ"); q.focus();
  let t = null;
  q.oninput = () => { clearTimeout(t); t = setTimeout(async () => {
    const s = q.value.trim(); const box = document.getElementById("cpList");
    if(s.length < 2){ box.innerHTML = '<div class="msg">Type at least two letters.</div>'; return; }
    const { data, error } = await sb.from("customer").select("id,name,is_active").ilike("name", `%${s}%`).order("name").limit(30);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if(!(data || []).length){ box.innerHTML = '<div class="msg">No customer matches.</div>'; return; }
    box.innerHTML = data.map(c => `<div class="prow" data-id="${esc(c.id)}" data-name="${esc(c.name)}">${esc(c.name)}${c.is_active ? "" : ' <span class="dim">· inactive</span>'}</div>`).join("");
    box.querySelectorAll(".prow").forEach(r => { r.onclick = () => { custId = r.dataset.id; custName = r.dataset.name; modalClose(); custShow(); offset = 0; load(); }; });
  }, 250); };
}
function custShow(){
  const b = document.getElementById("fCust");
  b.innerHTML = custId ? `${esc(custName)} ✕` : "All customers";
  b.title = custId ? "Click to show every customer again" : "Only one customer — the bill-to, or the store on the document";
}

/* ── 시작 ── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData;
  imsHeader(me);
  document.getElementById("buildTag").textContent = EM_BUILD;
  const refilter = () => { offset = 0; load(); };
  ["fStatus", "fKind", "fFrom", "fTo"].forEach(i => { document.getElementById(i).onchange = refilter; });
  imsQ("#fSo", v => { soQ = (v || "").trim(); refilter(); });
  document.getElementById("fCust").onclick = () => { if(custId){ custId = null; custName = ""; custShow(); refilter(); } else openCustPick(); };
  document.getElementById("fClear").onclick = () => {
    ["fStatus", "fKind", "fFrom", "fTo", "fSo"].forEach(i => document.getElementById(i).value = "");
    soQ = ""; custId = null; custName = ""; custShow(); refilter();
  };
  /* ?so=SO-12345 · ?status=unknown 로 들어오면 그 조건으로 */
  const ps = imsParam("so"), pst = imsParam("status");
  if(ps){ soQ = ps; document.getElementById("fSo").value = ps; }
  if(pst && M_ST[pst]) document.getElementById("fStatus").value = pst;
  load();
});
</script>
