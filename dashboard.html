<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overview · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* db v2 — 기한 달력(판정 1283 ~ 1286 · 1291) · 색은 모두 공통 변수(다크 모드 ui v2 와 함께 바뀐다) */
  .dbwrap{max-width:1320px;margin:0 auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:12px}
  .dbtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dbtop h1{margin:0 8px 0 0;font-size:21px;font-weight:800;color:var(--ink)}
  .dbmonth{font-size:17px;font-weight:700;min-width:150px;text-align:center;color:var(--ink)}
  .dbtop select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
  .dbtop .sp{flex:1}
  .dblegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .dblegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
  .lg-paid{background:color-mix(in srgb,var(--good) 16%,var(--ims-surface));border-color:var(--good)!important}
  .lg-part{background:color-mix(in srgb,var(--warn) 18%,var(--ims-surface));border-color:var(--warn)!important}
  .lg-unpaid{background:var(--ims-surface);border-color:var(--ims-dim)!important}
  .lg-over{background:color-mix(in srgb,var(--bad) 16%,var(--ims-surface));border-color:var(--bad)!important}

  .dbover{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;font-size:13.5px}
  .dbover b{font-weight:700}
  .dbover .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dbover .lbl{color:var(--muted)}
  .dbover button.amt{border:1px solid var(--line);background:var(--ims-surface);border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .dbover button.amt.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
  .dbover button.amt:hover{background:var(--ims-hover)}
  .dbnote{font-size:12px;color:var(--muted);padding:0 2px}

  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
  .cal .dow{background:var(--ims-surface-2);padding:7px 8px;font-size:12px;font-weight:700;color:var(--muted);text-align:center}
  .cal .day{background:var(--ims-surface);min-height:118px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
  .cal .day.out{background:var(--ims-surface-2)}
  .cal .day.out .dn{color:var(--ims-dim)}
  .cal .day .dn{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .cal .day.today .dn b{background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px}
  .cal .day .dn .wd{display:none}

  .chip{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:inherit;font-size:12px;line-height:1.35;cursor:pointer;background:var(--ims-surface);color:var(--ink);overflow:hidden}
  .chip:hover{filter:brightness(.97)}
  .chip .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .chip .s{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .chip .n{font-family:var(--mono);font-size:11.5px}
  .chip.ar{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .chip.ar.allpaid{color:var(--muted);border-style:dashed}
  .chip .od{color:var(--bad);font-weight:700}
  .chip .fp{color:var(--muted);font-weight:400}
  .chip.paid{background:color-mix(in srgb,var(--good) 14%,var(--ims-surface));border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
  .chip.partial{background:color-mix(in srgb,var(--warn) 16%,var(--ims-surface));border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
  .chip.unpaid{border-color:var(--ims-dim)}
  .chip.overdue{background:color-mix(in srgb,var(--bad) 14%,var(--ims-surface));border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
  .chip .kind{font-size:10.5px;font-weight:700;color:var(--muted);margin-right:4px}
  .cash{display:block;width:100%;text-align:left;border:0;background:none;padding:1px 2px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cash:hover{color:var(--ink);text-decoration:underline}
  .cash.in b{color:var(--good)} .cash.out b{color:var(--ink)} .cash.ref{opacity:.8}
  .pd{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:0 4px;margin-left:3px;color:var(--muted)}
  .more{font-size:11.5px;color:var(--accent);background:none;border:0;padding:0 2px;cursor:pointer;text-align:left;font:inherit;font-size:11.5px}

  .dbmsg{padding:30px 20px;text-align:center;color:var(--muted)}
  .dbmsg b{display:block;color:var(--ink);margin-bottom:4px}
  .dbload{font-size:12px;color:var(--muted)}

  /* db v3 — Task(판정 1293 ~ 1296 · 1299) */
  .tk{display:flex;gap:5px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:7px;padding:3px 6px;font:inherit;font-size:12px;line-height:1.35;cursor:pointer;background:var(--ims-surface);color:var(--ink);min-width:0}
  .tk:hover{background:var(--ims-hover)}
  .tk .bx{flex:none;width:11px;height:11px;margin-top:2px;border:1.5px solid var(--muted);border-radius:3px}
  .tk .tx{min-width:0;flex:1}
  .tk .tt{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk .tw{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tk.done{border-left-color:var(--good);color:var(--muted)}
  .tk.done .tt{text-decoration:line-through;font-weight:400}
  .tk.done .bx{background:var(--good);border-color:var(--good)}
  .tk.over{border-left-color:var(--bad)}
  .tk.over .tt{color:var(--bad)}
  .cal .day .dn .add{visibility:hidden;border:0;background:none;color:var(--accent);font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:0 3px}
  .cal .day:hover .dn .add{visibility:visible}
  .tkfilter{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}

  /* Task 상자 */
  #tkModal .pobox{max-width:620px;width:96vw}
  .tkf{display:grid;grid-template-columns:120px 1fr;gap:9px 12px;align-items:center}
  .tkf label{font-size:12.5px;color:var(--muted)}
  .tkf input[type=text],.tkf input[type=date],.tkf input[type=time],.tkf select,.tkf textarea{width:100%;font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--ims-input-line);border-radius:7px}
  .tkf textarea{min-height:84px;resize:vertical}
  .tkf .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tkf .row input[type=time]{width:auto}
  .tkhits{border:1px solid var(--line);border-radius:7px;margin-top:4px;max-height:180px;overflow:auto}
  .tkhits button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ims-line-soft);background:var(--ims-surface);color:var(--ink);font:inherit;font-size:13px;padding:6px 9px;cursor:pointer}
  .tkhits button:hover{background:var(--ims-hover)}
  .tklink{display:flex;gap:8px;align-items:center}
  .tkmeta{font-size:12px;color:var(--muted);margin-top:10px}
  .tkerr{color:var(--bad);font-size:13px;margin-top:8px}
  .tkok{color:var(--good);font-size:13px;margin-top:8px}
  .tkcat{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .tkcat input[type=text]{flex:1}
  @media (max-width:560px){ .tkf{grid-template-columns:1fr} }

  /* 그날 목록 팝업 — 공통 .pomodal · .pobox 를 쓴다 */
  #calModal .pobox{max-width:980px;width:96vw}
  #calModal table{width:100%}
  #calModal td.r,#calModal th.r{text-align:right}
  #calModal .tag{margin-left:6px}
  #calModal .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}

  @media (max-width:760px){
    .cal{grid-template-columns:1fr;background:none;border:0;gap:6px}
    .cal .dow{display:none}
    .cal .day{min-height:0;border:1px solid var(--line);border-radius:10px}
    .cal .day.empty,.cal .day.out{display:none}
    .cal .day .dn .wd{display:inline}
    .cal .day .dn .add{visibility:visible}
  }
  @media print{
    header,.dbtop button,.dbtop select{display:none!important}
  }
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="dbwrap">
  <div class="dbtop">
    <h1>Calendar</h1>
    <button class="pobtn" id="prevM" title="Previous month">‹</button>
    <span class="dbmonth" id="mLabel">—</span>
    <button class="pobtn" id="nextM" title="Next month">›</button>
    <button class="pobtn" id="todayM">Today</button>
    <select id="wh" title="Branch — customer side only" hidden><option value="">All branches</option></select>
    <button class="pobtn go" id="newTask">+ Task</button>
    <select class="tkfilter" id="tkWho" title="Whose tasks to show" hidden><option value="all">Everyone's tasks</option><option value="mine">My tasks</option></select>
    <span class="dbload" id="load"></span>
    <span class="sp"></span>
    <div class="dblegend" id="legend">
      <span><i class="lg-paid"></i>Paid</span>
      <span><i class="lg-part"></i>Part paid</span>
      <span><i class="lg-unpaid"></i>Not paid</span>
      <span><i class="lg-over"></i>Overdue</span>
    </div>
  </div>

  <div class="card dbover" id="over" hidden></div>
  <div class="dbnote" id="apNote" hidden>Supplier bills and charges entered in IMS only — bills from before October 30, 2026 are in QuickBooks.</div>

  <div id="calBox"><div class="card dbmsg">Loading…</div></div>
</div>

<div class="pomodal" id="calModal" hidden>
  <div class="pobox">
    <h4 id="cmTitle">—</h4>
    <div class="pbody" id="cmBody"></div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" id="cmClose">Close</button></div>
  </div>
</div>

<div class="pomodal" id="tkModal" hidden>
  <div class="pobox">
    <h4 id="tkTitle">New task</h4>
    <div class="pbody">
      <div class="tkf">
        <label for="tkName">Title</label><input type="text" id="tkName" maxlength="200" placeholder="What needs doing">
        <label for="tkDate">Date</label>
        <div class="row"><input type="date" id="tkDate" style="width:auto"><label style="color:var(--ink)"><input type="checkbox" id="tkAllDay" checked> All day</label><input type="time" id="tkTime" hidden></div>
        <label for="tkWhoSel">Assigned to</label><select id="tkWhoSel"></select>
        <label for="tkCat">Category</label>
        <div class="row"><select id="tkCat" style="flex:1"></select><button class="pobtn" id="tkCatEdit" hidden>Edit list</button></div>
        <label for="tkLinkKind">Linked to</label>
        <div>
          <div class="tklink"><select id="tkLinkKind" style="width:auto">
            <option value="">Nothing</option><option value="customer">Customer</option><option value="supplier">Supplier</option>
            <option value="so">Sales order</option><option value="po">Purchase order</option>
            <option value="so_invoice">Customer invoice</option><option value="po_invoice">Supplier invoice</option></select>
            <input type="text" id="tkLinkQ" placeholder="Search…" hidden></div>
          <div id="tkLinkPicked" class="tkmeta" style="margin-top:6px"></div>
          <div class="tkhits" id="tkHits" hidden></div>
        </div>
        <label for="tkNotes">Notes</label><textarea id="tkNotes" maxlength="4000"></textarea>
      </div>
      <div class="tkmeta" id="tkMeta"></div>
      <div id="tkMsg"></div>
    </div>
    <div class="pfoot">
      <button class="pobtn" id="tkDel" hidden style="color:var(--bad)">Delete</button>
      <span class="sp"></span>
      <button class="pobtn" id="tkStatus" hidden>Mark done</button>
      <button class="pobtn" id="tkClose">Close</button>
      <button class="pobtn go" id="tkSave">Save</button>
    </div>
  </div>
</div>

<div class="pomodal" id="catModal" hidden>
  <div class="pobox" style="max-width:460px">
    <h4>Task categories</h4>
    <div class="pbody"><div id="catList"></div>
      <div class="tkcat"><input type="text" id="catNew" maxlength="40" placeholder="New category"><button class="pobtn" id="catAdd">Add</button></div>
      <div class="tkmeta">Categories in use cannot be deleted — switch them off instead.</div><div id="catMsg"></div></div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" id="catClose">Close</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   dashboard.html — IMS 첫 화면 · 기한 달력 (db v2 · 2026-11-16 · 대화 Claude)
   판정 149 · 158: IMS 첫 화면(로고 · IMS 모드 단추 · 문이 여기로) · 판정 1282: 분석은 따로(Analytics) — 여기 넣지 않는다
   판정 1283: 기한 달력 — 손님 인보이스 기한 + 공급처 기한 + 결제 여부 색 + 받은 날 · 지급한 날 · Task 는 다음 차수
   판정 1284: 열쇠는 있는 대로 — sales → 손님 쪽 · purchasing → 공급처 쪽 · 둘 다 없으면 안내 한 줄(창구를 부르지 않는다)
   판정 1285: 손님 = 날마다 한 칸(통화마다) · 공급처 = 건마다 칸
   판정 1286 · 1291: 굵게 = 미수 남은 건수 · 금액 / 흐리게 「+n paid」 · 기한 지남은 제 날짜에 + 위 줄 합계 · 이월(opening) 포함 · 「Carried over」
                     확정 비용 청구서도 공급처 칸 · 공급처 칸 → 인보이스(invoices.html?id=) · 비용(charges.html?id=) · PO 는 글자
                     받은 돈 = 결제 자기 지점 · post-dated 표시 · 환불 따로 · 지점 고르기는 손님 쪽만 · 통화별(더하지 않음)
   창구: cal_month(p_from, p_to, p_warehouse) · cal_day(p_date, p_kind, p_warehouse) — cal-1 · 20261116100000
   ⚠️ 달력 범위 = 그 달을 덮는 일요일 ~ 토요일(최대 42 일) — 창구의 62 일 막기 안
   [db v3 · 2026-11-16 · 대화 Claude] Task(cal-2 · 20261116120000 · 판정 1293 ~ 1296 · 1299)
     · cal_tasks(from, to) — 열쇠 없이 누구나(내 것 · 맡겨진 것 · manager 이상은 모두) → 열쇠가 없는 직원도 달력이 선다(돈 칸만 없음)
     · 칸 맨 위에 Task(체크 · 시간 · 제목 · 담당) · 지난 Open 은 빨강 · 끝낸 것은 줄 긋기 · 날짜 위 「+」로 그날 새 Task
     · 상자: 제목 · 날짜 · 종일/시간 · 담당 · 분류(manager 는 목록 고치기) · 연결 대상(검색 → 고르기) · 메모 · Save / Mark done / Delete(can 이 허락할 때만)
     · 맡긴 뒤 내게 안 보이게 되면(만든 사람도 담당도 아님 · 판정 1293) 안내만 · ?task=<id>(메일 링크)로 들어오면 그 Task 를 연다
     · 「Everyone's / My tasks」 고르기는 모두를 보는 사람(manager 이상)에게만 — 화면 거르기(창구는 그대로)
   ───────────────────────────────────────────────────────────── */
const DB_BUILD = "2026-11-16 · db v3";
console.log("dashboard.html build:", DB_BUILD);

let sb = null, me = null, canAR = false, canAP = false;
let cur = null;          // 보는 달의 1 일(Date · 로컬)
let whId = "";
let lastData = null, seq = 0;
let tasks = [], taskMe = null, staff = null, cats = null, tkWho = "all", editing = null, picked = null;

const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function money(v, ccy){
  const n = Number(v || 0).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (ccy && ccy !== "CAD" ? ccy + " " : "$") + n;
}
const moneyShort = (v, ccy) => {
  const x = Number(v || 0), a = Math.abs(x);
  const s = a >= 1e6 ? (x / 1e6).toFixed(2) + "M" : a >= 1e4 ? (x / 1e3).toFixed(1) + "k" : x.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (ccy && ccy !== "CAD" ? ccy + " " : "$") + s;
};
const STATE_LABEL = { paid: "Paid", partial: "Part paid", unpaid: "Not paid", overdue: "Overdue" };

function range(){
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const last = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  const from = new Date(first); from.setDate(first.getDate() - first.getDay());
  const to = new Date(last); to.setDate(last.getDate() + (6 - last.getDay()));
  return { from, to };
}

async function load(){
  const my = ++seq;
  const { from, to } = range();
  document.getElementById("mLabel").textContent = MONTHS[cur.getMonth()] + " " + cur.getFullYear();
  document.getElementById("load").textContent = "Loading…";
  try{ history.replaceState(null, "", "?m=" + cur.getFullYear() + "-" + pad(cur.getMonth() + 1) + (whId ? "&wh=" + whId : "")); }catch(e){}
  const money = (canAR || canAP) ? sb.rpc("cal_month", { p_from: ymd(from), p_to: ymd(to), p_warehouse: whId || null }) : Promise.resolve({ data: null, error: null });
  const tk = sb.rpc("cal_tasks", { p_from: ymd(from), p_to: ymd(to) });
  const [mr, tr] = await Promise.all([money, tk]);
  if(my !== seq) return;                       // 더 새 요청이 있다
  document.getElementById("load").textContent = "";
  const err = mr.error || tr.error;
  if(err){
    document.getElementById("calBox").innerHTML = `<div class="card dbmsg"><b>Could not load the calendar</b>${esc(err.message || String(err))}</div>`;
    return;
  }
  const empty = { as_of: tr.data.today, can: { sales: false, purchasing: false }, ar_days: [], received_days: [], refund_days: [], ap_items: [], paid_days: [], overdue: { ar: [], ap: [] }, ap_no_due: 0 };
  lastData = mr.data || empty;
  tasks = tr.data.tasks || []; taskMe = tr.data.me || null;
  document.getElementById("tkWho").hidden = !(taskMe && taskMe.sees_all);
  renderOverdue(lastData);
  renderCal(lastData, from, to);
}

function renderOverdue(d){
  const box = document.getElementById("over");
  const parts = [];
  if(d.can.sales){
    const ar = d.overdue.ar || [];
    parts.push(`<div class="grp"><span class="lbl">Overdue — customers${d.warehouse ? " (" + esc(d.warehouse) + ")" : ""}</span>` +
      (ar.length ? ar.map(x => `<button class="amt bad" data-od="overdue_ar"><b>${esc(money(x.amount, x.currency))}</b> · ${x.count}</button>`).join("")
                 : `<span>none</span>`) + `</div>`);
  }
  if(d.can.purchasing){
    const ap = d.overdue.ap || [];
    parts.push(`<div class="grp"><span class="lbl">Overdue — suppliers</span>` +
      (ap.length ? ap.map(x => `<button class="amt bad" data-od="overdue_ap"><b>${esc(money(x.amount, x.currency))}</b> · ${x.count}</button>`).join("")
                 : `<span>none</span>`) +
      (d.ap_no_due ? `<span class="lbl">· ${d.ap_no_due} unpaid without a due date</span>` : "") + `</div>`);
  }
  box.innerHTML = parts.join("");
  box.hidden = !parts.length;
  box.querySelectorAll("[data-od]").forEach(b => b.onclick = () => openDay(null, b.dataset.od));
  document.getElementById("apNote").hidden = !d.can.purchasing;
}

function renderCal(d, from, to){
  const by = {};                                // 날짜 → { ar:[], ap:[], rec:[], ref:[], paid:[] }
  const slot = k => (by[k] = by[k] || { ar: [], ap: [], rec: [], ref: [], paid: [] });
  (d.ar_days || []).forEach(x => slot(x.date).ar.push(x));
  (d.ap_items || []).forEach(x => x.due && slot(x.due).ap.push(x));
  (d.received_days || []).forEach(x => slot(x.date).rec.push(x));
  (d.refund_days || []).forEach(x => slot(x.date).ref.push(x));
  (d.paid_days || []).forEach(x => slot(x.date).paid.push(x));
  const shown = tasks.filter(t => tkWho === "all" || !taskMe || t.assignee.id === taskMe.id);
  shown.forEach(t => { const s = slot(t.date); (s.tk = s.tk || []).push(t); });

  const today = d.as_of;
  let h = WD.map(w => `<div class="dow">${w}</div>`).join("");
  for(let t = new Date(from); t <= to; t.setDate(t.getDate() + 1)){
    const k = ymd(t), s = by[k];
    const out = t.getMonth() !== cur.getMonth();
    const has = s && (s.ar.length || s.ap.length || s.rec.length || s.ref.length || s.paid.length || (s.tk && s.tk.length));
    let c = "";
    if(s && s.tk){
      s.tk.sort((a, b) => (a.status === b.status ? 0 : a.status === "open" ? -1 : 1) || (a.all_day === b.all_day ? 0 : a.all_day ? -1 : 1) || String(a.start_time || "").localeCompare(String(b.start_time || "")));
      s.tk.forEach(t => {
        const cls = t.status === "done" ? " done" : t.overdue ? " over" : "";
        const who = taskMe && t.assignee.id === taskMe.id ? "" : t.assignee.name;
        c += `<button class="tk${cls}" data-task="${esc(t.id)}" title="${esc(t.title)}${t.category ? " · " + esc(t.category.name) : ""}">` +
          `<span class="bx"></span><span class="tx"><span class="tt">${t.all_day ? "" : esc(t.start_time) + " "}${esc(t.title)}</span>` +
          (who || t.link ? `<span class="tw">${esc(who || "")}${who && t.link ? " · " : ""}${t.link ? esc(t.link.label || "") : ""}</span>` : "") +
          `</span></button>`;
      });
    }
    if(s){
      s.ar.forEach(x => {
        const allPaid = !x.open_count;
        c += `<button class="chip ar${allPaid ? " allpaid" : ""}" data-day="${k}" data-kind="ar" title="Customer invoices due ${k}${x.opening_count ? " · " + x.opening_count + " carried over" : ""}">` +
          (allPaid
            ? `<span class="t">${x.paid_count} paid <span class="fp">${x.currency !== "CAD" ? esc(x.currency) : ""}</span></span>`
            : `<span class="t">${x.open_count} due · <span class="n">${esc(moneyShort(x.open_amount, x.currency))}</span></span>` +
              `<span class="s">${x.overdue_count ? `<span class="od">${x.overdue_count} overdue</span> ` : ""}${x.paid_count ? `<span class="fp">+${x.paid_count} paid</span>` : ""}</span>`) +
          `</button>`;
      });
      const show = s.ap.slice(0, 4);
      show.forEach(x => {
        c += `<button class="chip ${esc(x.state)}" data-doc="${esc(x.doc)}" data-id="${esc(x.id)}" title="${esc(STATE_LABEL[x.state] || x.state)}">` +
          `<span class="t"><span class="kind">${x.doc === "charge" ? "CHG" : "BILL"}</span>${esc(x.supplier || "—")}</span>` +
          `<span class="s">${esc(x.number || "")}${x.po_numbers ? " · " + esc(x.po_numbers) : ""}</span>` +
          `<span class="s n">${esc(money(x.payable, x.currency))}${Number(x.unpaid) > 0 && (Number(x.paid) || Number(x.credited)) ? " · left " + esc(moneyShort(x.unpaid, x.currency)) : ""}</span>` +
          `</button>`;
      });
      if(s.ap.length > 4) c += `<button class="more" data-apmore="${k}">+${s.ap.length - 4} more supplier</button>`;
      s.rec.forEach(x => {
        c += `<button class="cash in" data-day="${k}" data-kind="received">Received <b>${esc(moneyShort(x.amount, x.currency))}</b> (${x.count})${x.post_dated_count ? `<span class="pd">${x.post_dated_count} post-dated</span>` : ""}</button>`;
      });
      s.ref.forEach(x => {
        c += `<button class="cash ref" data-day="${k}" data-kind="refund">Refunded ${esc(moneyShort(x.amount, x.currency))} (${x.count})</button>`;
      });
      s.paid.forEach(x => {
        c += `<button class="cash out" data-day="${k}" data-kind="paid">Paid out <b>${esc(moneyShort(x.amount, x.currency))}</b> (${x.count})</button>`;
      });
    }
    h += `<div class="day${out ? " out" : ""}${k === today ? " today" : ""}${has ? "" : " empty"}">` +
      `<div class="dn"><span class="wd">${WD[t.getDay()]} ${MONTHS[t.getMonth()].slice(0, 3)}</span><span><button class="add" data-add="${k}" title="New task on ${k}">+</button><b>${t.getDate()}</b></span></div>${c}</div>`;
  }
  const box = document.getElementById("calBox");
  box.innerHTML = `<div class="cal">${h}</div>`;
  box.querySelectorAll("[data-task]").forEach(b => b.onclick = () => openTask(b.dataset.task));
  box.querySelectorAll("[data-add]").forEach(b => b.onclick = e => { e.stopPropagation(); openTask(null, b.dataset.add); });
  box.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => openDay(b.dataset.day, b.dataset.kind));
  box.querySelectorAll("[data-doc]").forEach(b => b.onclick = () => openDoc(b.dataset.doc, b.dataset.id));
  box.querySelectorAll("[data-apmore]").forEach(b => b.onclick = () => openApDay(b.dataset.apmore));
}

function wireRows(){

async function openDay(k, kind){
  const titles = {
    ar: "Customer invoices due — ", received: "Payments received — ", refund: "Refunds — ", paid: "Supplier payments — ",
    overdue_ar: "Overdue customer invoices", overdue_ap: "Overdue supplier bills and charges"
  };
  modal((titles[kind] || kind) + (k ? longDate(k) : ""), `<div class="dbmsg">Loading…</div>`);
  const { data, error } = await sb.rpc("cal_day", { p_date: k, p_kind: kind, p_warehouse: (kind === "paid" || kind === "overdue_ap") ? null : (whId || null) });
  if(error){ document.getElementById("cmBody").innerHTML = `<div class="dbmsg"><b>Could not load</b>${esc(error.message || String(error))}</div>`; return; }
  const rows = data.rows || [];
  let h = data.warehouse && kind !== "paid" && kind !== "overdue_ap" ? `<p class="sub">${esc(data.warehouse)} only</p>` : "";
  if(!rows.length) h += `<div class="dbmsg">Nothing here.</div>`;
  else if(kind === "ar" || kind === "overdue_ar"){
    h += `<table><thead><tr><th>Invoice</th><th>Bill to</th>${kind === "overdue_ar" ? "<th>Due</th>" : ""}<th>Branch</th><th class="r">Total</th><th class="r">Left</th><th>State</th></tr></thead><tbody>` +
      rows.map(x => `<tr data-href="so-invoices.html?inv=${encodeURIComponent(x.id)}" style="cursor:pointer">` +
        `<td>${esc(x.number || "")}${x.opening ? `<span class="tag">Carried over</span>` : ""}</td><td>${esc(x.bill_to || "—")}</td>` +
        (kind === "overdue_ar" ? `<td>${esc(x.due || "")}</td>` : "") +
        `<td>${esc(x.warehouse || "")}</td><td class="r">${esc(money(x.total, x.currency))}</td><td class="r">${esc(money(x.remaining, x.currency))}</td>` +
        `<td>${!x.is_open ? `<span class="on">Paid</span>` : x.overdue_days > 0 ? `<span class="off">${x.overdue_days} days overdue</span>` : "Open"}</td></tr>`).join("") +
      `</tbody></table>`;
  }else if(kind === "received" || kind === "refund"){
    h += `<table><thead><tr><th>Customer</th><th>Method</th><th>Branch</th><th class="r">Amount</th><th></th></tr></thead><tbody>` +
      rows.map(x => `<tr data-href="so-payments.html?pay=${encodeURIComponent(x.id)}" style="cursor:pointer">` +
        `<td>${esc(x.customer || "—")}</td><td>${esc(x.method || "")}</td><td>${esc(x.warehouse || "")}</td>` +
        `<td class="r">${esc(money(x.amount, x.currency))}</td><td>${x.post_dated ? `<span class="tag">post-dated</span>` : ""}</td></tr>`).join("") +
      `</tbody></table>`;
  }else if(kind === "paid"){
    h += `<table><thead><tr><th>Supplier</th><th>Paid against</th><th class="r">Amount</th><th class="r">Discount</th></tr></thead><tbody>` +
      rows.map(x => `<tr data-href="payments.html?id=${encodeURIComponent(x.id)}" style="cursor:pointer">` +
        `<td>${esc(x.supplier || "—")}</td><td>${esc(Array.isArray(x.docs) ? x.docs.join(", ") : (x.docs || ""))}</td>` +
        `<td class="r">${esc(money(x.amount, x.currency))}</td><td class="r">${Number(x.discount_taken) ? esc(money(x.discount_taken, x.currency)) : ""}</td></tr>`).join("") +
      `</tbody></table>`;
  }else{
    h += apRows(rows);
  }
  if(data.truncated) h += `<p class="sub">Showing the first ${rows.length} of ${data.count}.</p>`;
  document.getElementById("cmBody").innerHTML = h;
  wireRows();
}

const $ = id => document.getElementById(id);
const LINK_URL = {
  customer: l => "customers.html?id=" + encodeURIComponent(l.id),
  supplier: l => "suppliers.html?id=" + encodeURIComponent(l.id),
  so: l => "so.html?so=" + encodeURIComponent(String(l.label || "").split(" · ")[0]),

  po_invoice: l => "invoices.html?id=" + encodeURIComponent(l.id)
};
function tkMsg(text, ok){ $("tkMsg").innerHTML = text ? `<div class="${ok ? "tkok" : "tkerr"}">${esc(text)}</div>` : ""; }
async function ensureLists(){
  if(!staff){
    const { data, error } = await sb.rpc("cal_task_staff");
    if(error) throw error;
    staff = data.staff || [];
  }
  if(!cats){
    const { data, error } = await sb.rpc("cal_task_categories", { p_all: false });
    if(error) throw error;
    cats = data;
  }
}
function fillSelects(t){
  const meId = taskMe && taskMe.id;
  const wantWho = t ? t.assignee.id : meId;
  const whoList = staff.slice();
  if(t && !whoList.some(x => x.id === t.assignee.id)) whoList.push({ id: t.assignee.id, name: t.assignee.name + " (inactive)" });
  $("tkWhoSel").innerHTML = whoList.map(x => `<option value="${esc(x.id)}">${esc(x.name)}${x.id === meId ? " (me)" : ""}</option>`).join("");
  $("tkWhoSel").value = wantWho || "";
  const list = (cats.categories || []).slice();
  if(t && t.category && !list.some(c => c.id === t.category.id)) list.push({ id: t.category.id, name: t.category.name + " (off)" });
  $("tkCat").innerHTML = `<option value="">—</option>` + list.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");
  $("tkCat").value = t && t.category ? t.category.id : "";
  $("tkCatEdit").hidden = !cats.can_edit;
}
function showPicked(){
  const kind = $("tkLinkKind").value;
  $("tkLinkQ").hidden = !kind || !!picked;
  $("tkHits").hidden = true;
  $("tkLinkPicked").innerHTML = picked
    ? `<a class="lnk" href="${esc(LINK_URL[picked.kind](picked))}">${esc(picked.label || "")}</a> <button class="pobtn" id="tkUnlink" style="padding:2px 8px;margin-left:6px">Change</button>`
    : "";
  const u = $("tkUnlink"); if(u) u.onclick = () => { picked = null; showPicked(); $("tkLinkQ").value = ""; $("tkLinkQ").focus(); };
}
let qTimer = null;
async function searchLink(){
  const kind = $("tkLinkKind").value, q = $("tkLinkQ").value.trim();
  if(!kind || q.length < 2){ $("tkHits").hidden = true; return; }
  const pat = "%" + q.replace(/[%_\\]/g, m => "\\" + m) + "%";
  let r;
  if(kind === "customer") r = await sb.from("customer").select("id,name").ilike("name", pat).order("name").limit(12);
  else if(kind === "supplier") r = await sb.from("supplier").select("id,name").ilike("name", pat).order("name").limit(12);
  else if(kind === "so") r = await sb.from("so").select("id,so_number,bill_to_name").ilike("so_number", pat).order("so_number", { ascending: false }).limit(12);
  else if(kind === "po") r = await sb.from("po").select("id,po_number").ilike("po_number", pat).order("po_number", { ascending: false }).limit(12);
  else if(kind === "so_invoice") r = await sb.from("so_invoice").select("id,invoice_number,bill_to_name").ilike("invoice_number", pat).order("invoice_number", { ascending: false }).limit(12);
  else r = await sb.from("po_invoice").select("id,invoice_number").ilike("invoice_number", pat).order("invoice_number", { ascending: false }).limit(12);
  if(kind !== $("tkLinkKind").value) return;
  const rows = (r && r.data) || [];
  const lab = x => kind === "customer" || kind === "supplier" ? x.name
    : kind === "so" ? x.so_number + (x.bill_to_name ? " · " + x.bill_to_name : "")
    : kind === "po" ? x.po_number
    : x.invoice_number + (x.bill_to_name ? " · " + x.bill_to_name : "");
  $("tkHits").innerHTML = r && r.error ? `<div class="tkmeta" style="padding:6px 9px">${esc(r.error.message)}</div>`
    : rows.length ? rows.map(x => `<button data-id="${esc(x.id)}" data-label="${esc(lab(x))}">${esc(lab(x))}</button>`).join("")
    : `<div class="tkmeta" style="padding:6px 9px">Nothing found.</div>`;
  $("tkHits").hidden = false;
  $("tkHits").querySelectorAll("button[data-id]").forEach(b => b.onclick = () => { picked = { kind, id: b.dataset.id, label: b.dataset.label }; showPicked(); });
}
async function openTask(id, dateFor){
  tkMsg("");
  try{ await ensureLists(); }catch(e){ alert(e.message || e); return; }
  let t = null;
  if(id){
    t = tasks.find(x => x.id === id);
    if(!t){
      const { data, error } = await sb.rpc("cal_task_get", { p_id: id });
      if(error){ alert(error.message); return; }
      t = data;
    }
  }
  editing = t;
  const ro = t && !t.can.edit;
  $("tkTitle").textContent = t ? (ro ? "Task" : "Edit task") : "New task";
  $("tkName").value = t ? t.title : "";
  $("tkDate").value = t ? t.date : (dateFor || (lastData && lastData.as_of) || ymd(new Date()));
  $("tkAllDay").checked = t ? t.all_day : true;
  $("tkTime").value = t && t.start_time ? t.start_time : "";
  $("tkTime").hidden = $("tkAllDay").checked;
  $("tkNotes").value = t ? (t.notes || "") : "";
  fillSelects(t);
  $("tkLinkKind").value = t && t.link ? t.link.kind : "";
  picked = t && t.link ? { kind: t.link.kind, id: t.link.id, label: t.link.label } : null;
  $("tkLinkQ").value = ""; showPicked();
  ["tkName","tkDate","tkAllDay","tkTime","tkWhoSel","tkCat","tkLinkKind","tkLinkQ","tkNotes"].forEach(x => $(x).disabled = !!ro);
  $("tkSave").hidden = !!ro;
  $("tkDel").hidden = !(t && t.can.delete);
  $("tkStatus").hidden = !(t && t.can.complete);
  $("tkStatus").textContent = t && t.status === "done" ? "Reopen" : "Mark done";
  $("tkMeta").textContent = t ? `Made by ${t.created_by.name}` + (t.status === "done" && t.done_by ? ` · done by ${t.done_by.name}` : "") + (t.overdue ? " · overdue" : "") : "";
  $("tkModal").hidden = false;
  if(!ro) $("tkName").focus();
}
async function saveTask(){
  const p = {
    title: $("tkName").value.trim(), date: $("tkDate").value, all_day: $("tkAllDay").checked,
    start_time: $("tkAllDay").checked ? null : ($("tkTime").value || null),
    assignee_id: $("tkWhoSel").value || null, category_id: $("tkCat").value || null,
    notes: $("tkNotes").value.trim() || null,
    link_kind: picked ? picked.kind : null, link_id: picked ? picked.id : null
  };
  if(editing) p.id = editing.id;
  $("tkSave").disabled = true; tkMsg("");
  const { data, error } = await sb.rpc("cal_task_save", { p });
  $("tkSave").disabled = false;
  if(error){ tkMsg(error.message); return; }
  const mail = data.mail && data.mail.queued ? ` · emailed ${data.mail.to || data.assignee.name}` : "";
  const handed = taskMe && !taskMe.sees_all && data.assignee.id !== taskMe.id && data.created_by.id !== taskMe.id;
  $("tkModal").hidden = true;
  toast(handed ? `Saved and handed to ${data.assignee.name} — it is no longer on your calendar${mail}` : `Saved${mail}`);
  load();
}
async function setStatus(){
  if(!editing) return;
  const want = editing.status === "done" ? "open" : "done";
  const { error } = await sb.rpc("cal_task_set_status", { p_id: editing.id, p_status: want });
  if(error){ tkMsg(error.message); return; }
  $("tkModal").hidden = true; toast(want === "done" ? "Marked done" : "Reopened"); load();
}
async function delTask(){
  if(!editing || !confirm(`Delete "${editing.title}"?`)) return;
  const { error } = await sb.rpc("cal_task_delete", { p_id: editing.id });
  if(error){ tkMsg(error.message); return; }
  $("tkModal").hidden = true; toast("Deleted"); load();
}
function toast(text){
  const n = document.createElement("div");
  n.textContent = text;
  n.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ims-on-ink);padding:9px 16px;border-radius:9px;font-size:13.5px;z-index:6000;max-width:90vw";

}

  $("tkLinkQ").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(searchLink, 250); };
  $("tkCatEdit").onclick = openCats;
  $("catClose").onclick = () => { $("catModal").hidden = true; if(!cats){ ensureLists().then(() => fillSelects(editing)).catch(() => {}); } };
  $("catAdd").onclick = async () => {
    const name = $("catNew").value.trim(); if(!name) return;
    const { error } = await sb.rpc("cal_task_category_save", { p: { name } });
    if(error){ $("catMsg").innerHTML = `<div class="tkerr">${esc(error.message)}</div>`; return; }
    $("catNew").value = ""; cats = null; openCats();
  };
  $("tkWho").onchange = e => { tkWho = e.target.value; renderCal(lastData, range().from, range().to); };

  const m = imsParam("m");
  const now = new Date();
  cur = (m && /^\d{4}-\d{2}$/.test(m)) ? new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1) : new Date(now.getFullYear(), now.getMonth(), 1);
  whId = imsParam("wh") || "";

  if(canAR){   // 지점 고르기 — 손님 쪽만(판정 1286-6)
    const { data: wh } = await sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name");
    const sel = document.getElementById("wh");
    sel.insertAdjacentHTML("beforeend", (wh || []).map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join(""));
    if(whId && !(wh || []).some(w => w.id === whId)) whId = "";
    sel.value = whId; sel.hidden = false;
    sel.onchange = e => { whId = e.target.value; load(); };
  }
  document.getElementById("prevM").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); load(); };
  document.getElementById("nextM").onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); load(); };
  document.getElementById("todayM").onclick = () => { const n = new Date(); cur = new Date(n.getFullYear(), n.getMonth(), 1); load(); };
  const wantTask = imsParam("task");   // 메일 링크(판정 1296) — load() 가 주소를 ?m= 로 다시 쓰기 전에 읽는다
  await load();
  if(wantTask) openTask(wantTask);
});
</script>
</body>
</html>
