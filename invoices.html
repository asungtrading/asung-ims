  /* Local to this screen — shared rules live in ims-ui.css
     ⭐ [2026-09-17] 세 화면(po · invoices · charges)에 복사돼 있던 규칙 34 를 ims-ui.css 「⑤ 문서 화면 공통」으로 올렸다 —
        .pobtn · .qin/.tin/.xbtn · .pomodal/.pobox/.frow · #wide/.wfilt · .invbar/.invgrid/.invsub · [hidden]. .qin 104px · .tin 180px 로 통일(.qin.pin 삭제) */

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ─────────────────────────────────────────────────────────────
   Invoices & Credits — supplier documents that land on purchase orders
   Canon: docs/design/po-module.md §11-e (discounts) · §11-g (invoices, credits) · §13

   ⭐ A credit note is NOT a separate table. It is po_invoice with doc_kind='credit'.
      Amounts are stored POSITIVE, exactly as printed on the supplier document.
      The subtraction happens in the calculation, never in the stored value.

   ⭐ Discounts sit on the DOCUMENT, never on the line. One 10% row applies to every
      goods line at once. Rows are multiplied in sequence, never added:
      [measured] 2,755.80 chained through 17% and 1% = 2,264.44; added = 2,259.76 (4.68 apart).

   ⚠️ Calculation lives in the database (po_invoice_money view, po_invoice_detail RPC).
      This screen only draws what it is handed. Never recompute here — a second copy drifts.

   ⚠️ Things that look wrong but are not:
      · Unpaid can be negative. That is money owed TO us — a credit landed after we paid.
      · Payable is smaller than the invoiced total when a line is marked not payable
        (freight billed on the invoice that we settle separately).
      · Diff is the printed total minus our calculation. Non-zero means they disagree;
        the printed total stays the source of truth.
   ───────────────────────────────────────────────────────────── */

/* ⚠️ Which build is running. The browser's line numbers have not matched the file more
   than once, so the screen says its own version out loud. */
const INV_BUILD = "2026-10-09 · inv disc v2c";   // 대화 Claude — 미룬 157: Early-pay discount 의 Edit 단추가 작아 못 찾았다 — 박아 둔 크기(style)를 빼 다른 pobtn 과 같게 ← inv disc v2b: 대화 Claude — Caleb 화면: 크레딧 만들기 창 아래 경고가 코드 글자(number_is_provisional · total_amount_missing) — 사람 말로(CRED_WARN · 모르는 코드는 그대로) ← inv disc v2a · 대화 Claude — Caleb 화면: 크레딧 만들기 창 Billed 칸이 전부 「—」 — 서버 반환은 invoice_qty 인데 화면이 invoiced_qty 를 읽었다(옛 결함) ← inv disc v2 · 대화 Claude — ⑥ 할인 화면(po-disc-4a1 · 5a): 인보이스 조기 결제 할인 조건(Early-pay discount · % 또는 금액 · 세금 전/포함 · 기한 · 오늘 기준 금액 · 고치기 창 → PostgREST 네 칸 한 번에 · 잠금 문장 그대로) · 크레딧 줄 Reason(Not received / Price difference · 초안 고르기 → po_invoice_line_update credit_reason · 제안 · 걸침 경고) · 크레딧 원가 변경 표(credit_cost_events) · 확정 결과에 원가 변경 한 줄 · 경고 글귀 ← inv tx v1b · 대화 Claude — 판정 396(po-disc-2): 입고가 있는 확정 인보이스는 Reopen · Cancel 단추를 흐리게 하고 「credit note 로」 한 줄 · 서버가 막는 것은 그대로(미리 말할 뿐) ← inv tx v1a · 대화 Claude — Caleb 「디스카운트 어마운트가 1인것은 맞나?」: 합계 카드 Discount 가 금액이 아니라 곱하는 수(factor · 1 = 할인 없음)를 보였다 — 금액(Goods + Other − Before tax)으로 보이고 곱하는 수는 작은 글자 · 결제 때 받는 할인(텀 디스카운트)은 아래 Payments 표의 Discount 라는 안내 ← inv tx v1 · 대화 Claude — 매입 세금(po-tax-1 51971d0): 머리 Tax rule(초안 드롭다운 · PostgREST tax_rule_id → 짝 트리거 · 비우면 둘 다 null) · 합계 Before tax · Tax · Computed/Payable incl. tax · 줄 Tax rule(빈칸 = 머리 · po_invoice_line_update tax_rule_id / "") · 줄 Tax · 경고 tax_rule_missing · 넓은 목록 incl. tax ← inv thumb v1 · 대화 Claude — 판정 214: 줄 표의 SKU 왼쪽에 대표 사진(imsThumb · thumb-1) ← 「invoice splits the PO」 ⑱-3(대화 Claude) — 판정 88 · 92 · 96 · 97: 확정 = PO 분할 안내 · 결과 split[] · Reopen 뒤 reattached[] · 경고 문장 ← 「Toronto date」(2026-09-23)
console.log("invoices.html build:", INV_BUILD);
let TAX_RULES = [];           // inv tx v1 — active purchase tax rules (head · line pickers)
/* 줄 사진(판정 214 · 화면만 — 인쇄 인보이스에는 넣지 않는다) — 공통 js 가 옛 판으로 캐시돼 있으면 칸 없이 그린다
   ⭐ 채우기는 그린 뒤 저절로 — 화면이 바뀌면(MutationObserver) 안 채운 칸만 모아 한 번에 읽는다 · 채울 칸이 없으면 아무것도 안 묻는다 */
const thumbOf = sku => (sku && typeof window.imsThumb === "function") ? window.imsThumb(sku) : "";
(() => { let t = null; const go = () => { t = null; if(typeof window.imsThumbFill === "function") window.imsThumbFill(document); };
  new MutationObserver(() => { if(!t) t = setTimeout(go, 60); }).observe(document.documentElement, { childList:true, subtree:true }); })();

/* 토론토 날짜 'YYYY-MM-DD' — ⚠️ toISOString().slice(0,10) 은 UTC 날짜다(토론토 저녁 8시 · 겨울 7시 뒤에는 내일 · 2026-09-23 실측 20:09 EDT 에 DB 는 09-24).
   회사의 「오늘」은 토론토다(so-module §13-h · 서버 ims_today()) — 에드먼튼 PC 에서도 토론토 날짜를 쓴다.
   📌 공통 파일(ims-ui.js)이 아니라 화면마다 둔다 — 캐시된 옛 공통 파일과 새 화면이 어긋나면 화면이 죽는다. 다섯 화면이 같은 몸이다(receiving · po · charges · payments · invoices). */
function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb=null, me=null, isAdmin=false;
let q="", kindF="all", stFilter="open", supFilter="", dateFrom="", dateTo="", balF="all", curId=null;
let detailSeq = 0;
/* ⭐ Set by ?credit=1 so the credit-note modal opens as soon as the detail has loaded. */
let pendingCredit = false;
const pgW = imsPage(50);

const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits:2, maximumFractionDigits:2 }));
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits:4 }));

/* ⭐ Negative balance = they owe us. Draw it as a credit, not as a debt. */
function balCell(v){
  const n = Number(v);
  if(!isFinite(n) || n === 0) return '<span class="dim">0.00</span>';
  if(n < 0) return `<span class="on">${money(-n)} credit due</span>`;
  return `<span class="neutral">${money(n)}</span>`;
}
function stChip(s){
  if(s === "cancelled") return '<span class="chip bad">cancelled</span>';
  if(s === "confirmed") return '<span class="chip good">confirmed</span>';
  return `<span class="chip">${esc(s)}</span>`;
}
const kindChip = (k) => k === "credit"
  ? '<span class="tag">credit</span>' : '<span class="tag">invoice</span>';

function modalOpen(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").hidden = false;
}
function modalClose(){
  document.getElementById("modal").hidden = true;
  document.getElementById("modalBox").innerHTML = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });

/* ⚠️ RPC errors arrive as error.message and already end with "nothing was saved".
   Show that sentence as it is. If the slot is gone, fall back to alert — never swallow it. */
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}

/* ── Two modes ─────────────────────────────────────── */
function showWide(){
  curId = null; detailSeq++;
  document.getElementById("wide").hidden = false;
  document.getElementById("detail").hidden = true;
  loadWide();
}
function openInv(id){
  curId = id;
  document.getElementById("wide").hidden = true;
  document.getElementById("detail").hidden = false;
  loadDetail(id);
}

/* ── List ──────────────────────────────────────────── */
function baseQuery(){
  let qy = sb.from("po_invoice_list").select("*", { count:"exact" });
  if(kindF !== "all") qy = qy.eq("doc_kind", kindF);
  if(stFilter === "open")     qy = qy.in("status", ["draft","confirmed"]);
  else if(stFilter !== "all") qy = qy.eq("status", stFilter);
  if(supFilter) qy = qy.eq("supplier_id", supFilter);
  if(dateFrom)  qy = qy.gte("invoice_date", dateFrom);
  if(dateTo)    qy = qy.lte("invoice_date", dateTo);
  if(balF === "unpaid") qy = qy.gt("unpaid", 0);
  if(balF === "due")    qy = qy.lt("unpaid", 0);
  // ⚠️ po_numbers is built by the view so one search box also finds a document by its PO
  // ⭐ supplier_ref_number is in here because the supplier will quote their own number, not ours
  if(q) qy = qy.or(`invoice_number.ilike.%${q}%,supplier_name.ilike.%${q}%,po_numbers.ilike.%${q}%,supplier_ref_number.ilike.%${q}%`);
  return qy.order("invoice_date", { ascending:false }).order("invoice_number", { ascending:false });
}

async function loadWide(){
  const { data, error } = await pgW.run(baseQuery());
  const box = document.getElementById("wrows");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){
    box.innerHTML = '<div class="msg">No documents match.</div>';
    pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide); return;
  }
  box.innerHTML = `<table><thead><tr>
      <th>Number</th><th>Kind</th><th>Date</th><th>Due</th><th>Supplier</th><th>POs</th>
      <th class="num">Printed</th><th class="num">Computed incl. tax</th><th class="num">Diff</th>
      <th class="num">Payable incl. tax</th><th class="num">Paid / used</th><th class="num">Balance</th><th>Status</th>
    </tr></thead><tbody>${data.map(r => {
      const bad = Number(r.diff) !== 0;
      return `<tr data-id="${r.id}">
        <td><span class="mono">${esc(r.invoice_number)}</span>${
          r.credit_for_number ? `<div class="dim" style="font-size:11.5px">for ${esc(r.credit_for_number)}</div>` : ""}${
          r.supplier_ref_number ? `<div class="dim" style="font-size:11.5px">their ref ${esc(r.supplier_ref_number)}</div>` : ""}</td>
        <td>${kindChip(r.doc_kind)}</td>
        <td>${dim(r.invoice_date)}</td>
        <td>${dim(r.due_date)}</td>
        <td>${esc(r.supplier_name)}</td>
        <td class="mono" style="font-size:11.5px">${dim(r.po_numbers)}</td>
        <td class="num">${money(r.total_amount)} <span class="dim">${esc(r.currency_code || "")}</span></td>
        <td class="num">${bad ? `<span class="off">${money(r.computed_total)}</span>` : money(r.computed_total)}</td>
        <td class="num">${bad ? `<span class="off">${money(r.diff)}</span>` : '<span class="dim">0.00</span>'}</td>
        <td class="num">${money(r.payable_net)}</td>
        <!-- ⚠️ On a credit row these two mean something else: what has been used, and what is
             left to use. An unattached credit is the only one with a balance to spend. -->
        <td class="num">${money(r.alloc_total)}</td>
        <td class="num">${r.doc_kind === "credit"
            ? (r.credit_for_number
                ? '<span class="dim">applied</span>'
                : (Number(r.remaining) > 0 ? `<span class="on">${money(r.remaining)} to use</span>` : '<span class="dim">0.00</span>'))
            : balCell(r.unpaid)}</td>
        <td>${stChip(r.status)}</td>
      </tr>`;
    }).join("")}</tbody></table>
    <div class="invsub">⚠️ Printed is what the supplier put on the document and stays the source of truth.
      Computed is ours, from the lines, the discount chain and the tax rule (tax line by line). A non-zero Diff means they disagree — check the lines.
      On a credit row, Paid / used is how much of it has been spent and Balance is what is left; a credit tied to an invoice
      shows <em>applied</em> because it has already come off that invoice.</div>`;
  box.querySelectorAll("tbody tr").forEach(el => { el.onclick = () => openInv(el.dataset.id); });
  pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

/* ── Detail ────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const { data, error } = await sb.rpc("po_invoice_detail", { p_invoice_id: id });
  if(seq !== detailSeq) return;
  /* inv disc v2 · po-disc-4a1 — the early-payment terms are not in the detail header; one read beside it.
     The amount is worked out on today's date by the same formula the payment uses (po_early_discount_calc). */
  let early = null;
  if(data && data.header && data.header.doc_kind === "invoice"){
    const er = await sb.rpc("po_invoice_early_discount", { p_invoice_id: id });
    if(seq !== detailSeq) return;
    if(!er.error) early = (er.data || [])[0] || null;
  }
  if(error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(error.message)}</div></div>`; return; }
  if(!data){ box.innerHTML = '<div class="card"><div class="msg">That document is gone.</div></div>'; return; }

  const h = data.header, m = data.money || {};
  const isCredit = h.doc_kind === "credit";
  /* ⚠️ Only a draft can be edited. Confirming is an accounting act — it creates the amount
     owed and sends the discount down into cost. Editing after that would change both silently. */
  const ed = h.status === "draft";
  const bad = Number(m.diff) !== 0;
  /* inv tx v1b · ruling 396 — once the warehouse has received against a billed line, the invoice
     can no longer be reopened or cancelled; a credit note corrects it. The server refuses either
     way (po_invoice_confirm · po_doc_cancel) — this only says so before the click.
     ⚠️ The server also refuses when a receipt sits on another line of the same order, which the
     lines here cannot show — then the buttons stay and the sentence comes back from the server. */
  const received = !isCredit && h.status === "confirmed"
    && (data.lines || []).some(l => l.po_line_id && Number(l.received_qty) > 0);
  const closedTip = "The warehouse has received against this invoice — correct it with a credit note";

  const acts = ['<button class="pobtn" data-act="wide">&lsaquo; All documents</button>'];
  if(ed){
    acts.push('<button class="pobtn" data-act="addline">Add a line</button>');
    acts.push('<button class="pobtn" data-act="adddisc">Add a discount</button>');
    acts.push('<button class="pobtn" data-act="addpo">Add lines from a PO</button>');
    acts.push('<button class="pobtn go" data-act="confirm">Confirm</button>');
  } else if(h.status === "confirmed"){
    acts.push(received
      ? `<button class="pobtn" data-act="reopen" disabled title="${closedTip}">Reopen</button>`
      : '<button class="pobtn" data-act="reopen">Reopen</button>');
  }
  /* ⭐ A credit note is raised from the invoice it answers. The draft arrives already
     filled with the gap between what was billed and what actually arrived, so nobody
     has to carry those numbers across by hand. */
  if(!isCredit && h.status !== "cancelled")
    acts.push('<button class="pobtn" data-act="credit">Create a credit note</button>');
  /* ⭐ Cancelling is open on a draft too — a supplier document that arrived and was refused
     is worth keeping as a record, and refusing that would leave no way to enter it. */
  if(h.status !== "cancelled") acts.push(received
      ? `<button class="pobtn" data-act="cancel" disabled title="${closedTip}">Cancel</button>`
      : '<button class="pobtn" data-act="cancel">Cancel</button>');
  /* ⭐ Restore lives in the detail only — on the list it would sit against every cancelled
     row and a stray click would put a dead document back into the books. */
  if(h.status === "cancelled") acts.push('<button class="pobtn" data-act="restore">Restore</button>');
  /* ⭐⭐ Delete: an invoice that was never confirmed. Never a credit note — see docErr block.
     ⚠️ This is convenience. What actually refuses is po_doc_delete. */
  if(!isCredit && !h.confirmed_at) acts.push('<button class="pobtn" data-act="delete">Delete</button>');
  /* ⭐ Paying happens on the payments screen — one payment often settles several documents at
     once, and it has to hold what actually left the bank. This only carries the number across. */
  if(!isCredit && h.status === "confirmed" && Number(m.unpaid) > 0)
    acts.push('<button class="pobtn" data-act="pay">Pay</button>');

  const chips = [kindChip(h.doc_kind), stChip(h.status)];
  if(h.credit_for_number) chips.push(`<span class="chip">for ${esc(h.credit_for_number)}</span>`);

  const kvL = [
    ["Supplier",      esc(h.supplier_name)],
    ["Document date", dim(h.invoice_date)],
    // ⚠️ Due date is typed in. It should be invoice date plus the term's net days,
    //    but ref_payment_term has no day counts yet, so nothing can propose it.
    ["Due date",      dim(h.due_date)],
    ["Payment term",  dim(h.payment_term_name)],
  ];
  // inv disc v2 — invoices only · a credit note has no early-payment terms
  if(!isCredit) kvL.push(["Early-pay discount", earlyText(early)
      + (h.status !== "cancelled" ? ' <button class="pobtn" data-act="early">Edit</button>' : "")]);
  const kvR = [
    // inv tx v1 — 세금 규칙(po-tax-1): 초안이면 드롭다운 · 줄 규칙이 비면 이것을 따른다
    ["Tax rule",     headTax(h.tax_rule_id, h.tax_rule, h.rate_pct, ed)
                     + ((data.warnings || []).includes("tax_rule_missing") ? '<div class="bad" style="font-size:11.5px">Some lines have no tax rule — their tax counts as 0</div>' : "")],
    ["Currency",     `<span class="mono">${dim(h.currency_code)}</span>` +
                     (h.exchange_rate ? ` <span class="dim">@ ${esc(h.exchange_rate)}</span>` : "")],
    ["Created by",   dim(h.created_by_name) + (h.created_at ? ` <span class="dim">· ${imsTs(h.created_at)}</span>` : "")],
    ["Confirmed by", dim(h.confirmed_by_name) + (h.confirmed_at ? ` <span class="dim">· ${imsTs(h.confirmed_at)}</span>` : "")],
    ["Cancelled",    h.cancelled_at ? `<span class="off">${imsTs(h.cancelled_at)}</span>` : '<span class="dim">—</span>'],
  ];
  const kvTbl = (rows) => `<table class="kv"><tbody>${
    rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  /* ⭐ The printed total is typed in from the document; leaving it at zero is normal
     while the document is being entered, and the Diff makes that obvious. */
  const stats = `
    <div class="stats">
      <div class="stat">Goods<b>${money(m.goods_sum)}</b></div>
      <div class="stat" title="Discount chain on this document — multiplier ${esc(Number(m.discount_factor))}. An early-payment discount is not here: it is entered on the payment (Payments table below).">Discount<b>${(() => { const d = Number(m.goods_sum || 0) + Number(m.other_sum || 0) - Number(m.taxable_amount || 0); return d ? "−" + money(d) : money(0); })()}</b>${Number(m.discount_factor) !== 1 ? `<div class="dim" style="font-size:11px">× ${esc(Number(m.discount_factor))}</div>` : ""}</div>
      <div class="stat">Other lines<b>${money(m.other_sum)}</b></div>
      <div class="stat">Before tax<b>${money(m.taxable_amount)}</b></div>
      <div class="stat">Tax<b>${m.tax_amount === null || m.tax_amount === undefined ? '<span class="dim">—</span>' : money(m.tax_amount)}</b></div>
      <div class="stat">Computed incl. tax<b>${money(m.computed_total)}</b></div>
      <div class="stat ${bad ? "warn" : ""}">Printed<b>${money(h.total_amount)}</b></div>
      <div class="stat ${bad ? "warn" : ""}">Diff<b>${money(m.diff)}</b></div>
      <div class="stat">${isCredit ? "Credit net incl. tax" : "Payable incl. tax"}<b>${money(m.payable_net)}</b></div>
      <div class="stat">${isCredit ? "Used" : "Paid"}<b>${money(m.alloc_total)}</b></div>
      <div class="stat">${isCredit ? "Remaining" : "Balance"}<b>${
        isCredit ? money(m.remaining) : balCell(m.unpaid)}</b></div>
    </div>`;

  /* Lines — each one carries what the purchase order says, so the two can be compared here. */
  const lines = (data.lines || []).map(l => {
    const diffQty = Number(l.qty_diff);
    const priceOff = l.po_unit_price !== null && l.po_unit_price !== undefined
                     && Number(l.po_unit_price) !== Number(l.unit_price);
    return `<tr>
      <td class="num">${esc(l.line_no)}</td>
      <td><span class="tag">${esc(l.line_kind)}</span></td>
      <td>${l.po_line_id
            ? `<div class="lnth">${thumbOf(l.sku)}<div><span class="mono">${esc(l.sku)}</span><div class="dim" style="font-size:11.5px">${esc(l.product_name)}</div></div></div>`
            : `${esc(l.description || "")}`}</td>
      <td class="mono" style="font-size:11.5px">${dim(l.po_number)}${
            l.po_line_no ? ` <span class="dim">#${esc(l.po_line_no)}</span>` : ""}</td>
      <td class="num">${ed
            ? `<input class="qin" type="number" step="any" min="0" value="${esc(l.qty_ea)}" data-prev="${esc(l.qty_ea)}" data-line="${l.id}" data-f="qty_ea">`
            : qty(l.qty_ea)}</td>
      <td class="num">${ed
            ? `<input class="qin pin" type="number" step="any" min="0" value="${esc(l.unit_price)}" data-prev="${esc(l.unit_price)}" data-line="${l.id}" data-f="unit_price">`
            : money(l.unit_price)}${priceOff ? `<div class="off" style="font-size:11.5px">PO ${money(l.po_unit_price)}</div>` : ""}</td>
      <td class="num">${money(l.amount)}</td>
      <td>${lineTax(l, ed)}</td>
      <td class="num">${l.tax_amount === null || l.tax_amount === undefined ? '<span class="dim">—</span>' : money(l.tax_amount)}</td>
      <td class="num">${l.po_line_id ? qty(l.po_qty_ea) : '<span class="dim">—</span>'}</td>
      <td class="num">${l.po_line_id ? qty(l.received_qty) : '<span class="dim">—</span>'}</td>
      <td class="num">${l.po_line_id
            ? (diffQty ? `<span class="off">${qty(diffQty)}</span>` : '<span class="dim">0</span>')
            : '<span class="dim">—</span>'}</td>
      <td>${ed
            ? `<input type="checkbox" data-pay="${l.id}" ${l.is_payable ? "checked" : ""} title="Counts toward the amount to settle">`
            : (l.is_payable ? "" : '<span class="tag">not payable</span>')}</td>
      ${isCredit ? `<td>${reasonCell(l, ed)}</td>` : ""}
      ${ed ? `<td><button class="xbtn" data-del="${l.id}" title="Remove line">&#10005;</button></td>` : ""}
    </tr>`;
  });

  /* inv disc v2 · ruling 400 — what a credit note's price-difference lines did to stock cost.
     A pending row waits for the goods to be received; reopening or cancelling the credit adds a reversal. */
  const cevs = (data.credit_cost_events || []).map(e => `<tr>
      <td class="num">${esc(e.line_no)}</td>
      <td>${e.reverses_id ? '<span class="tag">reversal</span>' : '<span class="tag">price difference</span>'}</td>
      <td class="num">${money(e.amount_cad)}</td>
      <td>${e.status === "posted" ? '<span class="on">applied</span>' : '<span class="dim">pending — waits for the goods to be received</span>'}</td>
      <td>${dim(e.posted_on)}</td>
    </tr>`);
  const dwarn = (data.warnings || []).filter(w => INV_DWARN[w]).map(w => `<div class="off" style="margin-top:8px;font-size:12.5px">⚠ ${INV_DWARN[w]}</div>`).join("");

  /* Discounts — one row applies to every goods line. Rows multiply in sequence. */
  const disc = (data.discounts || []).map(d => `<tr>
      <td class="num">${esc(d.seq)}</td>
      <td>${ed ? `<input class="tin" value="${esc(d.name)}" data-prev="${esc(d.name)}" data-disc="${d.id}" data-f="name">` : esc(d.name)}</td>
      <td class="num">${ed
          ? `<input class="qin" type="number" step="any" min="0" max="100" value="${esc(d.percent)}" data-prev="${esc(d.percent)}" data-disc="${d.id}" data-f="percent">`
          : esc(d.percent) + "%"}</td>
      <td>${d.supplier_discount_id ? '<span class="dim">from supplier</span>' : '<span class="dim">added here</span>'}</td>
      ${ed ? `<td><button class="xbtn" data-ddel="${d.id}" title="Remove discount">&#10005;</button></td>` : ""}
    </tr>`);

  /* ⭐ Both ways. A document is edited here but it belongs to a purchase order, and getting
     back through the menu and the search box was the long way round. */
  const shares = (data.po_shares || []).map(s => `<tr>
      <td><a class="lnk mono" href="po.html?po=${encodeURIComponent(s.po_number)}" title="Open this purchase order">${esc(s.po_number)}</a></td>
      <td><span class="tag">${esc(s.po_status)}</span></td>
      <td class="num">${esc(s.line_count)}</td>
      <td class="num">${qty(s.qty_ea)}</td>
      <td class="num">${money(s.amount)}</td>
    </tr>`);

  const creds = (data.credits || []).map(c => `<tr>
      <td><a class="lnk mono" href="invoices.html?id=${esc(c.id)}" title="Open this credit note">${esc(c.credit_number)}</a></td>
      <td>${dim(c.credit_date)}</td>
      <td>${stChip(c.status)}</td>
      <td class="num">${money(c.total_amount)}</td>
      <td class="num">${money(c.credit_net)}</td>
      <td class="num">${Number(c.used) > 0 ? money(c.used) : '<span class="dim">—</span>'}</td>
    </tr>`);

  const pays = (data.payments || []).map(p => `<tr>
      <td class="mono">${dim(p.reference)}</td>
      <td>${dim(p.paid_on)}</td>
      <td class="num">${money(p.payment_amount)} <span class="dim">${esc(p.currency_code || "")}</span></td>
      <td class="num">${Number(p.discount_taken) > 0 ? money(p.discount_taken) : '<span class="dim">—</span>'}</td>
      <td class="num">${money(p.alloc_amount)}</td>
      <td>${dim(p.account_name)}</td>
      <td>${dim(p.paid_by_name)}</td>
    </tr>`);

  const tbl = (title, n, head, rows, sub) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(x=>`<th${x[1]?' class="'+x[1]+'"':''}>${x[0]}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>${sub?`<div class="invsub">${sub}</div>`:""}`
      : `<div class="msg">None.</div>`}
    </div>`;

  if(seq !== detailSeq) return;
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="invbar">
          <span class="pn">${esc(h.invoice_number)}</span>
          <span class="chips">${chips.join("")}</span>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>
        ${received ? '<div class="dim" style="margin-top:8px;font-size:12px">Received — Reopen and Cancel are closed. Correct this invoice with a credit note.</div>' : ""}
        ${dwarn}
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)">
          <span>Printed total</span>
          ${ed ? `<input class="qin pin" type="number" step="any" min="0" value="${esc(h.total_amount)}" data-prev="${esc(h.total_amount)}" data-head="total_amount">`
               : `<span class="mono">${money(h.total_amount)}</span>`}
          <span>Due date</span>
          ${ed ? `<input class="tin" type="date" value="${esc(h.due_date || "")}" data-prev="${esc(h.due_date || "")}" data-head="due_date">`
               : `<span class="mono">${dim(h.due_date)}</span>`}
          ${isCredit ? `<span title="The supplier's own credit note number, once they send one">Supplier ref</span>
          <input class="tin" value="${esc(h.supplier_ref_number || "")}" data-prev="${esc(h.supplier_ref_number || "")}" data-head="supplier_ref_number" placeholder="their number">` : ""}
          <span id="headMsg"></span>
        </div>
      </div>
      ${stats}
      <div class="invgrid">${kvTbl(kvL)}${kvTbl(kvR)}</div>
      ${h.note ? `<div class="note">${esc(h.note)}</div>` : ""}
    </div>

    ${tbl("Lines", (data.lines||[]).length,
      [["#","num"],["Kind",""],["Item",""],["PO",""],["Qty","num"],["Unit price","num"],
       ["Amount","num"],["Tax rule",""],["Tax","num"],["PO qty","num"],["Received","num"],["Qty diff","num"],["Payable",""]]
        .concat(isCredit ? [["Reason",""]] : []).concat(ed ? [["",""]] : []), lines,
      "Qty diff compares what is billed with what actually arrived. A non-zero value is what a credit note is usually made from. " +
      "Clearing Payable leaves a line out of the amount to settle — that is how freight billed here but paid elsewhere is handled." +
      (ed ? " Quantity and unit price are edited in the cell." : "") +
      " Tax is worked out line by line from the tax rule (a blank rule follows the document's); the discount chain takes its share of the tax back once — line Tax is before the discount." +
      (isCredit ? " Reason decides what the credit does to cost: Not received leaves cost alone (the goods never came); Price difference lowers the cost of goods already received, and of what was already sold." : ""))}

    ${isCredit && (data.credit_cost_events || []).length ? tbl("Cost changes", (data.credit_cost_events || []).length,
      [["Line","num"],["Kind",""],["Amount CAD","num"],["Status",""],["Applied on",""]], cevs,
      "Price difference lines lower stock cost when the credit is confirmed — the part already sold goes to cost of goods sold. Pending means the goods are not received yet; it is applied at receipt.") : ""}

    ${tbl("Discounts", (data.discounts||[]).length,
      [["Seq","num"],["Name",""],["Percent","num"],["Source",""]].concat(ed ? [["",""]] : []), disc,
      `Rows multiply in sequence, they are not added. Goods ${money(m.goods_sum)} × ${esc(Number(m.discount_factor))} = ${money(m.goods_payable)}. ` +
      "A discount sits on the document and reaches every goods line at once — never enter it line by line. " +
      "From supplier means it came across from the purchase order; added here means it applies to this document only.")}

    ${tbl("Purchase orders", (data.po_shares||[]).length,
      [["PO",""],["Status",""],["Lines","num"],["Qty","num"],["Amount","num"]], shares,
      "One document can cover several purchase orders. Amount is the line total before the discount chain — " +
      "the discount belongs to the document, so it is not split across POs.")}

    ${isCredit ? "" : tbl("Credit notes against this invoice", (data.credits||[]).length,
      [["Number",""],["Date",""],["Status",""],["Printed","num"],["Net","num"],["Used","num"]], creds,
      "These reduce what is owed on this invoice. If the balance has gone negative, they arrived after payment.")}

    ${tbl("Payments", (data.payments||[]).length,
      [["Reference",""],["Date",""],["Paid","num"],["Discount","num"],["Applied","num"],["Account",""],["By",""]], pays,
      "Paid plus Discount equals Applied. An early-payment discount is declared on the payment, not here.")}
  `;

  box.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if(a === "wide")    showWide();
      if(a === "confirm") confirmInv(h.id, true);
      if(a === "reopen")  confirmInv(h.id, false);
      if(a === "addline") openAddLine(h.id);
      if(a === "adddisc") openAddDiscount(h.id);
      if(a === "addpo")   openAddPo(h.id, h.supplier_id);
      if(a === "credit")  openCreateCredit(h);
      if(a === "cancel")  cancelDoc(h);
      if(a === "restore") restoreDoc(h);
      if(a === "delete")  deleteDoc(h);
      if(a === "early")   openEarly(h, early);
      if(a === "pay")     window.location.href = "payments.html?doc=" + encodeURIComponent(h.invoice_number);
    };
  });
  // ⚠️ Wired even when the document is confirmed — only this one field is editable then.
  box.querySelectorAll('input[data-head="supplier_ref_number"]').forEach(i => {
    i.onchange = () => saveHead(h.id, i);
  });
  if(ed){
    box.querySelectorAll("input[data-line]").forEach(i => { i.onchange = () => saveLine(i); });
    box.querySelectorAll("input[data-disc]").forEach(i => { i.onchange = () => saveDiscount(i); });
    box.querySelectorAll("input[data-head]").forEach(i => { i.onchange = () => saveHead(h.id, i); });
    box.querySelectorAll("select[data-head]").forEach(i => { i.onchange = () => { if(i.value !== i.dataset.prev) saveHead(h.id, i); }; });
    box.querySelectorAll("select[data-ltax]").forEach(sel => { sel.onchange = () => saveLineTax(sel); });
    box.querySelectorAll("select[data-creason]").forEach(sel => { sel.onchange = () => saveCreditReason(sel); });
    box.querySelectorAll("[data-pay]").forEach(c => { c.onchange = () => togglePayable(c); });
    box.querySelectorAll("[data-del]").forEach(b => { b.onclick = () => removeLine(b.dataset.del); });
    box.querySelectorAll("[data-ddel]").forEach(b => { b.onclick = () => removeDiscount(b.dataset.ddel); });
  }

  /* ⭐ Arriving from a purchase order's "+ credit" link. The modal can only be opened once
     the header is loaded, because the draft is filled from what this invoice billed.
     ⚠️ Fires once — a later reload of the same document must not pop it open again. */
  if(pendingCredit){
    pendingCredit = false;
    if(!isCredit && h.status === "confirmed") openCreateCredit(h);
  }
}

/* ── Edits ─────────────────────────────────────────── */
async function reload(){
  const y = window.scrollY;
  await loadDetail(curId);
  window.scrollTo(0, y);
}

async function saveLine(inp){
  const prev = inp.dataset.prev, val = Number(inp.value);
  if(!isFinite(val) || inp.value.trim() === ""){ inp.value = prev; return; }
  if(String(val) === String(Number(prev))) return;
  inp.disabled = true;
  const patch = {}; patch[inp.dataset.f] = val;
  const { error } = await sb.rpc("po_invoice_line_update", { p_line_id: inp.dataset.line, p_patch: patch });
  inp.disabled = false;
  if(error){ inp.value = prev; alert(error.message); return; }
  inp.dataset.prev = String(val);
  reload();
}

async function togglePayable(cb){
  cb.disabled = true;
  const { error } = await sb.rpc("po_invoice_line_update",
    { p_line_id: cb.dataset.pay, p_patch: { is_payable: cb.checked } });
  cb.disabled = false;
  if(error){ cb.checked = !cb.checked; alert(error.message); return; }
  reload();
}

async function removeLine(id){
  if(!confirm("Remove this line?")) return;
  const { error } = await sb.rpc("po_invoice_line_delete", { p_line_id: id });
  if(error){ alert(error.message); return; }
  reload();
}

async function saveDiscount(inp){
  const prev = inp.dataset.prev;
  const raw = inp.dataset.f === "percent" ? Number(inp.value) : inp.value.trim();
  if(inp.dataset.f === "percent" && (!isFinite(raw) || inp.value.trim() === "")){ inp.value = prev; return; }
  if(String(raw) === String(inp.dataset.f === "percent" ? Number(prev) : prev)) return;
  inp.disabled = true;
  const patch = {}; patch[inp.dataset.f] = raw;
  const { error } = await sb.rpc("po_discount_save",
    { p_target: "invoice", p_target_id: curId, p_patch: patch, p_id: inp.dataset.disc });
  inp.disabled = false;
  if(error){ inp.value = prev; alert(error.message); return; }
  inp.dataset.prev = String(raw);
  reload();
}

async function removeDiscount(id){
  if(!confirm("Remove this discount row?")) return;
  const { error } = await sb.rpc("po_discount_delete", { p_target: "invoice", p_id: id });
  if(error){ alert(error.message); return; }
  reload();
}

/* inv tx v1 — tax rule pickers (po-tax-1). The list is the active purchase rules, read once at start.
   A current value missing from the list (inactive) is kept as "(current · inactive)" so an untouched field never saves a change. */
function taxLabel(name, rate){
  if(!name) return '<span class="dim">—</span>';
  return esc(name) + (rate === null || rate === undefined ? "" : ` <span class="dim">${esc(Number(rate))}%</span>`);
}
function taxOptions(curId, curName, blankLabel){
  const known = TAX_RULES.some(r => r.id === curId);
  return `<option value="">${esc(blankLabel)}</option>`
    + (curId && !known ? `<option value="${esc(curId)}" selected>${esc(curName || "?")} (current · inactive)</option>` : "")
    + TAX_RULES.map(r => `<option value="${r.id}" ${r.id === curId ? "selected" : ""}>${esc(r.name)} · ${esc(Number(r.rate_pct))}%</option>`).join("");
}
function headTax(id, name, rate, ed){
  if(!ed) return taxLabel(name, rate);
  return `<select class="tin" data-head="tax_rule_id" data-prev="${esc(id ?? "")}">${taxOptions(id, name, "— no tax rule —")}</select>`;
}
function lineTax(l, ed){
  if(!ed) return l.tax_rule ? esc(l.tax_rule) : `<span class="dim">${l.tax_rule_effective ? "document rule" : "—"}</span>`;
  return `<select class="tin" data-ltax="${l.id}" data-prev="${esc(l.tax_rule_id ?? "")}">${taxOptions(l.tax_rule_id, l.tax_rule, "document rule")}</select>`;
}
async function saveLineTax(sel){
  const prev = sel.dataset.prev, v = sel.value;
  if(v === prev) return;
  sel.disabled = true;
  const patch = v ? { tax_rule_id: v } : { tax_rule_id: "", tax_rule: "" };
  const { error } = await sb.rpc("po_invoice_line_update", { p_line_id: sel.dataset.ltax, p_patch: patch });
  sel.disabled = false;
  if(error){ sel.value = prev; alert(error.message); return; }
  sel.dataset.prev = v;
  reload();
}

/* ── inv disc v2 · ruling 400 — a credit line's reason ─────────────────────
   The system suggests one; the person confirms or changes it before confirming the credit.
   A line that is partly not-received and partly a price difference has to be split in two. */
const REASON_LABEL = { not_received: "Not received", price_difference: "Price difference" };
function reasonCell(l, ed){
  if(l.line_kind !== "goods") return '<span class="dim">—</span>';
  const sug = l.credit_reason_suggested;
  const span = l.credit_spans_both
    ? `<div class="off" style="font-size:11.5px">Only ${qty(l.credit_not_received_left)} EA are still not received — split this line: that many as Not received, the rest as Price difference</div>` : "";
  if(!ed) return (l.credit_reason ? `<span class="tag">${esc(REASON_LABEL[l.credit_reason] || l.credit_reason)}</span>` : '<span class="dim">—</span>') + span;
  const opts = (l.credit_reason ? "" : '<option value="" selected>— choose —</option>')
    + Object.keys(REASON_LABEL).map(k => `<option value="${k}"${l.credit_reason === k ? " selected" : ""}>${REASON_LABEL[k]}</option>`).join("");
  const hint = sug && sug !== l.credit_reason ? `<div class="dim" style="font-size:11px">suggested: ${esc(REASON_LABEL[sug] || sug)}</div>` : "";
  return `<select class="tin" data-creason="${l.id}" data-prev="${esc(l.credit_reason || "")}">${opts}</select>${hint}${span}`;
}
async function saveCreditReason(sel){
  const prev = sel.dataset.prev, v = sel.value;
  if(v === prev || !v) { sel.value = prev; return; }
  sel.disabled = true;
  const { error } = await sb.rpc("po_invoice_line_update", { p_line_id: sel.dataset.creason, p_patch: { credit_reason: v } });
  sel.disabled = false;
  if(error){ sel.value = prev; alert(error.message); return; }
  sel.dataset.prev = v;
  reload();
}
const CRED_WARN = {
  number_is_provisional:        "the number is provisional until Create",
  total_amount_missing:         "no printed total yet — fill it in when the supplier's credit note arrives",
  credit_po_ambiguous:          "the invoice covers more than one PO — the number is by year, not by PO",
  credit_number_manual:         "the number was typed in",
  due_date_on_credit:           "a credit note has no due date",
  tax_rule_differs_between_pos: "the PO's tax rule differs from the invoice's",
  no_qty_difference:            "everything billed arrived — add the lines the supplier credited",
  credit_for_invoice_has_payments: "the invoice is already paid — this credit becomes money the supplier owes us",
  credit_for_cancelled:         "the invoice it answers is cancelled",
  currency_defaulted:           "currency taken from the supplier",
  currency_mismatch:            "currency differs from the invoice it answers"
};
const INV_DWARN = {
  credit_reason_missing:  "Some goods lines have no reason yet — choose Not received or Price difference before confirming.",
  credit_line_spans_both: "A line is partly not received and partly a price difference — split it before confirming."
};

/* ── inv disc v2 · rulings 389 · 391 — early-payment terms on an invoice ─────────
   They are what the payment screen offers as the discount when paying by the date.
   Suggested from the payment term when the invoice was made — the term's name can be wrong
   (P&G "2%19 Net30" is really 2.1% within 13 days), so check it against the invoice.
   The four fields are saved together: the database refuses a percent without a basis, or both
   a percent and an amount. Once a payment has taken the discount the terms are locked. */
function earlyText(e){
  if(!e || !e.has_terms) return '<span class="dim">none</span>';
  const what = e.pct !== null && e.pct !== undefined ? `${esc(Number(e.pct))}%` : money(e.amount);
  const base = e.basis === "with_tax" ? "incl. tax" : "before tax";
  const until = e.until_date ? `pay by ${esc(e.until_date)}` : "no deadline";
  const st = e.is_valid
    ? `<span class="on">open${e.days_left !== null && e.days_left !== undefined ? ` · ${esc(e.days_left)} day${Number(e.days_left) === 1 ? "" : "s"} left` : ""}</span>`
    : '<span class="off">expired</span>';
  return `${what} ${base} · ${until} · <span class="mono">${money(e.discount)}</span> ${st}`;
}
function openEarly(h, e){
  const has = e && e.has_terms;
  const kind = !has ? "none" : (e.pct !== null && e.pct !== undefined ? "pct" : "amt");
  modalOpen(`
    <h4>Early-pay discount — ${esc(h.invoice_number)}</h4>
    <div class="pbody">
      <div class="frow"><label>Discount</label>
        <select id="eKind">
          <option value="none"${kind === "none" ? " selected" : ""}>none</option>
          <option value="pct"${kind === "pct" ? " selected" : ""}>percent</option>
          <option value="amt"${kind === "amt" ? " selected" : ""}>fixed amount</option>
        </select></div>
      <div class="frow"><label>Value</label><input id="eVal" type="number" step="any" min="0"
        value="${has ? esc(kind === "pct" ? e.pct : e.amount) : ""}" placeholder="2.1"></div>
      <div class="frow"><label>Worked out on</label>
        <select id="eBasis">
          <option value="pre_tax"${!has || e.basis === "pre_tax" ? " selected" : ""}>the amount before tax</option>
          <option value="with_tax"${has && e.basis === "with_tax" ? " selected" : ""}>the amount including tax</option>
        </select></div>
      <div class="frow"><label>Pay by</label><input id="eUntil" type="date" value="${has && e.until_date ? esc(e.until_date) : ""}"></div>
      <div class="dim" style="font-size:12.5px">
        This is what the payment screen offers as the discount when paying by the date.
        It was suggested from the payment term — check it against the invoice; the term name can be wrong.
        Leave Pay by empty when there is no deadline. Due date is separate: it is when the full amount is owed.
      </div>
      <div id="eMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="eGo">Save</button>
    </div>`);
  document.getElementById("eGo").onclick = async () => {
    const k = document.getElementById("eKind").value;
    const raw = document.getElementById("eVal").value.trim();
    const v = Number(raw);
    let patch;
    if(k === "none"){
      patch = { early_discount_pct: null, early_discount_amount: null, early_discount_basis: null, early_discount_until: null };
    } else {
      if(raw === "" || !isFinite(v) || v <= 0){ say("eMsg", "err", "Enter a value above 0 — nothing was saved."); return; }
      if(k === "pct" && v >= 100){ say("eMsg", "err", "A percent must be below 100 — nothing was saved."); return; }
      patch = { early_discount_pct: k === "pct" ? v : null, early_discount_amount: k === "amt" ? v : null,
                early_discount_basis: document.getElementById("eBasis").value,
                early_discount_until: document.getElementById("eUntil").value || null };
    }
    say("eMsg", "", "Saving…");
    const res = await imsSaved(sb.from("po_invoice").update(patch).eq("id", h.id).select("id"));
    if(!res.ok){ say("eMsg", "err", res.reason); return; }
    modalClose(); reload();
  };
}

/* ⚠️ The printed total is a cross-check, not a calculated field.
   Type in what the supplier printed; if it disagrees with ours, Diff says so. */
async function saveHead(id, inp){
  const prev = inp.dataset.prev;
  const field = inp.dataset.head;
  // ⚠️ Supplier ref is a reference, not a ledger figure — it arrives late and is editable
  //    even after confirming. It never touches lines, discounts or the amount owed.
  const val = field === "total_amount" ? Number(inp.value) : (inp.value.trim() || null);
  if(field === "total_amount" && (!isFinite(val) || inp.value.trim() === "")){ inp.value = prev; return; }
  say("headMsg", "", "Saving…");
  // inv tx v1 — 세금 규칙: id 를 쓰면 짝 트리거가 이름을 채운다 · 비울 때는 둘 다 null(짝 CHECK)
  const patch = field === "tax_rule_id" ? (val ? { tax_rule_id: val } : { tax_rule_id: null, tax_rule: null }) : { [field]: val };
  const res = await imsSaved(sb.from("po_invoice").update(patch).eq("id", id).select("id"));
  if(!res.ok){ inp.value = prev; say("headMsg", "err", res.reason); return; }
  inp.dataset.prev = String(inp.value);
  say("headMsg", "on", "Saved");
  reload();
}

/* ⭐⭐ ⑱-3 · rulings 88 · 92 · 96 — confirming an invoice is also what lets the warehouse start.
   Each order on the invoice keeps its number for what was BILLED; anything not billed moves to a
   sibling with the next letter (PO-02030 → PO-02030a) and waits for its own invoice. The warehouse
   receives only orders with a confirmed invoice. An invoice that bills more than the order line holds
   is refused — the office raises the PO line first (Purchase Orders), then confirms (ruling 96).
   Reopen puts the split-off quantities back — only while the warehouse has not started on them.
   ⚠️ The refusals arrive as sentences written for a person; they are shown whole. */
const INV_WARN = {
  po_split:                 "The order was split — see above.",
  po_reattached:            "The split-off quantities went back onto the order — see above.",
  total_amount_zero:        "The document total is 0.",
  total_differs_from_lines: "The document total differs from the sum of its lines.",
  has_attached_credits:     "Credit notes are attached to this invoice.",
  credit_fx_mixed:          "The goods were costed at more than one exchange rate — the cost change uses their quantity-weighted rate.",
  credit_fx_unpinned:       "The goods are not received yet — the cost change uses this document's exchange rate.",
  price_credit_qty_above_received: "A price difference covers more than has been received so far."
};
async function confirmInv(id, on){
  const msg = on
    ? "Confirm this document?\n\nIt is then taken into the books: the amount owed appears and the discount reaches cost. Lines can no longer be edited.\n\n"
      + "It also releases the order to the warehouse: each purchase order keeps its number for what this invoice bills, and anything not billed moves to a new sibling order (next letter) that waits for its own invoice."
    : "Reopen this document for editing?\n\nQuantities that confirming split off go back onto their original order — this is refused once the warehouse has started on it.";
  if(!confirm(msg)) return;
  const { data, error } = await sb.rpc("po_invoice_confirm", { p_invoice_id: id, p_confirm: on });
  if(error){ alert(error.message); return; }
  const out = [];
  ((data && data.split) || []).forEach(sp => {
    out.push(`${sp.po_number} keeps what this invoice bills. Not billed → ${sp.new_number}:`);
    (sp.lines || []).forEach(l => out.push(`   line ${l.line_no}${l.sku ? " " + l.sku : ""} — ${Number(l.qty_ea)} EA ${l.kind === "moved" ? "(whole line moved)" : "moved"}`));
  });
  ((data && data.reattached) || []).forEach(ra => {
    out.push(`${ra.removed_number} went back onto ${ra.po_number}:`);
    (ra.lines || []).forEach(l => out.push(`   line ${l.line_no} — ${Number(l.qty_ea)} EA ${l.kind === "moved_back" ? "(whole line back)" : "back"}`));
  });
  const warns = ((data && data.warnings) || []).filter(w => w !== "po_split" && w !== "po_reattached");
  if(warns.length) out.push("", ...warns.map(w => "⚠ " + (INV_WARN[w] || w)));
  /* inv disc v2 · ruling 400 — what confirming a credit did to stock cost */
  const cev = (data && data.cost_events) || [];
  if(on && cev.length){
    const sum = cev.reduce((a, e) => a + Number(e.amount_cad || 0), 0);
    const pend = cev.filter(e => e.status === "pending").length;
    out.push(`Stock cost changed on ${cev.length} line${cev.length === 1 ? "" : "s"}: ${money(sum)} CAD` + (pend ? ` (${pend} pending until the goods are received)` : "") + ".");
  }
  if(!on && ((data && data.cost_reversed) || []).length) out.push("The cost changes from this credit were reversed.");
  if(on && data && !(data.split || []).length && data.doc_kind !== "credit") out.push("The whole order is billed — nothing was split off. The warehouse can receive it now.");
  if(out.length) alert(out.join("\n"));
  reload();
}

/* ── Cancelling, restoring, deleting ───────────────────
   ⭐⭐ Whether a document may go depends on rows other than its own — payments applied,
       credit notes hanging off it — so both of these are RPCs (po_doc_cancel · po_doc_delete).
   ⭐⭐ What decides delete is confirmed_at, not the status. A document that was confirmed
       even once is never deleted; it stays as cancelled.
   ⭐ A credit note is never deleted, whatever its state. Its number is read back off the row
       to number the next one, so deleting one would hand the same number to another document.
   ⚠️ A refusal arrives as an exception whose message is already written for a person to read. */
function docErr(error){
  alert((error && error.message) || "Something went wrong — nothing was saved.");
}

async function cancelDoc(h){
  const noun = h.doc_kind === "credit" ? "credit note" : "invoice";
  if(!confirm(`Cancel ${noun} ${h.invoice_number}?\n\nIt stays on the list with a cancelled tag and drops out of the money. You can restore it later.`)) return;
  const { data, error } = await sb.rpc("po_doc_cancel", { p_target:"invoice", p_id:h.id });
  if(error){ docErr(error); return; }
  /* ⭐ Cancelling a credit note gives the money back to the invoice it was answering.
     Show that movement — otherwise a balance changes somewhere else with nothing said. */
  const cf = data && data.credit_for;
  if(cf) alert(`${h.invoice_number} is cancelled.\n\n${cf.invoice_number}: balance ${cf.unpaid_before} → ${cf.unpaid_after}`);
  else if(data && (data.warnings || []).length) alert("⚠ " + data.warnings.join("\n⚠ "));
  reload();
}

async function restoreDoc(h){
  if(!confirm(`Restore ${h.invoice_number}?\n\nIt goes back to the state it was in before it was cancelled.`)) return;
  const { error } = await sb.rpc("po_doc_cancel", { p_target:"invoice", p_id:h.id, p_cancel:false });
  if(error){ docErr(error); return; }
  reload();
}

async function deleteDoc(h){
  if(!confirm(`Delete invoice ${h.invoice_number}?\n\nThe document and its lines disappear for good. The number becomes free for this supplier again.`)) return;
  const { data, error } = await sb.rpc("po_doc_delete", { p_target:"invoice", p_id:h.id });
  if(error){ docErr(error); return; }
  const n = (data && data.lines_deleted) || 0;
  alert(`${h.invoice_number} is deleted.` + (n ? `\n${n} line(s) went with it.` : ""));
  showWide();                                   // the document the detail was pointing at is gone
}

/* ⭐ One document can cover several purchase orders, so lines are pulled in PO by PO.
   Only what has not been billed yet comes across — a second invoice on the same PO
   picks up the remainder instead of billing it twice. */
async function openAddPo(invId, supplierId){
  modalOpen(`
    <h4>Add lines from a purchase order</h4>
    <div class="pbody">
      <input type="search" id="poQ" placeholder="Search PO number" autocomplete="off">
      <div class="pick" id="poList" style="max-height:340px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px">
        <div class="msg">Loading…</div>
      </div>
      <div id="poMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
    </div>`);
  const draw = async () => {
    const t = document.getElementById("poQ").value.trim();
    let qy = sb.from("po_list").select("id,po_number,status,order_date,net_total,line_count")
               .eq("supplier_id", supplierId).in("status", ["draft","confirmed","closed"]);
    if(t) qy = qy.ilike("po_number", `%${t}%`);
    const { data, error } = await qy.order("po_number", { ascending:false }).limit(40);
    const box = document.getElementById("poList");
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(r => `
      <div class="prow" data-po="${r.id}" style="padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px">
        <span class="mono">${esc(r.po_number)}</span>
        <span class="tag" style="margin-left:6px">${esc(r.status)}</span>
        <span class="dim" style="margin-left:8px">${dim(r.order_date)} · ${esc(r.line_count)} lines · ${money(r.net_total)}</span>
      </div>`).join("") : '<div class="msg">No purchase orders for this supplier.</div>';
    // ⚠️ Look before adding. Fifty lines pulled in by mistake are fifty deletions to undo.
    box.querySelectorAll("[data-po]").forEach(el => {
      el.onclick = () => previewPoLines(invId, el.dataset.po, el.textContent.trim().split(" ")[0]);
    });
  };
  imsQ("#poQ", draw);
  draw();
}

/* ⭐ Pulling lines in from another purchase order — two steps, like creating a document.
   Only what has not been billed yet comes across, so a second invoice on the same PO
   picks up the remainder instead of billing it twice. */
async function previewPoLines(invId, poId, poNumber){
  say("poMsg", "", "Checking…");
  const { data, error } = await sb.rpc("po_invoice_add_po_lines",
    { p_invoice_id: invId, p_po_id: poId, p_commit: false });
  if(error){ say("poMsg", "err", error.message); return; }

  const rows = data.lines || [];
  const ok = rows.filter(r => r.verdict === "ok").length;
  say("poMsg", "", `${esc(poNumber)} — ${rows.length} lines · ${ok} would come across`
      + ((data.warnings || []).length ? " · " + data.warnings.join(" · ") : ""));

  document.getElementById("poList").innerHTML = rows.length ? `
    <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th>
      <th class="num">Already billed</th><th class="num">To bill</th><th class="num">Price</th><th>Note</th></tr></thead>
    <tbody>${rows.map(l => `<tr>
      <td class="num">${esc(l.n)}</td>
      <td class="mono">${dim(l.sku)}</td>
      <td class="num">${qty(l.qty_ordered)}</td>
      <td class="num">${qty(l.invoiced_qty)}</td>
      <td class="num">${qty(l.qty_ea)}</td>
      <td class="num">${money(l.unit_price)}</td>
      <td class="dim" style="font-size:11.5px">${esc(l.message || l.verdict || "")}</td>
    </tr>`).join("")}</tbody></table>`
    : '<div class="msg">Nothing left to bill on that purchase order.</div>';

  const foot = document.querySelector("#modalBox .pfoot");
  if(foot && !document.getElementById("poGo")){
    const b = document.createElement("button");
    b.className = "pobtn go"; b.id = "poGo"; b.textContent = "Add these lines";
    foot.appendChild(b);
  }
  const go = document.getElementById("poGo");
  if(go){
    go.disabled = ok === 0;
    go.onclick = async () => {
      say("poMsg", "", "Adding…");
      const { data, error } = await sb.rpc("po_invoice_add_po_lines",
        { p_invoice_id: invId, p_po_id: poId, p_commit: true });
      if(error){ say("poMsg", "err", error.message); return; }
      modalClose();
      if(data && (data.warnings || []).length) alert("⚠ " + data.warnings.join("\n⚠ "));
      reload();
    };
  }
}

/* ⭐ Creating a credit note against this invoice.
   The draft is filled with the gap between what was billed and what arrived, line by line.
   ⚠️ Discount rows are NOT carried over — a credit carries whatever the supplier printed on it. */
function openCreateCredit(h){
  modalOpen(`
    <h4>Create a credit note against ${esc(h.invoice_number)}</h4>
    <div class="pbody">
      <div class="dim" style="font-size:12.5px;margin-bottom:12px">
        Lines start at the difference between what this invoice billed and what actually arrived.
        Adjust them afterwards if the supplier credited something else.
      </div>
      <!-- ⚠️ No number field. A credit note is usually raised by us first — we tell the supplier
           what was short, and only later do they send their own credit note (or simply knock the
           amount off). So the number is ours to give; theirs becomes a reference afterwards. -->
      <div class="frow"><label>Number</label>
        <span id="cNumShown" class="mono dim" style="flex:1">assigned when created</span></div>
      <div class="frow"><label>Credit date</label><input type="date" id="cDate"></div>
      <div class="frow"><label>Printed total</label><input id="cTotal" placeholder="leave blank if not known yet"></div>
      <div id="cOut" style="margin-top:12px"></div>
    </div>
    <div class="pfoot">
      <span id="cMsg" style="font-size:12.5px"></span><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn" id="cChk">Check</button>
      <button class="pobtn go" id="cGo" disabled>Create</button>
    </div>`);
  document.getElementById("cDate").value = torontoToday();
  document.getElementById("cChk").onclick = () => runCreateCredit(h, false);
  document.getElementById("cGo").onclick  = () => runCreateCredit(h, true);
}

async function runCreateCredit(h, commit){
  const totalRaw = document.getElementById("cTotal").value.trim();
  const args = {
    p_doc_kind: "credit",
    p_credit_for_invoice_id: h.id,
    p_invoice_date: document.getElementById("cDate").value || null,
    p_commit: commit,
  };
  if(totalRaw !== "" && isFinite(Number(totalRaw))) args.p_total_amount = Number(totalRaw);

  say("cMsg", "", commit ? "Creating…" : "Checking…");
  const { data, error } = await sb.rpc("po_invoice_create", args);
  if(error){ say("cMsg", "err", error.message); return; }

  const rows = data.lines || [];
  const ok = rows.filter(r => r.verdict === "ok").length;
  // ⚠️ The number shown before creating is provisional — another credit raised in between
  //    would take it, and the one that comes back from Create is the real one.
  const shown = document.getElementById("cNumShown");
  if(shown) shown.textContent = esc(data.invoice_number || "")
    + (commit ? "" : "  (provisional)");
  /* inv disc v2b — the create window spoke in codes (number_is_provisional · total_amount_missing) */
  say("cMsg", "", `${rows.length} lines · ${ok} with a difference`
      + ((data.warnings || []).length ? " · " + data.warnings.map(w => CRED_WARN[w] || w).join(" · ") : ""));

  document.getElementById("cOut").innerHTML = rows.length ? `
    <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Billed</th>
      <th class="num">Received</th><th class="num">To credit</th><th class="num">Price</th><th>Note</th></tr></thead>
    <tbody>${rows.map(l => `<tr>
      <td class="num">${esc(l.n)}</td>
      <td class="mono">${dim(l.sku)}</td>
      <td class="num">${qty(l.invoice_qty !== undefined ? l.invoice_qty : l.qty_ordered)}</td>
      <td class="num">${qty(l.received_qty)}</td>
      <td class="num">${qty(l.qty_ea)}</td>
      <td class="num">${money(l.unit_price)}</td>
      <td class="dim" style="font-size:11.5px">${esc(l.message || l.verdict || "")}</td>
    </tr>`).join("")}</tbody></table>`
    : `<div class="msg">Everything billed on this invoice arrived. A credit note can still be created —
         it will start empty and you can put on it whatever the supplier credited.</div>`;

  // ⚠️ An empty credit is allowed on purpose: a supplier sometimes credits a price, not a quantity.
  document.getElementById("cGo").disabled = false;
  if(commit && data.id){ modalClose(); openInv(data.id); }
}

/* ── Start ─────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  imsHeader(me);
  document.getElementById("buildTag").textContent = INV_BUILD;
  const tr = await sb.from("ref_tax_rule").select("id,name,rate_pct").eq("direction", "purchase").eq("is_active", true).order("name");
  TAX_RULES = tr.data || [];

  const sup = await sb.from("supplier").select("id,name").eq("is_active", true).order("name");
  if(sup.data) document.getElementById("wsup").innerHTML =
    '<option value="">All suppliers</option>' +
    sup.data.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");

  const refilter = () => { pgW.reset(); loadWide(); };
  document.getElementById("wsup").onchange  = e => { supFilter = e.target.value; refilter(); };
  document.getElementById("wkind").onchange = e => { kindF     = e.target.value; refilter(); };
  document.getElementById("wst").onchange   = e => { stFilter  = e.target.value; refilter(); };
  document.getElementById("wunp").onchange  = e => { balF      = e.target.value; refilter(); };
  document.getElementById("wfrom").onchange = e => { dateFrom  = e.target.value; refilter(); };
  document.getElementById("wto").onchange   = e => { dateTo    = e.target.value; refilter(); };
  imsQ("#wq", v => { q = v; refilter(); });
  document.getElementById("wclear").onclick = () => {
    q = ""; supFilter = ""; dateFrom = ""; dateTo = ""; kindF = "all"; stFilter = "open"; balF = "all";
    ["wq","wsup","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wkind").value = "all";
    document.getElementById("wst").value = "open";
    document.getElementById("wunp").value = "all";
    refilter();
  };

  // ⭐ ?id=… opens one document straight away — po.html links here that way after creating one
  const want = imsParam("id");
  if(want){
    // ⭐ ?credit=1 comes from a purchase order's "+ credit" link — open the document and
    //    raise the credit-note draft against it in one move.
    pendingCredit = imsParam("credit") === "1";
    openInv(want); return;
  }
  showWide();
});
</script>
</body>
</html>
