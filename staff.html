<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px)}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .list .row.cur{color:#3b5bdb;font-weight:600}
  .list .row.off{color:#9aa4b2}
  .list .row .sub{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
  .list .foot button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tag.adm{color:#3b5bdb;border-color:#c9d6f5}
  .chip.adm{border-color:#c9d6f5;color:#3b5bdb}

  /* 편집 폼 — 쓰기 화면은 이것뿐이다 */
  .kv td:first-child{width:170px;padding-top:11px}
  .kv input[type=text],.kv input[type=email],.kv select,.kv textarea{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
  .kv textarea{min-height:64px;resize:vertical}
  .kv input:disabled,.kv select:disabled{background:#f7f8fa;color:#9aa4b2}
  .kv label.ck{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}   /* ⚠️ 공통 .note 와 이름이 겹쳐 .hint 로 */
  /* ⚠️ .kv label.ck is display:flex, so each one takes a whole line. Inside the access box the
     choices belong side by side — none / read / write reads as one question that way. */
  #permBox label.ck{display:inline-flex}
  #permBox table td{padding:4px 0;border:0;vertical-align:top}
  .actions{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
  .actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .actions button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions button:disabled{opacity:.5;cursor:default}
  .actions .st{font-size:12.5px;font-weight:600;min-height:16px}
  .actions .st.ok{color:#16a34a} .actions .st.bad{color:#dc2626}

  /* 임시 비밀번호 — 한 번만 보인다 */
  .cred{margin:0 14px 14px;border:1px solid #cfe9d7;background:#f3fbf6;border-radius:10px;padding:12px 14px}
  .cred .t{font-weight:700;margin-bottom:6px}
  .cred .pw{font-family:var(--mono);font-size:18px;font-weight:800;letter-spacing:.04em;margin:6px 0}
  .cred .warn{font-size:12px;color:var(--warn)}
  .cred button{margin-top:8px;margin-right:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search name or email">
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="addBtn" class="pri" hidden>+ Add staff</button>
    </div>
  </section>

  <main id="detail" class="stack"><div class="card"><div class="msg">Select a staff member.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Staff — ims_staff 목록 · 상세/편집 · 추가(ims-staff-create EF)
   정본: docs/design/po-module.md §10-h(표·RLS) · §10-i(이 화면 · EF) · §10-j(화면 규칙)
   원본: asung-wms/staff-admin.html (WMS · 2026-07-21) — 틀은 suppliers.html 을 따른다
   📌 2026-09-15 · 공통 파일(ims-ui.css · ims-ui.js)로 옮겼다 — esc·dim 은 ims-ui.js 것 · 저장 확인은 imsSaved() · 시각은 imsTs(토론토)

   ⭐ 첫 쓰기 화면이다. 쓰기는 둘뿐:
      편집  PostgREST update — RLS(ims_is_admin) 가 막는다
      추가  EF ims-staff-create — Auth 계정 + 행을 한 번에. ⚠️ service_role 은 EF 안에만 있다(공개 레포)
   ⚠️ admin 이 아니면 편집·추가 UI 를 감춘다(읽기 전용). 감추는 것이고 막는 것은 RLS·EF 다.
   ⚠️ 자기 행에서는 role·is_active 를 못 바꾼다 — 스스로 잠긴다(ims_is_admin() 은 is_active 도 본다).
   ⭐ RLS 에 막힌 update 는 에러가 아니라 0행이다(§10-h 실측) — imsSaved() 가 .select() 결과를 보고 0행이면 「Not saved」.
   ❌ 삭제 없음 — is_active=false 로 내린다(delete 는 revoke 돼 있다).
   페이지네이션 없음 — caps-ok: 직원 마스터 · 수십 명 · 채용 때만 늘어난다(WMS 도 같다). 검색도 그래서 클라이언트에서 한다.
   ⚠️ 입력칸의 값은 value="…" 속성이 아니라 DOM 으로 넣는다 — 공통 esc 는 " 를 안 바꾼다(속성 안에서 깨진다).
   ⚠️ 순서(§10-j 3-d): 목록은 all 배열을 그대로 그리는 동기 함수라 상세와 어긋날 비동기가 없다.
   ───────────────────────────────────────────────────────────── */

const ST_BUILD = "2026-10-05 · st v3";   // 대화 Claude — Access: WMS · IMS 체크가 그 방의 화면만 보이게 거르고, 숨긴 방의 화면은 저장 때 none(빠지는 수를 미리 노란 글로 · Caleb 「wms만 선택하면, wms에 해당되는것만 보이고」) ← st v2 대화 Claude — Location(창고 접근 · ims_staff.warehouse_access) 를 직원 화면에서 고른다(Caleb 「staff권한에 location을 넣어줄 수 있나?」) · 판정 함수 ims_can_warehouse 그대로: admin · supervisor = 모든 창고 · manager · worker = 고른 창고 · 하나도 안 고르면 모든 창고
console.log("staff.html build:", ST_BUILD);
let sb=null, me=null, isAdmin=false, canEditStaff=false, WHS=[];
let all=[], q="", curId=null, mode="view";   // mode: view | add

const setVal = (id, v) => { const el=document.getElementById(id); if(el) el.value = (v==null ? "" : v); };

/* ── 읽기 ─────────────────────────────────────────────── */
async function loadAll(){
  const { data, error } = await sb.from("ims_staff").select("*").order("name");   // caps-ok: 직원 마스터 — 수십 명
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return false; }
  all = data || [];
  return true;
}

/* ── 목록 (동기 · all 을 그린다) ───────────────────────── */
function renderList(){
  const needle = q.toLowerCase();
  const list = all.filter(s => !needle || (s.name||"").toLowerCase().includes(needle) || (s.email||"").toLowerCase().includes(needle));

  document.getElementById("rows").innerHTML = list.length ? list.map(s => {
    const tags = [];
    if(s.role==="admin") tags.push('<span class="tag adm">admin</span>');
    if(!s.is_active) tags.push('<span class="tag off">inactive</span>');
    if((s.role === "manager" || s.role === "worker") && Array.isArray(s.warehouse_access) && s.warehouse_access.length)
      tags.push(`<span class="tag">${esc(s.warehouse_access.map(id => (WHS.find(w => w.id === id) || {}).name || "?").join(" · "))}</span>`);
    return `<div class="row ${s.id===curId&&mode==="view"?"cur":""} ${s.is_active?"":"off"}" data-id="${s.id}">
      <span>${esc(s.name)}<span class="sub">${esc(s.email)}</span></span>
      <span style="display:flex;gap:4px">${tags.join("")}</span>
    </div>`;
  }).join("") : '<div class="msg">No staff match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; mode="view"; renderList(); renderDetail(); };
  });

  const act = all.filter(s=>s.is_active).length;
  document.getElementById("range").textContent = `${list.length} / ${all.length} · ${act} active`;
}

/* ── 상세 / 편집 ─────────────────────────────────────── */
function renderDetail(){
  const box = document.getElementById("detail");
  if(mode==="add"){ renderAdd(box); return; }
  const s = all.find(x => x.id===curId);
  if(!s){ curId=null; box.innerHTML = '<div class="card"><div class="msg">Select a staff member.</div></div>'; return; }

  const isSelf = (s.id === me.id);
  const chips = [
    `<span class="chip ${s.role==="admin"?"adm":""}">${esc(s.role)}</span>`,
    `<span class="chip ${s.is_active?"good":"bad"}">${s.is_active?"active":"inactive"}</span>`,
    ...(isSelf ? ['<span class="chip">you</span>'] : []),
  ];

  // email · auth_user_id 는 보여만 준다 — 로그인의 열쇠다
  const keyRows = `
    <tr><td>Email</td><td><span class="mono">${esc(s.email)}</span><div class="hint">Login email — shown only. It is not the key (auth_user_id is).</div></td></tr>
    <tr><td>Auth user id</td><td><span class="mono">${esc(s.auth_user_id)}</span></td></tr>`;

  /* ⚠️ Below your own rank only — and your own row is not below you, so nobody edits
     themselves except an admin. Drawing a form that cannot save would be worse than not
     drawing it: the save silently affects no rows. */
  const canEditThis = isAdmin || (canEditStaff && !isSelf && RANKS.indexOf(s.role) < RANKS.indexOf(me.role));

  let body;
  if(canEditThis){
    // ⚠️ 자기 행: role·is_active 잠금 — 스스로 잠기는 것을 막는다
    const lock = isSelf ? 'disabled' : '';
    body = `
      <table class="kv"><tbody>
        <tr><td>Name</td><td><input type="text" id="fName"></td></tr>
        ${keyRows}
        <tr><td>Role</td><td>
          <select id="fRole" ${lock}></select>
          <div class="hint" data-rolehint></div>
          ${isSelf?'<div class="hint">You can\'t change your own role or status — you would lock yourself out (and if you are the last admin, nobody could undo it).</div>':''}
        </td></tr>
        <tr><td>Active</td><td><label class="ck"><input type="checkbox" id="fActive" ${lock}> is_active</label>
          ${!isSelf?'<div class="hint">There is no delete — inactive people keep their row (history points at it).</div>':''}</td></tr>
        <tr><td>Note</td><td><textarea id="fNote"></textarea></td></tr>
        <tr><td>Access</td><td><div id="permBox"><span class="dim">Loading…</span></div></td></tr>
        <tr><td>Location</td><td><div id="locBox"></div></td></tr>
        <tr><td>Created</td><td class="mono">${imsTs(s.created_at)}</td></tr>
        <tr><td>Updated</td><td class="mono">${imsTs(s.updated_at)}</td></tr>
      </tbody></table>
      <div class="actions">
        <button class="pri" id="saveBtn">Save</button>
        <button id="revertBtn">Revert</button>
        <span class="st" id="saveSt"></span>
      </div>`;
  } else {
    body = `
      <table class="kv"><tbody>
        <tr><td>Name</td><td>${esc(s.name)}</td></tr>
        ${keyRows}
        <tr><td>Role</td><td>${esc(s.role)}</td></tr>
        <tr><td>Active</td><td>${s.is_active?"yes":"no"}</td></tr>
        <tr><td>Note</td><td>${dim(s.note)}</td></tr>
        <tr><td>Access</td><td><span class="mono">${esc(JSON.stringify(s.perms||[]))}</span></td></tr>
        <tr><td>Location</td><td>${esc(locText(s))}</td></tr>
        <tr><td>Created</td><td class="mono">${imsTs(s.created_at)}</td></tr>
      </tbody></table>
      <div class="actions"><span class="st">${
        !canEditStaff ? "Read only — you need the 'staff' permission to change people."
        : isSelf       ? "Read only — you cannot edit your own record. Ask someone above you."
                       : "Read only — this person is at or above your own rank."
      }</span></div>`;
  }

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="nm">${esc(s.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      ${body}
    </div>`;

  if(canEditThis){
    // 값은 DOM 으로 — 이름에 " 가 있어도 속성이 깨지지 않는다
    fillRoles("fRole", s.role);
    fillRoleHints(s.role);
    setVal("fName", s.name); setVal("fNote", s.note);
    document.getElementById("fActive").checked = !!s.is_active;
    document.getElementById("saveBtn").onclick = () => save(s);
    document.getElementById("revertBtn").onclick = () => renderDetail();
    drawPerms(s);
    drawLoc(s);
  }
}

/* ── Location — 창고 접근(ims_staff.warehouse_access · uuid[]) ──────────────
   ⭐ 판정은 DB 한 곳(ims_can_warehouse · 2026-09-17): admin · supervisor 는 늘 모든 창고 · manager · worker 는 고른 창고만 ·
      하나도 안 고르면 「모든 창고」(빈 배열 = 전부). 화면은 그 규칙을 그대로 글로 보인다 — 다르게 계산하지 않는다.
   ⚠️ 자기 행은 못 바꾼다(role · perms 와 같은 까닭 — 스스로를 잠글 수 있다). */
function locText(s){
  if(s.role === "admin" || s.role === "supervisor") return "Every warehouse (" + s.role + ")";
  const ids = Array.isArray(s.warehouse_access) ? s.warehouse_access : [];
  if(!ids.length) return "Every warehouse (none chosen)";
  return ids.map(id => (WHS.find(w => w.id === id) || {}).name || id).join(", ");
}
function drawLoc(s){
  const box = document.getElementById("locBox"); if(!box) return;
  const have = Array.isArray(s.warehouse_access) ? s.warehouse_access : [];
  const dis = (s.id === me.id) ? " disabled" : "";
  box.innerHTML = WHS.map(w => `<label class="ck" style="margin-right:14px"><input type="checkbox" data-wh="${esc(w.id)}"${have.includes(w.id) ? " checked" : ""}${dis}> ${esc(w.name)}</label>`).join("")
    + `<div class="hint" id="locHint"></div>`;
  const hint = () => {
    if(!document.getElementById("locHint")) return;   // 다시 그려진 뒤의 옛 칸
    const role = (document.getElementById("fRole") || {}).value || s.role;
    const n = box.querySelectorAll("input[data-wh]:checked").length;
    document.getElementById("locHint").textContent =
      (role === "admin" || role === "supervisor") ? `A ${role} works in every warehouse — the boxes above apply only if the role is manager or worker.`
      : n ? "Only the ticked warehouses: their orders, picks, receiving, transfers and bin moves." : "None ticked = every warehouse.";
    if(s.id === me.id) document.getElementById("locHint").textContent += " You cannot change your own location.";
  };
  box.querySelectorAll("input[data-wh]").forEach(c => { c.onchange = hint; });
  const rs = document.getElementById("fRole"); if(rs) rs.addEventListener("change", hint);
  hint();
}
function readLoc(){ return [...document.querySelectorAll("#locBox input[data-wh]:checked")].map(c => c.dataset.wh); }

/* ── Ranks ────────────────────────────────────────────────
   ⭐ Lowest to highest. The order is what decides who can create whom — the CHECK on the
      column lists the same four values but in no particular order, so do not read rank from it.
   ⚠️ The real gate is in the database (ims_can_manage): you can only touch someone below your
      own rank, and that includes yourself. Leaving a higher rank out of the dropdown is a
      courtesy — picking it anyway would just fail to save. */
const RANKS = ["worker", "manager", "supervisor", "admin"];

/* ⚠️ admin is the exception — it reaches every rank including its own. */
function pickableRoles(){
  if(me.role === "admin") return RANKS.slice();
  const mine = RANKS.indexOf(me.role);
  return mine <= 0 ? [] : RANKS.slice(0, mine);
}

/* ⚠️ The wording is built from the same list as the dropdown, so a rank you cannot grant is
   not named to you either. Someone who never sees "admin" has no reason to go looking for it. */
const RANK_TEXT = {
  worker:     "warehouse floor",
  manager:    "office work, tied to a warehouse",
  supervisor: "the same across every warehouse",
  admin:      "everything, including other admins",
};

function fillRoleHints(extra){
  let list = pickableRoles();
  if(extra && !list.includes(extra)) list = list.concat([extra]);
  // ⚠️ One line per rank — four of them side by side ran off the edge of the card.
  const rows = list.map(r =>
    `<div><span class="mono">${esc(r)}</span> — ${esc(RANK_TEXT[r] || "")}</div>`).join("");
  document.querySelectorAll("[data-rolehint]").forEach(el => {
    el.innerHTML = rows + "<div>You can only create and edit people below your own rank.</div>";
  });
}

function fillRoles(selId, chosen){
  const el = document.getElementById(selId);
  if(!el) return;
  let list = pickableRoles();
  // ⚠️ Someone already holding a rank you cannot grant still has to render — otherwise the
  //    dropdown silently shows the wrong person's role.
  if(chosen && !list.includes(chosen)) list = list.concat([chosen]);
  el.innerHTML = list.map(r => `<option value="${r}">${r}</option>`).join("");
  if(chosen) el.value = chosen;
}

/* ── Access — what this person can reach ──────────────────
   ⭐ The list of rooms and screens is NOT written here. ims_perm_catalog() is the one place
      that knows it, so a new screen appears on this form without touching this file.
   ⭐ perms is a flat array of strings. A screen is absent (no access), 'purchasing:read'
      (can look, cannot change) or 'purchasing' (can change). Rooms are plain entries.
   ⚠️ What a role grants on its own is decided in the DB (ims_can_* ). This form only adds —
      a supervisor reaches everything with an empty list, and nothing here takes that away. */
let permCatalog = null;

async function loadPermCatalog(){
  if(permCatalog) return permCatalog;
  const { data, error } = await sb.rpc("ims_perm_catalog");
  if(error || !data) return null;
  permCatalog = data;
  return permCatalog;
}

async function drawPerms(s){
  const box = document.getElementById("permBox");
  if(!box) return;
  const cat = await loadPermCatalog();
  if(!cat){ box.innerHTML = '<span class="dim">Could not load the access list.</span>'; return; }
  const have = Array.isArray(s.perms) ? s.perms : [];
  const isSelf = (s.id === me.id);
  const dis = isSelf ? " disabled" : "";

  const modes = (cat.modes || []).map(m =>
    `<label class="ck" style="margin-right:14px">
       <input type="checkbox" data-mode="${esc(m)}"${have.includes(m) ? " checked" : ""}${dis}>
       ${esc(m.toUpperCase())}</label>`).join("");

  const screens = Object.entries(cat.screens || {}).map(([key, info]) => {
    // ⚠️ 'purchasing' and 'purchasing:read' are the same screen — one wins, so these are radios.
    const level = have.includes(key) ? "write" : (have.includes(key + ":read") ? "read" : "none");
    const opt = (v, label) =>
      `<label class="ck" style="margin-right:12px">
         <input type="radio" name="perm_${esc(key)}" value="${v}" data-screen="${esc(key)}"${level === v ? " checked" : ""}${dis}>
         ${label}</label>`;
    return `<tr data-room="${esc(info.room || "")}">
      <td style="white-space:nowrap;padding-right:12px">
        <span class="mono">${esc(key)}</span>
        <div class="hint" style="margin:0">${esc(info.label || "")}</div>
      </td>
      <td>${opt("none", "none")}${opt("read", "read")}${opt("write", "write")}</td>
    </tr>`;
  }).join("");

  box.innerHTML = `
    <div style="margin-bottom:8px">${modes}</div>
    <table style="font-size:12.5px"><tbody>${screens}</tbody></table>
    <div class="hint" id="roomWarn" style="color:#a86400;font-weight:600"></div>
    <div class="hint">Tick WMS, IMS or both to see that room's screens. With none ticked every screen shows.
      ${isSelf ? "You cannot change your own access." : ""}</div>`;
  /* st v3 — 방(WMS · IMS) 체크가 그 방의 화면만 보이게 거른다(Caleb 2026-10-05) · 방 = ims_perm_catalog 의 room(화면에 박지 않는다)
     ⭐ 숨긴 방의 화면은 저장할 때 none 으로 — 방을 뺀 사람이 그 방 화면을 여전히 갖는 일이 없게 · 저장 전에 몇 개가 빠지는지 노란 글로 보인다
     ⭐ 둘 다 안 체크 = 모든 화면이 보이고 아무것도 빼지 않는다(옛 모양) */
  const sync = () => {
    const on = [...box.querySelectorAll("input[data-mode]:checked")].map(c => c.dataset.mode);
    const show = r => !on.length || on.includes(r);
    let lose = { wms: 0, ims: 0 };
    box.querySelectorAll("tr[data-room]").forEach(tr => {
      const r = tr.dataset.room, vis = show(r);
      tr.hidden = !vis;
      const level = (tr.querySelector("input[data-screen]:checked") || {}).value;
      if(!vis && level && level !== "none") lose[r] = (lose[r] || 0) + 1;
    });
    const w = Object.entries(lose).filter(([, n]) => n).map(([r, n]) => `${n} ${r.toUpperCase()} screen${n === 1 ? "" : "s"}`);
    document.getElementById("roomWarn").textContent = w.length ? `Saving will remove ${w.join(" and ")} — their room is not ticked.` : "";
  };
  box.querySelectorAll("input[data-mode]").forEach(c => { c.onchange = sync; });
  box.querySelectorAll("input[data-screen]").forEach(c => { c.addEventListener("change", sync); });
  sync();
}

/* ⚠️ Returns the array to store. Absent = no access, so 'none' writes nothing. */
function readPerms(){
  const out = [];
  document.querySelectorAll("#permBox input[data-mode]").forEach(c => {
    if(c.checked) out.push(c.dataset.mode);
  });
  document.querySelectorAll("#permBox input[data-screen]").forEach(r => {
    if(!r.checked) return;
    const tr = r.closest("tr[data-room]"); if(tr && tr.hidden) return;   // st v3 — 숨긴 방의 화면은 none(노란 글로 미리 알렸다)
    if(r.value === "write") out.push(r.dataset.screen);
    if(r.value === "read")  out.push(r.dataset.screen + ":read");
  });
  return out;
}

async function save(s){
  const st = document.getElementById("saveSt"); st.className="st";
  const btn = document.getElementById("saveBtn");
  const isSelf = (s.id === me.id);
  const patch = {
    name: document.getElementById("fName").value.trim(),
    note: document.getElementById("fNote").value.trim() || null,
  };
  if(!isSelf){
    patch.role = document.getElementById("fRole").value;
    patch.is_active = document.getElementById("fActive").checked;
    /* ⚠️ Your own access is not editable either — the same reason as role: you could shut
       yourself out of the screen that undoes it. */
    patch.perms = readPerms();
    patch.warehouse_access = readLoc();   // st v2 — 빈 배열 = 모든 창고(ims_can_warehouse)
  }
  if(!patch.name){ st.className="st bad"; st.textContent="Name is required."; return; }

  btn.disabled=true; st.textContent="Saving…";
  // ⭐ imsSaved — .select() 로 되읽고 0행이면 ok:false (RLS 에 막히면 에러 없이 0행이다)
  const r = await imsSaved(sb.from("ims_staff").update(patch).eq("id", s.id).select());
  btn.disabled=false;
  if(!r.ok){
    st.className="st bad";
    st.textContent = r.reason + (r.reason.startsWith("Not saved") ? " Your admin access may have been revoked — sign out and in again." : "");
    return;
  }
  await loadAll(); renderList(); renderDetail();
  const st2 = document.getElementById("saveSt"); if(st2){ st2.className="st ok"; st2.textContent="Saved."; }
}

async function createStaff(){
  const st = document.getElementById("addSt"); st.className="st";
  const btn = document.getElementById("createBtn");
  const name  = document.getElementById("aName").value.trim();
  const email = document.getElementById("aEmail").value.trim().toLowerCase();
  const role  = document.getElementById("aRole").value;
  if(!name){ st.className="st bad"; st.textContent="Enter a name."; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ st.className="st bad"; st.textContent="Enter a valid email."; return; }

  btn.disabled=true; st.textContent="Creating…";
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ st.className="st bad"; st.textContent="Session expired — sign in again."; return; }
    // ⚠️ IMS_CONFIG 다(WMS_CONFIG 아님) · 세션 JWT 를 붙인다 — EF 가 rpc/ims_is_admin 으로 판정한다
    const resp = await fetch(IMS_CONFIG.SUPABASE_URL + "/functions/v1/ims-staff-create", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + session.access_token,
        "apikey": IMS_CONFIG.SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ name, email, role }),
    });
    const out = await resp.json().catch(() => ({}));
    if(!resp.ok || !out.ok){
      st.className="st bad";
      st.textContent = "Add failed: " + (out.error || ("HTTP "+resp.status)) + (out.orphan_auth_user_id ? " · orphan Auth user: "+out.orphan_auth_user_id : "");
      return;
    }
    // 목록에 바로 넣고, 임시 비밀번호는 한 번만 보여 준다
    await loadAll(); curId = out.staff ? out.staff.id : null; renderList();
    document.getElementById("credEmail").textContent = email;
    document.getElementById("credPw").textContent = out.temp_password;
    document.getElementById("credBox").hidden = false;
    ["aName","aEmail"].forEach(id => { const el=document.getElementById(id); if(el){ el.value=""; el.disabled=true; } });
    document.getElementById("aRole").disabled = true;
    btn.hidden = true;
    st.className="st ok"; st.textContent = name + " added.";
  }catch(e){ st.className="st bad"; st.textContent="Add failed: "+(e.message||e); }
  finally{ btn.disabled=false; }
}
