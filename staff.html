<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff · Asung IMS</title>
<style>
  :root{ --line:#e5e9ef; --muted:#6b7686; --ink:#12161c; --bg:#f7f8fa; --accent:#2f6df6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .brand{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px}
  header .sp{flex:1}
  header .who{font-size:13px;color:var(--muted)}
  header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  header button:hover{background:#f2f4f8}

  .wrap{display:flex;gap:16px;padding:16px 18px;align-items:flex-start}
  .list{width:330px;flex:0 0 330px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px}
  .list .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .list input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
  .list input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .list .rows{max-height:calc(100vh - 230px);overflow:auto}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .list .row:hover{background:#fafbfd}
  .list .row.cur{background:#eef3ff;color:#3b5bdb;font-weight:600}
  .list .row.off{color:#9aa4b2}
  .list .row .sub{display:block;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);font-weight:400}
  .list .row .tag{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;border-radius:999px;padding:0 6px;white-space:nowrap;color:#b42318;border:1px solid #f3d3cf}
  .list .row .tag.adm{color:#3b5bdb;border-color:#c9d6f5}
  .list .foot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .list .foot .sp{flex:1}
  .list .foot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .list .foot button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .range{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:ui-monospace,Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .head{padding:16px 16px 14px}
  .head .nm{font-size:19px;font-weight:700;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
  .chip.bad{border-color:#f3d3cf;color:#b42318}
  .chip.good{border-color:#cfe9d7;color:#16794a}
  .chip.adm{border-color:#c9d6f5;color:#3b5bdb}

  table{border-collapse:collapse;width:100%;font-size:13px}
  tbody td{padding:8px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  .kv td:first-child{width:170px;color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;white-space:nowrap;padding-top:11px}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .dim{color:#9aa4b2}
  .msg{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .err{color:#dc2626;font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:4px}

  /* 편집 폼 */
  .kv input[type=text],.kv input[type=email],.kv select,.kv textarea{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
  .kv textarea{min-height:64px;resize:vertical}
  .kv input:focus,.kv select:focus,.kv textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .kv input:disabled,.kv select:disabled{background:#f7f8fa;color:#9aa4b2}
  .kv label.ck{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;user-select:none}
  .actions{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
  .actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .actions button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .actions button:disabled{opacity:.5;cursor:default}
  .actions .st{font-size:12.5px;font-weight:600;min-height:16px}
  .actions .st.ok{color:#16a34a} .actions .st.bad{color:#dc2626}

  /* 임시 비밀번호 — 한 번만 보인다 */
  .cred{margin:0 14px 14px;border:1px solid #cfe9d7;background:#f3fbf6;border-radius:10px;padding:12px 14px}
  .cred .t{font-weight:700;margin-bottom:6px}
  .cred .pw{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;letter-spacing:.04em;margin:6px 0}
  .cred .warn{font-size:12px;color:#92640a}
  .cred button{margin-top:8px;margin-right:6px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search name or email">
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="addBtn" class="pri" hidden>+ Add staff</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a staff member.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Staff — ims_staff 목록 · 상세/편집 · 추가(ims-staff-create EF)
   정본: docs/design/po-module.md §10-h(표·RLS) · §10-i(이 화면 · EF · 레포 갈림)
   원본: asung-wms/staff-admin.html (WMS · 2026-07-21) — 틀은 suppliers.html 을 따른다

   ⭐ 첫 쓰기 화면이다. 쓰기는 둘뿐:
      편집  PostgREST update — RLS(ims_is_admin) 가 막는다
      추가  EF ims-staff-create — Auth 계정 + 행을 한 번에. ⚠️ service_role 은 EF 안에만 있다(공개 레포)
   ⚠️ admin 이 아니면 편집·추가 UI 를 감춘다(읽기 전용). 감추는 것이고 막는 것은 RLS·EF 다.
   ⚠️ 자기 행에서는 role·is_active 를 못 바꾼다 — 스스로 잠긴다(ims_is_admin() 은 is_active 도 본다).
   ⭐ RLS 에 막힌 update 는 에러가 아니라 0행이다(§10-h 실측) — .select() 로 되읽어 0행이면 「Not saved」.
   ❌ 삭제 없음 — is_active=false 로 내린다(delete 는 revoke 돼 있다).
   페이지네이션 없음 — caps-ok: 직원 마스터 · 수십 명 · 채용 때만 늘어난다(WMS 도 같다).
   ⚠️ 순서(§7): 목록은 all 배열을 그대로 그리는 동기 함수라 상세와 어긋날 비동기가 없다.
   ───────────────────────────────────────────────────────────── */

let sb=null, me=null, isAdmin=false;
let all=[], q="", curId=null, mode="view";   // mode: view | add

const esc = v => String(v==null?"":v).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const dim = v => (v===null||v===undefined||v==="") ? '<span class="dim">—</span>' : esc(v);
const fmtTs = v => v ? esc(String(v).replace("T"," ").slice(0,16)) : '<span class="dim">—</span>';

/* ── 읽기 ─────────────────────────────────────────────── */
async function loadAll(){
  const { data, error } = await sb.from("ims_staff").select("*").order("name");   // caps-ok: 직원 마스터 — 수십 명
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return false; }
  all = data || [];
  return true;
}

/* ── 목록 (동기 · all 을 그린다) ───────────────────────── */
function renderList(){
  const needle = q.toLowerCase();
  const list = all.filter(s => !needle || (s.name||"").toLowerCase().includes(needle) || (s.email||"").toLowerCase().includes(needle));

  document.getElementById("rows").innerHTML = list.length ? list.map(s => {
    const tags = [];
    if(s.role==="admin") tags.push('<span class="tag adm">admin</span>');
    if(!s.is_active) tags.push('<span class="tag">inactive</span>');
    return `<div class="row ${s.id===curId&&mode==="view"?"cur":""} ${s.is_active?"":"off"}" data-id="${s.id}">
      <span>${esc(s.name)}<span class="sub">${esc(s.email)}</span></span>
      <span style="display:flex;gap:4px">${tags.join("")}</span>
    </div>`;
  }).join("") : '<div class="msg">No staff match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; mode="view"; renderList(); renderDetail(); };
  });

  const act = all.filter(s=>s.is_active).length;
  document.getElementById("range").textContent = `${list.length} / ${all.length} · ${act} active`;
}

/* ── 상세 / 편집 ─────────────────────────────────────── */
function renderDetail(){
  const box = document.getElementById("detail");
  if(mode==="add"){ renderAdd(box); return; }
  const s = all.find(x => x.id===curId);
  if(!s){ curId=null; box.innerHTML = '<div class="card"><div class="msg">Select a staff member.</div></div>'; return; }

  const isSelf = (s.id === me.id);
  const chips = [
    `<span class="chip ${s.role==="admin"?"adm":""}">${esc(s.role)}</span>`,
    `<span class="chip ${s.is_active?"good":"bad"}">${s.is_active?"active":"inactive"}</span>`,
    ...(isSelf ? ['<span class="chip">you</span>'] : []),
  ];

  // email · auth_user_id 는 보여만 준다 — 로그인의 열쇠다
  const keyRows = `
    <tr><td>Email</td><td><span class="mono">${esc(s.email)}</span><div class="note">Login email — shown only. It is not the key (auth_user_id is).</div></td></tr>
    <tr><td>Auth user id</td><td><span class="mono">${esc(s.auth_user_id)}</span></td></tr>`;

  let body;
  if(isAdmin){
    // ⚠️ 자기 행: role·is_active 잠금 — 스스로 잠기는 것을 막는다
    const lock = isSelf ? 'disabled' : '';
    body = `
      <table class="kv"><tbody>
        <tr><td>Name</td><td><input type="text" id="fName" value="${esc(s.name)}"></td></tr>
        ${keyRows}
        <tr><td>Role</td><td>
          <select id="fRole" ${lock}>
            <option value="manager" ${s.role==="manager"?"selected":""}>manager</option>
            <option value="admin" ${s.role==="admin"?"selected":""}>admin</option>
          </select>
          ${isSelf?'<div class="note">You can\'t change your own role or status — you would lock yourself out (and if you are the last admin, nobody could undo it).</div>':''}
        </td></tr>
        <tr><td>Active</td><td><label class="ck"><input type="checkbox" id="fActive" ${s.is_active?"checked":""} ${lock}> is_active</label>
          ${!isSelf?'<div class="note">There is no delete — inactive people keep their row (history points at it).</div>':''}</td></tr>
        <tr><td>Note</td><td><textarea id="fNote">${esc(s.note||"")}</textarea></td></tr>
        <tr><td>Perms</td><td><span class="mono">${esc(JSON.stringify(s.perms||[]))}</span><div class="note">Not used yet — edited by SQL if ever needed.</div></td></tr>
        <tr><td>Created</td><td class="mono">${fmtTs(s.created_at)}</td></tr>
        <tr><td>Updated</td><td class="mono">${fmtTs(s.updated_at)}</td></tr>
      </tbody></table>
      <div class="actions">
        <button class="pri" id="saveBtn">Save</button>
        <button id="revertBtn">Revert</button>
        <span class="st" id="saveSt"></span>
      </div>`;
  } else {
    body = `
      <table class="kv"><tbody>
        <tr><td>Name</td><td>${esc(s.name)}</td></tr>
        ${keyRows}
        <tr><td>Role</td><td>${esc(s.role)}</td></tr>
        <tr><td>Active</td><td>${s.is_active?"yes":"no"}</td></tr>
        <tr><td>Note</td><td>${dim(s.note)}</td></tr>
        <tr><td>Created</td><td class="mono">${fmtTs(s.created_at)}</td></tr>
      </tbody></table>
      <div class="actions"><span class="st">Read only — only an admin can edit staff.</span></div>`;
  }

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="nm">${esc(s.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      ${body}
    </div>`;

  if(isAdmin){
    document.getElementById("saveBtn").onclick = () => save(s);
    document.getElementById("revertBtn").onclick = () => renderDetail();
  }
}

async function save(s){
  const st = document.getElementById("saveSt"); st.className="st";
  const btn = document.getElementById("saveBtn");
  const isSelf = (s.id === me.id);
  const patch = {
    name: document.getElementById("fName").value.trim(),
    note: document.getElementById("fNote").value.trim() || null,
  };
  if(!isSelf){
    patch.role = document.getElementById("fRole").value;
    patch.is_active = document.getElementById("fActive").checked;
  }
  if(!patch.name){ st.className="st bad"; st.textContent="Name is required."; return; }

  btn.disabled=true; st.textContent="Saving…";
  // ⭐ .select() 로 되읽는다 — RLS 에 막히면 에러 없이 0행이다
  const { data, error } = await sb.from("ims_staff").update(patch).eq("id", s.id).select();
  btn.disabled=false;
  if(error){ st.className="st bad"; st.textContent="Save failed: "+error.message; return; }
  if(!data || data.length===0){
    st.className="st bad";
    st.textContent="Not saved — the database refused the change (0 rows). Your admin access may have been revoked; sign out and in again.";
    return;
  }
  await loadAll(); renderList(); renderDetail();
  const st2 = document.getElementById("saveSt"); if(st2){ st2.className="st ok"; st2.textContent="Saved."; }
}

/* ── 추가 — EF ims-staff-create ────────────────────────── */
function renderAdd(box){
  box.innerHTML = `
    <div class="card">
      <h3>Add staff</h3>
      <table class="kv"><tbody>
        <tr><td>Name</td><td><input type="text" id="aName" placeholder="Full name"></td></tr>
        <tr><td>Email</td><td><input type="email" id="aEmail" placeholder="name@asung.ca"><div class="note">Stored in lower case. This becomes the login email.</div></td></tr>
        <tr><td>Role</td><td><select id="aRole"><option value="manager" selected>manager</option><option value="admin">admin</option></select>
          <div class="note">manager = does the work · admin = can also add and deactivate people.</div></td></tr>
      </tbody></table>
      <div class="actions">
        <button class="pri" id="createBtn">Create account</button>
        <button id="cancelAdd">Cancel</button>
        <span class="st" id="addSt"></span>
      </div>
      <div class="cred" id="credBox" hidden>
        <div class="t">Account created — hand these over once</div>
        <div>Email: <span class="mono" id="credEmail"></span></div>
        <div class="pw" id="credPw"></div>
        <div class="warn">This temporary password is shown only now. It cannot be retrieved later — the person changes it after signing in (Change Password).</div>
        <button id="credCopy">Copy</button><button id="credDone">Done</button>
      </div>
    </div>`;
  document.getElementById("cancelAdd").onclick = () => { mode="view"; renderList(); renderDetail(); };
  document.getElementById("createBtn").onclick = createStaff;
  document.getElementById("aEmail").addEventListener("keydown", e => { if(e.key==="Enter") createStaff(); });
  document.getElementById("credCopy").onclick = async () => {
    const txt = `Asung IMS login\nEmail: ${document.getElementById("credEmail").textContent}\nTemp password: ${document.getElementById("credPw").textContent}\nSign in at https://ims.asung.ca and change the password (Change Password button).`;
    const st = document.getElementById("addSt");
    try{ await navigator.clipboard.writeText(txt); st.className="st ok"; st.textContent="Copied."; }
    catch(e){ st.className="st bad"; st.textContent="Copy failed — select and copy manually."; }
  };
  document.getElementById("credDone").onclick = () => { mode="view"; renderList(); renderDetail(); };
  setTimeout(()=>document.getElementById("aName").focus(), 30);
}

async function createStaff(){
  const st = document.getElementById("addSt"); st.className="st";
  const btn = document.getElementById("createBtn");
  const name  = document.getElementById("aName").value.trim();
  const email = document.getElementById("aEmail").value.trim().toLowerCase();
  const role  = document.getElementById("aRole").value;
  if(!name){ st.className="st bad"; st.textContent="Enter a name."; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ st.className="st bad"; st.textContent="Enter a valid email."; return; }

  btn.disabled=true; st.textContent="Creating…";
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ st.className="st bad"; st.textContent="Session expired — sign in again."; return; }
    // ⚠️ IMS_CONFIG 다(WMS_CONFIG 아님) · 세션 JWT 를 붙인다 — EF 가 rpc/ims_is_admin 으로 판정한다
    const resp = await fetch(IMS_CONFIG.SUPABASE_URL + "/functions/v1/ims-staff-create", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + session.access_token,
        "apikey": IMS_CONFIG.SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ name, email, role }),
    });
    const out = await resp.json().catch(() => ({}));
    if(!resp.ok || !out.ok){
      st.className="st bad";
      st.textContent = "Add failed: " + (out.error || ("HTTP "+resp.status)) + (out.orphan_auth_user_id ? " · orphan Auth user: "+out.orphan_auth_user_id : "");
      return;
    }
    // 목록에 바로 넣고, 임시 비밀번호는 한 번만 보여 준다
    await loadAll(); curId = out.staff ? out.staff.id : null; renderList();
    document.getElementById("credEmail").textContent = email;
    document.getElementById("credPw").textContent = out.temp_password;
    document.getElementById("credBox").hidden = false;
    ["aName","aEmail"].forEach(id => { const el=document.getElementById(id); if(el){ el.value=""; el.disabled=true; } });
    document.getElementById("aRole").disabled = true;
    btn.hidden = true;
    st.className="st ok"; st.textContent = name + " added.";
  }catch(e){ st.className="st bad"; st.textContent="Add failed: "+(e.message||e); }
  finally{ btn.disabled=false; }
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  document.getElementById("who").textContent = me.name + " · " + me.role;
  document.getElementById("logoutBtn").onclick = () => imsAuth.signOut();

  if(isAdmin){
    const b = document.getElementById("addBtn"); b.hidden = false;
    b.onclick = () => { mode="add"; renderList(); renderDetail(); };
  }

  let timer=null;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(timer);
    timer = setTimeout(()=>{ q = e.target.value.trim(); renderList(); }, 150);
  });

  if(await loadAll()){ curId = me.id; renderList(); renderDetail(); }   // 자기 행을 먼저 연다
});
</script>
</body>
</html>
