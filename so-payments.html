<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Payments · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 뼈대는 so-invoices.html(목록/상세 두 모드 · 모달) */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px - var(--ims-tabs-h, 0px))}
  .list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .list .row .l{min-width:0}
  .list .row .pn{font-family:var(--mono);font-size:13px}
  .list .row .sn{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .r{text-align:right;white-space:nowrap}
  .list .row .amt{font-family:var(--mono);font-size:12.5px}
  .list .row.cur .pn{color:#3b5bdb;font-weight:700}
  main{display:flex;flex-direction:column;gap:14px}
  .sobar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sobar .pn{font-family:var(--mono);font-size:20px;font-weight:700}
  .sogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:900px){ .sogrid{grid-template-columns:1fr} }
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .pomodal[hidden]{display:none}
  .pobox input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:260px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .pick .prow.on2{background:#eef4ff}
  .sofield{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  tr.voided td{color:#9aa4b2;text-decoration:line-through}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <select id="wst">
        <option value="active">Active</option>
        <option value="unattached">Not attached — money on account</option>
        <option value="held">Held for orders</option>
        <option value="refund">Refunds</option>
        <option value="voided">Voided</option>
        <option value="all">All</option>
      </select>
      <select id="wm"><option value="">All methods</option></select>
      <input type="date" id="wfrom" title="Paid from">
      <span class="dash">—</span>
      <input type="date" id="wto" title="Paid to">
      <input type="search" id="wq" placeholder="Reference · customer · invoice · SO number · note">
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn" id="wrefund">Refund…</button>
      <button class="pobtn go" id="wnew">+ Record a payment</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <div style="display:flex;gap:6px">
        <button class="pobtn" id="backWide" style="flex:1">‹ All payments</button>
        <button class="pobtn go" id="newPay" style="flex:1">+ New</button>
      </div>
      <input type="search" id="q" placeholder="Reference · customer · invoice">
      <div class="opts">
        <label>Show
          <select id="st">
            <option value="active">Active</option>
            <option value="unattached">Not attached</option>
            <option value="held">Held for orders</option>
            <option value="refund">Refunds</option>
            <option value="voided">Voided</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>
  <main id="detail"><div class="card"><div class="msg">Select a payment.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Customer Payments — 손님 결제 화면 1판 (2026-09-25 · 대화 Claude)
   읽기: 뷰 so_payment_list · so_payment_detail(p_payment_id) (asung-wms 20260925195701 · 칸 이름 그 파일 그대로)
   쓰기: so_payment_add(새 결제 · 받아 둔 돈 · sales) · so_payment_propose(붙일 곳 제안 · 읽기) · so_payment_attach(sales)
         so_payment_detach · so_payment_void · so_payment_refund(셋 다 manager)
   ⚠️⚠️ 결제 남은 금액 = so_payment_remaining 한 곳(뷰가 부른다) · 인보이스 남은 금액 = so_invoice_remaining — 화면이 다시 계산하지 마라
   ⭐ 환불은 붙일 돈이 아니다 — remaining 이 비어 있고, 「크레딧이 갚은 몫 · 받아 둔 돈에서 나간 몫」 두 칸으로 보인다(§19 0-9)
   ⭐ held_for_orders = 대상 오더에 걸려 발행을 기다리는 돈(손님 잔액 available 에서 빠진다) — 발행 순간 저절로 붙는다
   ───────────────────────────────────────────────────────────── */
const PAY_BUILD = "2026-09-25 · pay v1";
console.log("so-payments.html build:", PAY_BUILD);

function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb = null, me = null, rank = 0;
let q = "", stFilter = "active", mFilter = "", dateFrom = "", dateTo = "", curId = null;
let detailSeq = 0, cur = null;
const pg = imsPage(100), pgW = imsPage(50);
let WHS = [], ACCTS = [], ACCT_NAME = {};
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;

const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const orTerm = (t) => String(t || "").replace(/[,()"\\]/g, "%");
const METHODS = [["credit_card","Credit card"],["debit_card","Debit card"],["cash","Cash"],["e_transfer","e-Transfer"],["cheque","Cheque"],["wire","Wire"],["direct_deposit","Direct deposit"],["shopify","Shopify"]];
const mLabel = (m) => (METHODS.find(x => x[0] === m) || [0, m])[1] || "";
const acctLabel = (code, name) => code ? `<span class="mono">${esc(code)}</span>${(name || ACCT_NAME[code]) ? ` <span class="dim">${esc(name || ACCT_NAME[code])}</span>` : ""}` : '<span class="dim">—</span>';
const SRC = { manual: "by hand", auto_deposit: "deposit · auto", auto_balance: "on account · auto", auto: "auto" };

function payChip(r){
  if(r.status === "voided") return '<span class="chip bad">voided</span>';
  if(r.kind === "refund") return '<span class="chip warn">refund</span>';
  if(r.held_for_orders) return '<span class="chip">held for orders</span>';
  if(Number(r.remaining) > 0) return '<span class="chip warn">on account</span>';
  return '<span class="chip good">attached</span>';
}
/* 「남은 돈」 칸 — 환불은 두 칸 · 취소는 대시 */
function leftCell(r){
  if(r.status === "voided") return '<span class="dim">—</span>';
  if(r.kind === "refund") return `<span class="dim" style="font-size:11.5px">credit ${money(r.refund_credit_covered)} · account ${money(r.refund_from_account)}</span>`;
  return Number(r.remaining) > 0 ? `<span class="neutral">${money(r.remaining)}</span>` : '<span class="dim">0.00</span>';
}

function baseQuery(){
  let qry = sb.from("so_payment_list").select(
    "id,kind,status,paid_on,method,reference,amount,currency_code,customer_id,customer_name,account_code,account_name,attached,remaining,held_for_orders,refund_credit_covered,refund_from_account,invoice_numbers,target_so_numbers",
    { count: "exact" });
  if(stFilter === "active")          qry = qry.eq("status", "active");
  else if(stFilter === "unattached") qry = qry.eq("status", "active").eq("kind", "payment").gt("remaining", 0);
  else if(stFilter === "held")       qry = qry.eq("held_for_orders", true);
  else if(stFilter === "refund")     qry = qry.eq("kind", "refund");
  else if(stFilter === "voided")     qry = qry.eq("status", "voided");
  if(mFilter)  qry = qry.eq("method", mFilter);
  if(dateFrom) qry = qry.gte("paid_on", dateFrom);
  if(dateTo)   qry = qry.lte("paid_on", dateTo);
  if(q) qry = qry.ilike("search_text", `%${orTerm(q)}%`);
  return qry.order("paid_on", { ascending: false }).order("created_at", { ascending: false });
}

function showWide(){
  curId = null; detailSeq++;
  document.getElementById("wide").hidden = false;
  document.getElementById("wrapBox").hidden = true;
  loadWide();
}
function openPay(id){
  curId = id;
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  loadList(); loadDetail(id);
}
function clearDetail(){
  curId = null; cur = null; detailSeq++;
  document.getElementById("detail").innerHTML = '<div class="card"><div class="msg">Select a payment.</div></div>';
}

async function loadWide(){
  const { data, error } = await pgW.run(baseQuery());
  const box = document.getElementById("wrows");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = '<div class="msg">No payments match.</div>'; pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide); return; }
  box.innerHTML = `<table><thead><tr>
      <th>Paid on</th><th>Status</th><th>Customer</th><th>Method</th><th>Reference</th><th>Account</th>
      <th class="num">Amount</th><th class="num">Attached</th><th class="num">Not attached</th><th>Invoices · orders</th>
    </tr></thead><tbody>${data.map(r => `
      <tr data-id="${r.id}">
        <td>${dim(r.paid_on)}</td>
        <td>${payChip(r)}</td>
        <td>${esc(r.customer_name || "")}</td>
        <td>${esc(mLabel(r.method))}</td>
        <td class="mono">${dim(r.reference)}</td>
        <td>${acctLabel(r.account_code, r.account_name)}</td>
        <td class="num">${r.kind === "refund" ? "−" : ""}${money(r.amount)} <span class="dim">${esc(r.currency_code || "")}</span></td>
        <td class="num">${Number(r.attached) ? money(r.attached) : '<span class="dim">—</span>'}</td>
        <td class="num">${leftCell(r)}</td>
        <td class="mono" style="font-size:12px">${esc(r.invoice_numbers || "")}${r.target_so_numbers ? `<div class="dim">for ${esc(r.target_so_numbers)}</div>` : ""}</td>
      </tr>`).join("")}</tbody></table>
    <div class="sosub">Not attached = money on account (the database works it out). It attaches itself to the customer's next invoice, or you can attach it by hand. Held for orders is waiting for those orders to be invoiced.</div>`;
  box.querySelectorAll("tbody tr").forEach(el => { el.onclick = () => openPay(el.dataset.id); });
  pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

async function loadList(){
  const { data, error } = await pg.run(baseQuery());
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  document.getElementById("rows").innerHTML = data.length ? data.map(r => `
    <div class="row ${r.id === curId ? "cur" : ""}" data-id="${r.id}">
      <span class="l">
        <div class="pn">${esc(r.paid_on || "")} · ${esc(mLabel(r.method))}</div>
        <div class="sn">${esc(r.customer_name || "")}</div>
        ${r.reference ? `<div class="sn">${esc(r.reference)}</div>` : ""}
      </span>
      <span class="r">
        <div class="amt">${r.kind === "refund" ? "−" : ""}${money(r.amount)}</div>
        <div style="margin-top:3px">${payChip(r)}</div>
      </span>
    </div>`).join("") : '<div class="msg">No payments match.</div>';
  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });
  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

/* ══ 모달 ══════════════════════════════════════════════ */
function modalOpen(html){ document.getElementById("modalBox").innerHTML = html; document.getElementById("modal").hidden = false; }
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });
function wireModalClose(){ document.querySelectorAll('#modalBox [data-m="close"]').forEach(b => { b.onclick = modalClose; }); }
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}
async function reloadHere(){
  const y = window.scrollY;
  await loadDetail(curId); await loadList();
  window.scrollTo(0, y);
}

/* ── 손님 고르기(새 결제 · 환불 공통) — 9,469 명 · 서버에서 이름으로 ── */
function custPicker(onPick){
  const draw = async (t) => {
    const box = document.getElementById("cpList");
    if(!box) return;
    if(!t){ box.innerHTML = '<div class="msg">Type to search.</div>'; return; }
    const { data, error } = await sb.from("customer").select("id,name,currency_id,currency_code,default_location_name")
      .eq("is_active", true).ilike("name", `%${t}%`).order("name").limit(60);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(r => `<div class="prow" data-cid="${r.id}">${esc(r.name)}
        <div class="dim" style="font-size:11.5px">${esc([r.currency_code, r.default_location_name].filter(Boolean).join(" · "))}</div></div>`).join("")
      : '<div class="msg">No active customer matches.</div>';
    box.querySelectorAll("[data-cid]").forEach(el => {
      el.onclick = () => {
        box.querySelectorAll(".prow").forEach(p => p.classList.toggle("on2", p === el));
        onPick(data.find(x => x.id === el.dataset.cid));
      };
    });
  };
  imsQ("#cpQ", draw);
}
const payFields = (needAcct) => `
  <div class="frow"><label>Method</label><select id="pyM" class="sofield">${METHODS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
  <div class="frow"><label>Amount</label><input id="pyA" class="sofield" type="number" step="0.01" min="0.01"></div>
  <div class="frow"><label>Paid on</label><input id="pyD" class="sofield" type="date" value="${torontoToday()}" max="${torontoToday()}"></div>
  <div class="frow"><label>Reference</label><input id="pyR" class="sofield" placeholder="card slip · cheque no. · transfer ref"></div>
  <div class="frow"><label>Branch</label><select id="pyW" class="sofield"><option value="">Customer's default branch</option>${WHS.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join("")}</select></div>
  <div class="frow"><label>Account</label><select id="pyAcc" class="sofield"><option value="">${needAcct ? "— pick the account the money leaves from" : "Default for this method and branch"}</option>
    ${ACCTS.map(a => `<option value="${a.id}">${esc(a.code)} · ${esc(a.name)}</option>`).join("")}</select></div>
  <div class="frow"><label>Note</label><input id="pyN" class="sofield"></div>`;
const readPay = (custId) => ({
  customer_id: custId,
  amount: Number(document.getElementById("pyA").value),
  paid_on: document.getElementById("pyD").value || null,
  method: document.getElementById("pyM").value,
  reference: document.getElementById("pyR").value.trim() || null,
  account_id: document.getElementById("pyAcc").value || null,
  warehouse_id: document.getElementById("pyW").value || null,
  note: document.getElementById("pyN").value.trim() || null,
});

/* 새 결제(받아 둔 돈) — 인보이스 없이 받는다 · 다음 인보이스 발행 순간 저절로 붙거나 손으로 붙인다
   ⭐ 특정 인보이스에 받는 것은 Sales Invoices 에서 · 특정 오더의 선결제는 Sales Orders 에서 넣는 편이 맞다 */
function openNewPayment(){
  let cust = null;
  modalOpen(`
    <h4>Record a payment — money on account</h4>
    <div class="pbody">
      <input type="search" id="cpQ" placeholder="Search customer by name" autocomplete="off">
      <div class="pick" id="cpList"><div class="msg">Type to search.</div></div>
      <div id="cpPicked" style="margin:10px 0;font-size:13px"></div>
      ${payFields(false)}
      <div class="sohint">The payment is recorded on the customer's account. It attaches itself to the next invoice they get — or open it here and attach it by hand. For a specific invoice, take the payment on Sales Invoices; for a deposit on an order, on Sales Orders.</div>
      <div id="pyMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn go" id="pyGo" disabled>Record payment</button>
    </div>`);
  wireModalClose();
  custPicker(c => { cust = c; document.getElementById("cpPicked").innerHTML = `Customer: <b>${esc(c.name)}</b> <span class="dim">${esc(c.currency_code || "")}</span>`; document.getElementById("pyGo").disabled = false; });
  document.getElementById("pyGo").onclick = async () => {
    const p = readPay(cust && cust.id);
    if(!p.customer_id){ say("pyMsg", "err", "Pick a customer."); return; }
    if(!(p.amount > 0)){ say("pyMsg", "err", "Give an amount above zero."); return; }
    p.currency_id = cust.currency_id || null;
    say("pyMsg", "", "Recording…"); document.getElementById("pyGo").disabled = true;
    const { data, error } = await sb.rpc("so_payment_add", { p: p });
    if(error){ say("pyMsg", "err", error.message); document.getElementById("pyGo").disabled = false; return; }
    modalClose();
    if(data && data.payment_id) openPay(data.payment_id); else showWide();
  };
}

/* 환불 — manager · 손님에게 돈을 돌려준다 · 진 빚(크레딧)부터 갚고 모자라면 받아 둔 돈에서(§19 · DB 가 가른다) · 나가는 계좌 필수 */
function openRefund(){
  let cust = null;
  modalOpen(`
    <h4>Refund a customer</h4>
    <div class="pbody">
      <input type="search" id="cpQ" placeholder="Search customer by name" autocomplete="off">
      <div class="pick" id="cpList"><div class="msg">Type to search.</div></div>
      <div id="cpPicked" style="margin:10px 0;font-size:13px"></div>
      ${payFields(true)}
      <div class="sohint">A refund first pays off credit notes owed to the customer, then money on account. It cannot be more than both together.</div>
      <div id="pyMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn go" id="pyGo" disabled>Record refund</button>
    </div>`);
  wireModalClose();
  custPicker(c => { cust = c; document.getElementById("cpPicked").innerHTML = `Customer: <b>${esc(c.name)}</b> <span class="dim">${esc(c.currency_code || "")}</span>`; document.getElementById("pyGo").disabled = false; });
  document.getElementById("pyGo").onclick = async () => {
    const p = readPay(cust && cust.id);
    if(!p.customer_id){ say("pyMsg", "err", "Pick a customer."); return; }
    if(!(p.amount > 0)){ say("pyMsg", "err", "Give an amount above zero."); return; }
    if(!p.account_id){ say("pyMsg", "err", "Pick the account the money leaves from."); return; }
    p.currency_id = cust.currency_id || null;
    say("pyMsg", "", "Recording…"); document.getElementById("pyGo").disabled = true;
    const { data, error } = await sb.rpc("so_payment_refund", { p: p });
    if(error){ say("pyMsg", "err", error.message); document.getElementById("pyGo").disabled = false; return; }
    modalClose();
    if(data && data.payment_id) openPay(data.payment_id); else showWide();
  };
}

/* 손으로 붙이기 — 이 결제의 남은 돈을 그 손님의 열린 인보이스(같은 통화)에
   ⭐ 「오래된 것부터 제안」은 so_payment_propose(DB) · 사람이 금액을 고친다 · 붙이는 것은 so_payment_attach */
function openAttach(){
  const v = cur.payment, inv = (cur.open_invoices || []);
  modalOpen(`
    <h4>Attach money on account — ${esc(money(v.remaining))} ${esc(v.currency_code || "")} not attached</h4>
    <div class="pbody">
      <table><thead><tr><th>Invoice</th><th>Issued</th><th>Due</th><th>Orders</th><th class="num">Still owed</th><th class="num">Attach</th></tr></thead>
      <tbody>${inv.map(i => `<tr>
        <td class="mono">${esc(i.invoice_number)}</td><td>${dim(i.issued_on)}</td>
        <td>${i.due_unknown ? '<span class="dim">no due date</span>' : dim(i.due_on)}${Number(i.days_overdue) > 0 ? ` <span class="off" style="font-size:11.5px">${esc(i.days_overdue)}d over</span>` : ""}</td>
        <td class="mono" style="font-size:12px">${esc(i.so_numbers || "")}</td>
        <td class="num">${money(i.remaining)}</td>
        <td class="num"><input class="qin" type="number" step="0.01" min="0" data-att="${i.invoice_id}" data-max="${esc(i.remaining)}" value=""></td>
      </tr>`).join("")}</tbody></table>
      <div class="sohint">Suggest fills the oldest invoices first. You can change any amount. Nothing is saved until you press Attach.</div>
      <div id="atMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn" id="atSug">Suggest (oldest first)</button>
      <button class="pobtn go" id="atGo">Attach</button>
    </div>`);
  wireModalClose();
  document.getElementById("atSug").onclick = async () => {
    const { data, error } = await sb.rpc("so_payment_propose", { p_customer_id: v.customer_id, p_amount: Number(v.remaining), p_currency_id: v.currency_id });
    if(error){ say("atMsg", "err", error.message); return; }
    document.querySelectorAll("[data-att]").forEach(inp => { inp.value = ""; });
    (data.proposed || []).forEach(r => {
      const inp = document.querySelector(`[data-att="${r.invoice_id}"]`);
      if(inp && Number(r.suggested) > 0) inp.value = Number(r.suggested).toFixed(2);
    });
    say("atMsg", "", `Suggested ${Number(data.allocated || 0).toFixed(2)} · left on account ${Number(data.leftover || 0).toFixed(2)}`);
  };
  document.getElementById("atGo").onclick = async () => {
    const allocs = [];
    document.querySelectorAll("[data-att]").forEach(inp => {
      const a = Number(inp.value);
      if(a > 0) allocs.push({ invoice_id: inp.dataset.att, amount: a });
    });
    if(!allocs.length){ say("atMsg", "err", "Type an amount on at least one invoice, or press Suggest."); return; }
    say("atMsg", "", "Attaching…"); document.getElementById("atGo").disabled = true;
    const { error } = await sb.rpc("so_payment_attach", { p_payment_id: v.id, p_allocs: allocs });
    if(error){ say("atMsg", "err", error.message); document.getElementById("atGo").disabled = false; return; }
    modalClose(); await reloadHere();
  };
}

/* 떼기 · 취소 — manager · 사유 필수 */
async function detachAlloc(allocId, label){
  const note = prompt(`Detach ${label}? The amount goes back to money on account.\n\nReason (required):`);
  if(note === null) return;
  if(!note.trim()){ alert("A reason is required."); return; }
  const { error } = await sb.rpc("so_payment_detach", { p_alloc_id: allocId, p_note: note.trim() });
  if(error){ alert(error.message); return; }
  await reloadHere();
}
async function voidPayment(){
  const v = cur.payment;
  const what = v.kind === "refund" ? "refund" : "payment";
  const note = prompt(`Void this ${what} of ${Number(v.amount).toFixed(2)} ${v.currency_code || ""}? Everything it paid or covered is released — nothing is deleted.\n\nReason (required):`);
  if(note === null) return;
  if(!note.trim()){ alert("A reason is required."); return; }
  const { error } = await sb.rpc("so_payment_void", { p_payment_id: v.id, p_note: note.trim() });
  if(error){ alert(error.message); return; }
  await reloadHere();
}

/* ══ 상세 ═══════════════════════════════════════════════ */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';
  const { data, error } = await sb.rpc("so_payment_detail", { p_payment_id: id });
  if(seq !== detailSeq) return;
  if(error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(error.message)}</div></div>`; return; }
  if(!data || !data.payment){ box.innerHTML = '<div class="card"><div class="msg">That payment is gone.</div></div>'; return; }
  cur = data;
  const v = data.payment;
  const active = v.status === "active";
  const isRefund = v.kind === "refund";

  const acts = [];
  acts.push('<button class="pobtn" data-act="toglist" title="Show or hide the list">&#9776; List</button>');
  acts.push('<button class="pobtn" data-act="wide">&lsaquo; All payments</button>');
  const canAttach = active && !isRefund && Number(v.remaining) > 0 && (data.open_invoices || []).some(i => Number(i.remaining) > 0);
  if(canAttach) acts.push('<button class="pobtn go" data-act="attach">Attach to invoices…</button>');
  if(active && isMgr()) acts.push(`<button class="pobtn" data-act="void">Void ${isRefund ? "refund" : "payment"}…</button>`);

  const kvL = [
    ["Customer",   esc(v.customer_name || "")],
    ["Paid on",    dim(v.paid_on)],
    ["Method",     esc(mLabel(v.method))],
    ["Reference",  `<span class="mono">${dim(v.reference)}</span>`],
    ["Account",    acctLabel(v.account_code, v.account_name)],
    ["Branch",     dim(v.warehouse_name)],
  ];
  const kvR = [
    ["Currency",   `<span class="mono">${dim(v.currency_code)}</span>`],
    ["Note",       dim(v.note)],
    ["Recorded",   imsTs(v.created_at) + (v.created_by_name ? ` <span class="dim">${esc(v.created_by_name)}</span>` : "")],
    ["Voided",     v.voided_at ? imsTs(v.voided_at) + (v.void_note ? ` <span class="dim">${esc(v.void_note)}</span>` : "") : '<span class="dim">—</span>'],
  ];
  const kvTbl = (rows) => `<table class="kv"><tbody>${rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  const stats = isRefund ? `
    <div class="stats">
      <div class="stat">Refunded<b>${money(v.amount)}</b></div>
      <div class="stat">Paid off credit notes<b>${money(v.refund_credit_covered)}</b></div>
      <div class="stat">From money on account<b>${money(v.refund_from_account)}</b></div>
    </div>` : `
    <div class="stats">
      <div class="stat">Amount<b>${money(v.amount)}</b></div>
      <div class="stat">Attached to invoices<b>${money(v.attached)}</b></div>
      <div class="stat ${Number(v.remaining) > 0 ? "warn" : ""}">Not attached<b>${active ? money(v.remaining) : '<span class="dim">—</span>'}</b></div>
    </div>`;

  const allocs = (data.allocations || []).map(a => `<tr class="${a.voided_at ? "voided" : ""}">
      <td><a class="lnk mono" href="so-invoices.html?inv=${encodeURIComponent(a.invoice_number)}">${esc(a.invoice_number)}</a> <span class="dim" style="font-size:11.5px">${esc(a.invoice_status || "")}</span></td>
      <td class="num">${money(a.amount)}</td><td class="num">${money(a.invoice_total)}</td>
      <td>${esc(SRC[a.source] || a.source || "")}${a.voided_at ? `<div style="font-size:11px">detached ${imsTs(a.voided_at)}${a.void_note ? " · " + esc(a.void_note) : ""}</div>` : ""}</td>
      <td class="dim" style="font-size:11.5px">${imsTs(a.created_at)}</td>
      <td>${!a.voided_at && active && isMgr() ? `<button class="xbtn" data-detach="${a.alloc_id}" data-lbl="${esc(Number(a.amount).toFixed(2) + " from " + a.invoice_number)}">detach</button>` : ""}</td>
    </tr>`);
  const targets = (data.targets || []).map(t => `<tr>
      <td><a class="lnk mono" href="so.html?so=${encodeURIComponent(t.so_number)}">${esc(t.so_number)}</a></td>
      <td>${esc(t.so_status || "")}${t.channel && t.channel !== "warehouse" ? ` <span class="tag">${esc(t.channel)}</span>` : ""}</td>
      <td>${t.invoiced ? '<span class="on">invoiced</span>' : '<span class="neutral">waiting — attaches itself when invoiced</span>'}</td>
    </tr>`);
  const rcred = (data.refund_credits || []).map(c => `<tr class="${c.voided_at ? "voided" : ""}">
      <td class="mono">${esc(c.credit_number)}</td><td>${esc(c.credit_status || "")}</td>
      <td class="num">${money(c.amount)}</td><td class="num">${money(c.credit_total)}</td><td>${esc(SRC[c.source] || c.source || "")}</td></tr>`);
  const opens = (data.open_invoices || []).map(i => `<tr>
      <td><a class="lnk mono" href="so-invoices.html?inv=${encodeURIComponent(i.invoice_number)}">${esc(i.invoice_number)}</a></td>
      <td>${dim(i.issued_on)}</td>
      <td>${i.due_unknown ? '<span class="dim">no due date</span>' : dim(i.due_on)}${Number(i.days_overdue) > 0 ? ` <span class="off" style="font-size:11.5px">${esc(i.days_overdue)}d over</span>` : ""}</td>
      <td class="mono" style="font-size:12px">${esc(i.so_numbers || "")}</td>
      <td class="num">${money(i.remaining)}</td>
      <td class="num">${Number(i.attached_from_this_payment) ? money(i.attached_from_this_payment) : '<span class="dim">—</span>'}</td>
    </tr>`);
  const b = data.customer_balance;
  const bal = b ? [`<tr><td class="mono">${esc(b.currency_code || "")}</td><td class="num">${money(b.received)}</td><td class="num">${money(b.owed_credit)}</td>
      <td class="num">${money(b.reserved_deposit)}</td><td class="num">${money(b.available)}</td><td class="num">${money(b.open_invoices_due)}</td></tr>`] : [];

  const tbl = (title, n, head, rows, sub) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(x => `<th${x[1] ? ' class="' + x[1] + '"' : ""}>${x[0]}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>${sub ? `<div class="sosub">${sub}</div>` : ""}` : '<div class="msg">None.</div>'}
    </div>`;

  if(seq !== detailSeq) return;
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="sobar"><span class="pn">${isRefund ? "−" : ""}${money(v.amount)} ${esc(v.currency_code || "")}</span><span class="chips">${payChip(v)}</span></div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>
      </div>
      ${stats}
      <div class="sogrid">${kvTbl(kvL)}${kvTbl(kvR)}</div>
    </div>

    ${isRefund ? tbl("Credit notes this refund paid off", rcred.length, [["Credit",""],["Status",""],["Paid off","num"],["Credit total","num"],["How",""]], rcred,
      "A refund pays off credit notes owed to the customer first; the rest comes out of money on account.")
    : tbl("Attached to invoices", allocs.length, [["Invoice",""],["On this invoice","num"],["Invoice total","num"],["How it attached",""],["When",""],["",""]], allocs,
      "Detaching sends the amount back to money on account (manager).")}

    ${targets.length ? tbl("Held for orders", targets.length, [["Order",""],["Status",""],["",""]], targets,
      "A deposit recorded against these orders. It attaches itself the moment the order is invoiced.") : ""}

    ${!isRefund && active ? tbl("Open invoices of this customer", opens.length, [["Invoice",""],["Issued",""],["Due",""],["Orders",""],["Still owed","num"],["From this payment","num"]], opens,
      "Same customer and currency, oldest first. Use Attach to put money on account against them.") : ""}

    ${bal.length ? tbl("Customer balance", 1, [["Currency",""],["Money on account","num"],["Credit owed","num"],["Held for orders","num"],["Available","num"],["Open invoices due","num"]], bal,
      "Available = money on account + credit owed − deposits held for open orders.") : ""}
  `;

  box.querySelectorAll("[data-detach]").forEach(bt => { bt.onclick = () => detachAlloc(bt.dataset.detach, bt.dataset.lbl); });
  box.querySelectorAll("[data-act]").forEach(bt => {
    bt.onclick = () => {
      const a = bt.dataset.act;
      if(a === "toglist"){ const lp = document.getElementById("listPanel"); lp.hidden = !lp.hidden; }
      if(a === "wide")   showWide();
      if(a === "attach") openAttach();
      if(a === "void")   voidPayment();
    };
  });
}

/* ── 시작 ─────────────────────────────────────────── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; rank = RANK[me.role] || 0;
  window.sb = sb;
  imsHeader(me);
  document.getElementById("buildTag").textContent = PAY_BUILD;
  document.getElementById("backWide").onclick = showWide;
  document.getElementById("wnew").onclick = openNewPayment;
  document.getElementById("newPay").onclick = openNewPayment;
  const rb = document.getElementById("wrefund");
  if(isMgr()) rb.onclick = openRefund; else rb.hidden = true;

  /* 계좌 — 이름 찾기는 전부 · 고르기는 활성 BANK 또는 _5_(§18-b ①) */
  const [wh, ac] = await Promise.all([
    sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name"),
    sb.from("ref_account").select("id,code,name,account_type,is_active").order("code"),
  ]);
  WHS = wh.data || [];
  (ac.data || []).forEach(a => { ACCT_NAME[a.code] = a.name; });
  ACCTS = (ac.data || []).filter(a => a.is_active && (a.account_type === "BANK" || a.code === "_5_"));
  document.getElementById("wm").innerHTML = '<option value="">All methods</option>' + METHODS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");

  const refilter = () => { pg.reset(); pgW.reset(); loadWide(); };
  document.getElementById("wst").onchange  = e => { stFilter = e.target.value; document.getElementById("st").value = stFilter; refilter(); };
  document.getElementById("wm").onchange   = e => { mFilter = e.target.value; refilter(); };
  document.getElementById("wfrom").onchange = e => { dateFrom = e.target.value; refilter(); };
  document.getElementById("wto").onchange   = e => { dateTo = e.target.value; refilter(); };
  imsQ("#wq", v => { q = v; document.getElementById("q").value = v; refilter(); });
  document.getElementById("wclear").onclick = () => {
    q = ""; mFilter = ""; dateFrom = ""; dateTo = ""; stFilter = "active";
    ["wq","wm","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wst").value = "active"; document.getElementById("q").value = ""; document.getElementById("st").value = "active";
    refilter();
  };
  document.getElementById("st").onchange = e => { stFilter = e.target.value; document.getElementById("wst").value = stFilter; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; document.getElementById("wq").value = v; pg.reset(); clearDetail(); loadList(); });

  /* ?pay=<uuid> 로 들어오면 그 결제를 연다(Sales Invoices 의 결제 줄에서) */
  const want = imsParam("pay");
  if(want){ openPay(want); return; }
  showWide();
});
