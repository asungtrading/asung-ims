<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Products · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:300px;flex:0 0 300px}
  .list .rows{max-height:calc(100vh - 210px)}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .list .row.cur{color:#3b5bdb;font-weight:600}
  .bar input[type=search]{width:200px}
  thead th{position:sticky;top:0}
  /* 넓은 목록 — 이 화면 몫만(공통 #wide · .wfilt 는 ims-ui.css · 판정 209) */
  #wide td.nm1{font-weight:600}
  #wide tr.off td{color:var(--muted)}
  .bar .navb{display:flex;gap:6px}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <input type="search" id="wq" placeholder="Search supplier">
      <label id="wallBox" hidden style="font-size:12.5px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="wall"> Show all suppliers</label>
      <span class="sp"></span>
      <span class="dim" id="wnote" style="font-size:12px"></span>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <input type="search" id="sq" placeholder="Search supplier">
      <div class="opts" id="opts" hidden>
        <label><input type="checkbox" id="showAll"> Show all suppliers</label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="srange"></span><span class="sp"></span>
      <button id="sprev">←</button><button id="snext">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a supplier.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Supplier Products — product_supplier 12,721 을 공급처 쪽에서 본다
   정본: docs/design/po-module.md §3-g

   제품 상세(products.html)에서는 「이 제품을 어디서 사나」가 보이고,
   여기서는 「이 공급처에서 무엇을 사나」가 보인다. 같은 표를 반대 축으로 읽는다.

   ⚠️ §3-f — 읽는 쪽이 is_active 를 건다. 줄도 공급처도 살아 있는 것만 센다.
   ⚠️ PostgREST 1,000행 캡 — 제품 쪽도 .range() 로 나눠 읽는다(한 공급처에 수백 줄이 붙는다).
   ⭐ 단가가 둘 다 없는 줄(전체 1,227)이 공급처별로 몇인지 보인다 — 채울 자리를 찾는 재료다.
   ⭐ spp v2a(2026-10-01 · 판정 209): 처음은 공급처 넓은 목록(#wide) · 고르면 좁은 목록 + 그 공급처의 제품 · ☰ List · ‹ All suppliers
      판정 210: Product Sheet 가 서면 이 화면은 메뉴에서 빠진다(그때까지 쓰는 판)
   ───────────────────────────────────────────────────────────── */

const SPP_BUILD = "spp v2a";
let sb=null, isAdmin=false, showAll=false;
let sq="", curSup=null, curName="";
let pq="", onlyDefault=false, noPrice=false;
/* ⭐ 페이징이 둘이다 — 왼쪽 공급처(sp) · 오른쪽 그 공급처의 제품(pp) */
const sp = imsPage(100), pp = imsPage(200);

/* ⭐ 왼쪽 검색·필터를 바꾸면 오른쪽을 비운다. 페이지를 넘길 때는 두지 않는다(2026-09-15 · Caleb). */
function clearDetail(){
  curSup = null; curName = "";
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Select a supplier.</div></div>';
}


/* ── 두 모드(판정 209) ───────────────────────────────── */
function syncCtl(){
  document.getElementById("sq").value = sq; document.getElementById("wq").value = sq;
  document.getElementById("showAll").checked = showAll; document.getElementById("wall").checked = showAll;
}
function showWide(){
  clearDetail(); syncCtl();
  document.getElementById("wide").hidden = false;
  document.getElementById("wrapBox").hidden = true;
  loadWide();
}
function openSupplier(id, name){
  curSup = id; curName = name;
  pp.reset(); pq = ""; onlyDefault = false; noPrice = false;
  syncCtl();
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  document.getElementById("listPanel").hidden = false;
  loadSuppliers(); loadProducts();
}
/* 공급처 질의 한 곳 — 넓은 목록 · 좁은 목록이 같은 필터 · 같은 쪽 sp(100) */
function supQuery(){
  let qry = sb.from("supplier").select("id,name,currency_id,is_active", { count:"exact" });
  if(!isAdmin || !showAll){
    qry = qry.eq("is_active", true).eq("is_purchasable", true).eq("is_discontinued", false);
  }
  if(sq) qry = qry.ilike("name", `%${sq}%`);
  return qry.order("name");
}
/* 공급처별 수 — 켜진 연결 줄을 한 번 다 읽어 센다(12,721 · 1,000 씩 · 페이지 동안 기억)
   ⚠️ 쪽마다 공급처 100 곳에 셈 질의 셋씩(300)을 보내지 않으려고 한 번에 읽는다 */
let statsP = null, curCode = {};
function loadStats(){
  if(statsP) return statsP;
  statsP = (async () => {
    const st = {};
    for(let from = 0; ; from += 1000){
      const { data, error } = await sb.from("product_supplier").select("supplier_id,is_default,cost,fixed_cost,last_supplied")
        .eq("is_active", true).order("id").range(from, from + 999);
      if(error) throw error;
      (data||[]).forEach(x => {
        const t = st[x.supplier_id] = st[x.supplier_id] || { n:0, d:0, np:0, last:null };
        t.n++; if(x.is_default) t.d++;
        if((x.cost == null && x.fixed_cost == null) || (Number(x.cost) === 0 && Number(x.fixed_cost) === 0)) t.np++;
        if(x.last_supplied && (!t.last || x.last_supplied > t.last)) t.last = x.last_supplied;
      });
      if(!data || data.length < 1000) break;
    }
    return st;
  })();
  return statsP;
}
let wideSeq = 0;
async function loadWide(){
  const seq = ++wideSeq;
  const box = document.getElementById("wrows");
  const [{ data, error }, st] = await Promise.all([sp.run(supQuery()), loadStats().catch(e => ({ __err: e }))]);
  if(seq !== wideSeq) return;
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const bad = st && st.__err;
  document.getElementById("wnote").textContent = bad ? "Counts failed: " + bad.message : "Counts are active links only.";
  const S = bad ? {} : st;
  const rows = data || [];
  box.innerHTML = rows.length ? `<table><thead><tr>
      <th>Supplier</th><th>Cur</th><th class="num">Products linked</th><th class="num">Default here</th>
      <th class="num">No price</th><th>Last supplied</th><th>Active</th></tr></thead>
    <tbody>${rows.map(r => { const t = S[r.id] || { n:0, d:0, np:0, last:null };
      return `<tr data-id="${r.id}" data-name="${esc(r.name)}" class="${r.is_active ? "" : "off"}">
      <td class="nm1">${esc(r.name)}</td><td class="mono">${dim(curCode[r.currency_id])}</td>
      <td class="num">${t.n.toLocaleString()}</td><td class="num">${t.d.toLocaleString()}</td>
      <td class="num">${t.np ? `<span style="color:var(--warn)">${t.np.toLocaleString()}</span>` : '<span class="dim">0</span>'}</td>
      <td class="mono">${dim(t.last)}</td><td>${yn(r.is_active)}</td></tr>`; }).join("")}</tbody></table>`
    : '<div class="msg">No suppliers match.</div>';
  box.querySelectorAll("tbody tr").forEach(tr => { tr.onclick = () => openSupplier(tr.dataset.id, tr.dataset.name); });
  sp.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

/* ── 공급처 목록(좁은) ─────────────────────────────────── */
async function loadSuppliers(){
  let qry = supQuery();
  // ⭐ 매니저는 정돈된 목록만 본다 (suppliers.html 과 같은 규칙 · supQuery 안)
  const { data, error } = await sp.run(qry);
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  document.getElementById("rows").innerHTML = data.length
    ? data.map(r => `<div class="row ${r.id===curSup?"cur":""}" data-id="${r.id}" data-name="${esc(r.name)}">
         <span>${esc(r.name)}</span></div>`).join("")
    : '<div class="msg">No suppliers match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => {
      openSupplier(el.dataset.id, el.dataset.name);
    };
  });

  sp.render({ range:"#srange", prev:"#sprev", next:"#snext" }, loadSuppliers);
}

/* ── 그 공급처의 제품 ─────────────────────────────────── */
async function loadProducts(){
  const box = document.getElementById("detail");
  if(!curSup){ box.innerHTML = '<div class="card"><div class="msg">Select a supplier.</div></div>'; return; }

  const base = () => sb.from("product_supplier")
      .select("*, product(id,sku,name,is_active,parent_product_id)", { count:"exact" })
      .eq("supplier_id", curSup).eq("is_active", true);

  let qry = base();
  if(onlyDefault) qry = qry.eq("is_default", true);
  if(noPrice)     qry = qry.or("and(cost.is.null,fixed_cost.is.null),and(cost.eq.0,fixed_cost.eq.0)");

  const [{ data, error }, dflt, dead] = await Promise.all([
    pp.run(qry.order("last_supplied", { ascending:false, nullsFirst:false })),
    base().eq("is_default", true).select("id", { count:"exact", head:true }),
    base().or("and(cost.eq.0,fixed_cost.eq.0)").select("id", { count:"exact", head:true }),
  ]);
  if(error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(error.message)}</div></div>`; return; }

  const rows = (data||[]).map(x => {
    const p = x.product || {};
    return `<tr>
      <td class="mono"><a class="lnk" href="products.html?id=${esc(p.id)}">${esc(p.sku)}</a></td>
      <td>${esc(p.name)}${p.parent_product_id ? ' <span class="dim">(set)</span>' : ""}</td>
      <td class="mono">${dim(x.supplier_sku)}</td>
      <td class="num">${x.fixed_cost==null?'<span class="dim">—</span>':esc(x.fixed_cost)}</td>
      <td class="num">${x.cost==null?'<span class="dim">—</span>':esc(x.cost)}</td>
      <td class="mono">${dim(x.last_supplied)}</td>
      <td>${yn(x.is_default, false)}</td>
    </tr>`;
  });


  box.innerHTML = `
    <div class="card">
      <div class="bar">
        <span class="navb">
          <button class="pobtn" id="togList" title="Show or hide the list on the left">&#9776; List</button>
          <button class="pobtn" id="toWide">&lsaquo; All suppliers</button>
        </span>
        <span class="nm">${esc(curName)}</span>
        <span class="sp"></span>
        <label><input type="checkbox" id="onlyDefault" ${onlyDefault?"checked":""}> Default only</label>
        <label><input type="checkbox" id="noPrice" ${noPrice?"checked":""}> No price</label>
        <input type="search" id="pq" value="${esc(pq)}" placeholder="Search SKU or name">
      </div>
      <div class="stats">
        <div class="stat">Products linked<b>${pp.total.toLocaleString()}</b></div>
        <div class="stat">Default here<b>${(dflt.count||0).toLocaleString()}</b></div>
        <div class="stat ${dead.count?"warn":""}">No price<b>${(dead.count||0).toLocaleString()}</b></div>
      </div>
      ${rows.length ? `<table><thead><tr>
          <th>SKU</th><th>Name</th><th>Supplier SKU</th><th>Fixed</th><th>Latest</th><th>Last supplied</th><th>Default</th>
        </tr></thead><tbody>${rows.join("")}</tbody></table>
        <div class="bar"><span class="range" id="prange"></span>
          <span class="sp"></span>
          <button id="pprev">←</button><button id="pnext">→</button></div>`
        : '<div class="msg">No products linked.</div>'}
    </div>`;

  const $ = id => document.getElementById(id);
  $("togList").onclick = () => { const lp = $("listPanel"); lp.hidden = !lp.hidden; };
  $("toWide").onclick = showWide;
  $("onlyDefault").onchange = e => { onlyDefault = e.target.checked; pp.reset(); loadProducts(); };
  $("noPrice").onchange     = e => { noPrice     = e.target.checked; pp.reset(); loadProducts(); };
  if($("prange")) pp.render({ range:"#prange", prev:"#pprev", next:"#pnext" }, loadProducts);

  imsQ("#pq", v => { pq = v; pp.reset(); loadProducts(); }, 300);
  // ⚠️ 제품 이름·SKU 검색은 조인 쪽이라 서버에서 못 건다 — 지금은 받은 페이지 안에서만 거른다
  if(pq){
    const needle = pq.toLowerCase();
    document.querySelectorAll("#detail tbody tr").forEach(tr => {
      if(!tr.textContent.toLowerCase().includes(needle)) tr.remove();
    });
  }
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client; isAdmin = (me.role === "admin");
  imsHeader(me);
  document.getElementById("buildTag").textContent = SPP_BUILD;
  if(isAdmin){ document.getElementById("opts").hidden = false; document.getElementById("wallBox").hidden = false; }

  document.getElementById("showAll").onchange = e => { showAll = e.target.checked; sp.reset(); clearDetail(); loadSuppliers(); };
  imsQ("#sq", v => { sq = v; sp.reset(); clearDetail(); loadSuppliers(); });
  document.getElementById("wall").onchange = e => { showAll = e.target.checked; sp.reset(); loadWide(); };
  imsQ("#wq", v => { sq = v; sp.reset(); loadWide(); });
  try {
    const { data } = await sb.from("ref_currency").select("id,code");
    (data||[]).forEach(c => { curCode[c.id] = c.code; });
  } catch(e) {}

  /* ?id= 는 바로 그 공급처(좁은 모드) · 그 밖은 넓은 목록 */
  const wantId = new URLSearchParams(location.search).get("id");
  if(wantId){
    const { data } = await sb.from("supplier").select("id,name").eq("id", wantId).maybeSingle();
    if(data){ openSupplier(data.id, data.name); return; }
  }
  showWide();
});
</script>
</body>
</html>
