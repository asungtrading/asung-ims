<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Orders · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px)}
  .list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .list .row .l{min-width:0}
  .list .row .pn{font-family:var(--mono);font-size:13px}
  .list .row .sn{font-size:11.5px;color:var(--muted);margin-top:2px;
                 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .r{text-align:right;white-space:nowrap}
  .list .row .amt{font-family:var(--mono);font-size:12.5px}
  .list .row.cur .pn{color:#3b5bdb;font-weight:700}
  main{display:flex;flex-direction:column;gap:14px}
  /* ⚠️ 이름은 공통과 겹치지 않는 것으로 골랐다(§10-j 3-g 의 .note 충돌 선례) */
  .pobar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pobar .pn{font-family:var(--mono);font-size:20px;font-weight:700}
  .pogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:900px){ .pogrid{grid-template-columns:1fr} }
  .posub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;
         border-top:1px solid var(--line)}
  /* 쓰기 — 모달 · 인라인 입력 */
  .pobtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;
         font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .pobtn:hover{background:#f2f4f8}
  .pobtn:disabled{opacity:.45;cursor:default}
  .pobtn.go{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
  .pobtn.go:hover{background:#3550c4}
  .pomodal{position:fixed;inset:0;z-index:5000;background:rgba(16,22,30,.45);
           display:flex;align-items:center;justify-content:center;padding:20px}
  .pomodal[hidden]{display:none}
  .pobox{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:86vh;
         display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,20,30,.28)}
  .pobox h4{margin:0;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .pobox .pbody{padding:14px 16px;overflow:auto;flex:1}
  .pobox .pfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .pobox .pfoot .sp{flex:1}
  .pobox textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;
                  padding:10px;font-family:var(--mono);font-size:12.5px}
  .pobox input[type=search],.pobox input[type=text]{width:100%;border:1px solid var(--line);
                  border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:340px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .qin{width:84px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;
       font-family:var(--mono);font-size:12.5px;text-align:right}
  .qin.pin{width:104px}
  .xbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 7px;
        font:inherit;font-size:12px;cursor:pointer;color:var(--muted)}
  .xbtn:hover{background:#fdf0ef;color:var(--bad);border-color:#f3d3cf}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <button class="pobtn go" id="newPo" style="width:100%">+ New purchase order</button>
      <input type="search" id="q" placeholder="Search PO number or supplier">
      <div class="opts">
        <label>Status
          <select id="st">
            <option value="open">Open</option>
            <option value="draft">Draft</option>
            <option value="confirmed">Confirmed</option>
            <option value="closed">Closed</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a purchase order.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Purchase Orders — ⑤ PO 본체 · 읽기 화면
   정본: docs/design/po-module.md §11(판단) · §13(표·검증) · §10-j(화면 규칙)

   ⭐ 이 화면은 **읽기 전용**이다. 만들기·편집·입고는 다음 차수다.
   ⭐⭐ 뒷단이 둘로 갈려 있다(Caleb 2026-09-16):
        목록  뷰 `po_list`  — 표처럼 보이니 imsPage()·imsQ() 가 그대로 듣는다(§10-j 3-a)
        상세  RPC `po_detail(p_po_id)` — 한 번에 받는다
      ⚠️⚠️ **계산 규칙의 정본은 RPC 다.** 할인 체인 · 미지급 · 총액 대조를 **화면에서 다시 짜지 마라.**
         화면마다 다시 짜면 어긋난다(§13). 여기서는 받은 값을 **그리기만** 한다.

   ⚠️ 알아 둘 것 (전부 §13 의 실측):
     · 할인은 차례로 **곱한다**(더하지 않는다) — 실물에서 4.68 어긋났다
     · 인보이스 미지급은 **총액이 아니라 payable 줄 합**이다 — 운임 줄(is_payable=false)이 빠진다
       [실물 AMP-778812] 청구 2,197.54 인데 갚을 돈은 2,010.54
     · 입고 줄 합이 발주 수량을 **넘을 수 있다**(초과 입고). 넘은 만큼은 원장에 안 간다 — 설계대로다
     · po_line 에 received_qty 칸은 **없다**. 입고 줄 합이다
     · closed 의 뜻은 **입고 종료**다. 비용은 그 뒤에 붙는다 — 닫힌 문서에도 붙는다
     · ⭐ 크레딧 노트는 `po_invoice` 의 `doc_kind='credit'` 이다(별도 표가 아니다).
       **금액은 양수로 담는다** — 공급처 문서에 찍힌 그대로다. 빼는 것은 계산에서 한다.
       [실무] PO 100 · 인보이스 100 · 입고 90 인 공급처가 있다 — 그때 크레딧을 받는다
     · ⚠️ 미지급이 **음수면 받을 돈**이다 — 이미 낸 인보이스에 크레딧이 붙은 경우다. 결함이 아니다

   ⚠️ 색은 절제한다(§10-j 3-e). draft·confirmed 는 정상 진행이라 회색이고,
      closed 만 초록(입고 종료 = 완료 신호) · cancelled 만 빨강이다.
      3-e 의 「색 절제」는 false 가 정상인 불리언 이야기라 여기는 해당하지 않는다.
      진짜 신호는 **입고 진행(received/ordered)** 숫자다.
   ───────────────────────────────────────────────────────────── */

let sb=null, me=null, isAdmin=false;
let q="", stFilter="open", curId=null;
/* ⚠️ 상세 조회를 기다리는 사이 필터가 바뀌면 늦게 도착한 응답이 화면을 덮는다 — 번호로 막는다(§10-j 3-d) */
let detailSeq = 0;
const pg = imsPage(100);

/* ── 값 표시 ───────────────────────────────────────
   ⚠️ 공통 num() 은 escape 만 한다 — 돈 서식은 여기서. */
const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits:2, maximumFractionDigits:2 }));
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits:4 }));

/* ⭐ 미지급이 음수면 **받을 돈**이다 — 이미 낸 인보이스에 크레딧이 붙었다.
   공급처가 우리에게 빚진 것이고 다음 결제에서 덜 내거나 환불받는다(§11-h). */
function unpaidCell(v){
  const n = Number(v);
  if(n === 0) return '<span class="dim">0.00</span>';
  if(n < 0)   return `<span class="on">${money(-n)} credit due</span>`;
  return `<span class="neutral">${money(n)}</span>`;
}

/* ⚠️ 색은 절제한다 — cancelled 만 빨강, closed 만 초록(완료). draft·confirmed 는 회색. */
function stChip(s){
  if(s === "cancelled") return '<span class="chip bad">cancelled</span>';
  if(s === "closed")    return '<span class="chip good">closed</span>';
  return `<span class="chip">${esc(s)}</span>`;
}

/* ⭐ 모체 번호 — PO-02001a → PO-02001. 갈라진 문서를 한 번에 찾는 열쇠다(§11-c 「찾기는 접두어로」) */
const stem = (n) => String(n || "").replace(/[a-z]+$/, "");

function clearDetail(){
  curId = null;
  detailSeq++;   // 날아오던 요청이 있으면 그것도 무효로
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Select a purchase order.</div></div>';
}

/* ── 목록 ─────────────────────────────────────────── */
async function loadList(){
  let qry = sb.from("po_list").select("*", { count:"exact" });
  // ⚠️ 상태 필터는 매니저에게도 보인다 — 발주 목록은 감출 것이 아니다.
  //    §10-j 3-b 의 「admin 만 #opts」는 마스터에서 정돈된 목록을 주기 위한 규칙이고 여기는 그 경우가 아니다.
  if(stFilter === "open")       qry = qry.in("status", ["draft","confirmed"]);
  else if(stFilter !== "all")   qry = qry.eq("status", stFilter);
  // ⚠️ 검색은 서버에서 돈다(§10-j 3-a). 번호와 공급처 이름 둘 다 본다.
  if(q) qry = qry.or(`po_number.ilike.%${q}%,supplier_name.ilike.%${q}%`);

  const { data, error } = await pg.run(qry.order("po_number", { ascending:false }));
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  document.getElementById("rows").innerHTML = data.length ? data.map(r => {
    const tags = [];
    if(r.status === "cancelled") tags.push('<span class="tag off">cancelled</span>');
    else if(r.status === "closed") tags.push('<span class="tag">closed</span>');
    else if(r.status === "draft") tags.push('<span class="tag">draft</span>');
    // ⭐ 갈라진 문서가 있으면 목록에서 보여야 한다 — 없으면 a 를 열어야만 b 를 찾는다
    // ⚠️ tag.disc(황갈색)는 **단종** 색이다 — 빌려 쓰면 목록에서 「단종?」으로 읽힌다. 회색으로 둔다.
    if(Number(r.split_to_count) > 0) tags.push('<span class="tag">split</span>');
    // ⭐ 진짜 신호는 입고 진행이다. 다 받았으면 안 띄운다.
    const recv = (r.status === "confirmed" && Number(r.ordered_qty) > 0)
      ? `<div class="sn">received ${qty(r.received_qty)} / ${qty(r.ordered_qty)}</div>` : "";
    return `<div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <span class="l">
        <div class="pn">${esc(r.po_number)}</div>
        <div class="sn">${esc(r.supplier_name)}</div>
        ${recv}
      </span>
      <span class="r">
        <div class="amt">${money(r.net_total)}</div>
        <div style="margin-top:3px">${tags.join(" ")}</div>
      </span>
    </div>`;
  }).join("") : '<div class="msg">No purchase orders match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

/* ⭐ 갈라진 문서 사이 이동 — 모체 번호를 검색칸에 넣어 a·b·c 가 한 화면에 보이게 한다.
   ⚠️ [실사고 §10-j 3-d] 화면 안 이동에서 검색어를 안 바꾸면 고른 것이 목록에 없어 파란 표시가 사라진다.
   ⚠️ 이것은 **코드가 넣는 값**이라 상세를 비우지 않는다. */
async function gotoPo(poNumber, id){
  q = stem(poNumber);
  document.getElementById("q").value = q;
  stFilter = "all";                                   // 닫힌 문서도 보여야 한다
  document.getElementById("st").value = "all";
  pg.reset();
  if(id){ curId = id; await loadList(); loadDetail(id); return; }
  // id 를 모르는 쪽(split_from) — 목록을 먼저 읽고 번호로 찾는다
  await loadList();
  const el = Array.from(document.querySelectorAll(".list .row"))
    .find(r => r.querySelector(".pn").textContent === poNumber);
  if(!el) return;                                     // 필터 밖이거나 다른 페이지에 있다
  curId = el.dataset.id;
  await loadList();                                   // 파란 표시를 다시 그린다
  loadDetail(curId);
}

/* ══ 쓰기 ═══════════════════════════════════════════════
   ⭐⭐ 나누는 기준(Caleb 2026-09-16): **일이 여럿이면 RPC · 한 가지면 PostgREST.**
     RPC        po_create(초안 · 표 둘) · po_lines_paste(붙여넣기) ·
                po_line_update / po_line_delete(다른 행을 저장 전에 봐야 한다)
     PostgREST  확정 · 취소 · 메모 — 한 칸이면 충분하다. imsSaved() 로 되읽는다(§10-j 3-i)

   ⭐ 확정은 **잠금이 아니다.** 「공급처에 보냈다」는 뜻이다(§11-b 정정 · Caleb 실측).
      확정 뒤에도 라인을 고치고 더한다 — 전화하다 품목이 느는 것이 평소 일이다.
   ⚠️ 막는 것은 둘뿐이고 **DB 가 막는다**(po_line_update / po_line_delete):
        ① 입고가 붙은 라인을 받은 것보다 적게 줄이기
        ② closed · cancelled 문서 고치기
      ⇒ 화면은 그 예외 메시지를 그대로 보여 준다. 화면이 규칙을 따로 갖지 않는다. */

const canEdit = (st) => st === "draft" || st === "confirmed";

function modalOpen(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").hidden = false;
}
function modalClose(){
  document.getElementById("modal").hidden = true;
  document.getElementById("modalBox").innerHTML = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });

/* ⚠️ RPC 오류는 error.message 로 온다 — 함수가 「… nothing was saved」로 끝내 준다.
   화면이 그 문장을 그대로 보여 준다. 다시 쓰지 않는다.
   ⚠️⚠️ [실사고 2026-09-16] 모달 안의 자리에 쓰려다 그 요소가 없어 화면이 죽었고,
      **진짜 오류(RPC 가 뭐라 했는지)가 가려졌다.** 자리가 없으면 alert 로라도 반드시 보여 준다. */
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);          // 자리가 없어도 오류는 삼키지 않는다
}

/* ── 새 발주 ─────────────────────────────────────────
   ⚠️ 공급처 후보는 정돈된 목록이다 — 살아 있고 · 살 수 있고 · 미단종(§10-j 3-b · 2026-09-15 실측 138곳).
      Show all 로 그 바깥도 볼 수 있다(판정이 없는 곳을 발주해야 할 때가 있다). */
async function openNewPo(){
  modalOpen(`
    <h4>New purchase order — pick a supplier</h4>
    <div class="pbody">
      <input type="search" id="supQ" placeholder="Search supplier" autocomplete="off">
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;color:var(--muted)">
        <input type="checkbox" id="supAll"> Show all (including not-purchasable)
      </label>
      <div class="pick" id="supList"><div class="msg">Loading…</div></div>
      <div id="newMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
    </div>`);
  const draw = async () => {
    const all = document.getElementById("supAll").checked;
    const t = document.getElementById("supQ").value.trim();
    let qy = sb.from("supplier").select("id,name,payment_term_name,is_purchasable,is_active").eq("is_active", true);
    if(!all) qy = qy.eq("is_purchasable", true).eq("is_discontinued", false);
    if(t) qy = qy.ilike("name", `%${t}%`);
    const { data, error } = await qy.order("name").limit(60);
    const box = document.getElementById("supList");
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(r => `
      <div class="prow" data-sid="${r.id}">${esc(r.name)}
        <span class="dim" style="font-size:11.5px"> · ${esc(r.payment_term_name || "")}</span>
        ${r.is_purchasable ? "" : '<span class="tag" style="margin-left:6px">not purchasable</span>'}
      </div>`).join("") : '<div class="msg">No suppliers match.</div>';
    box.querySelectorAll(".prow").forEach(el => { el.onclick = () => createPo(el.dataset.sid); });
  };
  document.getElementById("supAll").onchange = draw;
  imsQ("#supQ", draw);
  draw();
}

async function createPo(supplierId){
  say("newMsg", "", "Creating…");
  // ⚠️ created_by 를 화면이 주지 않는다 — 함수가 auth.uid() 로 찾는다.
  //    anon key 가 공개라 화면이 주면 아무 id 나 줄 수 있다(§10-h).
  const { data, error } = await sb.rpc("po_create", { p_supplier_id: supplierId });
  if(error){ say("newMsg", "err", error.message); return; }
  if(!data || !data.id){ say("newMsg", "err", "po_create returned nothing — nothing was saved."); return; }
  modalClose();
  // ⭐ 새 문서는 draft 라 Open 필터에 걸린다. 검색칸에 번호를 넣어 목록에 확실히 띄운다(§10-j 3-d ②)
  q = data.po_number; document.getElementById("q").value = q;
  stFilter = "all"; document.getElementById("st").value = "all";
  pg.reset(); curId = data.id;
  await loadList(); loadDetail(curId);
  if((data.warnings || []).length)
    setTimeout(() => alert("Created " + data.po_number + "\n\n⚠ " + data.warnings.join("\n⚠ ")), 50);
}

/* ── 붙여넣기 ─────────────────────────────────────────
   ⭐ [실무] 50줄 넘는 발주가 꽤 된다(Caleb) — 하나씩 골라 넣는 방식은 안 된다.
   ⭐ 열쇠는 **우리 SKU** 다 — 공급처 SKU 는 다 갱신돼 있지 않고 아예 없는 공급처도 있다(Caleb).
   ⭐⭐ 미리 보기가 반드시 있다(Caleb). 붙여넣는 데이터는 밖에서 온다 —
        옛 SKU · 공백 · 칸 밀림이 있고, 50줄이 잘못 들어가면 하나씩 찾아 지워야 한다.
   ⚠️ 미리 보기에서 **고치지 않는다.** 원본을 고쳐 다시 붙이는 것이 낫다(화면이 단순해진다). */
function openPaste(){
  modalOpen(`
    <h4>Paste lines — one per row: SKU then quantity</h4>
    <div class="pbody">
      <textarea id="pasteBox" placeholder="ABE50205	10&#10;HBE00245	500&#10;…&#10;&#10;탭 · 쉼표 · 여러 칸 공백 — 다 됩니다."></textarea>
      <div id="pasteOut" style="margin-top:12px"></div>
    </div>
    <div class="pfoot">
      <span id="pasteMsg" style="font-size:12.5px"></span><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn" id="pasteChk">Check</button>
      <button class="pobtn go" id="pasteGo" disabled>Add lines</button>
    </div>`);
  document.getElementById("pasteChk").onclick = () => runPaste(false);
  document.getElementById("pasteGo").onclick  = () => runPaste(true);
}

/* ⚠️ 붙여넣기 칸을 SKU 와 수량으로 가른다. 탭 · 쉼표 · 여러 칸 공백을 다 받는다.
   ⚠️ SKU 안쪽 공백·철자는 손대지 않는다 — SKU 정정은 적재 전에 끝난 일이다(§3-f). */
function parsePaste(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,|\s{2,}|\s+/);
    const qty = p.length > 1 ? p[p.length - 1] : "";
    const sku = p.slice(0, Math.max(1, p.length - 1)).join(" ");
    return { sku: sku, qty: Number(String(qty).replace(/[, ]/g, "")) };
  });
}

const VERDICT = {
  ok:        ["on",      "ok"],
  no_link:   ["neutral", "no link — price 0"],
  not_found: ["off",     "not found"],
  duplicate: ["off",     "duplicate"],
  exists:    ["off",     "already on this PO"],
  bad_qty:   ["off",     "bad quantity"],
};

async function runPaste(commit){
  const rows = parsePaste(document.getElementById("pasteBox").value);
  const msg = document.getElementById("pasteMsg");
  if(!rows.length){ msg.className = "err"; msg.textContent = "Nothing to read."; return; }
  msg.className = ""; msg.textContent = commit ? "Adding…" : "Checking…";

  const { data, error } = await sb.rpc("po_lines_paste",
    { p_po_id: curId, p_lines: rows, p_commit: commit });
  if(error){ msg.className = "err"; msg.textContent = error.message; return; }

  const s = data.summary;
  msg.className = "";
  msg.textContent = s.too_many ? s.message
    : `${s.total} rows · ok ${s.ok} · no link ${s.no_link} · not found ${s.not_found}`
      + (s.duplicate ? ` · duplicate ${s.duplicate}` : "")
      + (s.exists ? ` · already there ${s.exists}` : "")
      + (s.bad_qty ? ` · bad qty ${s.bad_qty}` : "")
      + (commit ? ` · added ${s.inserted}` : "");

  document.getElementById("pasteOut").innerHTML = `
    <table><thead><tr>
      <th class="num">#</th><th>SKU</th><th>Product</th><th class="num">Qty</th>
      <th class="num">Price</th><th>Verdict</th><th>Note</th></tr></thead>
    <tbody>${data.lines.map(l => {
      const v = VERDICT[l.verdict] || ["dim", l.verdict];
      return `<tr>
        <td class="num">${esc(l.n)}</td>
        <td class="mono">${esc(l.input_sku)}</td>
        <td>${dim(l.product_name)}</td>
        <td class="num">${qty(l.input_qty)}</td>
        <td class="num">${l.unit_price === null || l.unit_price === undefined ? '<span class="dim">—</span>'
            : money(l.unit_price) + (l.price_source && l.price_source !== "none"
               ? ` <span class="dim">${esc(l.price_source)}</span>` : "")}</td>
        <td><span class="${v[0]}">${esc(v[1])}</span></td>
        <td class="dim" style="font-size:11.5px">${esc(l.message || "")}</td>
      </tr>`;
    }).join("")}</tbody></table>`;

  // ⭐ 넣을 것이 있을 때만 Add 를 연다 — 판정이 전부 못 넣는 것이면 누를 이유가 없다
  document.getElementById("pasteGo").disabled = s.too_many || (s.ok + s.no_link) === 0;
  if(commit){
    document.getElementById("pasteGo").disabled = true;
    await loadList(); await loadDetail(curId);
  }
}

/* ── 라인 한 줄 고치기 ─────────────────────────────────
   ⭐ 표 안에서 바로 고친다(Caleb) — 50줄짜리를 하나씩 눌러 들어가면 느리다.
   ⚠️ 고치면 합계가 바뀌므로 상세를 다시 읽는다. 스크롤 자리는 지킨다. */
async function saveLine(inp, lineId, field){
  const prev = inp.dataset.prev;
  const val = Number(inp.value);
  if(!isFinite(val) || inp.value.trim() === ""){ inp.value = prev; return; }
  if(String(val) === String(Number(prev))) return;           // 안 바뀌었다
  inp.disabled = true;
  const patch = {}; patch[field] = val;
  const { error } = await sb.rpc("po_line_update", { p_line_id: lineId, p_patch: patch });
  inp.disabled = false;
  if(error){ inp.value = prev; alert(error.message); return; }
  inp.dataset.prev = String(val);
  const y = window.scrollY;
  await loadDetail(curId); await loadList();
  window.scrollTo(0, y);
}

async function deleteLine(lineId, sku){
  if(!confirm(`Remove ${sku} from this purchase order?`)) return;
  const { error } = await sb.rpc("po_line_delete", { p_line_id: lineId });
  if(error){ alert(error.message); return; }
  const y = window.scrollY;
  await loadDetail(curId); await loadList();
  window.scrollTo(0, y);
}

/* ── 확정 · 취소 ───────────────────────────────────────
   ⚠️ 한 칸씩이라 PostgREST 로 한다. imsSaved() 로 되읽어 0행을 잡는다(§10-j 3-i). */
async function setStatus(id, to){
  const label = { confirmed:"Confirm (sent to supplier)", cancelled:"Cancel this purchase order" }[to];
  if(!confirm(label + "?")) return;
  const patch = { status: to };
  if(to === "confirmed"){ patch.confirmed_at = new Date().toISOString(); patch.confirmed_by = me.id; }
  if(to === "cancelled") patch.cancelled_at = new Date().toISOString();
  const res = await imsSaved(sb.from("po").update(patch).eq("id", id).select("id,status"));
  if(!res.ok){ alert(res.reason); return; }
  await loadList(); await loadDetail(id);
}

/* ── 상세 ─────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  // ⭐ 조회 한 번이면 끝난다 — 머리·라인·할인·입고·인보이스·비용·결제가 다 들어 있다
  const { data, error } = await sb.rpc("po_detail", { p_po_id: id });
  if(seq !== detailSeq) return;                        // 그 사이 다른 요청이 들어왔다
  if(error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(error.message)}</div></div>`; return; }
  // ⚠️ 없는 id 는 null 이 온다(빈 객체가 아니다) — RPC 가 그렇게 돌려준다
  if(!data){ box.innerHTML = '<div class="card"><div class="msg">That purchase order is gone.</div></div>'; return; }

  const h = data.header, t = data.totals || {};
  const cur = h.currency_code ? ` <span class="dim">${esc(h.currency_code)}</span>` : "";

  /* ⭐ 고칠 수 있는 상태인가 — draft · confirmed 는 고친다. closed · cancelled 는 못 고친다.
     ⚠️ 이것은 **편의**다. 진짜로 막는 것은 DB(po_line_update / po_line_delete)다.
     ⚠️⚠️ [실사고 2026-09-16] 이 줄을 라인 표 앞에 두었더니 그보다 먼저 있는 버튼 줄(acts)이
        선언 전에 읽어 상세가 통째로 멈추고 「Loading…」이 남았다.
        ⇒ **화면 조각이 쓰는 값은 그 조각보다 위에서 선언한다.** */
  const ed = canEdit(h.status);

  /* 머리 */
  /* ⭐ 할 수 있는 일 — 상태에 따라 갈린다.
     ⚠️ 확정은 잠금이 아니다(§11-b 정정). 확정 뒤에도 붙여넣기·수정이 열려 있다. */
  const acts = [];
  if(h.status === "draft") acts.push('<button class="pobtn go" data-act="confirm">Confirm &mdash; sent to supplier</button>');
  if(ed){
    acts.push('<button class="pobtn" data-act="paste">Paste lines</button>');
    acts.push('<button class="pobtn" data-act="cancel">Cancel PO</button>');
  }

  const chips = [stChip(h.status)];
  if(h.split_from_number) chips.push(`<span class="chip">split from ${esc(h.split_from_number)}</span>`);
  if((h.split_to || []).length) chips.push(`<span class="chip">split into ${h.split_to.length}</span>`);

  const kvL = [
    ["Supplier",      esc(h.supplier_name)],
    ["Order date",    dim(h.order_date)],
    ["Payment term",  dim(h.payment_term_name)],
    ["Ship to",       dim(h.ship_to_warehouse)],
  ];
  const kvR = [
    ["Currency",      `<span class="mono">${dim(h.currency_code)}</span>` +
                      (h.exchange_rate ? ` <span class="dim">@ ${esc(h.exchange_rate)}</span>` : "")],
    ["Created by",    dim(h.created_by_name) + (h.created_at ? ` <span class="dim">· ${imsTs(h.created_at)}</span>` : "")],
    ["Confirmed by",  dim(h.confirmed_by_name) + (h.confirmed_at ? ` <span class="dim">· ${imsTs(h.confirmed_at)}</span>` : "")],
    // ⚠️ closed 는 「입고 종료」다 — 비용은 그 뒤에도 붙는다(§13)
    ["Closed",        h.closed_at ? imsTs(h.closed_at) : (h.cancelled_at ? `<span class="off">cancelled ${imsTs(h.cancelled_at)}</span>` : '<span class="dim">—</span>')],
  ];
  const kvTbl = (rows) => `<table class="kv"><tbody>${
    rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  /* ⭐ 진짜 신호 넷 — 소계 · 할인 후 · 붙은 비용 · 입고 진행 */
  // ⚠️ 초안(draft)은 아직 받을 때가 아니다 — 경고로 칠하지 않는다(목록의 recv 와 같은 조건)
  const shortQty = h.status === "confirmed" && Number(t.received_qty) < Number(t.ordered_qty);
  const stats = `
    <div class="stats">
      <div class="stat">Subtotal<b>${money(t.subtotal)}</b></div>
      <div class="stat">Discount<b>${t.discount_amount ? "−"+money(t.discount_amount) : money(0)}</b></div>
      <div class="stat">Net<b>${money(t.net_total)}</b></div>
      <div class="stat">Charges added<b>${money(t.charge_total)}</b></div>
      <div class="stat ${shortQty ? "warn" : ""}">Received<b>${qty(t.received_qty)} / ${qty(t.ordered_qty)}</b></div>
    </div>`;

  /* 라인 — ⭐ 표 안에서 바로 고친다(수량 · 단가) */
  const lines = (data.lines || []).map(l => {
    const over = Number(l.remaining_qty) < 0;
    const unit = l.entered_unit_sku
      ? `<div class="dim" style="font-size:11.5px">entered ${qty(l.entered_qty)} × ${esc(l.entered_unit_sku)} (×${esc(l.entered_pack_factor)})</div>`
      : "";
    return `<tr>
      <td class="num">${esc(l.line_no)}</td>
      <td><span class="mono">${esc(l.sku)}</span><div class="dim" style="font-size:11.5px">${esc(l.product_name)}</div>${unit}</td>
      <td class="mono">${dim(l.supplier_sku)}</td>
      <td class="num">${ed ? `<input class="qin" type="number" step="any" min="0" value="${esc(l.qty_ea)}" data-prev="${esc(l.qty_ea)}" data-line="${l.id}" data-f="qty_ea">` : qty(l.qty_ea)}</td>
      <td class="num">${ed ? `<input class="qin pin" type="number" step="any" min="0" value="${esc(l.unit_price)}" data-prev="${esc(l.unit_price)}" data-line="${l.id}" data-f="unit_price">` : money(l.unit_price)}</td>
      <td class="num">${money(l.amount)}</td>
      <td class="num">${qty(l.received_qty)}</td>
      <td class="num">${over ? `<span class="off">+${qty(-l.remaining_qty)}</span>`
                             : (Number(l.remaining_qty) > 0 ? `<span class="neutral">${qty(l.remaining_qty)}</span>` : '<span class="dim">0</span>')}</td>
      ${ed ? `<td><button class="xbtn" data-del="${l.id}" data-sku="${esc(l.sku)}" title="Remove line">&#10005;</button></td>` : ""}
    </tr>`;
  });

  /* 할인 — ⚠️ 차례로 곱한다. 화면은 RPC 가 준 결과를 그리기만 한다 */
  const disc = (data.discounts || []).map(d => `<tr>
      <td class="num">${esc(d.seq)}</td>
      <td>${esc(d.name)}</td>
      <td class="num">${esc(d.percent)}%</td>
      <td>${d.supplier_discount_id ? '<span class="dim">from supplier</span>' : '<span class="dim">added here</span>'}</td>
    </tr>`);

  /* 입고 — ⭐ 한 라인이 여러 빈으로 나뉜다(실물) */
  const recs = (data.receipts || []).map(r => `<tr>
      <td class="num">${esc(r.line_no)}</td>
      <td class="mono">${esc(r.sku)}</td>
      <td class="num">${qty(r.qty_ea)}</td>
      <td class="mono">${esc(r.bin_name)}</td>
      <td>${dim(r.warehouse_name)}</td>
      <td>${dim(r.received_on)}</td>
      <td>${dim(r.received_by_name)}</td>
    </tr>`);

  /* 인보이스 — ⚠️ 미지급은 총액이 아니라 payable 줄 합이다 */
  const invs = (data.invoices || []).map(i => {
    const bad = Number(i.diff) !== 0;
    return `<tr>
      <td class="mono">${esc(i.invoice_number)}</td>
      <td>${dim(i.invoice_date)}</td>
      <td>${dim(i.due_date)}</td>
      <td class="num">${money(i.total_amount)}</td>
      <td class="num">${bad ? `<span class="off">${money(i.computed_total)}</span>` : money(i.computed_total)}</td>
      <td class="num">${bad ? `<span class="off">${money(i.diff)}</span>` : '<span class="dim">0.00</span>'}</td>
      <td class="num">${money(i.payable_net)}</td>
      <td class="num">${money(i.paid)}</td>
      <td class="num">${Number(i.credit_total) > 0 ? `<span class="neutral">${money(i.credit_total)}</span>` : '<span class="dim">—</span>'}</td>
      <td class="num">${unpaidCell(i.unpaid)}</td>
      <td class="num"><span class="dim">${esc(i.lines_for_this_po)}/${esc(i.line_count)}</span></td>
    </tr>`;
  });

  /* 크레딧 — ⭐ po_invoice 의 doc_kind='credit'. 인보이스와 같은 표·같은 줄 구조다.
     ⚠️ warnings 는 RPC 가 잡는다 — 다른 행을 봐야 하는 규칙이라 DB 제약으로 못 건다 */
  const creds = (data.credits || []).map(c => {
    const bad = Number(c.diff) !== 0;
    const w = c.warnings || [];
    return `<tr>
      <td><span class="mono">${esc(c.credit_number)}</span>${w.length?`<div class="off" style="font-size:11.5px">⚠ ${esc(w.join(" · "))}</div>`:""}</td>
      <td>${dim(c.credit_date)}</td>
      <td class="mono">${c.credit_for_number ? esc(c.credit_for_number) : '<span class="dim">unattached</span>'}</td>
      <td class="num">${money(c.total_amount)}</td>
      <td class="num">${bad ? `<span class="off">${money(c.diff)}</span>` : '<span class="dim">0.00</span>'}</td>
      <td class="num">${money(c.credit_net)}</td>
      <td class="num">${Number(c.used) > 0 ? money(c.used) : '<span class="dim">—</span>'}</td>
      <td class="num">${(c.remaining === null || c.remaining === undefined) ? '<span class="dim">—</span>' : `<span class="neutral">${money(c.remaining)}</span>`}</td>
      <td class="num"><span class="dim">${esc(c.lines_for_this_po)}/${esc(c.line_count)}</span></td>
    </tr>`;
  });

  /* 비용 — ⭐ 한 청구서가 발주 여럿에 걸친다. alloc 이 이 발주 몫이다 */
  const chgs = (data.charges || []).map(c => `<tr>
      <td><span class="mono">${esc(c.charge_number)}</span>${c.description?`<div class="dim" style="font-size:11.5px">${esc(c.description)}</div>`:""}</td>
      <td><span class="tag">${esc(c.kind)}</span></td>
      <td>${esc(c.supplier_name)}</td>
      <td>${dim(c.charge_date)}</td>
      <td class="num">${money(c.alloc_amount)}</td>
      <td class="num"><span class="dim">${money(c.total_amount)}</span></td>
      <td class="num">${Number(c.unpaid) === 0 ? '<span class="dim">0.00</span>' : `<span class="neutral">${money(c.unpaid)}</span>`}</td>
    </tr>`);

  /* 결제 — ⭐ 인보이스와 비용 문서 둘 다 가리킨다 */
  const pays = (data.payments || []).map(p => `<tr>
      <td class="mono">${dim(p.reference)}</td>
      <td>${dim(p.paid_on)}</td>
      <td><span class="tag">${esc(p.target_kind)}</span> <span class="mono">${esc(p.target_number)}</span></td>
      <td class="num">${money(p.amount)} <span class="dim">${esc(p.currency_code)}</span></td>
      <td class="num">${Number(p.discount_taken) > 0 ? `<span class="neutral">${money(p.discount_taken)}</span>` : '<span class="dim">—</span>'}</td>
      <td class="num">${money(p.alloc_amount)}</td>
      <td>${dim(p.account_name)}</td>
      <td>${dim(p.paid_by_name)}</td>
    </tr>`);

  const tbl = (title, n, head, rows, sub) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(x=>`<th${x[1]?' class="'+x[1]+'"':''}>${x[0]}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>${sub?`<div class="posub">${sub}</div>`:""}`
      : `<div class="msg">None.</div>`}
    </div>`;

  if(seq !== detailSeq) return;
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="pobar">
          <span class="pn">${esc(h.po_number)}</span>
          <span class="chips">${chips.join("")}</span>
        </div>
        ${(h.split_from_number || (h.split_to||[]).length) ? `<div style="margin-top:8px;font-size:12.5px">
          ${h.split_from_number ? `<a class="lnk" data-goto="${esc(h.split_from_number)}">← ${esc(h.split_from_number)}</a>` : ""}
          ${(h.split_to||[]).map(s=>`<a class="lnk" data-goto="${esc(s.po_number)}" data-id="${s.id}" style="margin-left:10px">${esc(s.po_number)} →</a>`).join("")}
        </div>` : ""}
        ${acts.length ? `<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>` : ""}
      </div>
      ${stats}
      <div class="pogrid">${kvTbl(kvL)}${kvTbl(kvR)}</div>
      ${h.note ? `<div class="note">${esc(h.note)}</div>` : ""}
    </div>

    ${tbl("Lines", (data.lines||[]).length,
      [["#","num"],["Product",""],["Supplier SKU",""],["Qty","num"],["Unit price","num"],
       ["Amount","num"],["Received","num"],["Remaining","num"]].concat(ed ? [["",""]] : []), lines,
      "⚠️ Remaining 이 음수(빨강)면 주문보다 많이 받은 것이다 — 넘은 만큼은 재고에 안 들어간다." +
      (ed ? " 수량·단가는 칸에서 바로 고친다. 받은 것보다 적게 줄이는 것은 DB 가 막는다." : ""))}

    ${tbl("Discounts", (data.discounts||[]).length,
      [["Seq","num"],["Name",""],["Percent","num"],["Source",""]], disc,
      `차례로 곱한다 — subtotal ${money(t.subtotal)} × factor ${esc(Number(t.discount_factor))} = ${money(t.net_total)}`)}

    ${tbl("Receipts", (data.receipts||[]).length,
      [["#","num"],["SKU",""],["Qty","num"],["Bin",""],["Warehouse",""],["Date",""],["By",""]], recs,
      "한 라인이 여러 빈으로 나뉠 수 있다.")}

    ${tbl("Invoices", (data.invoices||[]).length,
      [["Number",""],["Date",""],["Due",""],["Printed","num"],["Computed","num"],["Diff","num"],
       ["Payable","num"],["Paid","num"],["Credit","num"],["Unpaid","num"],["Lines","num"]], invs,
      "⚠️ Payable 은 청구 총액이 아니다 — 안 낼 줄(운임 등)이 빠진 값이다. Diff 가 0 이 아니면 찍힌 총액과 계산이 다르다. " +
      "Unpaid 가 credit due 면 받을 돈이다 — 이미 낸 뒤에 크레딧이 붙었다.")}

    ${tbl("Credits", (data.credits||[]).length,
      [["Number",""],["Date",""],["For",""],["Amount","num"],["Diff","num"],
       ["Net","num"],["Used","num"],["Remaining","num"],["Lines","num"]], creds,
      "금액은 양수로 담는다 — 공급처 문서에 찍힌 그대로다. 빼는 것은 계산에서 한다. " +
      "For 가 unattached 면 아직 어느 인보이스에도 안 붙은 크레딧이고, Remaining 이 다음 결제에서 쓸 수 있는 금액이다.")}

    ${tbl("Charges", (data.charges||[]).length,
      [["Number",""],["Kind",""],["Supplier",""],["Date",""],["Allocated here","num"],["Charge total","num"],["Unpaid","num"]], chgs,
      "한 청구서가 발주 여럿에 걸친다 — Allocated here 가 이 발주 몫이다.")}

    ${tbl("Payments", (data.payments||[]).length,
      [["Reference",""],["Date",""],["Target",""],["Paid","num"],["Discount","num"],["Applied","num"],["Account",""],["By",""]], pays,
      "Paid + Discount = Applied. 인보이스와 비용 청구서 둘 다 결제 대상이다.")}
  `;

  // 갈라진 문서로 이동 — 모체 번호를 검색칸에 넣는다
  document.querySelectorAll("[data-goto]").forEach(a => {
    a.onclick = () => gotoPo(a.dataset.goto, a.dataset.id || null);
  });

  // 쓰기 배선
  box.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      if(b.dataset.act === "paste")   openPaste();
      if(b.dataset.act === "confirm") setStatus(h.id, "confirmed");
      if(b.dataset.act === "cancel")  setStatus(h.id, "cancelled");
    };
  });
  if(ed){
    // ⚠️ change 로 건다 — 타자마다 저장하면 50줄에서 조회가 쏟아진다
    box.querySelectorAll("input[data-line]").forEach(inp => {
      inp.onchange = () => saveLine(inp, inp.dataset.line, inp.dataset.f);
    });
    box.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => deleteLine(b.dataset.del, b.dataset.sku);
    });
  }
}

/* ── 시작 ─────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  imsHeader(me);

  document.getElementById("newPo").onclick = openNewPo;
  document.getElementById("st").onchange = e => {
    stFilter = e.target.value; pg.reset(); clearDetail(); loadList();
  };
  imsQ("#q", v => { q = v; pg.reset(); clearDetail(); loadList(); });

  // ⭐ ?po=PO-02001a 로 들어오면 모체 번호를 검색칸에 넣고 그 문서를 연다(§10-j 3-d ③ 실사고)
  const want = imsParam("po");
  if(want){
    q = stem(want);
    document.getElementById("q").value = q;
    stFilter = "all";
    document.getElementById("st").value = "all";
    await loadList();
    const el = Array.from(document.querySelectorAll(".list .row"))
      .find(r => r.querySelector(".pn").textContent === want);
    if(el){ curId = el.dataset.id; await loadList(); loadDetail(curId); }
    // ⚠️ 못 찾으면 조용히 목록만 남는다 — 지워진 문서거나 오타다. 사람이 알아야 한다.
    else document.getElementById("detail").innerHTML =
      `<div class="card"><div class="msg">${esc(want)} not found.</div></div>`;
    return;
  }

  await loadList();
});
</script>
