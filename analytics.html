<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* an v1 — Analytics(판정 1282 · 1287 ~ 1292 · 1297) · 색은 공통 변수(다크 모드 함께) */
  .anwrap{max-width:1320px;margin:0 auto;padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
  .antop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .antop h1{margin:0 8px 0 0;font-size:21px;font-weight:800;color:var(--ink)}
  .antop .sp{flex:1}
  .antop select,.antop input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
  .antop input[type=month]{width:150px}
  .antabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
  .antabs a{padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
  .antabs a.cur{color:var(--ims-brand);border-bottom-color:var(--ims-brand)}
  .anmsg{padding:30px 20px;text-align:center;color:var(--muted)}
  .anmsg b{display:block;color:var(--ink);margin-bottom:4px}
  .anload{font-size:12px;color:var(--muted)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .kpi{padding:12px 14px}
  .kpi .l{font-size:12px;color:var(--muted)}
  .kpi .v{font-size:22px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi .c{font-size:12.5px;margin-top:2px;color:var(--muted)}
  .kpi .c .up{color:var(--good);font-weight:700} .kpi .c .dn{color:var(--bad);font-weight:700}

  .ancard{padding:0}
  .ancard h3{margin:0;padding:10px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ancard h3 .sub{font-weight:400;color:var(--muted);font-size:12.5px}
  .ancard h3 .sp{flex:1}
  .ancard .body{padding:12px 14px;overflow-x:auto}
  .csvb{border:1px solid var(--line);background:var(--ims-surface);color:var(--ink);border-radius:7px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
  .csvb:hover{background:var(--ims-hover)}
  .ancard table{width:100%}
  .ancard td.r,.ancard th.r{text-align:right;font-variant-numeric:tabular-nums}
  .ancard td.nd{color:var(--ims-dim);text-align:center}
  .yt td,.yt th{white-space:nowrap;font-size:12.5px}
  .yt td.cut{background:color-mix(in srgb,var(--accent) 10%,var(--ims-surface))}
  .yt .pv{display:block;font-size:11px;color:var(--muted)}
  .share{display:inline-block;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 55%,var(--ims-surface));vertical-align:middle;margin-right:6px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .ancard .dim,.ancard tr.dim td{color:var(--muted)}   /* an v4 손님 탭 */
  .ancard .up{color:var(--good);font-weight:700} .ancard .dn{color:var(--bad);font-weight:700}
  .badge.risk{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent)}   /* an v5 */
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12px;font-weight:400}
  .seg2 a{padding:3px 9px;color:var(--ink);text-decoration:none} .seg2 a.cur{background:var(--accent);color:var(--ims-on-accent, #fff)}
  .ancard .tog{text-decoration:none;color:var(--muted);display:inline-block;width:14px}
  .ancard tr.kid td{font-size:12.5px}
  .badge.new{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:9px;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
  .ancard a.lnk{color:var(--accent);text-decoration:none} .ancard a.lnk:hover{text-decoration:underline}
  @media (max-width:900px){ .two{grid-template-columns:1fr} }
  /* an v8 — 제품 탭(판정 1523) */
  .pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;font-size:12.5px;color:var(--muted)}
  .pbar select{border:1px solid var(--line);border-radius:7px;padding:3px 7px;font:inherit;font-size:12.5px;background:var(--ims-surface);color:var(--ink)}
  .pnote{padding:8px 14px;font-size:12.5px;color:var(--muted)}
  .pwarn{padding:10px 14px;font-size:13px;color:var(--ink);border-left:3px solid var(--warn)}
  .kpi .v .sm{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
  .heat td,.heat th{white-space:nowrap;font-size:12.5px}
  .heat td.c{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);min-width:62px}
  .heat td.c.hi{color:var(--ims-on-ink)}
  .heat td.c.open{opacity:.6;font-style:italic}
  .heat td.c.no{background:var(--ims-surface-2);color:var(--ims-dim);text-align:center}
  .heat th.mh{text-align:right}
  .two.pw{grid-template-columns:1fr 1fr}
  @media (max-width:1500px){ .two.pw{grid-template-columns:1fr} }
  .ancard td.nw{white-space:nowrap}
  .chart .bar.st-pre{fill:var(--ims-dim)}
  .chart .bar.st-new{fill:var(--accent)}
  .chart .bar.st-later,.chart .bar.st-none{fill:color-mix(in srgb,var(--accent) 45%,var(--ims-surface))}

  /* 그래프(SVG) */
  .chart svg{display:block;width:100%;height:auto}
  .chart .bar{fill:color-mix(in srgb,var(--accent) 70%,var(--ims-surface))}
  .chart .bar.core{fill:color-mix(in srgb,var(--accent) 45%,var(--ims-surface))}
  .chart .bar.ims{fill:var(--accent)}
  .chart .bar.partial{opacity:.55}
  .chart .axis{stroke:var(--line);stroke-width:1}
  .chart .grid{stroke:var(--ims-line-soft);stroke-width:1}
  .chart text{fill:var(--muted);font-size:10.5px;font-family:inherit}
  .chart .gp{fill:none;stroke:var(--good);stroke-width:2}
  .chart .gpdot{fill:var(--good)}
  .chart .yl{fill:none;stroke-width:2}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ims-on-ink);font-size:12px;padding:6px 9px;border-radius:7px;z-index:5000;white-space:nowrap}

  .brk{display:flex;align-items:stretch;flex-wrap:wrap;gap:0;padding:0}
  .brk .it{padding:10px 14px;min-width:130px}
  .brk .it .l{font-size:12px;color:var(--muted)}
  .brk .it .v{font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
  .brk .it.tot .v{font-size:19px;font-weight:800}
  .brk .op{display:flex;align-items:center;padding:0 4px;font-size:18px;color:var(--muted)}
  .brk .nt{flex-basis:100%;padding:0 14px 10px;font-size:12px;color:var(--muted)}
  .gaps li{margin:3px 0;font-size:13px}
  .gaps .code{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}

  @media print{
    header,.antop .noprint,.antabs,.csvb,#tip{display:none!important}
    .anwrap{max-width:none;padding:0}
    .ancard,.kpi{break-inside:avoid}
    /* 다크 모드에서 인쇄해도 흰 바탕(판정 1289) */
    html[data-theme="dark"]:is([data-ims-mode="ims"],[data-ims-mode="pos"]){
      color-scheme:light;--bg:#fff;--line:#d9dee5;--muted:#5b6574;--ink:#12161c;--accent:#2f6df6;--good:#16a34a;--bad:#c92a2a;--warn:#b7791f;
      --ims-surface:#fff;--ims-surface-2:#f7f8fa;--ims-hover:#f2f4f8;--ims-line-soft:#eef0f4;--ims-dim:#9aa4b2;--ims-brand:#3b5bdb;--ims-sel-bg:#eef3ff;--ims-on-ink:#fff;--ims-logo-filter:none}
    body{background:#fff}
  }
</style>
</head>

<script>
/* ─────────────────────────────────────────────────────────────
   analytics.html — 분석 화면 (an v1 · 2026-11-16 · 대화 Claude)
   판정 1282: 분석은 따로 된 화면 · 판정 1287 · 1292-2: 열쇠 analytics(admin 도 켜야 열림) · GP · 원가는 원가 권한 있는 사람만(창구가 키를 뺀다)
   판정 1288: 첫 탭 = 매출 개요(연도 비교 · 월 추세 · 지점 · 브랜드 · 빈 곳) · 판정 1289: 표 · 그래프마다 CSV + 화면 전체 PDF(인쇄 · 다크여도 흰 바탕)
   판정 1290: 탭이 늘어나는 틀 — TABS 에 한 줄 + 창구 하나(an_<탭>) · 탭마다 주소 #<탭> · 고르기(기간 · 지점 · 브랜드)는 탭이 같이 씀 · 누를 때만 읽는다
   판정 1292 · 1297: 매출 = 제품 줄 · 세전 · CAD · 크레딧은 크레딧 날짜 · 오더 = 제품 줄 있는 오더 · Not recorded 지점 · 이번 달 · 연 누계는 오늘까지 잘라 지난해 같은 날과
   창구: an_overview(p_from, p_to, p_warehouse, p_brand) — an-1c · 20261116130000
   창구(an v3): an_period(p_from, p_to, p_prev_from, p_prev_to, p_ly_from, p_ly_to, p_warehouse, p_brand) — an-3 · 20261117001000 · 주 · 월 기간(날짜 그대로 · 비교 두 범위) · 회계연도 · 달력 해의 지난해 끝 덜 찬 달
   창구(an v8): an_products(p_from, p_to, p_prev_from, p_prev_to, p_ly_from, p_ly_to, p_warehouse, p_brand, p_category, p_channel, p_new_n, p_limit) · an_product(p_product, p_from, p_to, p_prev_*, p_ly_*, p_warehouse, p_new_n) — pr-2 · 20261122010000 · p_channel 은 null 만(채널 차수 뒤)
   ⚠️ year_by_month 의 null = 「자료 없음」(0 으로 그리지 마라) · Not recorded 줄의 GP % 는 감춘다(대부분 크레딧 · an-1c 이견 8)
   ───────────────────────────────────────────────────────────── */
const AN_BUILD = "2026-11-22 · an v8a";   // an v8a — Caleb 캡처: 카테고리 표가 반쪽 카드에서 오른쪽이 잘림 → 제품 탭의 두 칸 줄(.two.pw)은 1500px 아래에서 위아래로 쌓는다(110% 확대) · 몫 칸 줄바꿈 금지 · 코호트 제목에 「all history」(pr-2 보고의 2026-10 예와 This year 화면의 Q3 2025 Month 1 이 같은 $55k · 기간을 안 탄다) ← an v8   // an v8 — 제품 탭(Products · #products · 판정 1522 ~ 1524 · asung-wms pr-2 0c6c53b · an_products · an_product): 머리 숫자 넷(신제품 매출 몫 · 팔린 신제품 수 = 제품 수 크게 · 가족 수 작게 · 신제품을 산 손님 비율 · 분기 태그 빠짐) · 거르기 줄(카테고리 · 「신제품으로 세는 분기」 1 · 2 · 4) · 출시 분기 코호트 열지도(Pre · Month 1 = 출시 분기 첫 달 · 기본 1 · 2 · 3 · 6 · 12 · All months · Net / GP %) · 브랜드 · 카테고리 순위(비교 대비) · 상위 제품 · 소수 손님에 기대는 제품(rule 키에서 글) · 끊긴 제품 · 출시 분기별 판매 + 태그 점검 · 알림 · 제품 상세(#products/<제품>[/period] · 세트 몫 · 지점 · 상위 손님 → 손님 상세 · Open product card) · 비교 범위 = 손님 탭과 같게(주 · 월 = prev + ly · 회계연도 · 달력 해 = 지난해 같은 날까지를 prev 로 · 그 밖 없음) ← an v7   // an v7 — 판정 1325 · 1337 · asung-wms an-5b(2ccfd65): 위험 목록 머리에 「counted <토론토 시각>」(risk.built_at · 새벽 표) · 상세의 At risk? 카드에도 같은 시각 · 손님 탭 알림(notes) 이름을 사람 말로(summary_behind · risk_not_built · risk_rule_changed 는 창구 글 그대로) ← an v6   // an v6 — 결과 기억(perf-0 #7): 같은 창구 · 같은 인자는 5 분 동안 화면이 기억해 DB 를 다시 부르지 않는다(탭 오가기 · 상세 갔다 오기 · 같은 기간 다시 고르기) · 「Show」 단추 = 기억을 버리고 새로 읽기 · 오류는 기억하지 않음 · 기억은 이 탭(페이지)에만(새로 고침하면 비워짐) · 머리 오른쪽에 「cached · n min ago」 ← an v5   // an v5 — 손님 한 명 상세(#customers/<손님> · 판정 1317 · asung-wms an-4b 1dc56e7 · an_customer): 순위 · 위험 목록의 이름 → 상세(같은 탭 안 · 주소로 공유) · 위 카드(고른 기간 + 비교 줄 · 첫 / 마지막 오더 · 평소 간격 · 위험 표시) · 월 그래프 「All history | Selected period」(#customers/<손님>/period · 3 달 이하 = 날마다 막대 + 같은 날짜 지난해 선 · 넘으면 그 기간의 월 막대) · 많이 사는 브랜드 · 매장 표(본사) · 매장이면 본사로 가는 링크 · 「Open customer card」 ← an v4   // an v4 — 손님 탭(Customers · #customers) · 판정 1314 ~ 1319 · asung-wms an-4a(3bff3ef · an_customers): 손님 수 카드(산 · 새 · 다시 · 끊긴 — 비교 범위는 개요의 비교 줄과 같게: 주 · 월 = 지난주 · 지난달 같은 날까지(1315) · 회계연도 · 달력 해 = 지난해 같은 날까지 · 그 밖은 비교 없음) · 손님 순위(본사 한 줄 + ▸ 로 매장별 · 1314 · (no customer) 한 줄 · 순위 밖 합) · 끊길 위험 목록(오늘 기준 · 회사 전체 · 거르기 안 탐 · 1316 · 1318 · 1319) · 새 손님 수가 크게 나올 수 있다는 안내(옛 시대 손님 잇기 — 판정 거리) · CSV 둘 · 손님 이름 = 손님 카드 링크(상세는 4b 뒤) ← an v3   // an v3 — 판정 1303 · 1305 ~ 1308 앞 · asung-wms an-3(02532bb · an_period): ① 기간 목록 This week · Last week · This month(열 때 기본) · Last month · This / Last fiscal year(9 월 1 일 시작) · Last 12 months · This / Last year · All history · Custom — 주는 일요일 시작 · 「오늘」 = 토론토 날짜 ② 주 · 월 기간은 an_period(날짜 그대로)로 KPI · 나눔 줄 · 지점 · 브랜드 표 · 비교 두 줄(주: 지난주 같은 요일까지 · 364 일 전 같은 주 / 월: 지난달 같은 날까지 · 지난해 같은 날까지 — Last month 는 그 전 달 전체 · 지난해 같은 달) · 알림은 an_period notes ③ 회계연도 · 달력 해는 「vs 지난해 같은 날까지」 한 줄 — 지난해 범위를 an_overview 달 칸(꽉 찬 달) + an_period(끝의 덜 찬 달)로 더한다(an-3 이견 1) ④ 시대 이름을 기간으로(판정 1303 — 범례 · 말풍선 · 출처 표 · CSV · 운임 안내 글) ⑤ 말풍선이 오른쪽 · 아래 끝을 넘으면 커서 반대쪽에(Caleb 캡처 — 오른쪽 막대에서 글이 잘렸다) ⑥ 달이 하나뿐이면 월 막대 그래프를 감춘다(막대 하나 · 날마다 막대가 대신) ← an v2   // an v2 — 판정 1301: 고른 기간이 93 일 이하면 an_daily 로 날마다 막대 + 지난해 같은 날(월 · 일로 맞댐) 선 · 날짜별 CSV · 말풍선 나눔 ← an v1b // an v1b — 고른 기간의 나눔 줄(제품 판매 − 크레딧 = 순매출 + 운임 · 서비스 · 할증 = 세금 전 합계 · 세금은 없음) · 월 말풍선에도 같은 나눔 ← an v1a // an v1a — 고른 기간 카드 줄(Selected period · 이번 달이면 지난해 같은 날까지와) · 연 누계 카드에 「Year to date」 · 막대 폭 상한(한두 달이면 가운데 보통 막대) ← an v1
console.log("analytics.html build:", AN_BUILD);

let sb = null, me = null, WH = [];
const TABS = {
  overview: { label: "Sales overview", load: loadOverview },
  customers: { label: "Customers", load: () => routeArgs[0] ? loadCustomer(routeArgs[0], routeArgs[1] === "period") : loadCustomers() },   // an v4 · an-4a · an v5 상세 = #customers/<손님>
  products: { label: "Products", load: () => routeArgs[0] ? loadProduct(routeArgs[0], routeArgs[1] === "period") : loadProducts() }   // an v8 · pr-2 · 상세 = #products/<제품>[/period]
  // 다음 탭(판정 1288 순서): customers → products → brands → seasonality → stock-outs — 한 줄씩 더한다 · 채널 탭(1523)은 ch-1 ~ ch-4 뒤
};
let tab = "overview", last = null, seq = 0, daily = null;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const num = (v, dp) => v === null || v === undefined ? "—" : Number(v).toLocaleString("en-CA", { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
const money = v => v === null || v === undefined ? "—" : (Number(v) < 0 ? "−$" : "$") + Math.abs(Number(v)).toLocaleString("en-CA", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const short = v => { if(v === null || v === undefined) return "—"; const a = Math.abs(v), s = v < 0 ? "−" : ""; return s + "$" + (a >= 1e6 ? (a / 1e6).toFixed(2) + "M" : a >= 1e3 ? (a / 1e3).toFixed(0) + "k" : a.toFixed(0)); };
const pct = v => v === null || v === undefined ? "—" : (Number(v) * (Math.abs(v) <= 1.5 ? 100 : 1)).toFixed(1) + "%";
const gpPct = c => (c && c.gp_pct !== undefined && c.gp_pct !== null) ? Number(c.gp_pct).toFixed(1) + "%" : "—";
function change(a, b){
  if(a === null || a === undefined || !b) return "";
  const r = (a - b) / Math.abs(b) * 100;
  return `<span class="${r >= 0 ? "up" : "dn"}">${r >= 0 ? "▲" : "▼"} ${Math.abs(r).toFixed(1)}%</span>`;
}

/* ── 기간 고르기(an v3 · 판정 1305 ~ 1307) ──
   「오늘」 = 토론토 날짜(창구의 ims_today 와 같게) · 날짜 셈은 UTC 자정끼리(서머타임에 하루 밀리지 않게)
   kind: short = 주 · 월(an_period · 비교 두 줄) · year = 회계연도 · 달력 해(비교 = 지난해 같은 날까지 한 줄) · none = 비교 없음 */
const todayTO = () => new Date().toLocaleDateString("en-CA", { timeZone: "America/Toronto" });
const D = s => new Date(s + "T00:00:00Z");
const S = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return S(d); };
const mEnd = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();            // m = 1 ~ 12
const ymdOf = (y, m, d) => y + "-" + pad(m) + "-" + pad(d);
const addY = (s, n) => { const y = +s.slice(0, 4) + n, m = +s.slice(5, 7), d = +s.slice(8, 10); return ymdOf(y, m, Math.min(d, mEnd(y, m))); };   // 2 월 29 일 − 1 년 = 2 월 28 일
const fmtD = s => MON[+s.slice(5, 7) - 1] + " " + (+s.slice(8, 10));
const fmtR = (f, t) => f === t ? fmtD(f) + " " + f.slice(0, 4) : (f.slice(0, 4) === t.slice(0, 4) ? fmtD(f) + " – " + fmtD(t) + " " + t.slice(0, 4) : fmtD(f) + " " + f.slice(0, 4) + " – " + fmtD(t) + " " + t.slice(0, 4));
function period(){
  const v = $("period").value, t = todayTO(), Y = +t.slice(0, 4), M = +t.slice(5, 7), dd = +t.slice(8, 10);
  const dow = D(t).getUTCDay();                       // 0 = 일요일(판정 1305 — 주는 일요일 시작)
  if(v === "tw"){ const f = addD(t, -dow);
    return { f, t, kind: "short", name: "This week", prev: [addD(f, -7), addD(t, -7)], ly: [addD(f, -364), addD(t, -364)], vsPrev: "last week (same days)", vsLy: "same week last year" }; }
  if(v === "lw"){ const f = addD(t, -dow - 7), e = addD(f, 6);
    return { f, t: e, kind: "short", name: "Last week", prev: [addD(f, -7), addD(e, -7)], ly: [addD(f, -364), addD(e, -364)], vsPrev: "the week before", vsLy: "same week last year" }; }
  if(v === "tm"){ const f = ymdOf(Y, M, 1), py = M === 1 ? Y - 1 : Y, pm = M === 1 ? 12 : M - 1;
    return { f, t, kind: "short", name: "This month", prev: [ymdOf(py, pm, 1), ymdOf(py, pm, Math.min(dd, mEnd(py, pm)))], ly: [addY(f, -1), addY(t, -1)], vsPrev: "same days last month", vsLy: "same days last year" }; }
  if(v === "lm"){ const ly0 = M === 1 ? Y - 1 : Y, lm0 = M === 1 ? 12 : M - 1, f = ymdOf(ly0, lm0, 1), e = ymdOf(ly0, lm0, mEnd(ly0, lm0));
    const py = lm0 === 1 ? ly0 - 1 : ly0, pm = lm0 === 1 ? 12 : lm0 - 1;
    return { f, t: e, kind: "short", name: "Last month", prev: [ymdOf(py, pm, 1), ymdOf(py, pm, mEnd(py, pm))], ly: [addY(f, -1), addY(e, -1)], vsPrev: MON[pm - 1] + " " + py, vsLy: MON[lm0 - 1] + " " + (ly0 - 1) }; }
  const fy = M >= 9 ? Y : Y - 1;                      // 회계연도는 9 월 1 일 시작
  if(v === "tfy") return { f: fy + "-09-01", t, kind: "year", name: "This fiscal year" };
  if(v === "lfy") return { f: (fy - 1) + "-09-01", t: fy + "-08-31", kind: "year", name: "Last fiscal year" };
  if(v === "ytd") return { f: Y + "-01-01", t, kind: "year", name: "This year" };
  if(v === "ly")  return { f: (Y - 1) + "-01-01", t: (Y - 1) + "-12-31", kind: "year", name: "Last year" };
  if(v === "l12") return { f: ymdOf(M === 12 ? Y : Y - 1, M === 12 ? 1 : M + 1, 1), t, kind: "none", name: "Last 12 months" };
  if(v === "custom"){
    const cf = $("pFrom").value || "2022-01", ct = $("pTo").value || t.slice(0, 7);
    return { f: cf + "-01", t: ymdOf(+ct.slice(0, 4), +ct.slice(5, 7), mEnd(+ct.slice(0, 4), +ct.slice(5, 7))), kind: "none", name: "Custom" };
  }
  return { f: "2022-01-01", t, kind: "none", name: "All history" };
}
/* 시대 이름 — 판정 1303(옛 시스템 이름 대신 기간) · 창구는 코드(omni · core · ims · all)만 준다 */
const ERA = { omni: "2022 – Oct 2025", core: "Nov 2025 – Oct 2026", ims: "IMS (Nov 2026 –)", all: "All periods" };
const eraName = e => ERA[e] || e || "";
/* 지난해 같은 날까지(회계연도 · 달력 해 · an-3 이견 1) — 꽉 찬 달은 an_overview 달 칸 · 끝의 덜 찬 달은 an_period · 화면은 더하기만 */
async function lastYearSum(f, t, base){
  const lf = addY(f, -1), lt = addY(t, -1), ms = lt.slice(0, 8) + "01";
  const full = lt === ymdOf(+lt.slice(0, 4), +lt.slice(5, 7), mEnd(+lt.slice(0, 4), +lt.slice(5, 7)));
  const calls = [];
  if(full) calls.push(crpc("an_overview", { ...base, p_from: lf, p_to: lt }).then(r => ({ r, k: "ov" })));
  else {
    if(lf < ms) calls.push(crpc("an_overview", { ...base, p_from: lf, p_to: addD(ms, -1) }).then(r => ({ r, k: "ov" })));
    calls.push(crpc("an_period", { ...base, p_from: lf < ms ? ms : lf, p_to: lt }).then(r => ({ r, k: "pd" })));
  }
  const res = await Promise.all(calls);
  const cells = [];
  for(const x of res){
    if(x.r.error) return { error: x.r.error };
    if(x.k === "ov") (x.r.data.months || []).forEach(m => cells.push(m)); else cells.push(x.r.data.period);
  }
  return { from: lf, to: lt, cell: sumCells(cells) };
}
/* 칸 여러 개를 하나로(달 칸 합 — 화면이 이미 고른 기간을 이렇게 낸다) · GP 는 원가가 있는 칸끼리 · 원가 키는 받은 칸에 있을 때만 */
function sumCells(cs){
  const sm = k => cs.reduce((a, c) => a + (Number(c[k]) || 0), 0);
  const o = { net: sm("net"), sales: sm("sales"), credits: sm("credits"), other: sm("other"), qty: sm("qty"), orders: sm("orders") };
  o.aov = o.orders ? o.net / o.orders : null;
  if(cs.some(c => c.gp !== undefined)){
    const wc = cs.filter(c => c.gp !== null && c.gp !== undefined), g = wc.reduce((a, c) => a + Number(c.gp), 0), nn = wc.reduce((a, c) => a + Number(c.net), 0);
    o.gp = wc.length ? g : null; o.gp_pct = nn ? 100 * g / nn : null;
    o.cost_coverage = (sm("sales") ? cs.reduce((a, c) => a + (Number(c.cost_coverage) || 0) * (Number(c.sales) || 0), 0) / sm("sales") : 0);
  }
  return o;
}


/* ── 결과 기억(an v6 · perf-0 #7) — 같은 창구 · 같은 인자 5 분 · Show = 새로 읽기 · 오류는 기억 안 함 ── */
const RPC_TTL = 5 * 60 * 1000;
const rpcMemo = new Map();
let rpcFresh = false;            // Show 를 누르면 다음 읽기 한 번은 기억을 버린다
let rpcOldest = null;            // 이번 그리기에 쓴 기억 중 가장 오래된 시각
function crpc(name, args){
  const key = name + "|" + JSON.stringify(args);
  const hit = rpcMemo.get(key);
  if(!rpcFresh && hit && Date.now() - hit.t < RPC_TTL){ rpcOldest = rpcOldest === null ? hit.t : Math.min(rpcOldest, hit.t); return Promise.resolve(hit.r); }
  return sb.rpc(name, args).then(r => { if(!r.error) rpcMemo.set(key, { t: Date.now(), r }); return r; });
}
function memoNote(){
  const el = $("built"); if(!el) return;
  const base = el.textContent.replace(/( · )?cached \d+ min ago — Show to refresh$/, "");
  el.textContent = base + (rpcOldest !== null ? (base ? " · " : "") + "cached " + Math.max(0, Math.round((Date.now() - rpcOldest) / 60000)) + " min ago — Show to refresh" : "");
}

/* ── CSV(판정 1289 — 받은 숫자 그대로 · 원가 칸은 원가 권한이 있을 때만 응답에 있다) ── */
function csvDownload(name, head, rows){
  const q = v => { if(v === null || v === undefined) return ""; const s = String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const text = [head.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" }));
  const f = last ? `${last.from}_${last.to}` : "";
  a.download = `asung-${name}-${f}${last && last.warehouse ? "-" + last.warehouse.branch : ""}${last && last.brand ? "-" + last.brand.replace(/\W+/g, "_") : ""}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const CELL_KEYS = d => ["net","sales","credits","other","qty","orders","aov"].concat(d.can_cost ? ["cogs","gp","gp_pct","cost_coverage"] : []);

/* ── 그래프: 월 막대(순매출) + GP % 선 ── */
function monthChart(months, canCost){
  const W = 1200, H = 300, L = 56, R = canCost ? 46 : 14, T = 14, B = 34;
  const n = months.length; if(!n) return "";
  const max = Math.max(1, ...months.map(m => Number(m.net) || 0));
  const step = (W - L - R) / n, bw = Math.min(56, Math.max(2, step * 0.72));
  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / max);
  const ticks = 4; let g = "";
  for(let i = 0; i <= ticks; i++){ const v = max * i / ticks, yy = y(v); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${short(v)}</text>`; }
  let bars = "", labels = "", pts = [];
  months.forEach((m, i) => {
    const x = L + i * step + (step - bw) / 2, v = Math.max(0, Number(m.net) || 0);
    bars += `<rect class="bar ${esc(m.era)}${m.partial ? " partial" : ""}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" data-i="${i}"/>`;
    const mm = +m.m.slice(5, 7);
    if(n <= 24 || mm === 1) labels += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - B + 14}" text-anchor="middle">${n <= 24 ? MON[mm - 1] + (mm === 1 || i === 0 ? " " + m.m.slice(2, 4) : "") : m.m.slice(0, 4)}</text>`;
    if(canCost && m.gp_pct !== null && m.gp_pct !== undefined && (m.cost_coverage === undefined || m.cost_coverage >= 0.9)) pts.push([x + bw / 2, Number(m.gp_pct)]);
    else if(canCost) pts.push(null);
  });
  let line = "";
  if(canCost){
    const yp = p => T + (H - T - B) * (1 - Math.min(60, Math.max(0, p)) / 60);
    for(let v = 0; v <= 60; v += 20) line += `<text x="${W - R + 6}" y="${yp(v) + 3}">${v}%</text>`;
    let seg = [];
    const flush = () => { if(seg.length > 1) line += `<polyline class="gp" points="${seg.map(p => p[0].toFixed(1) + "," + yp(p[1]).toFixed(1)).join(" ")}"/>`; seg.forEach(p => line += `<circle class="gpdot" cx="${p[0].toFixed(1)}" cy="${yp(p[1]).toFixed(1)}" r="2"/>`); seg = []; };
    pts.forEach(p => { if(p) seg.push(p); else flush(); }); flush();
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly net sales"><line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>${g}${bars}${line}${labels}</svg>`;
}
/* 날마다 막대 + 지난해 같은 날 선(an v2 · 판정 1301) — 지난해는 월 · 일로 맞댄다(an-2 이견 2) */
function dayChart(dd){
  const days = dd.days || [], prev = dd.prev || [];
  const W = 1200, H = 300, L = 56, R = 14, T = 14, B = 34, n = days.length; if(!n) return "";
  const pm = {}; prev.forEach(p => { pm[p.d.slice(5)] = p; });
  const max = Math.max(1, ...days.map(x => Number(x.net) || 0), ...prev.map(x => Number(x.net) || 0));
  const step = (W - L - R) / n, bw = Math.min(40, Math.max(2, step * 0.7));
  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / max);
  let g = "";
  for(let i = 0; i <= 4; i++){ const v = max * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; }
  let bars = "", labels = "", seg = [], line = "";
  const every = n > 45 ? 7 : n > 20 ? 3 : 1;
  days.forEach((x, i) => {
    const cx = L + i * step + step / 2, v = Math.max(0, Number(x.net) || 0);
    const dow = new Date(x.d + "T00:00:00").getDay();
    bars += `<rect class="bar ${esc(x.era)}" x="${(cx - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" data-di="${i}"${dow === 0 || dow === 6 ? ' style="opacity:.55"' : ""}/>`;
    if(i % every === 0) labels += `<text x="${cx.toFixed(1)}" y="${H - B + 14}" text-anchor="middle">${MON[+x.d.slice(5, 7) - 1]} ${+x.d.slice(8)}</text>`;
    const p = pm[x.d.slice(5)];
    if(p) seg.push(cx.toFixed(1) + "," + y(Number(p.net) || 0).toFixed(1));
  });
  if(seg.length > 1) line = `<polyline class="yl" style="stroke:var(--warn)" points="${seg.join(" ")}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net sales by day"><line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>${g}${bars}${line}${labels}</svg>`;
}
/* 연도별 선(같은 달끼리) */
function yearChart(ybm){
  const W = 1200, H = 260, L = 56, R = 14, T = 12, B = 26;
  const vals = []; ybm.forEach(y => y.months.forEach(c => { if(c) vals.push(Number(c.net) || 0); }));
  const max = Math.max(1, ...vals), step = (W - L - R) / 11;
  const y = v => T + (H - T - B) * (1 - Math.max(0, v) / max);
  const colors = ["var(--ims-dim)","color-mix(in srgb,var(--accent) 35%,var(--ims-surface))","color-mix(in srgb,var(--accent) 60%,var(--ims-surface))","var(--warn)","var(--accent)","var(--good)"];
  let g = "", lines = "", leg = "";
  for(let i = 0; i <= 4; i++){ const v = max * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`; }
  MON.forEach((m, i) => g += `<text x="${L + i * step}" y="${H - 8}" text-anchor="middle">${m}</text>`);
  ybm.forEach((yr, k) => {
    const col = colors[Math.max(0, colors.length - ybm.length + k)];
    let seg = []; const flush = () => { if(seg.length > 1) lines += `<polyline class="yl" style="stroke:${col}" points="${seg.join(" ")}"/>`; seg = []; };
    yr.months.forEach((c, i) => { if(c) seg.push((L + i * step).toFixed(1) + "," + y(Number(c.net) || 0).toFixed(1)); else flush(); }); flush();
    leg += `<span><i style="background:${col}"></i>${yr.year}</span>`;
  });
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net sales by month, year against year"><line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>${g}${lines}</svg>`, legend: leg };
}

/* ── 매출 개요 탭 ── */
let per = null, pd = null, lyc = null;   // an v3 — 고른 기간 · an_period 응답 · 지난해 합(해 기간)
async function loadOverview(){
  const my = ++seq;
  per = period();
  const f = per.f, t = per.t;
  $("load").textContent = "Loading…";
  const base = { p_warehouse: $("branch").value || null, p_brand: $("brand").value.trim() || null };
  const args = { ...base, p_from: f, p_to: t };
  const span = Math.round((Math.min(D(t), D(todayTO())) - D(f)) / 86400000) + 1;
  const useDaily = span <= 93;   // 판정 1301 — 3 달 이하
  const none = Promise.resolve({ data: null, error: null });
  const [ov, dl, pr, ly] = await Promise.all([
    crpc("an_overview", args),
    useDaily ? crpc("an_daily", args) : none,
    per.kind === "short" ? crpc("an_period", { ...args, p_prev_from: per.prev[0], p_prev_to: per.prev[1], p_ly_from: per.ly[0], p_ly_to: per.ly[1] }) : none,
    per.kind === "year" ? lastYearSum(f, t, base) : Promise.resolve(null)
  ]);
  if(my !== seq) return;
  $("load").textContent = "";
  const error = ov.error || pr.error, data = ov.data;
  if(error){ $("box").innerHTML = `<div class="card anmsg"><b>Could not load</b>${esc(error.message)}</div>`; return; }
  daily = dl.error ? null : dl.data;
  pd = pr.data;
  lyc = ly && !ly.error ? ly : null;
  last = data;
  $("built").textContent = data.summary_built_at ? "History summary built " + String(data.summary_built_at).slice(0, 16).replace("T", " ") + " UTC" : "";
  if(!data.brand && $("brandList").children.length === 0) $("brandList").innerHTML = (data.brands_top || []).map(b => `<option value="${esc(b.brand)}">`).join("");
  renderOverview(data);
}
function renderOverview(d){
  $("box").onclick = null;   // an v4 — 손님 탭의 펼치기 · CSV 처리를 떼어 낸다
  const cc = !!d.can_cost;
  const scope = [d.warehouse ? d.warehouse.name : "All branches", d.brand ? d.brand : null].filter(Boolean).join(" · ");
  const head = (title, sub, csvId) => `<h3>${title}${sub ? ` <span class="sub">${sub}</span>` : ""}<span class="sp"></span>${csvId ? `<button class="csvb" data-csv="${csvId}">CSV</button>` : ""}</h3>`;
  let h = "";

  const k = (label, va, vb, fmt, vsLabel) => `<div class="card kpi"><div class="l">${label}</div><div class="v">${fmt(va)}</div><div class="c">${vb === undefined ? "&nbsp;" : change(va, vb) + " vs " + fmt(vb) + " " + (vsLabel || "last year")}</div></div>`;
  /* an v3 — 비교 줄 여럿(판정 1306 · 1307): cs = [{c: 칸, l: 글}] · 칸이 없으면 그 줄을 안 그린다 */
  const k2 = (label, va, key, fmt, cs) => `<div class="card kpi"><div class="l">${label}</div><div class="v">${fmt(va)}</div>` +

  const ms = d.months || [];

function prodNotesHtml(notes, skip){
  const PN = { period: "this period", prev: "comparison", ly: "last year" };
  const nt = (notes || []).filter(n => !(skip || []).includes(n.code));
  if(!nt.length) return "";
  return `<div class="card ancard">${ahead("About these numbers", "", "pnotes")}<div class="body"><ul style="margin:0;padding-left:18px">` +
    nt.map(n => `<li>${n.part ? "[" + esc(PN[n.part] || n.part) + "] " : ""}${esc(n.note)}${n.amount !== undefined && n.amount !== null ? " — " + money(n.amount) : ""}${n.from ? ` <span class="dim">(${esc(n.from)}${n.to && n.to !== n.from ? " → " + esc(n.to) : ""})</span>` : ""}</li>`).join("") + `</ul></div></div>`;
}

async function loadProducts(){
  const my = ++seq;
  const r = prodRange();
  $("load").textContent = "Loading…";
  const { data, error } = await crpc("an_products", { p_from: r.f, p_to: r.t, p_prev_from: r.pf, p_prev_to: r.pt, p_ly_from: r.lf, p_ly_to: r.lt,
    p_warehouse: $("branch").value || null, p_brand: $("brand").value.trim() || null, p_category: prodCat || null, p_channel: null, p_new_n: prodNewN, p_limit: 100 });
  if(my !== seq) return;
  $("load").textContent = "";
  if(error){ $("box").innerHTML = `<div class="card anmsg"><b>Could not load</b>${esc(error.message)}</div>`; return; }
  prod = data; prod.pl = r.pl; prod.ll = r.ll;
  last = { from: data.period.from, to: data.period.to, warehouse: data.warehouse, brand: data.brand };
  if(!data.category && (data.categories || []).length) prodCatList = data.categories.map(c => c.category);
  $("built").textContent = data.launch_counted_at ? "Launch quarters counted " + torTime(data.launch_counted_at) + " (Toronto)" : "";
  renderProducts(data);
}

function cohortCard(d, cc){
  const co = d.cohort;
  if(!co || !(co.rows || []).length) return "";
  const n = (co.months || 12) + 1, idx = prodCoh.all ? [...Array(n).keys()] : COH_KEY.filter(i => i < n);
  const gpMode = cc && prodCoh.mode === "gp";
  const val = c => gpMode ? (c.gp_pct === null || c.gp_pct === undefined ? null : Number(c.gp_pct)) : Number(c.net) || 0;
  let max = 1;
  co.rows.forEach(rw => { const cm = {}; (rw.cells || []).forEach(c => cm[c.month] = c);
    idx.forEach(i => { const c = cm[i]; if(c && !gpMode) max = Math.max(max, val(c)); }); });
  const shade = v => { if(v === null) return 0; const x = gpMode ? Math.min(1, Math.max(0, v / 60)) : Math.max(0, v) / max; return Math.round(8 + 72 * x); };
  const cellTd = (c, label, mlabel) => {
    if(!c) return `<td class="c no" title="${esc(label + " · " + mlabel)}: not reached yet">·</td>`;
    const v = val(c), s = shade(v);
    const tt = `${label} · ${mlabel}${c.open ? " (month so far)" : ""}: net ${money(c.net)} · ${num(c.qty)} units · ${num(c.sold)} products sold` + (cc ? ` · GP ${gpPct(c)}` : "");
    return `<td class="c${s > 48 ? " hi" : ""}${c.open ? " open" : ""}" style="background:color-mix(in srgb,var(--accent) ${s}%,var(--ims-surface))" title="${esc(tt)}">${gpMode ? gpPct(c) : short(c.net)}</td>`;
  };
  const seg = (k, v, l) => `<a href="#" data-coh="${k}:${v}" class="${String(prodCoh[k]) === String(v) ? "cur" : ""}">${l}</a>`;
  return `<div class="card ancard"><h3>Launch-quarter cohorts <span class="sub">all history (the period above does not change this table) · net sales of each launch quarter's products, by month since launch · Month 1 = first month of the launch quarter · Pre = the ${co.pre_months || 3} months before</span><span class="sp"></span>` +
    (cc ? `<span class="seg2">${seg("mode", "net", "Net sales")}${seg("mode", "gp", "GP %")}</span>` : "") +
    `<span class="seg2">${seg("all", false, "Key months")}${seg("all", true, "All " + n + " months")}</span><button class="csvb" data-csv="pcohort">CSV</button></h3>` +
    `<div class="body"><table class="heat"><thead><tr><th>Launch quarter</th><th class="r">Products</th><th class="r">Sold</th><th class="mh">Pre</th>${idx.map(i => `<th class="mh">Month ${i + 1}</th>`).join("")}</tr></thead><tbody>` +
    co.rows.map(rw => { const cm = {}; (rw.cells || []).forEach(c => cm[c.month] = c);
      const pre = rw.pre && (Number(rw.pre.net) || 0) !== 0 ? `<td class="c" title="${esc(rw.label + " · before launch: net " + money(rw.pre.net))}">${gpMode ? gpPct(rw.pre) : short(rw.pre.net)}</td>` : `<td class="c no">·</td>`;
      return `<tr><td><b>${esc(rw.label)}</b></td><td class="r">${num(rw.products)}</td><td class="r">${num(rw.sold)}</td>${pre}${idx.map(i => cellTd(cm[i], rw.label, "Month " + (i + 1))).join("")}</tr>`; }).join("") +
    `</tbody></table><div class="legend"><span>Darker = more ${gpMode ? "GP % (scale 0 – 60 %)" : "net sales"}</span><span>· = month not reached yet</span><span>Italic = month so far</span><span>Sold = products with at least one sale</span></div></div></div>`;
}

function renderProducts(d){
  const cc = !!d.can_cost, K = d.kpi || {}, P = d.period || {};
  const lbl = (per ? per.name + " · " : "") + fmtR(P.from, P.to);
  const scope = [(d.warehouse ? (/Edmonton/i.test(d.warehouse.name || "") ? "Edmonton" : "Toronto") : "All branches"), d.brand, d.category].filter(Boolean).join(" · ");
  const notBuilt = (d.notes || []).some(n => n.code === "launch_not_built");
  const cmpL = [{ v: K.new_share_prev, l: d.pl }, { v: K.new_share_ly, l: d.ll }].filter(x => x.l && x.v !== undefined && x.v !== null);
  let h = "";
  // 거르기 줄(이 탭만) — 카테고리 · 신제품으로 세는 분기
  const cats = prodCatList.length ? prodCatList : (d.categories || []).map(c => c.category);
  h += `<div class="card pbar"><span>Category</span><select id="pCat"><option value="">All categories</option>${cats.map(c => `<option value="${esc(c)}"${c === prodCat ? " selected" : ""}>${esc(c)}</option>`).join("")}${prodCat && !cats.includes(prodCat) ? `<option value="${esc(prodCat)}" selected>${esc(prodCat)}</option>` : ""}</select>` +
    `<span style="margin-left:8px">A product counts as new for</span><span class="seg2">${[1, 2, 4].map(n => `<a href="#" data-newn="${n}" class="${n === prodNewN ? "cur" : ""}">${n} quarter${n > 1 ? "s" : ""}</a>`).join("")}</span>` +
    `<span class="dim">from its launch quarter</span></div>`;
  if(notBuilt){ const nb = d.notes.find(n => n.code === "launch_not_built"); h += `<div class="card pwarn">${esc(nb.note)}</div>`; }
  // 머리 숫자 넷(1523)
  h += `<div class="kpis">` +
    `<div class="card kpi"><div class="l">New products' share of sales — ${esc(lbl)}</div><div class="v">${pct(K.new_share)}</div>` +
      (cmpL.length ? cmpL.map(x => `<div class="c">${ptChange(K.new_share, x.v)} vs ${pct(x.v)} ${esc(x.l)}</div>`).join("") : `<div class="c">${money(K.new_net)} of ${money(K.net)}</div>`) + `</div>` +
    `<div class="card kpi"><div class="l">New products sold</div><div class="v">${num(K.new_products)}${K.new_families !== null && K.new_families !== undefined ? `<span class="sm">in ${num(K.new_families)} famil${K.new_families === 1 ? "y" : "ies"}</span>` : ""}</div><div class="c">${money(K.new_net)} new-product sales</div></div>` +
    `<div class="card kpi"><div class="l">Customers who bought new products</div><div class="v">${pct(K.new_buyer_share)}</div><div class="c">${num(K.new_buyers)} of ${num(K.buyers)} buying customers</div></div>` +
    `<div class="card kpi"><div class="l">Missing launch-quarter tag</div><div class="v">${num(K.missing_tag)}</div><div class="c">${K.missing_tag ? "launch quarter taken from the first receipt — add the tag on the product" : "every launched product has its tag"}</div></div>` +
    `</div>`;
  const nr = (d.notes || []).find(n => n.code === "new_rule");
  h += `<div class="card pnote">${esc(scope)} · net sales ${money(P.net)}${cc && P.gp_pct !== undefined ? " · GP " + gpPct(P) : ""}${K.pre_launch ? " · sales before launch " + money(K.pre_launch) + " (not counted as new)" : ""}${nr ? `<br>${esc(nr.note)}` : ""}</div>`;
  // 코호트
  h += cohortCard(d, cc);
  // 브랜드 · 카테고리
  const gpc = x => cc ? `<td class="r">${gpPct(x)}</td>` : "";
  const hasPrev = !!d.pl;
  const bl = d.brands || [], bTot = Number(P.net) || 1;
  const rankT = (title, rows, count, key, csv) => `<div class="card ancard">${ahead(title, `top ${rows.length} of ${num(count)} · ${esc(lbl)}${hasPrev ? " · rank against " + esc(d.pl) : ""}`, csv)}<div class="body"><table><thead><tr><th class="r">#</th><th>${key === "brand" ? "Brand" : "Category"}</th><th class="r">Products</th><th class="r">Net sales</th><th>Share</th>${hasPrev ? `<th class="r">Before</th><th>Rank</th>` : ""}<th class="r">New products</th>${cc ? `<th class="r">GP %</th>` : ""}</tr></thead><tbody>` +
    (rows.length ? rows.map(x => `<tr><td class="r dim">${num(x.rank)}</td><td><a class="lnk" href="#" data-${key === "brand" ? "brand" : "cat"}="${esc(x[key])}">${esc(x[key])}</a></td><td class="r">${num(x.products)}</td><td class="r">${money(x.net)}</td><td class="nw">${x.net > 0 ? `<span class="share" style="width:${Math.max(1, Math.round(60 * x.net / bTot))}px"></span>${(100 * x.net / bTot).toFixed(1)}%` : ""}</td>${hasPrev ? `<td class="r">${money(x.net_prev)}</td><td>${rankMove(x.rank, x.rank_prev)}</td>` : ""}<td class="r">${Number(x.new_net) ? money(x.new_net) : '<span class="dim">—</span>'}</td>${gpc(x)}</tr>`).join("") : `<tr><td colspan="9" class="dim">No product sales in this period.</td></tr>`) +
    `</tbody></table></div></div>`;
  h += `<div class="two pw">${rankT("Brands", bl, d.brands_count, "brand", "pbrands")}${rankT("Categories", d.categories || [], d.categories_count, "category", "pcats")}</div>`;
  // 상위 제품
  const tp = d.top || [];
  const pName = x => `<a class="lnk" href="#products/${encodeURIComponent(x.product_id)}">${esc(x.name)}</a>${x.is_active === false ? ` <span class="dim">(inactive)</span>` : ""}`;
  h += `<div class="card ancard">${ahead("Products by net sales", `${esc(scope)} · ${esc(lbl)} · top ${tp.length} of ${num(d.products_count)}`, "ptop")}<div class="body"><table><thead><tr><th class="r">#</th><th>SKU</th><th>Product</th><th>Brand</th><th>Launch</th><th class="r">Net sales</th>${hasPrev ? `<th class="r">Before</th><th>Rank</th>` : ""}<th class="r">Units</th><th class="r">Customers</th>${cc ? `<th class="r">GP %</th>` : ""}</tr></thead><tbody>` +
    (tp.length ? tp.map(x => `<tr><td class="r dim">${num(x.rank)}</td><td>${esc(x.sku)}</td><td>${pName(x)}</td><td>${esc(x.brand || "")}</td><td>${x.launch_q ? esc(qLabel(x.launch_q)) + (x.is_new ? ` <span class="badge new">New</span>` : "") + (x.launch_source === "first_in" ? ` <span class="dim" title="No quarter tag — taken from the first receipt">*</span>` : "") : ""}</td><td class="r">${money(x.net)}</td>${hasPrev ? `<td class="r">${money(x.net_prev)}</td><td>${rankMove(x.rank, x.rank_prev)}</td>` : ""}<td class="r">${num(x.qty)}</td><td class="r">${num(x.buyers)}</td>${gpc(x)}</tr>`).join("") : `<tr><td colspan="11" class="dim">No product sales in this period.</td></tr>`) +
    `</tbody></table><div class="legend"><span>New = this sale counts as a new-product sale</span><span>* = no quarter tag, launch taken from the first receipt</span><span>Units are in base units (packs counted by their size)</span></div></div></div>`;
  // 소수 손님 · 끊긴 제품
  const cn = d.concentrated || [], ru = d.rule || {};
  const concT = `<div class="card ancard">${ahead("Products that rely on a few customers", esc(lbl), "pconc")}<div class="body"><div class="dim" style="font-size:12.5px;margin-bottom:6px">Of the top ${num(ru.conc_pool || 200)} products by net sales: bought by at least ${num(ru.conc_min_buyers || 5)} customers, and the top ${num(ru.conc_top || 3)} of them bought ${Math.round((ru.conc_share || 0.8) * 100)}% or more.</div>` +
    `<table><thead><tr><th>Product</th><th class="r">Net sales</th><th class="r">Customers</th><th class="r">Top ${num(ru.conc_top || 3)} share</th><th>Biggest customer</th></tr></thead><tbody>` +
    (cn.length ? cn.map(x => `<tr><td><span class="dim">${esc(x.sku)}</span> ${pName(x)}</td><td class="r">${money(x.net)}</td><td class="r">${num(x.buyers)}</td><td class="r"><b>${pct(x.top_share)}</b></td><td>${x.top_customer ? `<a class="lnk" href="#customers/${encodeURIComponent(x.top_customer.key)}">${esc(x.top_customer.name)}</a> <span class="dim">${pct(x.top1_share)}</span>` : ""}</td></tr>`).join("") : `<tr><td colspan="5" class="dim">No product matches in this period.</td></tr>`) +
    `</tbody></table></div></div>`;
  const st = d.stopped || [];
  const stopT = `<div class="card ancard">${ahead("Stopped selling", hasPrev ? `sold ${esc(d.pl)}, nothing in ${esc(lbl)}${d.stopped_count !== undefined && d.stopped_count !== null ? " · " + num(d.stopped_count) + " products" : ""}` : "", hasPrev ? "pstop" : null)}<div class="body">` +
    (!hasPrev ? `<div class="dim">Pick a week, month or year period — stopped products are found against the comparison period.</div>` :
      `<table><thead><tr><th>Product</th><th>Brand</th><th class="r">Net sales before</th><th class="r">Rank before</th>${cc ? `<th class="r">GP % before</th>` : ""}</tr></thead><tbody>` +
      (st.length ? st.map(x => `<tr><td><span class="dim">${esc(x.sku)}</span> ${pName(x)}</td><td>${esc(x.brand || "")}</td><td class="r">${money(x.prev ? x.prev.net : null)}</td><td class="r">${num(x.rank_prev)}</td>${cc ? `<td class="r">${gpPct(x.prev)}</td>` : ""}</tr>`).join("") : `<tr><td colspan="5" class="dim">None.</td></tr>`) +
      (d.stopped_count > st.length ? `<tr><td colspan="5" class="dim">Showing the ${num(st.length)} biggest of ${num(d.stopped_count)} — the CSV has the same rows.</td></tr>` : "") + `</tbody></table>`) +
    `</div></div>`;
  h += `<div class="two pw">${concT}${stopT}</div>`;
  // 출시 분기별 판매 + 태그 점검
  const bq = d.by_launch_q || [], cv = {}; (d.coverage || []).forEach(c => cv[c.launch_q] = c);
  if(bq.length || (d.coverage || []).length){
    const rows = bq.length ? bq : (d.coverage || []).map(c => ({ launch_q: c.launch_q, label: c.label }));
    h += `<div class="card ancard">${ahead("Sales by launch quarter", `${esc(lbl)} · and how each quarter's launch was found`, "plaunch")}<div class="body"><table><thead><tr><th>Launch quarter</th><th class="r">Products sold</th><th class="r">Net sales</th><th class="r">As new</th><th class="r">After the new window</th><th class="r">Before launch</th>${cc ? `<th class="r">GP %</th>` : ""}<th class="r">Tagged</th><th class="r">From first receipt</th></tr></thead><tbody>` +
      rows.map(x => { const c = cv[x.launch_q] || {};
        return `<tr><td><b>${esc(x.label || qLabel(x.launch_q) || "No launch quarter")}</b></td><td class="r">${num(x.products)}</td><td class="r">${money(x.net)}</td><td class="r">${money(x.new_net)}</td><td class="r">${money(x.later_net)}</td><td class="r">${Number(x.pre_net) ? money(x.pre_net) : '<span class="dim">—</span>'}</td>${gpc(x)}<td class="r">${num(c.tagged)}</td><td class="r">${c.from_receipt ? `<b>${num(c.from_receipt)}</b>` : num(c.from_receipt)}</td></tr>`; }).join("") +
      `</tbody></table><div class="legend"><span>Tagged = launch quarter set by the product's quarter tag · From first receipt = no tag, so the first receipt decides</span></div></div></div>`;
  }
  h += prodNotesHtml(d.notes, ["new_rule", "launch_not_built"]);
  $("box").innerHTML = h;

  const sel = $("pCat"); if(sel) sel.onchange = () => { prodCat = sel.value; runLoad(); };
  $("box").onclick = e => {
    const a = e.target.closest("[data-newn],[data-coh],[data-brand],[data-cat],[data-csv]"); if(!a) return;
    if(a.dataset.newn){ e.preventDefault(); prodNewN = +a.dataset.newn; runLoad(); return; }
    if(a.dataset.coh){ e.preventDefault(); const [k, v] = a.dataset.coh.split(":"); prodCoh[k] = k === "all" ? v === "true" : v; renderProducts(d); return; }
    if(a.dataset.brand !== undefined){ e.preventDefault(); if(!a.dataset.brand || a.dataset.brand === "(no brand)") return; $("brand").value = a.dataset.brand; runLoad(); return; }
    if(a.dataset.cat !== undefined){ e.preventDefault(); prodCat = a.dataset.cat; runLoad(); return; }
    const k = a.dataset.csv, keys = PCK(cc);
    if(k === "ptop") csvDownload("products", ["rank","sku","product","brand","category","active","launch_quarter","launch_from","is_new","new_net","customers"].concat(keys, ["net_before","rank_before"]),
      tp.map(x => [x.rank, x.sku, x.name, x.brand, x.category, x.is_active, qLabel(x.launch_q), x.launch_source, x.is_new, x.new_net, x.buyers].concat(keys.map(q => x[q]), [x.net_prev, x.rank_prev])));
    else if(k === "pbrands" || k === "pcats"){ const nm = k === "pbrands" ? "brand" : "category", rows = k === "pbrands" ? bl : (d.categories || []);
      csvDownload(k === "pbrands" ? "product-brands" : "product-categories", ["rank", nm, "products", "new_net"].concat(keys, ["net_before","rank_before"]), rows.map(x => [x.rank, x[nm], x.products, x.new_net].concat(keys.map(q => x[q]), [x.net_prev, x.rank_prev]))); }
    else if(k === "pconc") csvDownload("products-few-customers", ["sku","product","brand","rank","net","customers","top1_share","top_share","biggest_customer"], cn.map(x => [x.sku, x.name, x.brand, x.rank, x.net, x.buyers, x.top1_share, x.top_share, x.top_customer ? x.top_customer.name : ""]));
    else if(k === "pstop") csvDownload("products-stopped", ["sku","product","brand","category","active","rank_before"].concat(keys.map(q => q + "_before")), st.map(x => [x.sku, x.name, x.brand, x.category, x.is_active, x.rank_prev].concat(keys.map(q => x.prev ? x.prev[q] : ""))));
    else if(k === "pcohort"){ const rows = [];
      (d.cohort.rows || []).forEach(rw => { if(rw.pre) rows.push([rw.label, rw.products, rw.sold, "pre", "", ""].concat(keys.map(q => rw.pre[q])));
        (rw.cells || []).forEach(c => rows.push([rw.label, rw.products, rw.sold, c.month + 1, c.open ? "month so far" : "", c.sold].concat(keys.map(q => c[q])))); });
      csvDownload("launch-cohorts", ["launch_quarter","products","products_sold_ever","month","note","products_sold"].concat(keys), rows); }
    else if(k === "plaunch") csvDownload("sales-by-launch-quarter", ["launch_quarter","products","new_net","later_net","pre_net"].concat(keys, ["tagged","from_first_receipt"]),
      (bq.length ? bq : []).map(x => { const c = cv[x.launch_q] || {}; return [x.label, x.products, x.new_net, x.later_net, x.pre_net].concat(keys.map(q => x[q]), [c.tagged, c.from_receipt]); }));
    else if(k === "pnotes") csvDownload("product-notes", ["code","part","from","to","amount","count","note"], (d.notes || []).map(n => [n.code, n.part, n.from, n.to, n.amount, n.count, n.note]));
  };
}

/* ── 제품 한 개 상세(an v8 · #products/<제품>[/period]) ── 세트를 넘기면 창구가 base 로 올린다(rolled_to_base) */
async function loadProduct(id, selMode){
  const my = ++seq;
  const r = prodRange();
  $("load").textContent = "Loading…";
  const { data, error } = await crpc("an_product", { p_product: id, p_from: r.f, p_to: r.t, p_prev_from: r.pf, p_prev_to: r.pt, p_ly_from: r.lf, p_ly_to: r.lt,
    p_warehouse: $("branch").value || null, p_new_n: prodNewN });
  if(my !== seq) return;
  $("load").textContent = "";
  if(error){ $("box").innerHTML = `<div class="card anmsg"><b>Could not load</b>${esc(error.message)}<br><a class="lnk" href="#products">← All products</a></div>`; return; }
  data.pl = r.pl; data.ll = r.ll;
  last = { from: data.period.from, to: data.period.to, warehouse: data.warehouse, brand: null };
  $("built").textContent = data.launch_counted_at ? "Launch quarters counted " + torTime(data.launch_counted_at) + " (Toronto)" : "";
  renderProduct(data, id, selMode);
}
function renderProduct(d, id, selMode){
  $("box").onclick = null;
  const cc = !!d.can_cost, Pr = d.product || {}, P = d.period || {}, Cu = d.customers || {};
  const lbl = (per ? per.name + " · " : "") + fmtR(P.from, P.to);
  const scope = d.warehouse ? (/Edmonton/i.test(d.warehouse.name || "") ? "Edmonton" : "Toronto") : "All branches";
  const cmps = [{ c: d.prev, l: d.pl }, { c: d.ly, l: d.ll }].filter(x => x.c && x.l);
  const k2 = (label, va, key, fmt) => `<div class="card kpi"><div class="l">${label}</div><div class="v">${fmt(va)}</div>` +
    (cmps.map(x => `<div class="c">${change(va, x.c[key])} vs ${fmt(x.c[key])} ${esc(x.l)}</div>`).join("") || `<div class="c">&nbsp;</div>`) + `</div>`;
  const src = Pr.launch_source === "tag" ? "from its quarter tag" : Pr.launch_source === "first_in" ? "no quarter tag — from the first receipt" + (Pr.first_in ? " (" + esc(Pr.first_in) + ")" : "") : "";
  const base = "#products/" + encodeURIComponent(id);
  let h = `<div class="card" style="padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">` +
    `<a class="lnk" href="#products">← All products</a><span class="sp"></span>` +
    `<div style="flex-basis:100%;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span style="font-size:20px;font-weight:800;color:var(--ink)">${esc(Pr.name || "")}</span>` +
    `<span class="dim">${esc(Pr.sku || "")}${Pr.brand ? " · " + esc(Pr.brand) : ""}${Pr.category ? " · " + esc(Pr.category) : ""}</span>` +
    (Pr.is_active === false ? `<span class="badge risk">Inactive</span>` : "") +
    (Pr.launch_q ? `<span class="badge new" title="${esc(src)}">Launched ${esc(Pr.label || qLabel(Pr.launch_q))}</span>` : "") +
    `<span class="sp" style="flex:1"></span>${Pr.id ? `<a class="csvb" href="products.html?id=${encodeURIComponent(Pr.id)}" target="_blank" rel="noopener">Open product card</a>` : ""}</div></div>`;
  h += `<div class="kpis">` + k2(`Net sales — ${esc(lbl)}`, P.net, "net", money) + k2("Units (base)", P.qty, "qty", v => num(v)) +
    `<div class="card kpi"><div class="l">Customers</div><div class="v">${num(Cu.buyers)}</div><div class="c">${num(Cu.repeat_buyers)} bought on 2 or more days · ${esc(scope)}</div></div>` +
    (cc ? `<div class="card kpi"><div class="l">GP %</div><div class="v">${gpPct(P)}</div>` + cmps.map(x => `<div class="c">${gpPct(x.c)} ${esc(x.l)}</div>`).join("") + `</div>` : "") + `</div>`;
  h += `<div class="kpis">` +
    `<div class="card kpi"><div class="l">Launch quarter</div><div class="v" style="font-size:17px">${esc(Pr.label || (Pr.launch_q ? qLabel(Pr.launch_q) : "—"))}</div><div class="c">${src || esc(Pr.not_new_reason || "not counted as a new product")}${Pr.relaunch_q ? " · relaunch " + esc(qLabel(Pr.relaunch_q)) : ""}</div></div>` +
    `<div class="card kpi"><div class="l">New-product sales — this period</div><div class="v" style="font-size:17px">${money(P.new_net)}</div><div class="c">${Number(P.pre_launch) ? money(P.pre_launch) + " before launch (not counted as new)" : "&nbsp;"}</div></div>` +
    `<div class="card kpi"><div class="l">Customers — all history</div><div class="v" style="font-size:17px">${num(Cu.buyers_all)}</div><div class="c">${num(Cu.repeat_buyers_all)} bought on 2 or more days</div></div>` +
    `<div class="card kpi"><div class="l">Sales not linked to a customer</div><div class="v" style="font-size:17px">${money(Cu.no_customer)}</div><div class="c">older history orders · left out of customer counts</div></div>` +
    `</div>`;
  // 달 그래프 — 막대 색 = 출시 앞 · 신제품 기간 · 그 뒤
  const tm = todayTO().slice(0, 7);
  const months = (d.months || []).map(m => ({ ...m, era: "st-" + (m.state || "none"), partial: String(m.m).slice(0, 7) === tm, through: todayTO() }));
  const sel = selMode, pm0 = String(P.from).slice(0, 8) + "01";
  const mshow = sel ? months.filter(m => m.m >= pm0 && m.m <= P.to) : months;
  const tg = `<span class="seg2"><a href="${base}" class="${sel ? "" : "cur"}">All history</a><a href="${base}/period" class="${sel ? "cur" : ""}">Selected period</a></span>`;
  h += `<div class="card ancard"><h3>${sel ? "Net sales by month — selected period" : "Net sales by month — all history"} <span class="sub">${esc(scope)}</span><span class="sp"></span>${tg}<button class="csvb" data-csv="pmonths">CSV</button></h3>` +
    (mshow.length ? `<div class="body chart" id="mchart">${monthChart(mshow, cc)}` : `<div class="body"><span class="dim">No sales in these months.</span>`) +
    `<div class="legend"><span><i style="background:var(--ims-dim)"></i>Before launch</span><span><i style="background:var(--accent)"></i>Counted as new</span><span><i style="background:color-mix(in srgb,var(--accent) 45%,var(--ims-surface))"></i>After the new window</span>${cc ? `<span><i style="background:var(--good);height:3px"></i>GP %</span>` : ""}<span>Faded bar = month so far</span></div></div></div>`;
  // 세트 · 지점
  const gpc = x => cc ? `<td class="r">${gpPct(x)}</td>` : "";
  const sets = d.sets || [], brs = d.branches || [];
  const setT = sets.length > 1 ? `<div class="card ancard">${ahead("Packs and sets", esc(lbl), "psets")}<div class="body"><table><thead><tr><th>SKU</th><th class="r">Pack size</th><th class="r">Sold (packs)</th><th class="r">Units (base)</th><th class="r">Net sales</th>${cc ? `<th class="r">GP %</th>` : ""}</tr></thead><tbody>` +
    sets.map(x => `<tr><td>${esc(x.sku)}${x.is_base ? ` <span class="dim">(single)</span>` : ""}</td><td class="r">${num(x.pack_factor)}</td><td class="r">${num(x.qty_sold)}</td><td class="r">${num(x.qty)}</td><td class="r">${money(x.net)}</td>${gpc(x)}</tr>`).join("") + `</tbody></table></div></div>` : "";
  const brT = `<div class="card ancard">${ahead("By branch", esc(lbl), "pbranches")}<div class="body"><table><thead><tr><th>Branch</th><th class="r">Net sales</th><th class="r">Units</th>${cc ? `<th class="r">GP %</th>` : ""}</tr></thead><tbody>` +
    (brs.length ? brs.map(x => `<tr><td>${esc(x.label)}</td><td class="r">${money(x.net)}</td><td class="r">${num(x.qty)}</td>${gpc(x)}</tr>`).join("") : `<tr><td colspan="4" class="dim">No sales in this period.</td></tr>`) + `</tbody></table></div></div>`;
  h += setT ? `<div class="two">${setT}${brT}</div>` : brT;
  // 상위 손님
  const tc = d.top_customers || [];
  h += `<div class="card ancard">${ahead("Customers who bought it", `${esc(lbl)} · ${esc(scope)}`, "pcust")}<div class="body"><table><thead><tr><th>Customer</th><th class="r">Net sales</th><th>Share</th><th class="r">Order days</th><th>Last order</th></tr></thead><tbody>` +
    (tc.length ? tc.map(x => `<tr><td><a class="lnk" href="#customers/${encodeURIComponent(x.key)}">${esc(x.name)}</a></td><td class="r">${money(x.net)}</td><td>${x.share !== null && x.share !== undefined ? `<span class="share" style="width:${Math.max(1, Math.round(60 * x.share))}px"></span>${pct(x.share)}` : ""}</td><td class="r">${num(x.order_days)}</td><td>${esc(x.last_order || "")}</td></tr>`).join("") : `<tr><td colspan="5" class="dim">No customer bought it in this period.</td></tr>`) +
    `</tbody></table></div></div>`;
  h += prodNotesHtml(d.notes, []);
  $("box").innerHTML = h;
  $("box").querySelectorAll("#mchart rect.bar").forEach(rc => {
    rc.addEventListener("mousemove", e => { const m = mshow[+rc.dataset.i];
      const stl = m.state === "pre" ? "before launch" : m.state === "new" ? "counted as new" : m.state === "later" ? "after the new window" : "";
      $("tip").innerHTML = `<b>${esc(m.m)}</b>${m.month_since_launch !== null && m.month_since_launch !== undefined ? " · month " + (m.month_since_launch + 1) + " since launch" : ""}${stl ? " · " + stl : ""}${m.partial ? " · so far" : ""}<br>Net ${money(m.net)} · ${num(m.qty)} units · ${num(m.orders)} orders` + (cc ? `<br>GP ${gpPct(m)}` : ""); tipAt(e); });
    rc.addEventListener("mouseleave", () => { $("tip").hidden = true; });
  });
  $("box").onclick = e => {
    const btn = e.target.closest("[data-csv]"); if(!btn) return;
    const keys = PCK(cc), nm = (Pr.sku || "product").replace(/\W+/g, "_"), k = btn.dataset.csv;
    if(k === "pmonths") csvDownload("product-" + nm + "-months", ["month","month_since_launch","state","orders"].concat(keys), mshow.map(m => [m.m, m.month_since_launch === null || m.month_since_launch === undefined ? "" : m.month_since_launch + 1, m.state, m.orders].concat(keys.map(q => m[q]))));
    else if(k === "psets") csvDownload("product-" + nm + "-packs", ["sku","single","pack_size","sold_packs"].concat(keys), sets.map(x => [x.sku, x.is_base, x.pack_factor, x.qty_sold].concat(keys.map(q => x[q]))));
    else if(k === "pbranches") csvDownload("product-" + nm + "-branches", ["branch"].concat(keys), brs.map(x => [x.label].concat(keys.map(q => x[q]))));
    else if(k === "pcust") csvDownload("product-" + nm + "-customers", ["customer","net","share","order_days","last_order"], tc.map(x => [x.name, x.net, x.share, x.order_days, x.last_order]));
    else if(k === "pnotes") csvDownload("product-" + nm + "-notes", ["code","part","from","to","amount","count","note"], (d.notes || []).map(n => [n.code, n.part, n.from, n.to, n.amount, n.count, n.note]));
  };
}

/* ── 탭 ── */
async function runLoad(){   // an v6 — 기억 표시를 위해 모든 읽기를 이 길로
  rpcOldest = null;
  try { await TABS[tab].load(); } finally { rpcFresh = false; memoNote(); }
}
function drawTabs(){
  $("tabs").innerHTML = Object.keys(TABS).map(k => `<a href="#${k}" class="${k === tab ? "cur" : ""}">${esc(TABS[k].label)}</a>`).join("");
}
let routeArgs = [];   // an v5 — #customers/<손님>/<period>
function route(){
  const parts = (location.hash || "").replace("#", "").split("/").map(decodeURIComponent);
  const want = parts[0];
  routeArgs = parts.slice(1).filter(Boolean);
  tab = TABS[want] ? want : "overview";
  drawTabs();
  runLoad();
}

/* ── 시작 ── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; window.sb = sb;
  imsHeader(me);
  $("buildTag").textContent = AN_BUILD;
  if(!imsAuth.canView("analytics")){   // 판정 1292-2 — 창구도 막지만 먼저 안내
    $("box").innerHTML = `<div class="card anmsg"><b>Analytics is not switched on for you</b>Ask an admin to turn on the 'analytics' permission in Staff — admins need it switched on too.</div>`;
    document.querySelector(".antop .noprint").hidden = true;
    return;
  }
  const { data: wh } = await sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name");
  WH = (wh || []).filter(w => /^Asung Trading Inc\.$/.test(w.name) || /Edmonton/i.test(w.name));   // 판매 지점 둘만(an-1c — 그 밖은 창구가 거부)
  $("branch").insertAdjacentHTML("beforeend", WH.map(w => `<option value="${esc(w.id)}">${esc(/Edmonton/i.test(w.name) ? "Edmonton" : "Toronto")}</option>`).join(""));
  $("period").onchange = () => { const c = $("period").value === "custom"; $("pFrom").hidden = !c; $("pTo").hidden = !c; if(!c) runLoad(); };
  $("branch").onchange = () => runLoad();
  $("apply").onclick = () => { rpcFresh = true; runLoad(); };   // an v6 — Show = 새로 읽기
  $("brand").addEventListener("keydown", e => { if(e.key === "Enter") runLoad(); });
  $("print").onclick = () => window.print();
  window.addEventListener("hashchange", route);
  route();
});
</script>
