}

/* ── ④ Searches ── */
function wsSearches(w, store){
  const d = w[0], h = d.head || {}, terms = wsArr(d.terms), missed = wsArr(d.missed), clicked = wsArr(d.clicked);
  const isAone = store === "aone";
  let o = `<div class="kpis">` +
    wsKpi("Searches", h.searches, num, `${num(h.visitors)} visitors · ${num(h.terms)} different words`) +
    wsKpi("Found nothing", h.zero, num, `${rate(h.zero_rate)} of searches`) +
    wsKpi("No product opened after", h.noclick, num, `${rate(h.noclick_rate)} of searches`) +
    wsKpi("Searched more than once", h.research_visitors, num, "visitors") +
    (isAone ? wsKpi("Cart adds after a search", h.carts, num, "") : "") +
    wsKpi("Words worth a look", h.missed_terms, num, "found nothing, or nobody opened a result") + `</div>`;
  const termRow = t => `<tr><td>${esc(t.query)}${t.missed ? ` <span class="wschip" title="Found nothing, or no product was opened after it">look</span>` : ""}</td><td class="r">${num(t.searches)}</td><td class="r">${num(t.visitors)}</td><td class="r">${t.results === null || t.results === undefined ? "—" : num(t.results)}</td><td class="r">${num(t.zero_searches)}</td><td class="r">${ip(t.noclick_pct)}</td>${isAone ? `<td class="r">${num(t.carts)}</td>` : ""}</tr>`;
  const termHead = `<thead><tr><th>Search</th><th class="r">Searches</th><th class="r">Visitors</th><th class="r">Results</th><th class="r">Found nothing</th><th class="r">No product opened</th>${isAone ? `<th class="r">Cart adds</th>` : ""}</tr></thead>`;
  o += `<div class="card ancard">${ahead("What people searched for", wsScope(d, store) + ` · ${num(d.total)} words`, "wsterms")}<div class="body">` +
    (terms.length ? `<table class="wst">${termHead}<tbody>${terms.map(termRow).join("")}</tbody></table>` + wsTrunc(d, "words") : `<div class="dim">No searches in this period.</div>`) + `</div></div>`;
  o += `<div class="card ancard">${ahead("Searches worth a look", `found nothing, or nobody opened a result · ${num(d.missed_total)} words`, "wsmissed")}<div class="body">` +
    (missed.length ? `<table class="wst">${termHead}<tbody>${missed.map(termRow).join("")}</tbody></table>` : `<div class="dim">None in this period.</div>`) + `</div></div>`;
  o += `<div class="card ancard">${ahead("Products opened from a search", `${num(d.clicked_total)} search × product pairs`, "wsclicked")}<div class="body">` +
    (clicked.length ? `<table class="wst"><thead><tr><th>Search</th><th>Product opened</th><th>Brand</th><th class="r">Times</th></tr></thead><tbody>` +
      clicked.map(c => `<tr><td>${esc(c.query)}</td><td>${esc(c.sku || "")}${c.title ? `<div class="wssub2">${esc(c.title)}</div>` : ""}</td><td>${esc(c.brand || "")}</td><td class="r">${num(c.clicks)}</td></tr>`).join("") + `</tbody></table>`
      : `<div class="dim">None in this period.</div>`) + `</div></div>`;
  const tcsv = (k, list) => wsCsv[k] = () => csvDownload(`web-${store}-${k.slice(2)}`, ["search", "searches", "visitors", "results", "zero", "zero_searches", "no_product_opened", "no_product_opened_pct", "cart_adds", "worth_a_look"], list.map(t => [t.query, t.searches, t.visitors, t.results, t.zero, t.zero_searches, t.noclick, t.noclick_pct, t.carts, t.missed]));
  tcsv("wsterms", terms); tcsv("wsmissed", missed);
  wsCsv.wsclicked = () => csvDownload(`web-${store}-search-clicks`, ["search", "sku", "title", "brand", "clicks"], clicked.map(c => [c.query, c.sku, c.title, c.brand, c.clicks]));
  return o + wsNotes(d.notes);
}

/* ── ⑤ Where ── */
function wsWhere(w, store){
  const d = w[0], mode = WS.whereMode === "registered" ? "registered" : "visited", x = d[mode] || {}, br = x.branches || {};
  const pv = wsArr(x.provinces), ct = wsArr(x.cities);
  const tog = `<span class="seg2"><a href="#" data-act="where" data-mode="visited" class="${mode === "visited" ? "cur" : ""}">Signed in this period</a><a href="#" data-act="where" data-mode="registered" class="${mode === "registered" ? "cur" : ""}">All registered accounts</a></span>`;
  let o = `<div class="wstog">${tog} <span class="dim">${mode === "visited" ? "accounts that signed in during the period — anonymous visitors have no location" : "every account on the store's Shopify customer list — the period does not apply"}</span></div>`;
  o += `<div class="kpis">` + wsKpi("Accounts", x.customers, num, "") + wsKpi("In Canada", x.canada, num, `${num(x.outside_or_unknown)} outside Canada or unknown`) +
    wsKpi("Toronto branch", br.tor, num, "") + wsKpi("Edmonton branch", br.edm, num, `${num(br.none)} no branch`) + `</div>`;
  const pmax = Math.max(1, ...pv.map(p => Number(p.customers) || 0));
  o += `<div class="two"><div class="card ancard">${ahead("By province", mode === "visited" ? wsScope(d, store) : esc(store === "aone" ? "aonebeauty.com" : "asung.ca") + " · all registered", "wsprov")}<div class="body"><table class="wst"><thead><tr><th>Province</th><th class="r">Accounts</th><th></th></tr></thead><tbody>` +
    pv.map(p => `<tr${!Number(p.customers) || p.code === "unknown" ? ' class="dim"' : ""}><td>${esc(p.label || p.code)}</td><td class="r">${num(p.customers)}</td><td style="width:45%"><span class="share" style="width:${Math.max(2, Math.round((Number(p.customers) || 0) / pmax * 100))}%;background:var(--an-ch-${store})"></span>${rate(p.share)}</td></tr>`).join("") +
    `</tbody></table></div></div>` +
    `<div class="card ancard">${ahead("Top cities", "accounts with a city", "wscity")}<div class="body">` +
    (ct.length ? `<table class="wst"><thead><tr><th>City</th><th>Province</th><th class="r">Accounts</th></tr></thead><tbody>` + ct.map(c => `<tr><td>${esc(c.city)}</td><td>${esc(c.province || "—")}</td><td class="r">${num(c.customers)}</td></tr>`).join("") + `</tbody></table>`
      : `<div class="dim">No cities.</div>`) + `</div></div></div>`;
  wsCsv.wsprov = () => csvDownload(`web-${store}-provinces-${mode}`, ["province", "label", "accounts", "share"], pv.map(p => [p.code, p.label, p.customers, p.share]));
  wsCsv.wscity = () => csvDownload(`web-${store}-cities-${mode}`, ["city", "province", "accounts"], ct.map(c => [c.city, c.province, c.customers]));
  return o + wsNotes(d.notes);
}

/* ── ⑥ Not ordering ── */
function wsNotOrdering(w, store){
  const d = w[0], a = w[1] || {}, v = d.visited_no_order || {}, s = d.spy || {}, dm = a.dormant || {}, nv = a.never_visited || {};
  const vh = v.head || {}, sh = s.head || {}, vr = wsArr(v.rows), sr = wsArr(s.rows), dr = wsArr(dm.rows), nr = wsArr(nv.rows);
  const isAone = store === "aone";
  const bot = r => r.bot_level >= 2 ? ` <span class="badge risk" title="Browsing pattern looks automated">bot</span>` : r.bot_level === 1 ? ` <span class="wschip" title="Browsing pattern may be automated">bot?</span>` : "";
  const risk = r => r.risk === "high" ? `<span class="badge risk">high</span>` : r.risk === "mid" ? `<span class="wschip">mid</span>` : `<span class="dim">low</span>`;
  // ①
  const bar1 = `<div class="pbar">` + (isAone ? "" : `Accounts ${wsSel("noApproved", WS.noApproved, [["approved", "Approved"], ["all", "All"], ["not_approved", "Not approved"]])}`) +
    `At least ${wsSel("noMinViews", WS.noMinViews, [[1, "1 view"], [3, "3 views"], [10, "10 views"], [30, "30 views"]])}</div>`;
  let o = `<div class="card ancard">${ahead("Visited but did not order", wsScope(d, store) + " · signed in during the period and have not ordered since their last visit", "wsno1")}${bar1}<div class="body">` +
    `<div class="wschips"><span><b>${num(vh.customers)}</b> accounts</span>${isAone ? "" : `<span><b>${num(vh.approved)}</b> approved</span>`}<span><b>${num(vh.never_bought)}</b> never ordered</span><span><b>${num(vh.bought_before)}</b> ordered before</span><span><b>${num(vh.company_accounts)}</b> company · <b>${num(vh.personal_accounts)}</b> personal</span><span><b>${num(vh.bot_suspects)}</b> may be bots</span></div>` +
    (vr.length ? `<table class="wst"><thead><tr><th>Account</th><th>Contact</th><th>Where</th><th class="r">Views</th><th class="r">Days</th><th>Last visit</th><th>Last order</th><th>Watch</th></tr></thead><tbody>` +
      vr.map(r => `<tr><td>${wsWho(r)}${bot(r)}</td><td>${wsContact(r)}</td><td>${wsPlace(r)}</td><td class="r">${num(r.views)}</td><td class="r">${num(r.visit_days)}</td><td class="nw">${esc(toT(r.last_visit))}</td><td class="nw">${r.last_order ? esc(dayT(r.last_order)) : `<span class="dim">never</span>`}</td><td>${risk(r)}</td></tr>`).join("") + `</tbody></table>` + wsTrunc(v, "accounts")
      : `<div class="dim">Everyone who signed in has ordered since.</div>`) +
    `<div class="dim wsfoot">An order on any channel counts (order date, invoiced or not). Watch: high = company account with 10+ views · mid = one of the two · low = neither.</div></div></div>`;
  const noCsv = (k, rows, extra) => wsCsv[k] = () => csvDownload(`web-${store}-${k}`, WS_CARD_HEAD.concat(["views", "visit_days", "first_visit", "last_visit", "last_visit_day", "ever_bought", "last_order", "views_per_day", "median_gap_sec", "fast_ratio", "bot_level", "risk"]),
    rows.map(r => wsCardCsv(r).concat([r.views, r.visit_days, r.first_visit, r.last_visit, r.last_visit_day, r.ever_bought, r.last_order, r.views_per_day, r.median_gap_sec, r.fast_ratio, r.bot_level, r.risk])));
  noCsv("wsno1", vr);
  // ②
  const bar2 = `<div class="pbar">Visited on at least ${wsSel("spyDays", WS.spyDays, [[5, "5 different days"], [7, "7 different days"], [10, "10 different days"], [14, "14 different days"], [20, "20 different days"]])}</div>`;
  o += `<div class="card ancard">${ahead("Possible price watchers", "approved accounts that have never ordered but keep coming back", "wsno2")}${isAone ? "" : bar2}<div class="body">` +
    (isAone ? `<div class="dim">aonebeauty.com has no wholesale approval, so there is no list here.</div>`
      : `<div class="wschips"><span><b>${num(sh.customers)}</b> accounts</span><span><b>${num(sh.company_accounts)}</b> company · <b>${num(sh.personal_accounts)}</b> personal</span><span><b>${num(sh.bot_suspects)}</b> may be bots</span></div>` +
        (sr.length ? `<table class="wst"><thead><tr><th>Account</th><th>Contact</th><th>Where</th><th class="r">Days</th><th class="r">Views</th><th class="r">Views a day</th><th class="r">Typical gap</th><th>Last visit</th><th>Watch</th></tr></thead><tbody>` +
          sr.map(r => `<tr><td>${wsWho(r)}${bot(r)}</td><td>${wsContact(r)}</td><td>${wsPlace(r)}</td><td class="r">${num(r.visit_days)}</td><td class="r">${num(r.views)}</td><td class="r">${num(r.views_per_day, 1)}</td><td class="r">${r.median_gap_sec === null || r.median_gap_sec === undefined ? "—" : num(r.median_gap_sec, 1) + " s"}</td><td class="nw">${esc(toT(r.last_visit))}</td><td>${risk(r)}</td></tr>`).join("") + `</tbody></table>` + wsTrunc(s, "accounts")
          : `<div class="dim">No account matches in this period.</div>`)) + `</div></div>`;
  noCsv("wsno2", sr);
  // ③ · ④ — 전 기간
  const bar3 = `<div class="pbar">Last visit more than ${wsSel("gapDays", WS.gapDays, [[14, "14 days ago"], [30, "30 days ago"], [60, "60 days ago"], [90, "90 days ago"]])}</div>`;
  const brn = b => b === "tor" ? "Toronto" : b === "edm" ? "Edmonton" : "—";
  o += `<div class="card ancard">${ahead("Customers who stopped visiting", "all history — not the period above · bought before, last visit long ago · longest gap first", "wsno3")}${bar3}<div class="body">` +
    `<div class="wschips"><span><b>${num((dm.head || {}).customers)}</b> customers</span><span><b>${money((dm.head || {}).sales)}</b> their sales</span></div>` +
    (dr.length ? `<table class="wst"><thead><tr><th>Customer</th><th>Branch</th><th>Last visit</th><th class="r">Days ago</th><th class="r">Views</th><th class="r">Orders</th><th class="r">Sales</th><th>Last invoice</th></tr></thead><tbody>` +
      dr.map(r => `<tr><td><a class="lnk" href="#customers/${encodeURIComponent(r.customer_id)}">${esc(r.customer_name || "customer")}</a></td><td>${brn(r.branch)}</td><td class="nw">${esc(dayT(r.last_visit_day))}</td><td class="r">${num(r.days_since_visit)}</td><td class="r">${num(r.views)}</td><td class="r">${num(r.orders)}</td><td class="r">${money(r.sales)}</td><td class="nw">${esc(dayT(r.last_order))}</td></tr>`).join("") + `</tbody></table>` + wsTrunc(dm, "customers")
      : `<div class="dim">None.</div>`) + `</div></div>`;
  wsCsv.wsno3 = () => csvDownload(`web-${store}-stopped-visiting`, ["customer_id", "customer", "branch", "last_visit", "last_visit_day", "days_since_visit", "views", "visit_days", "orders", "sales", "last_invoice"], dr.map(r => [r.customer_id, r.customer_name, r.branch, r.last_visit, r.last_visit_day, r.days_since_visit, r.views, r.visit_days, r.orders, r.sales, r.last_order]));
  const bar4 = `<div class="pbar">Sales at least ${wsSel("minSales", WS.minSales, [[0, "any"], [500, "$500"], [2000, "$2,000"], [10000, "$10,000"]])}</div>`;
  o += `<div class="card ancard">${ahead("Customers who never visited", "all history · bought before but no recognisable visit to this store · biggest sales first", "wsno4")}${bar4}<div class="body">` +
    `<div class="wschips"><span><b>${num((nv.head || {}).customers)}</b> customers</span><span><b>${money((nv.head || {}).sales)}</b> their sales</span></div>` +
    (nr.length ? `<table class="wst"><thead><tr><th>Customer</th><th>Branch</th><th class="r">Orders</th><th class="r">Sales</th><th>Last invoice</th></tr></thead><tbody>` +
      nr.map(r => `<tr><td><a class="lnk" href="#customers/${encodeURIComponent(r.customer_id)}">${esc(r.customer_name || "customer")}</a></td><td>${brn(r.branch)}</td><td class="r">${num(r.orders)}</td><td class="r">${money(r.sales)}</td><td class="nw">${esc(dayT(r.last_order))}</td></tr>`).join("") + `</tbody></table>` + wsTrunc(nv, "customers")
      : `<div class="dim">None.</div>`) + `</div></div>`;
  wsCsv.wsno4 = () => csvDownload(`web-${store}-never-visited`, ["customer_id", "customer", "branch", "orders", "sales", "last_invoice"], nr.map(r => [r.customer_id, r.customer_name, r.branch, r.orders, r.sales, r.last_order]));
  const seen = new Set(), notes = wsArr(d.notes).concat(wsArr(a.notes)).filter(n => { const k = n.code + "|" + n.part + "|" + n.from; if(seen.has(k)) return false; seen.add(k); return true; });
  return o + wsNotes(notes);
}

/* 눌림 · 고르기 */
function wsWire(){
  $("box").onclick = e => {
    const c = e.target.closest("[data-csv]"); if(c && wsCsv[c.dataset.csv]){ wsCsv[c.dataset.csv](); return; }
    const a = e.target.closest("[data-act]"); if(!a) return;
    e.preventDefault();
    const k = a.dataset.act;
    if(k === "vlog") wsOpenLog({ cid: a.dataset.cid });
    else if(k === "viewers") wsOpenViewers(a.dataset.sku ? { sku: a.dataset.sku } : { brand: a.dataset.brand });
    else if(k === "brandpick"){ WS.brand = a.dataset.brand || ""; runLoad(); }
    else if(k === "brandclear"){ WS.brand = ""; runLoad(); }
    else if(k === "where"){ WS.whereMode = a.dataset.mode; $("box").innerHTML = wsBar(wsSub(), wsStore()) + wsWhere(wsd, wsStore()); wsWire(); }
  };
  $("box").onchange = e => {
    const el = e.target; if(!el.dataset || !el.dataset.ws) return;
    const k = el.dataset.ws, v = el.value;
    WS[k] = ["minViews", "noMinViews", "spyDays", "gapDays", "minSales"].includes(k) ? Number(v) : v;
    runLoad();
  };
  $("box").onkeydown = e => {
    const el = e.target; if(e.key !== "Enter" || !el.dataset || el.dataset.wsk !== "brand") return;
    WS.brand = el.value.trim(); runLoad();
  };
}

/* ── 창: 방문 내역 · 조회자 ── */
function wsModal(title, html){
  let m = $("wsModal");
  if(!m){ m = document.createElement("div"); m.id = "wsModal"; m.className = "pomodal"; document.body.appendChild(m);
    m.onclick = e => {
      if(e.target === m || e.target.closest("[data-x]")){ wsModalClose(); return; }
      const ln = e.target.closest('a[href^="#"]');
      if(ln && !ln.dataset.act && ln.getAttribute("href") !== "#"){ setTimeout(wsModalClose, 0); return; }   // 손님 · 제품 상세로 가는 링크 — 이동은 그대로 · 창만 닫는다
      wsModalAct(e);
    };
    document.addEventListener("keydown", e => { if(e.key === "Escape" && $("wsModal") && !$("wsModal").hidden) wsModalClose(); }); }
  m.hidden = false;
  m.innerHTML = `<div class="pobox wsbox"><h4>${title}</h4><div class="pbody">${html}</div><div class="pfoot"><span class="sp"></span><button class="pobtn" data-x="1">Close</button></div></div>`;
}
function wsModalClose(){ const m = $("wsModal"); if(m){ m.hidden = true; m.innerHTML = ""; } }
function wsModalAct(e){
  const a = e.target.closest("[data-act]"); if(!a) return;
  e.preventDefault();
  if(a.dataset.act === "vlog") wsOpenLog({ cid: a.dataset.cid });
  else if(a.dataset.act === "vlogc") wsOpenLog({ client: a.dataset.client });
}
const WS_TYPE = { page_view: "Page", product_view: "Product", account_view: "Account", search: "Search", cart_add: "Cart add", checkout: "Checkout" };
async function wsOpenLog(o){
  const store = wsStore();
  wsModal("Visit history", `<div class="dim">Loading…</div>`);
  const { data: d, error } = await crpc("an_web_visit_log", { p_store: store, p_shopify_customer_id: o.cid || null, p_client_id: o.client || null, p_limit: 200 });
  if(!$("wsModal") || $("wsModal").hidden) return;
  if(error){ wsModal("Visit history", `<div class="pwarn">${esc(error.message)}</div>`); return; }
  const who = d.who || {}, s = d.summary || {}, cd = d.cadence, rows = wsArr(d.rows);
  const title = o.client ? "Browser " + esc(o.client) : esc(who.label || "Shopify customer " + (who.shopify_customer_id || ""));
  let h = "";
  if(!o.client) h += `<div class="wslogwho">${who.customer_id ? `IMS: <a class="lnk" href="#customers/${encodeURIComponent(who.customer_id)}">${esc(who.customer_name || "customer")} ›</a> · ` : ""}${who.email ? esc(who.email) + " · " : ""}${who.company && who.company !== who.label ? esc(who.company) + " · " : ""}${[who.city, who.province].filter(Boolean).map(esc).join(", ")}</div>`;
  h += `<div class="wschips"><span><b>${num(s.visit_days)}</b> days</span><span><b>${num(s.page_views)}</b> pages</span><span><b>${num(s.product_views)}</b> products</span>` +
    (Number(s.searches) ? `<span><b>${num(s.searches)}</b> searches</span>` : "") + (Number(s.cart_adds) ? `<span><b>${num(s.cart_adds)}</b> cart adds</span>` : "") + (Number(s.checkouts) ? `<span><b>${num(s.checkouts)}</b> checkouts</span>` : "") +
    `<span><b>${num(s.browsers)}</b> browser${Number(s.browsers) === 1 ? "" : "s"}</span><span>${esc(toT(s.first_at))} – ${esc(toT(s.last_at))}</span></div>`;
  if(cd) h += `<div class="dim" style="font-size:12.5px;margin:4px 0 8px">Typical gap between views ${num(cd.median_gap_sec, 1)} s · ${rate(cd.fast_ratio)} within 3 s${cd.machine_like ? ` <span class="badge risk">looks automated</span>` : ""}</div>`;
  h += rows.length ? `<table class="wst"><thead><tr><th>When (Toronto)</th><th>What</th><th>Detail</th><th>Browser</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td class="nw">${esc(toT(r.at))}</td><td class="nw">${esc(WS_TYPE[r.type] || r.type)}${r.attached ? ` <span class="wschip" title="Viewed before signing in on the same browser that day">before sign-in</span>` : !r.signed_in ? ` <span class="dim">anonymous</span>` : ""}</td>` +
      `<td>${r.sku ? esc(r.sku) + (r.product ? " · " + esc(r.product) : "") + (r.quantity ? " × " + num(r.quantity) : "") : r.query ? `“${esc(r.query)}”${r.results === null || r.results === undefined ? "" : " · " + num(r.results) + " results"}` : esc(r.page || "")}${r.title && !r.sku ? `<div class="wssub2">${esc(r.title)}</div>` : ""}</td>` +
      `<td>${r.client_id && !o.client ? `<a class="lnk" href="#" data-act="vlogc" data-client="${esc(r.client_id)}" title="Everything this browser did">${esc(String(r.client_id).slice(0, 8))}…</a>` : `<span class="dim">${esc(String(r.client_id || "").slice(0, 8))}</span>`}</td></tr>`).join("") +
    `</tbody></table>` + wsTrunc(d, "events") : `<div class="dim">No visits in the last 180 days.</div>`;
  h += `<div class="dim wsfoot">The last 180 days, newest first.${o.client ? " A browser's history includes anonymous visits." : " An account's history includes what the same browser viewed before signing in that day."}</div>`;
  wsModal(title, h);
}
async function wsOpenViewers(o){
  const store = wsStore(), what = o.sku ? o.sku : o.brand;
  wsModal("Who viewed " + esc(what), `<div class="dim">Loading…</div>`);
  const { data: d, error } = await crpc("an_web_viewers", { p_from: per.f, p_to: per.t, p_store: store, p_sku: o.sku || null, p_brand: o.brand || null, p_limit: 100 });
  if(!$("wsModal") || $("wsModal").hidden) return;
  if(error){ wsModal("Who viewed " + esc(what), `<div class="pwarn">${esc(error.message)}</div>`); return; }
  const h0 = d.head || {}, rows = wsArr(d.rows);
  let h = `<div class="wschips"><span><b>${num(h0.views)}</b> views</span><span><b>${num(h0.login_viewers)}</b> signed-in accounts (${num(h0.login_views)} views)</span><span><b>${num(h0.anon_views)}</b> anonymous views from ${num(h0.anon_visitors)} browsers</span></div>`;
  h += rows.length ? `<table class="wst"><thead><tr><th>Account</th><th>Contact</th><th class="r">Views</th><th>Last view</th><th>Has ordered</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${wsWho(r)}</td><td>${wsContact(r)}</td><td class="r">${num(r.views)}</td><td class="nw">${esc(toT(r.last_view))}</td><td class="nw">${r.ever_bought ? "yes" + (r.last_order ? " · " + esc(dayT(r.last_order)) : "") : `<span class="dim">never</span>`}</td></tr>`).join("") +
    `</tbody></table>` + wsTrunc(d, "accounts") : `<div class="dim">Only anonymous visitors viewed this in the period.</div>`;
  h += `<div class="dim wsfoot">${esc(per.name)} · ${esc(fmtR(per.f, per.t))}. "Has ordered" means anything, on any channel — not only this product. Click a name for their visit history.</div>`;
  wsModal("Who viewed " + esc(what), h);
}

function drawTabs(){
  $("tabs").innerHTML = Object.keys(TABS).map(k => `<a href="#${k}" class="${k === tab ? "cur" : ""}">${esc(TABS[k].label)}</a>`).join("");
}
let routeArgs = [];   // an v5 — #customers/<손님>/<period>
function route(){
  const parts = (location.hash || "").replace("#", "").split("/").map(decodeURIComponent);
  const want = parts[0];
  routeArgs = parts.slice(1).filter(Boolean);
  tab = TABS[want] ? want : "overview";
  const isWeb = tab === "website";   // an v11 — Website 창구는 지점 · 브랜드를 받지 않는다
  $("branch").hidden = isWeb; $("brand").hidden = isWeb;
  drawTabs();
  runLoad();
}

/* ── 시작 ── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; window.sb = sb;
  imsHeader(me);
  $("buildTag").textContent = AN_BUILD;
  if(!imsAuth.canView("analytics")){   // 판정 1292-2 — 창구도 막지만 먼저 안내
    $("box").innerHTML = `<div class="card anmsg"><b>Analytics is not switched on for you</b>Ask an admin to turn on the 'analytics' permission in Staff — admins need it switched on too.</div>`;
    document.querySelector(".antop .noprint").hidden = true;
    return;
  }
  const { data: wh } = await sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name");
  WH = (wh || []).filter(w => /^Asung Trading Inc\.$/.test(w.name) || /Edmonton/i.test(w.name));   // 판매 지점 둘만(an-1c — 그 밖은 창구가 거부)
  $("branch").insertAdjacentHTML("beforeend", WH.map(w => `<option value="${esc(w.id)}">${esc(/Edmonton/i.test(w.name) ? "Edmonton" : "Toronto")}</option>`).join(""));
  $("dFrom").max = todayTO(); $("dTo").max = todayTO();
  $("period").onchange = () => {   // an v12 — Custom months · Custom dates 는 칸을 보이고 Show 를 기다린다
    const v = $("period").value, c = v === "custom", cd = v === "cdays";
    $("pFrom").hidden = !c; $("pTo").hidden = !c; $("dFrom").hidden = !cd; $("dTo").hidden = !cd;
    if(!cd) $("dNote").hidden = true;
    if(cd && !$("dFrom").value){ $("dFrom").value = addD(todayTO(), -6); $("dTo").value = todayTO(); }
    if(!c && !cd) runLoad();
  };
  $("branch").onchange = () => runLoad();
  $("apply").onclick = () => { rpcFresh = true; runLoad(); };   // an v6 — Show = 새로 읽기
  $("brand").addEventListener("keydown", e => { if(e.key === "Enter") runLoad(); });
  $("print").onclick = () => window.print();
  window.addEventListener("hashchange", route);
  route();
});
