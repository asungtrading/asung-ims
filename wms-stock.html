<!doctype html>
<html lang="en" data-ims-mode="wms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Stock Lookup · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* ws v1(대화 Claude · 2026-10-20) — 새 WMS 화면. 모양은 wms-mover.html(mv v2.3)의 카드 · 스캔 칸을 본떴다.
     헤더 · 로그인 · 메뉴 · 탭 줄은 IMS 공통(ims-ui.css · ims-auth.js). */
  :root{
    --ink:#12161c; --line:#e5e9ef; --paper:#f7f8fa; --card:#ffffff; --mut:#6b7686; --mut-2:#9aa4b2;
    --accent:#2f6df6; --ok:#16a34a; --warn:#d9820a; --warn-bg:#fdf6ec; --danger:#dc2626; --danger-bg:#fdecec;
    --radius:12px; --shadow:0 1px 2px rgba(16,22,30,.04),0 4px 16px rgba(16,22,30,.05);
    --mono:ui-monospace,"SF Mono","DM Mono",Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;overscroll-behavior:none}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.45}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut-2)}
  .dot.on{background:var(--ok)} .dot.err{background:var(--danger)}

  main{max-width:760px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .ttl{font-family:var(--mono);font-weight:800;font-size:17px}
  .top .sp{flex:1}
  .top label{font-size:12.5px;display:flex;align-items:center;gap:5px;color:var(--mut)}

  .scanin{width:100%;border:2px solid var(--accent);border-radius:12px;padding:14px 16px;font:inherit;font-size:16px;font-family:var(--mono);letter-spacing:.02em;background:#fff}
  .scanin:focus{outline:none;box-shadow:0 0 0 4px rgba(47,109,246,.15)}
  .scanhint{font-size:11.5px;color:var(--mut);font-family:var(--mono);margin:6px 2px 0;display:flex;align-items:center;gap:6px}
  .scanhint .live{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .err{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--danger-bg);color:var(--danger);font-size:13px}
  .empty{padding:18px 14px;color:var(--mut);font-size:13px;text-align:center}
  .more{font-size:12px;color:var(--mut);text-align:center;margin:10px 0}

  .pc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-top:12px}
  .pc.off{opacity:.75}
  .ph{display:flex;gap:12px;align-items:flex-start}
  .ph img,.ph .noimg{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#f2f4f8;flex:0 0 64px}
  .ph .noimg{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut)}
  .ph .grow{flex:1;min-width:0}
  .sku{font-family:var(--mono);font-weight:800;font-size:17px}
  .nm{font-size:13.5px;margin-top:1px}
  .br{font-size:12px;color:var(--mut)}
  .setm{font-size:12px;color:#a86400;font-family:var(--mono);margin-top:3px}
  .salet{display:inline-block;background:#e03131;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap;font-family:var(--sans);vertical-align:middle}
  .offt{display:inline-block;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:0 7px;font-size:11px;margin-left:6px}

  .whs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:10px}
  .wb{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .wb.mine{border-color:#bcd0f6;background:#f8faff}
  .wb .wn{font-family:var(--mono);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;gap:6px;align-items:center}
  .wb .wn .sp{flex:1}
  .nums{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .nums .n{display:flex;flex-direction:column;min-width:52px}
  .nums .n b{font-family:var(--mono);font-size:16px}
  .nums .n span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .nums .n.av b{font-size:20px;color:var(--ok)}
  .nums .n.av.zero b{color:var(--danger)}
  .nums .n b.neg{color:var(--danger)}
  .nums button.n{border:0;background:none;padding:0;font:inherit;text-align:left;cursor:pointer}
  .nums button.n b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .bins{margin-top:8px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px}
  .bin{font-family:var(--mono);font-weight:700;background:#f2f4f8;border-radius:7px;padding:3px 8px}
  .bin .q{color:var(--mut);font-weight:600;margin-left:4px}
  .bin.offb{color:var(--mut-2)}
  .val{font-size:12px;color:var(--mut);margin-top:6px}
  .val b{color:var(--ink);font-family:var(--mono)}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:12px;font-weight:700;padding:5px 9px;cursor:pointer;color:var(--mut)}
  .sub{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .sub table{width:100%;border-collapse:collapse;font-size:12.5px}
  .sub th{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:3px 4px;font-weight:700}
  .sub td{padding:4px;border-top:1px solid var(--line)}
  .sub td.nw,.sub td.mono{white-space:nowrap}   /* ws v1a — 날짜 · 문서 번호 · bin 이 좁은 칸에서 두 줄로 꺾였다 */
  .sub .tw{overflow-x:auto}
  .sub td.r,.sub th.r{text-align:right;font-family:var(--mono)}
  .sub .t{font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:4px}
  .sub .foot{font-size:11.5px;color:var(--mut);margin-top:4px}
  .mono{font-family:var(--mono)}
  .dimt{color:var(--mut)}
  /* ws v2 — 폰 카메라 스캔(Caleb 2026-11-13 「모바일 폰 카메라로 스캔하는 모듈」 · Stock Lookup 만) */
  .scanrow{display:flex;gap:8px;align-items:stretch}
  .scanrow .scanin{flex:1;min-width:0}
  .camb{flex:0 0 auto;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;padding:0 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  .camb:active{background:#eef3ff}
  .cam{position:fixed;inset:0;z-index:5000;background:#000;display:flex;flex-direction:column}
  .cam[hidden]{display:none}
  .cam .cv{position:relative;flex:1;min-height:0;overflow:hidden}
  .cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cam .guide{position:absolute;left:8%;right:8%;top:50%;height:28%;transform:translateY(-50%);border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
  .cam .guide::after{content:"";position:absolute;left:6%;right:6%;top:50%;border-top:2px solid #e03131;opacity:.85}
  .cam .cst{color:#fff;font-size:14px;text-align:center;padding:12px 16px 4px;min-height:22px}
  .cam .cst.bad{color:#ffb4b4}
  .cam .cbar{display:flex;gap:10px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
  .cam .cbar button{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-size:15px;font-weight:700;background:#fff;color:#12161c;cursor:pointer}
  .cam .cbar button.tor{background:#2a2f38;color:#fff}
  .cam .cbar button.tor.on{background:#ffd43b;color:#12161c}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <span class="dot" id="dot" title="Connection"></span>
  <button title="Main menu">☰ Menu</button>
  <button title="Warehouse map" onclick="window.open('https://tools.asung.ca/warehousemap.html','_blank','noopener')">🗺 Map</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<main id="app" style="display:none">
  <div class="top">
    <span class="ttl">Stock Lookup</span>
    <span class="sp"></span>
    <label><input type="checkbox" id="zero" checked> Show zero stock</label>
  </div>
  <div class="scanrow">
    <input class="scanin" id="scan" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scan a barcode, or type a SKU or name…">
    <button class="camb" id="camBtn" type="button" title="Scan with the phone camera" hidden>📷 Camera</button>
  </div>
  <div class="scanhint"><span class="live"></span><span id="hint">Scan or type — both branches are shown</span></div>
  <div id="err" class="err" hidden></div>
  <div id="out"><div class="empty">Scan a product to see its stock.</div></div>
</main>

<div class="cam" id="cam" hidden>
  <div class="cv"><video id="camVideo" playsinline muted autoplay></video><div class="guide"></div></div>
  <div class="cst" id="camSt">Starting the camera…</div>
  <div class="cbar"><button class="tor" id="camTorch" type="button" hidden>Light</button><button id="camClose" type="button">Close</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script src="ims-label.js?v=3"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Stock Lookup — the warehouse scans or types a product and sees its stock in every branch.
   Read only. Nothing on this screen changes stock.

   Windows (asung-wms stk-1 · stk-2 · stk-av-1 20261020232704 3ed5753 · all definer · door = logged in + active staff · ruling 268):
     stk_availability(p_warehouse_id null = both branches, p_q, …, p_include_zero, p_limit) — a barcode that matches exactly finds its product
       (a set barcode finds the single-unit line + matched_set_*) · by_warehouse[] per branch — found by warehouse_id, never by position
     stk_bins_many(p_product_ids, p_warehouse_id) — once per branch per search
     stk_reserved(p_product_id, p_warehouse_id) — tap Allocated / Transfer res. ⭐ customer names are NEVER drawn here (warehouse screen),
       whatever the person's keys are — only the SO number, status and quantity
     stk_movements(p_product_id, p_warehouse_id, …) — Recent movements
     stk_value_many — only when ims_can_view_cost() is true (rulings 567 · 575 · 578) · without the key the value line is not drawn at all
   ⭐ Every number comes from the database — this screen does not count (ruling 262 for cost: only stk_value_*).
   ⚠️ Screen state lives in memory only.
   ───────────────────────────────────────────────────────────── */
const WS_BUILD = "2026-11-13 · ws v2";   // 대화 Claude — ws v2: 폰 카메라 스캔(Caleb 2026-11-13 「wms stock lookup에서 … 모바일 폰 카메라로 스캔하는 모듈」 · 「일단은 스탁 룩업만」) — 스캔 칸 옆 「📷 Camera」(손가락 화면 · 카메라를 쓸 수 있는 브라우저에서만 · 데스크톱 무변) · 누르면 전체 화면 카메라 · 읽히면 곧바로 닫고 그 글자로 찾는다(스캐너 Enter 와 같은 search) · 형식 UPC-A · EAN-13 · EAN-8 · Code 128(ims-label.js 가 찍는 넷) · 라이브러리 @zxing/library 0.21.3 UMD(jsdelivr · 처음 누를 때 한 번 싣는다) · 손전등은 폰이 지원할 때만 · 화면을 떠나면 카메라를 끈다 · DB 무변 ← 대화 Claude — ws v1c: 라벨 창에서 세트를 기본으로 고르는 것은 찾은 글자가 세트 SKU 와 같거나 숫자 바코드 스캔일 때만(SKU 를 쳐서 찾아도 stk_availability 가 matched_set_* 를 줘서 세트가 골라졌다 — Caleb AS01282) ← ws v1b: 카드마다 「Print label」(공용 ims-label.js · lbl v1 · Caleb 2026-10-27 「WMS 만 접근이 있는 사람도 프린트」) · 세트를 스캔해 들어왔으면 그 세트가 기본 ← ws v1a: 작은 표의 날짜 · 문서 번호 · bin 을 한 줄로(좁은 브랜치 칸에서 꺾였다 · 넘치면 표 안에서 가로 스크롤) ← ws v1 · WMS Stock Lookup 첫 판(Caleb 「wms만 사용하는 사람들이 제품 검색을 할 수 있게 stock lookup 탭」 · 판정 569 · 571 · 566 · 567): 스캔 · 입력 → 카드 · 두 브랜치 숫자 · bin · Allocated · Transfer res. 누르면 SO · TRF(손님 이름 없음) · 최근 움직임 · 원가 열쇠면 금액
console.log("wms-stock.html build:", WS_BUILD);

let sb = null, me = null, canCost = false;
let WHS = [], MINE = [];                  // WHS = 활성 브랜치(이름 순) · MINE = 이 사람이 일하는 브랜치 id(없으면 전부)
let seq = 0, lastQ = "";
const LIMIT = 30;
const BUCKET = "product-images";
const $ = (id) => document.getElementById(id);
const n0 = (v) => v === null || v === undefined ? "" : Number(v).toLocaleString("en-CA", { maximumFractionDigits: 3 });
const money = (v) => "$" + Number(v || 0).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function photoUrl(path){ return `${window.IMS_CONFIG.SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path.split("/").map(encodeURIComponent).join("/")}`; }
function setConn(s){ const d = $("dot"); d.className = "dot " + (s === "ok" ? "on" : s === "err" ? "err" : ""); }
function showErr(m){ const e = $("err"); if(!m){ e.hidden = true; e.textContent = ""; return; } e.hidden = false; e.textContent = m; }
const EV = {
  opening: "Opening balance", po_in: "Purchase receipt", sale_out: "Sale", credit_in: "Credit note (return)",
  transfer_out: "Transfer out", transfer_in: "Transfer in", adjust: "Adjustment", adjust_existing: "Adjustment", adjust_new: "Adjustment (new)",
  manual_reversal: "Correction", assembly_in: "Assembly in", assembly_out: "Assembly out",
};
const evLabel = (t) => EV[t] || String(t || "").replace(/_/g, " ").replace(/^./, c => c.toUpperCase());

/* ── 찾기 — 두 브랜치 한 번(stk_availability · p_warehouse_id null) ── */
async function search(v){
  const qv = String(v || "").trim();
  lastQ = qv;
  const my = ++seq;
  showErr("");
  if(qv.length < 2){ $("out").innerHTML = '<div class="empty">Scan a product to see its stock.</div>'; return; }
  $("out").innerHTML = '<div class="empty">Looking…</div>';
  const { data, error } = await sb.rpc("stk_availability", {
    p_warehouse_id: null, p_q: qv, p_brand_id: null, p_category_id: null,
    p_include_zero: $("zero").checked, p_limit: LIMIT, p_offset: 0,
  });
  if(my !== seq) return;
  if(error){ setConn("err"); $("out").innerHTML = ""; showErr(error.message); return; }
  setConn("ok");
  const rows = data || [], total = rows.length ? Number(rows[0].total) : 0;
  if(!rows.length){
    $("out").innerHTML = `<div class="empty">Nothing found for <b class="mono">${esc(qv)}</b>${$("zero").checked ? "" : " — tick “Show zero stock” to include empty products"}.</div>`;
    return;
  }
  const pids = rows.map(r => r.product_id);
  const [ph, bins, vals] = await Promise.all([photosFor(rows.map(r => r.sku)), binsAll(pids), valuesFor(pids)]);   // 받는 이름 순서 = 질의 순서
  if(my !== seq) return;
  $("out").innerHTML = rows.map(r => card(r, ph, bins, vals)).join("")
    + (total > rows.length ? `<div class="more">Showing ${rows.length} of ${total.toLocaleString("en-CA")} — scan or type more to narrow it down.</div>` : "");
  if(bins.__err) showErr("Bins: " + bins.__err);
  else if(vals.__err) showErr("Value: " + vals.__err);
  bindCards();
}
async function photosFor(skus){
  const out = {};
  if(!skus.length) return out;
  const { data } = await sb.rpc("product_image_primary", { p_skus: skus });
  (data || []).forEach(x => { if(x.storage_path) out[x.sku] = photoUrl(x.storage_path); });
  return out;
}
/* bin — 브랜치마다 한 번 · out[warehouse_id][product_id] = [{bin, qty, bin_is_active}] (창구가 qty desc 로 준다) */
async function binsAll(pids){
  const out = {};
  const res = await Promise.all(WHS.map(w => sb.rpc("stk_bins_many", { p_product_ids: pids, p_warehouse_id: w.id })));
  res.forEach((r, i) => {
    if(r.error){ out.__err = r.error.message; return; }
    const m = out[WHS[i].id] = {};
    (r.data || []).forEach(x => { (m[x.product_id] = m[x.product_id] || []).push(x); });
  });
  return out;
}
/* 금액 — 원가 열쇠가 있을 때만 · out[product_id][warehouse_id] = {v, q} */
async function valuesFor(pids){
  const out = {};
  if(!canCost || !pids.length) return out;
  const { data, error } = await sb.rpc("stk_value_many", { p_product_ids: pids, p_warehouse_id: null });
  if(error){ out.__err = error.message; return out; }
  (data || []).forEach(x => { (out[x.product_id] = out[x.product_id] || {})[x.warehouse_id] = { v: Number(x.remaining_value || 0), q: Number(x.layer_qty_ea || 0) }; });
  return out;
}

/* ── 카드 ── */
function card(r, ph, bins, vals){
  const img = ph[r.sku] ? `<img src="${esc(ph[r.sku])}" alt="" loading="lazy">` : '<span class="noimg">No photo</span>';
  const sale = r.sale_pct !== null && r.sale_pct !== undefined ? `<span class="salet">Sale ${esc(Number(r.sale_pct))}%${r.sale_conditional ? "*" : ""}</span>` : "";
  const setm = r.matched_set_sku
    ? `<div class="setm">Set ${esc(r.matched_set_sku)} = ×${n0(r.matched_set_pack_factor)} single units${r.matched_set_count > 1 ? ` (+${r.matched_set_count - 1} more set${r.matched_set_count > 2 ? "s" : ""})` : ""} — numbers below are single units</div>` : "";
  const order = WHS.slice().sort((a, b) => (MINE.includes(b.id) ? 1 : 0) - (MINE.includes(a.id) ? 1 : 0));   // 내 브랜치 먼저
  const blocks = order.map(w => {
    const e = (r.by_warehouse || []).find(x => x.warehouse_id === w.id) || {};
    const av = Number(e.available || 0);
    const tap = (v, kind, label) => Number(v || 0) > 0
      ? `<button class="n" data-rsv="${kind}" data-pid="${esc(r.product_id)}" data-wh="${esc(w.id)}" title="Show what is holding this stock"><b>${n0(v)}</b><span>${label}</span></button>`
      : `<div class="n"><b class="dimt">0</b><span>${label}</span></div>`;
    const num = (v, label) => `<div class="n"><b class="${Number(v || 0) < 0 ? "neg" : Number(v || 0) === 0 ? "dimt" : ""}">${n0(v || 0)}</b><span>${label}</span></div>`;
    const bl = ((bins[w.id] || {})[r.product_id]) || [];
    const binHtml = bl.length
      ? bl.map(x => `<span class="bin${x.bin_is_active === false ? " offb" : ""}">${x.bin ? esc(x.bin) : "(no bin)"}<span class="q">${n0(x.qty)}</span></span>`).join("")
      : '<span class="dimt">No bin</span>';
    const vo = canCost && vals[r.product_id] ? vals[r.product_id][w.id] : null;
    const valHtml = canCost && !vals.__err
      ? `<div class="val">Value <b>${money(vo ? vo.v : 0)}</b>${vo && vo.q !== Number(e.on_hand || 0) ? ` <span title="The value follows the cost layers">· layers ${n0(vo.q)} EA</span>` : ""}</div>` : "";
    return `<div class="wb${MINE.includes(w.id) ? " mine" : ""}">
      <div class="wn"><span>${esc(w.name)}</span><span class="sp"></span><button class="mini" data-mv="1" data-pid="${esc(r.product_id)}" data-wh="${esc(w.id)}">Recent movements</button></div>
      <div class="nums">
        <div class="n av${av <= 0 ? " zero" : ""}"><b>${n0(av)}</b><span>Available</span></div>
        ${num(e.on_hand, "On hand")}${tap(e.sales_allocated, "so", "Allocated")}${tap(e.transfer_reserved, "trf", "Transfer res.")}
        ${num(e.on_order, "On order")}${num(e.in_transit, "In transit")}
      </div>
      <div class="bins">${binHtml}</div>${valHtml}
      <div class="subbox"></div>
    </div>`;
  }).join("");
  return `<div class="pc${r.is_active ? "" : " off"}">
    <div class="ph">${img}<div class="grow">
      <div class="sku">${esc(r.sku)}${sale}${r.is_active ? "" : '<span class="offt">inactive</span>'}</div>
      <div class="nm">${esc(r.name)}</div>
      <div class="br">${esc([r.brand_name, r.category_name].filter(Boolean).join(" · "))}${r.last_event_on ? ` · last movement ${esc(r.last_event_on)}` : ""}</div>
      ${setm}
    </div><button class="mini" data-lbl="${esc(r.product_id)}" data-set="${esc(r.matched_set_sku || "")}" title="Print a barcode label for this product">Print label</button></div>
    <div class="whs">${blocks}</div>
  </div>`;
}
function bindCards(){
  $("out").querySelectorAll("[data-rsv]").forEach(b => { b.onclick = () => openSub(b, "rsv"); });
  $("out").querySelectorAll("[data-mv]").forEach(b => { b.onclick = () => openSub(b, "mv"); });
  $("out").querySelectorAll("[data-lbl]").forEach(b => { b.onclick = () => {   // ws v1b · v1c
    const q = String(lastQ || "").trim().toUpperCase(), set = String(b.dataset.set || "");
    const pickSet = set && (q === set.toUpperCase() || /^\d{6,}$/.test(q));   // 세트 SKU 를 쳤거나 세트 바코드를 스캔했을 때만
    imsLabel.open({ sb, kind: "product", productId: b.dataset.lbl, preferSku: pickSet ? set : null });
  }; });
}
/* 한 브랜치 칸 밑의 작은 표 — 같은 단추를 다시 누르면 닫는다 */
async function openSub(btn, what){
  const box = btn.closest(".wb").querySelector(".subbox");
  const key = what + ":" + (btn.dataset.rsv || "") + ":" + btn.dataset.pid;
  if(box.dataset.key === key){ box.dataset.key = ""; box.innerHTML = ""; return; }
  box.dataset.key = key;
  box.innerHTML = '<div class="sub"><div class="dimt" style="font-size:12px">Loading…</div></div>';
  if(what === "rsv"){
    const { data, error } = await sb.rpc("stk_reserved", { p_product_id: btn.dataset.pid, p_warehouse_id: btn.dataset.wh });
    if(box.dataset.key !== key) return;
    box.innerHTML = `<div class="sub">${error ? `<div class="err">${esc(error.message)}</div>` : rsvHtml(data || {}, btn.dataset.rsv)}</div>`;
  } else {
    const { data, error } = await sb.rpc("stk_movements", { p_product_id: btn.dataset.pid, p_warehouse_id: btn.dataset.wh, p_from: null, p_to: null, p_max: 2000 });
    if(box.dataset.key !== key) return;
    box.innerHTML = `<div class="sub">${error ? `<div class="err">${esc(error.message)}</div>` : mvHtml(data || [])}</div>`;
  }
}
/* ⭐ 손님 이름은 그리지 않는다(창고 화면) — 창구가 이름을 보내도 쓰지 않는다 */
function rsvHtml(d, kind){
  const qty = (x) => `<td class="r">${n0(x.qty)}${Number(x.pack_factor) !== 1 ? ` <span class="dimt">×${n0(x.pack_factor)}</span>` : ""}</td><td class="r">${n0(x.qty_ea)}</td>`;
  if(kind === "so"){
    const rows = d.so || [];
    if(!rows.length) return '<div class="dimt" style="font-size:12px">No sales order is holding this stock.</div>';
    return `<div class="t">Allocated to sales orders</div><div class="tw"><table><thead><tr><th>Sales order</th><th>Status</th><th>Line SKU</th><th class="r">Qty</th><th class="r">EA</th></tr></thead><tbody>
      ${rows.map(x => `<tr><td class="mono">${esc(x.so_number)}</td><td>${dim(x.status)}</td><td class="mono">${esc(x.line_sku)}</td>${qty(x)}</tr>`).join("")}</tbody></table></div>
      <div class="foot">Total ${n0(d.so_total)} EA</div>`;
  }
  const rows = d.trf || [];
  if(!rows.length) return '<div class="dimt" style="font-size:12px">No transfer is holding this stock.</div>';
  return `<div class="t">Held for transfers out</div><div class="tw"><table><thead><tr><th>Transfer</th><th>Status</th><th>To</th><th>Line SKU</th><th class="r">Qty</th><th class="r">EA</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td class="mono">${esc(x.transfer_number)}</td><td>${dim(x.status)}</td><td>${dim(x.to_warehouse)}</td><td class="mono">${esc(x.line_sku)}</td>${qty(x)}</tr>`).join("")}</tbody></table></div>
    <div class="foot">Total ${n0(d.trf_total)} EA</div>`;
}
function mvHtml(rows){
  const recent = rows.slice().reverse().slice(0, 10);   // 창구는 오래된 것부터 · 최근 10
  if(!recent.length) return '<div class="dimt" style="font-size:12px">No movements.</div>';
  return `<div class="t">Recent movements${rows.length > 10 ? ` <span style="text-transform:none;letter-spacing:0;font-weight:600">(latest 10 of ${rows.length})</span>` : ""}</div>
    <div class="tw"><table><thead><tr><th>Date</th><th>Type</th><th>Document</th><th>Bin</th><th class="r">In</th><th class="r">Out</th></tr></thead><tbody>
    ${recent.map(m => `<tr${m.is_reversal ? ' style="color:var(--mut-2)"' : ""}><td class="nw">${esc(m.occurred_on)}</td><td>${esc(evLabel(m.event_type))}</td>
      <td class="mono">${m.doc_number ? esc(m.doc_number) : ""}</td><td class="mono">${m.bin ? esc(m.bin) : ""}</td>
      <td class="r">${m.qty_in ? n0(m.qty_in) : ""}</td><td class="r">${m.qty_out ? n0(m.qty_out) : ""}</td></tr>`).join("")}</tbody></table></div>
    <div class="foot">Opening stock from the starting count is not listed as a movement here.</div>`;
}

/* ── ws v2 · 폰 카메라 스캔 ──────────────────────────────────────
   @zxing/library 0.21.3 UMD(전역 ZXing) — 처음 누를 때만 싣는다. 스트림은 이 화면이 직접 열고(getUserMedia) 닫는다 — 손전등과 끄기를 확실히.
   읽히면 첫 결과 하나로 끝(같은 바코드가 여러 번 잡혀도 한 번만 찾는다). ⚠️ 판독 글자는 스캐너처럼 그대로 넘긴다 — 숫자를 고치지 않는다. */
const ZX_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
const cam = { reader: null, stream: null, busy: false, torch: false, loading: null };
const camCan = () => !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function camLib(){
  if(window.ZXing) return Promise.resolve(window.ZXing);
  if(cam.loading) return cam.loading;
  cam.loading = new Promise((ok, bad) => {
    const sc = document.createElement("script"); sc.src = ZX_URL; sc.async = true;
    sc.onload = () => window.ZXing ? ok(window.ZXing) : bad(new Error("no ZXing"));
    sc.onerror = () => { cam.loading = null; sc.remove(); bad(new Error("load failed")); };
    document.head.appendChild(sc);
  });
  return cam.loading;
}
function camSt(m, bad){ const e = $("camSt"); e.textContent = m; e.classList.toggle("bad", !!bad); }
function camStop(){
  try{ if(cam.reader) cam.reader.reset(); }catch(e){}
  if(cam.stream){ cam.stream.getTracks().forEach(t => { try{ t.stop(); }catch(e){} }); }
  cam.reader = null; cam.stream = null; cam.busy = false; cam.torch = false;
  const v = $("camVideo"); try{ v.pause(); }catch(e){} v.srcObject = null;
  $("camTorch").hidden = true; $("camTorch").classList.remove("on");
  $("cam").hidden = true;
}
async function camOpen(){
  if(cam.busy) return;
  cam.busy = true;
  $("cam").hidden = false; camSt("Starting the camera…");
  let Z;
  try{ Z = await camLib(); }
  catch(e){ camSt("Could not load the scanner. Check the connection and try again.", true); cam.busy = false; return; }
  if($("cam").hidden){ cam.busy = false; return; }   // 싣는 동안 닫았다
  try{
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } });
  }catch(e){
    const n = e && e.name;
    camSt(n === "NotAllowedError" ? "Camera permission was denied. Allow the camera for this site in the browser settings, then try again."
        : n === "NotFoundError" || n === "OverconstrainedError" ? "No camera was found on this device."
        : n === "NotReadableError" ? "The camera is in use by another app. Close it and try again."
        : "The camera could not start.", true);
    cam.busy = false; return;
  }
  if($("cam").hidden){ camStop(); return; }   // 허락을 묻는 동안 닫았다
  const tr = cam.stream.getVideoTracks()[0];
  try{ const caps = tr && tr.getCapabilities ? tr.getCapabilities() : {}; $("camTorch").hidden = !caps.torch; }catch(e){}
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.CODE_128]);
  cam.reader = new Z.BrowserMultiFormatReader(hints, 200);
  camSt("Point at a barcode inside the box.");
  let done = false;
  cam.reader.decodeFromStream(cam.stream, $("camVideo"), (res) => {
    if(!res || done) return;
    done = true;
    const code = String(res.getText() || "").trim();
    try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
    camStop();
    if(!code) return;
    const scan = $("scan");
    scan.value = code;
    search(code);
    scan.blur();   // 폰 자판이 올라오지 않게
  }).catch(() => { if(!done && !$("cam").hidden) camSt("The camera stopped. Close and try again.", true); });
}
async function camTorch(){
  const tr = cam.stream && cam.stream.getVideoTracks()[0]; if(!tr) return;
  try{ await tr.applyConstraints({ advanced: [{ torch: !cam.torch }] }); cam.torch = !cam.torch; $("camTorch").classList.toggle("on", cam.torch); }catch(e){ $("camTorch").hidden = true; }
}

/* ── 시작 ── */
imsAuth.start({}, async (client, meData) => {   // 열쇠 없음 = WMS 에 들어올 수 있는 직원 누구나(창구 문 = 활성 직원 · 판정 268)
  sb = client; me = meData;
  imsHeader(me);
  $("buildTag").textContent = WS_BUILD;
  $("app").style.display = "block";
  const [w, cc] = await Promise.all([
    sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name"),
    sb.rpc("ims_can_view_cost"),
  ]);
  if(w.error){ setConn("err"); showErr(w.error.message); return; }
  setConn("ok");
  WHS = (w.data || []).filter(x => x.name !== "IN_TRANSIT");
  canCost = !cc.error && cc.data === true;
  const acc = (me && me.access) || imsAuth.access || {};
  MINE = Array.isArray(acc.warehouses) && acc.warehouses.length ? acc.warehouses : [];
  if(!WHS.length){ showErr("No active branch."); return; }

  const scan = $("scan");
  scan.addEventListener("keydown", e => {   // 스캐너는 끝에 Enter — 기다리지 않고 바로 찾는다 · 글자는 남기고 골라 둔다(다음 스캔이 덮어쓴다)
    if(e.key !== "Enter") return;
    e.preventDefault();
    search(scan.value); scan.select();
  });
  imsQ(scan, v => { if(v !== lastQ) search(v); }, 450);   // 손으로 칠 때 — 멈추면 찾는다
  $("zero").onchange = () => { if(lastQ) search(lastQ); scan.focus(); };
  const q0 = imsParam("q");
  if(q0){ scan.value = q0; search(q0); }
  // ws v2 — 카메라 단추: 손가락 화면 + 카메라를 쓸 수 있을 때만(데스크톱 스캐너 화면은 그대로)
  if(camCan() && window.matchMedia("(pointer: coarse)").matches){
    $("camBtn").hidden = false;
    $("camBtn").onclick = camOpen;
    $("camClose").onclick = camStop;
    $("camTorch").onclick = camTorch;
    document.addEventListener("visibilitychange", () => { if(document.hidden && !$("cam").hidden) camStop(); });
    window.addEventListener("pagehide", () => { if(!$("cam").hidden) camStop(); });
  }
  scan.focus();
});
</script>
