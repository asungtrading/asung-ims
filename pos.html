<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 계산대 화면 — 목록/상세 두 모드가 아니라 한 판(왼쪽 판매 · 오른쪽 금액과 단추 · 아래 잠시 둔 오더) */
  .pos{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;padding:14px}
  @media (max-width:1000px){ .pos{grid-template-columns:1fr} }
  .posbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
  .posbar .sp{flex:1}
  .posbar select{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px}
  .scan{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .scan input{flex:1;border:2px solid #3b5bdb;border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:16px}
  .scan input:disabled{border-color:var(--line);background:#f6f7f9}
  .big{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.02em}
  .mid{font-family:var(--mono);font-size:20px;font-weight:700}
  .tot{padding:16px}
  .tot .row2{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:13px;color:var(--muted)}
  .tot .row2 b{font-family:var(--mono);color:var(--ink,#1a1d24)}
  .acts{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px}
  .acts .pobtn{padding:12px;font-size:15px}
  .paygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 12px}
  .paygrid .pobtn{padding:12px 6px;font-size:13.5px}
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .sowarn{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px}
  .pomodal[hidden]{display:none}
  .pobox input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:280px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .sofield{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font:inherit;font-size:14px}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .done{padding:22px 16px;text-align:center}
  tr.parked{cursor:pointer} tr.parked:hover td{background:#fafbfd}
  /* 사진 — 줄 · 찾기 목록은 40px(ims-ui.css .ims-thumb) · 오른쪽 위는 크게 */
  .lnth{display:flex;gap:8px;align-items:flex-start}
  #hero{padding:16px 16px 0}
  #hero .ims-thumb{width:100%;height:260px;flex:none;border-radius:12px}
  #hero .hcap{margin-top:8px;font-size:12.5px}
  #hero .hnone{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;
    border:1px dashed var(--line);border-radius:12px}
  td.itm{cursor:pointer}
  /* ⚠️ [2026-10-01 · pos v1.3] 표 칸 안의 작은 사진이 안 그려졌다(칸은 done + img · Caleb 콘솔) — max-width:100% 만으로는
     표 칸 안에서 크기가 정해지지 않는 것으로 짐작 ⇒ 이 화면은 픽셀로 못 박는다(공통 ims-ui.css 는 그대로 · 다른 화면에서도 나오면 공통으로) */
  .lnth .ims-thumb img{width:38px;height:38px;max-width:none;max-height:none;object-fit:contain}
  /* 할인 표시 — 판정 225 */
  .sale{display:inline-block;background:#d92d20;color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .was{text-decoration:line-through;color:var(--muted);font-family:var(--mono);font-size:11.5px;margin-right:4px}
  .dsc{font-size:11px;color:var(--muted)}
  .dsc.deal{color:#b42318;font-weight:600}
  /* pos v1.5 · asm-3e — 콤보 구성품 줄 */
  tr.comp td{background:#fafbfd;padding-top:3px;padding-bottom:3px}
  tr.comp .cin{padding-left:22px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="pos">
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card">
      <div class="posbar">
        <b>POS</b>
        <select id="store" title="This counter's store — remembered on this device"></select>
        <span class="sp"></span>
        <span id="soNo" class="mono dim"></span>
        <button class="pobtn" id="delDraft" hidden title="Delete this draft — it has never been confirmed">Delete draft</button>
        <button class="pobtn go" id="newSale">+ New sale</button>
      </div>
      <div class="posbar" id="custBar"><span class="dim">Pick the customer first — every POS sale is on a customer account.</span>
        <span class="sp"></span><button class="pobtn" id="pickCust">Customer…</button></div>
      <div class="scan">
        <input id="scanIn" placeholder="Scan a barcode or type a SKU, then Enter" autocomplete="off" disabled>
        <button class="pobtn" id="findBtn" disabled title="Search by name">Find…</button>
      </div>
      <div id="warnBox"></div>
      <div id="lines"><div class="msg">No sale open.</div></div>
    </div>

    <div class="card">
      <h3>Parked and open at this store <span class="n" id="parkN"></span></h3>
      <div id="parked"><div class="msg">Loading…</div></div>
    </div>
  </div>

  <div class="card" id="side">
    <div id="hero"><div class="hnone">Scan an item to see its photo.</div></div>
    <div class="tot"><div class="dim" style="font-size:12px">TOTAL</div><div class="big" id="bigTot">0.00</div><div id="totRows"></div></div>
    <div id="sideActs"></div>
  </div>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script src="ims-doc.js"></script>
<script src="ims-overdue.js?v=1"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   POS — 계산대 화면 1판 (2026-09-25 · 대화 Claude)
   흐름(정본 6-f · ④a 판정): 손님(계정 손님만 · 판정 10) → 스캔 → Confirm(금액 · 재고는 보지 않고 전부 잡는다) → 결제(그 자리에서 · 나눠 내기 · 대상 = 이 오더)
        → Finish(출고 + 인보이스 · 막지 않는다 · 받은 금액과 미수를 보인다 · 판정 5) · 잠시 두기(Park · 새 상태 없음 · 판정 16) · 다시 열기(Confirm~Finish 구간)
   창구: so_create(channel pos · intake pos · 창고 필수) · so_line_add · so_line_update · so_line_remove · so_header_update(세금 규칙 — 판정 11)
         so_pos_confirm · so_pos_reopen · so_payment_add(target_so_ids) · so_pos_finish(p_commit false = 미리 보기) · so_pos_open_list
   권한: 전부 sales 열쇠(판정 6 · R5 의 예외) · 역할 문 없음
   ⚠️ 금액 · 세금 · 받은 돈 · 미수는 DB 가 준다(so_detail · so_pos_finish 미리 보기) — 화면이 다시 계산하지 마라
   ⚠️ 계산대 매장은 기기에 기억한다(localStorage — 이 기기의 편의일 뿐 · 오더의 창고는 so 에 굳는다)
   ───────────────────────────────────────────────────────────── */
const POS_BUILD = "2026-10-28 · pos v1.16";   // 대화 Claude — 동료 요청 둘(Caleb 2026-10-28 「받은 돈을 cancel 하고 다시 할 수 있으면 · 화면에 페이먼트한 내역이 다 보였으면」 · 판정 863 · asung-wms pos-pay-1): ① 오른쪽 합계 아래 「Payments」 목록(so_pos_payment_list · 시각 · 방법 · 금액 · 참조 · 누가 · 취소된 줄은 회색 줄긋기 + 누가 · 사유) ② 줄마다 Cancel(so_pos_payment_cancel · Finish 전 · 대상 판매 하나일 때만 · 사유는 비워도 됨 · 거부 글 그대로) ③ Cash 창을 칸 하나로 — 「Cash received」 에 받은 돈 → 기록 = 남은 금액까지(그보다 적으면 부분 결제) · 거스름돈 · 남는 금액을 창에 보인다(옛 판은 Amount 칸이 남은 금액 전부로 미리 차 있어 Cash given 만 고치면 전액이 기록됐다 · 짐작 — DB 는 부분 결제를 맞게 셈한다 · pos-pay-1 S1c) · 다른 방법은 Amount 칸 그대로 + 「부분이면 고친다」 안내 ← pos v1.15: 대화 Claude — 동료 요청(Caleb 2026-10-28 「스캔하는 아이템은 항상 맨위에 · 이미 이전에 찍었던 같은 아이템이라도」): 줄 순서 = 마지막으로 스캔 · 담은 순(같은 SKU 가 이미 있어 수량이 늘어도 그 줄이 맨 위로) · 기억은 이 브라우저(localStorage ims_pos_touch_<SO id> · 업무 값 아님 · 다른 계산대에서 열면 옛 순서 = 줄 번호 역순) · 수량 칸 · ± 로 바꿀 때는 움직이지 않는다(입력 중에 줄이 튀지 않게) ← 2026-10-26 · pos v1.14: 대화 Claude — 판정 773(Caleb 「parked draft를 지울 수 있는 방법은 없나?」 → 「B」): 초안을 POS 에서 지운다 — 열린 판매가 초안이면 머리에 Delete draft · 목록의 초안 줄마다 ✕(열지 않고) · 확인 한 번 · 창구 so_delete(Sales Orders 의 Delete draft 와 같은 창구 · 권한은 DB) · 확정된 줄에는 없다 ← 2026-10-26 · pos v1.13: 대화 Claude — ovd-2(판정 768 ~ 771 · asung-wms ovd-1 57156b2): 판매를 시작하며 손님을 고르면 청구처에 기한 지난 인보이스가 있을 때 창(공용 ims-overdue.js · so_customer_overdue · OK 로만 닫힘 · 막지 않음 · 받아 둔 돈 한 줄) — 손님 막대의 Overdue 칩은 그대로 ← 2026-10-23 · pos v1.12: 대화 Claude — bgr-1c(c60eb9e) · 1d(3d0d7fe) · 판정 633 · 634 ② · 635 · 644 · 646 · 647 · 648: 초안 줄의 「B」 단추 = 그 줄을 B급으로(so_line_bgrade_set · 칸이 여럿이면 고르는 창 · 값 없는 칸은 고를 수 없음 · 수량이 2 이상이면 몇 개가 B급인지 물어 나머지는 정상 줄로 남긴다 — so_line_update + so_line_add p_force_new) · B급 줄은 「B-grade · 칸 · Final sale」 표시 · ✎ 없음(값은 B급 칸이 정한다) · 「✕B」 = 정상으로 되돌리기(so_line_bgrade_clear) · 장부보다 많으면 확인(over_bgrade_stock · so_lines_available 의 B급 가용) · surcharge 는 DB 가 비운다 ← pos v1.11:   // 대화 Claude — 판정 535 → 546(판정 225 「표시만」 을 뒤집는다 · ln-1 asung-wms 0c5886e): 초안 줄의 단가 옆 ✎ — 가격 또는 할인 % 를 POS 직원이 넣는다(so_line_update unit_price | discount_pct · 둘 중 하나) · 손으로 정한 줄은 「Back to the usual price」(discount_pct 빈 값 = 다시 견적) · 줄의 「price set by hand」 · 「Discount by hand」 옆에 누가 · 언제(so_detail price_set_by_name · price_set_at) · 가격 0 은 받지 않는다(무상은 사유가 필요 — SO 화면) ← pos v1.10: 대화 Claude — fb-0 11번 · 10번(판정 547 · 536): ① 수량 칸에 숫자를 직접 — 1 이상 정수만 · 늘릴 때 이 가게 창고의 가용(so_lines_available)보다 많으면 확인 한 번(+ 단추도 같다) ② 손님 막대에 쓸 수 있는 크레딧(so_detail.customer_balance.available — 받아 둔 돈 + 크레딧 − 예약) · 열린 인보이스 · 연체(so_invoice_ar_summary · 청구처 · 그 통화 · 있으면 빨간 칩) — 보이기만(Finish 를 막지 않는다 · 판정 5) ← pos v1.9: 대화 Claude — doc 인쇄(ims-doc v2): 끝낸 판매에 Print invoice(final_invoice · 번호로 찾음) ← pos v1.8: 대화 Claude — Caleb 「쿠폰이 발행된 사람에게만 쿠폰 칸」 · 「B」(코드까지 보이고 Use 로 한 번에): 초안을 열 때 그 손님의 쓸 수 있는 쿠폰(so_coupon 읽기 — 안 쓰임 · 무효 아님 · 기한 ≥ 판매일 · 딜이 켜진 쿠폰 딜)을 읽어 있을 때만 쿠폰 칸 · 코드 · 딜 · 기한 · Use · 붙은 쿠폰이 있으면 늘 보임 · 경고 칩에서 no_lines 를 뺐다(「Scan the first item.」 과 겹치고 코드 그대로 보였다) ← pos v1.7 2026-10-07 · 대화 Claude — 할인 표시(미룬 120 · 판정 283 · 298 · 329): 초안 오른쪽에 쿠폰 칸(so_coupon_apply · so_coupon_remove — so.html v5a 와 같은 창구 · 붙은 쿠폰의 applied / not used + 까닭 · ✕) · 확정 뒤 Order discount 줄에 「coupon 코드」 · 줄 할인 출처에 「Set discount」 · 경고 글 둘 · 확정 때 쿠폰이 떼어졌으면 알림 ← pos v1.6 2026-10-06 · 대화 Claude — dsc-1(판정 281 · 293): 안 파는 세트 바코드를 찍으면 창구가 낱개 × pack_factor 로 넣는다 → 「SET is not sold as a set — added BASE × n instead」 한 줄 · 오른쪽 위 사진은 그 낱개 · 거부(판매 안 함)는 창구 글 그대로 alert ← pos v1.5 대화 Claude — asm-3e(판정 244 · asm 묶음 2 · 3): 콤보 줄 아래 구성품 줄을 작게 묶어 그린다(구성품은 −/+ · 지우기 없음 — 콤보 줄만 바꾼다 · 스캔한 콤보는 so_line_add 가 구성품까지 넣는다) ← pos v1.4 // 대화 Claude — surcharge-3(묶음 8): 줄 아래 작은 글씨로 surcharge · 오른쪽 금액에 Surcharge 줄(표시만 · 값은 so_detail) ← v1.3 대화 Claude — 줄 · 찾기 목록의 작은 사진이 안 그려지던 것(칸은 채워짐 · Caleb 콘솔 확인) → 사진 크기를 픽셀로 · 줄 사진은 바로 읽기 ← v1.2 판정 225: 할인 표시(딜 = SALE · 원래 가격 줄 긋기 · 손님 할인 · 손으로 · 무상) · 오른쪽 금액에 Order discount · Charges 줄 ← v1.1 오른쪽 위 큰 사진(Caleb 2026-09-25 「오른쪽 위에 사진이 크게 들어가게 하면 좋을 것 같아」) · 줄 · 찾기 목록 사진(판정 208 · 213 모양) ← pos v1
console.log("pos.html build:", POS_BUILD);
/* 사진(판정 194 · 208 · 213) — 공통 imsThumb(thumb-1) · 공통 js 가 옛 판으로 캐시돼 있으면 칸 없이 그린다
   ⭐ 오른쪽 위 큰 사진 = 마지막으로 담은 상품(줄의 상품 칸을 누르면 그 상품) · 누르면 크게 보기 */
const thumbOf = sku => (sku && typeof window.imsThumb === "function") ? window.imsThumb(sku) : "";
const thumbFill = el => { if(typeof window.imsThumbFill === "function") window.imsThumbFill(el); };
let heroSku = null, lastPid = null;
/* 줄 사진은 화면에 보이는 몇 장뿐이라 바로 읽는다(공통 도우미는 lazy) — 채운 뒤 한 번 고친다 */
function eagerThumbs(id){
  setTimeout(() => { const box = document.getElementById(id); if(!box) return;
    box.querySelectorAll(".ims-thumb img").forEach(i => { if(i.loading !== "eager"){ i.loading = "eager"; const u = i.src; i.src = ""; i.src = u; } }); }, 400);
}
/* 판정 225 — 줄의 할인이 어디서 왔나(SO 화면과 같은 뜻 · 서버가 준 칸만 읽는다 · 다시 계산하지 않는다) */
function discNote(l){
  const pct = Number(l.discount_pct);
  /* pos v1.11 — 판정 546: 누가 · 언제 손으로 정했나(ln-1 이전 줄은 비어 있다) */
  const by = l.price_set_at ? ` · ${l.price_set_by_name ? "by " + esc(l.price_set_by_name) + " · " : ""}${esc(imsTs(l.price_set_at))}` : "";
  if(l.is_bgrade_line) return `<div class="dsc">B-grade${l.bgrade_bin ? " · bin " + esc(l.bgrade_bin) : ""} · Final sale — no return, no refund</div>`;   // pos v1.12 — 판정 633 · 640
  if(l.free_reason) return `<div class="dsc">free · ${esc(l.free_reason)}</div>`;
  if(l.price_override) return `<div class="dsc">price set by hand${by}</div>`;
  if(!pct) return "";
  if(l.discount_source === "manual") return `<div class="dsc">Discount by hand −${esc(pct)}% · list ${plain(l.list_price)}${by}</div>`;
  const src = l.discount_source === "deal" ? ["deal", "Sale"] : l.discount_source === "manual" ? ["", "Discount by hand"] : l.discount_source === "set" ? ["", "Set discount"] : ["", "Customer discount"];   // pos v1.7 — set(판정 298)
  return `<div class="dsc ${src[0]}">${src[1]} −${esc(pct)}% · list ${plain(l.list_price)}</div>`;
}
const isSale = l => l.discount_source === "deal" && Number(l.discount_pct) > 0 && !l.free_reason;
function drawHero(sku, name){
  const box = document.getElementById("hero"); if(!box) return;
  heroSku = sku || null;
  box.innerHTML = sku
    ? `${thumbOf(sku)}<div class="hcap"><span class="mono">${esc(sku)}</span><div class="dim">${esc(name || "")}</div></div>`
    : '<div class="hnone">Scan an item to see its photo.</div>';
  thumbFill(box);
}
function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

/* ── 스캔 — 바코드 정확히 → SKU 정확히 → 없으면 이름으로 찾기 ── */
async function onScan(){
  const inp = document.getElementById("scanIn");
  const code = inp.value.trim();
  if(!code || !curId) return;
  inp.value = "";
  let pid = null;
  const bc = await sb.from("product_barcode").select("product:product_id!inner(id,is_active)").eq("is_active", true).eq("barcode", code).limit(2);
  const hits = (bc.data || []).map(x => x.product).filter(p => p && p.is_active);
  if(hits.length === 1) pid = hits[0].id;
  if(!pid){
    const sk = await sb.from("product").select("id").eq("is_active", true).ilike("sku", code).limit(2);
    if((sk.data || []).length === 1) pid = sk.data[0].id;
  }
  if(!pid){ openFind(code); return; }
  await addOne(pid);
}
async function addOne(pid){
  lastPid = pid;   // 오른쪽 위 사진 — 방금 담은 상품
  const { data, error } = await sb.rpc("so_line_add", { p_so_id: curId, p_product_id: pid, p_qty: 1 });
  if(error){ alert(error.message); focusScan(); return; }
  if(data && data.action === "ask"){ alert("This SKU is already on the sale at another price — change that line's quantity instead."); }
  if(data && data.line && data.line.id) touchLine(curId, data.line.id);   // pos v1.15 — 방금 스캔 · 담은 줄이 맨 위(합쳐진 줄도)
  const cv = data && data.converted;   // dsc-1 판정 281 · 293 — 안 파는 세트는 낱개 × pack_factor 로 들어온다
  if(cv){ lastPid = null; heroSku = cv.base_sku; }   // 사진은 들어간 낱개 줄
  await openSale(curId);
  if(cv){ const wb = document.getElementById("warnBox");
    if(wb) wb.insertAdjacentHTML("afterbegin", `<div class="sowarn"><span class="chip">${esc(convText(cv))}</span></div>`); }
}
/* dsc-1 — 바꿈 한 줄(다음 그리기에서 사라진다 · 한 번 알림) */
const convText = cv => `${cv.set_sku} is not sold as a set — added ${cv.base_sku} × ${Number(cv.base_qty).toLocaleString("en-CA")} instead`;
function openFind(prefill){
  modalOpen(`
    <h4>Find a product</h4>
    <div class="pbody">
      <input type="search" id="fdQ" placeholder="SKU · product name" autocomplete="off" value="${esc(prefill || "")}">
      <div class="pick" id="fdList"><div class="msg">${prefill ? "Nothing matched that code exactly — pick from the list." : "Type to search."}</div></div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button></div>`);
  wireModalClose();
  const draw = async (t) => {
    const box = document.getElementById("fdList"); if(!box) return;
    if(!t){ box.innerHTML = '<div class="msg">Type to search.</div>'; return; }
    const tt = String(t).replace(/[,()"\\]/g, "%");
    const { data, error } = await sb.from("product").select("id,sku,name").eq("is_active", true).is("parent_product_id", null)
      .or(`sku.ilike.%${tt}%,name.ilike.%${tt}%`).order("sku").limit(40);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(p => `<div class="prow" data-pid="${p.id}"><div class="lnth">${thumbOf(p.sku)}<div><span class="mono">${esc(p.sku)}</span><div class="dim" style="font-size:11.5px">${esc(p.name || "")}</div></div></div></div>`).join("") : '<div class="msg">No active product matches.</div>';
    box.querySelectorAll("[data-pid]").forEach(el => { el.onclick = async () => { modalClose(); await addOne(el.dataset.pid); }; });
    thumbFill(box);   // 판정 213 모양 — 사진 클릭은 크게 보기만(담기로 안 번진다)
    eagerThumbs("fdList");
  };
  imsQ("#fdQ", draw);
  if(prefill) draw(prefill);
  setTimeout(() => { const i = document.getElementById("fdQ"); if(i) i.focus(); }, 30);
}

/* ── pos v1.10 — 손님 막대의 돈(판정 536 · 10번: 손님이 쓸 수 있는 우리 쪽 크레딧 · 신용 한도 아님) ──
   ⚠️ 셈은 DB — 크레딧 = so_detail.customer_balance.available(청구처 · 그 통화 · 받아 둔 돈 + 크레딧 − 예약) · 연체 = so_invoice_ar_summary(청구처) 의 그 통화 행
   ⚠️ 보이기만 — Finish 를 막지 않는다(판정 5) · 결제조건에 Net days 가 없는 인보이스는 연체로 세지 않는다(due_unknown) */
async function fillBal(d){
  const el = () => document.getElementById("custBal");
  const s = d.so || {}, b = d.customer_balance || null, cid = s.bill_to_customer_id || s.customer_id;
  const parts = [];
  if(b){
    parts.push(`<span class="chip ${Number(b.available) > 0 ? "good" : ""}" title="Money on account plus open credit notes, less deposits held for other orders — it can pay this sale">Credit ${money(b.available)}</span>`);
    if(Number(b.open_invoices) > 0) parts.push(`<span class="chip" title="Invoices not fully paid yet">Open invoices ${esc(b.open_invoices)} · ${money(b.open_invoices_due)}</span>`);
  }
  if(el()) el().innerHTML = parts.join("");
  if(!cid) return;
  const { data, error } = await sb.rpc("so_invoice_ar_summary", { p_customer_id: cid });
  if(error || !data || curId !== s.id) return;
  const row = (data.currencies || []).find(x => x.currency_id === s.currency_id);
  if(row && Number(row.overdue_count) > 0) parts.push(`<span class="chip bad" title="Past the due date of the payment term">Overdue ${esc(row.overdue_count)} · ${money(row.overdue_total)}</span>`);
  if(el()) el().innerHTML = parts.join("");
}

/* ── 줄 고치기(초안에서만 · 확정 뒤는 다시 열어야) ── */
async function setQty(lineId, v, old){
  const n = Number(v);
  if(!(n > 0)){ return removeLine(lineId); }
  /* pos v1.10 — 판정 547: 늘릴 때만 이 가게 창고의 가용과 대 본다(오타 100 → 1000 이 그대로 나가 재고가 음수가 되지 않게) · 읽기가 실패하면 막지 않는다 */
  if(old !== undefined && n > Number(old)){
    const la = await sb.rpc("so_lines_available", { p_so_id: curId });
    const row = !la.error && (la.data || []).find(x => x.line_id === lineId);
    if(row && row.available_units !== null && row.available_units !== undefined && Number(row.available_units) < n){
      const msg = row.bgrade_bin_id   /* pos v1.12 — 판정 647: B급 줄은 그 B급 칸의 가용 · 막지 않는다 */
        ? `The books have only ${Number(row.available_units).toLocaleString("en-CA")} B-grade in bin ${row.bgrade_bin || ""}. Sell ${n.toLocaleString("en-CA")} anyway? (The bin goes below 0 — count it later.)`
        : `Only ${Number(row.available_units).toLocaleString("en-CA")} available in this store's warehouse (on hand minus what other orders hold). Sell ${n.toLocaleString("en-CA")} anyway?`;
      if(!confirm(msg)){ await openSale(curId); return; }
    }
  }
  const { error } = await sb.rpc("so_line_update", { p_line_id: lineId, p_patch: { qty_ordered: n } });
  if(error){ alert(error.message); }
  await openSale(curId);
}
/* ── pos v1.11 — 판정 546: 줄 가격 · 할인(POS 직원 모두 · 창구 so_line_update 가 sales 쓰기만 본다)
   ⭐ 가격 또는 할인 % 하나만 보낸다(둘 다면 창구가 거부) · 가격을 손으로 주면 최종(오더 할인 안 받음 · 판정 542)
   ⭐ 「Back to the usual price」 = discount_pct 빈 값 → 창구가 다시 견적(티어 · 손님 할인 · 딜) · 누가 정했나도 비운다 ── */
function openLinePrice(l){
  if(!l) return;
  const manual = !!(l.price_override || l.discount_source === "manual");
  modalOpen(`
    <h4>Price — <span class="mono">${esc(l.sku)}</span></h4>
    <div class="pbody">
      <div class="dim" style="font-size:12.5px;margin-bottom:8px">${esc(l.product_name || "")} · list ${plain(l.list_price)} · now ${plain(l.unit_price)}${Number(l.discount_pct) > 0 ? " (−" + esc(Number(l.discount_pct)) + "%)" : ""}</div>
      <div class="frow"><label>Price each</label><input id="lpU" class="sofield" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="e.g. ${plain(l.unit_price)}"></div>
      <div class="frow"><label>or Discount %</label><input id="lpD" class="sofield" type="number" step="0.01" min="0" max="100" inputmode="decimal" placeholder="off the list price"></div>
      <div class="sohint">Fill one of the two. A price or discount set here is final for this item — the order discount does not apply to it. Your name is kept on the line.</div>
      <div id="lpMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot">${manual ? '<button class="pobtn" id="lpReset" title="Back to the tier price, customer discount and deals">Back to the usual price</button>' : ""}<span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" id="lpGo">Save</button></div>`);
  wireModalClose();
  setTimeout(() => { const i = document.getElementById("lpU"); if(i) i.focus(); }, 30);
  const go = async (patch) => {
    say("lpMsg", "", "Saving…");
    const { error } = await sb.rpc("so_line_update", { p_line_id: l.id, p_patch: patch });
    if(error){ say("lpMsg", "err", error.message); return; }
    modalClose(); await openSale(curId);
  };
  ["lpU", "lpD"].forEach(id => { const el = document.getElementById(id); el.onkeydown = (e) => { if(e.key === "Enter"){ e.preventDefault(); document.getElementById("lpGo").click(); } }; });
  document.getElementById("lpGo").onclick = () => {
    const u = document.getElementById("lpU").value.trim(), d = document.getElementById("lpD").value.trim();
    if(u && d){ say("lpMsg", "err", "Fill the price or the discount — not both."); return; }
    if(!u && !d){ say("lpMsg", "err", "Type a price or a discount %."); return; }
    if(u){ const n = Number(u); if(!(n > 0)){ say("lpMsg", "err", "The price must be above 0 — a free item needs a reason (Sales Orders screen)."); return; } return go({ unit_price: n }); }
    const n = Number(d); if(!(n >= 0 && n <= 100)){ say("lpMsg", "err", "The discount is a number from 0 to 100."); return; }
    return go({ discount_pct: n });
  };
  const rs = document.getElementById("lpReset"); if(rs) rs.onclick = () => go({ discount_pct: "" });
}
/* ── pos v1.12 — B급(판정 633 · 634 ② · 644 · 647) ─────────────────────────
   ⭐ 원래 바코드로 찍힌 정상 줄을 「B」 로 B급 줄로 바꾼다 — 값은 그 B급 칸의 값(최종 · 손님 할인 · 딜 · 오더 할인 · surcharge 없음 · DB 가 한다)
   ⭐ 칸이 하나면 바로 · 여럿이면 so_line_bgrade_set 이 action choose + 후보(칸 · 값 · 수량)를 돌려준다(저장 안 함) → 고르는 창
   ⭐ 줄 수량이 2 이상이면 몇 개가 B급인지 묻는다 — 전부가 아니면 정상 줄 수량을 줄이고(so_line_update) 그 수만큼 새 줄(so_line_add p_force_new) → 그 줄을 B급으로
   ⚠️ 값 없는 B급 · 죽은 값 · POS 밖 오더는 DB 가 거부(글 그대로) · 장부보다 많으면 확인만(over_bgrade_stock · 막지 않는다 · 판정 647) */
async function askBgrade(l){
  if(!l) return;
  const q = Number(l.qty_ordered);
  if(q > 1){
    const a = prompt(`How many of these ${q} × ${l.sku} are B-grade (damaged package)?`, "1");
    if(a === null) return;
    const n = Number(String(a).trim());
    if(!/^\d+$/.test(String(a).trim()) || n < 1 || n > q){ alert(`Type a whole number from 1 to ${q}.`); return; }
    if(n < q){
      const u = await sb.rpc("so_line_update", { p_line_id: l.id, p_patch: { qty_ordered: q - n } });
      if(u.error){ alert(u.error.message); await openSale(curId); return; }
      const ad = await sb.rpc("so_line_add", { p_so_id: curId, p_product_id: l.product_id, p_qty: n, p_force_new: true });
      if(ad.error || !ad.data || !ad.data.line){ alert(ad.error ? ad.error.message : "Could not add the B-grade line."); await openSale(curId); return; }
      return setBgrade(ad.data.line.id, null);
    }
  }
  return setBgrade(l.id, null);
}
async function setBgrade(lineId, binId){
  const { data, error } = await sb.rpc("so_line_bgrade_set", { p_line_id: lineId, p_bin_id: binId || null });
  if(error){ alert(error.message); await openSale(curId); return; }
  if(data && data.action === "choose") return openBgChoose(data);
  modalClose();
  if(data && (data.warnings || []).includes("over_bgrade_stock")){
    const ln = data.line || {};
    if(!confirm(`The books have only ${Number(data.bin_qty || 0).toLocaleString("en-CA")} B-grade ${ln.sku || ""} in bin ${data.bin || ""}. Sell ${Number(ln.qty_ordered || 0).toLocaleString("en-CA")} anyway?\n\n(The bin goes below 0 — count it later.)`)){
      if(data.action === "merged"){   /* 앞서 있던 B급 줄에 합쳐졌다 — 되돌리기(✕B)는 그 줄 전부를 정상으로 돌리므로 수량은 사람이 고친다 */
        alert("It was added to the B-grade line already on this sale. Lower that line's quantity if it should not be sold.");
        await openSale(curId); return;
      }
      return clearBgrade(ln.id || lineId);
    }
  }
  await openSale(curId);
}
function openBgChoose(d){
  const cs = d.candidates || [];
  modalOpen(`
    <h4>Which B-grade bin? — <span class="mono">${esc(d.sku || "")}</span></h4>
    <div class="pbody">
      <div class="dim" style="font-size:12.5px;margin-bottom:8px">${esc(d.message || "This item is in more than one B-grade bin. Pick the one it came from — each bin has its own price.")}</div>
      <div class="pick">${cs.map(c => c.has_price
        ? `<div class="prow" data-bgbin="${esc(c.bin_id)}"><span class="mono">${esc(c.bin)}</span> · <b>${money(c.price)}</b> <span class="dim">· ${qty(c.qty)} in the bin</span></div>`
        : `<div class="prow" style="cursor:default;opacity:.6"><span class="mono">${esc(c.bin)}</span> · <span class="off">no B-grade price — ask a manager</span> <span class="dim">· ${qty(c.qty)} in the bin</span></div>`).join("")}</div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button></div>`);
  wireModalClose();
  document.querySelectorAll("[data-bgbin]").forEach(el => { el.onclick = () => setBgrade(d.line_id, el.dataset.bgbin); });
}
async function clearBgrade(lineId){
  const { error } = await sb.rpc("so_line_bgrade_clear", { p_line_id: lineId });
  if(error){ alert(error.message); }
  await openSale(curId);
}
async function removeLine(lineId){
  const { error } = await sb.rpc("so_line_remove", { p_line_id: lineId });
  if(error){ alert(error.message); }
  await openSale(curId);
}
async function setTax(name){
  const { error } = await sb.rpc("so_header_update", { p_so_id: curId, p_patch: { tax_rule: name || null } });
  if(error){ alert(error.message); }

}

/* ── pos v1.7 쿠폰 — 초안에 넣기 · 빼기(창구 so_coupon_apply · so_coupon_remove · sales) ── */
async function applyCoupon(given){
  const el = document.getElementById("cpCode");
  const code = (typeof given === "string" ? given : ((el && el.value) || "")).trim();   // pos v1.8 — Use 단추는 코드를 넘긴다
  if(!code){ if(el) el.focus(); return; }
  const { data, error } = await sb.rpc("so_coupon_apply", { p_so_id: curId, p_code: code });
  if(error){ alert(error.message); return; }
  await openSale(curId);
  if(data && data.coupon && data.coupon.status !== "won")
    setTimeout(() => alert(`Coupon ${data.coupon.code} is on the sale but not used — ${CP_REASON[data.coupon.reason] || data.coupon.reason || ""}.`), 30);
}
async function removeCoupon(){
  const cp = cur && cur.coupon; if(!cp) return;
  if(!confirm(`Take coupon ${cp.code} off this sale? The customer can still use it later.`)) return;
  const { error } = await sb.rpc("so_coupon_remove", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await openSale(curId);
}

/* ── Confirm · 다시 열기 · 잠시 두기 ── */
async function confirmSale(){
  const { data, error } = await sb.rpc("so_pos_confirm", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await openSale(curId); loadParked();
  /* pos v1.7 — 확정이 쿠폰을 떼었으면(이기지 못함) 알린다 */
  const cw = ((data && data.warnings) || []).filter(x => String(x).startsWith("coupon_"));
  if(cw.length) setTimeout(() => alert("⚠ " + cw.map(warnText).join("\n⚠ ")), 30);
}
async function reopenSale(){
  if(!confirm("Reopen this sale to change it? Payments already taken stay on it.")) return;
  const { error } = await sb.rpc("so_pos_reopen", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await openSale(curId); loadParked();
}
function parkSale(){
  /* ⭐ 새 상태 없음(판정 16) — 화면만 비운다 · 오더는 확정 그대로 · 재고 잡힌 채 · 이 매장 어느 계산대에서나 이어받는다 */
  clearSale(); loadParked();
}

/* ── 결제 — 대상 = 이 오더(발행 순간 저절로 붙는다 · §18 판정 4) · 나눠 내기 ── */
const PMETH = [["cash","Cash"],["debit_card","Debit"],["credit_card","Credit"],["e_transfer","e-Transfer"]];
function openPay(method){
  /* pos v1.16 — Cash 는 칸 하나(받은 돈) · 기록 = min(받은 돈, 남은 금액) · 거스름돈 · 남는 금액을 창에서 · 다른 방법은 Amount 칸(남은 금액으로 미리 참 · 부분이면 고친다) */
  const due = est ? Math.max(0, Number(est.amount_due) || 0) : 0;
  const cash = method === "cash";
  const r2 = (v) => Math.round(Number(v) * 100) / 100;
  modalOpen(`
    <h4>${esc((PMETH.find(m => m[0] === method) || [0, method])[1])} payment</h4>
    <div class="pbody">
      <div class="frow"><label>To pay</label><b class="mono" style="font-size:15px">${plain(due)}</b></div>
      ${cash ? `<div class="frow"><label>Cash received</label><input id="pyGiven" class="sofield" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="what the customer handed over"></div>
      <div id="pyCalc" class="sohint" style="font-size:13px;min-height:18px"></div>`
      : `<div class="frow"><label>Amount</label><input id="pyA" class="sofield" type="number" step="0.01" min="0.01" inputmode="decimal" value="${due > 0 ? due.toFixed(2) : ""}"></div>
      <div class="sohint">For part of the bill (e.g. some cash, the rest by debit), change the amount to what this ${esc((PMETH.find(m => m[0] === method) || [0, method])[1])} covers.</div>`}
      <div class="frow"><label>Reference</label><input id="pyR" class="sofield" placeholder="${cash ? "" : "slip / approval no."}"></div>
      <div class="sohint">Record it after the terminal approves. A split payment is just two payments — record each one. Each payment shows under Payments on the right, and can be cancelled there before Finish.</div>
      <div id="pyMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" id="pyGo">Record</button></div>`);
  wireModalClose();
  const amountNow = () => {
    if(!cash) return r2(document.getElementById("pyA").value);
    const g = r2(document.getElementById("pyGiven").value);
    return due > 0 ? Math.min(g, due) : g;
  };
  if(cash){
    const g = document.getElementById("pyGiven"), c = document.getElementById("pyCalc");
    g.oninput = () => {
      const got = r2(g.value);
      if(!(got > 0)){ c.textContent = ""; return; }
      if(due > 0 && got >= due) c.innerHTML = `Records <b>${plain(due)}</b> · change <b class="mid">${plain(got - due)}</b>`;
      else if(due > 0) c.innerHTML = `Part payment — records <b>${plain(got)}</b> · still to pay <b class="mid">${plain(due - got)}</b> (another payment, e.g. debit)`;
      else c.innerHTML = `Records <b>${plain(got)}</b>`;
    };
  }
  setTimeout(() => { const i = document.getElementById(cash ? "pyGiven" : "pyA"); if(i){ i.focus(); i.select(); } }, 30);
  const go = async () => {
    const amt = amountNow();
    if(!(amt > 0)){ say("pyMsg", "err", cash ? "Type the cash the customer handed over." : "Give an amount above zero."); return; }
    const s = cur.so;
    say("pyMsg", "", "Recording…"); document.getElementById("pyGo").disabled = true;
    const { error } = await sb.rpc("so_payment_add", { p: {
      customer_id: s.bill_to_customer_id || s.customer_id, amount: amt, paid_on: torontoToday(), method: method,
      reference: document.getElementById("pyR").value.trim() || null, currency_id: s.currency_id, warehouse_id: s.location_id, target_so_ids: [s.id] } });
    if(error){ say("pyMsg", "err", error.message); document.getElementById("pyGo").disabled = false; return; }
    modalClose(); await openSale(curId); loadParked();
  };
  document.getElementById("pyGo").onclick = go;
  ["pyGiven", "pyA", "pyR"].forEach(id => { const el = document.getElementById(id); if(el) el.onkeydown = (e) => { if(e.key === "Enter"){ e.preventDefault(); go(); } }; });
}
/* ── pos v1.16 — 이 판매의 결제 목록 · 취소(판정 863 · so_pos_payment_list · so_pos_payment_cancel) ──
   ⚠️ 취소는 Finish 전(draft · confirmed) · 대상 판매가 하나인 결제만(targets ≠ 1 이면 단추 없음) · 거부 글은 DB 그대로(Finish 뒤 · 다른 인보이스에 붙은 돈 = manager 가 Payments 화면에서) */
const PAY_LBL = { cash: "Cash", debit_card: "Debit", credit_card: "Credit", e_transfer: "e-Transfer", cheque: "Cheque", wire: "Wire", direct_deposit: "Direct deposit", shopify: "Shopify" };
function payListHtml(pl, s){
  if(!pl) return "";
  if(pl.err) return `<div class="sohint" style="color:var(--bad)">Payments: ${esc(pl.err)}</div>`;
  const ps = pl.payments || [];
  if(!ps.length) return "";
  const open = s && (s.status === "draft" || s.status === "confirmed");
  const tm = (t) => t ? new Date(t).toLocaleString("en-CA", { timeZone: "America/Toronto", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }) : "";
  const rows = ps.map(p => {
    const nT = Array.isArray(p.targets) ? p.targets.length : Number(p.targets);
    const live = p.status === "active", lbl = (PAY_LBL[p.method] || p.method || "") + " " + plain(p.amount);
    return `<div style="display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px${live ? "" : ";color:var(--muted)"}">
      <div style="flex:1;min-width:0">
        <div style="${live ? "" : "text-decoration:line-through"}"><b>${esc(PAY_LBL[p.method] || p.method || "")}</b> <span class="mono">${plain(p.amount)}</span>${p.reference ? ` <span class="dim">· ${esc(p.reference)}</span>` : ""}</div>
        <div class="dim" style="font-size:11px">${esc(tm(p.created_at))}${p.created_by_name ? " · " + esc(p.created_by_name) : ""}</div>
        ${live ? "" : `<div style="font-size:11px">Cancelled${p.voided_by_name ? " by " + esc(p.voided_by_name) : ""}${p.voided_at ? " · " + esc(tm(p.voided_at)) : ""}${p.void_note ? " — " + esc(p.void_note) : ""}</div>`}
      </div>
      ${live && open && nT === 1 ? `<button class="xbtn" data-paycx="${esc(p.payment_id)}" data-paylbl="${esc(lbl)}" title="Cancel this payment (entered by mistake)">Cancel</button>` : ""}
    </div>`;
  }).join("");
  return `<div style="margin-top:10px"><div class="dim" style="font-size:12px;margin-bottom:2px">PAYMENTS · ${ps.filter(p => p.status === "active").length} · total ${plain(pl.active_total)}</div>${rows}</div>`;
}
async function cancelPay(paymentId, lbl){
  const why = prompt(`Cancel the payment ${lbl}?\n\nIt stays on record as cancelled, with your name. Then record the right amount again.\n\nReason (optional):`, "");
  if(why === null) return;
  const { error } = await sb.rpc("so_pos_payment_cancel", { p_payment_id: paymentId, p_note: why.trim() || null });
  if(error){ alert(error.message); return; }
  await openSale(curId); loadParked();
}

/* ── Finish — 미리 보기 → 출고 + 인보이스 한 번(막지 않는다) ── */
async function finishSale(){
  const { data, error } = await sb.rpc("so_pos_finish", { p_so_id: curId, p_commit: false });
  if(error){ alert(error.message); return; }
  const e = data.estimate || {};
  const owed = Number(e.amount_due) || 0;
  modalOpen(`
    <h4>Finish ${esc(cur.so.so_number)}</h4>
    <div class="pbody">
      <div class="tot" style="padding:0">
        <div class="row2">Total<b>${money(e.total)}</b></div>
        <div class="row2">Paid for this sale<b>${money(e.deposit)}</b></div>
        ${Number(e.credit) || Number(e.balance) ? `<div class="row2">Credit / money on account used<b>${money(Number(e.credit || 0) + Number(e.balance || 0))}</b></div>` : ""}
        <div class="row2" style="font-size:16px">${owed > 0 ? "Still owed — goes on the invoice" : "Nothing left to pay"}<b class="mid">${money(owed)}</b></div>
      </div>
      ${Number(data.short_ea_total) > 0 ? `<div class="sohint">${qty(data.short_ea_total)} EA more than the book shows here — it still goes; the manager list will show it.</div>` : ""}
      <div class="sohint">Finish hands the goods over and issues the invoice now. It does not stop you if something is still owed — that stays on the invoice${cur.so.payment_term_name ? " (" + esc(cur.so.payment_term_name) + ")" : ""}.</div>
      <div id="fnMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Back</button><button class="pobtn go" id="fnGo">Finish</button></div>`);
  wireModalClose();
  document.getElementById("fnGo").onclick = async () => {
    say("fnMsg", "", "Finishing…"); document.getElementById("fnGo").disabled = true;
    const r = await sb.rpc("so_pos_finish", { p_so_id: curId, p_commit: true });
    if(r.error){ say("fnMsg", "err", r.error.message); document.getElementById("fnGo").disabled = false; return; }
    modalClose(); showDone(r.data); loadParked();
  };
}

}

/* ══ 판매 그리기 ══════════════════════════════════════ */

  document.getElementById("soNo").textContent = "";
  document.getElementById("delDraft").hidden = true;   // pos v1.14
  document.getElementById("custBar").innerHTML = `<span class="dim">Pick the customer first — every POS sale is on a customer account.</span><span class="sp"></span><button class="pobtn" id="pickCust">Customer…</button>`;

/* pos v1.15 — 마지막으로 스캔 · 담은 줄이 맨 위(같은 SKU 가 합쳐져도) · 기억 = 이 브라우저(SO 마다) · 없으면 옛 순서(줄 번호 역순) */
const touchKey = (soId) => "ims_pos_touch_" + soId;
function touchGet(soId){ try{ return JSON.parse(localStorage.getItem(touchKey(soId)) || "{}") || {}; }catch(e){ return {}; } }
function touchLine(soId, lineId){
  if(!soId || !lineId) return;
  try{ const t = touchGet(soId); t[lineId] = Date.now(); localStorage.setItem(touchKey(soId), JSON.stringify(t)); }catch(e){ /* 기억 못 해도 판매는 그대로 */ }
}
/* pos v1.5(묶음 2 · 3) — 콤보 줄 바로 아래 그 구성품 · pos v1.15 — 위 기억 순(없는 줄은 줄 번호 역순) */
function posOrder(ls){
  const kids = {}; ls.filter(l => l.combo_line_id).forEach(l => { (kids[l.combo_line_id] = kids[l.combo_line_id] || []).push(l); });
  const out = [];
  const tch = curId ? touchGet(curId) : {};
  ls.filter(l => !l.combo_line_id).sort((a, b) => (Number(tch[b.id] || 0) - Number(tch[a.id] || 0)) || (Number(b.line_no) - Number(a.line_no))).forEach(l => { out.push(l); (kids[l.id] || []).sort((a, b) => a.line_no - b.line_no).forEach(k => out.push(k)); delete kids[l.id]; });
  Object.values(kids).flat().forEach(k => out.push(k));
  return out;
}
async function openSale(id){
  curId = id;
  const { data, error } = await sb.rpc("so_detail", { p_so_id: id });
  if(error){ alert(error.message); return; }
  cur = data; est = null;
  const s = data.so, t = data.totals || {};
  if(s.status === "fulfilled"){ clearSale(); return; }
  if(s.status === "confirmed"){
    const pv = await sb.rpc("so_pos_finish", { p_so_id: id, p_commit: false });
    if(!pv.error) est = pv.data.estimate || null;
  }
  let pays = null;   // pos v1.16 — 이 판매의 결제(취소된 것 포함)
  { const pl = await sb.rpc("so_pos_payment_list", { p_so_id: id }); pays = pl.error ? { err: pl.error.message } : (pl.data || {}); }
  if(curId !== id) return;
  const draft = s.status === "draft";
  document.getElementById("soNo").textContent = s.so_number + " · " + s.status;
  { const dd = document.getElementById("delDraft"); dd.hidden = !draft; dd.onclick = () => deleteDraft(s.id, s.so_number); }   // pos v1.14 — 판정 773
  document.getElementById("custBar").innerHTML = `<b>${esc(data.customer_name || "")}</b>
    <span class="dim" style="font-size:12px">${esc([s.price_tier, s.payment_term_name].filter(Boolean).join(" · "))}</span>
    <span id="custBal" style="display:inline-flex;gap:6px;flex-wrap:wrap"></span>
    <span class="sp"></span><span class="dim" style="font-size:12px">${esc(s.location_name || "")}</span>`;
  fillBal(data);   // pos v1.10 — 판정 536
  const sc = document.getElementById("scanIn"), fb = document.getElementById("findBtn");
  sc.disabled = !draft; fb.disabled = !draft;
  sc.placeholder = draft ? "Scan a barcode or type a SKU, then Enter" : "Confirmed — Reopen to add or change items";

  const w = (data.warnings || []).filter(x => !String(x).startsWith("reprice") && x !== "no_lines");   // pos v1.8 — no_lines 는 줄 칸이 「Scan the first item.」 으로 말한다
  const needTax = w.some(x => /tax_region_unknown|tax_rule_missing/.test(x));
  document.getElementById("warnBox").innerHTML = (w.length ? `<div class="sowarn">${w.map(x => `<span class="chip warn">⚠ ${esc(warnText(x))}</span>`).join("")}</div>` : "")
    + (needTax && draft ? `<div class="posbar"><span>Tax rule</span><select id="taxSel"><option value="">— pick —</option>${TAXES.map(x => `<option value="${esc(x.name)}">${esc(x.name)} · ${esc(Number(x.rate_pct))}%</option>`).join("")}</select></div>` : "");
  const ts = document.getElementById("taxSel"); if(ts) ts.onchange = () => setTax(ts.value);

  const ls = data.lines || [];
  document.getElementById("lines").innerHTML = ls.length ? `<table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th>${draft ? "<th></th>" : ""}</tr></thead>
    <tbody>${posOrder(ls).map(l => l.combo_line_id ? `<tr class="comp">
      <td><div class="cin">↳ <span class="mono">${esc(l.sku)}</span> ${esc(l.product_name || "")} · ${esc(qty(l.combo_qty))} per combo</div></td>
      <td class="num" style="font-size:12px">${qty(l.qty_ordered)}</td><td></td><td></td>${draft ? "<td></td>" : ""}
    </tr>` : `<tr>
      <td class="itm" data-hsku="${esc(l.sku)}" data-hname="${esc(l.product_name || "")}"><div class="lnth">${thumbOf(l.sku)}<div><span class="mono">${esc(l.sku)}</span>${l.is_combo ? ' <span class="tag">combo</span>' : ""}${l.is_bgrade_line ? ' <span class="tag">B-grade</span>' : ""}${isSale(l) ? '<span class="sale">SALE</span>' : ""}<div class="dim" style="font-size:11.5px">${esc(l.product_name || "")}</div>
        ${discNote(l)}${l.no_price ? '<div class="off" style="font-size:11px">no price</div>' : ""}${l.surcharge_label ? `<div class="dim" style="font-size:11px">+ ${esc(l.surcharge_label)} ${money(l.surcharge_unit)}/ea · ${plain(l.surcharge_total)}</div>` : ""}</div></div></td>
      <td class="num">${draft ? `<button class="xbtn" data-dec="${l.id}" data-q="${esc(l.qty_ordered)}">−</button> <input class="mono" type="number" min="1" step="1" inputmode="numeric" autocomplete="off" data-qin="${l.id}" data-q="${esc(l.qty_ordered)}" value="${esc(l.qty_ordered)}" title="Type the quantity, then Enter" style="width:64px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-weight:700"> <button class="xbtn" data-inc="${l.id}" data-q="${esc(l.qty_ordered)}">+</button>` : qty(l.qty_ordered)}</td>
      <td class="num">${Number(l.discount_pct) > 0 && !l.free_reason && l.list_price !== null && l.list_price !== undefined && Number(l.list_price) !== Number(l.unit_price) ? `<span class="was">${plain(l.list_price)}</span>` : ""}${money(l.unit_price)}${draft && !l.free_reason && !l.is_bgrade_line ? ` <button class="xbtn" data-px="${l.id}" title="Set the price or a discount for this item">✎</button>` : ""}${draft && !l.free_reason && !l.is_combo ? (l.is_bgrade_line ? ` <button class="xbtn" data-bgx="${l.id}" title="Back to a regular item at the regular price">✕B</button>` : ` <button class="xbtn" data-bg="${l.id}" title="Sell as B-grade — damaged package, from a B-grade bin, final sale">B</button>`) : ""}</td><td class="num">${money(l.total)}</td>

  document.querySelectorAll("[data-inc]").forEach(b => { b.onclick = () => setQty(b.dataset.inc, Number(b.dataset.q) + 1, Number(b.dataset.q)); });
  document.querySelectorAll("[data-dec]").forEach(b => { b.onclick = () => setQty(b.dataset.dec, Number(b.dataset.q) - 1, Number(b.dataset.q)); });
  /* pos v1.10 — 판정 547: 숫자 칸 · Enter 또는 칸을 떠나면 저장 · 1 이상 정수만(DB 는 소수도 받는다 — 화면이 막는다) · 0 으로 빼지 않는다(✕ 가 뺀다) */
  document.querySelectorAll("[data-qin]").forEach(i => {
    i.onkeydown = (e) => { if(e.key === "Enter"){ e.preventDefault(); i.blur(); } };
    i.onchange = () => {
      const v = i.value.trim(), old = Number(i.dataset.q);
      if(!/^\d+$/.test(v) || Number(v) < 1){ alert("Type a whole number, 1 or more. To take the item off, press ✕."); i.value = i.dataset.q; return; }

  document.querySelectorAll("[data-px]").forEach(b => { b.onclick = () => openLinePrice((cur.lines || []).find(l => l.id === b.dataset.px)); });   // pos v1.11
  document.querySelectorAll("[data-bg]").forEach(b => { b.onclick = () => askBgrade((cur.lines || []).find(l => l.id === b.dataset.bg)); });   // pos v1.12
  document.querySelectorAll("[data-bgx]").forEach(b => { b.onclick = () => clearBgrade(b.dataset.bgx); });   // pos v1.12
  /* 사진 — 줄 칸 채우기 · 오른쪽 위 = 방금 담은 상품 → 없으면 지금 보이던 것 → 없으면 맨 위(가장 나중) 줄 */
  thumbFill(document.getElementById("lines"));
  eagerThumbs("lines");
  document.querySelectorAll("td.itm").forEach(td => { td.onclick = (ev) => { if(ev.target.closest(".ims-thumb img")) return; drawHero(td.dataset.hsku, td.dataset.hname); }; });
  { const byPid = lastPid && ls.find(l => l.product_id === lastPid);
    const keep = !byPid && heroSku && ls.find(l => l.sku === heroSku);
    const pick = byPid || keep || ls[ls.length - 1] || null;
    lastPid = null;
    if(pick) drawHero(pick.sku, pick.product_name); else drawHero(null); }

  /* 오른쪽 — 금액(DB) · 단추 */
  document.getElementById("bigTot").textContent = plain(t.order_total_with_tax);
  document.getElementById("totRows").innerHTML = `
    <div class="row2">Items<b>${plain(t.lines_total)}</b></div>
    ${Number(t.order_discount_amount) ? `<div class="row2" style="color:#b42318">Order discount${s.order_discount_source === "coupon" && data.coupon ? " · coupon " + esc(data.coupon.code) : ""}${s.order_discount_pct ? " · " + esc(Number(s.order_discount_pct)) + "%" : ""}<b style="color:#b42318">−${plain(t.order_discount_amount)}</b></div>` : ""}
    ${Number(t.charges_total) ? `<div class="row2">Charges<b>${plain(t.charges_total)}</b></div>` : ""}
    ${Number(t.surcharge_amount) ? `<div class="row2">Surcharge<b>${plain(t.surcharge_amount)}</b></div>` : ""}
    <div class="row2">Tax${t.tax_rule ? " · " + esc(t.tax_rule) : ""}<b>${t.tax === null || t.tax === undefined ? "no rule" : plain(t.tax)}</b></div>
    ${est ? `<div class="row2">Paid<b>${plain(est.deposit)}</b></div>
      ${Number(est.credit) || Number(est.balance) ? `<div class="row2">Credit / on account<b>${plain(Number(est.credit || 0) + Number(est.balance || 0))}</b></div>` : ""}
      <div class="row2" style="font-size:15px">To pay<b class="mid">${plain(Math.max(0, Number(est.amount_due) || 0))}</b></div>` : ""}
    ${payListHtml(pays, s)}`;
  let acts = "";
  if(draft){
    /* pos v1.7 — 쿠폰 칸(초안만 · 붙은 쿠폰은 상태와 ✕) · pos v1.8 — 그 손님의 쓸 수 있는 쿠폰이 있거나 붙은 쿠폰이 있을 때만 */
    const cp = data.coupon;
    let avail = [];
    { const r = await sb.from("so_coupon").select("code,expires_on,so_deal(name,is_active,coupon_required,is_order_level)")
        .eq("customer_id", s.customer_id).is("used_so_id", null).is("voided_at", null).order("issued_at");
      if(!r.error) avail = (r.data || []).filter(c => (!c.expires_on || c.expires_on >= s.order_date)
        && c.so_deal && c.so_deal.is_active && c.so_deal.coupon_required && c.so_deal.is_order_level
        && !(cp && cp.code === c.code)); }
    if(curId !== id) return;   // 그 사이 다른 판매를 열었다
    const cpNow = cp ? `<div style="font-size:12.5px;margin-bottom:6px"><span class="mono">${esc(cp.code)}</span>
        ${cp.status === "won" ? `<span class="tag">applied${cp.pct !== null && cp.pct !== undefined ? " · " + esc(Number(cp.pct)) + "%" : ""}</span>` : '<span class="tag off">not used</span>'}
        <button class="xbtn" id="cpRemove" title="Take the coupon off">&#10005;</button>
        ${cp.status !== "won" ? `<div class="dim" style="font-size:11.5px">Not used — ${esc(CP_REASON[cp.reason] || cp.reason || "")}</div>` : ""}</div>` : "";
    const availHtml = avail.map(c => `<div style="display:flex;gap:6px;align-items:center;font-size:12.5px;margin-bottom:4px">
        <span class="mono">${esc(c.code)}</span><span class="dim" style="font-size:11.5px;flex:1;min-width:0">${esc(c.so_deal.name)}${c.expires_on ? " · until " + esc(c.expires_on) : ""}</span>
        <button class="pobtn" data-cpuse="${esc(c.code)}">${cp ? "Use instead" : "Use"}</button></div>`).join("");
    acts = (cp || avail.length ? `<div style="padding:10px 14px;border-top:1px solid var(--line)"><div class="dim" style="font-size:12px;margin-bottom:6px">COUPON${avail.length ? ` — ${avail.length} for this customer` : ""}</div>${cpNow}${availHtml}
        <div style="display:flex;gap:6px"><input type="search" id="cpCode" autocomplete="off" placeholder="${cp ? "Another code" : "Coupon code"}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px"><button class="pobtn" id="cpApply">${cp ? "Replace" : "Apply"}</button></div></div>` : "")
      + `<div class="acts"><button class="pobtn go" id="aConfirm" ${ls.length ? "" : "disabled"}>Confirm — show the amount</button></div>`;
  } else {
    acts = `<div class="paygrid">${PMETH.map(([k, l]) => `<button class="pobtn" data-pay="${k}">${l}</button>`).join("")}</div>
      <div class="acts">
        <button class="pobtn go" id="aFinish">Finish — hand over and invoice</button>
        <button class="pobtn" id="aPark" title="Set it aside and serve the next customer — it stays open at this store">Park</button>
        <button class="pobtn" id="aReopen">Reopen to change items</button>
      </div>`;
  }
  document.getElementById("sideActs").innerHTML = acts;
  const bc = document.getElementById("aConfirm"); if(bc) bc.onclick = confirmSale;
  { const ca = document.getElementById("cpApply"); if(ca) ca.onclick = applyCoupon;                                  // pos v1.7
    const cr = document.getElementById("cpRemove"); if(cr) cr.onclick = removeCoupon;
    const cc = document.getElementById("cpCode"); if(cc) cc.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); applyCoupon(); } };
    document.querySelectorAll("[data-cpuse]").forEach(b => { b.onclick = () => applyCoupon(b.dataset.cpuse); }); }   // pos v1.8
  document.querySelectorAll("[data-pay]").forEach(b => { b.onclick = () => openPay(b.dataset.pay); });
  document.querySelectorAll("[data-paycx]").forEach(b => { b.onclick = () => cancelPay(b.dataset.paycx, b.dataset.paylbl); });   // pos v1.16
  const bf = document.getElementById("aFinish"); if(bf) bf.onclick = finishSale;
  const bp = document.getElementById("aPark"); if(bp) bp.onclick = parkSale;
  const br = document.getElementById("aReopen"); if(br) br.onclick = reopenSale;
  focusScan();
}

/* ── 이 매장의 잠시 둔 · 열린 판매 — 확정(so_pos_open_list) + 초안(진행 중) ── */
async function loadParked(){
  const box = document.getElementById("parked");
  if(!storeId){ box.innerHTML = '<div class="msg">Pick this counter\'s store.</div>'; return; }
  const [op, dr] = await Promise.all([
    sb.rpc("so_pos_open_list", { p_location_id: storeId }),
    sb.from("so").select("id,so_number,created_at,bill_to_name,customer:customer_id(name)").eq("channel", "pos").eq("status", "draft").eq("location_id", storeId).order("created_at", { ascending: false }).limit(50),
  ]);
  if(op.error){ box.innerHTML = `<div class="msg err">${esc(op.error.message)}</div>`; return; }
  const rows = [];
  (op.data.orders || []).forEach(o => rows.push(`<tr class="parked" data-open="${o.id}">
      <td class="mono">${esc(o.so_number)}</td><td>${esc(o.customer_name || "")}</td><td>confirmed${o.stale ? ' <span class="off" style="font-size:11.5px">from ' + esc(o.confirmed_on) + " — not finished</span>" : ""}</td>
      <td class="num">${money(o.amount)}</td><td class="num">${Number(o.received) ? money(o.received) : '<span class="dim">—</span>'}</td><td class="dim" style="font-size:11.5px">${esc(o.confirmed_by_name || "")}</td></tr>`));
  (dr.data || []).forEach(o => rows.push(`<tr class="parked" data-open="${o.id}">
      <td class="mono">${esc(o.so_number)}</td><td>${esc((o.customer && o.customer.name) || o.bill_to_name || "")}</td><td class="dim">draft — scanning</td>
      <td class="num"><span class="dim">—</span></td><td class="num"><span class="dim">—</span></td><td class="dim" style="font-size:11.5px;white-space:nowrap">${imsTs(o.created_at)} <button class="xbtn" data-del="${o.id}" data-no="${esc(o.so_number)}" title="Delete this draft" style="margin-left:6px">&#10005;</button></td></tr>`));   // pos v1.14 — 판정 773
  document.getElementById("parkN").textContent = rows.length || "";
  box.innerHTML = rows.length ? `<table><thead><tr><th>Sale</th><th>Customer</th><th>State</th><th class="num">Amount</th><th class="num">Paid</th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table>
      <div class="sosub">Click to pick it up at this counter. A confirmed sale not finished by the end of the day shows on the manager list.</div>`
    : '<div class="msg">Nothing parked or open at this store.</div>';
  box.querySelectorAll("[data-open]").forEach(tr => { tr.onclick = () => openSale(tr.dataset.open); });
  box.querySelectorAll("[data-del]").forEach(b => { b.onclick = (ev) => { ev.stopPropagation(); deleteDraft(b.dataset.del, b.dataset.no); }; });   // pos v1.14
}

/* pos v1.14 — 판정 773: 초안 지우기(so_delete · Sales Orders 의 Delete draft 와 같은 글 · 확정된 판매는 DB 가 거부) */
async function deleteDraft(id, no){
  if(!id) return;
  if(!confirm(`Delete draft ${no}? It has never been confirmed, so it disappears — the number is not reused.`)) return;
  const { error } = await sb.rpc("so_delete", { p_so_id: id });
  if(error){ alert(error.message); return; }
  if(curId === id) clearSale();
  loadParked();
}

/* ── 시작 ── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; window.sb = sb;
  imsHeader(me);
  document.getElementById("buildTag").textContent = POS_BUILD;
  const [wh, tx] = await Promise.all([
    sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name"),
    sb.from("ref_tax_rule").select("name,rate_pct").eq("is_active", true).eq("direction", "sale").order("name"),
  ]);
  WHS = wh.data || []; TAXES = tx.data || [];
  let saved = null; try { saved = localStorage.getItem(STORE_KEY); } catch(e) {}
  const st = document.getElementById("store");
  st.innerHTML = '<option value="">— this counter\'s store —</option>' + WHS.map(w => `<option value="${w.id}" ${w.id === saved ? "selected" : ""}>${esc(w.name)}</option>`).join("");
  st.onchange = () => setStore(st.value || null);
  if(saved && WHS.some(w => w.id === saved)) storeId = saved;
  document.getElementById("newSale").onclick = () => { clearSale(); openCustPick(); };
  document.getElementById("scanIn").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); onScan(); } });
  document.getElementById("findBtn").onclick = () => openFind("");
  clearSale();
  loadParked();
  const want = imsParam("so");
  if(want){
    const { data } = await sb.from("so").select("id").eq("so_number", want).eq("channel", "pos").maybeSingle();
    if(data) openSale(data.id);
  }
});
</script>
