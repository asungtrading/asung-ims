function headIn(field, value, ed, type){
  if(!ed) return (value === null || value === undefined || value === "") ? '<span class="dim">—</span>' : esc(value);
  const t = type || "text";
  return `<input class="${t === "number" ? "qin" : "tin"}" type="${t}" ${t === "number" ? 'step="any" min="0"' : ""}
    value="${esc(value ?? "")}" data-prev="${esc(value ?? "")}" data-head="${field}">`;
}
function headSel(field, value, ed, opts, blank){
  const lbl = (opts.find(o => o[0] === value) || [null, value])[1];
  if(!ed) return dim(lbl);
  return `<select class="tin" data-head="${field}" data-prev="${esc(value ?? "")}">
    ${blank !== undefined ? `<option value="">${esc(blank)}</option>` : ""}
    ${opts.map(o => `<option value="${esc(o[0])}" ${o[0] === value ? "selected" : ""}>${esc(o[1])}</option>`).join("")}
  </select>`;
}
const addr = (a) => [a.l1, a.l2, a.city, a.prov, a.post, a.ctry].filter(Boolean).join(", ");

/* v2.5 — 창고 쪽 시각 줄의 사람 이름(so_detail 은 id 만 준다 · ims_staff 읽기 열림) · 한 번 읽고 둔다 */
let staffNames = null;
async function loadStaffNames(){
  if(staffNames) return staffNames;
  const r = await sb.from("ims_staff").select("id,name");
  staffNames = Object.fromEntries(((r && r.data) || []).map(x => [x.id, x.name]));
  return staffNames;
}

async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';
  const [d, fam] = await Promise.all([
    sb.rpc("so_detail", { p_so_id: id }),
    sb.rpc("so_family_members", { p_so_id: id }),
  ]);
  if(seq !== detailSeq) return;
  /* v2 — 줄마다 지금 예약(allocated · hold · backorder · preorder) · so_detail 에 없어 표를 읽는다(읽기 열림) · 보류 여부도 이것으로 */
  let RES = {};
  const lineIds = ((d.data && d.data.lines) || []).map(l => l.id);
  if(lineIds.length){
    const rr = await sb.from("so_reserve").select("so_line_id,kind,qty_allocated").is("released_at", null).in("so_line_id", lineIds);
    (rr.data || []).forEach(x => { (RES[x.so_line_id] = RES[x.so_line_id] || []).push(x); });
  }
  /* so v4a(판정 248) — 초안이면 줄마다 가용(so_lines_available 한 번 · 콤보 줄 = 통째 콤보 수 · 구성품 · 보통 줄 = 자기 단위) · 정지 그림(줄끼리 서로 빼지 않는다 — 확정이 한다) */
  let AVL = {};
  if(d.data && d.data.so && d.data.so.status === "draft" && lineIds.length){
    const la = await sb.rpc("so_lines_available", { p_so_id: id });
    if(!la.error) (la.data || []).forEach(x => { AVL[x.line_id] = x; });
  }
  /* v2 — 병합으로 만든 초안이면 「오늘 견적이 더 유리한 줄」(판정 4 보완 ①) */
  let HINT = null;
  if(d.data && d.data.so && d.data.so.status === "draft"){
    const h = await sb.rpc("so_merge_requote_hint", { p_so_id: id });
    if(!h.error && h.data && h.data.merged) HINT = h.data;
  }
  /* so v5a — 딜 이름(줄의 deal_line_id · 오더 할인의 deal) · 읽기 정책 so_deal_select · so_deal_line_select · 실패하면 이름 없이 그린다 */
  const DEALN = { line: {}, order: null };
  if(d.data && d.data.so){
    const dlIds = [...new Set((d.data.lines || []).map(l => l.deal_line_id).filter(Boolean))];
    const odId = d.data.so.order_discount_deal_id;
    const none = Promise.resolve({ data: null });
    const [dl, od] = await Promise.all([
      dlIds.length ? sb.from("so_deal_line").select("id,so_deal(name)").in("id", dlIds) : none,
      odId ? sb.from("so_deal").select("name").eq("id", odId).maybeSingle() : none,
    ]);
    ((dl && dl.data) || []).forEach(x => { DEALN.line[x.id] = x.so_deal ? x.so_deal.name : ""; });
    DEALN.order = (od && od.data) ? od.data.name : null;
  }
  /* ⭐ v2.5 · 24-p 「시각 줄」 — 창고 길 오더의 Released · Working · Finalized 시각과 사람 · Finalized 면 검토함과 마무리 모양(판정 22 · 읽기만) */
  let WMS = null;
  const so0 = d.data && d.data.so;
  if(so0 && so0.channel === "warehouse" && (so0.at_wms_at || so0.picking_at || so0.packed_at)){
    const none = Promise.resolve({ data: null });
    const [names, rv, fz] = await Promise.all([
      loadStaffNames(),
      so0.packed_at ? sb.from("wms_order_review").select("reviewed,reviewed_by,reviewed_at").eq("order_id", so0.id).maybeSingle() : none,
      so0.packed_at ? sb.from("wms_order_finalize").select("fulfillment_type,units,units_without_dims").eq("order_id", so0.id).maybeSingle() : none,
    ]);
    WMS = { names: names || {}, review: (rv && rv.data) || null, fin: (fz && fz.data) || null };
  }
  if(seq !== detailSeq) return;
  if(d.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(d.error.message)}</div></div>`; return; }
  if(!d.data || !d.data.so){ box.innerHTML = '<div class="card"><div class="msg">That sales order is gone.</div></div>'; return; }
  const data = d.data;
  cur = data;
  const s = data.so, t = data.totals || {}, inv = data.invoice;
  const famRows = (fam.data || []);
  /* 합쳐진 곳의 번호 — so_family_members 는 id 만 준다 */
  const mergedIds = [...new Set(famRows.map(r => r.merged_into_id).concat(s.merged_into_id ? [s.merged_into_id] : []).filter(Boolean))];
  let mergedNo = {};
  if(mergedIds.length){
    const m = await sb.from("so").select("id,so_number").in("id", mergedIds);
    (m.data || []).forEach(x => { mergedNo[x.id] = x.so_number; });
  }
  if(seq !== detailSeq) return;

  /* ⚠️ 화면 조각이 쓰는 값은 조각보다 위에서 선언한다(po.html 실사고 두 번) */
  const ed = s.status === "draft";
  const ch = s.channel;
  const allRes = Object.values(RES).flat();
  const onHold = s.status === "confirmed" && allRes.some(x => x.kind === "hold");
  const hasBo  = s.status === "confirmed" && allRes.some(x => x.kind === "backorder" || x.kind === "preorder");
  /* v2.2 — Hold 는 잡힌 줄(allocated)이 있을 때만(Caleb 화면 시험 2026-09-25 · 백오더 형제에 떠 있었다 · so_hold 가 거부한다) */
  const hasAlloc = s.status === "confirmed" && allRes.some(x => x.kind === "allocated");
  const invLive = inv && inv.status === "issued";
  const acts = [];
  acts.push('<button class="pobtn" data-act="toglist" title="Show or hide the list">&#9776; List</button>');
  acts.push('<button class="pobtn" data-act="wide">&lsaquo; All orders</button>');
  if(ed){
    acts.push('<button class="pobtn" data-act="addline">Add lines</button>');
    acts.push('<button class="pobtn" data-act="paste">Paste lines</button>');
    acts.push('<button class="pobtn" data-act="addcharge">Add a charge</button>');
    acts.push('<button class="pobtn" data-act="surcharge" title="Give the ticked lines a surcharge — for example a US tariff">Set surcharge…</button>');   // surcharge-3 묶음 3
    acts.push('<button class="pobtn" data-act="shipto">Ship to…</button>');
    acts.push(s.reprice_suggested_at   // so v5b — 깃발이 서 있으면 눈에 띄게
      ? '<button class="pobtn" data-act="reprice" style="border-color:#e8cf7a;background:#fff6d6" title="Prices may be out of date — requote system lines with today\'s rules">Reprice ●</button>'
      : '<button class="pobtn" data-act="reprice" title="Requote system lines with today\'s rules">Reprice</button>');
    if(isMgr() && ch === "warehouse") acts.push('<button class="pobtn go" data-act="confirm">Confirm…</button>');
    if(ch === "warehouse") acts.push('<button class="pobtn" data-act="merge" title="Merge with other open orders of this customer">Merge…</button>');
    if(isMgr() && ch === "counter")   acts.push('<button class="pobtn go" data-act="confirmc">Confirm</button>');
    acts.push('<button class="pobtn" data-act="delete">Delete draft</button>');
  }
  if(s.status === "confirmed"){
    if(ch === "counter" && isMgr()){
      acts.push('<button class="pobtn go" data-act="ship">Hand over — ship and invoice…</button>');
      acts.push('<button class="pobtn" data-act="reopenc">Reopen as draft</button>');
    }
    if(ch === "warehouse"){
      /* v2.4 — Release to WMS(⑤-4 ⬜H · 판정 21) — 보류 · 백오더/선주문 줄이 있으면 막아 두고 까닭을 보인다(창구 so_release_to_wms 가 다시 본다) */
      if(canSales()){
        if(onHold)     acts.push('<button class="pobtn" disabled title="Release the hold first — an order on hold cannot go to the warehouse">Release to WMS</button>');
        else if(hasBo) acts.push('<button class="pobtn" disabled title="Proceed or clear the backorder / preorder lines first">Release to WMS</button>');
        else           acts.push('<button class="pobtn go" data-act="release" title="Send this order to the warehouse — it appears on the WMS Split screen">Release to WMS</button>');
      }
      if(isMgr()){
        if(onHold) acts.push('<button class="pobtn go" data-act="unhold">Release hold</button>');
        else if(hasAlloc) acts.push('<button class="pobtn" data-act="hold" title="Release the reserved stock and keep the order waiting">Hold</button>');
        if(hasBo)  acts.push('<button class="pobtn go" data-act="proceed" title="Reserve backorder or preorder lines that are in stock now">Proceed backorder…</button>');
        acts.push('<button class="pobtn" data-act="divide">Divide…</button>');
        acts.push('<button class="pobtn" data-act="changewh">Change warehouse…</button>');
        acts.push('<button class="pobtn" data-act="merge">Merge…</button>');
      }
      if(isSup()) acts.push('<button class="pobtn" data-act="unconfirm">Unconfirm</button>');
    }
    if(ch === "pos") acts.push('<button class="pobtn" disabled title="POS orders are finished on the POS screen (coming later)">Finish on POS</button>');
    if(isMgr()) acts.push('<button class="pobtn" data-act="cancel">Cancel order…</button>');
  }
  /* v2.4 — 창고에 있는 오더(판정 18 · 21): at_wms = 매니저의 Split 화면에서 기다림 → 오피스가 거둬들일 수 있다 · picking = 창고가 먼저 되돌려야 한다(한 단계씩) */
  if(ch === "warehouse" && canSales()){
    /* v3 — 창고가 Finalize 한 오더를 오피스가 끝낸다(판정 16 · 18 · 46) · 되돌릴 수 없는 길이라 창이 미리 보기를 먼저 한다 */
    if(s.status === "packed") acts.push('<button class="pobtn go" data-act="finalize" title="Freight, carrier and tracking — then ship (stock leaves the books) and issue the invoice">Finalize — ship and invoice…</button>');
    if(s.status === "at_wms")  acts.push('<button class="pobtn" data-act="recall" title="Take the order back from the warehouse — only before the manager splits it into pick tasks">Recall from WMS</button>');
    if(s.status === "picking") acts.push('<button class="pobtn" disabled title="The warehouse is working on it — ask the warehouse manager to send it back first">Recall from WMS</button>');
  }
  /* v1.2 — 다 받은 인보이스면 숨긴다(Caleb 화면 시험 2026-09-25 · 누르면 넣을 곳 없는 돈이 손님 잔액으로 간다) */
  if(s.status !== "cancelled" && s.status !== "draft" && ((invLive && Number(inv.remaining) > 0) || (!invLive && (s.status === "confirmed" || s.status === "packed"))))
    acts.push('<button class="pobtn" data-act="pay">Take a payment…</button>');
  else if(s.status === "draft")
    acts.push('<button class="pobtn" data-act="pay" title="A deposit recorded against this order attaches itself when the invoice is issued">Take a deposit…</button>');

  const chips = [stChip(s.status), `<span class="chip">${esc(CH_LBL[ch] || ch)}</span>`];
  if(s.intake && s.intake !== "manual") chips.push(`<span class="chip">from ${esc(s.intake)}</span>`);
  if(s.closed_reason) chips.push(`<span class="chip">${esc(s.closed_reason)}</span>`);
  if(s.split_reason) chips.push(`<span class="chip">${esc(s.split_reason.replace("_", " "))}</span>`);

  const WHO = WHS.map(w => [w.id, w.name]);
  const TERMO = TERMS.map(x => [x.id, x.name]);
  const TIERO = TIERS.map(x => [x.name, x.name]);
  const TAXO = TAXES.map(x => [x.name, x.name + " · " + Number(x.rate_pct) + "%"]);
  const taxSrc = t.tax_rule_source === "manual" ? '<span class="tag">set by hand</span>' : (t.tax_rule_source === "ship_to" ? '<span class="tag">from ship-to</span>' : "");
  const shipA = { l1: s.ship_to_line1, l2: s.ship_to_line2, city: s.ship_to_city, prov: s.ship_to_state_province, post: s.ship_to_postal_code, ctry: s.ship_to_country };
  const billA = { l1: s.bill_to_line1, l2: s.bill_to_line2, city: s.bill_to_city, prov: s.bill_to_state_province, post: s.bill_to_postal_code, ctry: s.bill_to_country };

  /* so v5a — 오더 할인 출처 · 잠김 · 규칙이 더 큰 경우(판정 282 · 311 · 312) · 쿠폰(판정 283 · 329) — kvL 보다 위에서 선언 */
  const odSrc = s.order_discount_source;
  const odNote =
    (odSrc === "deal"   ? ` <span class="tag" title="From an order discount rule">rule${DEALN.order ? " · " + esc(DEALN.order) : ""}</span>`
    : odSrc === "coupon" ? ` <span class="tag" title="From the coupon on this order">coupon${data.coupon ? " " + esc(data.coupon.code) : ""}</span>`
    : odSrc === "manual" ? ` <span class="tag disc" title="${ed ? "Clear the box to go back to the rules" : "Typed by hand"}">set by hand</span>`
    : odSrc ? ` <span class="dim">${esc(odSrc)}</span>` : "")
    + (s.order_discount_locked_at ? ` <span class="tag" title="Fixed when the order was split or divided on ${escQ(imsTs(s.order_discount_locked_at))} — the amount the customer first ordered decides it. Line changes and Reprice leave it; a % typed here still replaces it.">locked</span>` : "")
    + (data.order_discount_rule ? `<div class="dim" style="font-size:11.5px">a rule would give ${esc(Number(data.order_discount_rule.rule_pct))}%</div>` : "");
  const cp = data.coupon;
  let cpCell = "";
  if(cp){
    cpCell = `<span class="mono">${esc(cp.code)}</span> `
      + (cp.status === "won" ? `<span class="tag">applied${cp.pct !== null && cp.pct !== undefined ? " · " + esc(Number(cp.pct)) + "%" : ""}</span>` : '<span class="tag off">not used</span>')
      + ` <span class="dim" style="font-size:11.5px">${esc(cp.deal_name || "")}${cp.expires_on ? " · until " + esc(cp.expires_on) : ""}</span>`
      + (ed && canSales() ? ` <button class="xbtn" data-act="cpremove" title="Take the coupon off this order">&#10005;</button>` : "")
      + (cp.status !== "won" ? `<div class="dim" style="font-size:11.5px">Not used — ${esc(CP_REASON[cp.reason] || cp.reason || "")}</div>` : "");
  }
  if(ed && canSales()) cpCell += `<div style="display:flex;gap:6px;align-items:center;${cp ? "margin-top:6px" : ""}"><input class="tin" id="cpCode" type="search" autocomplete="off" placeholder="${cp ? "Another code" : "Coupon code"}"><button class="pobtn" data-act="cpapply">${cp ? "Replace" : "Apply"}</button></div>`;
  if(!cpCell) cpCell = '<span class="dim">—</span>';

  const kvL = [
    ["Customer",       esc(data.customer_name || "")],
    ["Warehouse",      headSel("location_id", s.location_id, ed, WHO)],
    ["Order date",     headIn("order_date", s.order_date, ed, "date")],
    ["Required by",    headIn("required_by", s.required_by, ed, "date")],
    ["Reference",      headIn("ref", s.ref, ed)],
    ["Payment term",   headSel("payment_term_id", s.payment_term_id, ed, TERMO, "—")],
    ["Price tier",     headSel("price_tier", s.price_tier, ed, TIERO)],
    ["Customer discount %", headIn("discount_pct", s.discount_pct, ed, "number")],
    ["Order discount %",    headIn("order_discount_pct", s.order_discount_pct, ed, "number") + odNote],
    ["Coupon",              cpCell],
    ["Tax rule",       headSel("tax_rule", s.tax_rule, ed, TAXO, "Auto — from ship-to province") + " " + taxSrc],
  ];
  /* v2.5 — 시각 줄 도우미 · 되돌리면 그 칸이 지워져 「—」 가 된다(so_wms_status) */
  const wmsWhen = (at, by) => at
    ? imsTs(at) + (by ? ` <span class="dim">by ${esc(WMS.names[by] || "—")}</span>` : "")
    : '<span class="dim">—</span>';
  const finNote = () => {
    if(!s.packed_at || !WMS) return "";
    const f = WMS.fin, r = WMS.review, out = [];
    if(f) out.push(`${f.fulfillment_type === "direct" ? "direct pack — no pallets" : "packing list"} · ${qty(f.units)} unit(s)` +
      (Number(f.units_without_dims) ? ` · <span class="bad">${qty(f.units_without_dims)} without dimensions</span>` : ""));
    out.push(r && r.reviewed
      ? `reviewed by ${esc(WMS.names[r.reviewed_by] || "—")} · ${imsTs(r.reviewed_at)}`
      : "not reviewed by the warehouse manager yet");
    return `<div class="dim" style="font-size:11.5px">${out.join("<br>")}</div>`;
  };
  const kvR = [
    ["Bill to",        esc(s.bill_to_name || "") + (addr(billA) ? `<div class="dim" style="font-size:11.5px">${esc(addr(billA))}</div>` : "")],
    ["Ship to",        esc([s.ship_to_company, s.ship_to_contact].filter(Boolean).join(" · "))
                       + (addr(shipA) ? `<div class="dim" style="font-size:11.5px">${esc(addr(shipA))}</div>` : "")
                       + (s.ship_to_phone ? `<div class="dim" style="font-size:11.5px">${esc(s.ship_to_phone)}</div>` : "")],
    ["Currency",       `<span class="mono">${dim(s.currency_code)}</span>`],
    ["Comments",       headIn("comments", s.comments, ed)],
    ["Shipping notes", headIn("shipping_notes", s.shipping_notes, ed)],
    ["Created",        imsTs(s.created_at)],
    ["Confirmed",      s.confirmed_at ? imsTs(s.confirmed_at) : '<span class="dim">—</span>'],
    ...(WMS ? [
      ["Released to WMS", wmsWhen(s.at_wms_at, s.at_wms_by)],
      ["Working",         wmsWhen(s.picking_at, s.picking_by)],
      ["Finalized",       wmsWhen(s.packed_at, s.packed_by) + finNote()],
    ] : []),
    ["Shipped",        s.shipped_at ? imsTs(s.shipped_at) : '<span class="dim">—</span>'],
    ["Closed",         s.closed_at ? imsTs(s.closed_at) + (s.closed_note ? ` <span class="dim">${esc(s.closed_note)}</span>` : "") : '<span class="dim">—</span>'],
    ["",               '<span id="headMsg" style="font-size:12.5px"></span>'],
  ];
  const kvTbl = (rows) => `<table class="kv"><tbody>${rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  const basisNote = t.basis === "shipped" ? "shipped quantities (the invoice is the record)" : "ordered quantities";
  const stats = `
    <div class="stats">
      <div class="stat">Lines<b>${money(t.lines_total)}</b></div>
      <div class="stat">Order discount<b>${Number(t.order_discount_amount) ? "−" + money(t.order_discount_amount) : money(0)}</b></div>
      <div class="stat">Charges<b>${money(t.charges_total)}</b></div>
      ${Number(t.surcharge_amount) ? `<div class="stat">Surcharge<b>${money(t.surcharge_amount)}</b></div>` : ""}
      <div class="stat ${t.tax === null || t.tax === undefined ? "warn" : ""}">Tax${t.tax_rule ? ` <span class="dim">${esc(t.tax_rule)}</span>` : ""}<b>${t.tax === null || t.tax === undefined ? "no rule" : money(t.tax)}</b></div>
      <div class="stat">Total<b>${money(t.order_total_with_tax)}</b></div>
    </div>`;

  const shownQty = s.status !== "draft";
  /* so v4a(묶음 2 · 3) — 콤보 줄 바로 아래 그 구성품 줄(line_no 가 떨어져 있어도 · 합치기 · 형제는 구성품을 끝 번호로 단다) */
  const allL = data.lines || [];
  const kidsOf = {};
  allL.filter(l => l.combo_line_id).forEach(l => { (kidsOf[l.combo_line_id] = kidsOf[l.combo_line_id] || []).push(l); });
  const ordL = [];
  allL.filter(l => !l.combo_line_id).forEach(l => { ordL.push(l); (kidsOf[l.id] || []).sort((a, b) => a.line_no - b.line_no).forEach(k => ordL.push(k)); delete kidsOf[l.id]; });
  Object.values(kidsOf).flat().forEach(k => ordL.push(k));   // 짝 없는 구성품(있으면 안 된다 — 그래도 숨기지 않는다)
  const avlTxt = (l) => {
    const a = AVL[l.id]; if(!a) return "";
    const u = Number(a.available_units) || 0, need = Number(l.qty_ordered) || 0;
    return `<div class="avl ${u >= need ? "on" : "off"}" title="Available in this warehouse now — on hand minus what other orders reserved${l.is_combo ? " · a combo counts whole combos its components can make" : ""}">available ${esc(u.toLocaleString("en-CA"))}${l.is_combo ? " combo" + (u === 1 ? "" : "s") : ""}</div>`;
  };
  /* so v5a — Net unit(판정 284): 오더 할인 % 가 있을 때만 · 줄 단가 × (1 − %) · 그릴 때 계산(저장값 아님 · 할인은 합계에서 한 번) */
  const odp = Number(s.order_discount_pct) || 0;
  const showNet = odp > 0;
  const netOf = (u) => (u === null || u === undefined) ? null : Number(u) * (1 - odp / 100);
  const compRow = (l) => `<tr class="comp">
      ${ed ? "<td></td>" : ""}
      <td class="num dim">${esc(l.line_no)}</td>
      <td><div class="cin"><span class="mono">${esc(l.sku)}</span>${Number(l.pack_factor) > 1 ? ` <span class="dim">×${esc(l.pack_factor)}</span>` : ""}
        <div class="dim" style="font-size:11.5px">${esc(l.product_name || "")} · ${esc(qty(l.combo_qty))} per combo</div></div></td>
      <td class="num">${qty(l.qty_ordered)}${ed ? avlTxt(l) : ""}</td>
      ${shownQty ? `<td class="num">${qty(l.qty_shipped)}</td><td>${(RES[l.id] || []).map(x => resLabel(x)).join(" ") || '<span class="dim" style="font-size:11.5px">—</span>'}</td>` : ""}
      <td></td><td></td><td></td>${showNet ? "<td></td>" : ""}<td></td><td></td>
      <td><span class="dim" style="font-size:11.5px" title="A component carries no price — the combo line does">for combo ${esc(l.combo_sku || "")}</span></td>
      ${ed ? "<td></td>" : ""}
    </tr>`;
  const lines = ordL.map(l => {
    if(l.combo_line_id) return compRow(l);
    const src = l.free_reason ? `<span class="tag">free · ${esc(l.free_reason)}</span>`
      : l.price_override ? '<span class="tag disc">price set by hand</span>'
      : l.discount_source === "manual" ? '<span class="tag disc">discount by hand</span>'
      : l.discount_source === "deal" ? `<span class="tag"${DEALN.line[l.deal_line_id] ? ` title="${escQ(DEALN.line[l.deal_line_id])}"` : ""}>deal${DEALN.line[l.deal_line_id] ? " · " + esc(DEALN.line[l.deal_line_id]) : ""}</span>`
      : l.discount_source === "set" ? '<span class="tag" title="The set discount % of this set">set discount</span>'
      : l.discount_source === "customer" ? '<span class="dim" style="font-size:11.5px">customer</span>' : "";
    const flags = [l.no_price ? '<span class="off" style="font-size:11.5px">no price</span>' : "",
                   l.deal_ended ? '<span class="neutral" style="font-size:11.5px">deal had ended</span>' : "",
                   Number(l.qty_removed) > 0 ? `<span class="neutral" style="font-size:11.5px">removed ${qty(l.qty_removed)}</span>` : "",
                   Number(l.qty_credited) > 0 ? `<span class="neutral" style="font-size:11.5px">credited ${qty(l.qty_credited)}</span>` : ""].filter(Boolean).join(" ");
    const manual = l.price_override || l.discount_source === "manual";
    return `<tr>
      ${ed ? `<td>${l.free_reason ? "" : `<input type="checkbox" data-scpick="${l.id}" title="Pick for Set surcharge…">`}</td>` : ""}
      <td class="num">${esc(l.line_no)}</td>
      <td><div class="lnth">${thumbOf(l.sku)}<div><span class="mono">${esc(l.sku)}</span>${Number(l.pack_factor) > 1 ? ` <span class="dim">×${esc(l.pack_factor)}</span>` : ""}${l.is_combo ? ' <span class="tag" title="Sold as one line — the components below carry the stock">combo</span>' : ""}
        <div class="dim" style="font-size:11.5px">${esc(l.product_name || "")}</div>${l.comments ? `<div class="dim" style="font-size:11.5px">${esc(l.comments)}</div>` : ""}</div></div></td>
      <td class="num">${ed ? `<input class="qin" type="number" step="any" min="0" value="${esc(l.qty_ordered)}" data-prev="${esc(l.qty_ordered)}" data-line="${l.id}" data-f="qty_ordered">` + avlTxt(l) : qty(l.qty_ordered)}</td>
      ${shownQty ? `<td class="num">${qty(l.qty_shipped)}</td><td>${l.is_combo ? '<span class="dim" style="font-size:11.5px">see components ↓</span>' : ((RES[l.id] || []).map(x => resLabel(x)).join(" ") || '<span class="dim" style="font-size:11.5px">—</span>')}</td>` : ""}
      <td class="num">${price(l.list_price)}</td>
      <td class="num">${ed && !l.free_reason ? `<input class="qin" type="number" step="any" min="0" max="100" value="${esc(l.discount_pct ?? "")}" data-prev="${esc(l.discount_pct ?? "")}" data-line="${l.id}" data-f="discount_pct" title="Type a discount to set it by hand · empty it to go back to the system discount">` : (l.discount_pct === null || l.discount_pct === undefined ? '<span class="dim">—</span>' : esc(Number(l.discount_pct)) + "%")}</td>
      <td class="num">${ed && !l.free_reason ? `<input class="qin" type="number" step="any" min="0" value="${esc(l.unit_price ?? "")}" data-prev="${esc(l.unit_price ?? "")}" data-line="${l.id}" data-f="unit_price" title="Type a price to override">` : price(l.unit_price)}</td>
      ${showNet ? `<td class="num">${l.unit_price === null || l.unit_price === undefined ? '<span class="dim">—</span>' : price(netOf(l.unit_price))}</td>` : ""}
      <td>${l.free_reason ? '<span class="dim" title="A free line cannot carry a surcharge">—</span>'
        : (scText(l, t.basis) || (ed ? "" : '<span class="dim">—</span>')) + (ed ? `<button class="xbtn" data-sc="${l.id}" title="Set or change this line's surcharge">${l.surcharge_label ? "✎" : "+"}</button>` : "")}</td>
      <td class="num">${money(t.basis === "shipped" ? l.shipped_total : l.total)}</td>
      <td>${src} ${flags}</td>
      ${ed ? `<td style="white-space:nowrap">${manual ? `<button class="xbtn" data-reset="${l.id}" data-sku="${esc(l.sku)}" title="Back to the system price">↺</button> ` : ""}<button class="xbtn" data-del="${l.id}" data-sku="${esc(l.sku)}" title="Remove line">&#10005;</button></td>` : ""}
    </tr>`;
  });
  const charges = (data.charges || []).map(c => `<tr>
      <td>${esc(c.name)}${c.description ? `<div class="dim" style="font-size:11.5px">${esc(c.description)}</div>` : ""}</td>
      <td class="num">${money(c.amount)}</td>
      <td class="dim" style="font-size:11.5px">${esc(c.tax_rule || "")}</td>
      ${ed ? `<td style="white-space:nowrap"><button class="xbtn" data-cedit="${c.id}" title="Edit">✎</button> <button class="xbtn" data-cdel="${c.id}" data-cname="${esc(c.name)}" title="Remove">&#10005;</button></td>` : ""}
    </tr>`);

  /* 구역 제목 색(판정 156 · 167 · lay-3) — 제목 → ims-ui.css 「구역 제목 띠」의 data-sec · 모르는 제목은 회색 띠 */
  const SEC = { "Lines":"lines", "Discounts":"discounts", "Receipts":"receipts", "Invoices":"invoices", "Invoice":"invoices",
                "Credits":"credits", "Charges":"charges", "Payments":"payments", "Order family":"family", "Customer balance":"balance" };
  const tbl = (title, n, head, rows, sub) => `
    <div class="card">
      <h3 class="ims-sec" data-sec="${SEC[title] || ""}">${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(x => `<th${x[1] ? ' class="' + x[1] + '"' : ""}>${x[0]}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>${sub ? `<div class="sosub">${sub}</div>` : ""}` : '<div class="msg">None.</div>'}
    </div>`;

  /* 인보이스 — 살아 있는 것 하나 + 취소된 이력 */
  /* ⚠️ invoice = 살아 있는 한 장(칸이 많다) · invoice_history = 번호·상태·발행일·취소 시각만 */
  const invRows = [];
  if(inv && inv.invoice_number) invRows.push(`<tr><td><a class="lnk mono" href="so-invoices.html?inv=${encodeURIComponent(inv.invoice_number)}" title="Open on Sales Invoices">${esc(inv.invoice_number)}</a></td><td>${stChip(inv.status)}</td><td>${dim(inv.issued_on)}</td><td>${dim(inv.due_on)}</td>
      <td class="num">${money(inv.total)}</td><td class="num">${money(inv.amount_due)}</td><td class="num">${money(inv.paid)}</td>
      <td class="num">${Number(inv.remaining) > 0 ? `<span class="neutral">${money(inv.remaining)}</span>` : money(inv.remaining)}</td></tr>`);
  (data.invoice_history || []).filter(h => !inv || h.invoice_number !== inv.invoice_number).forEach(h =>
    invRows.push(`<tr><td><a class="lnk mono" href="so-invoices.html?inv=${encodeURIComponent(h.invoice_number)}">${esc(h.invoice_number)}</a></td><td>${stChip(h.status)}</td><td>${dim(h.issued_on)}</td>
      <td class="dim" colspan="5">${h.cancelled_at ? "cancelled " + imsTs(h.cancelled_at) : ""}</td></tr>`));

  /* 뭉치 — 형제(갈라진 것) · 합쳐진 곳 */
  const famHtml = famRows.length > 1 || s.merged_into_id ? famRows.map(r => `
      <tr><td>${"&nbsp;&nbsp;".repeat(Number(r.depth) || 0)}${r.is_self ? `<b class="mono">${esc(r.so_number)}</b>` : `<a class="lnk mono" data-goto="${esc(r.so_number)}" data-gid="${r.so_id}">${esc(r.so_number)}</a>`}</td>
        <td>${stChip(r.status)}</td><td class="dim">${esc(r.split_reason || "")}</td>
        <td class="num">${qty(r.open_qty)}</td>
        <td>${r.merged_into_id ? `merged into <a class="lnk mono" data-goto="${esc(mergedNo[r.merged_into_id] || "")}" data-gid="${r.merged_into_id}">${esc(mergedNo[r.merged_into_id] || "?")}</a>` : ""}</td></tr>`) : [];

  /* 손님 잔액 — so_customer_balance 한 곳의 값(통화별) */
  const balRows = Array.isArray(data.customer_balance) ? data.customer_balance : (data.customer_balance ? [data.customer_balance] : []);
  const balHtml = balRows.map(b => `<tr><td class="mono">${esc(b.currency_code || "")}</td><td class="num">${money(b.received)}</td><td class="num">${money(b.owed_credit)}</td><td class="num">${money(b.reserved_deposit)}</td><td class="num">${money(b.available)}</td><td class="num">${money(b.open_invoices_due)}</td></tr>`);

  if(seq !== detailSeq) return;
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="sobar"><span class="pn">${esc(s.so_number)}</span><span class="chips">${chips.join("")}</span></div>
        ${s.split_from_id ? `<div style="margin-top:8px;font-size:12.5px">${famRows.filter(r => r.so_id === s.split_from_id).map(r => `<a class="lnk" data-goto="${esc(r.so_number)}" data-gid="${r.so_id}">← split from ${esc(r.so_number)}</a>`).join("")}</div>` : ""}
        ${s.merged_into_id ? `<div style="margin-top:8px;font-size:12.5px"><a class="lnk" data-goto="${esc(mergedNo[s.merged_into_id] || "")}" data-gid="${s.merged_into_id}">merged into ${esc(mergedNo[s.merged_into_id] || "")} →</a></div>` : ""}
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>
      </div>
      ${(data.warnings || []).length ? `<div class="sowarn">${warnChips((data.warnings || []).map(w => w === "reprice_suggested" && s.reprice_suggested_at ? "reprice_suggested:since " + imsTs(s.reprice_suggested_at) : w))}</div>` : ""}
      ${HINT && ((HINT.lines || []).length + (HINT.combined || []).length) ? `<div class="sosub">Merged draft — today's quote would be better for: ${(HINT.lines || []).map(r => `line ${esc(r.line_no)} ${esc(r.sku)} ${price(r.unit_price)} → ${price(r.quote_unit_price)}`).concat(
        (HINT.combined || []).map(r => `${esc(r.sku)} as one line of ${qty(r.qty)} → ${price(r.quote_unit_price)}`)).join(" · ")}. Lines kept their merged prices — change one by hand if you want the new price.</div>` : ""}
      ${stats}
      <div class="sogrid">${kvTbl(kvL)}${kvTbl(kvR)}</div>
    </div>

    ${tbl("Lines", (data.lines || []).filter(l => !l.combo_line_id).length,
      (ed ? [['<input type="checkbox" id="scAll" title="Pick every line that can carry a surcharge">', ""]] : []).concat([["#","num"],["Product",""],["Qty","num"]]).concat(shownQty ? [["Qty out","num"],["Stock",""]] : [])
        .concat([["List","num"],["Disc %","num"],["Unit","num"]]).concat(showNet ? [[`<span title="Unit after the ${esc(odp)}% order discount — for reading; the order discount is taken once off the lines total">Net unit</span>`,"num"]] : [])
        .concat([["Surcharge",""],["Total","num"],["Price from",""]]).concat(ed ? [["",""]] : []),
      lines,
      `Totals use ${basisNote}. Each line's tax is rounded on its own and added up (as Cin7 does).` +
      (ed ? " Edit quantity, discount or unit price in the cell — a price you type overrides the system price; ↺ puts it back. Surcharge: + on a line, or tick lines and press Set surcharge… to give them all the same one." : "") +
      (ordL.some(l => l.combo_line_id) ? " A combo is changed or removed on its combo line — the component lines under it follow and carry the stock; a short component backorders the whole combo." : "") +
      (ed ? " Available is a snapshot of this warehouse; lines are not netted against each other — Confirm does that." : "") +
      (Number(t.surcharge_amount) ? " The surcharge is charged per unit, is not part of the order discount and shows as its own line on the invoice." : "") +
      (showNet ? ` Disc % is the line discount only; Net unit shows the unit after the ${esc(odp)}% order discount, which is taken once off the lines total.` : ""))}

    ${tbl("Charges", (data.charges || []).length, [["Charge",""],["Amount","num"],["Tax rule",""]].concat(ed ? [["",""]] : []), charges,
      "Freight and similar. Tax follows the order's rule.")}

    ${invRows.length ? tbl("Invoice", invRows.length, [["Number",""],["Status",""],["Issued",""],["Due",""],["Total","num"],["Due at issue","num"],["Paid","num"],["Still owed","num"]], invRows,
      "The invoice fixes the amounts. Open the number for payments, credits and history on Sales Invoices.") : ""}

    ${famHtml.length ? tbl("Order family", famRows.length, [["Order",""],["Status",""],["Split reason",""],["Open qty","num"],["",""]], famHtml,
      "Split-off orders (backorder · preorder · pick short) and where a merged order went.") : ""}

    ${balHtml.length ? tbl("Customer balance", balHtml.length, [["Currency",""],["Money on account","num"],["Credit owed","num"],["Held for orders","num"],["Available","num"],["Open invoices due","num"]], balHtml,
      "Available = money on account + credit owed − deposits held for open orders. It is used automatically when an invoice is issued.") : ""}
  `;
  thumbFill(box);   // 판정 208 — 이 오더의 SKU 를 한 번에(기다리지 않는다)

  box.querySelectorAll("[data-goto]").forEach(a => { a.onclick = () => gotoSo(a.dataset.goto, a.dataset.gid || null); });
  box.querySelectorAll("[data-head]").forEach(el => { el.onchange = () => { if(el.value !== el.dataset.prev) saveHead(el); }; });
  box.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if(a === "toglist"){ const lp = document.getElementById("listPanel"); lp.hidden = !lp.hidden; }
      if(a === "wide")      showWide();
      if(a === "addline")   openAddLine();
      if(a === "paste")     openPaste();
      if(a === "addcharge") openCharge(null);
      if(a === "surcharge") openSurcharge(null);
      if(a === "shipto")    openShipTo();
      if(a === "reprice")   repriceSo();
      if(a === "confirm")   openConfirm();
      if(a === "confirmc")  confirmCounter();
      if(a === "delete")    deleteSo();
      if(a === "ship")      openShip();
      if(a === "finalize")  openFinalize();
      if(a === "reopenc")   reopenCounter();
      if(a === "unconfirm") unconfirmSo();
      if(a === "cancel")    openCancel();
      if(a === "pay")       openPayment();
      if(a === "hold")      holdSo();
      if(a === "unhold")    releaseHold();
      if(a === "divide")    openDivide();
      if(a === "changewh")  openChangeWh();
      if(a === "proceed")   proceedBo();
      if(a === "merge")     openMerge();
      if(a === "release")   releaseSo();
      if(a === "recall")    recallSo();
      if(a === "cpapply")   applyCoupon();    // so v5a
      if(a === "cpremove")  removeCoupon();   // so v5a
    };
  });
  if(ed){
    box.querySelectorAll("input[data-line]").forEach(inp => { inp.onchange = () => saveLine(inp); });
    box.querySelectorAll("[data-del]").forEach(b => { b.onclick = () => removeLine(b.dataset.del, b.dataset.sku); });
    box.querySelectorAll("[data-reset]").forEach(b => { b.onclick = () => resetLine(b.dataset.reset, b.dataset.sku); });
    box.querySelectorAll("[data-sc]").forEach(b => { b.onclick = () => openSurcharge(b.dataset.sc); });   // surcharge-3
    { const all = document.getElementById("scAll"); if(all) all.onchange = () => box.querySelectorAll("[data-scpick]").forEach(c => { c.checked = all.checked; }); }
    box.querySelectorAll("[data-cedit]").forEach(b => { b.onclick = () => openCharge((data.charges || []).find(c => c.id === b.dataset.cedit)); });
    box.querySelectorAll("[data-cdel]").forEach(b => { b.onclick = () => removeCharge(b.dataset.cdel, b.dataset.cname); });
    { const cc = document.getElementById("cpCode"); if(cc) cc.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); applyCoupon(); } }; }   // so v5a — Enter = Apply
  }
}

/* ── 시작 ─────────────────────────────────────────── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; rank = RANK[me.role] || 0;
  window.sb = sb;
  imsHeader(me);
  document.getElementById("buildTag").textContent = SO_BUILD;

  document.getElementById("newSo").onclick = openNewSo;
  document.getElementById("wnew").onclick  = openNewSo;
  document.getElementById("backWide").onclick = showWide;

  /* 고를 목록 — 전부 작은 표(캡 아래) · 한 번 읽어 둔다
     ⚠️ 결제 계좌 후보 = 활성 BANK 또는 _5_(for_payments 를 믿지 마라 · §18-b ①) */
  const [wh, tm, tr, tx, ac] = await Promise.all([
    sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name"),
    sb.from("ref_payment_term").select("id,name").eq("is_active", true).order("name"),
    sb.from("ref_price_tier").select("name,code").eq("purpose", "sale").eq("is_active", true).order("code"),
    sb.from("ref_tax_rule").select("name,rate_pct").eq("is_active", true).eq("direction", "sale").order("name"),
    sb.from("ref_account").select("id,code,name,account_type").eq("is_active", true).order("code"),
  ]);
  WHS = wh.data || []; TERMS = tm.data || []; TIERS = tr.data || []; TAXES = tx.data || [];
  ACCTS = (ac.data || []).filter(a => a.account_type === "BANK" || a.code === "_5_");
  [wh, tm, tr, tx, ac].forEach(r => { if(r.error) console.warn("list load failed:", r.error.message); });

  const refilter = () => { pg.reset(); pgW.reset(); loadWide(); };
  document.getElementById("wch").onchange  = e => { chFilter = e.target.value; refilter(); };
  document.getElementById("wfrom").onchange = e => { dateFrom = e.target.value; refilter(); };
  document.getElementById("wto").onchange   = e => { dateTo = e.target.value; refilter(); };
  document.getElementById("wst").onchange   = e => { stFilter = e.target.value; document.getElementById("st").value = stFilter; refilter(); };
  imsQ("#wq", v => { q = v; document.getElementById("q").value = v; refilter(); });
  document.getElementById("wclear").onclick = () => {
    q = ""; chFilter = ""; dateFrom = ""; dateTo = ""; stFilter = "open";
    ["wq","wch","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wst").value = "open"; document.getElementById("q").value = ""; document.getElementById("st").value = "open";
    refilter();
  };
  document.getElementById("st").onchange = e => { stFilter = e.target.value; document.getElementById("wst").value = stFilter; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; document.getElementById("wq").value = v; pg.reset(); clearDetail(); loadList(); });

  /* ?so=SO-25001a 로 들어오면 그 오더를 연다 */
  const want = imsParam("so");
  if(want){ await gotoSo(want, null); return; }
  showWide();
});
</script>
