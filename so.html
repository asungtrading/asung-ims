<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Orders · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css · 뼈대는 po.html(목록/상세 두 모드 · 모달)
     ⚠️ 이름은 공통과 겹치지 않게 so 접두 · .list .row 계열은 po.html 과 같은 모양(지역 규칙 — 세 번째가 나오면 공통으로) */
  .binlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px - var(--ims-tabs-h, 0px))}
  .list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .list .row .l{min-width:0}
  .list .row .pn{font-family:var(--mono);font-size:13px}
  .list .row .sn{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .r{text-align:right;white-space:nowrap}
  .list .row.cur .pn{color:#3b5bdb;font-weight:700}
  /* so v5h — 판정 359: 단계별 채운 색(「지금 누구 차례인가」) · 글자는 흰색 */
  .sost{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.5;color:#fff;white-space:nowrap}
  .sost.s-draft{background:#868e96}
  .sost.s-confirmed{background:#3b5bdb}
  .sost.s-at_wms,.sost.s-picking{background:#7048e8}
  .sost.s-packed{background:#e8590c}
  .sost.s-shipped{background:#d9480f}   /* so v5k — 인보이스 취소 뒤에만 · 사무실이 다시 발행할 차례 */
  .sost.s-fulfilled{background:#2f9e44}
  .sost.s-cancelled{background:#e03131}
  .tag.paid{color:var(--good);border-color:#cfe9d7}   /* so v5i — 결제 태그 */
  .tag.pickw{color:#b35c00;border-color:#f3d19e}   /* so v5s — 판정 455 waiting for pickup */
  /* so v5u1 — 줄 표가 카드보다 넓어져 오른쪽이 잘렸다(딜 이름 꼬리표 · Caleb SO-25138a) */
  .tblx{overflow-x:auto;max-width:100%}
  .pfrom{max-width:240px;white-space:normal}
  .pfrom .tag.dealn{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  main{display:flex;flex-direction:column;gap:14px}
  .sobar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sobar .pn{font-family:var(--mono);font-size:20px;font-weight:700}
  .sogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:900px){ .sogrid{grid-template-columns:1fr} }
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .sowarn{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
  .pomodal[hidden]{display:none}
  .pobox textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12.5px}
  .pobox input[type=search],.pobox input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:300px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .pick .prow.on2{background:#eef4ff}
  .sofield{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sobig{font-family:var(--mono);font-size:16px;font-weight:700}
  .socols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .socols .stat b{font-size:15px}
  /* 줄 사진 — 판정 208 · 213 · 칸 모양은 ims-ui.css 의 .ims-thumb(thumb-1) */
  .lnth{display:flex;gap:8px;align-items:flex-start}
  /* so v4a · asm-3b1 — 콤보 줄 아래 구성품 줄(묶음 2 · 3) */
  tr.comp td{background:#fafbfd;border-top-color:#f0f2f6}
  tr.comp .cin{padding-left:22px;position:relative}
  tr.comp .cin::before{content:"↳";position:absolute;left:4px;top:0;color:var(--muted)}
  .avl{font-size:11px;margin-top:2px;white-space:nowrap}
  /* surcharge-3 — 줄의 관세 부가 요금 칸(판정 227 · 묶음 1) */
  .scc{font-size:12px;line-height:1.35;white-space:nowrap}
  .scc .u{color:var(--muted);font-size:11.5px}
  /* so v5t — 화면 안 A: 웹 오더(Shopify) 칸 · 경고 확인함(판정 467 · Web Orders wo v3 와 같은 모양) */
  .webbox{padding:4px 14px 12px}
  .webbox .wact{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .wwarn{border:1px solid #fedf89;background:#fffaeb;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:12.5px}
  .wwarn.done{border-color:#abefc6;background:#ecfdf3}
  .wwarn.checked{border-color:var(--line);background:#f7f8fa;color:#667085}
  .wwarn .wstate{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px}
  .wwarn .wstate .pobtn{padding:2px 9px;font-size:11.5px}
  .pobox textarea.acknote{min-height:70px;font-family:inherit;font-size:13px}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <select id="wch" title="Channel">
        <option value="">All channels</option>
        <option value="warehouse">Warehouse</option>
        <option value="counter">Counter</option>
        <option value="service">Service</option>
        <option value="pos">POS</option>
        <option value="web">Shopify (web)</option>
      </select>
      <select id="wloc" title="Branch"><option value="">All branches</option></select>
      <input type="date" id="wfrom" title="Order date from">
      <span class="dash">—</span>
      <input type="date" id="wto" title="Order date to">
      <select id="wpay" title="Payment (from the order's invoice)">
        <option value="">Any payment</option><option value="unpaid">Unpaid</option><option value="partial">Partly paid</option><option value="overdue">Overdue</option><option value="paid">Paid</option>
      </select>
      <select id="wst">
        <option value="open">Open</option>
        <option value="draft">Draft</option>
        <option value="reprice">Draft — reprice suggested</option>
        <option value="confirmed">Confirmed</option>
        <option value="warehouse">With warehouse</option>
        <option value="packed">Finalized — waiting for the office</option>
        <option value="fulfilled">Fulfilled</option>
        <option value="pickup">Waiting for pickup</option>
        <option value="cancelled">Cancelled</option>
        <option value="all">All</option>
      </select>
      <input type="search" id="wq" placeholder="SO number · invoice number · customer · reference">
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn" id="wcsv" title="Download every order that matches these filters as a spreadsheet (CSV)">↓ CSV</button>
      <button class="pobtn go" id="wnew">+ New sales order</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <div style="display:flex;gap:6px">
        <button class="pobtn" id="backWide" style="flex:1">‹ All orders</button>
        <button class="pobtn go" id="newSo" style="flex:1">+ New</button>
      </div>
      <input type="search" id="q" placeholder="Search SO · invoice number · customer · reference">
      <div class="opts">
        <label>Status
          <select id="st">
            <option value="open">Open</option>
            <option value="draft">Draft</option>
            <option value="reprice">Draft — reprice suggested</option>
            <option value="confirmed">Confirmed</option>
            <option value="warehouse">With warehouse</option>
            <option value="packed">Finalized — waiting for the office</option>
            <option value="fulfilled">Fulfilled</option>
        <option value="pickup">Waiting for pickup</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a sales order.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script src="ims-doc.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Sales Orders — SO 오피스 화면 1판 (2026-09-25 · 대화 Claude)
   정본: asung-wms docs/design/so-module.md §12~§21 · 뼈대 po.html
   ⭐ 담은 것: 목록 · 새 오더 · 머리 · 줄 · 운임 · 합계 · 확정(창고 길 미리 보기) · counter 확정·출고 · 결제 넣기 · 뭉치
   ⭐ 미룬 것(단추 자리만): 보류 · 나누기 · 창고 바꾸기 · 백오더 진행 · Release to WMS · 오피스 마무리 · 병합 · 인쇄 · POS
   ⚠️⚠️ 계산 규칙의 정본은 DB 다 — 가격 · 할인 · 세금 · 합계 · 잔액을 화면에서 다시 짜지 마라.
      so_detail · so_tax_preview · so_counter_ship(미리 보기) 가 돌려준 값을 그리기만 한다.
   ⚠️ 쓰기는 전부 창구(RPC)다 — SO 표는 select 만 열려 있다. 오류 문장은 DB 가 「… nothing was saved」로 준다 — 그대로 보인다.
   ⚠️ 화면 글자는 영어 · 날짜 기본값은 torontoToday() · 시각은 imsTs(토론토)
   ───────────────────────────────────────────────────────────── */

function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let qInvIds = [];
async function loadQInv(){
  qInvIds = [];

const NO_ID = "00000000-0000-0000-0000-000000000000";
async function loadPayIds(){
  payIds = null;
  if(!payFilter) return;
  const { data, error } = await sb.from("so_invoice_list").select("so_ids,total,remaining,days_overdue").eq("is_open", true);
  if(error){ console.warn("payment filter:", error.message); payIds = [NO_ID]; return; }
  const pick = new Set();
  (data || []).forEach(v => {
    const part = Number(v.remaining) < Number(v.total) - 0.004, late = Number(v.days_overdue) > 0;
    const hit = payFilter === "unpaid" ? !part : payFilter === "partial" ? part : payFilter === "overdue" ? late : true;   // paid 는 「열린 것 전부」를 뺀다
    if(hit) (v.so_ids || []).forEach(id => pick.add(id));

function baseQuery(){
  let qry = sb.from("so").select(
    "id,so_number,status,closed_reason,closed_at,created_at,channel,intake,order_date,ref,location_name,currency_code,split_from_id,merged_into_id,bill_to_name,reprice_suggested_at,customer:customer_id(name),shipped_at,picked_up_at,carrier:carrier_id" + (stFilter === "pickup" ? "!inner" : "") + "(kind,name)",   // so v5s — !inner 는 「Waiting for pickup」 거르기에서만(그 밖엔 운송사 없는 오더가 사라진다)
    { count: "exact" });
  if(stFilter === "open")           qry = qry.in("status", ["draft","confirmed","at_wms","picking","packed","shipped"]);
  else if(stFilter === "warehouse") qry = qry.in("status", ["at_wms","picking","packed"]);
  else if(stFilter === "reprice")   qry = qry.eq("status", "draft").not("reprice_suggested_at", "is", null);   // so v5b — 깃발은 초안에만(판정 349)
  else if(stFilter === "pickup")    qry = qry.eq("carrier.kind", "pickup").eq("channel", "warehouse").not("shipped_at", "is", null).is("picked_up_at", null);   // so v5s — 판정 455
  else if(stFilter !== "all")       qry = qry.eq("status", stFilter);
  if(chFilter === "web") qry = qry.eq("intake", "shopify");   // so v5r — 판정 435: 웹 오더 = 들어온 길 shopify(채널은 Warehouse)
  else if(chFilter) qry = qry.eq("channel", chFilter);
  if(locFilter) qry = qry.eq("location_id", locFilter);   // so v5h — 브랜치
  if(payFilter && payIds){   // so v5l
    if(payFilter === "paid") { qry = qry.eq("status", "fulfilled"); if(payIds.length) qry = qry.not("id", "in", `(${payIds.join(",")})`); }
    else qry = qry.in("id", payIds.length ? payIds : [NO_ID]);
  }
  if(dateFrom) qry = qry.gte("order_date", dateFrom);
  if(dateTo)   qry = qry.lte("order_date", dateTo);
  /* ⚠️ 검색은 서버에서 · 손님 이름은 bill_to_name(오더에 굳은 청구처 이름)과 ship_to_company 로 찾는다
     — 조인 칸은 or() 안에 못 넣는다(po.html 2026-09-20 실사고) */
  if(q){ const t = orTerm(q); qry = qry.or(`so_number.ilike.%${t}%,ref.ilike.%${t}%,bill_to_name.ilike.%${t}%,ship_to_company.ilike.%${t}%` + (qInvIds.length ? `,id.in.(${qInvIds.join(",")})` : "")); }   // so v5m
  return qry.order("so_number", { ascending: false });
}
/* so v5n — timestamptz → 토론토 날짜(YYYY-MM-DD) */

const LEAD_WARN_D = 3;
function leadTag(from, to){
  const a = new Date(from), b = new Date(to); if(isNaN(a) || isNaN(b) || b < a) return "";
  const day = (x) => Date.parse(x.toLocaleDateString("sv-SE", { timeZone: "America/Toronto" }) + "T00:00:00Z");
  const d = Math.round((day(b) - day(a)) / 86400000);
  const txt = d === 0 ? "same day" : `${d}d`;
  const col = d === 0 ? "var(--good)" : d <= LEAD_WARN_D ? "var(--warn)" : "var(--bad)";
  return ` <span style="color:${col};font-size:11px;font-weight:600" title="Order made ${esc(imsTs(from).replace(/<[^>]+>/g, ""))} → fulfilled ${esc(imsTs(to).replace(/<[^>]+>/g, ""))}">${txt}</span>`;
}

/* so v5i — 결제 태그: 이 쪽 오더가 든 살아 있는 인보이스(so_invoice_list · so_ids 겹침) · 판정(남은 돈 · 연체 일수)은 뷰가 한다 · 화면은 글자만 고른다 */
async function fillPay(ids, scope){
  if(!ids.length) return;
  const { data, error } = await sb.from("so_invoice_list").select("id,invoice_number,status,total,remaining,days_overdue,so_ids").overlaps("so_ids", ids).neq("status", "cancelled");
  if(error){ console.warn("payment tags:", error.message); return; }
  const by = {};
  (data || []).forEach(v => (v.so_ids || []).forEach(id => { (by[id] = by[id] || []).push(v); }));
  scope.querySelectorAll("[data-inv]").forEach(el => {   // so v5m — 인보이스 번호(살아 있는 것)
    const vs = by[el.dataset.inv] || [];
    el.innerHTML = vs.map(v => `<a class="lnk" href="so-invoices.html?inv=${encodeURIComponent(v.invoice_number)}" onclick="event.stopPropagation()" title="Open on Sales Invoices">${esc(v.invoice_number)}</a>`).join(", ");
  });
  scope.querySelectorAll("[data-pay]").forEach(el => {
    const vs = by[el.dataset.pay]; if(!vs || !vs.length){ el.innerHTML = ""; return; }
    const rem = vs.reduce((a, v) => a + Number(v.remaining || 0), 0), tot = vs.reduce((a, v) => a + Number(v.total || 0), 0);
    const late = Math.max(...vs.map(v => Number(v.days_overdue || 0)));
    const nums = vs.map(v => v.invoice_number).join(", ");
    el.innerHTML = " " + (rem <= 0.004 ? `<span class="tag paid" title="Invoice ${esc(nums)} — paid">paid</span>`
      : late > 0 ? `<span class="tag off" title="Invoice ${esc(nums)} — ${money(rem)} still owed">overdue ${esc(late)}d</span>`
      : rem < tot - 0.004 ? `<span class="tag disc" title="Invoice ${esc(nums)} — ${money(rem)} still owed">partly paid</span>`
      : `<span class="tag" title="Invoice ${esc(nums)} — ${money(rem)} still owed">unpaid</span>`);
  });
}

function webPaidCell(w){
  const fs = String(w.financial_status || "").toUpperCase();
  if(w.paid_push_at && fs === "PAID") return `<span class="on">Marked paid by IMS</span> <span class="dim">${esc(imsTs(w.paid_push_at))}</span>`;
  if(fs === "PAID" && (w.warnings || []).some(x => x && x.code === "card_payment_recorded")) return '<span class="on">Card captured in Shopify</span> <span class="dim">— recorded in IMS automatically (see the payment on this order)</span>';   // so v5t6 — 판정 470
  if(fs === "PAID") return 'Paid <span class="dim">— not marked by IMS (paid online at checkout, or marked in Shopify — see warnings)</span>';
  if(fs === "AUTHORIZED") return '<span class="dim">Card authorized in Shopify — IMS does not mark it paid (that would charge the card)</span>';
  if(/REFUNDED|VOIDED/.test(fs)) return `<span class="dim">${esc(WEB_PAY[fs] || fs)} — IMS does not mark it paid</span>`;
  const st = w.paid_state;
  if(!st) return '<span class="dim">—</span>';
  if(st.ready) return '<span class="tag">ready</span> <span class="dim">IMS has been paid in full — Shopify is marked paid within about 15 minutes</span>';
  const why = [];
  (st.open_sos || []).forEach(n => why.push(`${esc(n)} is still open`));
  (st.invoices || []).filter(v => Number(v.remaining) > 0).forEach(v => why.push(`invoice ${esc(v.invoice_number)} owes ${money(v.remaining)}`));
  if(!(st.invoices || []).length) why.push("not invoiced yet");
  return `<span class="dim">Not yet — IMS marks Shopify paid when every order of this web order is closed and fully paid${why.length ? ": " + why.join(" · ") : ""}</span>`;
}
function webWarnHtml(w, i, soId, canAck){   // i = 배열 자리(0 부터) · 창구는 1 부터
  const lbl = WEB_WARN[w.code] || w.code;
  let extra = "";
  if(w.code === "discount_mismatch") extra = ` — ${esc(w.sku || "")}: Shopify ${esc(String(w.shopify_pct ?? ""))} % · IMS ${esc(String(w.ims_pct ?? ""))} %`;
  else if(w.code === "tax_mismatch") extra = ` — IMS ${money(w.ims)} · Shopify ${money(w.shopify)}`;
  const settled = !!w.settled_at, checked = !settled && !!w.acked_at;
  const done = settled || w.code === "auto_cancelled" || w.code === "lines_resolved";
  let state = "";
  if(settled) state = `<span class="on">Settled automatically</span> <span class="dim">${esc(imsTs(w.settled_at))}${Array.isArray(w.settled_refunds) && w.settled_refunds.length ? " · by the refund in Shopify" : ""}</span>`;

  else if(canAck && !done) state = `<button class="pobtn" data-wack="${i + 1}" data-wso="${esc(soId)}">Mark checked</button>`;
  return `<div class="wwarn ${done ? "done" : checked ? "checked" : ""}" title="${esc(w.code)}"><b>${esc(lbl)}</b>${extra}${w.message && !extra ? `<div class="dim" style="font-size:11.5px;margin-top:2px">${esc(w.message)}</div>` : ""}${w.at ? ` <span class="dim" style="font-size:11px">${esc(imsTs(w.at))}</span>` : ""}${state ? `<div class="wstate">${state}</div>` : ""}</div>`;

  modalOpen(`<h4>${ack ? "Mark checked" : "Reopen"} — web order ${esc(w.name || "")}</h4>

      ${ack ? `<label class="dim" style="font-size:12px" for="ackNote">${needNote ? "Why is the refund not being made in Shopify? (required)" : "Note (optional)"}</label>
      <textarea class="acknote" id="ackNote" autocomplete="off" placeholder="${needNote ? "e.g. customer agreed to store credit instead" : "What was done about it"}"></textarea>` : `<div class="dim" style="font-size:12.5px">The warning goes back to open and counts again.</div>`}

    const go = document.getElementById("ackGo"); go.disabled = true;
    const { error } = await sb.rpc("shop_order_warning_ack", { p_shop_order_id: w.id, p_ord: ord, p_code: x.code, p_at: x.at || null, p_ack: ack, p_note: note || null });

  };
}

async function fillTotals(ids, scope){
  if(!ids.length) return;
  const { data, error } = await sb.rpc("so_totals_many", { p_so_ids: ids });
  const by = {}; (data || []).forEach(t => { by[t.so_id] = t; });
  scope.querySelectorAll("[data-tot]").forEach(el => {
    const t = by[el.dataset.tot];
    if(error){ el.innerHTML = '<span class="dim" title="' + esc(error.message).replace(/"/g, "&quot;") + '">—</span>'; return; }
    if(!t){ el.innerHTML = ""; return; }
    el.innerHTML = (t.order_total_with_tax === null || t.order_total_with_tax === undefined)
      ? `<span class="dim" title="Before tax ${esc(Number(t.order_total).toFixed(2))} — no tax rule yet">no tax rule</span>`
      : `<span title="${t.basis === "shipped" ? "Shipped quantities" : "Ordered quantities"} · tax included">${money(t.order_total_with_tax)}</span>`;
  });
}

  ]);
  const err = a.error || b.error || c.error;

  const seen = new Set(), rows = [];

  };
  box.innerHTML = rows.map(p => `<div class="prow" data-pid="${p.id}" data-sku="${esc(p.sku)}" data-name="${esc(p.name || "")}" data-av="${esc(avTxt(p))}"><div class="lnth">${thumbOf(p.sku)}<div>
      <span class="mono">${esc(p.sku)}</span>${p.barcode ? ` <span class="dim" style="font-size:11.5px">barcode ${esc(p.barcode)}</span>` : ""}${avTxt(p)}

function staleAdd(){

async function runAdd(commit){

  if(free.some(r => r.free === "other" && !String(r.note || "").trim())){ say("alMsg", "err", "A free line with reason other needs a note."); return; }
  let res = null;
  if(priced.length){

    document.getElementById("alOut").innerHTML = `<div class="msg dim">${free.length} free line(s) will be added at 0.</div>`;

/* so v5u — ln-1 판정 532 · 545: 셋째 칸 = 가격(선택)
   ⭐ 가격은 탭이나 쉼표로 나뉜 줄에서만 읽는다(칸 위치로) — 빈칸만으로 나뉜 줄은 지금처럼 「SKU … 수량」 두 칸(SKU 안 빈칸과 헷갈리지 않게)
   ⭐ 탭 줄은 칸 안의 천 단위 쉼표 · $ 를 지운다(스프레드시트 서식) · 쉼표 줄은 쉼표가 칸 나누기라 천 단위 쉼표를 쓸 수 없다(안내 글)
   ⭐ 가격 칸이 비면 price 열쇠를 안 보낸다 = 원래 가격 · 값의 판정(숫자 · 0 · 음수)은 창구가 한다 */
function parsePaste(text){
  const num = (v) => String(v === undefined || v === null ? "" : v).replace(/[$,\s]/g, "");
  return text.split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim()).map(l => {
    const sep = l.includes("\t") ? "\t" : (l.includes(",") ? "," : null);
    if(sep){
      const p = l.split(sep).map(x => x.trim());
      const row = { sku: p[0] || "", qty: Number(num(p[1])) };
      const pr = sep === "\t" ? num(p[2]) : String(p[2] === undefined ? "" : p[2]).replace(/[$\s]/g, "");
      if(pr !== "") row.price = pr;
      return row;
    }
    const t = l.trim();
    const p = t.split(/\s{2,}|\s+/);
    const qv = p.length > 1 ? p[p.length - 1] : "";
    const sku = p.slice(0, Math.max(1, p.length - 1)).join(" ");
    return { sku: sku, qty: Number(String(qv).replace(/[, ]/g, "")) };
  });
}
/* so v5u — 결과의 가격 칸: 내가 준 가격(price_source paste)은 「your price」 · 거부된 가격은 넣은 글자 그대로 · 그 밖은 창구의 견적 단가 */
function pasteRowPrice(l){
  if(l.price_source === "paste") return `${price(l.unit_price)}<div class="dim" style="font-size:11px" title="The price you pasted — final, the order discount does not apply">your price</div>`;

  if(l.unit_price === undefined || l.unit_price === null) return '<span class="dim">—</span>';
  return price(l.unit_price);
}
/* ⭐ 붙여넣기와 찾아 고르기가 같은 창구 · 같은 판정 표 — keepOpen 이면 넣은 뒤 모달을 닫지 않는다(무상 줄이 뒤따른다) */

  const { data, error } = await sb.rpc("so_lines_paste", { p_so_id: curId, p_lines: rows, p_commit: commit });
  if(error){ msg.className = "err"; msg.textContent = error.message; return false; }
  const s = data.summary;
  msg.className = "";
  msg.textContent = s.too_many ? s.message
    : `${s.total} rows · ok ${s.ok}` + (s.no_price ? ` · no price ${s.no_price}` : "") + (s.merged ? ` · merged ${s.merged}` : "")
      + (s.ask ? ` · price differs ${s.ask}` : "") + (s.not_found ? ` · not found ${s.not_found}` : "")
      + (s.inactive ? ` · inactive ${s.inactive}` : "") + (s.duplicate ? ` · duplicate ${s.duplicate}` : "")
      + (s.bad_qty ? ` · bad qty ${s.bad_qty}` : "") + (s.not_sellable ? ` · not for sale ${s.not_sellable}` : "")
      + (s.converted ? ` · set → base ${s.converted}` : "")
      + (s.priced ? ` · your price ${s.priced}` : "") + (s.bad_price ? ` · bad price ${s.bad_price}` : "")
      + (s.free_price ? ` · price 0 ${s.free_price}` : "") + (s.set_price_refused ? ` · set with a price ${s.set_price_refused}` : "")   /* so v5u — ln-1 */
      + (commit ? ` · added ${s.inserted} · updated ${s.updated}` : "");
  document.getElementById(ids.out).innerHTML = `
    <table><thead><tr><th class="num">#</th><th>SKU</th><th>Product</th><th class="num">Qty</th><th class="num" title="Unit price the line gets — your price when you gave one, otherwise the usual price">Price</th><th>Verdict</th><th>Note</th></tr></thead>

      const v = VERDICT[l.verdict] || ["dim", l.verdict || ""];
      return `<tr><td class="num">${esc(l.n)}</td><td class="mono">${esc(l.input_sku)}</td><td>${dim(l.product_name)}</td>
        <td class="num">${qty(l.qty !== undefined && l.qty !== null ? l.qty : l.input_qty)}</td>
        <td class="num">${pasteRowPrice(l)}</td>
        <td><span class="${v[0]}">${esc(v[1])}</span>${l.combo ? ` <span class="tag">combo + ${esc(l.components)} components</span>` : ""}${convTag(l.converted)}</td><td class="dim" style="font-size:11.5px">${l.verdict === "not_sellable" ? "" : esc(l.message || "")}</td></tr>`;   /* so v4c1 — not_sellable 의 메시지는 판정 글과 같은 말이라 비운다(Caleb 화면 시험 SO-25042) */
    }).join("")}</tbody></table>`;
  document.getElementById(ids.go).disabled = s.too_many || (Number(s.ok) + Number(s.no_price || 0) + Number(s.merged || 0)) === 0;
  if(commit){
    document.getElementById(ids.go).disabled = true;
    if(!keepOpen){ await reloadHere(); }
  }
  return data;
}

  const fails = []; let ok = 0;
  for(const id of ids){
    say("scMsg", "", `Saving ${ok + fails.length + 1} of ${ids.length}…`);
    const { error } = await sb.rpc("so_line_update", { p_line_id: id, p_patch: patch });
    if(error){ const l = (cur.lines || []).find(x => x.id === id) || {}; fails.push(`line ${l.line_no} ${l.sku}: ${error.message}`); } else ok++;
  }
  const box = document.getElementById("scMsg");
  box.className = fails.length ? "err" : "on";
  box.innerHTML = `${clear ? "Cleared" : "Saved"} on ${ok} of ${ids.length} line(s).` + (fails.length ? `<div style="margin-top:6px">Not saved:<br>${fails.map(esc).join("<br>")}</div>` : "");
  const cl = document.querySelector('#modalBox [data-m="close"]');
  cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
}

/* ── 줄 고치기 — 표 안에서 바로(po.html 과 같은 결) ────────
   qty_ordered · unit_price(= 덮어쓰기 override) · discount_pct(= 사람 할인 manual · 비우면 시스템으로)
   ⚠️ 가격과 할인을 한 번에 못 준다(DB) · 세금 규칙은 줄에서 못 바꾼다(오더의 것) */
async function saveLine(inp){
  const prev = inp.dataset.prev, f = inp.dataset.f, lineId = inp.dataset.line;
  const raw = inp.value.trim();
  if(raw === prev) return;
  const patch = {};
  if(f === "discount_pct" && raw === "") patch[f] = null;
  else {
    const v = Number(raw);
    if(raw === "" || !isFinite(v)){ inp.value = prev; return; }
    patch[f] = v;
  }
  inp.disabled = true;
  const { data, error } = await sb.rpc("so_line_update", { p_line_id: lineId, p_patch: patch });
  inp.disabled = false;
  if(error){ inp.value = prev; alert(error.message); return; }
  if(data && (data.warnings || []).length) setTimeout(() => alert("⚠ " + data.warnings.map(warnText).join("\n⚠ ")), 30);
  await reloadHere();
}
async function resetLine(lineId, sku){
  if(!confirm(`Put ${sku} back on the system price (tier · customer discount · deals)?`)) return;
  const { error } = await sb.rpc("so_line_update", { p_line_id: lineId, p_patch: { discount_pct: null } });
  if(error){ alert(error.message); return; }
  await reloadHere();
}
async function removeLine(lineId, sku){

  const { error } = await sb.rpc("so_line_remove", { p_line_id: lineId });

  await reloadHere();
}

/* ── 운임 ─────────────────────────────────────────────
   ⚠️ 금액은 0 이상(음수는 크레딧 노트) · 세금은 오더 규칙을 따른다(줄마다 못 바꾼다 · §16 판정 9) */
/* so v5f — 운임 할인 칸(판정 356: % 또는 $ 하나) · 표시 글자 */
const chDiscKind = (c) => c && c.discount_pct !== null && c.discount_pct !== undefined ? "pct" : (c && c.discount_amount !== null && c.discount_amount !== undefined ? "amt" : "");
const chDiscVal  = (c) => chDiscKind(c) === "pct" ? String(Number(c.discount_pct)) : chDiscKind(c) === "amt" ? String(Number(c.discount_amount)) : "";
const chDiscTxt  = (c) => chDiscKind(c) === "pct" ? `${esc(Number(c.discount_pct))}%` : chDiscKind(c) === "amt" ? `$${esc(Number(c.discount_amount).toFixed(2))}` : "";
const chDiscFields = (kind, val, attrs) => `<select class="sofield" ${attrs.k} style="width:90px"><option value="" ${kind === "" ? "selected" : ""}>none</option><option value="pct" ${kind === "pct" ? "selected" : ""}>%</option><option value="amt" ${kind === "amt" ? "selected" : ""}>$</option></select>
  <input class="sofield" ${attrs.v} type="number" step="0.01" min="0" value="${esc(val)}" placeholder="discount" style="width:110px">`;
/* so v5w1 — 비용 줄 계정: 켜진 REVENUE 계정 · 새 비용 = _99_(Freight Sales) · 고치기 = 그 줄의 계정(꺼진 계정이면 그 하나를 맨 위에 남긴다) */
function chAcctOptions(c){
  const cur0 = c && c.account_id, def = (REV_ACCTS.find(a => a.code === "_99_") || {}).id || "";
  const sel = cur0 || def, list = REV_ACCTS.slice();
  const extra = cur0 && !list.some(a => a.id === cur0) ? `<option value="${cur0}" selected>${esc(c.account_code || "?")} · (switched off)</option>` : "";
  return extra + (sel ? "" : '<option value="" selected>— default (_99_) —</option>')
    + list.map(a => `<option value="${a.id}" ${a.id === sel ? "selected" : ""}>${esc(a.code)} · ${esc(a.name)}</option>`).join("");
}

  document.getElementById("svS").onchange = () => { const sv = S(); if(sv) document.getElementById("svP").value = sv.unit_price; upd(); };

    const { error } = await sb.rpc("so_charge_set", args);
    if(error){ say("svMsg", "err", error.message); return; }
    modalClose(); await reloadHere();
  };
}

    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
  if(commit){
    /* so v5g — 알릴 것이 없으면 저절로 닫는다(전부 잡힘 · 나뉨 없음 · 이어받기 없음 · 경고 없음) · 있으면 결과를 남긴다 */
    const sup = data.superseded || {};
    const notable = (data.siblings || []).length || (data.warnings || []).length || (sup.lines || []).length || Number(sup.lines_closed)
      || lines.some(l => Number(l.backordered) || Number(l.preorder) || (l.kind && l.kind !== "allocated"));
    if(!notable){ modalClose(); await reloadHere(); return; }
    say("cfMsg", "on", "Confirmed — check the result above, then Close.");
    document.querySelector('#modalBox [data-m="close"]').onclick = async () => { modalClose(); await reloadHere(); };
    return;
  }
  say("cfMsg", "", "Nothing is saved until you press Confirm.");
  out.querySelectorAll("[data-pre]").forEach(cb => {
    cb.onchange = () => { if(cb.checked) cfPre.add(cb.dataset.pre); else cfPre.delete(cb.dataset.pre); runConfirm(false); };
  });
  document.getElementById("cfGo").disabled = false;
}

async function confirmCounter(){

  const { data, error } = await sb.rpc("so_pos_confirm", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  if((data.warnings || []).length) setTimeout(() => alert("⚠ " + data.warnings.map(warnText).join("\n⚠ ")), 30);
  await reloadHere();
}
async function reopenCounter(){
  if(!confirm(`Reopen ${cur.so.so_number} as a draft? Reserved stock is released.`)) return;
  const { error } = await sb.rpc("so_pos_reopen", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
}
async function unconfirmSo(){
  if(!confirm(`Unconfirm ${cur.so.so_number}? Reserved stock is released and split-off backorder/preorder orders come back into this one (supervisor).`)) return;
  const { data, error } = await sb.rpc("so_unconfirm", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
  if(data && Number(data.backorders_reopened)) setTimeout(() => alert(`${data.backorders_reopened} backorder line(s) taken over by this order were reopened.`), 30);
}
async function deleteSo(){
  if(!confirm(`Delete draft ${cur.so.so_number}? It has never been confirmed, so it disappears — the number is not reused.`)) return;
  const { error } = await sb.rpc("so_delete", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  clearDetail(); await loadList();
}

let shipPlan = null;

    <div class="socols">

      <div class="stat">Paid for this order<b>${money(est.deposit)}</b></div>
      <div class="stat">Credit / balance used<b>${money(Number(est.credit || 0) + Number(est.balance || 0))}</b></div>

function shipRow(pl, pk, first){
  return `<tr data-line="${esc(pl.line_id)}">
    <td class="num">${first ? esc(pl.line_no) : ""}</td>
    <td class="mono">${first ? esc(pl.sku) + (pl.is_set ? ` <span class="dim">×${esc(pl.pack_factor)}</span>` : "") : ""}</td>
    <td class="num">${first ? qty(pl.to_ship) : ""}</td>
    <td><input class="tin" data-sb value="${esc(pk ? pk.bin : "")}" placeholder="bin"></td>
    <td class="num"><input class="qin" type="number" step="any" min="0" data-sq value="${esc(pk ? pk.qty : "")}"></td>
    <td class="dim" style="font-size:11.5px">${esc(pk ? pk.from : "added")}</td>
    <td>${first ? `<button class="xbtn" data-addbin="${esc(pl.line_id)}" title="Take part of it from another bin">+ bin</button>` : ""}</td>
  </tr>`;
}
function wireShipRows(){
  document.querySelectorAll("[data-addbin]").forEach(b => {
    b.onclick = () => {
      const pl = (shipPlan.plan || []).find(x => x.line_id === b.dataset.addbin);
      const rows = Array.from(document.querySelectorAll(`#shRows tr[data-line="${b.dataset.addbin}"]`));
      rows[rows.length - 1].insertAdjacentHTML("afterend", shipRow(pl, null, false));
    };
  });
}
function readPicks(){
  const out = [];
  document.querySelectorAll("#shRows tr[data-line]").forEach(tr => {
    const qv = Number(tr.querySelector("[data-sq]").value);
    if(qv > 0) out.push({ line_id: tr.dataset.line, bin: tr.querySelector("[data-sb]").value.trim(), qty: qv });
  });
  return out;
}
const pickKey = (arr) => (arr || []).map(p => `${p.line_id}|${p.bin}|${Number(p.qty)}`).sort().join(";");
async function runShip(){
  const picks = readPicks();
  const same = pickKey(picks) === pickKey(shipPlan.picks);
  say("shMsg", "", "Shipping and invoicing…");
  document.getElementById("shGo").disabled = true;
  const { data, error } = await sb.rpc("so_counter_ship", { p_so_id: curId, p_picks: same ? null : picks, p_commit: true });

  document.getElementById("shOut").innerHTML = `
    <div class="socols">

      <div class="stat">Still owed<b>${money(data.remaining)}</b></div>
    </div>

  say("shMsg", "on", "Done.");
  const cl = document.querySelector('#modalBox [data-m="close"]');
  cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
}


/* ══ v3 · 오피스 판 2(2026-09-28) — 「Finalize — ship and invoice」 ══════════════════════════
   ⭐ 창고가 Finalize 한(packed) 오더를 오피스가 끝낸다: 운임 · 택배사 · 추적번호를 적고 → so_finalize 한 번 =
      출하(so_ship · 재고가 장부에서 빠진다 · 모자란 몫은 백오더 형제) + 인보이스 발행(번호) · 되돌리는 길이 없다
   ⭐ 팔렛 · 박스 치수는 so_finalize 가 안 받는다 — wms_so_handoff 를 따로 읽어 보인다(판정 19 · 운임 견적 재료 · 늘 in · lb)
   ⭐ 운임은 이 창에서만 넣는다(so_charge_set 은 초안 전용) · 픽은 보내지 않는다(so_finalize 가 handoff 의 picks 를 쓴다)
   ⭐ 미리 보기(p_commit false)는 아무것도 쓰지 않고 번호도 안 당긴다 — 실행 단추는 「지금 입력으로 본 미리 보기」 뒤에만 켜진다
   📌 줄 빼기(removed · 판정 9 어휘)는 이 판에 없다 — 손님이 안 받는 줄은 다음 판 */
let finPlan = null, finKey = null;
/* so v4b — 결과 줄(line_id 가 있는 목록)을 콤보 줄 바로 아래 구성품으로 다시 줄 세운다 · 구성품인지는 cur.lines 의 combo_line_id 로 가린다 */
function comboOrder(rows){
  const byId = {}; (cur.lines || []).forEach(l => { byId[l.id] = l; });
  const parentOf = r => (byId[r.line_id] || {}).combo_line_id || null;

        ${units.map(u => `<tr><td class="mono">${esc(u.label || "")}${u.parent_unit_id ? ' <span class="dim">(inside another unit)</span>' : ""}</td>

  }

/* 미리 보기 한 오더 몫 */

        <td class="num">${qty(l.picked != null ? l.picked : l.to_ship)}</td><td class="num">${Number(l.short) ? `<span class="bad">${qty(l.short)}</span>` : "—"}</td></tr>`).join("")}

    <div class="sohint">Ship &amp; invoice ships ${many ? "these orders" : "it"} — the stock leaves the books — and issues the invoice${invs.length === 1 ? "" : "s"}. <b>This cannot be undone here.</b> Payments already taken for an order attach themselves to its invoice.</div>

async function runFinalize(){
  const list = finInput();

  const nums = (finPlan.orders || []).map(o => o.so_number).filter(Boolean);
  if(!confirm(`Ship & invoice ${nums.join(", ") || cur.so.so_number}?\n\nThe goods ship (stock leaves the books) and the invoice${(finPlan.invoices || []).length === 1 ? " is" : "s are"} issued.\nThis cannot be undone.`)) return;
  say("fnMsg", "", "Shipping and invoicing…");
  ["fnGo","fnPrev","fnSR","fnSRM"].forEach(id => { const b = document.getElementById(id); if(b) b.disabled = true; });

  const invs = data.invoices || [], ods = data.orders || [];
  const bos = ods.map(od => od.ship && od.ship.backorder && od.ship.backorder.so_number ? `${esc(od.so_number)} → <b class="mono">${esc(od.ship.backorder.so_number)}</b>` : "").filter(Boolean);
  document.getElementById("fnOut").innerHTML = `${invs.map((inv, i) => { const tt = inv.totals || {}; return `
    <div class="socols"${i ? ' style="border-top:1px solid var(--line);padding-top:8px"' : ""}>
      <div class="stat">Invoice<b>${esc(inv.invoice_number || "")}</b></div>
      <div class="stat">Amount due<b>${money(tt.amount_due)}</b></div>
      <div class="stat">Still owed<b>${money(tt.remaining)}</b></div>
    </div>
    <div class="sohint">Issued ${esc(inv.issued_on || "")}${inv.due_on ? " · due " + esc(inv.due_on) : ""}${(inv.orders || []).length ? " · " + (inv.orders || []).map(esc).join(" + ") : ""}.</div>
    ${inv.invoice_number ? `<div style="margin:6px 0 4px"><button class="pobtn" data-fpinv="${escQ(inv.invoice_number)}">Print invoice</button> <button class="pobtn" data-fminv="${escQ(inv.invoice_number)}">Email invoice…</button></div>` : ""}
    ${(inv.warnings || []).length ? `<div class="sowarn">${warnChips(inv.warnings)}</div>` : ""}`; }).join("")}
    ${bos.length ? `<div class="sohint">The short part carries on as ${bos.join(" · ")}.</div>` : ""}
    ${putBackHtml(data.put_back, true)}
    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
  document.getElementById("fnUnits").innerHTML = "";
  say("fnMsg", "on", "Done.");
  document.querySelectorAll("#fnOut [data-fpinv]").forEach(b => { b.onclick = () => imsDoc.printBtn(b, sb, "final_invoice", { invoice_number: b.dataset.fpinv }); });   // so v5t8
  document.querySelectorAll("#fnOut [data-fminv]").forEach(b => { b.onclick = async () => {   // so v5t9 — 자동 손님이면 이미 줄에 섰을 수 있다 · 그래도 사람이 한 통 더 보낼 수 있다 · 인보이스마다 PDF 하나
    const q = await sb.from("so_invoice").select("id").eq("invoice_number", b.dataset.fminv).limit(1);
    if(q.error || !(q.data || []).length){ alert(q.error ? q.error.message : "Invoice not found"); return; }
    imsDoc.mailDialog(sb, "final_invoice", { invoice_id: q.data[0].id });
  }; });
  const cl = document.querySelector('#modalBox [data-m="close"]');
  cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
}

/* ══ 2판(2026-09-25 · Caleb 「so.html 2판 가자」) — 보류 · 풀기 · 나누기 · 창고 바꾸기 · 백오더 진행 · 병합 ══
   ⭐ 전부 DB 창구의 미리 보기(p_commit false)를 먼저 보이고 같은 입력으로 실행한다 · 권한은 manager(병합은 초안만이면 sales)
   ⭐ 결과 모양은 확정 미리 보기와 같다(so_allocate_run 의 lines · siblings) — 같은 표로 그린다 */
/* v2.1 — 줄의 예약 글자(Caleb 2026-09-25 「not reserved가 직관적이고 좋겠어」) — hold 는 「잡지 않고 멈춰 둔」 것이라 not reserved 로 읽힌다 */
function resLabel(x){
  const n = qty(x.qty_allocated);
  if(x.kind === "allocated") return `<span class="on" style="font-size:11.5px">reserved ${n}</span>`;
  if(x.kind === "hold")      return `<span class="neutral" style="font-size:11.5px" title="On hold — stock is not held for this order; other orders can use it">not reserved ${n} <span class="dim">· on hold</span></span>`;
  if(x.kind === "backorder") return `<span class="neutral" style="font-size:11.5px" title="Waiting for stock — Proceed backorder when it arrives">backorder ${n}</span>`;
  if(x.kind === "preorder")  return `<span class="neutral" style="font-size:11.5px" title="Preorder — not reserved until it is proceeded">preorder ${n}</span>`;
  return `<span class="dim" style="font-size:11.5px">${esc(x.kind)} ${n}</span>`;
}
function planTable(data, done){
  const lines = data.lines || [];
  return `<table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th>Result</th><th class="num">Reserved</th><th class="num">Backorder</th><th class="num">Preorder</th></tr></thead>
    <tbody>${lines.map(l => `<tr><td class="num">${esc(l.line_no ?? "")}</td><td class="mono">${esc(l.sku || "")}${l.combo ? ' <span class="tag">combo</span>' : ""}</td><td class="num">${qty(l.qty_ordered)}</td>
      <td>${esc(l.kind || "")}</td><td class="num">${qty(l.allocated)}</td>
      <td class="num">${Number(l.backordered) ? `<span class="neutral">${qty(l.backordered)}</span>` : '<span class="dim">0</span>'}</td>
      <td class="num">${Number(l.preorder) ? `<span class="neutral">${qty(l.preorder)}</span>` : '<span class="dim">0</span>'}</td></tr>`).join("") || '<tr><td colspan="7" class="dim">No line changes.</td></tr>'}</tbody></table>
    ${(data.siblings || []).length ? `<div class="sosub">${done ? "Split off" : "Will split off"}: ${data.siblings.map(x => `${esc(x.so_number || "")} ${esc(x.split_reason || "")}`).join(" · ")}</div>` : ""}
    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
}
/* 미리 보기 → 실행 한 벌 — rpc 이름 · 인자 · 제목 · 그리기 */
/* v2.3 — guard(data) 가 문장을 돌려주면 실행 단추를 막고 그 문장을 보인다(Caleb 2026-09-25 · 재고 없는 Proceed 가 「걸어 두면 들어올 때 잡힌다」로 오해될 수 있다) */
const NOTHING_TO_RESERVE = "Nothing can be reserved yet — there is no stock for these lines in this warehouse. Proceed does not wait for stock: press it again after stock arrives (Backorders shows \"arrived\" when a receipt or transfer lands).";
const noneReserved = (d) => { const ls = d.lines || []; return ls.length && !ls.some(l => Number(l.allocated) > 0) ? NOTHING_TO_RESERVE : null; };
function previewThenRun(title, rpc, args, draw, goLabel, after, guard){
  modalOpen(`
    <h4>${title}</h4>
    <div class="pbody"><div id="pvOut2"><div class="msg">Checking…</div></div><div id="pvMsg2" style="margin-top:10px;font-size:12.5px"></div></div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn go" id="pvGo2" disabled>${goLabel}</button>
    </div>`);
  wireModalClose();
  (async () => {
    const { data, error } = await sb.rpc(rpc, Object.assign({}, args, { p_commit: false }));
    if(error){ document.getElementById("pvOut2").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    document.getElementById("pvOut2").innerHTML = draw(data, false);
    const block = guard ? guard(data) : null;
    if(block){ say("pvMsg2", "err", block); return; }
    say("pvMsg2", "", "Nothing is saved until you press " + goLabel + ".");
    const go = document.getElementById("pvGo2"); go.disabled = false;
    go.onclick = async () => {
      say("pvMsg2", "", "Working…"); go.disabled = true;
      const r = await sb.rpc(rpc, Object.assign({}, args, { p_commit: true }));
      if(r.error){ say("pvMsg2", "err", r.error.message); go.disabled = false; return; }
      document.getElementById("pvOut2").innerHTML = draw(r.data, true);
      say("pvMsg2", "on", "Done.");
      const cl = document.querySelector('#modalBox [data-m="close"]');
      cl.textContent = "Close"; cl.onclick = async () => { modalClose(); if(after) await after(r.data); else await reloadHere(); };
    };
  })();
}

/* ── so csv v1 · 판정 628 — 내보내기(CSV · UTF-8 BOM 이라 엑셀에서 바로 열린다) ──
   ⭐ 목록 = 지금 거르기 그대로(baseQuery) · 모든 쪽을 1,000 씩(Data API 한 번 한도) · 합계 · 인보이스 · 결제 상태는 화면과 같은 창구로 덧붙인다
   ⭐ 줄 = 열린 오더의 줄(so_detail 이 준 것 그대로) · GP · 원가는 원가 열쇠가 있어 화면에 그렸을 때만 */
function csvCell(v){
  if(v === null || v === undefined) return "";
  const t = String(v);
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvDownload(name, rows){
  const txt = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const csvPlain = (h) => String(h === null || h === undefined ? "" : h).replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();
const csvDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Toronto" });
const csvNum = (v) => (v === null || v === undefined || v === "") ? "" : Number(v);
async function exportSoList(btn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
  try {
    if(payFilter) await loadPayIds();
    await loadQInv();
    const all = [];
    for(let from = 0; ; from += 1000){
      const { data, error } = await baseQuery().range(from, from + 999);
      if(error) throw new Error(error.message);
      all.push(...(data || []));
      btn.textContent = `Preparing… ${all.length}`;
      if(!data || data.length < 1000 || all.length >= 50000) break;
    }
    if(!all.length){ alert("No sales orders match — nothing to download."); return; }
    const ids = all.map(r => r.id), tot = {}, inv = {};
    for(let i = 0; i < ids.length; i += 200){
      const part = ids.slice(i, i + 200);
      const [t, v] = await Promise.all([
        sb.rpc("so_totals_many", { p_so_ids: part }),
        sb.from("so_invoice_list").select("invoice_number,status,total,remaining,days_overdue,so_ids").overlaps("so_ids", part).neq("status", "cancelled"),
      ]);
      if(t.error) throw new Error("totals: " + t.error.message);
      if(v.error) throw new Error("invoices: " + v.error.message);
      (t.data || []).forEach(x => { tot[x.so_id] = x; });
      (v.data || []).forEach(x => (x.so_ids || []).forEach(id => { if(part.includes(id)) (inv[id] = inv[id] || []).push(x); }));
    }
    const payTxt = (vs) => { if(!vs || !vs.length) return "";
      const rem = vs.reduce((a, x) => a + Number(x.remaining || 0), 0), all2 = vs.reduce((a, x) => a + Number(x.total || 0), 0), late = Math.max(...vs.map(x => Number(x.days_overdue || 0)));
      return rem <= 0.004 ? "paid" : late > 0 ? `overdue ${late}d` : rem < all2 - 0.004 ? "partly paid" : "unpaid"; };
    const rows = [["Status","SO","Split","Invoice","Payment","Channel","Ordered","Fulfilled","Customer","Reference","Warehouse","Total incl. tax","Currency"]];
    all.forEach(r => {
      const t = tot[r.id], vs = inv[r.id] || [];
      rows.push([csvPlain(stChip(r.status)) + (r.closed_reason ? " · " + r.closed_reason : ""), r.so_number, r.split_from_id ? "split" : "",
        vs.map(x => x.invoice_number).join(" "), payTxt(vs), csvPlain(chLbl(r)), r.order_date || "",
        r.status === "fulfilled" && r.closed_at ? new Date(r.closed_at).toLocaleDateString("sv-SE", { timeZone: "America/Toronto" }) : "",
        custName(r), r.ref || "", r.location_name || "",
        t && t.order_total_with_tax !== null && t.order_total_with_tax !== undefined ? Number(t.order_total_with_tax) : "", r.currency_code || ""]);
    });
    csvDownload(`sales-orders-${csvDay()}.csv`, rows);
  } catch(e){ alert("Download failed: " + e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function exportSoLines(){
  if(!cur || !cur.so) return;
  const s = cur.so, t = cur.totals || {}, GP = cur.__gp || null, shipped = t.basis === "shipped";
  const odp = Number(s.order_discount_pct) || 0;
  const head = ["Line","SKU","Product","Pack factor","Qty","Qty out","List","Disc %","Unit"].concat(odp > 0 ? ["Net unit"] : []).concat(["Surcharge","Line total","Price from","Comments","Combo"]).concat(GP ? ["Cost (avg)","GP","GP %"] : []);
  const rows = [head];
  const lines = (cur.lines || []).slice().sort((a, b) => Number(a.line_no) - Number(b.line_no));
  const comboSku = {}; lines.forEach(l => { comboSku[l.id] = l.sku; });
  lines.forEach(l => {
    const comp = !!l.combo_line_id;
    const manual = l.price_override || l.discount_source === "manual";
    const from = comp ? "" : l.free_reason ? "free · " + l.free_reason : l.price_override ? "price set by hand" : l.discount_source === "manual" ? "discount by hand"
      : l.discount_source === "deal" ? "deal" : l.discount_source === "set" ? "set discount" : l.discount_source === "customer" ? "customer" : "";
    const g = GP && !comp ? GP.per[l.id] : null;
    rows.push([l.line_no, l.sku, l.product_name || "", csvNum(l.pack_factor), csvNum(l.qty_ordered), csvNum(l.qty_shipped),
      comp ? "" : csvNum(l.list_price), comp ? "" : csvNum(l.discount_pct), comp ? "" : csvNum(l.unit_price)]
      .concat(odp > 0 ? [comp || l.unit_price === null || l.unit_price === undefined ? "" : (manual ? Number(l.unit_price) : Math.round(Number(l.unit_price) * (1 - odp / 100) * 10000) / 10000)] : [])
      .concat([comp ? "" : (l.surcharge_label || ""), comp ? "" : csvNum(shipped ? l.shipped_total : l.total), from, l.comments || "", comp ? "component of " + (comboSku[l.combo_line_id] || "") : (l.is_combo ? "combo" : "")])
      .concat(GP ? (g ? [Math.round(g.cost * 100) / 100, Math.round(g.gp * 100) / 100, g.pct === null ? "" : Math.round(g.pct * 10) / 10] : ["", "", ""]) : []));
  });
  csvDownload(`${s.so_number}-lines-${csvDay()}.csv`, rows);
}
/* so gp v1 — 원가 보기 열쇠를 한 번 묻고 기억한다(로그인이 바뀌면 화면이 다시 열린다) */

async function loadDetail(id){
  const seq = ++detailSeq;

  const [d, fam] = await Promise.all([
    sb.rpc("so_detail", { p_so_id: id }),
    sb.rpc("so_family_members", { p_so_id: id }),
  ]);
  if(seq !== detailSeq) return;
  /* v2 — 줄마다 지금 예약(allocated · hold · backorder · preorder) · so_detail 에 없어 표를 읽는다(읽기 열림) · 보류 여부도 이것으로 */
  let RES = {};
  const lineIds = ((d.data && d.data.lines) || []).map(l => l.id);
  if(lineIds.length){
    const rr = await sb.from("so_reserve").select("so_line_id,kind,qty_allocated").is("released_at", null).in("so_line_id", lineIds);
    (rr.data || []).forEach(x => { (RES[x.so_line_id] = RES[x.so_line_id] || []).push(x); });
  }
  /* so v4a(판정 248) — 초안이면 줄마다 가용(so_lines_available 한 번 · 콤보 줄 = 통째 콤보 수 · 구성품 · 보통 줄 = 자기 단위) · 정지 그림(줄끼리 서로 빼지 않는다 — 확정이 한다) */
  let AVL = {};
  if(d.data && d.data.so && d.data.so.status === "draft" && lineIds.length){
    const la = await sb.rpc("so_lines_available", { p_so_id: id });
    if(!la.error) (la.data || []).forEach(x => { AVL[x.line_id] = x; });
  }
  /* v2 — 병합으로 만든 초안이면 「오늘 견적이 더 유리한 줄」(판정 4 보완 ①) */
  let HINT = null;
  if(d.data && d.data.so && d.data.so.status === "draft"){
    const h = await sb.rpc("so_merge_requote_hint", { p_so_id: id });
    if(!h.error && h.data && h.data.merged) HINT = h.data;

  /* so gp v1 · 판정 625 A — 줄 GP(내부용): 원가 = 지금 평균 원가(재고 화면의 재고 금액과 같은 값 · stk_value_many)

  let GP = null;

          const add = (bag, r) => { const a = bag[r.product_id] = bag[r.product_id] || { q:0, v:0 }; a.q += Number(r.layer_qty_ea) || 0; a.v += Number(r.remaining_value) || 0; };

    (odSrc === "deal"   ? ` <span class="tag" title="From an order discount rule">rule${DEALN.order ? " · " + esc(DEALN.order) : ""}</span>`
