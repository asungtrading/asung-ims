<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Orders · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css · 뼈대는 po.html(목록/상세 두 모드 · 모달)
     ⚠️ 이름은 공통과 겹치지 않게 so 접두 · .list .row 계열은 po.html 과 같은 모양(지역 규칙 — 세 번째가 나오면 공통으로) */
  .binlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px - var(--ims-tabs-h, 0px))}
  .list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .list .row .l{min-width:0}
  .list .row .pn{font-family:var(--mono);font-size:13px}
  .list .row .sn{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .r{text-align:right;white-space:nowrap}
  .list .row.cur .pn{color:#3b5bdb;font-weight:700}
  main{display:flex;flex-direction:column;gap:14px}
  .sobar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sobar .pn{font-family:var(--mono);font-size:20px;font-weight:700}
  .sogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:900px){ .sogrid{grid-template-columns:1fr} }
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .sowarn{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
  .pomodal[hidden]{display:none}
  .pobox textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12.5px}
  .pobox input[type=search],.pobox input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:300px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .pick .prow.on2{background:#eef4ff}
  .sofield{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .sobig{font-family:var(--mono);font-size:16px;font-weight:700}
  .socols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
  .socols .stat b{font-size:15px}
  /* 줄 사진 — 판정 208 · 213 · 칸 모양은 ims-ui.css 의 .ims-thumb(thumb-1) */
  .lnth{display:flex;gap:8px;align-items:flex-start}
  /* so v4a · asm-3b1 — 콤보 줄 아래 구성품 줄(묶음 2 · 3) */
  tr.comp td{background:#fafbfd;border-top-color:#f0f2f6}
  tr.comp .cin{padding-left:22px;position:relative}
  tr.comp .cin::before{content:"↳";position:absolute;left:4px;top:0;color:var(--muted)}
  .avl{font-size:11px;margin-top:2px;white-space:nowrap}
  /* surcharge-3 — 줄의 관세 부가 요금 칸(판정 227 · 묶음 1) */
  .scc{font-size:12px;line-height:1.35;white-space:nowrap}
  .scc .u{color:var(--muted);font-size:11.5px}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <select id="wch" title="Channel">
        <option value="">All channels</option>
        <option value="warehouse">Warehouse</option>
        <option value="counter">Counter</option>
        <option value="pos">POS</option>
      </select>
      <input type="date" id="wfrom" title="Order date from">
      <span class="dash">—</span>
      <input type="date" id="wto" title="Order date to">
      <select id="wst">
        <option value="open">Open</option>
        <option value="draft">Draft</option>
        <option value="reprice">Draft — reprice suggested</option>
        <option value="confirmed">Confirmed</option>
        <option value="warehouse">With warehouse</option>
        <option value="packed">Finalized — waiting for the office</option>
        <option value="shipped">Shipped</option>
        <option value="fulfilled">Fulfilled</option>
        <option value="cancelled">Cancelled</option>
        <option value="all">All</option>
      </select>
      <input type="search" id="wq" placeholder="SO number · customer · reference">
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn go" id="wnew">+ New sales order</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <div style="display:flex;gap:6px">
        <button class="pobtn" id="backWide" style="flex:1">‹ All orders</button>
        <button class="pobtn go" id="newSo" style="flex:1">+ New</button>
      </div>
      <input type="search" id="q" placeholder="Search SO number · customer · reference">
      <div class="opts">
        <label>Status
          <select id="st">
            <option value="open">Open</option>
            <option value="draft">Draft</option>
            <option value="reprice">Draft — reprice suggested</option>
            <option value="confirmed">Confirmed</option>
            <option value="warehouse">With warehouse</option>
            <option value="packed">Finalized — waiting for the office</option>
            <option value="shipped">Shipped</option>
            <option value="fulfilled">Fulfilled</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a sales order.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Sales Orders — SO 오피스 화면 1판 (2026-09-25 · 대화 Claude)
   정본: asung-wms docs/design/so-module.md §12~§21 · 뼈대 po.html
   ⭐ 담은 것: 목록 · 새 오더 · 머리 · 줄 · 운임 · 합계 · 확정(창고 길 미리 보기) · counter 확정·출고 · 결제 넣기 · 뭉치
   ⭐ 미룬 것(단추 자리만): 보류 · 나누기 · 창고 바꾸기 · 백오더 진행 · Release to WMS · 오피스 마무리 · 병합 · 인쇄 · POS
   ⚠️⚠️ 계산 규칙의 정본은 DB 다 — 가격 · 할인 · 세금 · 합계 · 잔액을 화면에서 다시 짜지 마라.
      so_detail · so_tax_preview · so_counter_ship(미리 보기) 가 돌려준 값을 그리기만 한다.
   ⚠️ 쓰기는 전부 창구(RPC)다 — SO 표는 select 만 열려 있다. 오류 문장은 DB 가 「… nothing was saved」로 준다 — 그대로 보인다.
   ⚠️ 화면 글자는 영어 · 날짜 기본값은 torontoToday() · 시각은 imsTs(토론토)
   ───────────────────────────────────────────────────────────── */
const SO_BUILD = "2026-10-07 · so v5b";   // 대화 Claude — 다시 매기기(판정 346 · 349 · dsc-4e 20261007142513 — 깃발은 초안에만 · 초안을 떠나면 지워진다): 목록 · 넓은 목록에 「reprice」 이름표(초안 ∧ reprice_suggested_at) · 상태 거르기 「Draft — reprice suggested」 · 경고 글을 원인 전부(딜 · 제품 브랜드 · 카테고리 · 태그 · 주문일 · 티어 · 할인)로 + 언제부터 · 깃발이 서 있으면 Reprice 단추를 눈에 띄게 ← so v5a 2026-10-07 · 대화 Claude — 할인 표시 묶음 1(미룬 120 · 판정 283 · 284 · 298 · 312 · 329): 머리에 Coupon 줄(초안 · sales — so_coupon_apply(p_so_id, p_code) · so_coupon_remove(p_so_id) · 20261006204146 dsc-3b · so_detail.coupon {code · deal_name · pct · expires_on · status won|lost|manual_overrides|invalid · reason}) · Order discount 출처 이름표(rule · 딜 이름 / coupon 코드 / set by hand) · 잠김 표시(so.order_discount_locked_at · 판정 312) · 규칙이 더 큰 경우 수치(so_detail.order_discount_rule) · 줄 표 Net unit 칸(오더 할인 % 가 있을 때만 · 그릴 때 계산 · 판정 284) · Price from 에 set discount · 딜 이름 · 경고 글 셋 ← so v4c1 2026-10-06 · 붙여넣기 결과의 not for sale 줄에서 Note 칸이 판정 글을 되풀이했다(CRO00327_not_for_sale — …) → 비움 ← so v4c 대화 Claude — dsc-1(판정 281 · 293): 붙여넣기 · 찾아 고르기 결과에 「from set SET × n → BASE × m」 꼬리표 · 새 판정 not_sellable · 요약 줄에 converted · not for sale 수 · Include sets 안내 글 · WARN set_converted_to_base ← so v4b1 Put back 상자의 글씨가 너무 컸다(Caleb 화면 시험 SO-25035) → 제목 13px · 설명 12px ←   // 대화 Claude — asm-3b2(판정 246 · asm 묶음 2 · 4): Finalize 미리 보기 · 결과에 「Put back」 목록(구성품 픽을 통째 콤보로 줄인 몫 · SKU · 칸 · 수량) · 결과 줄의 콤보 묶어 그리기 · Divide 는 콤보 줄에만 입력(구성품은 따라간다) · Merge 미리 보기의 콤보 표시와 따로 둔 까닭(differs_in · 옛 화면은 없는 열쇠 kept_apart_by 를 읽어 한 번도 안 보였다) ← so v4a asm-3b1(판정 244 · 248 · asm 묶음 2 · 3): 콤보 줄 아래 구성품 줄을 들여 그린다(구성품은 수량 · 값 · 지우기 칸 없음 — 콤보 줄만 고친다) · 초안의 줄마다 가용(so_lines_available · 콤보 줄 = 통째 콤보 수 · 판정 248) · 줄 더하기 창의 콤보 가용 = 구성품으로 · 확정 미리 보기 · 붙여 넣기 결과에 콤보 표시 ← so sc v1.1 대화 Claude — Finalize 의 Surcharges 칸: 줄의 옛 값을 속성에 encodeURIComponent 로(esc 는 큰따옴표를 막지 않아 data-o 가 잘려 미리 보기가 JSON.parse 에서 멈췄다 · Caleb 화면 시험 SO-25020) ← so sc v1 대화 Claude — surcharge-3(판정 227 ~ 230 · surcharge-3 묶음 1 ~ 8): 줄 표 Surcharge 열 · 줄 고르기 + Set surcharge… · 합계 Surcharge · Finalize 에서 고치기 ← 「so thumb v1」 대화 Claude — 판정 208 · 213: Lines 표 · Add a line 후보 목록의 SKU 왼쪽에 대표 사진(imsThumb · thumb-1) ← 「so v3.1」 lay-3(대화 Claude) — 판정 156 · 167: 구역 제목 색 띠(tbl 의 h3 → .ims-sec) ← 「so v3」(2026-09-28)   // 오피스 판 2 — Finalize 창(wms_so_handoff 팔렛 · 부족분 · 운임 · 택배사 · 미리 보기 → so_finalize) · v2.5 = 판정 17 글자 · 시각 줄 · Finalized 필터(판정 46)
console.log("so.html build:", SO_BUILD);
/* 줄 사진(판정 208 · 213) — 공통 js 가 옛 판으로 캐시돼 있으면 칸 없이 그린다 */
const thumbOf = sku => typeof window.imsThumb === "function" ? window.imsThumb(sku) : "";
const thumbFill = el => { if(typeof window.imsThumbFill === "function") window.imsThumbFill(el); };

function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb = null, me = null, rank = 0;
let q = "", stFilter = "open", chFilter = "", dateFrom = "", dateTo = "", curId = null;
let detailSeq = 0;
let cur = null;                 // 지금 연 오더의 so_detail 반환 — 모달들이 읽는다(loadDetail 만 쓴다)
const pg  = imsPage(100);
const pgW = imsPage(50);
let WHS = [], TERMS = [], TIERS = [], TAXES = [], ACCTS = [];

/* ⭐ 역할 — ims_role_rank 와 같은 순서. ⚠️ 이것은 **편의**다(단추를 숨길 뿐) · 진짜 문은 DB 창구 */
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;
const isSup = () => rank >= 3;
/* v2.4 — Release to WMS · 거둬들이기는 so_release_to_wms · so_wms_recall 의 문(sales 쓰기)과 같은 기준으로 보인다(⑤-4 ⬜H · 2026-09-26) */
const canSales = () => imsAuth.canWrite("sales");

const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits: 4 }));
/* ⚠️ 단가는 자르지 않고 저장된다(29자리 · 12-h) — 보일 때만 넷째 자리까지 */
const price = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 4 }));

/* ⚠️ PostgREST or=(...) 안에서는 쉼표·괄호가 문법이다 — 손님 이름에 쉼표가 있다(po.html 선례) */
const orTerm = (t) => String(t || "").replace(/[,()"\\]/g, "%");
const stem = (n) => String(n || "").replace(/[a-z]+$/, "");

/* ⭐ v2.5 · 판정 17 — 저장값은 그대로 두고 화면 글자만 바꾼다. 창고 화면 다섯(wms-*.html)과 같은 표.
   모르는 값은 그대로 보인다(삼키지 않는다) — 인보이스 상태도 이 함수를 거쳐 그대로 나간다.
   📌 공통 표(ims-ui.js)로 모으는 것은 뒤의 정리 차수(manager-list · pos · so-backorders 와 함께) */
const SO_STATUS_LABEL = {
  draft: "Draft", confirmed: "Confirmed", at_wms: "Released to WMS", picking: "Working",
  packed: "Finalized", shipped: "Shipped", fulfilled: "Fulfilled", cancelled: "Cancelled"
};
const stLbl = (s) => SO_STATUS_LABEL[s] || s;
/* ⚠️ 색은 절제한다 — cancelled 빨강 · fulfilled 초록 · 나머지 회색 */
function stChip(s){
  if(s === "cancelled") return `<span class="chip bad">${esc(stLbl(s))}</span>`;
  if(s === "fulfilled") return `<span class="chip good">${esc(stLbl(s))}</span>`;
  return `<span class="chip">${esc(stLbl(s))}</span>`;
}
const CH_LBL = { warehouse: "Warehouse", counter: "Counter", pos: "POS" };
const REPRICE_TAG = '<span class="tag disc" title="Prices may be out of date — open the order and press Reprice">reprice</span>';   // so v5b(판정 349)
function rowTags(r){
  const t = [];
  if(r.status === "cancelled") t.push(`<span class="tag off">${esc(r.closed_reason === "merged" ? "merged" : "cancelled")}</span>`);
  else t.push(`<span class="tag">${esc(stLbl(r.status))}</span>`);
  if(r.channel !== "warehouse") t.push(`<span class="tag">${esc(CH_LBL[r.channel] || r.channel)}</span>`);
  if(r.split_from_id) t.push('<span class="tag">split</span>');
  if(r.status === "draft" && r.reprice_suggested_at) t.push(REPRICE_TAG);   // so v5b
  return t.join(" ");
}

/* 경고 코드 → 사람이 읽는 말. ⚠️ 모르는 코드는 코드 그대로 보인다(삼키지 않는다) */
const WARN = {
  tax_region_unknown: "No tax rule — the ship-to province is unknown. Pick a tax rule.",
  tax_rule_missing: "No tax rule — pick one before confirming.",
  tax_rule_reset_by_ship_to: "The tax rule was reset because the ship-to province changed.",
  tax_rule_inactive: "The tax rule on this order is inactive.",
  lines_without_price: "Some lines have no price — confirming is blocked until they get one.",
  no_lines: "No lines yet.",
  reprice_suggested: "Prices may be out of date — a deal, a product's brand, category or tags, the order date, tier or discount changed after these lines went in. Lines kept their prices; press Reprice to requote the system lines.",   /* so v5b */
  deal_ended_before_line_added: "A deal on one of the lines had already ended when the line was added.",
  direct_order_tier_unexpected: "Price tier is not the usual one for direct orders.",
  tier_differs_from_customer: "Price tier differs from the customer's own tier.",
  customer_tier_missing: "The customer's tier could not be found.",
  currency_mismatch: "The order currency differs from the price tier currency.",
  lines_keep_prices: "Lines already on the order keep their prices.",
  lines_removed: "Some lines were removed by the customer at finalize.",
  /* v1.1 — so_copy_customer 가 내는 경고(Caleb 화면 시험 2026-09-25 · bill_to_empty 가 코드 그대로 보였다) */
  bill_to_empty: "The customer has no default billing address — the invoice will go out without one.",
  ship_to_empty: "The customer has no shipping address — fill in Ship to before confirming.",
  ship_to_from_billing: "No shipping address on file — the billing address was used as ship-to.",
  price_tier_missing: "The customer has no price tier — lines may come in without a price.",
  price_tier_not_for_sale: "The customer's price tier is not a sales tier.",
  price_tier_inactive: "The customer's price tier is inactive.",
  customer_inactive: "This customer is inactive.",
  surcharge_pct_over_100: "The surcharge is over 100% — check it is not a typo.",   /* surcharge-2a · 묶음 4 */
  /* v2 — 병합 경고 */
  charges_not_merged: "Freight was not carried over — add it again on the new draft.",
  head_differs: "The merged orders differ in the header — the oldest order's values were kept.",
  backorder_siblings_stay_open: "Backorder orders of the originals stay open.",
  preorder_lines_need_reflag: "Some lines were preorders — pick them again as preorder when you confirm.",
  superseded_not_reopenable: "Some backorder lines taken over by the originals could not be reopened.",
  set_converted_to_base: "A set that is not sold as a set went in as its base SKU × pack.",   /* dsc-1 판정 293 */
  /* so v5a — 할인 묶음(dsc-3a · 3b) */
  coupon_not_used: "The coupon on this order is not giving the discount — see Coupon above.",
  order_discount_rule_now_better: "A discount rule now gives more than the order discount % set by hand — clear Order discount % to go back to the rules.",
  coupon_detached_not_used: "The coupon was not used, so it was taken off the order — the customer can still use it.",
};
/* so v5a — 쿠폰이 안 먹히는 까닭(so_coupon_check · so_coupon_info 의 reason) */
const CP_REASON = {
  lower_pct: "the order already gets a bigger discount",
  below_min_amount: "the order is below the minimum amount of the coupon's deal",

/* ⭐⭐ 질의는 한 곳에서 — 넓은 목록과 좁은 목록이 같은 조건을 본다(po.html 선례) */
function baseQuery(){
  let qry = sb.from("so").select(
    "id,so_number,status,closed_reason,channel,intake,order_date,ref,location_name,currency_code,split_from_id,merged_into_id,bill_to_name,reprice_suggested_at,customer:customer_id(name)",
    { count: "exact" });
  if(stFilter === "open")           qry = qry.in("status", ["draft","confirmed","at_wms","picking","packed","shipped"]);
  else if(stFilter === "warehouse") qry = qry.in("status", ["at_wms","picking","packed"]);
  else if(stFilter === "reprice")   qry = qry.eq("status", "draft").not("reprice_suggested_at", "is", null);   // so v5b — 깃발은 초안에만(판정 349)
  else if(stFilter !== "all")       qry = qry.eq("status", stFilter);
  if(chFilter) qry = qry.eq("channel", chFilter);
  if(dateFrom) qry = qry.gte("order_date", dateFrom);
  if(dateTo)   qry = qry.lte("order_date", dateTo);
  /* ⚠️ 검색은 서버에서 · 손님 이름은 bill_to_name(오더에 굳은 청구처 이름)과 ship_to_company 로 찾는다
     — 조인 칸은 or() 안에 못 넣는다(po.html 2026-09-20 실사고) */
  if(q){ const t = orTerm(q); qry = qry.or(`so_number.ilike.%${t}%,ref.ilike.%${t}%,bill_to_name.ilike.%${t}%,ship_to_company.ilike.%${t}%`); }
  return qry.order("so_number", { ascending: false });
}

/* ── 줄 넣기 — 찾아 고르기 · 붙여넣기 ──────────────────

const VERDICT = {

/* dsc-1 — 안 파는 세트는 창구가 낱개 × pack_factor 로 바꾼다(판정은 ok · merged … 그대로 · 꼬리표만) */
const convTag = c => c ? ` <span class="tag" title="This set is not sold as a set">from set ${esc(c.set_sku)} × ${qty(c.set_qty)} → ${esc(c.base_sku)} × ${qty(c.base_qty)}</span>` : "";

async function drawAlHits(term){
  const box = document.getElementById("alHits");
  if(!box) return;
  if(!term){ box.innerHTML = '<div class="msg">Type to search.</div>'; return; }
  /* ⚠️ 제품 18,714 — 캡 위라 서버에서만 좁힌다 · 세 질문을 나란히(sku · 이름 · 바코드) 뒤 합친다 */
  const t = orTerm(term);
  /* v1.3 — 세트(parent_product_id 있는 제품)는 기본으로 숨긴다(Caleb 2026-09-25 「세트는 보일 필요가 없는데」) · 체크하면 보인다 · 붙여넣기는 세트 SKU 를 받되 안 파는 세트는 창구가 낱개 × pack_factor 로 바꾼다(dsc-1 판정 281) */
  const withSets = !!(document.getElementById("alSets") || {}).checked;
  const noSets = (qb) => withSets ? qb : qb.is("parent_product_id", null);
  const [a, b, c] = await Promise.all([
    noSets(sb.from("product").select("id,sku,name,parent_product_id,pack_factor").eq("is_active", true).ilike("sku", `%${t}%`)).order("sku").limit(50),
    noSets(sb.from("product").select("id,sku,name,parent_product_id,pack_factor").eq("is_active", true).ilike("name", `%${t}%`)).order("sku").limit(50),
    sb.from("product_barcode").select("barcode,product:product_id!inner(id,sku,name,is_active,parent_product_id,pack_factor)").eq("is_active", true).ilike("barcode", `%${t}%`).limit(20),
  ]);
  const err = a.error || b.error || c.error;
  if(err){ box.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; return; }
  const seen = new Set(), rows = [];
  (a.data || []).concat(b.data || []).forEach(p => { if(!seen.has(p.id)){ seen.add(p.id); rows.push(p); } });
  (c.data || []).forEach(x => { const p = x.product; if(p && p.is_active && (withSets || !p.parent_product_id) && !seen.has(p.id)){ seen.add(p.id); rows.push({ id: p.id, sku: p.sku, name: p.name, parent_product_id: p.parent_product_id, pack_factor: p.pack_factor, barcode: x.barcode }); } });
  if(!rows.length){ box.innerHTML = '<div class="msg">No active product matches.</div>'; return; }
  /* v1.3 — 가용 재고(Caleb 화면 시험 2026-09-25) · so_available_many 한 곳(창고 잔고 − 열린 할당 · 낱개 EA) · 오더 창고 기준 · 한 번에 부른다
     ⭐ 세트는 낱개(부모) 재고를 본다 — 세트로는 EA ÷ pack_factor 의 몫만 보인다(계산이 아니라 나눠 보이기) */
  const stockPid = (p) => p.parent_product_id || p.id;
  /* so v4a(판정 244 · 248) — 콤보 SKU 는 자기 재고가 없다 · 가용 = 구성품마다 floor(가용 EA ÷ 콤보 하나에 드는 EA) 의 최소(so_lines_available 과 같은 식 · 같은 재고 키는 합친다) */
  const CB = {};
  { const bm = await sb.from("product_bom").select("parent_product_id,quantity,component:component_product_id(id,sku,parent_product_id,pack_factor)").in("parent_product_id", rows.map(p => p.id)).eq("is_active", true);
    (bm.data || []).forEach(b => { if(!b.component) return; const k = b.component.parent_product_id || b.component.id;
      const need = (CB[b.parent_product_id] = CB[b.parent_product_id] || { n: 0, need: {} });
      need.n++; need.need[k] = (need.need[k] || 0) + Number(b.quantity) * (Number(b.component.pack_factor) || 1); }); }
  let AV = {};
  if(cur && cur.so && cur.so.location_id){
    const pids = rows.filter(p => !CB[p.id]).map(stockPid);
    Object.values(CB).forEach(c => pids.push(...Object.keys(c.need)));
    if(pids.length){
      const av = await sb.rpc("so_available_many", { p_stock_pids: [...new Set(pids)], p_location_id: cur.so.location_id });
      if(!av.error) (av.data || []).forEach(a => { AV[a.stock_pid] = a; });
    }
  }
  const avTxt = (p) => {
    if(CB[p.id]){
      const c = CB[p.id];
      const units = Math.min(...Object.entries(c.need).map(([k, n]) => Math.floor(Math.max(Number((AV[k] || {}).available_ea) || 0, 0) / n)));
      return ` <span class="tag">combo · ${esc(c.n)} items</span> <span class="${units > 0 ? "on" : "off"}" style="font-size:11.5px">available ${esc(units.toLocaleString("en-CA"))} combo${units === 1 ? "" : "s"}</span>`;
    }
    const a = AV[stockPid(p)];
    if(!a) return "";
    const ea = Number(a.available_ea), pf = Number(p.pack_factor) || 1;
    const cls = ea > 0 ? "on" : "off";
    return ` <span class="${cls}" style="font-size:11.5px">available ${esc(ea.toLocaleString("en-CA"))} EA${pf > 1 ? ` = ${esc(Math.floor(ea / pf))} × ${esc(pf)}` : ""}</span>`
      + (Number(a.allocated_ea) ? ` <span class="dim" style="font-size:11px">(on hand ${esc(Number(a.qty_ea).toLocaleString("en-CA"))} · reserved ${esc(Number(a.allocated_ea).toLocaleString("en-CA"))})</span>` : "");
  };
  box.innerHTML = rows.map(p => `<div class="prow" data-pid="${p.id}" data-sku="${esc(p.sku)}" data-name="${esc(p.name || "")}" data-av="${esc(avTxt(p))}"><div class="lnth">${thumbOf(p.sku)}<div>
      <span class="mono">${esc(p.sku)}</span>${p.barcode ? ` <span class="dim" style="font-size:11.5px">barcode ${esc(p.barcode)}</span>` : ""}${avTxt(p)}
      <div class="dim" style="font-size:11.5px">${esc(p.name || "")}</div></div></div></div>`).join("")
    + (rows.length >= 50 ? '<div class="msg dim">Showing the first matches — type more to narrow.</div>' : "");
  box.querySelectorAll("[data-pid]").forEach(el => {
    el.onclick = () => {
      if(addPick.some(x => x.pid === el.dataset.pid)) return;
      addPick.push({ pid: el.dataset.pid, sku: el.dataset.sku, name: el.dataset.name, av: el.dataset.av || "", qty: 1, free: "", note: "" });
      drawChosen();
    };
  });
  thumbFill(box);   // 판정 213 — 후보 SKU 를 한 번에 · 사진 클릭은 크게 보기만(담기로 안 번진다)
}
function drawChosen(){
  const box = document.getElementById("alChosen");
  if(!box) return;
  if(!addPick.length){ box.innerHTML = '<div class="msg dim">Pick products from the list above.</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>SKU</th><th>Product</th><th class="num">Qty</th><th>Free?</th><th>Note</th><th></th></tr></thead>
    <tbody>${addPick.map((r, i) => `<tr>
      <td class="mono">${esc(r.sku)}</td><td>${dim(r.name)}${r.av ? `<div>${r.av}</div>` : ""}</td>
      <td class="num"><input class="qin" type="number" step="any" min="1" value="${esc(r.qty)}" data-aq="${i}"></td>
      <td><select class="sofield" data-af="${i}">
        <option value="">— priced</option>
        ${["sample","promotion","replacement","other"].map(x => `<option value="${x}" ${r.free === x ? "selected" : ""}>free · ${x}</option>`).join("")}
      </select></td>
      <td><input class="tin" value="${esc(r.note)}" data-an="${i}" placeholder="needed for free · other"></td>
      <td><button class="xbtn" data-adrop="${i}" title="Take it off the list">×</button></td>
    </tr>`).join("")}</tbody></table>
    <div class="sohint">Priced lines get their price and discount from the database (tier · customer discount · deals). Free lines go in at 0 with a reason.
      Available = on hand in this order's warehouse minus what other orders have reserved. For a warehouse order, anything above it becomes a backorder when you confirm; a counter order ships it anyway.</div>`;
  box.querySelectorAll("[data-aq]").forEach(inp => { inp.onchange = () => { addPick[Number(inp.dataset.aq)].qty = Number(inp.value) || 0; staleAdd(); }; });
  box.querySelectorAll("[data-af]").forEach(s => { s.onchange = () => { addPick[Number(s.dataset.af)].free = s.value; staleAdd(); }; });
  box.querySelectorAll("[data-an]").forEach(inp => { inp.onchange = () => { addPick[Number(inp.dataset.an)].note = inp.value; }; });
  box.querySelectorAll("[data-adrop]").forEach(b => { b.onclick = () => { addPick.splice(Number(b.dataset.adrop), 1); drawChosen(); staleAdd(); }; });
}
function staleAdd(){
  const go = document.getElementById("alGo"); if(go) go.disabled = true;
  const out = document.getElementById("alOut"); if(out) out.innerHTML = "";
}
async function runAdd(commit){
  const priced = addPick.filter(r => !r.free).map(r => ({ sku: r.sku, qty: Number(r.qty) }));
  const free   = addPick.filter(r => r.free);
  if(!priced.length && !free.length){ say("alMsg", "err", "Pick at least one product."); return; }
  if(free.some(r => r.free === "other" && !String(r.note || "").trim())){ say("alMsg", "err", "A free line with reason other needs a note."); return; }
  let res = null;
  if(priced.length){
    res = await runLines(priced, commit, { out: "alOut", msg: "alMsg", go: "alGo" }, true);
    if(res === false) return;
  } else {
    document.getElementById("alOut").innerHTML = `<div class="msg dim">${free.length} free line(s) will be added at 0.</div>`;
    document.getElementById("alGo").disabled = false;
  }
  if(!commit) return;
  for(const r of free){
    const { error } = await sb.rpc("so_line_add", { p_so_id: curId, p_product_id: r.pid, p_qty: Number(r.qty), p_unit_price: 0, p_free_reason: r.free, p_comments: r.note || null });
    if(error){ say("alMsg", "err", r.sku + ": " + error.message); await reloadHere(); return; }
  }
  modalClose();
  await reloadHere();
}

    <div class="pbody">

      <button class="pobtn" id="pasteChk">Check</button>
      <button class="pobtn go" id="pasteGo" disabled>Add lines</button>
    </div>`);
  wireModalClose();
  const ids = { out: "pasteOut", msg: "pasteMsg", go: "pasteGo" };
  document.getElementById("pasteChk").onclick = () => runLines(parsePaste(document.getElementById("pasteBox").value), false, ids);
  document.getElementById("pasteGo").onclick  = () => runLines(parsePaste(document.getElementById("pasteBox").value), true, ids);

function parsePaste(text){
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|,|\s{2,}|\s+/);
    const qv = p.length > 1 ? p[p.length - 1] : "";
    const sku = p.slice(0, Math.max(1, p.length - 1)).join(" ");
    return { sku: sku, qty: Number(String(qv).replace(/[, ]/g, "")) };
  });
}
/* ⭐ 붙여넣기와 찾아 고르기가 같은 창구 · 같은 판정 표 — keepOpen 이면 넣은 뒤 모달을 닫지 않는다(무상 줄이 뒤따른다) */
async function runLines(rows, commit, ids, keepOpen){
  const msg = document.getElementById(ids.msg);
  if(!rows.length){ msg.className = "err"; msg.textContent = "Nothing to read."; return false; }
  msg.className = ""; msg.textContent = commit ? "Adding…" : "Checking…";
  const { data, error } = await sb.rpc("so_lines_paste", { p_so_id: curId, p_lines: rows, p_commit: commit });
  if(error){ msg.className = "err"; msg.textContent = error.message; return false; }
  const s = data.summary;
  msg.className = "";
  msg.textContent = s.too_many ? s.message
    : `${s.total} rows · ok ${s.ok}` + (s.no_price ? ` · no price ${s.no_price}` : "") + (s.merged ? ` · merged ${s.merged}` : "")
      + (s.ask ? ` · price differs ${s.ask}` : "") + (s.not_found ? ` · not found ${s.not_found}` : "")
      + (s.inactive ? ` · inactive ${s.inactive}` : "") + (s.duplicate ? ` · duplicate ${s.duplicate}` : "")
      + (s.bad_qty ? ` · bad qty ${s.bad_qty}` : "") + (s.not_sellable ? ` · not for sale ${s.not_sellable}` : "")
      + (s.converted ? ` · set → base ${s.converted}` : "") + (commit ? ` · added ${s.inserted} · updated ${s.updated}` : "");
  document.getElementById(ids.out).innerHTML = `
    <table><thead><tr><th class="num">#</th><th>SKU</th><th>Product</th><th class="num">Qty</th><th>Verdict</th><th>Note</th></tr></thead>
    <tbody>${(data.lines || []).map(l => {
      const v = VERDICT[l.verdict] || ["dim", l.verdict || ""];
      return `<tr><td class="num">${esc(l.n)}</td><td class="mono">${esc(l.input_sku)}</td><td>${dim(l.product_name)}</td>
        <td class="num">${qty(l.qty !== undefined && l.qty !== null ? l.qty : l.input_qty)}</td>
        <td><span class="${v[0]}">${esc(v[1])}</span>${l.combo ? ` <span class="tag">combo + ${esc(l.components)} components</span>` : ""}${convTag(l.converted)}</td><td class="dim" style="font-size:11.5px">${l.verdict === "not_sellable" ? "" : esc(l.message || "")}</td></tr>`;   /* so v4c1 — not_sellable 의 메시지는 판정 글과 같은 말이라 비운다(Caleb 화면 시험 SO-25042) */
    }).join("")}</tbody></table>`;
  document.getElementById(ids.go).disabled = s.too_many || (Number(s.ok) + Number(s.no_price || 0) + Number(s.merged || 0)) === 0;
  if(commit){
    document.getElementById(ids.go).disabled = true;
    if(!keepOpen){ await reloadHere(); }
  }
  return data;
}

/* ══ surcharge-3(2026-10-02 · 판정 227 ~ 229 · surcharge-3 묶음 1 ~ 4) — 관세 부가 요금 ══════════════════
   ⭐ 값(개당 · 줄 합 · 머리 합)은 so_detail 이 준다(surcharge-2a · 계산 한 곳) — 화면은 다시 계산하지 않는다
   ⭐ 넣기 = 고른 줄마다 so_line_update 한 번(DB 일 없음 · 묶음 3) · 막기 문장은 서버(so_surcharge_check) 그대로 보인다
   ⭐ 무상 줄은 고를 수 없다(판정 228) · 이름 기본값 비움 · 이 오더에서 쓴 이름은 목록(묶음 2) · 100% 넘으면 먼저 묻는다(묶음 4) */
function scBrief(o){
  if(!o || !o.surcharge_label) return "none";
  return esc(o.surcharge_label) + " " + (o.surcharge_pct !== null && o.surcharge_pct !== undefined ? esc(Number(o.surcharge_pct)) + "%" : price(o.surcharge_amount) + "/ea");
}
function scText(l, basis){
  if(!l.surcharge_label) return "";
  const tot = basis === "shipped" ? l.shipped_surcharge_total : l.surcharge_total;
  return `<div class="scc">${scBrief(l)}<div class="u">${price(l.surcharge_unit)}/ea · ${money(tot)}</div></div>`;
}
function scLabels(){ return [...new Set(((cur && cur.lines) || []).map(l => l.surcharge_label).filter(Boolean))]; }
function scBad(lbl, kind, raw){
  if(lbl === "" && raw === "") return null;
  if(lbl === "") return "Give the surcharge a name — e.g. US Tariff.";
  if(raw === "") return "Enter the surcharge value.";
  const v = Number(raw);
  if(!isFinite(v) || v <= 0) return "The surcharge must be a number above 0.";
  if(kind === "amt" && !/^\d+(\.\d{1,2})?$/.test(raw)) return "A per-unit amount has at most two decimals (cents).";
  return null;
}

  const ticked = new Set(oneId ? [oneId] : Array.from(document.querySelectorAll("[data-scpick]:checked")).map(c => c.dataset.scpick));
  const first = all.find(l => ticked.has(l.id) && l.surcharge_label);

async function scRun(clear){
  const ids = Array.from(document.querySelectorAll("[data-scm]:checked")).map(c => c.dataset.scm);
  if(!ids.length){ say("scMsg", "err", "Pick at least one line."); return; }
  let patch;
  if(clear){
    if(!confirm(`Clear the surcharge on ${ids.length} line(s)?`)) return;
    patch = { surcharge_label: "", surcharge_pct: "", surcharge_amount: "" };
  } else {
    const lbl = document.getElementById("scLbl").value.trim(), kind = document.getElementById("scKind").value, raw = document.getElementById("scVal").value.trim();
    const bad = (lbl === "" && raw === "") ? "Give the surcharge a name and a value — or use Clear." : scBad(lbl, kind, raw);
    if(bad){ say("scMsg", "err", bad); return; }
    if(kind === "pct" && Number(raw) > 100 && !confirm(`${raw}% is over 100% — is that right?`)) return;
    patch = kind === "pct" ? { surcharge_label: lbl, surcharge_pct: raw, surcharge_amount: "" } : { surcharge_label: lbl, surcharge_amount: raw, surcharge_pct: "" };
  }
  ["scSave", "scClear"].forEach(id => { document.getElementById(id).disabled = true; });
  const fails = []; let ok = 0;
  for(const id of ids){
    say("scMsg", "", `Saving ${ok + fails.length + 1} of ${ids.length}…`);
    const { error } = await sb.rpc("so_line_update", { p_line_id: id, p_patch: patch });
    if(error){ const l = (cur.lines || []).find(x => x.id === id) || {}; fails.push(`line ${l.line_no} ${l.sku}: ${error.message}`); } else ok++;
  }
  const box = document.getElementById("scMsg");
  box.className = fails.length ? "err" : "on";
  box.innerHTML = `${clear ? "Cleared" : "Saved"} on ${ok} of ${ids.length} line(s).` + (fails.length ? `<div style="margin-top:6px">Not saved:<br>${fails.map(esc).join("<br>")}</div>` : "");
  const cl = document.querySelector('#modalBox [data-m="close"]');
  cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
}

/* ── 줄 고치기 — 표 안에서 바로(po.html 과 같은 결) ────────

   ⚠️ 가격과 할인을 한 번에 못 준다(DB) · 세금 규칙은 줄에서 못 바꾼다(오더의 것) */
async function saveLine(inp){
  const prev = inp.dataset.prev, f = inp.dataset.f, lineId = inp.dataset.line;
  const raw = inp.value.trim();
  if(raw === prev) return;
  const patch = {};
  if(f === "discount_pct" && raw === "") patch[f] = null;
  else {
    const v = Number(raw);
    if(raw === "" || !isFinite(v)){ inp.value = prev; return; }
    patch[f] = v;
  }
  inp.disabled = true;
  const { data, error } = await sb.rpc("so_line_update", { p_line_id: lineId, p_patch: patch });
  inp.disabled = false;
  if(error){ inp.value = prev; alert(error.message); return; }
  if(data && (data.warnings || []).length) setTimeout(() => alert("⚠ " + data.warnings.map(warnText).join("\n⚠ ")), 30);
  await reloadHere();
}
async function resetLine(lineId, sku){

  const { error } = await sb.rpc("so_line_update", { p_line_id: lineId, p_patch: { discount_pct: null } });

async function runConfirm(commit){
  say("cfMsg", "", commit ? "Confirming…" : "Checking…");
  document.getElementById("cfGo").disabled = true;
  const { data, error } = await sb.rpc("so_confirm", { p_so_id: curId, p_preorder_line_ids: Array.from(cfPre), p_hold: cfHold, p_commit: commit });
  if(error){ say("cfMsg", "err", error.message); return; }
  const out = document.getElementById("cfOut");
  const lines = data.lines || [];
  out.innerHTML = `
    <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th>Result</th>
      <th class="num">Reserved</th><th class="num">Backorder</th><th class="num">Preorder</th>${commit ? "" : "<th>Preorder?</th>"}</tr></thead>
    <tbody>${lines.map(l => `<tr>
      <td class="num">${esc(l.line_no)}</td><td class="mono">${esc(l.sku)}${l.combo ? ' <span class="tag" title="Counted in whole combos — a short component backorders the whole combo">combo</span>' : ""}</td><td class="num">${qty(l.qty_ordered)}</td>
      <td>${esc(l.kind || "")}</td><td class="num">${qty(l.allocated)}</td>
      <td class="num">${Number(l.backordered) ? `<span class="neutral">${qty(l.backordered)}</span>` : '<span class="dim">0</span>'}</td>
      <td class="num">${Number(l.preorder) ? `<span class="neutral">${qty(l.preorder)}</span>` : '<span class="dim">0</span>'}</td>
      ${commit ? "" : `<td><input type="checkbox" data-pre="${esc(l.line_id)}" ${cfPre.has(l.line_id) ? "checked" : ""} ${cfHold ? "disabled" : ""}></td>`}
    </tr>`).join("")}</tbody></table>
    ${(data.siblings || []).length ? `<div class="sosub">${commit ? "Split off" : "Will split off"}: ${data.siblings.map(x =>
      `${esc(x.so_number || "")} ${esc(x.split_reason)} (${esc(x.lines)} line${Number(x.lines) === 1 ? "" : "s"})`).join(" · ")}</div>` : ""}
    ${commit && data.superseded ? `<div class="sosub">Backorders taken over from earlier orders: ${esc(JSON.stringify(data.superseded))}</div>` : ""}
    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
  if(commit){
    say("cfMsg", "on", "Confirmed.");
    document.querySelector('#modalBox [data-m="close"]').onclick = async () => { modalClose(); await reloadHere(); };
    return;
  }
  say("cfMsg", "", "Nothing is saved until you press Confirm.");
  out.querySelectorAll("[data-pre]").forEach(cb => {
    cb.onchange = () => { if(cb.checked) cfPre.add(cb.dataset.pre); else cfPre.delete(cb.dataset.pre); runConfirm(false); };
  });
  document.getElementById("cfGo").disabled = false;
}

/* counter 확정 — 재고를 보지 않고 전 줄을 잡는다(실물을 손에 쥔 길 · 6-d) · manager · 백오더 이어받기 없음(④ 판정 13) */
async function confirmCounter(){
  if(!confirm(`Confirm counter order ${cur.so.so_number}? Every line is reserved as it is — counter orders never split or backorder.`)) return;
  const { data, error } = await sb.rpc("so_pos_confirm", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  if((data.warnings || []).length) setTimeout(() => alert("⚠ " + data.warnings.map(warnText).join("\n⚠ ")), 30);
  await reloadHere();
}
async function reopenCounter(){
  if(!confirm(`Reopen ${cur.so.so_number} as a draft? Reserved stock is released.`)) return;
  const { error } = await sb.rpc("so_pos_reopen", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
}
async function unconfirmSo(){
  if(!confirm(`Unconfirm ${cur.so.so_number}? Reserved stock is released and split-off backorder/preorder orders come back into this one (supervisor).`)) return;
  const { data, error } = await sb.rpc("so_unconfirm", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
  if(data && Number(data.backorders_reopened)) setTimeout(() => alert(`${data.backorders_reopened} backorder line(s) taken over by this order were reopened.`), 30);
}
async function deleteSo(){
  if(!confirm(`Delete draft ${cur.so.so_number}? It has never been confirmed, so it disappears — the number is not reused.`)) return;
  const { error } = await sb.rpc("so_delete", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  clearDetail(); await loadList();
}
async function repriceSo(){
  if(!confirm("Requote every system line with today's rules (order date · tier · customer discount · deals)? Lines with a manual price or discount are left as they are.")) return;
  const { data, error } = await sb.rpc("so_reprice", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
  if(data && (data.warnings || []).length) setTimeout(() => alert("⚠ " + data.warnings.map(warnText).join("\n⚠ ")), 30);
}

/* ── so v5a 쿠폰 — 초안에 넣기 · 빼기(sales · 창구가 막기 문장을 낸다) ── */
async function applyCoupon(){
  const el = document.getElementById("cpCode");
  const code = ((el && el.value) || "").trim();
  if(!code){ if(el) el.focus(); return; }
  say("headMsg", "", "Checking the coupon…");
  const { data, error } = await sb.rpc("so_coupon_apply", { p_so_id: curId, p_code: code });
  if(error){ say("headMsg", "err", error.message); return; }
  await reloadHere();
  const msgs = [];
  if(data && data.replaced_code) msgs.push(`Coupon ${data.replaced_code} was replaced.`);
  if(data && data.coupon && data.coupon.status !== "won")
    msgs.push(`Coupon ${data.coupon.code} is on the order but not used — ${CP_REASON[data.coupon.reason] || data.coupon.reason || "see Coupon above"}.`);
  if(msgs.length) setTimeout(() => alert(msgs.join("\n")), 30);
}
async function removeCoupon(){

  const { error } = await sb.rpc("so_coupon_remove", { p_so_id: curId });

  await reloadHere();
}

const METHODS = [["credit_card","Credit card"],["debit_card","Debit card"],["cash","Cash"],["e_transfer","e-Transfer"],["cheque","Cheque"],["wire","Wire"],["direct_deposit","Direct deposit"],["shopify","Shopify"]];

function shipRow(pl, pk, first){
  return `<tr data-line="${esc(pl.line_id)}">
    <td class="num">${first ? esc(pl.line_no) : ""}</td>
    <td class="mono">${first ? esc(pl.sku) + (pl.is_set ? ` <span class="dim">×${esc(pl.pack_factor)}</span>` : "") : ""}</td>
    <td class="num">${first ? qty(pl.to_ship) : ""}</td>
    <td><input class="tin" data-sb value="${esc(pk ? pk.bin : "")}" placeholder="bin"></td>
    <td class="num"><input class="qin" type="number" step="any" min="0" data-sq value="${esc(pk ? pk.qty : "")}"></td>
    <td class="dim" style="font-size:11.5px">${esc(pk ? pk.from : "added")}</td>
    <td>${first ? `<button class="xbtn" data-addbin="${esc(pl.line_id)}" title="Take part of it from another bin">+ bin</button>` : ""}</td>
  </tr>`;
}
function wireShipRows(){
  document.querySelectorAll("[data-addbin]").forEach(b => {
    b.onclick = () => {
      const pl = (shipPlan.plan || []).find(x => x.line_id === b.dataset.addbin);
      const rows = Array.from(document.querySelectorAll(`#shRows tr[data-line="${b.dataset.addbin}"]`));
      rows[rows.length - 1].insertAdjacentHTML("afterend", shipRow(pl, null, false));
    };
  });
}
function readPicks(){
  const out = [];
  document.querySelectorAll("#shRows tr[data-line]").forEach(tr => {
    const qv = Number(tr.querySelector("[data-sq]").value);
    if(qv > 0) out.push({ line_id: tr.dataset.line, bin: tr.querySelector("[data-sb]").value.trim(), qty: qv });
  });
  return out;
}
const pickKey = (arr) => (arr || []).map(p => `${p.line_id}|${p.bin}|${Number(p.qty)}`).sort().join(";");
async function runShip(){
  const picks = readPicks();
  const same = pickKey(picks) === pickKey(shipPlan.picks);
  say("shMsg", "", "Shipping and invoicing…");
  document.getElementById("shGo").disabled = true;
  const { data, error } = await sb.rpc("so_counter_ship", { p_so_id: curId, p_picks: same ? null : picks, p_commit: true });
  if(error){ say("shMsg", "err", error.message); document.getElementById("shGo").disabled = false; return; }
  document.getElementById("shOut").innerHTML = `
    <div class="socols">
      <div class="stat">Invoice<b>${esc(data.invoice_number || "")}</b></div>
      <div class="stat">Amount due<b>${money(data.amount_due)}</b></div>
      <div class="stat">Still owed<b>${money(data.remaining)}</b></div>
    </div>
    <div class="sohint">Issued ${esc(data.issued_on || "")}${data.due_on ? " · due " + esc(data.due_on) : ""}. The order is now ${esc(data.status || "")}.</div>
    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
  say("shMsg", "on", "Done.");
  const cl = document.querySelector('#modalBox [data-m="close"]');
  cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
}


/* ══ v3 · 오피스 판 2(2026-09-28) — 「Finalize — ship and invoice」 ══════════════════════════
   ⭐ 창고가 Finalize 한(packed) 오더를 오피스가 끝낸다: 운임 · 택배사 · 추적번호를 적고 → so_finalize 한 번 =
      출하(so_ship · 재고가 장부에서 빠진다 · 모자란 몫은 백오더 형제) + 인보이스 발행(번호) · 되돌리는 길이 없다
   ⭐ 팔렛 · 박스 치수는 so_finalize 가 안 받는다 — wms_so_handoff 를 따로 읽어 보인다(판정 19 · 운임 견적 재료 · 늘 in · lb)
   ⭐ 운임은 이 창에서만 넣는다(so_charge_set 은 초안 전용) · 픽은 보내지 않는다(so_finalize 가 handoff 의 picks 를 쓴다)
   ⭐ 미리 보기(p_commit false)는 아무것도 쓰지 않고 번호도 안 당긴다 — 실행 단추는 「지금 입력으로 본 미리 보기」 뒤에만 켜진다
   📌 줄 빼기(removed · 판정 9 어휘)는 이 판에 없다 — 손님이 안 받는 줄은 다음 판 */
let finPlan = null, finKey = null;
/* so v4b — 결과 줄(line_id 가 있는 목록)을 콤보 줄 바로 아래 구성품으로 다시 줄 세운다 · 구성품인지는 cur.lines 의 combo_line_id 로 가린다 */
function comboOrder(rows){
  const byId = {}; (cur.lines || []).forEach(l => { byId[l.id] = l; });
  const parentOf = r => (byId[r.line_id] || {}).combo_line_id || null;
  const kids = {}; rows.filter(r => parentOf(r)).forEach(r => { (kids[parentOf(r)] = kids[parentOf(r)] || []).push(r); });
  const out = [];
  rows.filter(r => !parentOf(r)).forEach(r => { out.push(r); (kids[r.line_id] || []).forEach(k => out.push(k)); delete kids[r.line_id]; });
  Object.values(kids).flat().forEach(k => out.push(k));
  return out.map(r => Object.assign({ _comp: !!parentOf(r), _combo: !!(byId[r.line_id] || {}).is_combo || !!r.combo }, r));
}
const comboSkuCell = (r) => `<td class="mono">${r._comp ? `<span class="dim">↳</span> ` : ""}${esc(r.sku || "")}${r._combo ? ' <span class="tag">combo</span>' : ""}${r._comp && r.combo_sku ? ` <span class="dim" style="font-size:11px">for ${esc(r.combo_sku)}</span>` : ""}</td>`;
/* so v4b(판정 246) — 되돌려 놓을 것 · Finalize 가 구성품 픽을 통째 콤보로 줄인 몫(장부는 출고 때만 빠지므로 닿지 않는다 · 실물만 제자리에) */
function putBackHtml(list, done){
  if(!(list || []).length) return "";
  return `<div class="sowarn" style="margin-top:10px"><div style="font-size:13px;font-weight:700">Put back to the shelf</div><div style="font-size:12px;font-weight:400;margin-top:2px">${done ? "These were picked but did not ship" : "These picked items will not ship"} — a combo ships whole or not at all, so the extra components go back to their bin${done ? " (the warehouse sees this list too)" : ""}.</div>
    <table style="margin-top:6px"><thead><tr><th>SKU</th><th>Bin</th><th class="num">Qty</th><th>For combo</th></tr></thead><tbody>
    ${list.map(x => `<tr><td class="mono">${esc(x.sku || "")}</td><td class="mono">${esc(x.bin || "—")}</td><td class="num">${qty(x.qty)}</td><td class="mono">${esc(x.combo_sku || "")}${x.combo_line_no ? ` <span class="dim">line ${esc(x.combo_line_no)}</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function finInput(){
  const v = (id) => (document.getElementById(id).value || "").trim();
  const o = { so_id: curId };
  const amt = v("fnAmt");
  if(amt !== "") o.charges = [{ name: v("fnChName") || "Freight", amount: Number(amt) }];
  if(v("fnCar")) o.carrier = v("fnCar");
  if(v("fnTrk")) o.tracking_number = v("fnTrk");
  if(v("fnNote")) o.shipping_notes = v("fnNote");
  /* surcharge-3(판정 230) — 바뀐 줄만 보낸다 · 빈 이름 + 빈 값 = 지우기 · _no · _k 는 화면 표지(finSend 가 뺀다) */
  const sc = [];
  document.querySelectorAll("#modalBox tr[data-fsc]").forEach(tr => {
    const [ol, ok, ov] = JSON.parse(decodeURIComponent(tr.dataset.o));   // so sc v1.1 — esc 는 큰따옴표를 막지 않아 속성이 잘렸다(Finalize 미리 보기가 멈춤)
    const l = tr.querySelector("[data-fl]").value.trim(), k = tr.querySelector("[data-fk]").value, x = tr.querySelector("[data-fv]").value.trim();
    if(l === ol && x === ov && (k === ok || x === "")) return;
    sc.push(l === "" && x === "" ? { line_id: tr.dataset.fsc, surcharge_label: "", surcharge_pct: "", surcharge_amount: "", _no: tr.dataset.no, _k: "" }
      : { line_id: tr.dataset.fsc, surcharge_label: l, surcharge_pct: k === "pct" ? x : "", surcharge_amount: k === "amt" ? x : "", _no: tr.dataset.no, _k: k });
  });
  if(sc.length) o.surcharges = sc;
  return o;
}
function finSend(o){   // surcharge-3 — 화면 표지 칸(_no · _k)은 서버에 보내지 않는다
  if(!o.surcharges) return o;
  return Object.assign({}, o, { surcharges: o.surcharges.map(x => ({ line_id: x.line_id, surcharge_label: x.surcharge_label, surcharge_pct: x.surcharge_pct, surcharge_amount: x.surcharge_amount })) });
}
function finCheck(o){
  if(o.charges && !(Number.isFinite(o.charges[0].amount) && o.charges[0].amount >= 0)) return "Freight must be a number, 0 or more — leave it empty for no freight line.";
  for(const x of (o.surcharges || [])){
    const bad = scBad(x.surcharge_label, x._k || "pct", x._k === "amt" ? x.surcharge_amount : x.surcharge_pct);
    if(bad) return `Line ${x._no}: ${bad}`;
  }
  return null;
}

/* ══ 2판(2026-09-25 · Caleb 「so.html 2판 가자」) — 보류 · 풀기 · 나누기 · 창고 바꾸기 · 백오더 진행 · 병합 ══
   ⭐ 전부 DB 창구의 미리 보기(p_commit false)를 먼저 보이고 같은 입력으로 실행한다 · 권한은 manager(병합은 초안만이면 sales)
   ⭐ 결과 모양은 확정 미리 보기와 같다(so_allocate_run 의 lines · siblings) — 같은 표로 그린다 */
/* v2.1 — 줄의 예약 글자(Caleb 2026-09-25 「not reserved가 직관적이고 좋겠어」) — hold 는 「잡지 않고 멈춰 둔」 것이라 not reserved 로 읽힌다 */
function resLabel(x){
  const n = qty(x.qty_allocated);
  if(x.kind === "allocated") return `<span class="on" style="font-size:11.5px">reserved ${n}</span>`;
  if(x.kind === "hold")      return `<span class="neutral" style="font-size:11.5px" title="On hold — stock is not held for this order; other orders can use it">not reserved ${n} <span class="dim">· on hold</span></span>`;
  if(x.kind === "backorder") return `<span class="neutral" style="font-size:11.5px" title="Waiting for stock — Proceed backorder when it arrives">backorder ${n}</span>`;
  if(x.kind === "preorder")  return `<span class="neutral" style="font-size:11.5px" title="Preorder — not reserved until it is proceeded">preorder ${n}</span>`;
  return `<span class="dim" style="font-size:11.5px">${esc(x.kind)} ${n}</span>`;
}
function planTable(data, done){
  const lines = data.lines || [];
  return `<table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th>Result</th><th class="num">Reserved</th><th class="num">Backorder</th><th class="num">Preorder</th></tr></thead>
    <tbody>${lines.map(l => `<tr><td class="num">${esc(l.line_no ?? "")}</td><td class="mono">${esc(l.sku || "")}${l.combo ? ' <span class="tag">combo</span>' : ""}</td><td class="num">${qty(l.qty_ordered)}</td>
      <td>${esc(l.kind || "")}</td><td class="num">${qty(l.allocated)}</td>
      <td class="num">${Number(l.backordered) ? `<span class="neutral">${qty(l.backordered)}</span>` : '<span class="dim">0</span>'}</td>
      <td class="num">${Number(l.preorder) ? `<span class="neutral">${qty(l.preorder)}</span>` : '<span class="dim">0</span>'}</td></tr>`).join("") || '<tr><td colspan="7" class="dim">No line changes.</td></tr>'}</tbody></table>
    ${(data.siblings || []).length ? `<div class="sosub">${done ? "Split off" : "Will split off"}: ${data.siblings.map(x => `${esc(x.so_number || "")} ${esc(x.split_reason || "")}`).join(" · ")}</div>` : ""}
    ${(data.warnings || []).length ? `<div class="sowarn">${warnChips(data.warnings)}</div>` : ""}`;
}
/* 미리 보기 → 실행 한 벌 — rpc 이름 · 인자 · 제목 · 그리기 */
/* v2.3 — guard(data) 가 문장을 돌려주면 실행 단추를 막고 그 문장을 보인다(Caleb 2026-09-25 · 재고 없는 Proceed 가 「걸어 두면 들어올 때 잡힌다」로 오해될 수 있다) */
const NOTHING_TO_RESERVE = "Nothing can be reserved yet — there is no stock for these lines in this warehouse. Proceed does not wait for stock: press it again after stock arrives (Backorders shows \"arrived\" when a receipt or transfer lands).";
const noneReserved = (d) => { const ls = d.lines || []; return ls.length && !ls.some(l => Number(l.allocated) > 0) ? NOTHING_TO_RESERVE : null; };
function previewThenRun(title, rpc, args, draw, goLabel, after, guard){
  modalOpen(`
    <h4>${title}</h4>
    <div class="pbody"><div id="pvOut2"><div class="msg">Checking…</div></div><div id="pvMsg2" style="margin-top:10px;font-size:12.5px"></div></div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn go" id="pvGo2" disabled>${goLabel}</button>
    </div>`);
  wireModalClose();
  (async () => {
    const { data, error } = await sb.rpc(rpc, Object.assign({}, args, { p_commit: false }));
    if(error){ document.getElementById("pvOut2").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    document.getElementById("pvOut2").innerHTML = draw(data, false);
    const block = guard ? guard(data) : null;
    if(block){ say("pvMsg2", "err", block); return; }
    say("pvMsg2", "", "Nothing is saved until you press " + goLabel + ".");
    const go = document.getElementById("pvGo2"); go.disabled = false;
    go.onclick = async () => {
      say("pvMsg2", "", "Working…"); go.disabled = true;
      const r = await sb.rpc(rpc, Object.assign({}, args, { p_commit: true }));
      if(r.error){ say("pvMsg2", "err", r.error.message); go.disabled = false; return; }
      document.getElementById("pvOut2").innerHTML = draw(r.data, true);
      say("pvMsg2", "on", "Done.");
      const cl = document.querySelector('#modalBox [data-m="close"]');
      cl.textContent = "Close"; cl.onclick = async () => { modalClose(); if(after) await after(r.data); else await reloadHere(); };
    };
  })();
}

/* v2.4 — Release to WMS · 거둬들이기(⑤-4 ⬜H · 창구 so_release_to_wms · so_wms_recall · 여러 오더를 받지만 이 화면은 지금 오더 하나) */

async function recallSo(){

  const { error } = await sb.rpc("so_wms_recall", { p_so_ids: [curId] });
  if(error){ alert(error.message); return; }
  await reloadHere();
}

/* 보류 — 오더 전체의 할당을 풀고 hold 로 건다(R3 · 보류는 늘 오더 전체) · 풀기 = 다시 엔진을 돌려 잡을 수 있는 만큼 잡는다 */
async function holdSo(){
  if(!confirm(`Put ${cur.so.so_number} on hold? Reserved stock is released for other orders; the lines stay on the order. Release the hold later to reserve again.`)) return;
  const { data, error } = await sb.rpc("so_hold", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  await reloadHere();
  if(data) setTimeout(() => alert(`On hold — ${data.lines_held} line(s).`), 30);
}
async function releaseHold(){
  if(!confirm(`Release the hold on ${cur.so.so_number}? Stock is reserved again as far as it is available — the rest becomes a backorder order.`)) return;
  const { data, error } = await sb.rpc("so_reallocate", { p_so_id: curId });
  if(error){ alert(error.message); return; }
  modalOpen(`<h4>Hold released — ${esc(cur.so.so_number)}</h4><div class="pbody">${planTable(data, true)}</div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Close</button></div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = async () => { modalClose(); await reloadHere(); };
}

/* 나누기 — 줄(또는 줄의 일부)을 새 형제 오더로 옮긴다(split_reason manual) · 예약은 따라간다 */
function openDivide(){
  const lines = (cur.lines || []);
  modalOpen(`
    <h4>Divide ${esc(cur.so.so_number)} — move lines to a new order</h4>
    <div class="pbody">
      <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th class="num">Move</th></tr></thead>
      <tbody>${comboOrder(lines.map(l => Object.assign({ line_id: l.id }, l))).map(l => `<tr${l._comp ? ' class="comp"' : ""}><td class="num">${esc(l.line_no)}</td><td>${l._comp ? '<span class="dim">↳</span> ' : ""}<span class="mono">${esc(l.sku)}</span>${l._combo ? ' <span class="tag">combo</span>' : ""}<div class="dim" style="font-size:11.5px">${esc(l.product_name || "")}${l._comp ? ` · ${esc(qty(l.combo_qty))} per combo` : ""}</div></td>
        <td class="num">${qty(l.qty_ordered)}</td>
        <td class="num">${l._comp ? '<span class="dim" style="font-size:11px" title="Move the combo line — its components follow">follows</span>' : `<input class="qin" type="number" step="${l._combo ? 1 : "any"}" min="0" max="${esc(l.qty_ordered)}" data-mv="${l.id}">`}</td></tr>`).join("")}</tbody></table>
      <div class="sohint">Type how much of each line moves. The whole line or part of it — its reservation goes with it. The new order is a sibling (manual split) and keeps this order's header.${lines.some(l => l.combo_line_id) ? " A combo moves in whole combos — type it on the combo line and its components follow." : ""}</div>
      <div id="dvOut" style="margin-top:10px"></div><div id="dvMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn" id="dvChk">Check</button>
      <button class="pobtn go" id="dvGo" disabled>Divide</button>
    </div>`);
  wireModalClose();
  const moves = () => Array.from(document.querySelectorAll("[data-mv]")).map(i => ({ line_id: i.dataset.mv, qty: Number(i.value) })).filter(m => m.qty > 0);
  document.querySelectorAll("[data-mv]").forEach(i => { i.onchange = () => { document.getElementById("dvGo").disabled = true; }; });
  const run = async (commit) => {
    const mv = moves();
    if(!mv.length){ say("dvMsg", "err", "Type a quantity to move on at least one line."); return; }
    say("dvMsg", "", commit ? "Dividing…" : "Checking…");
    const { data, error } = await sb.rpc("so_divide", { p_so_id: curId, p_moves: mv, p_commit: commit });
    if(error){ say("dvMsg", "err", error.message); return; }
    document.getElementById("dvOut").innerHTML = `<table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th class="num">Moves</th><th>Reservation</th></tr></thead>
      <tbody>${(data.lines || []).map(l => `<tr${l.combo_sku ? ' class="comp"' : ""}><td class="num">${esc(l.line_no)}</td><td class="mono">${l.combo_sku ? `<span class="dim">↳</span> ` : ""}${esc(l.sku)}${l.combo_sku ? ` <span class="dim" style="font-size:11px">for ${esc(l.combo_sku)}</span>` : ""}</td><td class="num">${qty(l.qty_ordered)}</td>
        <td class="num">${qty(l.qty_moved)}${l.whole ? ' <span class="dim">whole line</span>' : ""}</td>
        <td>${l.reserve_kind ? esc(l.reserve_kind) + " · " + qty(l.reserve_follows) + " follows" : '<span class="dim">none</span>'}</td></tr>`).join("")}</tbody></table>
      ${data.sibling ? `<div class="sosub">New order: <b class="mono">${esc(data.sibling.so_number || "")}</b></div>` : ""}`;
    if(commit){
      say("dvMsg", "on", "Divided.");
      const cl = document.querySelector('#modalBox [data-m="close"]');
      cl.textContent = "Close"; cl.onclick = async () => { modalClose(); await reloadHere(); };
      document.getElementById("dvGo").disabled = true; return;
    }
    say("dvMsg", "", "Nothing is saved until you press Divide.");
    document.getElementById("dvGo").disabled = false;
  };
  document.getElementById("dvChk").onclick = () => run(false);
  document.getElementById("dvGo").onclick  = () => run(true);
}

   ⭐ 판정: 머리는 가장 오래된 원본 · 주문일은 합친 날 · 줄은 받은 가격 그대로(manual) · 운임은 안 옮긴다 · 선결제 대상은 옮긴다 · 되돌리기 없음 */
async function openMerge(){

    .eq("customer_id", s.customer_id).eq("location_id", s.location_id).eq("currency_id", s.currency_id).eq("channel", "warehouse")
    .in("status", ["draft", "confirmed"]).order("order_date").order("so_number").limit(100);

      <td class="mono">${esc(o.so_number)}</td><td>${esc(stLbl(o.status))}${o.split_reason ? ` <span class="dim">${esc(o.split_reason.replace("_", " "))}</span>` : ""}</td><td>${dim(o.order_date)}</td><td class="mono">${dim(o.ref)}</td></tr>`).join("")}</tbody></table>
    <div class="sohint">Same customer, warehouse and currency · warehouse orders that are still draft or confirmed. Pick two or more.</div>`;
  const ids = () => Array.from(document.querySelectorAll("[data-mg]:checked")).map(c => c.dataset.mg);
  const upd = () => { document.getElementById("mgChk").disabled = ids().length < 2; };
  document.querySelectorAll("[data-mg]").forEach(c => { c.onchange = upd; }); upd();
  document.getElementById("mgChk").onclick = () => {
    const sel = ids();
    previewThenRun("Merge " + sel.length + " orders into one new draft", "so_merge", { p_so_ids: sel }, drawMerge, "Merge",
      async (d) => { if(d && d.so_id){ q = d.so_number; document.getElementById("q").value = q; document.getElementById("wq").value = q; stFilter = "all";
        document.getElementById("st").value = "all"; document.getElementById("wst").value = "all"; pg.reset(); openSo(d.so_id); } else await reloadHere(); });

}
function data_cust_name(){ return (cur && cur.customer_name) || ""; }
function drawMerge(d, done){
  const diffs = (d.head_diffs || []).map(x => `<tr><td>${esc(String(x.field || "").replace(/_/g, " "))}</td><td>${(x.values || []).map(v => `<span class="mono">${esc(v.so_number || "")}</span> ${esc(v.value === null || v.value === undefined ? "—" : String(v.value))}`).join(" · ")}</td></tr>`);
  const KEPT = { unit_price: "unit price", list_price: "list price", discount_pct: "discount", free_reason: "free reason", price_override: "price set by hand", surcharge: "surcharge", combo_definition: "combo made of different components" };
  const lines = (d.lines || []).map(l => `<tr><td class="num">${esc(l.line_no ?? "")}</td><td class="mono">${esc(l.sku || "")}${l.is_combo ? ' <span class="tag" title="Its components are hung under it again on the new draft">combo</span>' : ""}</td><td class="num">${qty(l.qty)}</td>
    <td class="num">${price(l.unit_price)}</td><td class="num">${l.discount_pct === null || l.discount_pct === undefined ? '<span class="dim">—</span>' : esc(Number(l.discount_pct)) + "%"}</td>
    <td>${l.free_reason ? `<span class="tag">free · ${esc(l.free_reason)}</span>` : ""}${l.kept_apart && Array.isArray(l.differs_in) && l.differs_in.length ? `<span class="dim" style="font-size:11px">kept apart: ${esc(l.differs_in.map(k => KEPT[k] || k).join(", "))}</span>` : ""}</td></tr>`);
  const rq = (d.requote && ((d.requote.lines || []).length + (d.requote.combined || []).length)) ? `
    <div class="sosub">Today's quote would be better for: ${(d.requote.lines || []).map(r => `line ${esc(r.line_no)} ${esc(r.sku)} ${price(r.unit_price)} → ${price(r.quote_unit_price)}`).concat(
      (d.requote.combined || []).map(r => `${esc(r.sku)} as one line of ${qty(r.qty)} → ${price(r.quote_unit_price)}`)).join(" · ")}. Nothing changes by itself — change a line on the new draft if you want it.</div>` : "";
  return `
    <div class="socols">
      <div class="stat">Orders<b style="font-size:13px">${esc((d.orders || []).join(", "))}</b></div>
      <div class="stat">Header from<b class="mono" style="font-size:13px">${esc(d.head_from || "")}</b></div>
      <div class="stat">Order date<b style="font-size:13px">${esc(d.order_date || "")}</b></div>
      ${done ? `<div class="stat">New draft<b class="mono">${esc(d.so_number || "")}</b></div>` : ""}
    </div>
    ${diffs.length ? `<h5 style="margin:12px 0 4px;font-size:12px;color:var(--muted)">HEADER DIFFERS — the oldest order's value is kept · change it on the new draft</h5>
      <table><tbody>${diffs.join("")}</tbody></table>` : ""}
    <h5 style="margin:12px 0 4px;font-size:12px;color:var(--muted)">LINES — prices as they were (set by hand)${(d.lines || []).some(l => l.is_combo) ? " · a combo line brings its components with it" : ""}</h5>
    <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Disc %</th><th></th></tr></thead><tbody>${lines.join("")}</tbody></table>
    ${rq}
    ${(d.charges || []).length ? `<div class="sosub">Freight is not carried over — add it again on the new draft. Was: ${d.charges.map(c => `${esc(c.so_number)} ${esc(c.name)} ${money(c.amount)}`).join(" · ")}</div>` : ""}
    ${(d.payments_to_move || []).length ? `<div class="sosub">Deposits that move to the new order: ${d.payments_to_move.map(p => `${esc(p.paid_on || "")} ${money(p.amount)}`).join(" · ")}</div>` : ""}
    ${(d.backorder_siblings || []).length ? `<div class="sosub">Backorder orders of the originals stay open as they are: ${d.backorder_siblings.map(x => esc(x.so_number)).join(" · ")}</div>` : ""}
    ${(d.warnings || []).length ? `<div class="sowarn">${warnChips(d.warnings)}</div>` : ""}
    ${d.needs_manager ? '<div class="sohint">A confirmed order is included — a manager has to do this merge.</div>' : ""}
    <div class="sohint">The originals are closed as merged. There is no undo — to split it again, take lines off the new draft or use Divide once it is confirmed.</div>`;
}
