<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 문 — 헤더 없음(로그인 카드가 로고를 그린다) · 보내기 전 잠깐 보이는 한 줄 · 보낼 곳이 없거나 비밀번호 복구 중일 때의 카드 */
  .door{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .door .card{max-width:420px;width:100%;padding:28px 26px;text-align:center}
  .door img{height:36px;width:auto;display:block;margin:0 auto 18px}
  .door p{margin:0 0 16px;font-size:13.5px;color:var(--muted);line-height:1.5}
  .door .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .door button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .door button.main{background:#12161c;color:#fff;border-color:#12161c}
</style>
</head>
<body>

<div class="door">
  <div class="card" id="doorCard">
    <img src="asung-logo-dark.png" alt="ASUNG">
    <p id="doorMsg">Opening…</p>
    <div class="row" id="doorBtns"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   index.html — 문 1판 (2026-09-30 · 대화 Claude · lay-2)
   판정 163: index 는 문만 한다 — 로그인 카드(로고 · ims-auth.js 가 그린다)를 보여 주고, 로그인하면 그 사람의 첫 모드 첫 화면으로 보낸다
     모드 순서 IMS · WMS · POS — IMS → dashboard.html · WMS 만 → 첫 보이는 WMS 화면 · POS 만 → pos.html (imsAuth.firstScreen() 이 정한다)
   ⚠️ 옛 내용(Signed in as · Database connection)은 system-check.html 로 옮겼다(판정 158 · 166)
   ⚠️ 비밀번호 복구 — 재설정 메일 링크는 이 주소로 돌아온다(doForgot 의 redirectTo). 복구 중(imsAuth.inRecovery)이면 보내지 말고 머문다.
      새 비밀번호가 저장되면 ims-auth.js 가 "ims:password-changed" 를 내고 그때 보낸다.
      복구 이벤트(PASSWORD_RECOVERY)가 콜백보다 늦게 올 수 있다(짐작) — 주소에 인증 링크 흔적이 있으면 잠깐 기다렸다 다시 묻는다.
   ⚠️ location.replace — 뒤로 가기가 문으로 돌아와 다시 튕기는 고리를 만들지 않는다
   ───────────────────────────────────────────────────────────── */
const DOOR_BUILD = "2026-09-30 · door v1";
console.log("index.html build:", DOOR_BUILD, "· ims-auth", imsAuth.build);

const AUTH_LINK = /access_token|type=|[?&]code=/.test(location.hash + location.search);

function say(msg, btns){
  document.getElementById("doorMsg").textContent = msg;
  const row = document.getElementById("doorBtns");
  row.innerHTML = "";
  (btns || []).forEach(([label, fn, main]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; if (main) b.className = "main";
    b.onclick = fn; row.appendChild(b);
  });
}
function go(){
  const to = imsAuth.firstScreen();
  if (to) { location.replace(to); return; }
  say("No screens are open to your account yet. Please contact your administrator.",
      [["Sign Out", () => imsAuth.signOut()]]);
}
function waitForPassword(){
  say("Set your new password to continue.",
      [["Set password", () => imsAuth.changePassword(), true], ["Sign Out", () => imsAuth.signOut()]]);
  document.addEventListener("ims:password-changed", () => { say("Password changed. Opening…"); go(); }, { once: true });
}

imsAuth.start({ changePw: true }, () => {
  if (imsAuth.inRecovery) { waitForPassword(); return; }
  if (!AUTH_LINK) { go(); return; }
  // 인증 링크로 들어왔다 — 복구 이벤트가 늦게 올 수 있으니 잠깐 기다렸다 다시 묻는다
  setTimeout(() => { if (imsAuth.inRecovery) waitForPassword(); else go(); }, 500);
});
</script>
</body>
</html>
