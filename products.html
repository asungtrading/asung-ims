<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:360px;flex:0 0 360px}
  .list .rows{max-height:calc(100vh - 270px)}
  main{display:flex;flex-direction:column;gap:14px}
  /* 목록 한 줄: 캐럿 + 본문 */
  .list .row{display:flex;gap:7px;align-items:flex-start;padding:8px 12px}
  .list .row .car{width:14px;flex:0 0 14px;color:var(--muted);font-size:11px;line-height:1.5;
    text-align:center;border-radius:4px}
  .list .row .car:hover{background:#eef1f6;color:var(--ink)}
  .list .row .car.none{visibility:hidden}
  .list .row .body{flex:1;min-width:0}
  .list .row .sku{font-family:var(--mono);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .list .row.cur .sku{color:#3b5bdb}
  .list .row .nm{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .list .kid{padding-left:33px;background:#fcfdfe}
  .flt{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}

  /* 머리의 동작 단추 자리 */
  .head .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
  .head .acts .hint{font-size:12px;color:var(--muted)}
  .editing{outline:2px solid #3b5bdb22;border-radius:12px}

  /* 고치기 칸 — 판정 202 · 바꾼 칸은 노랗게 */
  .ein{width:100%;border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px;background:#fff}
  .ein.mono{font-family:var(--mono)}
  .ein.sm{width:110px}
  textarea.ein{min-height:52px;resize:vertical}
  .chg{background:#fff6d6 !important;border-color:#e8cf7a !important}
  .addrow{display:flex;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .addrow .ein{width:auto;flex:1;min-width:120px}
  .newtag{font-size:11px;color:var(--good);font-weight:600}
  tr.offrow td{text-decoration:line-through;color:var(--muted)}

  /* 사진 — 판정 193 · 194 */
  .ph{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
  .ph .big{width:240px;height:240px;border:1px solid var(--line);border-radius:12px;background:#fff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .ph .big img{max-width:100%;max-height:100%;object-fit:contain}
  .ph .big .from{position:absolute;left:8px;bottom:8px;font-size:11px;background:#fff8e6;color:var(--warn);
    border:1px solid #ecdcb4;border-radius:6px;padding:1px 6px}
  .ph .thumbs{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:0}
  .ph .th{width:104px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
  .ph .th .im{height:96px;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
  .ph .th .im img{max-width:100%;max-height:100%;object-fit:contain}
  .ph .th .ops{display:flex;gap:3px;justify-content:center;padding:4px;border-top:1px solid var(--line);flex-wrap:wrap}
  .ph .th.pri{border-color:#3b5bdb}
  .ph .th .ops .xbtn{padding:1px 5px;font-size:11px}
  .ph .none{color:var(--muted);font-size:12.5px}

  /* 경고 대화상자 — 판정 176 · 202 */
  .res h5{margin:6px 0 6px;font-size:12.5px}
  .res ul{margin:0 0 12px;padding-left:18px;font-size:12.5px;line-height:1.55}
  .res .blk li{color:var(--bad)}
  .res .wrn li{color:var(--warn)}
  .res .sk{font-family:var(--mono);font-weight:600;color:var(--ink)}
  .zoom{max-width:100%;max-height:70vh;display:block;margin:0 auto}
  /* 만들기 대화상자 — v2b · 판정 177 · 180 ~ 184 */
  .newbar{display:flex;gap:8px}
  .newbar .pobtn{flex:1}
  .pobox.wide{max-width:1180px}
  .fg{display:grid;grid-template-columns:130px 1fr 130px 1fr;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .fg .full{grid-column:2 / span 3}
  .sub{font-size:12.5px;font-weight:700;color:var(--ink);margin:14px 0 6px}
  .vt{width:100%;border-collapse:collapse;font-size:12.5px}
  .vt th{text-align:left;font-weight:600;color:var(--muted);padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
  .vt td{padding:4px 4px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
  .vt .ein{min-width:70px}
  .ghost{color:var(--muted);font-size:11.5px}
  .bchint{font-size:11.5px;margin-top:3px}
  .bchint.bad{color:var(--bad)} .bchint.warn{color:var(--warn)}
  .ein.bcbad{border-color:#e7a29b;background:#fdf1ef}
  .ein.bcwarn{border-color:#e8cf7a;background:#fff8e6}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <div class="newbar" id="newBar" hidden>
        <button class="pobtn go" id="newProductBtn">New product</button>
        <button class="pobtn" id="newFamilyBtn">New family</button>
      </div>
      <input type="search" id="q" placeholder="Search SKU or name">
      <div class="opts">
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
        <a class="lnk" id="sheetLink" href="product-sheet.html" style="margin-left:auto;font-size:12px">Open sheet</a>
        <label>Kind
          <select id="kind">
            <option value="single">Singles</option>
            <option value="set">Sets only</option>
            <option value="">All</option>
          </select>
        </label>
      </div>
      <div class="opts">
        <input list="brandList" id="brand" placeholder="Brand" class="flt">
        <datalist id="brandList"></datalist>
        <datalist id="catList"></datalist>
        <datalist id="unitList"></datalist>
        <select id="cat" style="flex:1;min-width:0">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="opts">
        <input list="supList" id="sup" placeholder="Supplier" class="flt">
        <datalist id="supList"></datalist>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Search for a product.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>
<input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" multiple hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Products — 한 상품 보기 · 고치기 · 사진 · 만들기 (pr v2f · 2026-10-01 · v2e 위에 새 공급처 줄에 공급처 통화 · 단가 옆 통화 표시)
   정본: docs/design/po-module.md §3-h(창구 — 실물 · 사진 — 실물) · so-module §31 · §33 · §34
   판정: 145(쉽고 빠르게) · 176(검사 → 경고 확인 → 저장 · 서버가 지킨다) · 187(고치기 = 창구 하나 · 목록)
         188(빼기 = 끄기) · 189(세트 SKU 따라감) · 193 · 194(사진) · 200 · 201 · 202(Edit 한 번 → Save 한 번)
   창구: product_update(p_changes, p_commit, p_ack) — 마지막 정의 20261001152712(img-1) · 열일곱 op
         product_image_primary(text[]) — 세트 → 낱개 사진(from_parent)
   ⚠️ 쓰기는 창구로만 — 상품 계열 표는 authenticated 에게 select 만(prod-2)
   ⚠️ 모든 줄은 「화면이 처음 본 SKU」로 가리킨다 — 같은 저장에서 SKU 를 바꿔도 서버가 검사 때 푼 id 로 저장(4a 이견 3)
   ⚠️ 18,714행이다. 목록을 훑는 화면이 아니라 검색해서 들어가는 화면이다.
   ⚠️ 제품은 감추지 않는다(Caleb 2026-09-15) — 비활성·대체 UPC 도 찾을 일이 있다.
   ⭐ 세트·콤보는 다른 것이다: 세트 = parent_product_id + pack_factor · 콤보 = product_bom 의 부모
   ───────────────────────────────────────────────────────────── */
const PR_BUILD = "pr v2f";
const BUCKET = "product-images";
const MAX_PHOTO = 5 * 1024 * 1024;              // 상자 한도와 같다(img-1 · Caleb 확인 7 MB 거부)
const PHOTO_TYPES = ["image/jpeg", "image/png", "image/webp"];

let sb=null, isAdmin=false, canEdit=false, showDead=false;
let detailSeq = 0;
let q="", onlyActive=true, kind="single", brand="", cat="", supId="", curId=null;
const pg = imsPage(100);
let openSets = {};
let refs = { brands:[], cats:[], units:[], tiers:[], suppliers:[], supByName:{}, axes:[], cur:{} };
let cur = null;      // 지금 상세에 그린 상품의 읽은 것 전부
let edit = null;     // 고치는 중이면 { id, addBc:[], addSup:[] } — 입력값은 DOM 에서 읽는다

function photoUrl(path){ return `${window.IMS_CONFIG.SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path.split("/").map(encodeURIComponent).join("/")}`; }

/* ⚠️ PostgREST 는 한 번에 1,000 행까지 — 그 너머는 쪽을 넘긴다 */
async function fetchAll(table, select, build){
  const out = [];
  for(let from = 0; ; from += 1000){
    let qy = sb.from(table).select(select).range(from, from + 999);
    if(build) qy = build(qy);
    const { data, error } = await qy;
    if(error) throw error;
    out.push(...(data||[]));
    if(!data || data.length < 1000) break;
  }
  return out;
}

function clearDetail(){
  curId = null; cur = null; edit = null;
  detailSeq++;
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Search for a product.</div></div>';
}
function leaveEditOk(){
  if(!edit) return true;
  if(!buildChanges().length) { edit = null; return true; }
  if(confirm("You have unsaved changes. Discard them?")) { edit = null; return true; }
  return false;
}

/* ── 목록 ─────────────────────────────────────────────── */
async function loadList(){
  const cols = "id,sku,name,is_active,parent_product_id,pack_factor,brand_name,category_name";
  /* ⭐ 공급처로 거르기(판정 151) — product_supplier 를 !inner 로 묶어 그 공급처의 켜진 줄이 있는 상품만 */
  let qry = supId
    ? sb.from("product").select(cols + ",product_supplier!inner(supplier_id,is_active)", { count:"exact" })
        .eq("product_supplier.supplier_id", supId).eq("product_supplier.is_active", true)
    : sb.from("product").select(cols, { count:"exact" });
  if(onlyActive) qry = qry.eq("is_active", true);
  if(kind==="single") qry = qry.is("parent_product_id", null);
  if(kind==="set")    qry = qry.not("parent_product_id", "is", null);
  if(brand) qry = qry.eq("brand_name", brand);
  if(cat)   qry = qry.eq("category_name", cat);
  if(q) qry = qry.or(`sku.ilike.%${q}%,name.ilike.%${q}%`);

  const { data, error } = await pg.run(qry.order("sku"));
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  let hasKids = {};
  if(kind !== "set" && data.length){
    const ids = data.filter(r => !r.parent_product_id).map(r => r.id);
    if(ids.length){
      const { data: kd } = await sb.from("product")
        .select("id,sku,name,pack_factor,is_active,parent_product_id")
        .in("parent_product_id", ids).order("pack_factor");
      (kd||[]).forEach(k => { (hasKids[k.parent_product_id] = hasKids[k.parent_product_id] || []).push(k); });
    }
  }

  const rowHtml = (r, isKid) => {
    const kids = hasKids[r.id] || [];
    const car = (!isKid && kids.length)
      ? `<span class="car" data-toggle="${r.id}">${openSets[r.id] ? "▾" : "▸"}</span>`
      : `<span class="car none">·</span>`;
    const tags = [];
    if(r.parent_product_id) tags.push(`<span class="tag">×${esc(r.pack_factor)}</span>`);
    else if(kids.length)    tags.push(`<span class="tag">${kids.length} set${kids.length>1?"s":""}</span>`);
    if(!r.is_active) tags.push('<span class="tag off">inactive</span>');
    return `<div class="row ${isKid?"kid":""} ${r.id===curId?"cur":""}" data-id="${r.id}">
      ${car}
      <div class="body">
        <div class="sku">${esc(r.sku)}${tags.join("")}</div>
        <div class="nm">${esc(r.name)}</div>
      </div>
    </div>`;
  };

  /* ⚠️ [실사고 2026-09-15] 같은 세트가 두 번 그려졌다 — 펼쳐서 이미 보인 것은 본체에서 건너뛴다 */
  const shownAsKid = new Set();
  data.forEach(r => { if(openSets[r.id]) (hasKids[r.id]||[]).forEach(k => shownAsKid.add(k.id)); });

  let html = "";
  data.forEach(r => {
    if(shownAsKid.has(r.id)) return;
    html += rowHtml(r, false);
    if(openSets[r.id]) (hasKids[r.id]||[]).forEach(k => { html += rowHtml(k, true); });
  });
  document.getElementById("rows").innerHTML = html || '<div class="msg">No products match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.dataset.toggle) return;
      if(el.dataset.id === curId) return;
      if(!leaveEditOk()) return;
      curId = el.dataset.id; loadList(); loadDetail(curId);
    };
  });
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); const k = el.dataset.toggle; openSets[k] = !openSets[k]; loadList(); };
  });

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

/* ── 상세 읽기 ─────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [p, bar, sup, bom, kids, pri, img] = await Promise.all([
    sb.from("product").select("*").eq("id", id).maybeSingle(),
    sb.from("product_barcode").select("*").eq("product_id", id).order("is_primary", {ascending:false}),
    sb.from("product_supplier").select("*, supplier(name)").eq("product_id", id).order("is_default", {ascending:false}),
    sb.from("product_bom").select("*").eq("parent_product_id", id),
    sb.from("product").select("id,sku,name,pack_factor,is_active").eq("parent_product_id", id).order("sku"),
    sb.from("product_price").select("id,tier_id,price,is_active,source").eq("product_id", id),
    sb.from("product_image").select("*").eq("product_id", id).order("sort_order").order("created_at"),
  ]);
  if(p.error || !p.data){ box.innerHTML = `<div class="card"><div class="msg err">${esc(p.error ? p.error.message : "Product not found.")}</div></div>`; return; }
  const r = p.data;

  let comps = [];
  if((bom.data||[]).length){
    const ids = bom.data.map(b => b.component_product_id).filter(Boolean);
    const { data: cp } = await sb.from("product").select("id,sku,name").in("id", ids);
    const map = {}; (cp||[]).forEach(x => map[x.id] = x);
    comps = bom.data.map(b => Object.assign({}, b, { c: map[b.component_product_id] || null }));
  }
  let parent = null, family = null, sibs = [];
  if(r.parent_product_id){
    const { data } = await sb.from("product").select("id,sku,name").eq("id", r.parent_product_id).maybeSingle();
    parent = data;
  }
  if(r.family_id){
    const { data } = await sb.from("product_family").select("id,sku,name,option1_name,option2_name,option3_name").eq("id", r.family_id).maybeSingle();
    family = data;
    const { data: sb2 } = await sb.from("product")
      .select("id,sku,name,is_active,option1_value,option2_value,option3_value")
      .eq("family_id", r.family_id).is("parent_product_id", null).order("sku").range(0, 199);
    sibs = (sb2||[]).filter(x => x.id !== id);
  }
  /* 사진 — 켜진 것만 쓴다 · 세트에 켜진 사진이 없으면 낱개의 대표(판정 194 · 저장엔 복사 안 함) */
  const imgs = (img.data||[]).filter(x => x.is_active)
    .sort((a,b) => (b.is_primary - a.is_primary) || (a.sort_order - b.sort_order));
  const imgsOff = (img.data||[]).length - imgs.length;
  let fallback = null;
  if(!imgs.length && r.parent_product_id){
    const { data: fp } = await sb.rpc("product_image_primary", { p_skus: [r.sku] });
    const f = (fp||[])[0];
    if(f && f.storage_path && f.from_parent) fallback = f;
  }

  if(seq !== detailSeq) return;
  cur = { r, bar: bar.data||[], sup: sup.data||[], prices: pri.data||[], kids: kids.data||[], comps, parent, family, sibs, imgs, imgsOff, fallback };
  render();
}

/* ── 그리기 ───────────────────────────────────────────── */
const kvT = rows => `<table class="kv"><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;
const tbl = (title, n, head, rows, empty, extra, btn) => `
  <div class="card"><h3>${title} <span class="n">${n}</span>${btn||""}</h3>
    ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`
                  : `<div class="msg">${empty||"None."}</div>`}${extra||""}</div>`;

function render(){
  if(!cur) return;
  const box = document.getElementById("detail");
  box.innerHTML = (edit && edit.id === cur.r.id) ? renderEdit() : renderRead();
  wireDetail(box);
}

function headChips(r){
  const chips = [];
  chips.push(`<span class="chip ${r.is_active?"good":"bad"}">${r.is_active?"active":"inactive"}</span>`);
  chips.push(`<span class="chip">${r.parent_product_id ? "set ×"+esc(r.pack_factor) : "single"}</span>`);
  if(cur.comps.length) chips.push(`<span class="chip warn">combo · ${cur.comps.length} components</span>`);
  if(r.is_discontinued) chips.push('<span class="chip bad">discontinued</span>');
  if(r.sellable===false) chips.push('<span class="chip">not sellable</span>');
  if(r.cin7_type) chips.push(`<span class="chip">${esc(r.cin7_type)}</span>`);
  chips.push(`<span class="chip">${esc(r.source)}</span>`);
  return chips.join("");
}

function renderRead(){
  const { r, comps, parent, family, sibs } = cur;
  const left = [
    ["Brand", dim(r.brand_name)], ["Category", dim(r.category_name)],
    ["UOM", `<span class="mono">${dim(r.uom_name)}</span>`],
    ["Pack factor", `<span class="mono">${dim(r.pack_factor)}</span>`],
    ...(r.parent_product_id ? [["Set discount", r.set_discount_pct==null ? '<span class="dim">—</span>' : `<span class="mono">${esc(r.set_discount_pct)}%</span>`]] : []),
    ["Parent", parent ? `<span class="mono lnk" data-go="${parent.id}">${esc(parent.sku)}</span>` : '<span class="dim">—</span>'],
    ["Family", family ? `<a class="lnk mono" href="families.html?id=${esc(family.id)}">${esc(family.sku)}</a> ${esc(family.name)}` : '<span class="dim">—</span>'],
    ["Options", [r.option1_value,r.option2_value,r.option3_value].filter(Boolean).map(esc).join(" · ") || '<span class="dim">—</span>'],
    ["Weight", r.weight ? `${esc(r.weight)} ${esc(r.weight_unit||"")}` : '<span class="dim">—</span>'],
    ["Note", r.note ? esc(r.note) : '<span class="dim">—</span>'],
  ];
  const right = [
    ["Inventory acct", `<span class="mono">${dim(r.inventory_account_code)}</span>`],
    ["COGS acct", `<span class="mono">${dim(r.cogs_account_code)}</span>`],
    ["Revenue acct", `<span class="mono">${dim(r.revenue_account_code)}</span>`],
    ["Purchase tax", dim(r.purchase_tax_rule)],
    ["Costing", dim(r.costing_method)],
    ["HS code", `<span class="mono">${dim(r.hs_code)}</span>`],

  const kidRows = cur.kids.map(k => `<tr>

  return `
    <div class="card">
      <div class="head">
        <div class="sk">${esc(r.sku)}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${headChips(r)}</div>

    ${tbl("Suppliers" + (supDead && isAdmin

          supShow.length, ["Supplier","Supplier SKU","Fixed","Latest","Cur","Last supplied","Default","Active"], supRows,
          r.parent_product_id ? "None — sets are bought through the parent." : (supDead ? "None active." : "None."))}
    ${tbl("Barcodes", cur.bar.length, ["Barcode","Primary","Valid from","Active"], barRows)}
    ${comps.length ? tbl("Components", comps.length, ["SKU","Name","Qty"], bomRows) : ""}
    ${kidRows.length ? tbl("Sets of this product", kidRows.length, ["SKU","Name","Pack factor","Active"], kidRows) : ""}

/* 브랜드 · 분류 · 단위 — 글자로 좁혀지는 칸(datalist) · 이름 ↔ id(대소문자 무시)
   ⭐ 목록에 없는 글자는 "?글자" 로 들고 있다가 저장 전에 막는다(칸 빨강) */
const REFS = { brand:["brands","brandList"], cat:["cats","catList"], unit:["units","unitList"] };
function refName(kind, id){ if(!id) return ""; if(String(id).startsWith("?")) return String(id).slice(1); const x = refs[REFS[kind][0]].find(y => y.id === id); return x ? x.name : ""; }
function refId(kind, text){ const v = (text || "").trim(); if(!v) return null; const x = refs[REFS[kind][0]].find(y => y.name.toLowerCase() === v.toLowerCase()); return x ? x.id : "?" + v; }
function refIn(kind, attrs, id, fallbackName){ const nm = refName(kind, id) || (id && !String(id).startsWith("?") ? (fallbackName || "") : ""); return `<input class="ein" ${attrs} list="${REFS[kind][1]}" value="${esc(nm)}" autocomplete="off">`; }
const badRef = id => !!id && String(id).startsWith("?");

  });

  /* 바코드 — 켜진 것만 고친다 · 대표는 켜진 것 중에서 · 새로 더한 것은 저장한 뒤 대표로 */

    .concat(edit.addBc.map((bc, i) => `<tr><td class="mono">${esc(bc)} <span class="newtag">new</span></td><td class="dim">—</td>

/* ── 바꾼 것 → product_update 줄 목록(판정 187 · 칸마다 old) ──────── */
const s = v => (v === null || v === undefined) ? null : String(v);
const blankNull = v => { const t = (v ?? "").toString().trim(); return t === "" ? null : t; };
function scalarOrig(r, k){
  switch(k){
    case "is_discontinued": return !!r.is_discontinued;
    case "is_active": return !!r.is_active;
    default: return r[k] === undefined ? null : r[k];
  }
}
function buildChanges(){
  if(!cur || !edit) return [];
  const r = cur.r, sku = r.sku, box = document.getElementById("detail");
  const out = [];

  /* 칸 — 한 줄에 칸 하나 */
  box.querySelectorAll("[data-f]").forEach(el => {
    const k = el.dataset.f;
    const o = scalarOrig(r, k);
    let v, same;
    if(el.type === "checkbox"){ v = el.checked; same = (v === o); }
    else if(el.dataset.ref){
      const nowName = el.value.trim(), oldName = refName(el.dataset.ref, o) || (k === "brand_id" ? r.brand_name : k === "category_id" ? r.category_name : r.uom_name) || "";
      if(nowName.toLowerCase() === oldName.toLowerCase()){ el.classList.remove("bcbad","chg"); return; }   // 글자가 같으면 안 바뀐 것(목록에 없는 옛 값 포함)
      v = refId(el.dataset.ref, nowName);
      el.classList.toggle("bcbad", badRef(v));
      if(badRef(v)){ el.classList.remove("chg"); out.push({ __bad: k }); return; }
      same = (v === (o === null ? null : String(o)));
    }
    else {
      v = blankNull(el.value);
      if(["weight","pack_factor","set_discount_pct"].includes(k)) same = (v === null && o === null) || (v !== null && o !== null && Number(v) === Number(o));
      else same = (v === (o === null ? null : String(o)));
    }
    el.classList.toggle("chg", !same);
    if(!same) out.push({ op:"set", sku, field:k, value: v, old: s(o) });
  });

  /* 판매가 */
  box.querySelectorAll("[data-price]").forEach(el => {
    const t = el.dataset.price;
    const x = cur.prices.find(pp => pp.tier_id === t && pp.is_active);
    const v = blankNull(el.value);
    let changed = false;
    if(x && v === null){ out.push({ op:"price_off", sku, tier_id:t, old: String(x.price) }); changed = true; }
    else if(v !== null && (!x || Number(v) !== Number(x.price))){
      const line = { op:"price_set", sku, tier_id:t, price: v };
      if(x) line.old = String(x.price);
      out.push(line); changed = true;
    }
    el.classList.toggle("chg", changed);
  });

  /* 공급처 — 바꾼 칸만 · 그 칸의 old 를 함께 */
  const supLive = cur.sup.filter(x => x.is_active);
  supLive.forEach(x => {
    const off = box.querySelector(`[data-supoff="${x.supplier_id}"]`);
    if(off && off.checked) return;                          // 끄는 줄은 아래에서
    const line = { op:"supplier_set", sku, supplier_id:x.supplier_id }, old = {};
    let any = false;
    box.querySelectorAll(`[data-sup="${x.supplier_id}"]`).forEach(el => {
      const k = el.dataset.k, v = blankNull(el.value), o = x[k];
      const same = (k === "supplier_sku") ? (v === (o ?? null)) : ((v === null && o == null) || (v !== null && o != null && Number(v) === Number(o)));
      el.classList.toggle("chg", !same);
      if(!same){ line[k] = v; old[k] = o == null ? null : String(o); any = true; }
    });
    if(any){ line.old = old; out.push(line); }
  });
  edit.addSup.forEach(n => {
    const line = { op:"supplier_set", sku, supplier_id:n.id };
    { const sp0 = refs.suppliers.find(x => x.id === n.id); if(sp0 && sp0.currency_id) line.currency_id = sp0.currency_id; }
    ["supplier_sku","fixed_cost","cost"].forEach(k => { if(n[k] !== null) line[k] = n[k]; });
    out.push(line);
  });
  const defNow = box.querySelector('[name="supDef"]:checked');
  const defOld = supLive.find(x => x.is_default);
  if(defNow && (!defOld || defNow.dataset.supdef !== defOld.supplier_id)){
    const tgtOff = box.querySelector(`[data-supoff="${defNow.dataset.supdef}"]`);
    if(!(tgtOff && tgtOff.checked)) out.push({ op:"supplier_default", sku, supplier_id: defNow.dataset.supdef });
  }
  box.querySelectorAll("[data-supoff]").forEach(el => { if(el.checked) out.push({ op:"supplier_off", sku, supplier_id: el.dataset.supoff }); });

  /* 바코드 — 더하기 · 대표 · 끄기 */
  edit.addBc.forEach(bc => out.push({ op:"barcode_add", sku, barcode: bc }));
  const priNow = box.querySelector('[name="bcPri"]:checked');
  const priOld = cur.bar.find(b => b.is_active && b.is_primary);
  if(priNow && (!priOld || priNow.dataset.bcpri !== priOld.barcode)){
    const tgtOff = box.querySelector(`[data-bcoff="${CSS.escape(priNow.dataset.bcpri)}"]`);
    if(!(tgtOff && tgtOff.checked)) out.push({ op:"barcode_primary", sku, barcode: priNow.dataset.bcpri });
  }
  box.querySelectorAll("[data-bcoff]").forEach(el => { if(el.checked) out.push({ op:"barcode_off", sku, barcode: el.dataset.bcoff }); });

  const bad = out.filter(x => x.__bad).length, lines = out.filter(x => !x.__bad);
  const c = document.getElementById("chgCount");
  if(c) c.textContent = (lines.length ? `${lines.length} change${lines.length>1?"s":""} — Save checks them first.` : "No changes yet.") + (bad ? ` · ${bad} field${bad>1?"s":""} not in the list` : "");
  if(bad) lines.__bad = bad;
  return lines;
}

/* ── 저장 흐름 한 곳(판정 176) — 검사 → 막기면 보이고 끝 · 경고면 보이고 확인 → 저장 ──
   ⭐ v2b 의 product_create · product_family_create 도 이 함수를 쓴다(창구 이름 · 인자만 다르다) */
async function runWindow(fn, args, onCommitted, onBack){
  document.getElementById("modalBox").classList.remove("wide");
  showModal(`<h4>Checking…</h4><div class="pbody"><div class="msg">Checking with the server…</div></div>`);
  const r1 = await sb.rpc(fn, Object.assign({}, args, { p_commit:false, p_ack:[] }));
  if(r1.error){ showResult({ error: r1.error.message }, null, onBack); return false; }
  const d1 = r1.data || {};
  if((d1.blocks||[]).length){ showResult(d1, null, onBack); return false; }
  if(!(d1.warnings||[]).length) return await commit([]);
  return await new Promise(res => showResult(d1, async () => res(await commit(d1.warnings.map(w => w.key))), () => { res(false); if(onBack) onBack(); }));

  async function commit(ack){
    showModal(`<h4>Saving…</h4><div class="pbody"><div class="msg">Saving…</div></div>`);
    const r2 = await sb.rpc(fn, Object.assign({}, args, { p_commit:true, p_ack:ack }));
    if(r2.error){ showResult({ error: r2.error.message }, null, onBack); return false; }
    const d2 = r2.data || {};
    if(d2.committed){ closeModal(); await onCommitted(d2); return true; }
    /* 그 사이 다른 사람이 바꿨다 — 새 막기 · 확인 안 된 경고를 다시 보인다 */
    if((d2.blocks||[]).length){ showResult(d2, null, onBack); return false; }
    return await new Promise(res => showResult(d2, async () => res(await commit((d2.warnings||[]).map(w => w.key))), () => { res(false); if(onBack) onBack(); }));
  }
}
function showModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").hidden = false;
}
function closeModal(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
let modalCancelHook = null;
function showResult(d, onGo, onCancel){
  modalCancelHook = onCancel || null;
  const li = x => `<li>${x.sku ? `<span class="sk">${esc(x.sku)}</span> — ` : ""}${esc(x.message)}</li>`;
  const blocks = d.blocks || [], warns = d.warnings || [];
  const body = d.error
    ? `<div class="msg err">${esc(d.error)}</div>`
    : `${blocks.length ? `<h5>Not saved — fix these first</h5><ul class="blk">${blocks.map(li).join("")}</ul>` : ""}
       ${warns.length ? `<h5>${blocks.length ? "Also" : "Please confirm"}</h5><ul class="wrn">${warns.map(li).join("")}</ul>` : ""}
       ${(d.unacked||[]).length && !blocks.length ? `<div class="note">Something changed since the check — please confirm again.</div>` : ""}`;
  const go = (!d.error && !blocks.length && onGo) ? `<button class="pobtn go" data-m="go">Save anyway</button>` : "";
  showModal(`<h4>${d.error ? "Could not save" : blocks.length ? "Not saved" : "Check before saving"}</h4>
    <div class="pbody res">${body}</div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">${go ? "Cancel" : (modalCancelHook ? "Back" : "Close")}</button>${go}</div>`);
  const box = document.getElementById("modalBox");
  box.querySelector('[data-m="close"]').onclick = () => { closeModal(); if(modalCancelHook){ const h = modalCancelHook; modalCancelHook = null; h(); } };
  const g = box.querySelector('[data-m="go"]');
  if(g) g.onclick = () => { modalCancelHook = null; onGo(); };
}

/* ── 사진(판정 193 · 188 · 판정 197 의 5 MB) ─────────────────── */
async function uploadPhotos(files){
  const r = cur.r, ok = [], skipped = [];
  for(const fl of files){
    if(!PHOTO_TYPES.includes(fl.type)){ skipped.push(`${fl.name}: only JPEG, PNG or WebP`); continue; }
    if(fl.size > MAX_PHOTO){ skipped.push(`${fl.name}: larger than 5 MB`); continue; }
    ok.push(fl);
  }
  if(!ok.length){ showResult({ error: skipped.join(" · ") || "No file chosen." }); return; }
  showModal(`<h4>Uploading…</h4><div class="pbody"><div class="msg" id="upMsg">Uploading ${ok.length} photo(s)…</div></div>`);
  const lines = [], paths = [];
  const hasPrimary = cur.imgs.some(x => x.is_primary);
  for(const fl of ok){
    const ext = fl.type === "image/png" ? "png" : fl.type === "image/webp" ? "webp" : "jpg";
    const path = `${r.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from(BUCKET).upload(path, fl, { contentType: fl.type, upsert:false });
    if(up.error){ skipped.push(`${fl.name}: ${up.error.message}`); continue; }
    paths.push(path);
    let w = null, h = null;
    try { const bm = await createImageBitmap(fl); w = bm.width; h = bm.height; bm.close && bm.close(); } catch(e) {}
    lines.push({ op:"image_add", sku:r.sku, storage_path:path, content_type:fl.type, byte_size:fl.size,
                 file_name:fl.name, width:w, height:h, primary: (!hasPrimary && lines.length === 0) });
  }
  if(!lines.length){ showResult({ error: skipped.join(" · ") }); return; }
  const saved = await runWindow("product_update", { p_changes: lines }, async () => {
    await loadDetail(curId);
    if(skipped.length) showResult({ error: "Saved the others. Skipped: " + skipped.join(" · ") });
  });
  /* 저장 안 됐으면 방금 올린 파일을 지운다(고아 파일 · §34-e ㊿) — 실패해도 조용히 둔다 */
  if(!saved && paths.length){ try { await sb.storage.from(BUCKET).remove(paths); } catch(e) {} }
}
async function photoOp(lines){
  await runWindow("product_update", { p_changes: lines }, async () => { await loadDetail(curId); });
}

/* ── 연결 ─────────────────────────────────────────────── */
function wireDetail(box){
  const sd = box.querySelector("#showDead");
  if(sd) sd.onchange = e => { showDead = e.target.checked; render(); };

  box.querySelectorAll("[data-zoom]").forEach(el => { el.onclick = () => zoomOpen(el.dataset.zoom); });

  box.querySelectorAll("[data-act]").forEach(el => {
    const a = el.dataset.act;
    el.onclick = async () => {
      if(a === "edit"){ edit = { id: cur.r.id, addBc: [], addSup: [] }; render(); return; }
      if(a === "cancel"){ edit = null; render(); return; }
      if(a === "save"){
        const ch = buildChanges();
        if(ch.__bad){ alert("Pick the brand, category or unit from the list (red field)."); return; }
        if(!ch.length){ edit = null; render(); return; }
        const skuLine = ch.find(x => x.op === "set" && x.field === "sku");
        await runWindow("product_update", { p_changes: ch }, async () => afterSave(skuLine ? skuLine.value : null));
        return;
      }
      if(a === "bcAdd"){
        const inp = document.getElementById("bcNew"); const v = blankNull(inp.value);
        if(!v) return;
        if(cur.bar.some(b => b.is_active && b.barcode === v) || edit.addBc.includes(v)){ alert("That barcode is already on this product."); return; }
        keepInputs(() => edit.addBc.push(v)); return;
      }
      if(a === "bcDrop"){ keepInputs(() => edit.addBc.splice(Number(el.dataset.i), 1)); return; }
      if(a === "supAdd"){
        const nm = blankNull(document.getElementById("supNewName").value);
        const hit = nm && refs.supByName[nm.toLowerCase()];
        if(!hit){ alert("Pick a supplier from the list."); return; }
        if(cur.sup.some(x => x.is_active && x.supplier_id === hit.id) || edit.addSup.some(x => x.id === hit.id)){ alert("That supplier is already on this product."); return; }
        const n = { id: hit.id, name: hit.name,
          supplier_sku: blankNull(document.getElementById("supNewSku").value),
          fixed_cost: blankNull(document.getElementById("supNewFixed").value),
          cost: blankNull(document.getElementById("supNewCost").value) };
        keepInputs(() => edit.addSup.push(n)); return;
      }
      if(a === "supDrop"){ keepInputs(() => edit.addSup.splice(Number(el.dataset.i), 1)); return; }

      if(a === "addVariant"){ openFamilyDialog({ familyId: cur.family.id, family: cur.family }); return; }
      if(a === "photoAdd"){ const f = document.getElementById("photoFile"); f.value = ""; f.click(); return; }
      if(a === "photoPrimary"){ await photoOp([{ op:"image_primary", sku:cur.r.sku, image_id: el.dataset.img }]); return; }
      if(a === "photoOff"){ await photoOp([{ op:"image_off", sku:cur.r.sku, image_id: el.dataset.img }]); return; }
      if(a === "photoLeft" || a === "photoRight"){
        const ids = cur.imgs.map(x => x.id), i = Number(el.dataset.i), j = a === "photoLeft" ? i - 1 : i + 1;
        if(j < 0 || j >= ids.length) return;
        [ids[i], ids[j]] = [ids[j], ids[i]];
        await photoOp([{ op:"image_order", sku:cur.r.sku, image_ids: ids }]); return;
      }
    };
  });

  /* 고치는 중 — 칸을 바꿀 때마다 노란 표시 · 바꾼 수 */
  if(edit) box.querySelectorAll("input,select,textarea").forEach(el => {
    el.addEventListener(el.type === "checkbox" || el.type === "radio" || el.tagName === "SELECT" ? "change" : "input", () => buildChanges());
  });
  if(edit) buildChanges();

  /* ⚠️⚠️ [실사고 2026-09-15] 구성품·부모·형제 SKU 를 눌러도 안 넘어갔다 — 이동할 때도 그 SKU 로 검색어를 바꾼다 */
  box.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = async () => {
      if(!leaveEditOk()) return;
      const goId = el.dataset.go;
      const { data } = await sb.from("product").select("sku,parent_product_id").eq("id", goId).maybeSingle();
      if(data){
        q = data.sku; document.getElementById("q").value = data.sku;
        if(data.parent_product_id){ kind = ""; document.getElementById("kind").value = ""; }
      }
      curId = goId; pg.reset();
      await loadList(); await loadDetail(goId);
    };
  });
}
function zoomOpen(path){
  const u = esc(photoUrl(path));
  showModal(`<h4>Photo</h4><div class="pbody"><img class="zoom" src="${u}" alt=""></div>
    <div class="pfoot"><a class="lnk" href="${u}" target="_blank" rel="noopener">Open original</a><span class="sp"></span><button class="pobtn" data-m="close">Close</button></div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = closeModal;

/* 고치는 중에 줄을 더하거나 빼면 다시 그린다 — 이미 친 값을 잃지 않게 옮겨 담는다 */
function keepInputs(mutate){
  const box = document.getElementById("detail");
  const saved = [];
  box.querySelectorAll("input,select,textarea").forEach(el => {
    if(el.id === "bcNew" || el.id.startsWith("supNew")) return;
    saved.push([el, el.type === "checkbox" || el.type === "radio" ? el.checked : el.value]);
  });
  const keyOf = el => ["f","price","sup","k","supdef","supoff","bcpri","bcoff"].map(k => el.dataset[k] || "").join("|") + "|" + el.name;
  const map = new Map(saved.map(([el, v]) => [keyOf(el), v]));
  mutate();
  render();
  document.getElementById("detail").querySelectorAll("input,select,textarea").forEach(el => {
    const k = keyOf(el);
    if(!map.has(k) || el.id === "bcNew" || el.id.startsWith("supNew")) return;
    if(el.type === "checkbox" || el.type === "radio") el.checked = map.get(k); else el.value = map.get(k);
  });
  buildChanges();
}


/* ═══ v2b — 만들기 대화상자(판정 177 · 180 ~ 184 · 200 · 묶음 3 · 4) ═══════════════════════
   ⭐ 창구: product_create(p_items) · product_family_create(p_family, p_items) — 둘 다 runWindow(검사 → 확인 → 저장)
   ⭐ 막기 · 오류로 돌아오면 친 값 그대로 대화상자를 다시 연다(onBack)
   ⭐ 세트는 계수만(판정 177 · SKU · 단위 · 이름은 창구가) · 세트 고정가는 Edit 에서(비우면 계산 가격)
   ⭐ 이름을 비우면 창구가 짓는다 — 세트 <낱개 이름>-<계수>(180) · 변형 <family 이름> - <값>( - <값>)(183 · 184) · family SKU <첫 변형 SKU>FAM(182)
   ⭐ SKU 제안 = 브랜드가 쓰는 앞글자 + 12 · 13 자리 바코드의 끝 6 자리 − 체크 디짓(R1 · R2 와 같은 규칙) — 제안일 뿐 · 사람이 고친다 */
const prefixCache = {};
async function brandPrefix(brandId){
  if(!brandId) return null;
  if(prefixCache[brandId] !== undefined) return prefixCache[brandId];
  const { data } = await sb.from("product").select("sku").eq("brand_id", brandId).eq("is_active", true)
    .is("parent_product_id", null).range(0, 299);
  const cnt = {};
  (data||[]).forEach(x => { const m = /^[A-Z]+/.exec(x.sku || ""); if(m) cnt[m[0]] = (cnt[m[0]]||0) + 1; });
  const best = Object.entries(cnt).sort((a,b) => b[1] - a[1])[0];
  return (prefixCache[brandId] = best ? best[0] : null);
}
async function suggestSku(brandId, barcode){
  const bc = (barcode || "").trim();
  if(!/^\d{12,13}$/.test(bc)) return null;
  const pre = await brandPrefix(brandId);
  return pre ? pre + bc.substr(bc.length - 6, 5) : null;
}
const saleTiers = () => refs.tiers.filter(t => t.purpose === "sale");
const splitList = v => (v || "").split(/[\s,;]+/).map(x => x.trim()).filter(Boolean);
/* 바코드 즉석 확인(v2c) — 읽기만 · 막기 · 알리기는 여전히 창구가 정한다(판정 176 · 179) */
async function barcodeOwners(list){
  const bcs = Array.from(new Set(list.filter(Boolean)));
  if(!bcs.length) return {};
  const { data: rows } = await sb.from("product_barcode").select("barcode,product_id,is_active").in("barcode", bcs);
  const ids = Array.from(new Set((rows||[]).map(r => r.product_id)));
  const pm = {};
  if(ids.length){ const { data: ps } = await sb.from("product").select("id,sku,is_active").in("id", ids); (ps||[]).forEach(x => pm[x.id] = x); }
  const out = {};
  (rows||[]).forEach(r => {
    const p = pm[r.product_id]; if(!p) return;
    const live = p.is_active && r.is_active;
    const o = out[r.barcode] || (out[r.barcode] = { active:[], inactive:[] });
    (live ? o.active : o.inactive).push(p.sku);
  });
  return out;
}
function bcHintText(bc, own){
  if(!own) return null;
  if(own.active.length) return { cls:"bad", text:`${bc} is on active product ${own.active.join(", ")} — it will be blocked` };
  if(own.inactive.length) return { cls:"warn", text:`${bc} is on inactive product ${own.inactive.join(", ")} — you will be asked to confirm` };
  return null;
}
function supPick(name){ const n = (name||"").trim().toLowerCase(); return n ? (refs.supByName[n] || null) : null; }

        <label>Name</label><input class="ein full" id="npName" value="${esc(st.name)}">

        <label>Unit</label>${refIn("unit", 'id="npUnit"', st.unit_id)}
        <label>Weight</label><div style="display:flex;gap:6px"><input class="ein sm mono" id="npW" value="${esc(st.weight)}"><input class="ein sm" id="npWu" value="${esc(st.weight_unit)}" placeholder="kg · g · lb · oz"></div>
        <label>Note</label><input class="ein" id="npNote" value="${esc(st.note)}">
      </div>
      <div class="sub">Sale prices</div>
      <div class="fg">${tiers.map(t => `<label>${esc(t.name)}</label><input class="ein sm mono" data-npprice="${t.id}" value="${esc(st.prices[t.id]||"")}">`).join("")}</div>
      <div class="sub">Supplier</div>
      <div class="fg">

      </div>
      <div class="sub">Sets <span class="ghost">— only the pack factor is needed · SKU becomes ${esc(st.sku || "SKU")}-N · set prices are calculated unless you fix them later in Edit</span></div>
      ${st.sets.length ? `<table class="vt"><thead><tr><th>Pack factor</th><th>Barcodes</th><th>Set discount</th><th>Name</th><th></th></tr></thead><tbody>${setRows}</tbody></table>` : ""}

    </div>

            if(blankNull(x.name) !== null) o.name = blankNull(x.name);

        await runWindow("product_create", { p_items: [item] }, async (d) => {

          await openCreated(it && it.product_id, st.sku);
        }, () => openProductDialog(st));
      }
    };
  });
}

  const rowHtml = (r, i) => `<tr>
      <td><input class="ein mono" data-vr="${i}" data-k="sku" value="${esc(r.sku||"")}" style="min-width:110px"></td>
      ${(axes.length ? axes : ["Option"]).map((a, j) => `<td><input class="ein" data-vr="${i}" data-k="o${j}" value="${esc(r["o"+j]||"")}" placeholder="${esc(a)}"></td>`).join("")}
      <td><input class="ein mono" data-vr="${i}" data-k="bc" value="${esc(r.bc||"")}" placeholder="barcode" style="min-width:120px"></td>
      ${tiers.map(t => `<td><input class="ein mono" data-vr="${i}" data-k="p_${t.id}" value="${esc(r["p_"+t.id]||"")}" style="width:72px;min-width:72px"></td>`).join("")}
      <td><input class="ein mono" data-vr="${i}" data-k="sets" value="${esc(r.sets||"")}" placeholder="6, 12" style="width:72px;min-width:72px"></td>
      <td><input class="ein" data-vr="${i}" data-k="name" value="${esc(r.name||"")}" placeholder="(auto)"></td>
      <td><button class="xbtn" data-nf="rowDrop" data-i="${i}">✕</button></td></tr>`;
  const head = adding
    ? `<div class="fg"><label>Family</label><div class="full mono">${esc(st.family.sku)} <span class="ghost">${esc(st.family.name)} · axes ${esc(axes.join(" / ") || "—")}</span></div></div>`
    : `<div class="fg">
        <label>Family name</label><input class="ein full" id="nfName" value="${esc(st.name)}">
        <label>Family SKU</label><input class="ein mono" id="nfSku" value="${esc(st.sku)}" placeholder="blank = first variant SKU + FAM">
        <label>Brand</label>${refIn("brand", 'id="nfBrand"', st.brand_id)}
        <label>Category</label>${refIn("cat", 'id="nfCat"', st.category_id)}
        <label>Unit</label>${refIn("unit", 'id="nfUnit"', st.unit_id)}
        <label>Option axis 1</label><input class="ein" id="nfAx1" list="axisList" value="${esc(st.ax1)}" placeholder="e.g. Color">
        <label>Option axis 2</label><input class="ein" id="nfAx2" list="axisList" value="${esc(st.ax2)}" placeholder="optional">
        <label>Option axis 3</label><input class="ein" id="nfAx3" list="axisList" value="${esc(st.ax3)}" placeholder="optional">
        <label>Note</label><input class="ein" id="nfNote" value="${esc(st.note)}">
      </div>`;
  const b = openForm(`<h4>${adding ? "Add variants" : "New family"}</h4>
    <div class="pbody">
      ${head}
      <datalist id="axisList">${refs.axes.map(a => `<option value="${esc(a)}">`).join("")}</datalist>
      <div class="sub">Supplier for every variant <span class="ghost">— optional</span></div>
      <div class="fg">
        <label>Supplier</label><input class="ein" id="nfSup" list="supList" value="${esc(st.sup)}">
        <label>Supplier SKU</label><input class="ein mono" id="nfSupSku" value="${esc(st.sup_sku)}" placeholder="leave blank to use each variant SKU">
        <label>Cost</label><input class="ein sm mono" id="nfCost" value="${esc(st.cost)}">
        <label>Fixed cost</label><input class="ein sm mono" id="nfFixed" value="${esc(st.fixed)}">
      </div>
      <div class="sub">Variants <span class="ghost">— name blank = ${adding ? esc(st.family.name) : "family name"} - value · sets = pack factors</span></div>
      <div style="overflow:auto"><table class="vt"><thead><tr><th>SKU</th>${(axes.length ? axes : ["Option"]).map(a => `<th>${esc(a)}</th>`).join("")}<th>Barcode</th>
        ${tiers.map(t => `<th>${esc(t.name)}</th>`).join("")}<th>Sets</th><th>Name</th><th></th></tr></thead>
        <tbody>${st.rows.map(rowHtml).join("")}</tbody></table></div>
      <div style="margin-top:6px"><button class="xbtn" data-nf="rowAdd">+ variant</button>
        ${adding ? "" : `<button class="xbtn" data-nf="axes" title="Redraw the table after changing the axes">Apply axes</button>`}</div>
    </div>
    <div class="pfoot"><span class="ghost">Empty rows are ignored.</span><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" data-nf="go">Check &amp; create</button></div>`);

  const read = () => {
    if(!adding){
      st.name = b.querySelector("#nfName").value; st.sku = b.querySelector("#nfSku").value.trim();
      st.brand_id = refId("brand", b.querySelector("#nfBrand").value); st.category_id = refId("cat", b.querySelector("#nfCat").value); st.unit_id = refId("unit", b.querySelector("#nfUnit").value);
      st.ax1 = b.querySelector("#nfAx1").value; st.ax2 = b.querySelector("#nfAx2").value; st.ax3 = b.querySelector("#nfAx3").value;
      st.note = b.querySelector("#nfNote").value;
    }
    st.sup = b.querySelector("#nfSup").value; st.sup_sku = b.querySelector("#nfSupSku").value; st.cost = b.querySelector("#nfCost").value; st.fixed = b.querySelector("#nfFixed").value;
    b.querySelectorAll("[data-vr]").forEach(el => { st.rows[Number(el.dataset.vr)][el.dataset.k] = el.value; });
  };
  b.querySelector('[data-m="close"]').onclick = closeModal;
  const checkRowBc = async el => {
    const list = splitList(el.value), own = await barcodeOwners(list);
    const hs = list.map(bc => bcHintText(bc, own[bc])).filter(Boolean);
    el.classList.toggle("bcbad", hs.some(h => h.cls === "bad"));
    el.classList.toggle("bcwarn", !hs.some(h => h.cls === "bad") && hs.length > 0);
    el.title = hs.map(h => h.text).join(" · ");
  };
  b.querySelectorAll('[data-k="bc"]').forEach(el => { el.addEventListener("change", () => checkRowBc(el)); if(el.value.trim()) checkRowBc(el); });
  b.querySelectorAll("[data-nf]").forEach(el => {
    el.onclick = async () => {
      const a = el.dataset.nf;
      if(a === "rowAdd"){ read(); st.rows.push({}); openFamilyDialog(st); return; }
      if(a === "rowDrop"){ read(); st.rows.splice(Number(el.dataset.i), 1); if(!st.rows.length) st.rows.push({}); openFamilyDialog(st); return; }
      if(a === "axes"){ read(); openFamilyDialog(st); return; }
      if(a === "go"){
        read();
        const sp = supPick(st.sup);
        if(st.sup.trim() && !sp){ alert("Pick the supplier from the list."); return; }
        const nAx = Math.max(1, [st.ax1, st.ax2, st.ax3].map(x => (x||"").trim()).filter(Boolean).length);
        const rows = st.rows.filter(r => Object.values(r).some(v => (v||"").toString().trim() !== ""));
        if(!rows.length){ alert("Add at least one variant."); return; }
        if(rows.some(r => !(r.sku||"").trim())){ alert("Every variant needs a SKU."); return; }
        if(!adding && [st.brand_id, st.category_id, st.unit_id].some(badRef)){ alert("Pick the brand, category and unit from the list."); return; }
        const items = rows.map(r => {
          const sku = (r.sku||"").trim();
          return {
            sku, name: blankNull(r.name),
            options: Array.from({ length: nAx }, (_, j) => (r["o"+j]||"").trim()),
            barcodes: splitList(r.bc),
            prices: tiers.filter(t => blankNull(r["p_"+t.id]) !== null).map(t => ({ tier_id: t.id, price: blankNull(r["p_"+t.id]) })),
            suppliers: sp ? [{ supplier_id: sp.id, supplier_sku: blankNull(st.sup_sku) ?? sku, cost: blankNull(st.cost), fixed_cost: blankNull(st.fixed), currency_id: sp.currency_id || null, is_default: true }] : [],
            sets: splitList(r.sets).map(n => ({ pack_factor: n, barcodes: [] })),
          };
        });
        const fam = adding ? { id: st.familyId } : {
          sku: blankNull(st.sku), name: blankNull(st.name), brand_id: st.brand_id || null, category_id: st.category_id || null, unit_id: st.unit_id || null,
          option1_name: blankNull(st.ax1), option2_name: blankNull(st.ax2), option3_name: blankNull(st.ax3), note: blankNull(st.note) };
        Object.keys(fam).forEach(k => { if(fam[k] === null) delete fam[k]; });
        await runWindow("product_family_create", { p_family: fam, p_items: items }, async (d) => {
          const it = (d.items || [])[0];
          await openCreated(it && it.product_id, it && it.sku);
        }, () => openFamilyDialog(st));
      }
    };
  });
}

/* 만든 뒤 — 그 상품으로 연다(목록이 고른 것을 알아보게 먼저 검색어를 그 SKU 로) */
async function openCreated(pid, sku){
  if(!pid) { await loadList(); return; }
  q = sku || ""; document.getElementById("q").value = q;
  onlyActive = true; document.getElementById("onlyActive").checked = true;
  kind = "single"; document.getElementById("kind").value = "single";
  curId = pid; pg.reset(); openSets = {};
  await loadList(); await loadDetail(pid);
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client; isAdmin = (me.role === "admin");
  canEdit = imsAuth.canWrite("master");
  imsHeader(me);
  document.getElementById("buildTag").textContent = PR_BUILD;
  if(canEdit){
    document.getElementById("newBar").hidden = false;
    document.getElementById("newProductBtn").onclick = () => { if(leaveEditOk()) openProductDialog(null); };
    document.getElementById("newFamilyBtn").onclick = () => { if(leaveEditOk()) openFamilyDialog({}); };
  }

  document.getElementById("modal").onclick = e => {
    if(e.target.id !== "modal") return;
    const c = document.querySelector('#modalBox [data-m="close"]');
    if(c && !document.querySelector('#modalBox [data-m="go"]')) c.click();    // 닫기 단추와 같은 길(취소 고리까지)
  };
  document.getElementById("photoFile").onchange = e => { const fs = Array.from(e.target.files || []); if(fs.length) uploadPhotos(fs); };

  const resetAnd = fn => e => { if(!leaveEditOk()){ return; } fn(e); pg.reset(); clearDetail(); loadList(); };
  document.getElementById("onlyActive").onchange = resetAnd(e => { onlyActive = e.target.checked; });
  document.getElementById("kind").value = kind;
  document.getElementById("kind").onchange = resetAnd(e => { kind = e.target.value; openSets = {}; });
  document.getElementById("cat").onchange  = resetAnd(e => { cat = e.target.value; });
  document.getElementById("brand").onchange = resetAnd(e => { brand = e.target.value.trim(); });
  document.getElementById("sup").onchange = resetAnd(e => {
    const v = e.target.value.trim(); const hit = v && refs.supByName[v.toLowerCase()];
    supId = hit ? hit.id : "";
    if(v && !hit) e.target.value = "";
  });
  imsQ("#q", v => { if(!leaveEditOk()) return; q = v; pg.reset(); clearDetail(); loadList(); });
  document.getElementById("sheetLink").onclick = e => {
    const u = new URLSearchParams(); if(q) u.set("q", q); if(brand) u.set("brand", brand);
    e.currentTarget.href = "product-sheet.html" + (u.toString() ? "?" + u.toString() : "");
  };

  /* 기준표 — 고치기 칸이 id 로 쓴다(이름 칸은 창구가 복사한다 · 판정 143) */
  try {
    const [bl, cl, ul, tl, sl, fl, cu] = await Promise.all([
      fetchAll("ref_brand", "id,name", x => x.eq("is_active", true).order("name")),
      fetchAll("ref_category", "id,name", x => x.eq("is_active", true).order("name")),
      fetchAll("ref_unit", "id,name", x => x.eq("is_active", true).order("name")),
      fetchAll("ref_price_tier", "id,code,name,purpose", x => x.eq("is_active", true).order("code")),
      fetchAll("supplier", "id,name,currency_id", x => x.eq("is_active", true).order("name")),
      fetchAll("product_family", "option1_name,option2_name,option3_name", x => x.eq("is_active", true)),
      fetchAll("ref_currency", "id,code"),
    ]);
    refs.cur = {}; cu.forEach(c => { refs.cur[c.id] = c.code; });
    /* 축 이름 — 활성 family 가 쓰는 것을 많이 쓰는 순으로(판정 190 · 흔한 철자를 먼저 보이게) */
    const ac = {}; fl.forEach(f => [f.option1_name, f.option2_name, f.option3_name].forEach(a => { if(a) ac[a] = (ac[a]||0) + 1; }));
    refs.axes = Object.entries(ac).sort((a,b) => b[1] - a[1]).map(x => x[0]);
    refs.brands = bl; refs.cats = cl; refs.units = ul; refs.tiers = tl; refs.suppliers = sl;
    refs.supByName = {}; sl.forEach(x => { refs.supByName[x.name.toLowerCase()] = x; });
  } catch(err){
    document.getElementById("rows").innerHTML = `<div class="msg err">Reference lists failed: ${esc(err.message)}</div>`;
  }
  document.getElementById("brandList").innerHTML = refs.brands.map(x => `<option value="${esc(x.name)}">`).join("");
  document.getElementById("cat").innerHTML = '<option value="">All categories</option>' +
    refs.cats.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  document.getElementById("supList").innerHTML = refs.suppliers.map(x => `<option value="${esc(x.name)}">`).join("");
  document.getElementById("catList").innerHTML = refs.cats.map(x => `<option value="${esc(x.name)}">`).join("");
  document.getElementById("unitList").innerHTML = refs.units.map(x => `<option value="${esc(x.name)}">`).join("");

  /* ⭐ 다른 화면에서 넘어올 수 있게 — products.html?id=… 또는 ?sku=…
     ⚠️⚠️ [실사고 2026-09-15] 목록을 먼저 그리고, 그 뒤에 상세를 연다. */
  const p = new URLSearchParams(location.search);
  const wantId = p.get("id"), wantSku = p.get("sku");
  if(wantId || wantSku){ onlyActive = false; document.getElementById("onlyActive").checked = false; }
  if(wantSku){ q = wantSku; document.getElementById("q").value = wantSku; }
  if(wantId){
    curId = wantId;
    const { data } = await sb.from("product").select("sku,parent_product_id").eq("id", wantId).maybeSingle();
    if(data){
      q = data.sku; document.getElementById("q").value = data.sku;
      if(data.parent_product_id){ kind = ""; document.getElementById("kind").value = ""; }
    }
  }
  await loadList();
  if(curId) await loadDetail(curId);
});
</script>
</body>
</html>
