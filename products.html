<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Asung IMS</title>
<style>
  :root{ --line:#e5e9ef; --muted:#6b7686; --ink:#12161c; --bg:#f7f8fa; --accent:#2f6df6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .brand{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px}
  header .sp{flex:1}
  header .who{font-size:13px;color:var(--muted)}
  header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  header button:hover{background:#f2f4f8}

  .wrap{display:flex;gap:16px;padding:16px 18px;align-items:flex-start}
  .list{width:360px;flex:0 0 360px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px}
  .list .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .list input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
  .list input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .list .opts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .list .opts label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .list select{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font:inherit;font-size:12.5px}
  .list .rows{max-height:calc(100vh - 235px);overflow:auto}
  .list .row{padding:8px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer}
  .list .row:hover{background:#fafbfd}
  .list .row.cur{background:#eef3ff}
  .list .row .sku{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .list .row.cur .sku{color:#3b5bdb}
  .list .row .nm{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row{display:flex;gap:7px;align-items:flex-start}
  .list .row .car{width:14px;flex:0 0 14px;color:var(--muted);font-size:11px;line-height:1.5;text-align:center;border-radius:4px}
  .list .row .car:hover{background:#eef1f6;color:var(--ink)}
  .list .row .car.none{visibility:hidden}
  .list .row .body{flex:1;min-width:0}
  .list .kid{padding-left:33px;background:#fcfdfe}
  .list .row .tag{font-size:10px;font-family:ui-monospace,Menlo,monospace;border-radius:999px;padding:0 6px;border:1px solid var(--line);color:var(--muted);font-weight:500}
  .list .row .tag.off{color:#b42318;border-color:#f3d3cf}
  .list .foot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .list .foot .sp{flex:1}
  .list .foot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .list .foot button:disabled{opacity:.45;cursor:default}
  .range{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:ui-monospace,Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .card h3 .n{color:var(--ink);font-weight:700}
  .head{padding:16px}
  .head .sk{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted)}
  .head .nm{font-size:19px;font-weight:700;margin:3px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
  .chip.bad{border-color:#f3d3cf;color:#b42318}
  .chip.good{border-color:#cfe9d7;color:#16794a}
  .chip.warn{border-color:#ecdcb4;color:#92640a}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{background:#fafbfd;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  tbody td{padding:7px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top}
  .kv td:first-child{width:150px;color:var(--muted);font-size:10.5px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;white-space:nowrap}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .num{font-family:ui-monospace,Menlo,monospace;text-align:right}
  .dim{color:#9aa4b2}
  .on{color:#16a34a;font-weight:600} .off{color:#b42318;font-weight:600}
  .lnk{color:var(--accent);cursor:pointer;text-decoration:none}
  .lnk:hover{text-decoration:underline}
  .msg{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .err{color:#dc2626;font-weight:600}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search SKU or name">
      <div class="opts">
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
        <label>Kind
          <select id="kind">
            <option value="single">Singles</option>
            <option value="set">Sets only</option>
            <option value="">All</option>
          </select>
        </label>
      </div>
      <div class="opts">
        <input list="brandList" id="brand" placeholder="Brand" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px">
        <datalist id="brandList"></datalist>
        <select id="cat" style="flex:1;min-width:0">
          <option value="">All categories</option>
        </select>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Search for a product.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Products — product 18,714 + family · barcode · bom · supplier (읽기 전용)
   정본: docs/design/po-module.md §3-d · §3-e · §3-g

   ⚠️⚠️ 18,714행이다. 목록을 훑는 화면이 아니라 검색해서 들어가는 화면이다.
   ⚠️ 제품은 감추지 않는다(Caleb 2026-09-15) — 비활성·대체 UPC 도 찾을 일이 있다.
      토글은 두되 매니저에게도 보인다.
   ⚠️ product_bom 의 구성품은 FK 이름을 추측하지 않고 두 번 나눠 읽는다
      (조인 이름을 틀리면 조용히 빈 배열이 온다).
   ⭐ 세트·콤보는 다른 것이다:
        세트  parent_product_id 가 있다 · pack_factor 로 부모에서 환산해 발주
        콤보  product_bom 의 부모다 · 구성품이 서로 다른 제품
   ───────────────────────────────────────────────────────────── */

const PAGE = 100;
let sb=null, isAdmin=false, showDead=false;
let page=0, q="", onlyActive=true, kind="single", brand="", cat="", total=0, curId=null;
let openSets = {};   // 펼친 낱개 id → 그 세트들 (캐럿)

const esc = v => String(v==null?"":v).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const dim = v => (v===null||v===undefined||v==="") ? '<span class="dim">—</span>' : esc(v);
const yn  = v => v===true ? '<span class="on">✓</span>' : v===false ? '<span class="off">✗</span>' : '<span class="dim">—</span>';

/* ── 목록 ─────────────────────────────────────────────── */
async function loadList(){
  const from = page*PAGE, to = from+PAGE-1;
  let qry = sb.from("product")
    .select("id,sku,name,is_active,parent_product_id,pack_factor,brand_name,category_name", { count:"exact" });
  if(onlyActive) qry = qry.eq("is_active", true);
  if(kind==="single") qry = qry.is("parent_product_id", null);
  if(kind==="set")    qry = qry.not("parent_product_id", "is", null);
  if(brand) qry = qry.eq("brand_name", brand);
  if(cat)   qry = qry.eq("category_name", cat);
  if(q) qry = qry.or(`sku.ilike.%${q}%,name.ilike.%${q}%`);

  const { data, count, error } = await qry.order("sku").range(from, to);
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  total = count || 0;

  /* ⭐ 캐럿 — 이 페이지의 낱개 중 세트가 딸린 것을 한 번에 묻는다.
     ⚠️ 낱개 100개의 자식을 각각 물으면 요청이 100번이다. .in() 으로 한 번에 받는다. */
  let hasKids = {};
  if(kind !== "set" && data.length){
    const ids = data.filter(r => !r.parent_product_id).map(r => r.id);
    if(ids.length){
      const { data: kd } = await sb.from("product")
        .select("id,sku,name,pack_factor,is_active,parent_product_id")
        .in("parent_product_id", ids).order("pack_factor");
      (kd||[]).forEach(k => { (hasKids[k.parent_product_id] = hasKids[k.parent_product_id] || []).push(k); });
    }
  }

  const rowHtml = (r, isKid) => {
    const kids = hasKids[r.id] || [];
    const car = (!isKid && kids.length)
      ? `<span class="car" data-toggle="${r.id}">${openSets[r.id] ? "▾" : "▸"}</span>`
      : `<span class="car none">·</span>`;
    const tags = [];
    if(r.parent_product_id) tags.push(`<span class="tag">×${esc(r.pack_factor)}</span>`);
    else if(kids.length)    tags.push(`<span class="tag">${kids.length} set${kids.length>1?"s":""}</span>`);
    if(!r.is_active) tags.push('<span class="tag off">inactive</span>');
    return `<div class="row ${isKid?"kid":""} ${r.id===curId?"cur":""}" data-id="${r.id}">
      ${car}
      <div class="body">
        <div class="sku">${esc(r.sku)}${tags.join("")}</div>
        <div class="nm">${esc(r.name)}</div>
      </div>
    </div>`;
  };

  let html = "";
  data.forEach(r => {
    html += rowHtml(r, false);
    if(openSets[r.id]) (hasKids[r.id]||[]).forEach(k => { html += rowHtml(k, true); });
  });
  document.getElementById("rows").innerHTML = html || '<div class="msg">No products match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.dataset.toggle) return;      // 캐럿은 따로
      curId = el.dataset.id; loadList(); loadDetail(curId);
    };
  });
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const k = el.dataset.toggle;
      openSets[k] = !openSets[k];
      loadList();
    };
  });

  // 필터를 바꿔 고른 제품이 목록에서 사라지면 상세도 비운다
  // ⚠️ suppliers.html 에서 고쳤는데 여기서 빠뜨렸다(2026-09-15 · Kind=Singles 인데 세트 상세가 남아 있었다)
  const shown = new Set();
  data.forEach(r => { shown.add(r.id); (hasKids[r.id]||[]).forEach(k => shown.add(k.id)); });
  if(curId && !shown.has(curId)){
    curId = null;
    document.getElementById("detail").innerHTML =
      '<div class="card"><div class="msg">Search for a product.</div></div>';
  }

  const f = total ? from+1 : 0, t2 = Math.min(from+data.length, total);
  document.getElementById("range").textContent = `${f.toLocaleString()}–${t2.toLocaleString()} / ${total.toLocaleString()}`;
  document.getElementById("prev").disabled = page===0;
  document.getElementById("next").disabled = (from+PAGE) >= total;
}

/* ── 상세 ─────────────────────────────────────────────── */
async function loadDetail(id){
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [p, bar, sup, bom, kids] = await Promise.all([
    sb.from("product").select("*").eq("id", id).maybeSingle(),
    sb.from("product_barcode").select("*").eq("product_id", id).order("is_primary", {ascending:false}),
    sb.from("product_supplier").select("*, supplier(name)").eq("product_id", id).order("is_default", {ascending:false}),
    sb.from("product_bom").select("*").eq("parent_product_id", id),
    sb.from("product").select("id,sku,name,pack_factor,is_active").eq("parent_product_id", id).order("sku"),
  ]);
  if(p.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(p.error.message)}</div></div>`; return; }
  const r = p.data;

  /* 구성품 이름 — ⚠️ FK 조인 이름을 추측하지 않고 따로 읽는다 */
  let comps = [];
  if((bom.data||[]).length){
    const ids = bom.data.map(b => b.component_product_id).filter(Boolean);
    const { data: cp } = await sb.from("product").select("id,sku,name").in("id", ids);
    const map = {}; (cp||[]).forEach(x => map[x.id] = x);
    comps = bom.data.map(b => Object.assign({}, b, { c: map[b.component_product_id] || null }));
  }
  /* 부모 · 패밀리 */
  let parent = null, family = null;
  if(r.parent_product_id){
    const { data } = await sb.from("product").select("id,sku,name").eq("id", r.parent_product_id).maybeSingle();
    parent = data;
  }
  if(r.family_id){
    const { data } = await sb.from("product_family").select("id,sku,name,option1_name,option2_name,option3_name").eq("id", r.family_id).maybeSingle();
    family = data;
  }

  const chips = [];
  chips.push(`<span class="chip ${r.is_active?"good":"bad"}">${r.is_active?"active":"inactive"}</span>`);
  chips.push(`<span class="chip">${r.parent_product_id ? "set ×"+esc(r.pack_factor) : "single"}</span>`);
  if(comps.length) chips.push(`<span class="chip warn">combo · ${comps.length} components</span>`);
  if(r.is_discontinued) chips.push('<span class="chip bad">discontinued</span>');
  if(r.sellable===false) chips.push('<span class="chip">not sellable</span>');
  if(r.cin7_type) chips.push(`<span class="chip">${esc(r.cin7_type)}</span>`);
  chips.push(`<span class="chip">${esc(r.source)}</span>`);

  const left = [
    ["Brand", dim(r.brand_name)], ["Category", dim(r.category_name)],
    ["UOM", `<span class="mono">${dim(r.uom_name)}</span>`],
    ["Pack factor", `<span class="mono">${dim(r.pack_factor)}</span>`],
    ["Parent", parent ? `<span class="mono lnk" data-go="${parent.id}">${esc(parent.sku)}</span>` : '<span class="dim">—</span>'],
    ["Family", family ? `<span class="mono">${esc(family.sku)}</span> ${esc(family.name)}` : '<span class="dim">—</span>'],
    ["Options", [r.option1_value,r.option2_value,r.option3_value].filter(Boolean).map(esc).join(" · ") || '<span class="dim">—</span>'],
    ["Weight", r.weight ? `${esc(r.weight)} ${esc(r.weight_unit||"")}` : '<span class="dim">—</span>'],
  ];
  const right = [
    ["Inventory acct", `<span class="mono">${dim(r.inventory_account_code)}</span>`],
    ["COGS acct", `<span class="mono">${dim(r.cogs_account_code)}</span>`],
    ["Revenue acct", `<span class="mono">${dim(r.revenue_account_code)}</span>`],
    ["Purchase tax", dim(r.purchase_tax_rule)],
    ["Costing", dim(r.costing_method)],
    ["HS code", `<span class="mono">${dim(r.hs_code)}</span>`],
    ["Origin", dim(r.country_of_origin)],
    ["Cin7 modified", `<span class="mono">${dim(r.cin7_modified_on ? String(r.cin7_modified_on).slice(0,10) : null)}</span>`],
  ];
  const kvT = rows => `<table class="kv"><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  const tbl = (title, n, head, rows, empty) => `
    <div class="card"><h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`
                    : `<div class="msg">${empty||"None."}</div>`}</div>`;

  const barRows = (bar.data||[]).map(b => `<tr>
      <td class="mono">${dim(b.barcode)}</td><td>${yn(b.is_primary)}</td>
      <td class="mono">${dim(b.valid_from)}</td><td>${yn(b.is_active)}</td></tr>`);

  // ⚠️⚠️ [2026-09-15 실사고] AS92082-6(세트)에 공급처가 붙어 보였다. 데이터는 맞았다 —
  //    어제 Cin7 에서 지우고 is_active=false 로 내린 줄인데 화면이 그대로 띄웠다.
  //    §3-f 는 「읽는 쪽이 is_active 를 건다」이고 suppliers.html 은 걸었는데 여기서 빠뜨렸다.
  //    ⇒ 기본은 감춘다. admin 은 토글로 꺼내 본다(지운 것이 실제로 내려갔는지 확인할 자리).
  const supAll  = sup.data || [];
  const supLive = supAll.filter(x => x.is_active);
  const supShow = showDead ? supAll : supLive;
  const supDead = supAll.length - supLive.length;

  const supRows = supShow.map(x => `<tr${x.is_active ? "" : ' style="opacity:.5"'}>
      <td>${esc(x.supplier ? x.supplier.name : "")}</td>
      <td class="mono">${dim(x.supplier_sku)}</td>
      <td class="num">${x.fixed_cost==null?'<span class="dim">—</span>':esc(x.fixed_cost)}</td>
      <td class="num">${x.cost==null?'<span class="dim">—</span>':esc(x.cost)}</td>
      <td class="mono">${dim(x.last_supplied)}</td>
      <td>${yn(x.is_default)}</td><td>${yn(x.is_active)}</td></tr>`);

  const bomRows = comps.map(x => `<tr>
      <td class="mono">${x.c ? `<span class="lnk" data-go="${x.c.id}">${esc(x.c.sku)}</span>` : '<span class="dim">?</span>'}</td>
      <td>${esc(x.c ? x.c.name : "")}</td>
      <td class="num">${dim(x.quantity)}</td></tr>`);

  const kidRows = (kids.data||[]).map(k => `<tr>
      <td class="mono"><span class="lnk" data-go="${k.id}">${esc(k.sku)}</span></td>
      <td>${esc(k.name)}</td><td class="num">${dim(k.pack_factor)}</td><td>${yn(k.is_active)}</td></tr>`);

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="sk">${esc(r.sku)}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      <div class="cols">${kvT(left)}${kvT(right)}</div>
    </div>
    ${tbl("Suppliers" + (supDead && isAdmin
            ? ` <label style="font-weight:400;text-transform:none;font-size:11px;display:flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer">
                 <input type="checkbox" id="showDead" ${showDead?"checked":""}> show ${supDead} inactive</label>` : ""),
          supShow.length, ["Supplier","Supplier SKU","Fixed","Latest","Last supplied","Default","Active"], supRows,
          r.parent_product_id ? "None — sets are bought through the parent."
                              : (supDead ? "None active." : "None."))}
    ${tbl("Barcodes", (bar.data||[]).length, ["Barcode","Primary","Valid from","Active"], barRows)}
    ${comps.length ? tbl("Components", comps.length, ["SKU","Name","Qty"], bomRows) : ""}
    ${kidRows.length ? tbl("Sets of this product", kidRows.length, ["SKU","Name","Pack factor","Active"], kidRows) : ""}
  `;

  const sd = box.querySelector("#showDead");
  if(sd) sd.onchange = e => { showDead = e.target.checked; loadDetail(id); };

  box.querySelectorAll("[data-go]").forEach(el => {
    el.onclick = () => { curId = el.dataset.go; loadDetail(curId); loadList(); };
  });
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client; isAdmin = (me.role === "admin");
  document.getElementById("who").textContent = me.name + " · " + me.role;
  document.getElementById("logoutBtn").onclick = () => imsAuth.signOut();

  document.getElementById("prev").onclick = () => { if(page>0){ page--; loadList(); } };
  document.getElementById("next").onclick = () => { page++; loadList(); };
  document.getElementById("onlyActive").onchange = e => { onlyActive = e.target.checked; page=0; loadList(); };
  document.getElementById("kind").value = kind;
  document.getElementById("kind").onchange = e => { kind = e.target.value; page=0; openSets={}; loadList(); };
  document.getElementById("cat").onchange  = e => { cat  = e.target.value; page=0; loadList(); };
  document.getElementById("brand").onchange = e => { brand = e.target.value.trim(); page=0; loadList(); };

  /* 브랜드·카테고리 — ref_ 표에서 받는다. ⚠️ 브랜드 415 중 제품이 없는 것도 섞여 있다(고르면 빈 목록이 뜬다) */
  const [bl, cl] = await Promise.all([
    sb.from("ref_brand").select("name").eq("is_active", true).order("name").range(0, 999),
    sb.from("ref_category").select("name").eq("is_active", true).order("name").range(0, 999),
  ]);
  document.getElementById("brandList").innerHTML =
    (bl.data||[]).map(x => `<option value="${esc(x.name)}">`).join("");
  document.getElementById("cat").innerHTML =
    '<option value="">All categories</option>' +
    (cl.data||[]).map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");

  let timer=null;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(timer);
    timer = setTimeout(()=>{ q = e.target.value.trim(); page=0; loadList(); }, 250);
  });

  /* ⭐ 다른 화면에서 넘어올 수 있게 — products.html?id=… 또는 ?sku=…
     (supplier-products.html 이 제품을 눌렀을 때 이리로 보낸다) */
  const p = new URLSearchParams(location.search);
  const wantId = p.get("id"), wantSku = p.get("sku");
  if(wantSku){
    q = wantSku;
    document.getElementById("q").value = wantSku;
    onlyActive = false; document.getElementById("onlyActive").checked = false;
    kind = ""; document.getElementById("kind").value = "";
  }
  if(wantId){
    // ⚠️ 목록 필터에 걸려 안 보일 수 있다 — 상세는 id 로 바로 연다
    curId = wantId;
    onlyActive = false; document.getElementById("onlyActive").checked = false;
    kind = ""; document.getElementById("kind").value = "";
    loadDetail(wantId);
  }

  await loadList();
});
</script>
</body>
</html>
