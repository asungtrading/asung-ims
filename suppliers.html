<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppliers · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px)}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  main{display:flex;flex-direction:column;gap:14px}
  .list .row.cur{color:#3b5bdb;font-weight:600}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search name">
      <div class="opts" id="opts" hidden>
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
        <label><input type="checkbox" id="onlyPurch"> Purchasable</label>
        <label><input type="checkbox" id="hideDisc"> Hide discontinued</label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a supplier.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Suppliers — supplier 257 + 주소 · 연락처 · 할인 (읽기 전용)
   정본: docs/design/po-module.md §3-b · §3-c

   ⚠️ PostgREST 1,000행 캡 — 지금 257행이라 안 걸리지만 예외를 두지 않는다.
      settings.html 과 같은 틀로 .range() + count:'exact'.
   ⚠️ 딸림 표는 흩어져 있다(2026-09-15 실측):
        주소   0개 174 · 1개 79 · 2개 이상 4
        연락처 0개  75 · 1개 147 · 2개 이상 35
      ⇒ 상세는 「없으면 없다고 적고」 여럿이면 목록으로 보여 준다.
   ⚠️ supplier_discount 는 0행이다 — 사람이 채울 표인데 채울 자리가 아직 없다.
   ───────────────────────────────────────────────────────────── */

let sb=null, me=null, isAdmin=false;
/* ⚠️ loadDetail 이 조회를 기다리는 사이에 필터가 바뀌면 loadList 가 상세를 비우는데,
   나중에 도착한 loadDetail 이 다시 쓴다 ⇒ 번호를 붙여 최신이 아니면 쓰지 않는다. */
let detailSeq = 0;

/* ⭐ 검색·필터를 바꾸면 오른쪽을 비운다. 페이지를 넘길 때는 두지 않는다(2026-09-15 · Caleb).
   ⚠️ 전에는 「고른 것이 이 페이지에 없으면 비운다」였는데, 알파벳 앞쪽이면 그대로 남고
      2페이지로 넘기면 보던 상세가 사라져서 언제 비는지 알 수 없었다. */
function clearDetail(){
  curId = null;
  detailSeq++;   // 날아오던 요청이 있으면 그것도 무효로
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Select a supplier.</div></div>';
}
let q="", onlyActive=true, onlyPurch=false, hideDisc=false, curId=null;
const pg = imsPage(100);


/* ── 목록 ─────────────────────────────────────────────── */
async function loadList(){
  let qry = sb.from("supplier")
    .select("id,name,is_active,is_purchasable,is_discontinued", { count:"exact" });
  // ⭐ 매니저는 정돈된 목록만 본다 — 살아 있고 · 살 수 있고 · 지금도 거래하는 곳(2026-09-15 실측 138곳)
  //    admin 만 토글로 그 바깥을 꺼내 본다(판정이 없는 31곳 · 잘못 꺼진 곳을 정리하는 자리).
  // ⚠️ 이것은 화면에서 감추는 것이지 막는 것이 아니다 — anon key 가 공개라 PostgREST 를 직접 치면 다 보인다.
  //    지금은 감추는 것으로 충분하다(공급처 목록은 비밀이 아니다). 진짜 막을 것이 생기면 RLS 로 간다.
  if(!isAdmin){
    qry = qry.eq("is_active", true).eq("is_purchasable", true).eq("is_discontinued", false);
  } else {
    if(onlyActive) qry = qry.eq("is_active", true);
    if(onlyPurch)  qry = qry.eq("is_purchasable", true);
    if(hideDisc)   qry = qry.eq("is_discontinued", false);
  }
  if(q) qry = qry.ilike("name", `%${q}%`);
  const { data, error } = await pg.run(qry.order("name"));
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  document.getElementById("rows").innerHTML = data.length ? data.map(r => {
    const tags = [];
    if(!r.is_active) tags.push(`<span class="tag">inactive</span>`);
    if(r.is_discontinued) tags.push(`<span class="tag disc">discontinued</span>`);
    return `<div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <span>${esc(r.name)}</span>
      <span style="display:flex;gap:4px">${tags.join("")}</span>
    </div>`;
  }).join("") : '<div class="msg">No suppliers match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

/* ── 상세 ─────────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [s, addr, cont, disc, prod, dflt] = await Promise.all([
    sb.from("supplier").select("*, ref_currency(code)").eq("id", id).maybeSingle(),
    sb.from("supplier_address").select("*").eq("supplier_id", id).order("type"),
    sb.from("supplier_contact").select("*").eq("supplier_id", id).order("is_default", {ascending:false}),
    sb.from("supplier_discount").select("*").eq("supplier_id", id).order("seq"),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true).eq("is_default", true),
  ]);

  if(s.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(s.error.message)}</div></div>`; return; }
  const r = s.data;

  const chips = [];
  chips.push(`<span class="chip ${r.is_active?"good":"bad"}">${r.is_active?"active":"inactive"}</span>`);
  if(r.is_purchasable===true)  chips.push('<span class="chip good">purchasable</span>');
  if(r.is_purchasable===false) chips.push('<span class="chip">not purchasable</span>');
  if(r.is_purchasable===null)  chips.push('<span class="chip">purchasable: not set</span>');
  if(r.is_discontinued) chips.push(`<span class="chip bad">discontinued${r.discontinued_on?" "+r.discontinued_on:""}</span>`);
  chips.push(`<span class="chip">${esc(r.source)}</span>`);

  const kv = [
    ["Payment term",  dim(r.payment_term_name)],
    ["Account payable", `<span class="mono">${dim(r.account_payable_code)}</span>`],
    ["Currency",      `<span class="mono">${dim(r.ref_currency ? r.ref_currency.code : null)}</span>`],
    ["Tax rule",      dim(r.tax_rule)],
    ["Products linked", `<span class="mono">${(prod.count||0).toLocaleString()}</span>`],
    ["— of which default", `<span class="mono">${(dflt.count||0).toLocaleString()}</span>`],
    ["Cin7 comments", dim(r.cin7_comments)],
    ["Note",          dim(r.note)],
  ];

  const tbl = (title, n, head, rows) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>`
      : `<div class="msg">None.</div>`}
    </div>`;

  const aRows = (addr.data||[]).map(a => `<tr>
      <td class="mono">${dim(a.type)}</td>
      <td>${dim(a.line1)}${a.line2?"<br>"+esc(a.line2):""}</td>
      <td>${dim(a.city)}</td><td>${dim(a.state_province)}</td>
      <td class="mono">${dim(a.postal_code)}</td><td>${dim(a.country)}</td></tr>`);

  const cRows = (cont.data||[]).map(c => `<tr>
      <td>${dim(c.name)}</td><td class="mono">${dim(c.phone)}</td><td class="mono">${dim(c.mobile_phone)}</td>
      <td>${dim(c.email)}</td><td>${yn(c.is_default, false)}</td></tr>`);

  const dRows = (disc.data||[]).map(d => `<tr>
      <td class="num">${dim(d.seq)}</td><td>${dim(d.name)}</td>
      <td class="num">${d.percent==null?'<span class="dim">—</span>':esc(d.percent)+"%"}</td></tr>`);

  if(seq !== detailSeq) return;   // 그 사이에 다른 요청이 들어왔다
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      <table class="kv"><tbody>
        ${kv.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}
      </tbody></table>
    </div>
    ${tbl("Addresses", addr.data ? addr.data.length : 0,
          ["Type","Street","City","Province","Postal","Country"], aRows)}
    ${tbl("Contacts", cont.data ? cont.data.length : 0,
          ["Name","Phone","Mobile","Email","Default"], cRows)}
    ${tbl("Discounts", disc.data ? disc.data.length : 0,
          ["Seq","Name","Percent"], dRows)}
  `;
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  imsHeader(me);
  if(isAdmin) document.getElementById("opts").hidden = false;

  document.getElementById("onlyActive").onchange = e => { onlyActive = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  document.getElementById("onlyPurch").onchange  = e => { onlyPurch  = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  document.getElementById("hideDisc").onchange   = e => { hideDisc   = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; pg.reset(); clearDetail(); loadList(); });

  await loadList();
});
</script>
</body>
</html>
