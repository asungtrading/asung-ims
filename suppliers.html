<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppliers · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px)}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  main{display:flex;flex-direction:column;gap:14px}
  .list .row.cur{color:#3b5bdb;font-weight:600}
  /* ⚠️ 이름은 공통과 겹치지 않는 것으로 골랐다 — 공통에 .note 를 두었다가 staff.html 과 부딪친 적이 있다(§10-j 3-g) */
  .editrow{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:12.5px;color:var(--muted)}
  .editrow select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px}
  .editst{font-size:12px;color:var(--muted)}
  .editst.ok{color:#16a34a;font-weight:600}
  /* ⚠️ 공통 .err 는 ims-ui.css 에 있어 이 파일보다 먼저 온다 — 특정도가 같으면 여기 .editst 가 이겨
     실패 문구가 회색으로 나온다. 그래서 두 클래스로 다시 적는다. */
  .editst.err{color:#dc2626;font-weight:600}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search name">
      <div class="opts" id="opts" hidden>
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
        <label><input type="checkbox" id="hideDisc"> Hide discontinued</label>
        <label>Purchasable
          <select id="purchFilter">
            <option value="all">All</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="unset">Not set</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a supplier.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Suppliers — supplier 257 + 주소 · 연락처 · 할인
   정본: docs/design/po-module.md §3-b · §3-c · 쓰기는 §10-k

   ⭐ 2026-09-15 — 읽기 전용이 아니다. is_purchasable 을 여기서 고친다(IMS 의 두 번째 쓰기 화면).
      「Cin7 이 모르는 우리 칸」이라 고쳐도 아무것도 안 깨지고 재적재가 덮지도 않는다(§3-f).
      ⚠️ 판정은 세 상태다 — true · false · null(아직 안 봤다). null 을 화면에서 만들 수 있어야
         「판정 없음 N곳」이 남은 일의 눈금으로 남는다(수는 §10-k). 체크박스 두 상태로 두지 않은 이유다.
      ⚠️ admin 만 고친다. 이것은 화면에서 감추는 것이지 막는 것이 아니다 — anon key 가 공개다.
         진짜 막을 것이 생기면 RLS 로 간다(ims_is_admin() 이 선례 · §10-j 3-b).
         ⭐ 그래도 저장은 imsSaved() 로 되읽는다 — 지금은 막힐 일이 없지만,
            나중에 RLS 를 걸었을 때 0행이 조용히 성공으로 지나가는 것을 막는 자리다.

   ⚠️ PostgREST 1,000행 캡 — 지금 257행이라 안 걸리지만 예외를 두지 않는다.
      settings.html 과 같은 틀로 .range() + count:'exact'.
   ⚠️ 딸림 표는 흩어져 있다(2026-09-15 실측):
        주소   0개 174 · 1개 79 · 2개 이상 4
        연락처 0개  75 · 1개 147 · 2개 이상 35
      ⇒ 상세는 「없으면 없다고 적고」 여럿이면 목록으로 보여 준다.
   ⚠️ supplier_discount 는 0행이다 — 사람이 채울 표인데 채울 자리가 아직 없다.
   ───────────────────────────────────────────────────────────── */

let sb=null, me=null, isAdmin=false;
/* ⚠️ loadDetail 이 조회를 기다리는 사이에 필터가 바뀌면 loadList 가 상세를 비우는데,
   나중에 도착한 loadDetail 이 다시 쓴다 ⇒ 번호를 붙여 최신이 아니면 쓰지 않는다.
   ⭐ 저장도 같은 번호를 쓴다 — 저장하는 사이 다른 공급처로 옮겼으면 그 화면에 쓰지 않는다. */
let detailSeq = 0;

/* ⭐ 검색·필터를 바꾸면 오른쪽을 비운다. 페이지를 넘길 때는 두지 않는다(2026-09-15 · Caleb).
   ⚠️ 전에는 「고른 것이 이 페이지에 없으면 비운다」였는데, 알파벳 앞쪽이면 그대로 남고
      2페이지로 넘기면 보던 상세가 사라져서 언제 비는지 알 수 없었다.
   ⚠️ 저장 뒤에는 부르지 않는다 — 사람이 필터를 바꾼 것이 아니다. 목록만 다시 읽는다. */
function clearDetail(){
  curId = null;
  detailSeq++;   // 날아오던 요청이 있으면 그것도 무효로
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Select a supplier.</div></div>';
}
let q="", onlyActive=true, hideDisc=false, purchF="all", curId=null;
const pg = imsPage(100);

/* ⭐ 세 상태를 한곳에서 그린다 — 상세를 통째로 다시 읽지 않고 저장 직후 이 칩만 갈아 끼운다.
   ⚠️ 색은 is_active 에만 쓴다(§10-j 3-e) — not set 은 잘못된 상태가 아니라 아직 안 본 상태다. 회색. */
function purchChip(v){
  if(v===true)  return '<span class="chip good">purchasable</span>';
  if(v===false) return '<span class="chip">not purchasable</span>';
  return '<span class="chip">purchasable: not set</span>';
}

/* ── 목록 ─────────────────────────────────────────────── */
async function loadList(){
  let qry = sb.from("supplier")
    .select("id,name,is_active,is_purchasable,is_discontinued", { count:"exact" });
  // ⭐ 매니저는 정돈된 목록만 본다 — 살아 있고 · 살 수 있고 · 지금도 거래하는 곳(2026-09-15 실측 138곳)
  //    admin 만 토글로 그 바깥을 꺼내 본다(판정이 없는 곳 · 잘못 켜진 곳을 정리하는 자리 · 수는 §10-k).
  // ⚠️ 이것은 화면에서 감추는 것이지 막는 것이 아니다 — anon key 가 공개라 PostgREST 를 직접 치면 다 보인다.
  //    지금은 감추는 것으로 충분하다(공급처 목록은 비밀이 아니다). 진짜 막을 것이 생기면 RLS 로 간다.
  if(!isAdmin){
    qry = qry.eq("is_active", true).eq("is_purchasable", true).eq("is_discontinued", false);
  } else {
    if(onlyActive) qry = qry.eq("is_active", true);
    if(hideDisc)   qry = qry.eq("is_discontinued", false);
    // ⚠️ Not set 은 .eq 로 못 잡는다 — SQL 에서 null 은 = 로 비교되지 않는다. .is() 를 쓴다.
    if(purchF==="yes")   qry = qry.eq("is_purchasable", true);
    if(purchF==="no")    qry = qry.eq("is_purchasable", false);
    if(purchF==="unset") qry = qry.is("is_purchasable", null);
  }
  if(q) qry = qry.ilike("name", `%${q}%`);
  const { data, error } = await pg.run(qry.order("name"));
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  document.getElementById("rows").innerHTML = data.length ? data.map(r => {
    const tags = [];
    if(!r.is_active) tags.push(`<span class="tag off">inactive</span>`);   // 색은 is_active 에만(§10-j 3-e) — 상세 칩·products·staff 와 같게
    // ⭐ 다른 필터로 보다가도 미판정이 눈에 걸리게 한다 — 상세를 열어야만 알 수 있으면 257곳을 훑을 수 없다.
    if(r.is_purchasable===null) tags.push(`<span class="tag">not set</span>`);
    if(r.is_discontinued) tags.push(`<span class="tag disc">discontinued</span>`);
    return `<div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <span>${esc(r.name)}</span>
      <span style="display:flex;gap:4px">${tags.join("")}</span>
    </div>`;
  }).join("") : '<div class="msg">No suppliers match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

/* ── 저장 ─────────────────────────────────────────────────
   ⭐ 고르면 바로 저장한다. Save 버튼을 두지 않은 이유 — 값이 하나뿐인데 여러 곳을 훑는 동안 클릭이 두 배가 된다.
   ⭐ 저장 뒤 목록을 다시 읽는다 — Not set 으로 걸러 놓고 일하면 방금 판정한 곳이 빠지고
      아래 「1–N / N」이 하나씩 줄어든다. 그것이 남은 일의 눈금이다(2026-09-15 · Caleb).
      상세는 그대로 두니 잘못 눌렀으면 바로 되돌릴 수 있다. */
async function savePurchasable(id, raw, prev, seq){
  const val = raw === "null" ? null : (raw === "true");
  const sel = document.getElementById("purchSet");
  const st  = document.getElementById("purchSt");
  if(st){ st.className = "editst"; st.textContent = "Saving…"; }
  // ⚠️ 저장하는 사이 또 바꾸면 update 둘이 경합한다 — DB 는 마지막 것, 화면은 늦게 돌아온 것을 보인다.
  //    여러 곳을 빠르게 훑는 자리라 실제로 일어난다. 저장이 끝날 때까지 잠근다.
  if(sel) sel.disabled = true;

  // ⚠️⚠️ update 가 RLS 에 막히면 에러가 아니라 0행이다 — imsSaved 가 .select() 로 되읽어 판정한다(§10-j 3-f).
  //    되읽은 값으로 칩과 Updated 를 갈아 끼운다. 보낸 값이 아니라 DB 가 돌려준 값을 쓴다.
  const res = await imsSaved(
    sb.from("supplier").update({ is_purchasable: val }).eq("id", id)
      .select("id,is_purchasable,updated_at")
  );

  // ⭐ seq 로 막는 것은 **오른쪽 상세에 쓰는 것뿐**이다 — 저장하는 사이 다른 공급처로 옮겼으면 그 화면에 쓰면 안 된다.
  //    ⚠️ 목록은 화면 공통이라 seq 의 보호 대상이 아니다. 여기서 건너뛰면 왼쪽 숫자가 한 번 안 줄고
  //       다음 새로 고침에야 맞는다 — 재현되지 않는 증상으로 남는다.
  const stale = (seq !== detailSeq);

  if(!stale){
    if(sel) sel.disabled = false;
    if(!res.ok){
      if(st){ st.className = "editst err"; st.textContent = res.reason; }
      // ⭐ 저장이 안 됐는데 드롭다운이 고른 값에 머물면 화면만 저장된 것처럼 보여 「Not saved」가 무력해진다.
      if(sel) sel.value = prev;
    } else {
      const row = res.data[0];
      if(st){ st.className = "editst ok"; st.textContent = "Saved"; }
      if(sel) sel.dataset.prev = raw;
      const chip = document.getElementById("purchChip");
      if(chip) chip.innerHTML = purchChip(row.is_purchasable);
      const upd = document.getElementById("rowUpd");
      if(upd) upd.innerHTML = imsTs(row.updated_at);
    }
  }

  if(res.ok) await loadList();
}

/* ── 상세 ─────────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [s, addr, cont, disc, prod, dflt] = await Promise.all([
    sb.from("supplier").select("*, ref_currency(code)").eq("id", id).maybeSingle(),
    sb.from("supplier_address").select("*").eq("supplier_id", id).order("type"),
    sb.from("supplier_contact").select("*").eq("supplier_id", id).order("is_default", {ascending:false}),
    sb.from("supplier_discount").select("*").eq("supplier_id", id).order("seq"),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true).eq("is_default", true),
  ]);

  if(s.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(s.error.message)}</div></div>`; return; }
  const r = s.data;

  const chips = [];
  chips.push(`<span class="chip ${r.is_active?"good":"bad"}">${r.is_active?"active":"inactive"}</span>`);
  chips.push(`<span id="purchChip">${purchChip(r.is_purchasable)}</span>`);
  if(r.is_discontinued) chips.push(`<span class="chip bad">discontinued${r.discontinued_on?" "+r.discontinued_on:""}</span>`);
  chips.push(`<span class="chip">${esc(r.source)}</span>`);

  // ⭐ admin 에게만 고르는 자리를 준다. 매니저는 위의 칩까지만 본다.
  const editHtml = !isAdmin ? "" : `
    <div class="editrow">
      <span>Purchasable</span>
      <select id="purchSet">
        <option value="null">Not set</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
      <span class="editst" id="purchSt"></span>
    </div>`;

  const kv = [
    ["Payment term",  dim(r.payment_term_name)],
    ["Account payable", `<span class="mono">${dim(r.account_payable_code)}</span>`],
    ["Currency",      `<span class="mono">${dim(r.ref_currency ? r.ref_currency.code : null)}</span>`],
    ["Tax rule",      dim(r.tax_rule)],
    ["Products linked", `<span class="mono">${(prod.count||0).toLocaleString()}</span>`],
    ["— of which default", `<span class="mono">${(dflt.count||0).toLocaleString()}</span>`],
    ["Cin7 comments", dim(r.cin7_comments)],
    ["Note",          dim(r.note)],
    // ⚠️ timestamptz 는 imsTs() 로 — 문자열을 자르면 UTC 로 보인다(§10-j 3-f 실사고).
    //    📌 updated_at 은 UPDATE 때만 바뀐다. 적재만 되고 안 고친 행은 created_at 과 같다(정상).
    ["Updated",       `<span class="mono" id="rowUpd">${imsTs(r.updated_at)}</span>`],
  ];

  const tbl = (title, n, head, rows) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>`
      : `<div class="msg">None.</div>`}
    </div>`;

  const aRows = (addr.data||[]).map(a => `<tr>
      <td class="mono">${dim(a.type)}</td>
      <td>${dim(a.line1)}${a.line2?"<br>"+esc(a.line2):""}</td>
      <td>${dim(a.city)}</td><td>${dim(a.state_province)}</td>
      <td class="mono">${dim(a.postal_code)}</td><td>${dim(a.country)}</td></tr>`);

  const cRows = (cont.data||[]).map(c => `<tr>
      <td>${dim(c.name)}</td><td class="mono">${dim(c.phone)}</td><td class="mono">${dim(c.mobile_phone)}</td>
      <td>${dim(c.email)}</td><td>${yn(c.is_default, false)}</td></tr>`);

  const dRows = (disc.data||[]).map(d => `<tr>
      <td class="num">${dim(d.seq)}</td><td>${dim(d.name)}</td>
      <td class="num">${d.percent==null?'<span class="dim">—</span>':esc(d.percent)+"%"}</td></tr>`);

  if(seq !== detailSeq) return;   // 그 사이에 다른 요청이 들어왔다
  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
        ${editHtml}
      </div>
      <table class="kv"><tbody>
        ${kv.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}
      </tbody></table>
    </div>
    ${tbl("Addresses", addr.data ? addr.data.length : 0,
          ["Type","Street","City","Province","Postal","Country"], aRows)}
    ${tbl("Contacts", cont.data ? cont.data.length : 0,
          ["Name","Phone","Mobile","Email","Default"], cRows)}
    ${tbl("Discounts", disc.data ? disc.data.length : 0,
          ["Seq","Name","Percent"], dRows)}
  `;

  // ⚠️ 현재 값은 속성이 아니라 DOM 으로 넣는다(§10-j 3-g 의 esc 실사고와 같은 이유 · 여기 값은 고정이지만 관례를 따른다).
  //    ⭐ 직전 값을 dataset 에 들고 있는다 — 저장이 실패하면 여기로 되돌린다.
  if(isAdmin){
    const sel = document.getElementById("purchSet");
    if(sel){
      const cur = (r.is_purchasable === null || r.is_purchasable === undefined)
        ? "null" : String(r.is_purchasable);
      sel.value = cur;
      sel.dataset.prev = cur;
      sel.onchange = e => savePurchasable(id, e.target.value, e.target.dataset.prev, seq);
    }
  }
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  imsHeader(me);
  if(isAdmin) document.getElementById("opts").hidden = false;

  document.getElementById("onlyActive").onchange  = e => { onlyActive = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  document.getElementById("hideDisc").onchange    = e => { hideDisc   = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  document.getElementById("purchFilter").onchange = e => { purchF     = e.target.value;   pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; pg.reset(); clearDetail(); loadList(); });

  await loadList();
});
</script>
</body>
</html>
