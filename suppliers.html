<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppliers · Asung IMS</title>
<style>
  :root{ --line:#e5e9ef; --muted:#6b7686; --ink:#12161c; --bg:#f7f8fa; --accent:#2f6df6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .brand{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px}
  header .sp{flex:1}
  header .who{font-size:13px;color:var(--muted)}
  header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  header button:hover{background:#f2f4f8}

  .wrap{display:flex;gap:16px;padding:16px 18px;align-items:flex-start}
  .list{width:330px;flex:0 0 330px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px}
  .list .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .list input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
  .list input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .list .opts{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
  .list .opts label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .list .rows{max-height:calc(100vh - 230px);overflow:auto}
  .list .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .list .row:hover{background:#fafbfd}
  .list .row.cur{background:#eef3ff;color:#3b5bdb;font-weight:600}
  .list .row .tag{font-size:10.5px;font-family:ui-monospace,Menlo,monospace;border-radius:999px;padding:0 6px;white-space:nowrap;
    color:#b42318;border:1px solid #f3d3cf}
  .list .row .tag.disc{color:#92640a;border-color:#ecdcb4}
  .list .foot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .list .foot .sp{flex:1}
  .list .foot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .list .foot button:disabled{opacity:.45;cursor:default}
  .range{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:ui-monospace,Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .card h3 .n{color:var(--ink);font-weight:700}
  .head{padding:16px 16px 14px}
  .head .nm{font-size:19px;font-weight:700;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
  .chip.bad{border-color:#f3d3cf;color:#b42318}
  .chip.good{border-color:#cfe9d7;color:#16794a}

  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{background:#fafbfd;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  tbody td{padding:8px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  .kv td:first-child{width:170px;color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;white-space:nowrap}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .num{font-family:ui-monospace,Menlo,monospace;text-align:right}
  .dim{color:#9aa4b2}
  .on{color:#16a34a;font-weight:600} .off{color:#b42318;font-weight:600}
  .msg{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .err{color:#dc2626;font-weight:600}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search name">
      <div class="opts" id="opts" hidden>
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
        <label><input type="checkbox" id="onlyPurch"> Purchasable</label>
        <label><input type="checkbox" id="hideDisc"> Hide discontinued</label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a supplier.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Suppliers — supplier 257 + 주소 · 연락처 · 할인 (읽기 전용)
   정본: docs/design/po-module.md §3-b · §3-c

   ⚠️ PostgREST 1,000행 캡 — 지금 257행이라 안 걸리지만 예외를 두지 않는다.
      settings.html 과 같은 틀로 .range() + count:'exact'.
   ⚠️ 딸림 표는 흩어져 있다(2026-09-15 실측):
        주소   0개 174 · 1개 79 · 2개 이상 4
        연락처 0개  75 · 1개 147 · 2개 이상 35
      ⇒ 상세는 「없으면 없다고 적고」 여럿이면 목록으로 보여 준다.
   ⚠️ supplier_discount 는 0행이다 — 사람이 채울 표인데 채울 자리가 아직 없다.
   ───────────────────────────────────────────────────────────── */

const PAGE = 100;
let sb=null, me=null, isAdmin=false;
let page=0, q="", onlyActive=true, onlyPurch=false, hideDisc=false, total=0, curId=null;

const esc = v => String(v==null?"":v).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const dim = v => (v===null||v===undefined||v==="") ? '<span class="dim">—</span>' : esc(v);
const yn  = v => v===true ? '<span class="on">✓</span>' : v===false ? '<span class="off">✗</span>' : '<span class="dim">—</span>';

/* ── 목록 ─────────────────────────────────────────────── */
async function loadList(){
  const from = page*PAGE, to = from+PAGE-1;
  let qry = sb.from("supplier")
    .select("id,name,is_active,is_purchasable,is_discontinued", { count:"exact" });
  // ⭐ 매니저는 정돈된 목록만 본다 — 살아 있고 · 살 수 있고 · 지금도 거래하는 곳(2026-09-15 실측 138곳)
  //    admin 만 토글로 그 바깥을 꺼내 본다(판정이 없는 31곳 · 잘못 꺼진 곳을 정리하는 자리).
  // ⚠️ 이것은 화면에서 감추는 것이지 막는 것이 아니다 — anon key 가 공개라 PostgREST 를 직접 치면 다 보인다.
  //    지금은 감추는 것으로 충분하다(공급처 목록은 비밀이 아니다). 진짜 막을 것이 생기면 RLS 로 간다.
  if(!isAdmin){
    qry = qry.eq("is_active", true).eq("is_purchasable", true).eq("is_discontinued", false);
  } else {
    if(onlyActive) qry = qry.eq("is_active", true);
    if(onlyPurch)  qry = qry.eq("is_purchasable", true);
    if(hideDisc)   qry = qry.eq("is_discontinued", false);
  }
  if(q) qry = qry.ilike("name", `%${q}%`);
  const { data, count, error } = await qry.order("name").range(from, to);

  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  total = count || 0;

  document.getElementById("rows").innerHTML = data.length ? data.map(r => {
    const tags = [];
    if(!r.is_active) tags.push(`<span class="tag">inactive</span>`);
    if(r.is_discontinued) tags.push(`<span class="tag disc">discontinued</span>`);
    return `<div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <span>${esc(r.name)}</span>
      <span style="display:flex;gap:4px">${tags.join("")}</span>
    </div>`;
  }).join("") : '<div class="msg">No suppliers match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  // 필터를 바꿔 고른 공급처가 목록에서 사라지면 상세도 비운다 (왼쪽·오른쪽이 어긋나 보인다)
  if(curId && !data.some(r => r.id === curId)){
    curId = null;
    document.getElementById("detail").innerHTML =
      '<div class="card"><div class="msg">Select a supplier.</div></div>';
  }

  const f = total ? from+1 : 0, t2 = Math.min(from+data.length, total);
  document.getElementById("range").textContent = `${f}–${t2} / ${total.toLocaleString()}`;
  document.getElementById("prev").disabled = page===0;
  document.getElementById("next").disabled = (from+PAGE) >= total;
}

/* ── 상세 ─────────────────────────────────────────────── */
async function loadDetail(id){
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [s, addr, cont, disc, prod, dflt] = await Promise.all([
    sb.from("supplier").select("*, ref_currency(code)").eq("id", id).maybeSingle(),
    sb.from("supplier_address").select("*").eq("supplier_id", id).order("type"),
    sb.from("supplier_contact").select("*").eq("supplier_id", id).order("is_default", {ascending:false}),
    sb.from("supplier_discount").select("*").eq("supplier_id", id).order("seq"),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true),
    sb.from("product_supplier").select("id", { count:"exact", head:true }).eq("supplier_id", id).eq("is_active", true).eq("is_default", true),
  ]);

  if(s.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(s.error.message)}</div></div>`; return; }
  const r = s.data;

  const chips = [];
  chips.push(`<span class="chip ${r.is_active?"good":"bad"}">${r.is_active?"active":"inactive"}</span>`);
  if(r.is_purchasable===true)  chips.push('<span class="chip good">purchasable</span>');
  if(r.is_purchasable===false) chips.push('<span class="chip">not purchasable</span>');
  if(r.is_purchasable===null)  chips.push('<span class="chip">purchasable: not set</span>');
  if(r.is_discontinued) chips.push(`<span class="chip bad">discontinued${r.discontinued_on?" "+r.discontinued_on:""}</span>`);
  chips.push(`<span class="chip">${esc(r.source)}</span>`);

  const kv = [
    ["Payment term",  dim(r.payment_term_name)],
    ["Account payable", `<span class="mono">${dim(r.account_payable_code)}</span>`],
    ["Currency",      `<span class="mono">${dim(r.ref_currency ? r.ref_currency.code : null)}</span>`],
    ["Tax rule",      dim(r.tax_rule)],
    ["Products linked", `<span class="mono">${(prod.count||0).toLocaleString()}</span>`],
    ["— of which default", `<span class="mono">${(dflt.count||0).toLocaleString()}</span>`],
    ["Cin7 comments", dim(r.cin7_comments)],
    ["Note",          dim(r.note)],
  ];

  const tbl = (title, n, head, rows) => `
    <div class="card">
      <h3>${title} <span class="n">${n}</span></h3>
      ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.join("")}</tbody></table>`
      : `<div class="msg">None.</div>`}
    </div>`;

  const aRows = (addr.data||[]).map(a => `<tr>
      <td class="mono">${dim(a.type)}</td>
      <td>${dim(a.line1)}${a.line2?"<br>"+esc(a.line2):""}</td>
      <td>${dim(a.city)}</td><td>${dim(a.state_province)}</td>
      <td class="mono">${dim(a.postal_code)}</td><td>${dim(a.country)}</td></tr>`);

  const cRows = (cont.data||[]).map(c => `<tr>
      <td>${dim(c.name)}</td><td class="mono">${dim(c.phone)}</td><td class="mono">${dim(c.mobile_phone)}</td>
      <td>${dim(c.email)}</td><td>${yn(c.is_default)}</td></tr>`);

  const dRows = (disc.data||[]).map(d => `<tr>
      <td class="num">${dim(d.seq)}</td><td>${dim(d.name)}</td>
      <td class="num">${d.percent==null?'<span class="dim">—</span>':esc(d.percent)+"%"}</td></tr>`);

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      <table class="kv"><tbody>
        ${kv.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}
      </tbody></table>
    </div>
    ${tbl("Addresses", addr.data ? addr.data.length : 0,
          ["Type","Street","City","Province","Postal","Country"], aRows)}
    ${tbl("Contacts", cont.data ? cont.data.length : 0,
          ["Name","Phone","Mobile","Email","Default"], cRows)}
    ${tbl("Discounts", disc.data ? disc.data.length : 0,
          ["Seq","Name","Percent"], dRows)}
  `;
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, meData) => {
  sb = client; me = meData; isAdmin = (me.role === "admin");
  document.getElementById("who").textContent = me.name + " · " + me.role;
  if(isAdmin) document.getElementById("opts").hidden = false;
  document.getElementById("logoutBtn").onclick = () => imsAuth.signOut();

  document.getElementById("prev").onclick = () => { if(page>0){ page--; loadList(); } };
  document.getElementById("next").onclick = () => { page++; loadList(); };
  document.getElementById("onlyActive").onchange = e => { onlyActive = e.target.checked; page=0; loadList(); };
  document.getElementById("onlyPurch").onchange  = e => { onlyPurch  = e.target.checked; page=0; loadList(); };
  document.getElementById("hideDisc").onchange   = e => { hideDisc   = e.target.checked; page=0; loadList(); };

  let timer=null;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(timer);
    timer = setTimeout(()=>{ q = e.target.value.trim(); page=0; loadList(); }, 250);
  });

  await loadList();
});
</script>
</body>
</html>
