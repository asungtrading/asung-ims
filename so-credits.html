<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Notes · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 뼈대는 so-payments.html(목록/상세 두 모드 · 모달) */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 230px - var(--ims-tabs-h, 0px))}
  .list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .list .row .l{min-width:0}
  .list .row .pn{font-family:var(--mono);font-size:13px}
  .list .row .sn{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .r{text-align:right;white-space:nowrap}
  .list .row .amt{font-family:var(--mono);font-size:12.5px}
  .list .row.cur .pn{color:#3b5bdb;font-weight:700}
  main{display:flex;flex-direction:column;gap:14px}
  .sobar{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .sobar .pn{font-family:var(--mono);font-size:20px;font-weight:700}
  .sogrid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  @media (max-width:900px){ .sogrid{grid-template-columns:1fr} }
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .sowarn{padding:8px 14px;display:flex;flex-wrap:wrap;gap:6px}
  .pomodal[hidden]{display:none}
  .pobox.wide{width:min(1100px, 96vw);max-width:none}
  .pobox input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:240px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .sofield{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font:inherit;font-size:12.5px}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .socols{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .socols .stat b{font-size:15px}
  tr.voided td{color:#9aa4b2;text-decoration:line-through}
  h5.sec{margin:14px 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <select id="wst">
        <option value="open">Open — not used up</option>
        <option value="issued">Issued</option>
        <option value="cancelled">Cancelled</option>
        <option value="all">All</option>
      </select>
      <input type="date" id="wfrom" title="Issued from">
      <span class="dash">—</span>
      <input type="date" id="wto" title="Issued to">
      <input type="search" id="wq" placeholder="Credit · customer · invoice · reason · note">
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn go" id="wnew">+ New credit note</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <div style="display:flex;gap:6px">
        <button class="pobtn" id="backWide" style="flex:1">‹ All credit notes</button>
        <button class="pobtn go" id="newCr" style="flex:1">+ New</button>
      </div>
      <input type="search" id="q" placeholder="Credit · customer · invoice">
      <div class="opts">
        <label>Show
          <select id="st">
            <option value="open">Open</option>
            <option value="issued">Issued</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>
  <main id="detail"><div class="card"><div class="msg">Select a credit note.</div></div></main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Credit Notes — 크레딧 노트 화면 1판 (2026-09-25 · 대화 Claude)
   읽기: 뷰 so_credit_list · so_credit_detail(p_credit_id) · so_credit_prepare(p_invoice_id) (asung-wms 20260925205011 · 칸 이름 그 파일 그대로)
   쓰기: so_credit_issue(p, p_commit) — manager · 미리 보기(false) → 발행(true) · 입력은 so-credit-read-1 보고 §7 issue_contract 그대로
         so_credit_attach(sales) · so_credit_detach · so_credit_cancel(manager)
   ⚠️⚠️ 크레딧 남은 금액 = so_credit_remaining 한 곳 · 「더 돌려받을 수 있는 수량」 · 돌려놓을 칸 기본 = so_credit_prepare(발행 창구와 같은 식) — 화면이 다시 계산하지 마라
   ⚠️ 단가 · 세율은 인보이스 줄에서 굳는다 — 화면은 보내지 않는다 · 금액 · 세금 · 수수료 제안은 미리 보기가 준다
   ⭐ 이번 판은 IMS 인보이스의 반품만(Caleb 2026-09-25) — Cin7 판매 반품은 전환 전 다음 판 · 환불은 Customer Payments 의 Refund
   ───────────────────────────────────────────────────────────── */
const CR_BUILD = "2026-09-25 · cr v1.1";
console.log("so-credits.html build:", CR_BUILD);

function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb = null, me = null, rank = 0;
let q = "", stFilter = "open", dateFrom = "", dateTo = "", curId = null;
let detailSeq = 0, cur = null;
const pg = imsPage(100), pgW = imsPage(50);
let WHS = [], ACCT_ALL = [], ACCT_NAME = {};
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;

const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits: 4 }));
const price = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
const orTerm = (t) => String(t || "").replace(/[,()"\\]/g, "%");
const REASON = { customer_return: "Customer return", damaged: "Damaged", billing_error: "Billing error", other: "Other" };
const NOREST = { damaged: "Damaged", b_grade: "B-grade", not_returned: "Not returned", other: "Other" };
const SRC = { manual: "by hand", auto: "auto" };
const binOf = (v) => (v && typeof v === "object") ? (v.bin || v.name || "") : (v || "");

function crChip(r){
  if(r.status === "cancelled") return '<span class="chip bad">cancelled</span>';
  if(Number(r.remaining) > 0) return '<span class="chip warn">open</span>';
  return '<span class="chip good">used</span>';
}

function baseQuery(){
  let qry = sb.from("so_credit_list").select(
    "id,credit_number,status,issued_on,customer_name,currency_code,reason,invoice_number,cin7_invoice_number,total,applied_to_invoices,refunded,remaining,invoice_numbers_applied",
    { count: "exact" });
  if(stFilter === "open")           qry = qry.eq("status", "issued").gt("remaining", 0);
  else if(stFilter === "issued")    qry = qry.eq("status", "issued");
  else if(stFilter === "cancelled") qry = qry.eq("status", "cancelled");
  if(dateFrom) qry = qry.gte("issued_on", dateFrom);
  if(dateTo)   qry = qry.lte("issued_on", dateTo);
  if(q) qry = qry.ilike("search_text", `%${orTerm(q)}%`);
  return qry.order("credit_number", { ascending: false });
}

function showWide(){
  curId = null; detailSeq++;
  document.getElementById("wide").hidden = false;
  document.getElementById("wrapBox").hidden = true;
  loadWide();
}
function openCr(id){
  curId = id;
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  loadList(); loadDetail(id);
}
function clearDetail(){
  curId = null; cur = null; detailSeq++;
  document.getElementById("detail").innerHTML = '<div class="card"><div class="msg">Select a credit note.</div></div>';
}

async function loadWide(){
  const { data, error } = await pgW.run(baseQuery());
  const box = document.getElementById("wrows");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = '<div class="msg">No credit notes match.</div>'; pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide); return; }
  box.innerHTML = `<table><thead><tr>
      <th>Credit</th><th>Status</th><th>Issued</th><th>Customer</th><th>For invoice</th><th>Reason</th>
      <th class="num">Total</th><th class="num">Applied</th><th class="num">Refunded</th><th class="num">Remaining</th>
    </tr></thead><tbody>${data.map(r => `
      <tr data-id="${r.id}">
        <td class="mono">${esc(r.credit_number)}</td>
        <td>${crChip(r)}</td>
        <td>${dim(r.issued_on)}</td>
        <td>${esc(r.customer_name || "")}</td>
        <td class="mono">${dim(r.invoice_number || r.cin7_invoice_number)}</td>
        <td>${esc(REASON[r.reason] || r.reason || "")}</td>
        <td class="num">${money(r.total)} <span class="dim">${esc(r.currency_code || "")}</span></td>
        <td class="num">${Number(r.applied_to_invoices) ? money(r.applied_to_invoices) : '<span class="dim">—</span>'}</td>
        <td class="num">${Number(r.refunded) ? money(r.refunded) : '<span class="dim">—</span>'}</td>
        <td class="num">${r.status === "cancelled" ? '<span class="dim">—</span>' : Number(r.remaining) > 0 ? `<span class="neutral">${money(r.remaining)}</span>` : '<span class="dim">0.00</span>'}</td>
      </tr>`).join("")}</tbody></table>
    <div class="sosub">Remaining = what we still owe the customer on this credit (the database works it out). It is used automatically on their next invoice, attached here by hand, or paid out as a refund on Customer Payments.</div>`;
  box.querySelectorAll("tbody tr").forEach(el => { el.onclick = () => openCr(el.dataset.id); });
  pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

async function loadList(){
  const { data, error } = await pg.run(baseQuery());
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  document.getElementById("rows").innerHTML = data.length ? data.map(r => `
    <div class="row ${r.id === curId ? "cur" : ""}" data-id="${r.id}">
      <span class="l">
        <div class="pn">${esc(r.credit_number)}</div>
        <div class="sn">${esc(r.customer_name || "")}</div>
        <div class="sn">${esc(r.issued_on || "")}${r.invoice_number ? " · for " + esc(r.invoice_number) : ""}</div>
      </span>
      <span class="r">
        <div class="amt">${money(r.total)}</div>
        <div style="margin-top:3px">${crChip(r)}</div>
      </span>
    </div>`).join("") : '<div class="msg">No credit notes match.</div>';
  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });
  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

async function gotoCr(number){
  q = number; document.getElementById("q").value = q; document.getElementById("wq").value = q;
  stFilter = "all"; document.getElementById("st").value = "all"; document.getElementById("wst").value = "all";
  pg.reset();
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  await loadList();
  const el = Array.from(document.querySelectorAll(".list .row")).find(r => r.querySelector(".pn").textContent === number);
  if(!el){ document.getElementById("detail").innerHTML = `<div class="card"><div class="msg">${esc(number)} not found.</div></div>`; return; }
  curId = el.dataset.id; await loadList(); loadDetail(curId);
}

/* ══ 모달 ══════════════════════════════════════════════ */
function modalOpen(html, wide){
  const b = document.getElementById("modalBox");
  b.className = "pobox" + (wide ? " wide" : "");
  b.innerHTML = html; document.getElementById("modal").hidden = false;
}
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });
function wireModalClose(){ document.querySelectorAll('#modalBox [data-m="close"]').forEach(b => { b.onclick = modalClose; }); }
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}
async function reloadHere(){
  const y = window.scrollY;
  await loadDetail(curId); await loadList();
  window.scrollTo(0, y);
}
const acctOpts = (blank) => `<option value="">${esc(blank)}</option>` + ACCT_ALL.map(a => `<option value="${a.id}">${esc(a.code)} · ${esc(a.name)}</option>`).join("");

/* ══ 발행 — 인보이스 고르기 → 줄 정하기 → 미리 보기 → 발행 (manager) ══════════
   ⭐ 입력 모양은 issue_contract 그대로: p = {issued_on, reason, note, invoice_id, warehouse_id, lines[]}
      product{so_invoice_line_id, qty_returned, restock_bin | not_restocked_reason(+note)} · freight{so_invoice_line_id, amount}
      restocking_fee{pct | amount ≤ 0, account_id} · other{amount, description, account_id}
   ⭐ 미리 보기(p_commit false)는 아무것도 쓰지 않는다 · 같은 p 로 발행(true) */
let prep = null;
function openNew(invoiceId){
  prep = null;
  modalOpen(`
    <h4>New credit note — from a sales invoice</h4>
    <div class="pbody" id="nwBody">
      <input type="search" id="nwQ" placeholder="Invoice number · customer · SO number" autocomplete="off">
      <div class="pick" id="nwList"><div class="msg">Type to search issued invoices.</div></div>
      <div class="sohint">Returns of goods sold through Cin7 (before the switch-over) come in the next version.</div>
    </div>
    <div class="pfoot"><span id="nwMsg" style="font-size:12.5px"></span><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
    </div>`, true);
  wireModalClose();
  const draw = async (t) => {
    const box = document.getElementById("nwList");
    if(!box) return;
    if(!t){ box.innerHTML = '<div class="msg">Type to search issued invoices.</div>'; return; }
    const { data, error } = await sb.from("so_invoice_list")
      .select("id,invoice_number,issued_on,bill_to_name,so_numbers,total,currency_code")
      .eq("status", "issued").ilike("search_text", `%${orTerm(t)}%`).order("invoice_number", { ascending: false }).limit(40);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(r => `<div class="prow" data-iid="${r.id}"><span class="mono">${esc(r.invoice_number)}</span> · ${esc(r.bill_to_name || "")}
        <div class="dim" style="font-size:11.5px">${esc(r.issued_on || "")} · ${esc(r.so_numbers || "")} · ${money(r.total)} ${esc(r.currency_code || "")}</div></div>`).join("")
      : '<div class="msg">No issued invoice matches.</div>';
    box.querySelectorAll("[data-iid]").forEach(el => { el.onclick = () => loadPrep(el.dataset.iid); });
  };
  imsQ("#nwQ", draw);
  if(invoiceId) loadPrep(invoiceId);
}

async function loadPrep(invoiceId){
  say("nwMsg", "", "Loading the invoice…");
  const { data, error } = await sb.rpc("so_credit_prepare", { p_invoice_id: invoiceId });
  if(error){ say("nwMsg", "err", error.message); return; }
  if(!data || !data.invoice){ say("nwMsg", "err", "That invoice is gone."); return; }
  if(!data.invoice.creditable){ say("nwMsg", "err", `Invoice ${data.invoice.invoice_number} is ${data.invoice.status} — only an issued invoice can take a credit note.`); return; }
  prep = data;
  say("nwMsg", "", "");
  drawForm();
}

function drawForm(){
  const v = prep.invoice, wh = prep.warehouse || {}, fee = prep.restock_fee || {};
  const prods = (prep.lines || []).filter(l => l.kind === "product");
  const chgs  = (prep.lines || []).filter(l => l.kind === "charge");
  document.getElementById("nwBody").innerHTML = `
    <div class="socols">
      <div class="stat">Invoice<b class="mono">${esc(v.invoice_number)}</b></div>
      <div class="stat">Customer<b style="font-family:inherit;font-size:14px">${esc(v.bill_to_name || v.customer_name || "")}</b></div>
      <div class="stat">Issued<b style="font-size:14px">${esc(v.issued_on || "")}</b><span class="dim" style="font-size:11px">${esc(v.days_since_invoice)} days ago</span></div>
      <div class="stat">Invoice total<b>${money(v.total)}</b><span class="dim" style="font-size:11px">${esc(v.currency_code || "")} · still owed ${money(v.remaining)}</span></div>
    </div>
    ${(prep.already_credited || []).length ? `<div class="sosub" style="margin-top:10px">Already credited on this invoice: ${prep.already_credited.map(c => `${esc(c.credit_number)} (${esc(c.status)} · ${money(c.total)})`).join(" · ")}</div>` : ""}
    ${fee.applies ? `<div class="sowarn"><span class="chip warn">⚠ Sold ${esc(fee.days_since_invoice)} days ago — past the ${esc(fee.days)}-day window. A ${esc(fee.pct)}% restocking fee is suggested (notice only — you decide below).</span></div>` : ""}

    <h5 class="sec">Credit note</h5>
    <div class="frow"><label>Reason</label><select id="fReason" class="sofield">${Object.entries(REASON).map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
    <div class="frow"><label>Note</label><input id="fNote" class="sofield" placeholder="required when the reason is Other"></div>
    <div class="frow"><label>Credit date</label><input id="fDate" class="sofield" type="date" value="${torontoToday()}" max="${torontoToday()}"></div>
    <div class="frow"><label>Goods come back to</label><select id="fWh" class="sofield">${WHS.map(w => `<option value="${w.id}" ${w.id === wh.warehouse_id ? "selected" : ""}>${esc(w.name)}</option>`).join("")}</select></div>

    <h5 class="sec">Products</h5>
    <table><thead><tr><th class="num">#</th><th>Item</th><th class="num">Sold</th><th class="num">Credited</th><th class="num">Can return</th>
      <th class="num">Unit</th><th class="num">Return</th><th>Back to stock</th></tr></thead>
    <tbody>${prods.map(l => `<tr data-pl="${l.so_invoice_line_id}">
      <td class="num">${esc(l.line_no)}</td>
      <td><span class="mono">${esc(l.sku || "")}</span>${Number(l.pack_factor) > 1 ? ` <span class="dim">×${esc(l.pack_factor)}</span>` : ""}<div class="dim" style="font-size:11.5px">${esc(l.description || "")}</div></td>
      <td class="num">${qty(l.qty_sold)}</td><td class="num">${Number(l.qty_credited) ? qty(l.qty_credited) : '<span class="dim">0</span>'}</td>
      <td class="num">${qty(l.qty_returnable)}</td>
      <td class="num">${price(l.unit_price)}<div class="dim" style="font-size:11px">${esc(l.rate_pct !== null && l.rate_pct !== undefined ? Number(l.rate_pct) + "% tax" : "")}</div></td>
      <td class="num"><input class="qin" type="number" step="any" min="0" max="${esc(l.qty_returnable)}" data-q ${Number(l.qty_returnable) > 0 ? "" : "disabled"}></td>
      <td style="white-space:nowrap">
        <select class="sofield" data-mode><option value="bin">to bin</option>${Object.entries(NOREST).map(([k, x]) => `<option value="${k}">not restocked · ${x}</option>`).join("")}</select>
        <input class="tin" data-bin value="${esc(binOf(l.restock_bin_default))}" placeholder="bin" style="width:110px">
        <input class="tin" data-nrn placeholder="note" style="width:120px" hidden>
      </td>
    </tr>`).join("") || '<tr><td colspan="8" class="dim">No product lines on this invoice.</td></tr>'}</tbody></table>
    <div class="sohint">Back to stock uses the bin the product sits in now (usual bin first). Not restocked keeps the goods out of stock and records why. Unit price and tax come from the invoice.</div>

    ${chgs.length ? `<h5 class="sec">Freight and charges</h5>
    <table><thead><tr><th>Charge</th><th class="num">On invoice</th><th class="num">Already credited</th><th class="num">Credit</th></tr></thead>
    <tbody>${chgs.map(l => `<tr data-cl="${l.so_invoice_line_id}">
      <td>${esc(l.description || l.sku || "Charge")}</td><td class="num">${money(l.amount)}</td>
      <td class="num">${Number(l.amount_credited) ? money(l.amount_credited) : '<span class="dim">0.00</span>'}</td>

function stale(){ const b = document.getElementById("isGo"); if(b) b.disabled = true; }

function buildP(){
  const lines = [];
  document.querySelectorAll("#nwBody tr[data-pl]").forEach(tr => {
    const qv = Number(tr.querySelector("[data-q]").value);
    if(!(qv > 0)) return;
    const mode = tr.querySelector("[data-mode]").value;
    const ln = { kind: "product", so_invoice_line_id: tr.dataset.pl, qty_returned: qv };
    if(mode === "bin"){ const b = tr.querySelector("[data-bin]").value.trim(); if(b) ln.restock_bin = b; }
    else { ln.not_restocked_reason = mode; const n = tr.querySelector("[data-nrn]").value.trim(); if(n) ln.not_restocked_note = n; }
    lines.push(ln);
  });
  document.querySelectorAll("#nwBody tr[data-cl]").forEach(tr => {
    const a = Number(tr.querySelector("[data-camt]").value);
    if(a > 0) lines.push({ kind: "freight", so_invoice_line_id: tr.dataset.cl, amount: a });
  });
  if(document.getElementById("fFee").checked){
    const fl = { kind: "restocking_fee" };
    const pct = document.getElementById("fFeePct").value.trim();
    if(pct !== "") fl.pct = Number(pct);
    const acc = document.getElementById("fFeeAcc").value;
    if(acc) fl.account_id = acc;
    lines.push(fl);
  }
  const oa = Number(document.getElementById("fOthA").value);
  if(oa > 0) lines.push({ kind: "other", amount: oa, description: document.getElementById("fOthD").value.trim() || null, account_id: document.getElementById("fOthAcc").value || null });
  return {
    issued_on: document.getElementById("fDate").value || null,
    reason: document.getElementById("fReason").value,
    note: document.getElementById("fNote").value.trim() || null,
    invoice_id: prep.invoice.id,
    warehouse_id: document.getElementById("fWh").value || null,
    lines: lines,
  };
}

async function runIssue(commit){
  const p = buildP();
  if(!p.lines.length){ say("nwMsg", "err", "Put a quantity on at least one product, a freight amount or an adjustment."); return; }
  say("nwMsg", "", commit ? "Issuing…" : "Checking…");
  document.getElementById("isGo").disabled = true;
  const { data, error } = await sb.rpc("so_credit_issue", { p: p, p_commit: commit });
  if(error){ say("nwMsg", "err", error.message); return; }
  if(commit){
    modalClose();
    if(data && data.credit_id) openCr(data.credit_id); else showWide();
    return;
  }
  const t = data.totals || {}, fs = data.fee_suggested;
  document.getElementById("pvOut").innerHTML = `
    <div class="card" style="padding:10px 14px">
      <table><thead><tr><th>Kind</th><th>Item</th><th class="num">Qty</th><th>Stock</th><th class="num">Unit</th><th class="num">Amount</th><th class="num">Tax</th></tr></thead>
      <tbody>${(data.lines || []).map(l => `<tr>
        <td>${esc(l.kind)}</td><td><span class="mono">${esc(l.sku || "")}</span> <span class="dim">${esc(l.description || "")}</span></td>
        <td class="num">${qty(l.qty_returned)}</td>
        <td>${l.kind === "product" ? (l.restock_bin ? `back to <span class="mono">${esc(l.restock_bin)}</span>` : `<span class="neutral">not restocked · ${esc(NOREST[l.not_restocked_reason] || l.not_restocked_reason || "")}</span>`) : ""}</td>
        <td class="num">${price(l.unit_price)}</td><td class="num">${money(l.amount)}</td><td class="num">${money(l.tax_amount)}</td></tr>`).join("")}</tbody></table>
      <div class="socols">
        <div class="stat">Products<b>${money(t.lines_amount)}</b></div>
        <div class="stat">Fee<b>${money(t.fee_amount)}</b></div>
        <div class="stat">Tax<b>${money(t.tax_amount)}</b></div>
        <div class="stat">Credit total<b>${money(t.total)}</b></div>
      </div>
      ${fs ? `<div class="sohint" style="margin-top:8px">Suggested restocking fee: ${money(fs.amount)} (${esc(fs.pct)}% · ${esc(fs.days_since_invoice)} days after the invoice). Tick Charge a fee above to include it.</div>` : ""}
      ${(data.warnings || []).length ? `<div class="sowarn" style="padding-left:0">${data.warnings.map(w => `<span class="chip warn">⚠ ${esc(w)}</span>`).join("")}</div>` : ""}
    </div>`;
  say("nwMsg", "", "Nothing is saved until you press Issue credit note.");
  document.getElementById("isGo").disabled = false;
}

/* 붙이기 — 이 크레딧의 남은 몫을 그 손님의 열린 인보이스(같은 통화)에 · sales */
function openAttach(){
  const v = cur.credit_row, inv = (cur.open_invoices || []);
  modalOpen(`
    <h4>Attach ${esc(v.credit_number)} — ${money(v.remaining)} ${esc(v.currency_code || "")} left</h4>
    <div class="pbody">
      <table><thead><tr><th>Invoice</th><th>Issued</th><th>Due</th><th>Orders</th><th class="num">Still owed</th><th class="num">Attach</th></tr></thead>
      <tbody>${inv.map(i => `<tr>
        <td class="mono">${esc(i.invoice_number)}</td><td>${dim(i.issued_on)}</td>
        <td>${i.due_unknown ? '<span class="dim">no due date</span>' : dim(i.due_on)}${Number(i.days_overdue) > 0 ? ` <span class="off" style="font-size:11.5px">${esc(i.days_overdue)}d over</span>` : ""}</td>
        <td class="mono" style="font-size:12px">${esc(i.so_numbers || "")}</td>
        <td class="num">${money(i.remaining)}</td>
        <td class="num"><input class="qin" type="number" step="0.01" min="0" data-att="${i.invoice_id}"></td>
      </tr>`).join("")}</tbody></table>
      <div class="sohint">Oldest first is usual. Nothing is saved until you press Attach.</div>
      <div id="atMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn" id="atFill">Fill oldest first</button>
      <button class="pobtn go" id="atGo">Attach</button>
    </div>`);
  wireModalClose();
  /* ⚠️ 채우기는 「남은 몫을 위에서부터 나눠 적는」 입력 도우미일 뿐 — 한도 검사는 so_credit_attach(DB)가 한다 */
  document.getElementById("atFill").onclick = () => {
    let left = Number(v.remaining) || 0;
    document.querySelectorAll("[data-att]").forEach((inp, k) => {
      const owed = Number(inv[k].remaining) || 0;
      const take = Math.max(0, Math.min(left, owed));
      inp.value = take > 0 ? take.toFixed(2) : "";
      left = Math.round((left - take) * 100) / 100;
    });
  };
  document.getElementById("atGo").onclick = async () => {
    const allocs = [];
    document.querySelectorAll("[data-att]").forEach(inp => { const a = Number(inp.value); if(a > 0) allocs.push({ invoice_id: inp.dataset.att, amount: a }); });
    if(!allocs.length){ say("atMsg", "err", "Type an amount on at least one invoice."); return; }
    say("atMsg", "", "Attaching…"); document.getElementById("atGo").disabled = true;
    const { error } = await sb.rpc("so_credit_attach", { p_credit_id: v.id, p_allocs: allocs });
    if(error){ say("atMsg", "err", error.message); document.getElementById("atGo").disabled = false; return; }
    modalClose(); await reloadHere();
  };
}
async function detachAlloc(allocId, label){
  const note = prompt(`Detach ${label}? The amount goes back to what we owe the customer on this credit.\n\nReason (required):`);
  if(note === null) return;
  if(!note.trim()){ alert("A reason is required."); return; }
  const { error } = await sb.rpc("so_credit_detach", { p_alloc_id: allocId, p_note: note.trim() });
  if(error){ alert(error.message); return; }
  await reloadHere();
}
async function cancelCredit(){
  const v = cur.credit_row;
  const note = prompt(`Cancel credit note ${v.credit_number}? Returned stock goes back out of the bins it came into. It must not be attached to anything first.\n\nReason (required):`);
  if(note === null) return;
  if(!note.trim()){ alert("A reason is required."); return; }
  const { error } = await sb.rpc("so_credit_cancel", { p_credit_id: v.id, p_note: note.trim() });
  if(error){ alert(error.message); return; }
  await reloadHere();
}

    q = ""; dateFrom = ""; dateTo = ""; stFilter = "open";
    ["wq","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wst").value = "open"; document.getElementById("q").value = ""; document.getElementById("st").value = "open";
    refilter();
  };
  document.getElementById("st").onchange = e => { stFilter = e.target.value; document.getElementById("wst").value = stFilter; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; document.getElementById("wq").value = v; pg.reset(); clearDetail(); loadList(); });

  /* ?inv=<invoice uuid> — Sales Invoices 의 「Raise a credit note」에서 · ?cr=CR-01000 — 번호로 열기 */
  const inv = imsParam("inv"), cr = imsParam("cr");
  if(cr){ await gotoCr(cr); return; }
  showWide();
  if(inv && isMgr()) openNew(inv);
});
</script>
</body>
</html>
