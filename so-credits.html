<script>
/* ─────────────────────────────────────────────────────────────
   Credit Notes — 크레딧 노트 화면 1판 (2026-09-25 · 대화 Claude)
   읽기: 뷰 so_credit_list · so_credit_detail(p_credit_id) · so_credit_prepare(p_invoice_id) (asung-wms 20260925205011 · 칸 이름 그 파일 그대로)
   쓰기: so_credit_issue(p, p_commit) — manager · 미리 보기(false) → 발행(true) · 입력은 so-credit-read-1 보고 §7 issue_contract 그대로
         so_credit_attach(sales) · so_credit_detach · so_credit_cancel(manager)
   ⚠️⚠️ 크레딧 남은 금액 = so_credit_remaining 한 곳 · 「더 돌려받을 수 있는 수량」 · 돌려놓을 칸 기본 = so_credit_prepare(발행 창구와 같은 식) — 화면이 다시 계산하지 마라
   ⚠️ 단가 · 세율은 인보이스 줄에서 굳는다 — 화면은 보내지 않는다 · 금액 · 세금 · 수수료 제안은 미리 보기가 준다
   ⭐ IMS 인보이스의 크레딧 + cr v3: 인보이스 없는 크레딧(참조 번호 · 판정 602 · 609 · 610 · crn-1 20261021194405) · 환불은 Customer Payments 의 Refund
   ───────────────────────────────────────────────────────────── */
const CR_BUILD = "2026-10-23 · cr v5";   // 대화 Claude — bgr-1d(3d0d7fe) · 1e(87a00e5) · 판정 640 · 649 · 650 · 651: 「not restocked」 고르기에서 b_grade 를 뺀다(옛 줄 표시는 그대로) · B급으로 판 줄에 Final sale 꼬리표 · 그 줄의 칸 기본 = 그 B급 칸(B-grade 꼬리표) · B급 칸이 사라졌으면 알림 · 크레딧 창 아래 이 창고의 B급 칸 이름(상자 상한 반품을 바로 B급 칸으로 · 650) · 경고 final_sale · bgrade_bin_gone 글 · Final sale 줄이 있으면 Issue 때 「Issue anyway?」 확인(막지 않는다) ← cr csv v3:   // Caleb 「바코드가 깨지는 것을 막을 방법」: 바코드 · SKU 칸을 ="…" 로(엑셀이 글자로 읽는다) ← 2026-10-22 · cr csv v2 ·   // 대화 Claude — Caleb 「다른 메뉴도 같은 양식으로」: 크레딧 상세 ↓ Credit CSV(한 줄 = 크레딧 줄 · Barcode · 끝에 합계) ← 2026-10-22 · cr csv v1 ·   // 대화 Claude — 판정 628(SO 각 탭 목록 내보내기): ↓ CSV — 지금 거르기 그대로 · 모든 쪽 · 화면과 같은 칸 ← 2026-10-22 · cr gone v1: 대화 Claude — Caleb 「새로 고침을 하면 목록이 사라진다」(inv gone v1 과 같은 손질): 목록으로 돌아가면 주소의 ?… 를 지우고(replaceState · 새로 고침이 지운 문서를 다시 열지 않게) · 없는 문서면 안내 + 목록 단추 ← 2026-10-22 · cr v4b: 대화 Claude — Caleb 화면 시험(참조 크레딧 · 날짜 없음): 경고 열쇠가 글자 그대로 보였다(fee_window_unknown) → 넷을 사람 말로(fee_window_unknown · restock_fee_window:N · fee_rate_mixed · inactive_bin:칸) ← cr v4a: 대화 Claude — Caleb 화면 시험: 가격 조정 표 제목 「Adjust」 · 「Units」 → 「Qty to adjust」(두 표 같은 글) · 칸에 qty 힌트 ← cr v4: 대화 Claude — crn-2(판정 603 · 611 ~ 614): 가격 조정 줄(지난 세일 차액) — 인보이스 크레딧은 「Price adjustment」 표(낸 단가 · 지금 가격 층 · 수량 · 새 단가 → 층마다 줄을 저절로 나눠 보낸다 · 검사는 서버) · 참조 크레딧은 손 줄(낸 단가 · 새 단가) · 사유 Price adjustment · 미리 보기 · 상세에 「9.49 → 7.99」 · 재고 없음 · 경고 글 둘 ← cr v3: 대화 Claude — crn-1(판정 602 · 609 · 610): 인보이스 없는 크레딧(참조 번호 · 손 단가 · 세금은 손님 기본 배송지 규칙 제안 · 원가는 평균부터) 만들기 창 · 칸 이름 cin7_* → ref_* (목록 select · 목록 · 상세) · 경고 글(manual_unit_price · reference_seen · origin_sale_untraced) ← cr v2f 2026-10-19 · 대화 Claude — 문서 메일(ims-doc v3): Email to customer… · Emails 칸 · Note 고치기(so_credit_note_set) ← cr v2e: 대화 Claude — doc 인쇄(ims-doc v2): Print credit note(credit_note) ← cr v2d: 대화 Claude — Caleb 화면 시험 60020 크레딧 미리 보기: 「Products 4.00」 이 실은 운임이었다(lines_amount = 제품 + 운임 + 그 밖 줄) → 「Lines」 로(미리 보기 · 상세) ← cr v2c 2026-10-07 — 대화 Claude — 운임 할인 크레딧(판정 355 · fr-3 20261007181109): 줄 종류 「freight discount」 · 만들기 창의 운임 줄에 할인 · 순액 · 남은 순액(so_credit_prepare 새 열쇠) · 「할인은 같은 비율로 저절로 따라온다」 안내 · 미리 보기 · 상세 합계에 Freight discount · 순액 0(무료 배송)이면 「손님에게 돌아가는 돈 없음」 ← cr v2b 2026-10-07 — 대화 Claude — 만들기 창 미리 보기 표의 줄 종류도 「order discount」(cr v2a 는 상세 표만 고쳤다 · Caleb 화면 시험 CR-01005) ← cr v2a 2026-10-07 — 대화 Claude — 할인 표시(판정 316 · 325 · 미룬 120): 줄 종류 order_discount → 「order discount」 · 합계 칸에 Order discount(so_credit.order_discount_amount · 음수 저장 · 있을 때만) — 지금까지 칸이 없어 Products + Fee + Tax 가 Total 과 안 맞아 보였다 ← cr v2 2026-10-05 · 대화 Claude — asm-3d(판정 244 · 245 · asm 묶음 7): 콤보 인보이스 줄 = 반품 단위(수량 = 콤보 수) · 그 아래 구성품마다 돌아갈 칸 또는 안 돌아옴(요청 lines[].components[] · 기본 칸 = so_credit_prepare 의 combo_components[].restock_bin_default) · 미리 보기 · 상세에서 구성품 크레딧 줄을 콤보 줄 아래로 · 구성품 하나는 Other adjustment(금액만 · 재고 없음 · 판정 245) ← cr sc v1 // 대화 Claude — surcharge-3(묶음 7): 반품 수량만큼 자동으로 붙는 surcharge 줄을 보이기만(손으로 못 넣는다 · surcharge-2b) · 합계 Surcharge ← 「cr thumb v1」 대화 Claude — 판정 214: 크레딧 만들기의 Products 표 · 상세 줄 표의 SKU 왼쪽에 대표 사진(imsThumb · thumb-1) ← cr v1.1
console.log("so-credits.html build:", CR_BUILD);
/* 줄 사진(판정 214 · 화면만 — 인쇄 인보이스에는 넣지 않는다) — 공통 js 가 옛 판으로 캐시돼 있으면 칸 없이 그린다
   ⭐ 채우기는 그린 뒤 저절로 — 화면이 바뀌면(MutationObserver) 안 채운 칸만 모아 한 번에 읽는다 · 채울 칸이 없으면 아무것도 안 묻는다 */
const thumbOf = sku => (sku && typeof window.imsThumb === "function") ? window.imsThumb(sku) : "";
(() => { let t = null; const go = () => { t = null; if(typeof window.imsThumbFill === "function") window.imsThumbFill(document); };
  new MutationObserver(() => { if(!t) t = setTimeout(go, 60); }).observe(document.documentElement, { childList:true, subtree:true }); })();

function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb = null, me = null, rank = 0;
let q = "", stFilter = "open", dateFrom = "", dateTo = "", curId = null;
let detailSeq = 0, cur = null;
const pg = imsPage(100), pgW = imsPage(50);
let WHS = [], ACCT_ALL = [], ACCT_NAME = {};
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;

const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits: 4 }));
const price = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 4 }));
const orTerm = (t) => String(t || "").replace(/[,()"\\]/g, "%");
const REASON = { customer_return: "Customer return", damaged: "Damaged", billing_error: "Billing error", price_adjustment: "Price adjustment", other: "Other" };   // cr v4 — 판정 612
const NOREST = { damaged: "Damaged", b_grade: "B-grade", not_returned: "Not returned", other: "Other" };
const SRC = { manual: "by hand", auto: "auto" };
const binOf = (v) => (v && typeof v === "object") ? (v.bin || v.name || "") : (v || "");

function crChip(r){
  if(r.status === "cancelled") return '<span class="chip bad">cancelled</span>';
  if(Number(r.remaining) > 0) return '<span class="chip warn">open</span>';
  return '<span class="chip good">used</span>';
}

/* ── csv v1 · 판정 628 — 목록 내보내기(CSV · UTF-8 BOM 이라 엑셀에서 바로 열린다 · 지금 거르기 그대로 · 모든 쪽) ── */
function csvCell(v){
  if(v === null || v === undefined) return "";
  const t = String(v);
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function csvDownload(name, rows){
  const txt = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const csvPlain = (h) => String(h === null || h === undefined ? "" : h).replace(/<[^>]+>/g, "").replace(/&nbsp;/g, " ").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/\s+/g, " ").trim();
const csvDay = () => new Date().toLocaleDateString("sv-SE", { timeZone: "America/Toronto" });
const csvNum = (v) => (v === null || v === undefined || v === "") ? "" : Number(v);
/* ⭐ 목록 질의를 1,000 씩(Data API 한 번 한도) 끝까지 · 5 만 줄에서 멈춘다 */
async function csvAllPages(makeQuery, btn){
  const all = [];
  for(let from = 0; ; from += 1000){
    const { data, error } = await makeQuery().range(from, from + 999);
    if(error) throw new Error(error.message);
    all.push(...(data || []));
    if(btn) btn.textContent = `Preparing… ${all.length}`;
    if(!data || data.length < 1000 || all.length >= 50000) break;
  }
  return all;
}
async function csvRun(btn, fn){
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Preparing…";
  try { await fn(); } catch(e){ alert("Download failed: " + e.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}
function exportWide(btn){
  return csvRun(btn, async () => {
    const all = await csvAllPages(baseQuery, btn);
    if(!all.length){ alert("No credit notes match — nothing to download."); return; }
    const rows = [["Credit","Status","Issued","Customer","For invoice","Reference invoice","Reason","Total","Applied","Refunded","Remaining","Applied to invoices","Currency"]];
    all.forEach(r => rows.push([r.credit_number, csvPlain(crChip(r)), r.issued_on || "", r.customer_name || "", r.invoice_number || "", r.ref_invoice_number || "",
      REASON[r.reason] || r.reason || "", csvNum(r.total), csvNum(r.applied_to_invoices), csvNum(r.refunded), r.status === "cancelled" ? "" : csvNum(r.remaining),
      r.invoice_numbers_applied || "", r.currency_code || ""]));
    csvDownload(`credit-notes-${csvDay()}.csv`, rows);
  });
}
function baseQuery(){
  let qry = sb.from("so_credit_list").select(
    "id,credit_number,status,issued_on,customer_name,currency_code,reason,invoice_number,ref_invoice_number,total,applied_to_invoices,refunded,remaining,invoice_numbers_applied",
    { count: "exact" });
  if(stFilter === "open")           qry = qry.eq("status", "issued").gt("remaining", 0);
  else if(stFilter === "issued")    qry = qry.eq("status", "issued");
  else if(stFilter === "cancelled") qry = qry.eq("status", "cancelled");
  if(dateFrom) qry = qry.gte("issued_on", dateFrom);
  if(dateTo)   qry = qry.lte("issued_on", dateTo);
  if(q) qry = qry.ilike("search_text", `%${orTerm(q)}%`);
  return qry.order("credit_number", { ascending: false });
}

function showWide(){
  if(location.search) history.replaceState(null, "", location.pathname);   // gone v1 — 목록이면 주소의 ?… 를 지운다
  curId = null; detailSeq++;
  document.getElementById("wide").hidden = false;
  document.getElementById("wrapBox").hidden = true;
  loadWide();
}
function openCr(id){
  curId = id;
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  loadList(); loadDetail(id);
}
function clearDetail(){
  curId = null; cur = null; detailSeq++;
  document.getElementById("detail").innerHTML = '<div class="card"><div class="msg">Select a credit note.</div></div>';
}

async function loadWide(){
  const { data, error } = await pgW.run(baseQuery());
  const box = document.getElementById("wrows");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = '<div class="msg">No credit notes match.</div>'; pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide); return; }
  box.innerHTML = `<table><thead><tr>
      <th>Credit</th><th>Status</th><th>Issued</th><th>Customer</th><th>For invoice</th><th>Reason</th>
      <th class="num">Total</th><th class="num">Applied</th><th class="num">Refunded</th><th class="num">Remaining</th>
    </tr></thead><tbody>${data.map(r => `
      <tr data-id="${r.id}">

async function loadPrep(invoiceId){
  say("nwMsg", "", "Loading the invoice…");
  const { data, error } = await sb.rpc("so_credit_prepare", { p_invoice_id: invoiceId });
  if(error){ say("nwMsg", "err", error.message); return; }
  if(!data || !data.invoice){ say("nwMsg", "err", "That invoice is gone."); return; }

  prep = data;
  say("nwMsg", "", "");
  drawForm();

const CR_KIND = { order_discount: "order discount", freight_discount: "freight discount", restocking_fee: "restocking fee", price_adjustment: "price adjustment" };   // cr v2c — 줄 종류 글자 한 곳

const isAdj = (l) => l.kind === "price_adjustment";

const lnUnit = (l) => isAdj(l) ? `${price(l.unit_price_before)} → ${price(l.unit_price_after)}<div class="dim" style="font-size:11px">${price(l.unit_price)} each</div>` : price(l.unit_price);
const tiersText = (ts) => (ts || []).filter(t => Number(t.qty) > 0).map(t => `${qty(t.qty)} @ ${price(t.unit_price)}${t.paid ? "" : " <span class=\"dim\">adjusted</span>"}`).join(" · ");
function adjRow(l){

      <td class="num"><input class="qin" type="number" step="any" min="0" data-aq placeholder="qty" ${open ? "" : "disabled"}></td>
      <td class="num"><input class="qin" type="number" step="0.0001" min="0" data-anp placeholder="new price" ${open ? "" : "disabled"}></td>

/* ⚠️ 나누기는 입력 도우미일 뿐 — 서버가 「새 단가보다 비싼 가장 낮은 층」에서 한 줄씩 떼고 한도를 검사한다(crn-2 이견 6 · 7) */
function splitAdj(tiers, q, np){
  const out = []; let left = q;
  const ts = (tiers || []).filter(t => Number(t.qty) > 0 && Number(t.unit_price) > np).sort((x, y) => Number(x.unit_price) - Number(y.unit_price));
  for(const t of ts){ if(left <= 0) break; const take = Math.min(left, Number(t.qty)); out.push(take); left = Math.round((left - take) * 1e6) / 1e6; }
  return { parts: out, left: left };
}

async function fillBgHint(){

  const mine = BGBIN.filter(b => b.warehouse_id === wh);
  if(el()) el().innerHTML = mine.length
    ? `Damaged package but the item is fine? Type a B-grade bin as the bin to take it back as B-grade: ${mine.map(b => `<span class="mono">${esc(b.name)}</span>`).join(" · ")}. If the bin has no price for it yet, set one in B-grade Stock.`
    : "";
}

function buildP(){
  const lines = [];
  document.querySelectorAll("#nwBody tr[data-pl]").forEach(tr => {
    const qv = Number(tr.querySelector("[data-q]").value);
    if(!(qv > 0)) return;
    const mode = (tr.querySelector("[data-mode]") || {}).value;
    const ln = { kind: "product", so_invoice_line_id: tr.dataset.pl, qty_returned: qv };
    const kids = Array.from(document.querySelectorAll(`#nwBody tr[data-cc="${tr.dataset.pl}"]`));
    if(kids.length){   // cr v2 — 콤보: 줄에는 칸 · 사유를 안 적고 구성품마다 적는다(components[] · 판정 245)
      ln.components = kids.map(k => {
        const m = k.querySelector("[data-mode]").value, c = { sku: k.dataset.csku };
        if(m === "bin"){ const b = k.querySelector("[data-bin]").value.trim(); if(b) c.restock_bin = b; }
        else { c.not_restocked_reason = m; const n = k.querySelector("[data-nrn]").value.trim(); if(n) c.not_restocked_note = n; }
        return c;
      });
    } else if(mode === "bin"){ const b = tr.querySelector("[data-bin]").value.trim(); if(b) ln.restock_bin = b; }
    else { ln.not_restocked_reason = mode; const n = tr.querySelector("[data-nrn]").value.trim(); if(n) ln.not_restocked_note = n; }
    lines.push(ln);
  });
  let adjBad = "";
  document.querySelectorAll("#nwBody tr[data-adj]").forEach(tr => {   // cr v4 — 가격 조정(판정 603)
    const aq = Number(tr.querySelector("[data-aq]").value), npRaw = tr.querySelector("[data-anp]").value.trim();
    if(!(aq > 0) && npRaw === "") return;
    const l = (prep.lines || []).find(x => x.so_invoice_line_id === tr.dataset.adj) || {};
    if(!(aq > 0)){ adjBad = adjBad || `${l.sku || ""}: type how many units to adjust.`; return; }
    if(npRaw === ""){ adjBad = adjBad || `${l.sku || ""}: type the new unit price.`; return; }
    const np = Number(npRaw), sp = splitAdj((l.adjust || {}).tiers, aq, np);
    if(sp.left > 0){ adjBad = adjBad || `${l.sku || ""}: only ${aq - sp.left} unit(s) are priced above ${np} — adjust at most that many.`; return; }
    sp.parts.forEach(n => lines.push({ kind: "price_adjustment", so_invoice_line_id: tr.dataset.adj, qty: n, new_unit_price: np }));
  });
  if(adjBad){ say("nwMsg", "err", adjBad); return null; }
  document.querySelectorAll("#nwBody tr[data-cl]").forEach(tr => {
    const a = Number(tr.querySelector("[data-camt]").value);
    if(a > 0) lines.push({ kind: "freight", so_invoice_line_id: tr.dataset.cl, amount: a });
  });
  if(document.getElementById("fFee").checked){
    const fl = { kind: "restocking_fee" };
    const pct = document.getElementById("fFeePct").value.trim();
    if(pct !== "") fl.pct = Number(pct);
    const acc = document.getElementById("fFeeAcc").value;
    if(acc) fl.account_id = acc;
    lines.push(fl);
  }
  const oa = Number(document.getElementById("fOthA").value);
  if(oa > 0) lines.push({ kind: "other", amount: oa, description: document.getElementById("fOthD").value.trim() || null, account_id: document.getElementById("fOthAcc").value || null });
  return {
    issued_on: document.getElementById("fDate").value || null,
    reason: document.getElementById("fReason").value,
    note: document.getElementById("fNote").value.trim() || null,
    invoice_id: prep.invoice.id,
    warehouse_id: document.getElementById("fWh").value || null,
    lines: lines,
  };
}

async function runIssue(commit){
  const p = mode === "ref" ? buildRefP() : buildP();
  if(!p) return;
  if(!p.lines.length){ say("nwMsg", "err", "Put a quantity on at least one product, a price adjustment, a freight amount or an adjustment."); return; }
  if(commit && lastWarn.some(w => String(w).startsWith("final_sale:"))){   // cr v5 — 판정 640: 막지 않는다 · 묻기만
    const skus = lastWarn.filter(w => String(w).startsWith("final_sale:")).map(w => String(w).slice(11)).join(", ");

      <tbody>${(data.lines || []).map(l => `<tr${l.combo_parent_line_no ? ' class="comp"' : ""}>
        <td>${esc(CR_KIND[l.kind] || l.kind || "")}</td><td>${l.combo_parent_line_no ? '<span class="cind">↳</span>' : ""}<span class="mono">${esc(l.sku || "")}</span>${Array.isArray(l.combo_components) ? ' <span class="tag">combo</span>' : ""} <span class="dim">${esc(l.description || "")}</span></td>
        <td class="num">${lnQty(l)}</td>
        <td>${isAdj(l) ? '<span class="dim">price only — no stock</span>' : Array.isArray(l.combo_components) ? '<span class="dim">components below</span>' : l.kind === "product" ? (l.restock_bin ? `back to <span class="mono">${esc(l.restock_bin)}</span>` : `<span class="neutral">not restocked · ${esc(NOREST[l.not_restocked_reason] || l.not_restocked_reason || "")}</span>`) : l.kind === "surcharge" ? '<span class="dim">added automatically</span>' : ""}</td>
        <td class="num">${lnUnit(l)}</td><td class="num">${money(l.amount)}</td><td class="num">${money(l.tax_amount)}</td></tr>`).join("")}</tbody></table>
      <div class="socols">
        <div class="stat" title="Products, freight and other lines before discounts and fees">Lines<b>${money(t.lines_amount)}</b></div>
        ${Number(t.freight_discount_amount) ? `<div class="stat">Freight discount<b>−${money(Math.abs(Number(t.freight_discount_amount)))}</b></div>` : ""}
        <div class="stat">Fee<b>${money(t.fee_amount)}</b></div>
        ${Number(t.surcharge_amount) ? `<div class="stat">Surcharge<b>${money(t.surcharge_amount)}</b></div>` : ""}
        <div class="stat">Tax<b>${money(t.tax_amount)}</b></div>
        <div class="stat">Credit total<b>${money(t.total)}</b></div>
      </div>
      ${Number(t.freight_discount_amount) && !Number(t.total) ? '<div class="sohint" style="margin-top:8px">Nothing comes back to the customer — the freight discount cancels the freight (free shipping). The note still reverses freight sales and the freight discount in the books.</div>' : ""}
      ${fs ? `<div class="sohint" style="margin-top:8px">Suggested restocking fee: ${money(fs.amount)} (${esc(fs.pct)}% · ${esc(fs.days_since_invoice)} days after the invoice). Tick Charge a fee above to include it.</div>` : ""}
      ${(data.warnings || []).length ? `<div class="sowarn" style="padding-left:0">${data.warnings.map(w => `<span class="chip warn">⚠ ${esc(warnText(w))}</span>`).join("")}</div>` : ""}

/* ══ cr v3 — 인보이스 없는 크레딧(참조 번호 · 판정 602 · 609 · 610 · crn-1) ══════════
   ⭐ 입력 = so_credit_issue p { customer_id, ref{invoice_number(필수), order_number?, invoice_date?}, tax_rule?(비우면 손님 기본 배송지 규칙 제안),
      warehouse_id?(비우면 손님 기본 창고), reason, note, issued_on, lines[] }
      product{sku, qty_returned, unit_price(종이 인보이스의 단가), restock_bin | not_restocked_reason(+note)} · other{amount, description, account_id}
   ⚠️ 단가 · 수량은 시스템이 확인해 주지 못한다(IMS 에 그 판매가 없다) — 미리 보기가 늘 manual_unit_price 경고를 낸다

let TAXR = [];
const WARN_TEXT = {
  manual_unit_price: "Unit prices were typed by hand — check them against the paper invoice",
  reason_not_price_adjustment: "This note has only price adjustments — the reason should be Price adjustment",   // cr v4
  reason_price_adjustment_with_returns: "The reason is Price adjustment but goods are coming back too — check the reason",
  fee_window_unknown: "No original invoice date — can't tell whether the restocking-fee window applies",   // cr v4b
  fee_rate_mixed: "The returned lines carry different tax rates — the restocking fee is taxed at the first one",   // cr v4b
};
function warnText(w){
  const s = String(w || "");
  if(WARN_TEXT[s]) return WARN_TEXT[s];
  if(s.startsWith("final_sale:")) return s.slice(11) + " was sold as B-grade — Final sale, no return, no refund. Issue only as an exception";   // cr v5 — 판정 640
  if(s.startsWith("bgrade_bin_gone:")) return s.slice(16) + ": its B-grade bin is switched off or gone — it goes back to a regular bin";   // cr v5 — bgr-1d
  if(s.startsWith("restock_fee_window:")) return s.slice(19) + " days since the original invoice — a restocking fee may apply (not added automatically)";   // cr v4b
  if(s.startsWith("inactive_bin:")) return "Bin " + s.slice(13) + " is turned off — goods would go back into an inactive bin";   // cr v4b
  if(s.startsWith("reference_seen:")) return "Already credited on this reference number for the same product: " + s.slice(15) + " — check it is not a double credit";
  if(s.startsWith("origin_sale_untraced:")){ const x = s.split(":"); return `${x[1] || ""}: cost taken from ${x[2] === "layer_avg" ? "the current average" : (x[2] || "stock")} (the original sale is not traced)`; }
  return s;
}

function buildRefP(){
  if(!refCust){ say("nwMsg", "err", "Pick the customer first."); return null; }
  const refNo = document.getElementById("fRefNo").value.trim();
  if(!refNo){ say("nwMsg", "err", "Type the reference number (the invoice number on the paper)."); return null; }
  const lines = [];
  let bad = "";
  document.querySelectorAll("#refRows tr[data-rl]").forEach(tr => {
    const sku = tr.querySelector("[data-sku]").value.trim();
    const qv = Number(tr.querySelector("[data-q]").value);
    const upRaw = tr.querySelector("[data-up]").value.trim();
    if(!sku && !(qv > 0) && upRaw === "") return;
    if(!sku){ bad = bad || "A product line has no SKU."; return; }
    if(!(qv > 0)){ bad = bad || `${sku}: type the quantity coming back.`; return; }
    if(upRaw === ""){ bad = bad || `${sku}: type the unit price from the paper invoice.`; return; }
    const m = tr.querySelector("[data-mode]").value;
    const ln = { kind: "product", sku: sku, qty_returned: qv, unit_price: Number(upRaw) };
    if(m === "bin"){ const b = tr.querySelector("[data-bin]").value.trim(); if(b) ln.restock_bin = b; }
    else { ln.not_restocked_reason = m; const n = tr.querySelector("[data-nrn]").value.trim(); if(n) ln.not_restocked_note = n; }
    lines.push(ln);
  });
  document.querySelectorAll("#refAdjRows tr[data-ra]").forEach(tr => {   // cr v4 — 참조 크레딧 가격 조정(손 줄)

    const pr = tr.querySelector("[data-rpaid]").value.trim(), nw = tr.querySelector("[data-rnew]").value.trim();
    if(!sku && !(qv > 0) && pr === "" && nw === "") return;
    if(!sku){ bad = bad || "A price adjustment line has no SKU."; return; }
    if(!(qv > 0)){ bad = bad || `${sku}: type how many units to adjust.`; return; }
    if(pr === "" || nw === ""){ bad = bad || `${sku}: type both the price paid and the new price.`; return; }
    lines.push({ kind: "price_adjustment", sku: sku, qty: qv, paid_unit_price: Number(pr), new_unit_price: Number(nw) });
  });
  if(bad){ say("nwMsg", "err", bad); return null; }
  const oa = Number(document.getElementById("fOthA").value);
  if(oa > 0) lines.push({ kind: "other", amount: oa, description: document.getElementById("fOthD").value.trim() || null, account_id: document.getElementById("fOthAcc").value || null });
  const ref = { invoice_number: refNo };
  const rd = document.getElementById("fRefDate").value, ro = document.getElementById("fRefOrd").value.trim();
  if(rd) ref.invoice_date = rd;
  if(ro) ref.order_number = ro;
  const p = {
    issued_on: document.getElementById("fDate").value || null,
    reason: document.getElementById("fReason").value,
    note: document.getElementById("fNote").value.trim() || null,
    customer_id: refCust.id,
    ref: ref,
    lines: lines,
  };
  const wh = document.getElementById("fWh").value, tx = document.getElementById("fTax").value;
  if(wh) p.warehouse_id = wh;
  if(tx) p.tax_rule = tx;
  return p;
}

      <table><thead><tr><th>Invoice</th><th>Issued</th><th>Due</th><th>Orders</th><th class="num">Still owed</th><th class="num">Attach</th></tr></thead>

        <td class="mono">${esc(i.invoice_number)}</td><td>${dim(i.issued_on)}</td>
        <td>${i.due_unknown ? '<span class="dim">no due date</span>' : dim(i.due_on)}${Number(i.days_overdue) > 0 ? ` <span class="off" style="font-size:11.5px">${esc(i.days_overdue)}d over</span>` : ""}</td>

    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn" id="atFill">Fill oldest first</button>
      <button class="pobtn go" id="atGo">Attach</button>

  wireModalClose();
  /* ⚠️ 채우기는 「남은 몫을 위에서부터 나눠 적는」 입력 도우미일 뿐 — 한도 검사는 so_credit_attach(DB)가 한다 */
  document.getElementById("atFill").onclick = () => {
    let left = Number(v.remaining) || 0;
    document.querySelectorAll("[data-att]").forEach((inp, k) => {

      left = Math.round((left - take) * 100) / 100;
    });
  };
  document.getElementById("atGo").onclick = async () => {
    const allocs = [];
    document.querySelectorAll("[data-att]").forEach(inp => { const a = Number(inp.value); if(a > 0) allocs.push({ invoice_id: inp.dataset.att, amount: a }); });

    if(error){ say("atMsg", "err", error.message); document.getElementById("atGo").disabled = false; return; }
    modalClose(); await reloadHere();
  };
}

/* csv v2 — 바코드: SKU → 제품 → product_barcode(활성 · 대표 먼저 · 없으면 첫 것) · 200 개씩 · 실패해도 내보내기는 멈추지 않는다(칸이 빈다) */
/* csv v3 — 엑셀이 긴 숫자를 숫자로 바꾸지 않게(지수 · 앞 0 · 15 자리 넘는 자리) 바코드 · SKU 는 ="…" 꼴로 — 엑셀에는 글자 그대로 보인다 */
const csvText = (v) => (v === null || v === undefined || v === "") ? "" : '="' + String(v).replace(/"/g, "") + '"';
async function barcodesForSkus(skus){
  const out = {}, want = [...new Set(skus.filter(Boolean))];
  try {
    for(let i = 0; i < want.length; i += 200){
      const part = want.slice(i, i + 200);
      const pr = await sb.from("product").select("id,sku").in("sku", part);
      if(pr.error) throw new Error(pr.error.message);
      const idSku = {}; (pr.data || []).forEach(p => { idSku[p.id] = p.sku; });
      const ids = Object.keys(idSku); if(!ids.length) continue;
      const bc = await sb.from("product_barcode").select("product_id,barcode,is_primary").in("product_id", ids).eq("is_active", true);
      if(bc.error) throw new Error(bc.error.message);
      (bc.data || []).sort((a, b) => (b.is_primary === true) - (a.is_primary === true)).forEach(b => { const k = idSku[b.product_id]; if(k && !out[k]) out[k] = b.barcode; });
    }
  } catch(e){ console.warn("[barcodes] " + e.message); }
  return out;
}
/* cr csv v2 — 크레딧 하나 = 한 표(인보이스 CSV 와 같은 꼴): 한 줄 = 크레딧 줄 하나 · 앞 칸에 크레딧 정보 되풀이 · Barcode · 끝에 합계 · so_credit_detail 이 준 것(cur)만 */
async function exportOneCredit(){
  if(!cur || !cur.credit_row) return;
  const v = cur.credit_row, c = cur.credit || {}, lines = (cur.lines || []).slice().sort((a, b) => Number(a.line_no) - Number(b.line_no));
  const bc = await barcodesForSkus(lines.map(l => l.sku));
  const forInv = v.invoice_number || (c.ref_invoice_number ? c.ref_invoice_number + " (ref)" : "");
  const head = ["Credit","Status","Issued","Customer","For invoice","Reason","Line","Kind","SKU","Barcode","Description","Qty","Unit price","Was","Now","Back to","Amount","Tax","Amount incl. tax","Account"];
  const rows = [head];
  lines.forEach(l => {
    const adj = l.kind === "price_adjustment", amt = Number(l.amount || 0), tax = Number(l.tax_amount || 0);
    rows.push([v.credit_number || "", csvPlain(crChip(v)), v.issued_on || "", v.customer_name || "", forInv, REASON[v.reason] || v.reason || "",
      csvNum(l.line_no), CR_KIND[l.kind] || l.kind || "", csvText(l.sku), csvText(bc[l.sku]), l.description || l.product_name || "",
      csvNum(adj ? l.qty_adjusted : l.qty_returned), csvNum(l.unit_price), adj ? csvNum(l.unit_price_before) : "", adj ? csvNum(l.unit_price_after) : "",
      adj ? "price only — no stock" : (l.kind === "product" ? (l.restock_bin || l.not_restocked_reason || "") : ""),
      csvNum(l.amount), csvNum(l.tax_amount), Math.round((amt + tax) * 100) / 100, l.account_code || ""]);
  });
  const at = head.indexOf("Amount incl. tax");
  const foot = (lbl, val) => { if(val === null || val === undefined) return; const r = Array(at - 1).fill(""); r.push(lbl, csvNum(val)); rows.push(r); };
  rows.push([]);
  foot("Lines", v.lines_amount); if(Number(c.order_discount_amount)) foot("Order discount", -Math.abs(Number(c.order_discount_amount)));
  if(Number(c.freight_discount_amount)) foot("Freight discount", -Math.abs(Number(c.freight_discount_amount)));
  foot("Fee", v.fee_amount); if(Number(v.surcharge_amount)) foot("Surcharge", v.surcharge_amount);
  foot("Tax", v.tax_amount); foot("Total", v.total); foot("Applied to invoices", v.applied_to_invoices); foot("Refunded", v.refunded);
  if(v.status === "issued") foot("Remaining", v.remaining);
  csvDownload(`${v.credit_number || "credit"}-${csvDay()}.csv`, rows);
}

  WHS = wh.data || [];
  (ac.data || []).forEach(a => { ACCT_NAME[a.code] = a.name; });
  ACCT_ALL = (ac.data || []).filter(a => a.is_active);

  const refilter = () => { pg.reset(); pgW.reset(); loadWide(); };
  document.getElementById("wst").onchange  = e => { stFilter = e.target.value; document.getElementById("st").value = stFilter; refilter(); };
  document.getElementById("wfrom").onchange = e => { dateFrom = e.target.value; refilter(); };
  document.getElementById("wto").onchange   = e => { dateTo = e.target.value; refilter(); };
  imsQ("#wq", v => { q = v; document.getElementById("q").value = v; refilter(); });
  document.getElementById("wclear").onclick = () => {
    q = ""; dateFrom = ""; dateTo = ""; stFilter = "open";
    ["wq","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wst").value = "open"; document.getElementById("q").value = ""; document.getElementById("st").value = "open";
    refilter();
  };
  document.getElementById("st").onchange = e => { stFilter = e.target.value; document.getElementById("wst").value = stFilter; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; document.getElementById("wq").value = v; pg.reset(); clearDetail(); loadList(); });

  /* ?inv=<invoice uuid> — Sales Invoices 의 「Raise a credit note」에서 · ?cr=CR-01000 — 번호로 열기 */
  const inv = imsParam("inv"), cr = imsParam("cr");
  if(cr){ await gotoCr(cr); return; }
  showWide();
  if(inv && isMgr()) openNew(inv);
});
</script>
</body>
</html>
