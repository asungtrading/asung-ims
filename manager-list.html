<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action Centre · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 매니저 목록 — 운영 WMS admin 의 모양(탭 · 배지 · 미해결 전량 · 해결은 기간) · ④a 판정 7·8 */
  .mlwrap{padding:14px;display:flex;flex-direction:column;gap:14px}
  .mltabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
  .mltabs button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px}
  .mltabs button.on{background:#eef2ff;border-color:#c7d2fe;font-weight:600}
  .mltabs .badge{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:#e03131;color:#fff;font-size:11px;font-weight:700;text-align:center}
  .mltabs .badge.zero{background:#dee2e6;color:#868e96}
  .mltabs .sp{flex:1}
  .mltabs select,.mltabs input{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  h4.sec{margin:14px 14px 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* ml v1.6 — Count & check window (nb-4b) */
  .pobox input,.pobox textarea{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px}
  .pobox .pbody > *{flex-shrink:0}
  .cc-qty{width:90px;text-align:right}
  .cc-bin{width:130px}
  .cc-must{color:#c92a2a;font-size:11.5px}
  .cc-box{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;font-size:12.5px}
  .cc-box.bad{border-color:#ffc9c9;background:#fff5f5;color:#c92a2a}
  .cc-box.warn{border-color:#ffe066;background:#fff9db}
  .cc-box.good{border-color:#b2f2bb;background:#ebfbee}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="mlwrap">
  <div class="card">
    <div class="mltabs" id="tabs">
      <button data-t="short" class="on">Sold without stock<span class="badge zero" id="bShort">0</span></button>
      <button data-t="unpaid">Unpaid at hand-over<span class="badge zero" id="bUnpaid">0</span></button>
      <button data-t="pos">POS not finished<span class="badge zero" id="bPos">0</span></button>
      <button data-t="counter">Counter orders</button>
      <button data-t="newcust">New customers to review<span class="badge zero" id="bNewCust">0</span></button>
      <button data-t="pickup">Pickups not scheduled<span class="badge zero" id="bPickup">0</span></button>
      <span class="sp"></span>
      <select id="wh" title="Branch"><option value="">All branches</option></select>
    </div>
    <div id="body"><div class="msg">Loading…</div></div>
  </div>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Manager List — 매니저 목록 1판 (2026-09-25 · 대화 Claude)
   판정 8(④a): 관리 화면은 「바로잡는 곳이 어디냐」로 나눈다 — 장부 · 돈은 IMS 쪽(이 화면) · 창고 작업은 WMS 쪽(⑤)
   탭 넷
     Sold without stock     원장 판매 부족분(sale_shortfall)을 읽는다 · 확인은 so_stock_short_confirm(manager + sales|receiving) · 열쇠 doc·sku·warehouse(판정 7)
     Unpaid at hand-over    즉시 결제 조건(결제조건 기한 일수 0 — C.B.S · C.O.D · Due on receipt)인데 인보이스에 남은 돈이 있다(Caleb 2026-09-25 「올리자」)
                            ⚠️ 손님 결제조건 자료가 엉켜 있다(Net30 6,305) — 진짜 즉시 결제 손님이 정리될 때까지 이 목록은 그 자료만큼만 정확하다
     POS not finished       Confirm 뒤 그날 안에 Finish 안 된 POS(판정 15) · so_pos_open_list 의 stale
     Counter orders         WMS 를 거치지 않고 나간 두 번째 길(6-b ③) — 최근 30일 · 누가 내보냈나
   ⚠️ 남은 금액 · 부족분 · stale 판정은 DB 가 준다 — 화면이 다시 계산하지 마라
   ───────────────────────────────────────────────────────────── */
const ML_BUILD = "2026-11-11 · ml v1.6";   // 대화 Claude — ml v1.6(nb-4b · asung-wms nb-3 6526ce4 · 판정 1176 · Caleb 「mark checked 할때 바로 정리되는게 가장 깔끔」): Sold without stock 의 확인 안 된 줄에 「Count & check…」(매니저 이상) — 창 = so_stock_short_count_view(칸별 장부 · picked · 선반에 있어야 할 수 · 확인 안 된 오더 · seen) · 칸마다 센 개수(음수 칸은 필수 · 다른 칸 더하기 · UNASSIGNED 「no shelf yet」 · 옛 칸 없음 행은 보이기만) → Preview(so_stock_short_count p_commit false) → Count & check(p_commit true · 미리 본 입력 그대로일 때만) · stock_adjust + 그 창고가 없으면(can_count false) 입력 없이 안내 + Mark checked 길 · 확인된 줄에 ADJ 번호 · 같은 줄 동시 확인(23505)은 사람 말 ← 2026-11-06 · ml v1.5;   // 대화 Claude — ml v1.5(fc-pickup-4 · ac-count-1): 여섯째 탭 Pickups not scheduled(fc_pickup_attention_list · Check pickup = EF freightcom pickup_poll) · 배지 다섯을 ims_action_counts 한 번으로(함수가 없으면 옛 길) · All branches 면 바깥 메뉴 배지도 같은 숫자로(window.imsActionBadgeSet) ← 2026-11-03 · ml v1.4: 대화 Claude — ml v1.4(판정 994 · so-inv-branch-1): Unpaid at hand-over 목록 · 배지가 Branch 를 따른다(so_invoice_list.warehouse_id) · All branches 일 때 Branch 칸(이월 인보이스는 「customer's branch」) ← ml v1.3: manual-6 이견 4 · 5: ① New customers to review 배지가 Branch 를 무시했다(목록은 따른다 · 숫자가 어긋남) → 배지도 default_location_name 으로 거른다 ② Sold without stock 의 POS 줄 링크가 pos.html 로 가 빈 화면(끝난 판매는 POS 가 비운다 · pos.html:581) → 모든 줄을 so.html?so= 로 · 채널 꼬리표는 그대로 ← 2026-10-05 · ml v1.2: 대화 Claude — cs-5 ②(판정 240): 탭 「New customers to review」(뷰 customer_review_list · 줄 → customers.html?id= · 그 화면의 Reviewed 는 master 만) ← ml v1.1 대화 Claude — 탭 제목 Action Centre(캐나다 철자 · Caleb 2026-10-01) ← ml v1
console.log("manager-list.html build:", ML_BUILD);

let sb = null, me = null, rank = 0, tab = "short", whId = "", whName = "", WHS = [], IMMEDIATE = [];
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;
const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const qty = (v) => esc(Number(v || 0).toLocaleString("en-CA", { maximumFractionDigits: 4 }));
const badge = (id, n) => { const b = document.getElementById(id); b.textContent = n; b.className = "badge" + (Number(n) ? "" : " zero"); };
function daysAgo(d){
  if(!d) return "";
  const t = new Date(d + "T00:00:00"), now = new Date();
  return Math.max(0, Math.round((now - t) / 86400000));
}

/* ── 배지 넷을 한 번에(탭을 바꾸지 않아도 쌓인 것이 보이게) ── */
/* ml v1.5 — 숫자 다섯은 ims_action_counts 한 번(ac-count-1 · 탭 원천과 같은 셈) · 못 보는 항목은 null → 0 · 함수가 없거나 실패하면 옛 길(loadBadgesOld) */
async function loadBadges(){
  const { data, error } = await sb.rpc("ims_action_counts", { p_warehouse_id: whId || null });
  if(error || !data){ return loadBadgesOld(); }
  badge("bShort", data.short || 0); badge("bUnpaid", data.unpaid || 0); badge("bPos", data.pos || 0);
  badge("bNewCust", data.new_customers || 0); badge("bPickup", data.pickups || 0);
  if(!whId && typeof window.imsActionBadgeSet === "function") window.imsActionBadgeSet(data.total || 0);   // 바깥 메뉴도 같은 숫자(All branches)
}
async function loadBadgesOld(){
  const pk = await sb.rpc("fc_pickup_attention_list", { p_warehouse_id: whId || null });
  if(!pk.error && pk.data) badge("bPickup", pk.data.count || 0);
  const [sh, un, po, nc] = await Promise.all([
    sb.rpc("so_stock_short_list", { p_filters: Object.assign({ unchecked_only: true }, whId ? { warehouse_id: whId } : {}) }),
    unpaidQuery(true),
    sb.rpc("so_pos_open_list", { p_location_id: whId || null }),
    (whName ? sb.from("customer_review_list").select("customer_id", { count: "exact", head: true }).eq("default_location_name", whName)
            : sb.from("customer_review_list").select("customer_id", { count: "exact", head: true })),   // ml v1.3 — 배지도 Branch 를 따른다(목록 :206 과 같은 칸)
  ]);
  if(!nc.error) badge("bNewCust", nc.count || 0);
  if(!sh.error) badge("bShort", sh.data.unchecked_count || 0);
  if(!un.error) badge("bUnpaid", un.count || 0);
  if(!po.error) badge("bPos", po.data.stale_count || 0);
}

/* ── 즉시 결제 미수 — 인보이스 뷰(남은 금액은 so_invoice_remaining 한 곳) ──
   ml v1.4 — 판정 994: 브랜치 = 뷰 warehouse_id(오더 있으면 첫 SO 창고 · 없으면 매장 → 청구처 기본 브랜치 · so-inv-branch-1) · 목록 · 배지가 같은 거르기 */
function unpaidQuery(countOnly){
  let qy = sb.from("so_invoice_list").select(countOnly ? "id" : "id,invoice_number,issued_on,due_on,payment_term_name,bill_to_name,so_numbers,channel,total,paid,credited,remaining,currency_code,warehouse_name,warehouse_source",
    { count: "exact", head: !!countOnly }).eq("is_open", true);
  if(whId) qy = qy.eq("warehouse_id", whId);   // ml v1.4
  qy = IMMEDIATE.length ? qy.in("payment_term_name", IMMEDIATE) : qy.eq("payment_term_name", "__none__");
  return countOnly ? qy : qy.order("issued_on", { ascending: true }).limit(300);
}

async function show(){
  document.querySelectorAll("#tabs [data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const box = document.getElementById("body");
  box.innerHTML = '<div class="msg">Loading…</div>';
  if(tab === "short")   return showShort(box);
  if(tab === "unpaid")  return showUnpaid(box);
  if(tab === "pos")     return showPos(box);
  if(tab === "counter") return showCounter(box);
  if(tab === "newcust") return showNewCust(box);
  if(tab === "pickup")  return showPickup(box);
}

/* ① 재고 없이 나갔다 — 미확인은 기간과 상관없이 전량 · 확인된 것은 최근 30일 */
async function showShort(box){
  const { data, error } = await sb.rpc("so_stock_short_list", { p_filters: whId ? { warehouse_id: whId } : {} });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const row = (r, done) => `<tr>
      <td>${dim(r.received_on)}</td>
      <td><a class="lnk mono" href="so.html?so=${encodeURIComponent(r.doc_number)}">${esc(r.doc_number)}</a>${r.channel ? ` <span class="tag">${esc(r.channel)}</span>` : ""}</td>
      <td>${esc(r.customer_name || "")}</td>
      <td class="mono">${esc(r.sku)}</td><td>${esc(r.warehouse || "")}</td>
      <td class="num">${qty(r.qty)}</td>
      <td>${r.unknown ? '<span class="off" style="font-size:11.5px">cost unknown</span>' : `<span class="dim" style="font-size:11.5px">${esc(r.cost_source || "")}</span>`}</td>
      <td>${done ? `<span class="on" style="font-size:11.5px">checked</span> <span class="dim" style="font-size:11.5px">${esc(r.checked_by_name || "")} · ${imsTs(r.checked_at)}</span>${r.adjust_number ? ` <span class="tag mono">${esc(r.adjust_number)}</span>` : ""}${r.note ? `<div class="dim" style="font-size:11.5px">${esc(r.note)}</div>` : ""}`
             : (isMgr() ? `<button class="xbtn" data-cc="${esc(r.doc_number)}" data-sku="${esc(r.sku)}" data-wh="${esc(r.warehouse)}" title="Count the shelf — fix the stock and check it in one go">Count &amp; check…</button>
                 <button class="xbtn" data-chk="${esc(r.doc_number)}" data-sku="${esc(r.sku)}" data-wh="${esc(r.warehouse)}" title="The books are right — check it without changing stock">Mark checked…</button>` : "")}</td>
    </tr>`;
  const head = `<thead><tr><th>Sold on</th><th>Order</th><th>Customer</th><th>SKU</th><th>Branch</th><th class="num">Qty short</th><th>Cost</th><th></th></tr></thead>`;
  box.innerHTML = `
    <h4 class="sec">Not checked yet — ${esc(data.unchecked_count)}${Number(data.unchecked_unknown_cost) ? ` · ${esc(data.unchecked_unknown_cost)} with unknown cost` : ""}</h4>
    ${(data.unchecked || []).length ? `<table>${head}<tbody>${data.unchecked.map(r => row(r, false)).join("")}</tbody></table>` : '<div class="msg">Nothing to check.</div>'}
    <h4 class="sec">Checked — ${esc(data.from)} to ${esc(data.to)} · ${esc(data.checked_in_range)}</h4>
    ${(data.checked || []).length ? `<table>${head}<tbody>${data.checked.map(r => row(r, true)).join("")}</tbody></table>` : '<div class="msg">None in this period.</div>'}
    <div class="sosub">These sold more than the book showed in that branch — the goods were there, the count was not.
      <b>Count &amp; check</b>: count the shelf, type what you found, and IMS fixes the stock and checks every open line of that SKU in one go (needs the Stock adjustments key for that branch).
      <b>Mark checked</b>: the books are already right — it only records that you looked and does not change stock.</div>`;
  box.querySelectorAll("[data-cc]").forEach(b => { b.onclick = () => openCount(b.dataset.sku, b.dataset.wh); });   // ml v1.6
  box.querySelectorAll("[data-chk]").forEach(b => {
    b.onclick = async () => {
      const note = prompt(`${b.dataset.chk} · ${b.dataset.sku} at ${b.dataset.wh}\n\nWhat did you find? (counted, fixed, reason)`);
      if(note === null) return;
      const { error } = await sb.rpc("so_stock_short_confirm", { p_doc_number: b.dataset.chk, p_sku: b.dataset.sku, p_warehouse: b.dataset.wh, p_note: note.trim() || null });
      if(error){ alert(error.message); return; }
      loadBadges(); show();
    };
  });
}

/* ── ml v1.6 · nb-4b — Count & check(so_stock_short_count_view · so_stock_short_count · 판정 1176) ──
   ⭐ 숫자는 DB 가 준다 — 화면은 센 개수를 모아 보낼 뿐 · 미리 보기(p_commit false)가 지금 입력으로 돈 뒤에만 실행 단추가 켜진다
   ⭐ seen = 읽기가 준 지문 — 미리 보기 · 실행에 그대로(그 사이 장부나 줄이 바뀌면 DB 가 거부 → 다시 읽기) */
function modalOpen(html){ document.getElementById("modalBox").innerHTML = html; document.getElementById("modal").hidden = false; }
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("modal").hidden) modalClose(); });
const binLabel = (name) => name === "UNASSIGNED" ? `${esc(name)} <span class="dim">(no shelf yet)</span>` : esc(name);
const signedQ = (v) => { const n = Number(v || 0); return n > 0 ? `<span class="on">+${qty(n)}</span>` : n < 0 ? `<span class="off">−${qty(-n)}</span>` : '<span class="dim">0</span>'; };
const CC_COST = { manual: "unit cost given", layer_avg: "average cost here", layer_recent: "last cost here", layer_recent_other_wh: "last cost in the other warehouse",
                  price_history: "last purchase price", filled: "fills stock sold without stock — no new cost", fifo: "oldest cost first", unknown: "cost unknown", none: "—" };
function ccCost(l){
  const d = Number(l.delta || 0);
  if(d <= 0) return d < 0 ? CC_COST.fifo : '<span class="dim">—</span>';
  const fill = Number(l.fill_qty || 0), lay = Number(l.layer_qty || 0), out = [];
  if(fill > 0) out.push(`<div>${qty(fill)} ${CC_COST.filled}</div>`);
  if(lay > 0){
    const unit = (l.layer_unit_cost !== null && l.layer_unit_cost !== undefined) ? Number(l.layer_unit_cost) : null;
    if(l.cost_branch === "unknown") out.push(`<div class="off">${qty(lay)} ${CC_COST.unknown} — goes in at 0</div>`);
    else out.push(`<div>${qty(lay)} go in ${unit !== null ? `at <b>$${esc(unit.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 4 }))}</b> — ` : "at "}${esc(CC_COST[l.cost_branch] || l.cost_branch || "")}</div>`);
  }
  return out.join("") || '<span class="dim">—</span>';
}
let cc = null;   // { sku, wh, view, seen, pvKey }
async function openCount(sku, wh){
  modalOpen(`<h4>Count &amp; check · <span class="mono">${esc(sku)}</span> · ${esc(wh)}</h4>
    <div class="pbody"><div id="ccOut"><div class="msg">Loading…</div></div><div id="ccRes"></div><div id="ccMsg" style="margin-top:8px;font-size:12.5px"></div></div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" id="ccClose">Cancel</button>
      <button class="pobtn" id="ccPv" disabled>Preview</button><button class="pobtn go" id="ccGo" disabled>Count &amp; check</button></div>`);
  document.getElementById("ccClose").onclick = modalClose;
  const { data, error } = await sb.rpc("so_stock_short_count_view", { p_sku: sku, p_warehouse: wh });
  if(error){ document.getElementById("ccOut").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  cc = { sku, wh, view: data, seen: data.seen, pvKey: null };
  const v = data, bins = v.bins || [], shorts = v.shorts || [];
  const shortsHtml = shorts.length
    ? shorts.map(x => `<a class="lnk mono" href="so.html?so=${encodeURIComponent(x.doc_number)}">${esc(x.doc_number)}</a> ${qty(x.qty)} EA <span class="dim">${esc(x.received_on || "")}${x.channel ? " · " + esc(x.channel) : ""}</span>`).join("<br>")
    : '<span class="dim">none open</span>';
  const rowHtml = (b) => `<tr data-bin="${esc(b.bin)}">
      <td class="mono">${b.kind === "no_bin" ? '<span class="dim">(no bin)</span>' : binLabel(b.bin)}</td>
      <td class="num">${qty(b.ledger)}</td><td class="num">${qty(b.picked)}</td><td class="num"><b>${qty(b.shelf)}</b></td>
      <td>${b.countable ? `<input class="cc-qty" type="number" step="any" min="0" data-cq placeholder="count">${b.must_count ? ' <span class="cc-must">must count — below zero</span>' : ""}`
                        : `<span class="dim" style="font-size:11.5px">${esc(b.why_not || "")}</span>`}</td></tr>`;
  document.getElementById("ccOut").innerHTML = `
    <div style="font-size:13px"><b>${esc(v.name || "")}</b></div>
    <div class="cc-box"><b>Open lines sold without stock</b> — ${qty(v.short_qty)} EA<br>${shortsHtml}</div>
    ${v.can_count ? "" : `<div class="cc-box warn">You can see this but not change stock here — that needs the Stock adjustments key for ${esc(wh)}.
        If the books are right, close this and use <b>Mark checked</b>. Otherwise ask someone with the key to count it.</div>`}
    <table style="margin-top:10px"><thead><tr><th>Bin</th><th class="num">Book</th><th class="num">Picked, not shipped</th><th class="num">Shelf should be</th><th>${v.can_count ? "You counted" : ""}</th></tr></thead>
      <tbody id="ccRows">${bins.map(rowHtml).join("") || '<tr><td colspan="5" class="dim">The book has no bin for this SKU here.</td></tr>'}</tbody></table>
    ${v.can_count ? `<div style="margin-top:8px;font-size:12.5px">Found it on another shelf? <input class="cc-bin" id="ccNewBin" placeholder="bin"> <button class="xbtn" id="ccAddBin">+ add bin</button></div>
      <div style="margin-top:10px;font-size:12.5px">Note <input id="ccNote" style="width:70%" placeholder="optional — what you found"></div>
      <div class="dim" style="font-size:12px;margin-top:8px">Type what is on each shelf you counted. Leave a bin empty if you did not count it — it stays as it is (a bin below zero has to be counted).
        IMS makes and confirms one stock adjustment for the difference and checks every open line above. Units that fill stock sold without stock take no new cost.</div>` : ""}`;
  if(!v.can_count) return;
  document.getElementById("ccAddBin").onclick = () => {
    const nb = document.getElementById("ccNewBin").value.trim();
    if(!nb) return;
    if(document.querySelector(`#ccRows tr[data-bin="${CSS.escape(nb)}"]`)){ document.getElementById("ccNewBin").value = ""; return; }
    document.getElementById("ccRows").insertAdjacentHTML("beforeend", `<tr data-bin="${esc(nb)}" data-added="1"><td class="mono">${binLabel(nb)} <span class="dim" style="font-size:11px">added</span></td>
      <td class="num dim">—</td><td class="num dim">—</td><td class="num dim">—</td><td><input class="cc-qty" type="number" step="any" min="0" data-cq placeholder="count"></td></tr>`);
    document.getElementById("ccNewBin").value = "";
    wireCount();
  };
  wireCount();
}
function readCounts(){
  const out = [];
  document.querySelectorAll("#ccRows tr[data-bin]").forEach(tr => {
    const i = tr.querySelector("[data-cq]");
    if(i && i.value.trim() !== "") out.push({ bin: tr.dataset.bin, qty: Number(i.value) });
  });
  return out;
}
const countKey = () => JSON.stringify(readCounts()) + "|" + ((document.getElementById("ccNote") || {}).value || "");
function wireCount(){
  const pv = document.getElementById("ccPv"), go = document.getElementById("ccGo");
  const sync = () => { pv.disabled = !readCounts().length; go.disabled = !(cc.pvKey && cc.pvKey === countKey()); };
  document.querySelectorAll("#ccRows [data-cq], #ccNote").forEach(i => { i.oninput = sync; });
  pv.onclick = () => runCount(false);
  go.onclick = () => runCount(true);
  sync();
}
function ccErr(e){
  if(e && e.code === "23505") return "Someone else just checked this line. Close this window and reload the list.";
  return (e && e.message) || String(e);
}
async function runCount(commit){
  const pv = document.getElementById("ccPv"), go = document.getElementById("ccGo"), msg = document.getElementById("ccMsg"), res = document.getElementById("ccRes");
  const counts = readCounts();
  if(!counts.length){ msg.className = "err"; msg.textContent = "Type the count for at least one bin."; return; }
  const key = countKey();
  if(commit && key !== cc.pvKey){ msg.className = "err"; msg.textContent = "Preview again — the counts changed."; go.disabled = true; return; }
  pv.disabled = true; go.disabled = true; msg.className = ""; msg.textContent = commit ? "Fixing the stock and checking…" : "Working out the change…";
  const note = ((document.getElementById("ccNote") || {}).value || "").trim();
  const { data, error } = await sb.rpc("so_stock_short_count", { p_sku: cc.sku, p_warehouse: cc.wh, p_counts: counts, p_seen: cc.seen, p_note: note || null, p_commit: commit });
  if(error){ msg.className = "err"; msg.textContent = ccErr(error); pv.disabled = false; return; }
  const ls = data.lines || [];
  const table = `<table style="margin-top:10px"><thead><tr><th>Bin</th><th class="num">Counted</th><th class="num">Shelf should be</th><th class="num">Change</th><th class="num">Book after</th><th>Cost</th></tr></thead>
    <tbody>${ls.map(l => `<tr><td class="mono">${binLabel(l.bin)}</td><td class="num">${qty(l.qty_input)}</td><td class="num">${qty(l.basis)}</td>
      <td class="num">${signedQ(l.delta)}</td><td class="num">${qty(l.result)}</td><td style="font-size:12px">${ccCost(l)}</td></tr>`).join("")}</tbody></table>`;
  const rej = (data.rejects || []).length ? `<div class="cc-box bad"><b>Cannot do this yet</b><br>${data.rejects.map(esc).join("<br>")}</div>` : "";
  const warn = (data.warnings || []).length ? `<div class="cc-box warn">${data.warnings.map(w => "⚠ " + esc(w)).join("<br>")}</div>` : "";
  const nob = Number(data.no_bin_qty || 0) ? `<div class="cc-box warn">This SKU also has an old row without a bin (${qty(data.no_bin_qty)}). It is fixed separately — not by this count.</div>` : "";
  if(!commit){
    const what = data.action === "adjust_and_check"
      ? `<div class="cc-box">Pressing <b>Count &amp; check</b> makes and confirms one stock adjustment with these lines, then checks ${qty((data.shorts || []).length)} open line(s). It cannot be undone — a mistake is fixed with a new adjustment.</div>`
      : `<div class="cc-box good">Your count matches the book — nothing changes. <b>Count &amp; check</b> only checks ${qty((data.shorts || []).length)} open line(s).</div>`;
    res.innerHTML = table + rej + warn + nob + (data.can_commit ? what : "");
    if(data.seen) cc.seen = data.seen;
    cc.pvKey = data.can_commit ? key : null;
    msg.textContent = data.can_commit ? "" : "Fix the counts above and preview again.";
    pv.disabled = false; go.disabled = !cc.pvKey;
    return;
  }
  res.innerHTML = `<div class="cc-box good">${data.adjust_number ? `<b>${esc(data.adjust_number)}</b> confirmed — stock fixed. ` : "No stock change. "}Checked: ${(data.checked || []).map(n => `<span class="mono">${esc(n)}</span>`).join(", ") || "—"}.</div>` + table + nob;
  msg.textContent = "Done.";
  document.querySelectorAll("#ccRows [data-cq], #ccNote, #ccNewBin, #ccAddBin").forEach(i => { i.disabled = true; });
  const cl = document.getElementById("ccClose"); cl.textContent = "Close"; cl.onclick = () => { modalClose(); loadBadges(); show(); };
}

/* ② 즉시 결제인데 미수 */

  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const rows = (data || []).map(r => `<tr>
      <td><a class="lnk mono" href="so-invoices.html?inv=${encodeURIComponent(r.invoice_number)}">${esc(r.invoice_number)}</a></td>
      <td>${dim(r.issued_on)} <span class="dim" style="font-size:11.5px">${esc(daysAgo(r.issued_on))}d</span></td>
      <td>${esc(r.bill_to_name || "")}</td>
      <td>${esc(r.payment_term_name || "")}</td>
      <td class="mono" style="font-size:12px">${esc(r.so_numbers || "")}${r.channel && r.channel !== "warehouse" ? ` <span class="tag">${esc(r.channel)}</span>` : ""}</td>
      <td class="num">${money(r.total)} <span class="dim">${esc(r.currency_code || "")}</span></td>
      <td class="num">${money(Number(r.paid || 0) + Number(r.credited || 0))}</td>
      <td class="num"><span class="neutral">${money(r.remaining)}</span></td>
      ${whId ? "" : `<td>${esc(r.warehouse_name || "")}${r.warehouse_source === "store" || r.warehouse_source === "bill_to" ? ' <span class="dim" style="font-size:11.5px" title="No order in IMS (carried over) — the customer\'s home branch">customer\'s branch</span>' : ""}</td>`}
    </tr>`);
  box.innerHTML = rows.length ? `<table><thead><tr><th>Invoice</th><th>Issued</th><th>Customer</th><th>Term</th><th>Orders</th><th class="num">Total</th><th class="num">Paid · credited</th><th class="num">Still owed</th>${whId ? "" : "<th>Branch</th>"}</tr></thead>
      <tbody>${rows.join("")}</tbody></table>
      <div class="sosub">The customer's term says pay before or on delivery (${esc(IMMEDIATE.join(" · ") || "no such term found")}), but the goods went out with money still owed. Open the invoice to take the payment. It drops off this list once it is paid.
        ⚠️ Customer payment terms are still being cleaned up — a customer with the wrong term shows here (or is missing) until then.</div>`
    : `<div class="msg">No unpaid invoices on a pay-now term.</div>`;
}

/* ③ POS 끝나지 않은 것 — 그날 안에 Finish 되지 않은 것(stale)을 위로 */
async function showPos(box){
  const { data, error } = await sb.rpc("so_pos_open_list", { p_location_id: whId || null });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const os = (data.orders || []).slice().sort((a, b) => (b.stale === true) - (a.stale === true));
  box.innerHTML = os.length ? `<table><thead><tr><th>Sale</th><th>Customer</th><th>Branch</th><th>Confirmed</th><th class="num">Amount</th><th class="num">Paid</th><th></th></tr></thead>
      <tbody>${os.map(o => `<tr>
        <td><a class="lnk mono" href="pos.html?so=${encodeURIComponent(o.so_number)}">${esc(o.so_number)}</a></td>
        <td>${esc(o.customer_name || "")}</td><td>${esc(o.location_name || "")}</td>
        <td>${imsTs(o.confirmed_at)} <span class="dim" style="font-size:11.5px">${esc(o.confirmed_by_name || "")}</span></td>
        <td class="num">${money(o.amount)}</td><td class="num">${Number(o.received) ? money(o.received) : '<span class="dim">—</span>'}</td>
        <td>${o.stale ? '<span class="off" style="font-size:11.5px">not finished — from an earlier day</span>' : '<span class="dim" style="font-size:11.5px">today · parked or at the counter</span>'}</td></tr>`).join("")}</tbody></table>
      <div class="sosub">A confirmed POS sale holds its stock until it is finished. Open it on POS to finish it, reopen it, or cancel it on Sales Orders.</div>`
    : '<div class="msg">No open POS sales.</div>';
}

/* ④ counter 오더 — WMS 없이 나간 길 · 최근 30일 */
async function showCounter(box){
  let qy = sb.from("so").select("id,so_number,status,order_date,shipped_at,bill_to_name,location_name,customer:customer_id(name),shipper:shipped_by(name)")
    .eq("channel", "counter").gte("order_date", new Date(Date.now() - 30 * 86400000).toISOString().slice(0, 10)).order("so_number", { ascending: false }).limit(300);
  if(whId) qy = qy.eq("location_id", whId);
  const { data, error } = await qy;
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  box.innerHTML = (data || []).length ? `<table><thead><tr><th>Order</th><th>Status</th><th>Ordered</th><th>Customer</th><th>Branch</th><th>Handed over</th></tr></thead>
      <tbody>${data.map(o => `<tr>
        <td><a class="lnk mono" href="so.html?so=${encodeURIComponent(o.so_number)}">${esc(o.so_number)}</a></td>
        <td>${esc(o.status)}</td><td>${dim(o.order_date)}</td>
        <td>${esc((o.customer && o.customer.name) || o.bill_to_name || "")}</td><td>${esc(o.location_name || "")}</td>
        <td>${o.shipped_at ? imsTs(o.shipped_at) + ` <span class="dim" style="font-size:11.5px">${esc((o.shipper && o.shipper.name) || "")}</span>` : '<span class="dim">—</span>'}</td></tr>`).join("")}</tbody></table>
      <div class="sosub">Counter orders take stock out without going through the warehouse screens — this list is how a manager sees them. Last 30 days.</div>`
    : '<div class="msg">No counter orders in the last 30 days.</div>';
}

/* ⑤ 새 손님 확인(판정 240 · cs-5 ②) — sales 가 IMS 에서 만든 손님 · 돈 조건이 기본값(Wholesale · 0% · C.B.S · CAD)인 채
   ⭐ 확인(Reviewed) · 돈 칸 고치기는 손님 화면에서 master 가 — 이 탭은 목록 + 그 손님으로 가는 길 · 창고 거르기는 손님의 기본 창고 이름으로 */
async function showNewCust(box){
  let qy = sb.from("customer_review_list").select("customer_id,name,display_name,created_at,created_by_name,price_tier,discount_pct,payment_term_name,currency_code,default_location_name,so_count,open_so_count,first_order_at,city")
    .order("created_at", { ascending: true }).limit(300);
  if(whName) qy = qy.eq("default_location_name", whName);
  const { data, error } = await qy;
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  box.innerHTML = (data || []).length ? `<table><thead><tr><th>Customer</th><th>City</th><th>Created</th><th>Terms now</th><th class="num">Orders</th><th>First order</th><th></th></tr></thead>
      <tbody>${data.map(c => `<tr>
        <td><a class="lnk" href="customers.html?id=${encodeURIComponent(c.customer_id)}">${esc(c.name)}</a>${c.display_name ? ` <span class="dim" style="font-size:11.5px">${esc(c.display_name)}</span>` : ""}</td>
        <td>${dim(c.city)}</td>
        <td>${imsTs(c.created_at)} <span class="dim" style="font-size:11.5px">${esc(c.created_by_name || "")}</span></td>
        <td>${esc(c.price_tier || "—")} · ${esc(c.discount_pct === null || c.discount_pct === undefined ? "0" : String(c.discount_pct))}% · ${esc(c.payment_term_name || "—")} · ${esc(c.currency_code || "—")}</td>
        <td class="num">${esc(String(c.so_count || 0))}${Number(c.open_so_count) ? ` <span class="dim" style="font-size:11.5px">(${esc(String(c.open_so_count))} open)</span>` : ""}</td>
        <td>${c.first_order_at ? imsTs(c.first_order_at) : '<span class="dim">no order yet</span>'}</td>
        <td><a class="lnk" href="customers.html?id=${encodeURIComponent(c.customer_id)}">Open</a></td></tr>`).join("")}</tbody></table>
      <div class="sosub">Customers made by sales start on the default terms (Wholesale · 0% · C.B.S · CAD). A manager opens each one, changes the terms if needed, and presses Reviewed — changing a money term counts as reviewed too.</div>`
    : '<div class="msg">No new customers waiting for review.</div>';
}

/* ⑥ 픽업이 안 잡힌 예약(ml v1.5 · fc-pickup-4) — fc_pickup_attention_list(판정은 DB fc_pickup_check · 창 = 자동 다시 읽기와 같은 기간)
   ⭐ 출고 뒤에는 예약됨 칸이 사라져 거절을 볼 곳이 여기뿐 · Check pickup = EF freightcom {action:"pickup_poll", booking_id}(GET 만 · 청구 없음) */
async function showPickup(box){
  const { data, error } = await sb.rpc("fc_pickup_attention_list", { p_warehouse_id: whId || null });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const rows = (data && data.rows) || [];
  const pkDay = (d) => d ? esc(new Date(d + "T12:00:00").toLocaleDateString("en-CA", { weekday: "short", month: "short", day: "numeric" })) : '<span class="dim">—</span>';
  const ago = (m) => { m = Number(m || 0); return m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  box.innerHTML = rows.length ? `<table><thead><tr><th>Pickup</th><th>Orders</th><th>Customer</th><th>Carrier</th><th>What Freightcom says</th><th>Booked</th><th>Last checked</th><th>Tracking</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${pkDay(r.pickup_date)}${r.ready_at ? `<div class="dim" style="font-size:11.5px">${esc(r.ready_at)} – ${esc(r.ready_until || "")}</div>` : ""}</td>
        <td>${(r.so_numbers && r.so_numbers.length ? r.so_numbers : [r.so_number]).filter(Boolean).map(n => `<a class="lnk mono" href="so.html?so=${encodeURIComponent(n)}">${esc(n)}</a>`).join("<br>")}</td>
        <td>${esc(r.customer_name || "")}</td>
        <td>${esc(r.carrier || "")}${r.account ? ` <span class="tag">${esc(r.account)}</span>` : ""}${whId ? "" : `<div class="dim" style="font-size:11.5px">${esc(r.warehouse || "")}</div>`}</td>
        <td><span class="off" style="font-size:12px">${esc(r.message || "")}</span></td>
        <td>${imsTs(r.booked_at)} <span class="dim" style="font-size:11.5px">${esc(ago(r.minutes_since_booked))}</span></td>
        <td>${r.schedule_checked_at ? imsTs(r.schedule_checked_at) : '<span class="dim">not yet</span>'}</td>
        <td class="mono" style="font-size:12px">${esc(r.tracking_number || "")}</td>
        <td><button class="xbtn" data-pk="${esc(r.booking_id)}">Check pickup</button></td></tr>`).join("")}</tbody></table>
      <div class="sosub">These Freightcom bookings have no confirmed carrier pickup. Schedule the pickup on the Freightcom site, then press Check pickup. IMS also checks again every few minutes, and a booking drops off this list once the pickup is confirmed (or 2 days after the pickup date).</div>`
    : '<div class="msg">Every Freightcom pickup is scheduled.</div>';
  box.querySelectorAll("[data-pk]").forEach(b => {
    b.onclick = async () => {
      b.disabled = true; b.textContent = "Checking…";
      const { data: r, error: e } = await sb.functions.invoke("freightcom", { body: { action: "pickup_poll", booking_id: b.dataset.pk } });
      if(e){
        let m = e.message || String(e);
        try{ if(e.context && typeof e.context.json === "function"){ const j = await e.context.json(); if(j && (j.message || j.error)) m = j.message || j.error; } }catch(_){}
        alert("Check pickup: " + m);
      } else {
        const pc = (r && r.pickup_check && r.pickup_check.pickup_check) || (r && r.pickup_check) || {};
        if(pc.message) alert(pc.message);
      }
      loadBadges(); show();
    };
  });
}
