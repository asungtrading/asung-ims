<!doctype html>
<html lang="en" data-ims-mode="ims">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backorders · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 탭 셋(bo v4 · 판정 485 · 489) · 백오더는 「줄」이 단위 · 모달은 so 화면들과 같은 모양 */
  .bowrap{padding:14px;display:flex;flex-direction:column;gap:14px}
  .botabs{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:0;background:#fff;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:#3b5bdb;color:#fff}
  .botabs .hint{font-size:12px;color:var(--muted)}
  .bofilt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
  .bofilt select,.bofilt input{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:12.5px}
  .bofilt .sp{flex:1}
  .bofilt .dash{color:var(--muted);font-size:12px}
  .bofilt .cust{min-width:220px}
  .bofilt label.ck{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
  .sosub{padding:8px 12px;font-size:12px;color:var(--muted);background:#fafbfd;border-top:1px solid var(--line)}
  .bosum{display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
  tr.grp td{background:#fafbfd;font-weight:600;font-size:12.5px}
  tr.ended td{color:#8a93a3}
  .pomodal[hidden]{display:none}
  .pobox input[type=search]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .pick{max-height:260px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
  .pick .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .pick .prow:hover{background:#fafbfd}
  .sohint{font-size:11.5px;color:var(--muted);margin-top:2px}
  .bofoot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .bofoot .sp{flex:1}
  .bofoot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
  .bofoot button:disabled{opacity:.4;cursor:default}
  /* Arrivals — 왼쪽 입고 · 오른쪽 기다리는 손님(판정 485 ④ · 488) */
  .arr{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:14px;align-items:start}
  @media (max-width:1100px){ .arr{grid-template-columns:1fr} }
  .arr .card{min-width:0}
  .alist{max-height:calc(100vh - 260px);overflow:auto}
  .alist tbody tr{cursor:pointer}
  .alist tbody tr.cur td{background:#eef2ff}
  .apane .ahead{padding:12px 14px;border-bottom:1px solid var(--line)}
  .apane .ahead h3{margin:0;font-size:15px}
  .apane .ahead .dim{font-size:12px}
  tr.other td{color:#8a93a3;background:#fcfcfd}
  tr.other td a.lnk{color:#6b7686}
  .ctc{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
  .ctc a{color:inherit}
  .warnline{font-size:11.5px;color:var(--warn);margin-top:3px}
  /* Insights — ① ② ③ (판정 485 · 486 · 487) */
  .stat .ssub{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-family:inherit;font-weight:400}
  .stat.loss b{color:var(--bad)}
  .basis{padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ilist tbody tr{cursor:pointer}
  .flagf{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .flagf select,.flagf input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px}
  .flagf input{flex:1;min-width:180px}
  .pobox.wide{width:min(1100px,96vw);max-width:96vw}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="bowrap">
  <div class="botabs">
    <div class="seg" id="tabs">
      <button data-tab="arrivals" title="Stock that came in and the customers waiting for it">Arrivals</button>
      <button data-tab="insights" title="How much we lose to backorders and which SKUs keep missing">Insights</button>
      <button data-tab="all" title="Every backorder and pre-order line">All backorders</button>
    </div>
    <span class="hint" id="tabHint"></span>
  </div>

  <!-- ══ Arrivals ══════════════════════════════════════ -->
  <section id="paneArrivals" hidden>
    <div class="card" style="margin-bottom:14px">
      <div class="bofilt">
        <select id="aLoc" title="Branch the stock came into"><option value="">All branches</option></select>
        <select id="aSup" title="Supplier of the receipt"><option value="">All suppliers</option><option value="none">Supplier unknown</option></select>
        <select id="aBrand" title="Brand"><option value="">All brands</option></select>
        <input type="search" id="aSku" placeholder="SKU starts with" style="width:150px" autocomplete="off">
        <input type="date" id="aFrom" title="Received from"><span class="dash">—</span><input type="date" id="aTo" title="Received to">
        <label class="ck" title="Also list stock that came in with nobody waiting for it"><input type="checkbox" id="aAll"> Include arrivals nobody waits for</label>
        <span class="sp"></span>
        <button class="pobtn" id="aClear">Clear</button>
      </div>
      <div class="sosub" id="aRule" style="border-top:0">Loading…</div>
    </div>
    <div class="arr">
      <div class="card">
        <div class="alist" id="aRows"><div class="msg">Loading…</div></div>
        <div class="bofoot"><span class="range" id="aRange"></span><span class="sp"></span><button id="aPrev">←</button><button id="aNext">→</button></div>
      </div>
      <div class="card apane" id="aPane"><div class="msg">Pick an arrival on the left to see who is waiting for it.</div></div>
    </div>
  </section>

  <!-- ══ Insights ══════════════════════════════════════ -->
  <section id="paneInsights" hidden>
    <div class="card">
      <div class="bofilt">
        <select id="iPer" title="Period">
          <option value="month">This month</option>
          <option value="d30">Last 30 days</option>
          <option value="d90">Last 90 days</option>
          <option value="year">This year</option>
          <option value="all">All time</option>
          <option value="custom">Custom…</option>
        </select>
        <span id="iCustom" hidden><input type="date" id="iFrom" title="From"><span class="dash"> — </span><input type="date" id="iTo" title="To"></span>
        <select id="iLoc" title="Branch"><option value="">All branches</option></select>
        <select id="iSup" title="Default supplier"><option value="">All suppliers</option><option value="none">No default supplier</option></select>
        <select id="iBrand" title="Brand"><option value="">All brands</option></select>
        <input type="search" id="iSku" placeholder="SKU starts with" style="width:150px" autocomplete="off">
        <select id="iSort" title="Sort the SKU list">
          <option value="lost_amount">Sort: lost sales $</option>
          <option value="lost">Sort: lost units</option>
          <option value="customers_waiting">Sort: customers waiting</option>
          <option value="repeat_asks">Sort: asked again</option>
          <option value="days_waiting_max">Sort: longest wait</option>
          <option value="open_backorder">Sort: open backorder</option>
          <option value="demand_then">Sort: demand</option>
        </select>
        <span class="sp"></span>
        <button class="pobtn" id="iClear">Clear</button>
      </div>
      <div class="stats" id="iStats"><span class="dim">Loading…</span></div>
      <div class="basis" id="iBasis"></div>
      <div class="ilist" id="iRows"><div class="msg">Loading…</div></div>
      <div class="sosub" id="iFoot"></div>
    </div>
  </section>

  <!-- ══ All backorders (bo v3a 그대로) ═══════════════════ -->
  <section id="paneAll" hidden>
    <div class="card">
      <div class="bofilt">
        <select id="fState" title="State">
          <option value="open">Open</option>
          <option value="ended">Ended (backorders)</option>
          <option value="all">All</option>
        </select>
        <select id="fKind" title="Backorder or pre-order">
          <option value="">Backorders and pre-orders</option><option value="backorder">Backorders only</option><option value="preorder">Pre-orders only</option>
        </select>
        <select id="fLoc" title="Branch"><option value="">All branches</option></select>
        <button class="pobtn cust" id="fCust" title="Pick a customer">All customers</button>
        <select id="fSup" title="Default supplier"><option value="">All suppliers</option><option value="none">No default supplier</option></select>
        <select id="fBrand" title="Brand"><option value="">All brands</option></select>
        <input type="search" id="fSku" placeholder="SKU starts with" style="width:150px" autocomplete="off">
        <select id="fArr" title="Stock arrived since the backorder">
          <option value="">Arrived — any</option><option value="true">Arrived since</option><option value="false">Not arrived yet</option>
        </select>
        <input type="date" id="fFrom" title="Ordered from"><span class="dash">—</span><input type="date" id="fTo" title="Ordered to">
        <select id="fEnd" title="How it ended" hidden>
          <option value="">Ended — any way</option>
          <option value="superseded">Taken over by a new order</option>
          <option value="proceeded">Proceeded (stock reserved)</option>
          <option value="expired">Expired</option>
          <option value="cancelled">Cancelled</option>
          <option value="merged">Merged</option>
        </select>
        <button class="pobtn" id="fClear">Clear</button>
      </div>
      <div class="bosum" id="sum"><span class="dim">Loading…</span></div>
      <div id="rows"><div class="msg">Loading…</div></div>
      <div class="bofoot">
        <span class="range" id="range"></span><span class="sp"></span>
        <button id="prev">←</button><button id="next">→</button>
      </div>
    </div>
  </section>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Backorders — 백오더 화면 (bo v4 · 2026-10-14 · 대화 Claude · 판정 485 ~ 489)
   탭 셋 — 처음 열리는 탭은 Arrivals(판정 489 · ?tab=insights|all 로 바로)
     Arrivals  ④ 입고 → 기다리는 손님 → 진행
               읽기 so_backorder_arrivals(p_filters) · so_backorder_waiting(p_product_id, p_location_id)  (asung-wms 20261015015435 bo-2 · 347 · 256 행)
               ⭐ 같은 창고 손님이 위 · 다른 창고 손님은 아래 회색 + 「Other branch」(판정 488 — 진행 전에 트랜스퍼 · 창고 바꾸기)
               ⭐ can_fill 은 미리 보기 셈(같은 창고 · 오래 기다린 줄부터) — 진행 창구가 그때 다시 계산한다
               ⭐ 진행은 오더 한 장 전부(proceed_moves_other_skus) — 그 오더의 다른 백오더 · 프리오더 줄도 함께 잡힌다
     Insights  ① 백오더 SKU 비중 · ② 잃은 세일 규모 · ③ 반복해서 못 대는 SKU
               읽기 so_backorder_overview(p_filters) (20261015015435:58 · bo-1c c6b3cc8 재발행) · 줄 상세 so_backorder_demand(p_filters) (20261015005345:40)
               ⭐ ② = 기간 안에 잃은 것 ÷ 기간 안 확정 주문(판정 486 · 잃은 몫마다 제 날짜) · 「백오더가 된 금액」 = 덩어리마다 처음 바로 못 보낸 몫(판정 487)
               ⭐ ③ 의 기간은 「그 기간에 처음 주문된 백오더」(order_from/to → 덩어리 첫 주문일) — ② 와 뜻이 다르다(화면이 밝힌다)
               쓰기 so_demand_flag_set(p_line_ids, p_reason, p_note) · so_demand_flag_clear(p_line_ids) (20261014234811:289 · 348 · manager · 판정 478)
     All       bo v3a 목록 그대로 — so_backorder_list(p_filters) · so_backorder_proceed(p_so_id, p_commit)
   ⚠️ 셈은 DB 가 한다 — 화면이 다시 계산하지 마라(가용 · 입고 · 수요 · 금액)
   ⚠️ 입고 알림 메일은 아직 IMS 가 보내지 않는다(이관은 다음 차수) — 이 화면에 알림 기록 칸이 없다
   ───────────────────────────────────────────────────────────── */
const BO_BUILD = "2026-10-14 · bo v4";   // 대화 Claude — bo-3(판정 485 ~ 489): 탭 셋 Arrivals(기본) · Insights · All backorders · 표식 달기 · 떼기(Insights 상세) ← bo v3a 2026-10-13: 대화 Claude — 아래 설명에서 Cin7 글귀를 뺐다(원칙 1 · ful-1b 발견) ← bo v3: 대화 Claude — 판정 351(Caleb 「pre order도 back order화면에 보이게 · 입고 확인」 · 안 A): 프리오더도 같은 목록(행 kind · so_backorder_list 재발행 20261007163823 bo-pre-1) · 「Pre-order」 이름표 · 거르기 Kind(All · Backorders · Pre-orders) · 요약에 open_backorder · open_preorder · 끝난 목록은 백오더만(프리오더는 장부가 없다) · 판정 9 — 프리오더는 만료 · 이어받기 없음 · 알림 칸 null ← bo v2 2026-10-05 · 대화 Claude — asm-3d(판정 244 · asm 묶음 4): 콤보 백오더는 콤보 한 줄(수량 = 콤보 수 · 가용 = 통째 콤보 수 · arrived = 구성품 입고 + 통째 콤보 하나 이상) · 줄 아래 구성품(components[] · asm-2b2) · SKU 거르기는 구성품 SKU 로도 찾는다(창구) ← bo v1.3
console.log("so-backorders.html build:", BO_BUILD);

let sb = null, me = null, rank = 0;
const RANK = { worker: 1, manager: 2, supervisor: 3, admin: 4 };
const isMgr = () => rank >= 2;
const PAGE = 100;
let offset = 0, custId = null, custName = "", last = null;
/* v1.2 — 무상 줄 필터 칸을 없앴다(Caleb 2026-09-25 「실제로는 거의 없는 상황이라」) · 요약의 숫자가 1 이상일 때만 보이고 누르면 그것만 거른다
   ⚠️ 무상 백오더는 만료 · 이어받기로 닫히지 않는다(§15 판정 15·16) — 드물어도 보이게 둔다 */
let owedOnly = false;

const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits: 4 }));
/* bo v4 — 금액(CAD · 할인 뒤 단가 × 수량 · 세금 · 운임 · 오더 할인 제외 — bo-1c amount_rule) */
const money = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc("$" + Number(v).toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pct = (v) => (v === null || v === undefined || v === "") ? '<span class="dim">—</span>' : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits: 2 }) + "%");
/* v1.1 — available_other 는 숫자가 아니라 {창고 이름: 가용 EA} 모양이다(Caleb 화면 시험 2026-09-25 · 「other NaN」) */
function otherTxt(o){
  if(o === null || o === undefined) return '<span class="dim">—</span>';
  if(typeof o !== "object") return qty(o);
  const parts = Object.entries(o).map(([w, v]) => `${esc(w)} ${qty(v)}`);
  return parts.length ? parts.join(" · ") : '<span class="dim">—</span>';
}
const END_LBL = { superseded: "taken over", proceeded: "proceeded", expired: "expired", cancelled: "cancelled", merged: "merged" };

function torontoToday(){
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}
function addDays(iso, n){
  const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
const val = (id) => document.getElementById(id).value;

/* ══ 탭 ══════════════════════════════════════════════ */
const TABS = { arrivals: "paneArrivals", insights: "paneInsights", all: "paneAll" };
const TAB_HINT = {
  arrivals: "What came in, who is waiting for it, and what can go out now.",
  insights: "How much we lose to backorders and which SKUs keep missing.",
  all: "Every backorder and pre-order line.",
};
const started = { arrivals: false, insights: false, all: false };
let curTab = "arrivals";
function showTab(t){
  if(!TABS[t]) t = "arrivals";
  curTab = t;
  Object.entries(TABS).forEach(([k, id]) => { document.getElementById(id).hidden = k !== t; });
  document.querySelectorAll("#tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.getElementById("tabHint").textContent = TAB_HINT[t];
  const u = new URL(location.href);
  if(t === "arrivals") u.searchParams.delete("tab"); else u.searchParams.set("tab", t);
  history.replaceState(null, "", u.toString());
  if(!started[t]){
    started[t] = true;
    if(t === "arrivals") aLoad();
    if(t === "insights") iLoad();
    if(t === "all") load();
  }
}
function reloadCurrent(){
  if(curTab === "arrivals"){ aLoad(); return; }
  if(curTab === "insights"){ iLoad(); return; }
  load();
}

/* ══ Arrivals ═════════════════════════════════════════ */
let aOffset = 0, aSel = null;   // aSel = { pid, loc }
const A_PAGE = 200;
function aFilters(){
  const f = { limit: A_PAGE, offset: aOffset };
  const put = (k, v) => { if(v !== "" && v !== null && v !== undefined) f[k] = v; };
  put("location_id", val("aLoc"));
  put("supplier_id", val("aSup"));
  put("brand_id", val("aBrand"));
  put("sku", val("aSku").trim());
  put("received_from", val("aFrom"));
  put("received_to", val("aTo"));
  if(document.getElementById("aAll").checked) f.include_no_waiting = true;
  return f;
}
async function aLoad(){
  const box = document.getElementById("aRows");
  box.innerHTML = '<div class="msg">Loading…</div>';
  const { data, error } = await sb.rpc("so_backorder_arrivals", { p_filters: aFilters() });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; document.getElementById("aRule").textContent = ""; return; }
  const rows = data.rows || [];
  document.getElementById("aRule").innerHTML =
    `Received ${data.period_from ? esc(data.period_from) : "from the start"} — ${data.period_to ? esc(data.period_to) : "today"} · `
    + `${esc(Number(data.total || 0).toLocaleString())} arrival${Number(data.total) === 1 ? "" : "s"}${data.include_no_waiting ? "" : " with customers waiting"}. `
    + `Quantities are in EA. Supplier = the receipt's purchase order, or the product's default supplier for receipts that have no purchase order.`;
  if(!rows.length){
    box.innerHTML = `<div class="msg">${data.include_no_waiting ? "Nothing came in during this period." : "Nothing came in for a waiting customer during this period. Widen the dates, or tick \"Include arrivals nobody waits for\"."}</div>`;
    aPager(data); aDrawPane(null); return;
  }
  box.innerHTML = `<table><thead><tr>
      <th>Product</th><th>Branch</th><th class="num">Received</th><th class="num">Here now</th><th class="num">Waiting here</th><th class="num">Elsewhere</th><th class="num">Can fill</th>
    </tr></thead><tbody>${rows.map(r => {
      const ws = r.waiting_same_location || {}, wo = r.waiting_other_locations || {};
      const cur = aSel && aSel.pid === r.product_id && aSel.loc === r.location_id;
      return `<tr data-pid="${esc(r.product_id)}" data-loc="${esc(r.location_id)}" class="${cur ? "cur" : ""}">
        <td><span class="mono">${esc(r.sku || "")}</span><div class="dim" style="font-size:11.5px">${esc(r.product_name || "")}</div>
          <div class="dim" style="font-size:11px">${esc(r.supplier_name || "supplier unknown")}${r.supplier_basis === "product_default" ? ' <span class="tag" title="This receipt has no purchase order — the product\'s default supplier is shown">default supplier</span>' : ""}</div></td>
        <td>${dim(r.location_name)}</td>
        <td class="num">${qty(r.received_base)}<div class="dim" style="font-size:11px">${esc(r.last_received_on || "")}${Number(r.receipts_n) > 1 ? ` · ${esc(r.receipts_n)} receipts` : ""}</div></td>
        <td class="num">${qty(r.available_now_base)}</td>
        <td class="num">${Number(ws.lines) ? `${qty(ws.qty_base)}<div class="dim" style="font-size:11px">${esc(ws.customers)} cust.</div>` : '<span class="dim">0</span>'}</td>
        <td class="num">${Number(wo.lines) ? `<span class="neutral">${qty(wo.qty_base)}</span><div class="dim" style="font-size:11px">${esc(wo.customers)} cust.</div>` : '<span class="dim">0</span>'}</td>
        <td class="num">${Number(r.can_fill_now_base) > 0 ? `<b>${qty(r.can_fill_now_base)}</b>` : '<span class="dim">0</span>'}</td>
      </tr>`;
    }).join("")}</tbody></table>`;
  box.querySelectorAll("tbody tr[data-pid]").forEach(tr => {
    tr.onclick = () => {
      aSel = { pid: tr.dataset.pid, loc: tr.dataset.loc };
      box.querySelectorAll("tbody tr.cur").forEach(x => x.classList.remove("cur"));
      tr.classList.add("cur");
      aWaiting();
    };
  });
  aPager(data);
  if(aSel && rows.some(r => r.product_id === aSel.pid && r.location_id === aSel.loc)) aWaiting();
  else { aSel = null; aDrawPane(null); }
}
function aPager(data){
  const n = (data.rows || []).length, total = Number(data.total || 0);
  const a = total ? aOffset + 1 : 0, b = Math.min(aOffset + n, total);
  document.getElementById("aRange").textContent = `${a.toLocaleString()}–${b.toLocaleString()} / ${total.toLocaleString()}`;
  const p = document.getElementById("aPrev"), x = document.getElementById("aNext");
  p.disabled = aOffset === 0; x.disabled = aOffset + A_PAGE >= total;
  p.onclick = () => { if(aOffset > 0){ aOffset = Math.max(0, aOffset - A_PAGE); aLoad(); } };
  x.onclick = () => { aOffset += A_PAGE; aLoad(); };
}
const aRefilter = () => { aOffset = 0; aLoad(); };
function aDrawPane(html){
  document.getElementById("aPane").innerHTML = html || '<div class="msg">Pick an arrival on the left to see who is waiting for it.</div>';
}
async function aWaiting(){

    const canGo = isMgr() && r.can_proceed && r.same_location;

      <td>${esc(r.customer_name || "")}${r.contact_name ? `<div class="ctc">${esc(r.contact_name)}</div>` : ""}${contact ? `<div class="ctc">${contact}</div>` : '<div class="ctc">no default contact</div>'}</td>
      <td class="num">${esc(r.days_waiting ?? "")}${r.days_waiting !== null && r.days_waiting !== undefined ? "d" : ""}</td>
      <td class="num">${qty(r.qty_open)}${Number(r.base_per_unit) !== 1 ? `<div class="dim" style="font-size:11px">${qty(r.qty_base)} EA</div>` : ""}${r.via_combo ? '<div class="dim" style="font-size:11px">in a combo</div>' : ""}</td>
      <td class="num">${r.same_location ? (Number(r.can_fill_base) > 0 ? `<b>${qty(r.can_fill_units)}</b>${Number(r.base_per_unit) !== 1 ? `<div class="dim" style="font-size:11px">${qty(r.can_fill_base)} EA</div>` : ""}` : '<span class="dim">0</span>') : '<span class="tag" title="Ruling 488 — shown so nobody is missed; it needs a transfer or a branch change before it can proceed">Other branch · ' + esc(r.location_name || "") + "</span>"}</td>
      <td>${canGo ? `<button class="xbtn" data-proceed="${esc(r.so_id)}" data-no="${esc(r.so_number)}" data-others="${esc(r.order_other_skus || 0)}" title="Reserve what is in stock now for this order (manager)">proceed</button>` : `<span class="dim" style="font-size:11px" title="${esc(why)}">—</span>`}
        ${r.proceed_moves_other_skus ? `<div class="warnline" title="Proceed takes the whole order">+${esc(r.order_other_skus)} other SKU${Number(r.order_other_skus) === 1 ? "" : "s"} on this order</div>` : ""}</td>
    </tr>`;
  };
  aDrawPane(`
    <div class="ahead">
      <h3><span class="mono">${esc(data.sku || "")}</span> at ${esc(data.location_name || "")}</h3>
      <div class="dim">${esc(data.product_name || "")}</div>
    </div>
    <div class="stats">

      <div class="stat">Waiting here<b>${qty(ws.qty_base)}</b><span class="ssub">${esc(ws.customers || 0)} customer${Number(ws.customers) === 1 ? "" : "s"} · ${esc(ws.lines || 0)} line${Number(ws.lines) === 1 ? "" : "s"}</span></div>
      <div class="stat">Can fill now<b>${qty(data.can_fill_now_base)}</b><span class="ssub">EA, longest wait first</span></div>
      ${Number(wo.lines) ? `<div class="stat warn">Other branches<b>${qty(wo.qty_base)}</b><span class="ssub">${esc(wo.customers)} customer${Number(wo.customers) === 1 ? "" : "s"}</span></div>` : ""}
    </div>
    ${rows.length ? `<table><thead><tr><th>Order</th><th>Customer</th><th class="num">Waiting</th><th class="num">Open</th><th class="num">Can fill</th><th></th></tr></thead>

  document.querySelectorAll("#aPane [data-proceed]").forEach(b => {
    b.onclick = () => openProceed(b.dataset.proceed, b.dataset.no, Number(b.dataset.others) || 0);
  });
}

function iPeriod(){
  const t = torontoToday(), p = val("iPer");
  if(p === "month") return { from: t.slice(0, 8) + "01", to: t, label: "this month" };
  if(p === "d30") return { from: addDays(t, -29), to: t, label: "the last 30 days" };
  if(p === "d90") return { from: addDays(t, -89), to: t, label: "the last 90 days" };
  if(p === "year") return { from: t.slice(0, 4) + "-01-01", to: t, label: "this year" };
  if(p === "custom") return { from: val("iFrom") || null, to: val("iTo") || null, label: "the chosen dates" };
  return { from: null, to: null, label: "all time" };
}
function iFilters(){
  const per = iPeriod();
  const f = { sort: val("iSort"), limit: 200 };
  const put = (k, v) => { if(v !== "" && v !== null && v !== undefined) f[k] = v; };
  put("order_from", per.from); put("order_to", per.to);
  put("location_id", val("iLoc"));
  put("supplier_id", val("iSup"));
  put("brand_id", val("iBrand"));
  put("sku", val("iSku").trim());
  return { f, per };
}

      <td class="num">${qty(r.demand_then)}</td>

      <td class="num">${Number(r.lost) ? `<b>${money(r.lost_amount)}</b><div class="dim" style="font-size:11px">${qty(r.lost)} units</div>` : '<span class="dim">0</span>'}${Number(r.flagged) ? `<div class="dim" style="font-size:11px">${qty(r.flagged)} flagged</div>` : ""}</td>
      <td class="num">${Number(r.open_backorder) ? `${qty(r.open_backorder)}<div class="dim" style="font-size:11px">${money(r.open_backorder_amount)}</div>` : '<span class="dim">0</span>'}</td>
      <td>${r.last_receipt_on ? esc(r.last_receipt_on) : '<span class="dim">never</span>'}${r.no_receipt_since_first_ask ? '<div><span class="tag off" title="No stock has come in since the first customer asked for it">nothing in since first ask</span></div>' : ""}</td>
    </tr>`).join("")}</tbody></table>`;

const FLAG_LBL = { staff_error: "Staff error", duplicate: "Duplicate entry", test: "Test", other: "Other" };
async function openSkuDetail(r){
  if(!r) return;
  modalOpen(`
    <h4><span class="mono">${esc(r.sku || "")}</span> — ${esc(r.product_name || "")}</h4>
    <div class="pbody"><div id="sdOut"><div class="msg">Loading…</div></div><div id="sdMsg" style="margin-top:10px;font-size:12.5px"></div></div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Close</button></div>`);
  document.getElementById("modalBox").classList.add("wide");
  wireModalClose();
  let changed = false;
  const closeBtn = document.querySelector('#modalBox [data-m="close"]');
  closeBtn.onclick = () => { modalClose(); if(changed) iLoad(); };
  const draw = async () => {
    const base = iLast ? iLast.f : {};
    const f = { product_id: r.product_id, limit: 200 };
    ["order_from", "order_to", "location_id", "supplier_id", "brand_id"].forEach(k => { if(base[k]) f[k] = base[k]; });
    const { data, error } = await sb.rpc("so_backorder_demand", { p_filters: f });
    const out = document.getElementById("sdOut");
    if(!out) return;
    if(error){ out.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    const cl = data.rows || [];
    if(!cl.length){ out.innerHTML = '<div class="msg">No backorders for this SKU with these filters.</div>'; return; }
    let html = `<table><thead><tr><th>Order</th><th>State</th><th class="num">Ordered</th><th class="num">Sold</th><th class="num">Lost</th><th class="num">In progress</th><th class="num">Open</th><th>Not real demand</th></tr></thead><tbody>`;
    cl.forEach(c => {
      html += `<tr class="grp"><td colspan="8">${esc(c.customer_name || "")} · ${esc(c.location_name || "")} — wanted ${qty(c.demand_then)}, sold ${qty(c.sold)}, lost ${qty(c.lost)}${c.lost_amount !== null && c.lost_amount !== undefined ? " (" + money(c.lost_amount) + ")" : ""}</td></tr>`;
      (c.lines || []).forEach(l => {
        const lbk = l.lost_by || {};
        const lostTxt = Number(l.lost) ? [["no longer wanted", lbk.unwanted], ["expired", lbk.expired], ["cancelled", lbk.cancelled], ["removed", lbk.removed]]
            .filter(x => Number(x[1])).map(x => `${qty(x[1])} ${x[0]}`).join(", ") : "";
        const fl = l.flag;
        let flagCell;
        if(fl){
          flagCell = `<span class="tag disc" title="${esc((fl.note || "") + (fl.flagged_at ? " · " + new Date(fl.flagged_at).toLocaleString("sv-SE", { timeZone: "America/Toronto" }).slice(0, 16) : ""))}">${esc(FLAG_LBL[fl.reason] || fl.reason)}</span>`
            + (isMgr() ? ` <button class="xbtn" data-unflag="${esc(l.line_id)}" title="Count this line as demand again">unmark</button>` : "");
        } else if(Number(l.lost) > 0 && isMgr()){
          flagCell = `<button class="xbtn" data-flag="${esc(l.line_id)}" data-lbl="${esc(l.so_number + " line " + l.line_no)}" title="Take this lost sale out of the demand count (staff error, duplicate entry, test …)">mark…</button>`;
        } else flagCell = '<span class="dim">—</span>';
        html += `<tr>
          <td><a class="lnk mono" href="so.html?so=${encodeURIComponent(l.so_number)}">${esc(l.so_number)}</a> <span class="dim">#${esc(l.line_no)}</span><div class="dim" style="font-size:11px">${esc(l.order_date || "")}${l.sku !== r.sku ? " · " + esc(l.sku || "") : ""}</div></td>
          <td>${esc(l.so_status || "")}</td>
          <td class="num">${qty(l.ordered)}${Number(l.transferred) ? `<div class="dim" style="font-size:11px">${qty(l.transferred)} moved on</div>` : ""}</td>
          <td class="num">${qty(l.sold)}</td>
          <td class="num">${Number(l.lost) ? qty(l.lost) : '<span class="dim">0</span>'}${lostTxt ? `<div class="dim" style="font-size:11px">${lostTxt}</div>` : ""}</td>
          <td class="num">${Number(l.in_progress) ? qty(l.in_progress) : '<span class="dim">0</span>'}</td>
          <td class="num">${Number(l.open_backorder) ? qty(l.open_backorder) : '<span class="dim">0</span>'}</td>
          <td>${flagCell}</td>
        </tr>`;
      });
    });
    html += `</tbody></table>
      <div class="sohint" style="margin-top:8px">"Moved on" = taken over by a later order or merged into another — counted there, not here. Marking a line as not real demand takes its lost units out of both wanted and lost; orders, stock and the web store are not touched.</div>`;
    out.innerHTML = html;
    out.querySelectorAll("[data-flag]").forEach(b => { b.onclick = () => flagForm(b); });
    out.querySelectorAll("[data-unflag]").forEach(b => {
      b.onclick = async () => {
        b.disabled = true;
        const res = await sb.rpc("so_demand_flag_clear", { p_line_ids: [b.dataset.unflag] });
        if(res.error){ say("sdMsg", "err", res.error.message); b.disabled = false; return; }
        changed = true; say("sdMsg", "on", "Counted as demand again."); draw();
      };
    });
  };
  const flagForm = (b) => {
    document.querySelectorAll("#sdOut .flagf").forEach(x => x.remove());
    const tr = b.closest("tr");
    const holder = document.createElement("tr");
    holder.className = "flagrow";
    holder.innerHTML = `<td colspan="8"><div class="flagf">
        <span>Not real demand — ${esc(b.dataset.lbl)}:</span>
        <select id="sfReason"><option value="">Pick a reason…</option><option value="staff_error">Staff error</option><option value="duplicate">Duplicate entry</option><option value="test">Test</option><option value="other">Other</option></select>
        <input type="text" id="sfNote" placeholder="Note (needed for Other)" autocomplete="off">
        <button class="pobtn go" id="sfSave">Mark</button><button class="pobtn" id="sfCancel">Cancel</button>
      </div></td>`;
    tr.after(holder);
    document.getElementById("sfCancel").onclick = () => holder.remove();
    document.getElementById("sfSave").onclick = async () => {
      const reason = val("sfReason"), note = document.getElementById("sfNote").value.trim();
      if(!reason){ say("sdMsg", "err", "Pick a reason first."); return; }
      if(reason === "other" && !note){ say("sdMsg", "err", "Write a note for Other."); return; }
      document.getElementById("sfSave").disabled = true;
      const res = await sb.rpc("so_demand_flag_set", { p_line_ids: [b.dataset.flag], p_reason: reason, p_note: note || null });
      if(res.error){ say("sdMsg", "err", res.error.message); document.getElementById("sfSave").disabled = false; return; }
      changed = true; say("sdMsg", "on", "Marked as not real demand."); draw();
    };
  };
  draw();
}

/* ══ All backorders (bo v3a) ═══════════════════════════ */
function filters(){
  const f = { state: document.getElementById("fState").value, limit: PAGE, offset: offset };
  const put = (k, v) => { if(v !== "" && v !== null && v !== undefined) f[k] = v; };
  put("kind", document.getElementById("fKind").value);   // bo v3 — 판정 351
  put("location_id", document.getElementById("fLoc").value);
  put("customer_id", custId);
  put("supplier_id", document.getElementById("fSup").value);
  put("brand_id", document.getElementById("fBrand").value);
  put("sku", document.getElementById("fSku").value.trim());
  put("arrived", document.getElementById("fArr").value);
  if(owedOnly) f.owed = true;
  put("order_from", document.getElementById("fFrom").value);
  put("order_to", document.getElementById("fTo").value);
  if(f.state !== "open") put("end_kind", document.getElementById("fEnd").value);
  if("arrived" in f) f.arrived = f.arrived === "true";
  return f;
}

async function load(){
  const box = document.getElementById("rows");
  box.innerHTML = '<div class="msg">Loading…</div>';
  const { data, error } = await sb.rpc("so_backorder_list", { p_filters: filters() });
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; document.getElementById("sum").innerHTML = ""; return; }
  last = data;
  const rows = data.rows || [];
  document.getElementById("sum").innerHTML = `
    <div class="stat">Lines<b>${esc(data.total)}</b></div>
    <div class="stat">Open<b>${esc(data.open)}</b></div>
    ${data.open_preorder !== undefined ? `<div class="stat">Backorders<b>${esc(data.open_backorder)}</b></div><div class="stat">Pre-orders<b>${esc(data.open_preorder)}</b></div>` : ""}
    <div class="stat">Ended<b>${esc(data.ended)}</b></div>
    ${Number(data.open_owed) > 0 || owedOnly ? `<div class="stat"><a class="lnk" id="owedTog" title="${owedOnly ? "Show every backorder again" : "Show only the free lines we still owe"}">Free lines we owe${owedOnly ? " — showing only these" : ""}</a><b>${esc(data.open_owed)}</b></div>` : ""}`;
  const tg = document.getElementById("owedTog");
  if(tg) tg.onclick = () => { owedOnly = !owedOnly; refilter(); };
  if(!rows.length){ box.innerHTML = '<div class="msg">Nothing matches.</div>'; pager(data); return; }

  /* 손님마다 묶어 보인다 — 창구가 손님 · 제품 · 주문일 순으로 준다 */
  let html = `<table><thead><tr>
      <th>Order</th><th>Ordered</th><th>Product</th><th>Supplier · brand</th><th>Branch</th>
      <th class="num">Open</th><th class="num">Waiting</th><th>Stock</th><th>State</th><th></th>
    </tr></thead><tbody>`;
  let lastCust = null;
  rows.forEach(r => {
    if(r.customer_id !== lastCust){
      lastCust = r.customer_id;
      html += `<tr class="grp"><td colspan="10">${esc(r.customer_name || "")}</td></tr>`;
    }
    const open = r.state === "open";
    const stock = open
      ? (r.arrived ? `<span class="on">arrived</span>` : '<span class="dim">not yet</span>')
        + `<div class="dim" style="font-size:11px">here ${qty(r.available_here)}${r.is_combo ? " combo" + (Number(r.available_here) === 1 ? "" : "s") : ""} · ${otherTxt(r.available_other)}</div>`
      : "";
    const st = open
      ? (r.kind === "preorder" ? '<span class="tag disc" title="A confirmed order waiting for stock that has not come in yet — never expires or gets taken over">Pre-order</span> ' : "")   // bo v3
        + (r.owed ? '<span class="tag disc">free — we owe it</span>' : '<span class="tag">open</span>')
      : `<span class="tag">${esc(END_LBL[r.end_kind] || r.end_kind || "ended")}</span>`
        + (r.taken_by_so_number ? ` <a class="lnk mono" href="so.html?so=${encodeURIComponent(r.taken_by_so_number)}">${esc(r.taken_by_so_number)}</a>` : "")
        + (Number(r.qty_unwanted) ? `<div class="dim" style="font-size:11px">taken ${qty(r.qty_taken)} · no longer wanted ${qty(r.qty_unwanted)}</div>` : "");
    html += `<tr class="${open ? "" : "ended"}">
      <td><a class="lnk mono" href="so.html?so=${encodeURIComponent(r.so_number)}">${esc(r.so_number)}</a></td>
      <td>${dim(r.order_date)}</td>
      <td><span class="mono">${esc(r.sku || "")}</span>${Number(r.pack_factor) > 1 ? ` <span class="dim">×${esc(r.pack_factor)}</span>` : ""}${r.is_combo ? ' <span class="tag" title="Counted in whole combos — it can ship when every component is here">combo</span>' : ""}<div class="dim" style="font-size:11.5px">${esc(r.product_name || "")}</div>${r.is_combo && (r.components || []).length ? `<div class="dim" style="font-size:11px">each: ${r.components.map(c => `${esc(qty(c.combo_qty))} × <span class="mono">${esc(c.sku || "")}</span>`).join(", ")}</div>` : ""}</td>
      <td>${esc(r.supplier_name || "")}${r.supplier_name ? "" : '<span class="dim">no default supplier</span>'}<div class="dim" style="font-size:11.5px">${esc(r.brand_name || "")}</div></td>
      <td>${dim(r.location_name)}</td>
      <td class="num">${open ? qty(r.qty_open) : '<span class="dim">' + qty(r.qty_open) + "</span>"}<div class="dim" style="font-size:11px">of ${qty(r.qty_ordered)}</div></td>
      <td class="num">${r.days_waiting !== null && r.days_waiting !== undefined ? esc(r.days_waiting) + "d" : '<span class="dim">—</span>'}</td>
      <td>${stock}</td>
      <td>${st}</td>
      <td>${open && isMgr() ? `<button class="xbtn" data-proceed="${esc(r.so_id)}" data-no="${esc(r.so_number)}" title="Reserve what is in stock now for this ${r.kind === "preorder" ? "pre-order" : "backorder"} order (manager)">proceed</button>` : ""}</td>
    </tr>`;
  });
  html += `</tbody></table>
    <div class="sosub">Pre-orders are confirmed orders waiting for stock that has not come in yet — they are listed while open, never expire and are never taken over by a new order (ruling 9); arrived and proceed work the same way.
      Arrived = a purchase receipt or a transfer from another branch landed at this branch after the backorder or pre-order was made (adjustments and returns do not count).
      Here = available now in this branch · then each other branch by name (EA — for a combo, whole combos its components can make). A combo is arrived when one of its components came in and at least one whole combo is here. Arrival email notices are not recorded on this screen yet.</div>`;
  box.innerHTML = html;
  box.querySelectorAll("[data-proceed]").forEach(b => { b.onclick = () => openProceed(b.dataset.proceed, b.dataset.no, 0); });
  pager(data);
}
function pager(data){
  const a = data.total ? offset + 1 : 0, b = Math.min(offset + (data.rows || []).length, data.total || 0);
  document.getElementById("range").textContent = `${a.toLocaleString()}–${b.toLocaleString()} / ${(data.total || 0).toLocaleString()}`;
  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = offset === 0; n.disabled = offset + PAGE >= (data.total || 0);
  p.onclick = () => { if(offset > 0){ offset = Math.max(0, offset - PAGE); load(); } };
  n.onclick = () => { offset += PAGE; load(); };
}
const refilter = () => { offset = 0; load(); };

/* ══ 모달 ══════════════════════════════════════════════ */
function modalOpen(html){ const b = document.getElementById("modalBox"); b.classList.remove("wide"); b.innerHTML = html; document.getElementById("modal").hidden = false; }
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });
function wireModalClose(){ document.querySelectorAll('#modalBox [data-m="close"]').forEach(b => { b.onclick = modalClose; }); }
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}

/* 손님 고르기 — 9,469 명 · 서버에서 이름으로 */
function openCustPick(){
  modalOpen(`
    <h4>Backorders of one customer</h4>
    <div class="pbody">
      <input type="search" id="cpQ" placeholder="Search customer by name" autocomplete="off">
      <div class="pick" id="cpList"><div class="msg">Type to search.</div></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" id="cpAll">All customers</button>
      <button class="pobtn" data-m="close">Cancel</button>
    </div>`);
  wireModalClose();
  document.getElementById("cpAll").onclick = () => { custId = null; custName = ""; document.getElementById("fCust").textContent = "All customers"; modalClose(); refilter(); };
  imsQ("#cpQ", async (t) => {
    const box = document.getElementById("cpList");
    if(!box) return;
    if(!t){ box.innerHTML = '<div class="msg">Type to search.</div>'; return; }
    const { data, error } = await sb.from("customer").select("id,name").ilike("name", `%${t}%`).order("name").limit(60);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = data.length ? data.map(r => `<div class="prow" data-cid="${r.id}" data-cn="${esc(r.name)}">${esc(r.name)}</div>`).join("") : '<div class="msg">No customer matches.</div>';
    box.querySelectorAll("[data-cid]").forEach(el => {
      el.onclick = () => { custId = el.dataset.cid; custName = el.dataset.cn; document.getElementById("fCust").textContent = custName; modalClose(); refilter(); };
    });
  });
}

/* 진행 — manager · 그 백오더 오더(형제)가 지금 잡을 수 있는 만큼 잡는다 · 못 잡은 몫은 다시 백오더로 이어진다
   ⭐ 미리 보기는 창구가 트랜잭션 안에서 돌리고 되돌린다(P0777) — 아무것도 안 쓴다
   bo v4 — others: Arrivals 에서 연 진행이 이 SKU 말고도 그 오더의 열린 백오더 · 프리오더 줄 수(proceed_moves_other_skus) · 끝나면 지금 탭을 다시 읽는다 */
async function openProceed(soId, soNo, others){
  modalOpen(`
    <h4>Proceed ${esc(soNo)} — reserve stock that is here now</h4>
    <div class="pbody">${Number(others) > 0 ? `<div class="warnline" style="margin-bottom:8px">This order has ${esc(others)} other SKU${Number(others) === 1 ? "" : "s"} waiting — proceed reserves every line on the order that has stock here, not only the one you picked.</div>` : ""}<div id="prOut"><div class="msg">Checking…</div></div><div id="prMsg" style="margin-top:10px;font-size:12.5px"></div></div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" data-m="close">Cancel</button>
      <button class="pobtn go" id="prGo" disabled>Proceed</button>
    </div>`);
  wireModalClose();
  const draw = (data, done) => {
    const lines = data.lines || [];
    document.getElementById("prOut").innerHTML = `
      <table><thead><tr><th class="num">#</th><th>SKU</th><th class="num">Ordered</th><th>Result</th><th class="num">Reserved</th><th class="num">Still backordered</th></tr></thead>
      <tbody>${lines.map(l => `<tr><td class="num">${esc(l.line_no)}</td><td class="mono">${esc(l.sku)}</td><td class="num">${qty(l.qty_ordered)}</td>
        <td>${esc(l.kind || "")}</td><td class="num">${qty(l.allocated)}</td>
        <td class="num">${Number(l.backordered) ? `<span class="neutral">${qty(l.backordered)}</span>` : '<span class="dim">0</span>'}</td></tr>`).join("")}</tbody></table>
      ${(data.siblings || []).length ? `<div class="sosub">${done ? "Split off" : "Will split off"}: ${data.siblings.map(x => `${esc(x.so_number || "")} ${esc(x.split_reason || "")}`).join(" · ")}</div>` : ""}
      <div class="sohint" style="margin-top:8px">${done ? "Done." : "Nothing is saved until you press Proceed."} Backorder lines ended here: ${esc(data.backorder_lines_ended ?? 0)}.</div>`;
  };
  const { data, error } = await sb.rpc("so_backorder_proceed", { p_so_id: soId, p_commit: false });
  if(error){ document.getElementById("prOut").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  draw(data, false);
  /* v1.3 — 잡힐 것이 없으면 진행을 막는다(Caleb 2026-09-25 · 「스탁이 들어오면 자동으로 reserve 한다고 오해」) · Proceed 는 기다려 주지 않는다 */
  const ls = data.lines || [];
  if(ls.length && !ls.some(l => Number(l.allocated) > 0)){
    say("prMsg", "err", "Nothing can be reserved yet — there is no stock for these lines in this warehouse. Proceed does not wait for stock: press it again after stock arrives.");
    return;
  }
  document.getElementById("prGo").disabled = false;
  document.getElementById("prGo").onclick = async () => {
    say("prMsg", "", "Proceeding…"); document.getElementById("prGo").disabled = true;
    const r = await sb.rpc("so_backorder_proceed", { p_so_id: soId, p_commit: true });
    if(r.error){ say("prMsg", "err", r.error.message); document.getElementById("prGo").disabled = false; return; }
    draw(r.data, true);
    say("prMsg", "on", "Proceeded.");
    const cl = document.querySelector('#modalBox [data-m="close"]');
    cl.textContent = "Close"; cl.onclick = () => { modalClose(); reloadCurrent(); };
  };
}

/* ── 시작 ─────────────────────────────────────────── */
imsAuth.start({ changePw: true }, async (client, meData) => {
  sb = client; me = meData; rank = RANK[me.role] || 0;
  window.sb = sb;
  imsHeader(me);
  document.getElementById("buildTag").textContent = BO_BUILD;

  const [wh, sup, br] = await Promise.all([
    sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name"),
    sb.from("supplier").select("id,name").eq("is_active", true).order("name"),
    sb.from("ref_brand").select("id,name").eq("is_active", true).order("name"),
  ]);
  const fill = (id, rows) => { const s = document.getElementById(id); s.insertAdjacentHTML("beforeend", (rows || []).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")); };
  ["fLoc", "aLoc", "iLoc"].forEach(i => fill(i, wh.data));
  ["fSup", "aSup", "iSup"].forEach(i => fill(i, sup.data));
  ["fBrand", "aBrand", "iBrand"].forEach(i => fill(i, br.data));
  [wh, sup, br].forEach(r => { if(r.error) console.warn("list load failed:", r.error.message); });

  /* 탭 */
  document.querySelectorAll("#tabs [data-tab]").forEach(b => { b.onclick = () => showTab(b.dataset.tab); });

  /* Arrivals 거르기 */
  ["aLoc", "aSup", "aBrand", "aFrom", "aTo", "aAll"].forEach(i => { document.getElementById(i).onchange = aRefilter; });
  imsQ("#aSku", aRefilter);
  document.getElementById("aClear").onclick = () => {
    ["aLoc", "aSup", "aBrand", "aSku", "aFrom", "aTo"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("aAll").checked = false;
    aRefilter();
  };

  /* Insights 거르기 */
  document.getElementById("iPer").onchange = () => { document.getElementById("iCustom").hidden = val("iPer") !== "custom"; iLoad(); };
  ["iFrom", "iTo", "iLoc", "iSup", "iBrand", "iSort"].forEach(i => { document.getElementById(i).onchange = iLoad; });
  imsQ("#iSku", iLoad);
  document.getElementById("iClear").onclick = () => {
    ["iLoc", "iSup", "iBrand", "iSku", "iFrom", "iTo"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("iPer").value = "month"; document.getElementById("iCustom").hidden = true;
    document.getElementById("iSort").value = "lost_amount";
    iLoad();
  };

  /* All backorders 거르기 (bo v3a) */
  const endSel = document.getElementById("fEnd");
  document.getElementById("fState").onchange = () => { endSel.hidden = document.getElementById("fState").value === "open"; refilter(); };
  ["fKind","fLoc","fSup","fBrand","fArr","fFrom","fTo","fEnd"].forEach(i => { document.getElementById(i).onchange = refilter; });
  imsQ("#fSku", refilter);
  document.getElementById("fCust").onclick = openCustPick;
  document.getElementById("fClear").onclick = () => {
    ["fKind","fLoc","fSup","fBrand","fSku","fArr","fFrom","fTo","fEnd"].forEach(i => document.getElementById(i).value = "");
    owedOnly = false;
    document.getElementById("fState").value = "open"; endSel.hidden = true;
    custId = null; custName = ""; document.getElementById("fCust").textContent = "All customers";
    refilter();
  };
  /* ?customer=<uuid> · ?sku=ABC 로 들어오면 All 탭에서 그 조건으로(bo v3a 의 링크 모양 그대로) · ?tab=arrivals|insights|all */
  const pc = imsParam("customer"), ps = imsParam("sku");
  let tab = imsParam("tab") || "arrivals";
  if(ps) document.getElementById("fSku").value = ps;
  if(pc){
    const { data } = await sb.from("customer").select("id,name").eq("id", pc).maybeSingle();
    if(data){ custId = data.id; custName = data.name; document.getElementById("fCust").textContent = custName; }
  }
  if((pc || ps) && !imsParam("tab")) tab = "all";
  showTab(tab);
});
</script>
