<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purchase Receipts · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* Local to this screen — shared rules live in ims-ui.css
     (.pobtn · .qin/.tin/.xbtn · .pomodal/.pobox/.frow · #wide/.wfilt · .invbar/.invgrid/.invsub · [hidden]) */
  main{display:flex;flex-direction:column;gap:14px;padding:14px}
  .pobox input,.pobox select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}

  /* ⭐ The numbers that decide whether this receipt is done. They sit on their own
     so nobody has to add the column up by eye. */
  .gap{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px;align-items:baseline}
  .gap .g{display:flex;flex-direction:column;gap:2px}
  .gap .g b{font-family:var(--mono);font-size:17px;font-weight:700}
  .gap .g span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .gap .g.bad b{color:var(--bad)}
  .gap .g.ok b{color:var(--good, #2b8a3e)}

  /* Two stages, because the work is two jobs done by different people at different times:
     counting against the paper, then carrying the boxes to their bins. */
  .stage{display:flex;gap:6px;padding:0 14px 10px}
  .stage button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .stage button.on{background:#eef2ff;border-color:#c7d2fe;font-weight:600}

  .prow{padding:9px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer;font-size:13.5px}
  .prow:hover{background:#f7f9fc}
  .prow.on{background:#eef2ff}

  /* A work row: one line, one bin. Splitting makes a second row, never a second number. */
  .wrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
  .binbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer;font-family:var(--mono)}
  .binbtn.none{color:var(--muted);font-family:inherit;font-style:italic}
  .lastbin{font-size:11.5px;color:var(--muted)}
  .lastbin b{font-family:var(--mono);font-weight:600;color:var(--fg, #222)}
  .binlist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <select id="wsup"><option value="">All suppliers</option></select>
      <select id="wwh"><option value="">All warehouses</option></select>
      <select id="wst">
        <option value="open">Draft &amp; confirmed</option>
        <option value="draft">Draft</option>
        <option value="confirmed">Confirmed</option>
        <option value="cancelled">Cancelled</option>
        <option value="all">All</option>
      </select>
      <input type="date" id="wfrom"><span class="dash">–</span><input type="date" id="wto">
      <input type="search" id="wq" placeholder="Receipt number · PO number · supplier">
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn go" id="wnew">New receipt</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>

<main id="detail" hidden></main>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Receiving — what actually arrived, and where it went.

   The work is two jobs, and this screen keeps them apart because the warehouse does:

     ① Count    The boxes are opened and counted against the paper. Nobody knows yet
                which bin they will end up in, so a counted row carries no bin.
     ② Put away The same boxes are carried to their shelves. Only here does a bin
                appear, and one line can end up in more than one bin — which is why
                a row can be split. Splitting never changes the total; it moves part
                of it to a second row.

   ⭐⭐ [2026-09-29 · rulings 88 · 92 · 99 · 100 · 101] The number that decides anything is the
      CONFIRMED INVOICE: expected = confirmed invoice − what earlier receipts took in
      (po_receipt_detail lines[].expected). A PO with no confirmed invoice cannot be received —
      the office confirms the supplier invoice first, and confirming it splits the order
      (the original number keeps the billed share). More than the invoice arrived = an
      off-invoice item: the warehouse has already put it in ONE bin, and the office decides it
      once — free or billed. There is no «reject»: the goods are already in the building, and a
      return to the supplier is separate work (ruling 99). Old rows (over · off-PO) keep their
      old decisions.

   ⭐ Every calculation lives in the database. This screen never adds quantities up
      on its own: po_receipt_detail is the one place that knows what "counted",
      "allocated" and "remaining" mean. If a number looks wrong, the RPC is wrong.

   ⚠️ Nothing here reaches the ledger yet. Confirming a receipt — which splits the
      order and writes the receipt lines — is the next round.
   ───────────────────────────────────────────────────────────── */

/* ⚠️ Which build is running. The browser's line numbers have not matched the file
   more than once, so the screen says its own version out loud. */
const RCV_BUILD = "2026-09-29 · invoice basis";   // ⑱-3(대화 Claude) — 판정 88 · 92 · 99 · 100 · 101: 기준 = 확정 인보이스 · Off-invoice 결정 둘(거절 없음) · 확정 반환 charges · 새 입고 = 확정 인보이스 있는 PO 만 ← ⑤-6c3 「warehouse state」(off-PO 결정 UI · 딥링크 ?receipt=&diff= · 판정 43 · 44 · 45)
console.log("receiving.html build:", RCV_BUILD);

/* 토론토 날짜 'YYYY-MM-DD' — ⚠️ toISOString().slice(0,10) 은 UTC 날짜다(토론토 저녁 8시 · 겨울 7시 뒤에는 내일 · 2026-09-23 실측 20:09 EDT 에 DB 는 09-24).
   회사의 「오늘」은 토론토다(so-module §13-h · 서버 ims_today()) — 에드먼튼 PC 에서도 토론토 날짜를 쓴다.
   📌 공통 파일(ims-ui.js)이 아니라 화면마다 둔다 — 캐시된 옛 공통 파일과 새 화면이 어긋나면 화면이 죽는다. 다섯 화면이 같은 몸이다(receiving · po · charges · payments · invoices). */
function torontoToday() {
  const p = {};
  new Intl.DateTimeFormat("en-US", { timeZone: "America/Toronto", year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
  return p.year + "-" + p.month + "-" + p.day;
}

let sb=null, me=null, canWrite=false;
let q="", stFilter="open", supFilter="", whFilter="", dateFrom="", dateTo="", curId=null;
let detailSeq = 0;
let stage = "count";          // "count" | "putaway"
let lastBins = {};            // product_id -> { bin_id, bin, zone, received_on }
let curWms = null;            // 오피스 판 1 — wms_recv_state(창고 Complete · 보류) · 머리 줄과 확정 창이 읽는다
let staffNamesR = null;       // wms_recv_state 는 사람 id 만 준다 — 이름은 ims_staff 에서 한 번
let focusDiff = null;         // ⑤-6c3 — WMS Admin 딥링크(?diff=)가 가리키는 차이 줄 · 한 번 짚고 비운다
let curHeader = null;         // ⑤-6c3 — off-PO 결정 창이 PO 통화 · 환율을 찾을 때 쓰는 머리(po_id)
const pgW = imsPage(50);

/* ⭐ Everything the fragments below read is declared up here.
   ⚠️ A value declared below the fragment that uses it freezes the whole detail on
      "Loading…" without an error. They all live above. */
const qty = (v) => (v === null || v === undefined || v === "")
  ? '<span class="dim">—</span>'
  : esc(Number(v).toLocaleString("en-CA", { maximumFractionDigits:3 }));

function stChip(s){
  if(s === "cancelled") return '<span class="chip bad">cancelled</span>';
  if(s === "confirmed") return '<span class="chip good">confirmed</span>';
  return `<span class="chip">${esc(s)}</span>`;
}

/* Measured against what is EXPECTED on this receipt (confirmed invoice − earlier receipts ·
   ruling 88). Short is kept as a difference to settle; over becomes an off-invoice item. */
function diffCell(counted, ordered){
  const c = Number(counted || 0), o = Number(ordered || 0);
  if(c === 0) return '<span class="dim">—</span>';
  if(c > o)  return `<span class="bad">+${qty(c - o)}</span>`;
  if(c < o)  return `<span class="neutral">−${qty(o - c)}</span>`;
  return '<span class="on">✓</span>';
}

/* ⚠️ The RPC hands back warning codes, not sentences — a code on the screen tells the
   person nothing. Anything not listed is shown as it came rather than swallowed. */
const WARN = {
  nothing_counted: "Nothing has been counted yet.",
  open_diffs:      "A difference from this receipt is still waiting for someone to settle it.",
  po_split:        "The order was split — the rest carries on in its own document.",
  po_closed:       "The purchase order is closed.",
  short_receipt:   "Less arrived than the confirmed invoice.",
  over_receipt:    "More arrived than the confirmed invoice — the extra becomes an off-invoice item for the office to decide.",
  off_invoice:     "An off-invoice item was recorded — decide it below (free or billed).",
  ledger_trimmed_to_basis: "Only the invoiced quantity went into stock — the extra waits as an off-invoice item.",
  charge_errors:   "A confirmed charge (freight · duty) could not be added to cost — check it on the Charges screen.",
  received_on_before_baseline: "The received date is before the stock baseline.",
  received_on_in_future: "The received date is in the future.",
  receipt_lines_differ_from_work: "The confirmed lines and the counted rows disagree — tell someone.",
  unassigned_rows: "Some of what was counted has no bin yet — put it away before confirming.",
  over_counted:    "More was counted than the confirmed invoice. The extra must sit in one bin — it is decided as an off-invoice item.",
  short_counted:   "Less was counted than the confirmed invoice. The short line is kept for someone to settle.",
  /* 오피스 판 1(2026-09-28) · 판정 30 — 창고 Complete 전의 확정은 막지 않고 알린다 */
  wms_not_completed: "The warehouse had not marked this receipt complete when it was confirmed — the count could still have been changing."
};
const warnText = (w) => WARN[w] || w;

function modalOpen(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").hidden = false;
}
function modalClose(){
  document.getElementById("modal").hidden = true;
  document.getElementById("modalBox").innerHTML = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") modalClose(); });

/* ⚠️ RPC errors arrive as error.message and already end with "nothing was saved".
   Show that sentence as it is. If the slot is gone, fall back to alert — never swallow it. */
function say(where, cls, text){
  const el = document.getElementById(where);
  if(el){ el.className = cls; el.textContent = text; return; }
  if(cls === "err") alert(text);
}
function docErr(error){
  alert((error && error.message) || "Something went wrong — nothing was saved.");
}

/* ── Two modes ─────────────────────────────────────── */
function showWide(){
  curId = null; detailSeq++;
  document.getElementById("wide").hidden = false;
  document.getElementById("detail").hidden = true;
  loadWide();
}
function openRcv(id){
  curId = id;
  document.getElementById("wide").hidden = true;
  document.getElementById("detail").hidden = false;
  loadDetail(id);
}
async function reload(){
  if(!curId) return;
  const y = window.scrollY;
  await loadDetail(curId);
  window.scrollTo(0, y);
}

/* ── List ──────────────────────────────────────────── */
function baseQuery(){
  let qy = sb.from("po_receipt_list").select("*", { count:"exact" });
  if(stFilter === "open")     qy = qy.in("status", ["draft","confirmed"]);
  else if(stFilter !== "all") qy = qy.eq("status", stFilter);
  if(supFilter) qy = qy.eq("supplier_id", supFilter);
  if(whFilter)  qy = qy.eq("warehouse_id", whFilter);
  if(dateFrom)  qy = qy.gte("received_on", dateFrom);
  if(dateTo)    qy = qy.lte("received_on", dateTo);
  if(q) qy = qy.or(`receipt_number.ilike.%${q}%,po_number.ilike.%${q}%,supplier_name.ilike.%${q}%`);
  return qy.order("received_on", { ascending:false }).order("receipt_number", { ascending:false });
}

async function loadWide(){
  const { data, error } = await pgW.run(baseQuery());
  const box = document.getElementById("wrows");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){
    box.innerHTML = '<div class="msg">No receipts match.</div>';
    pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide); return;
  }
  box.innerHTML = `<table><thead><tr>
      <th>Number</th><th>Received</th><th>PO</th><th>Supplier</th><th>Warehouse</th>
      <th class="num">Lines</th><th class="num">Ordered</th><th class="num">Counted</th>
      <th class="num">To place</th><th>Status</th>
    </tr></thead><tbody>${data.map(r => `<tr data-id="${r.id}">
        <td><span class="mono">${esc(r.receipt_number)}</span></td>
        <td>${dim(r.received_on)}</td>
        <td><span class="mono">${esc(r.po_number || "")}</span></td>
        <td>${esc(r.supplier_name || "")}</td>
        <td>${esc(r.warehouse_name || "")}</td>
        <td class="num">${esc(r.counted_lines)} <span class="dim">/ ${esc(r.po_lines)}</span></td>
        <td class="num">${qty(r.ordered_qty)}</td>
        <td class="num">${qty(r.counted_qty)}</td>
        <td class="num">${Number(r.unassigned_rows) > 0
            ? `<span class="neutral">${qty(Number(r.counted_qty) - Number(r.placed_qty))}</span>`
            : '<span class="dim">0</span>'}</td>
        <td>${stChip(r.status)}${Number(r.open_diffs) > 0
            ? ` <span class="chip bad">${esc(r.open_diffs)} to settle</span>` : ""}</td>
      </tr>`).join("")}</tbody></table>
    <div class="invsub">Counted is what was found in the boxes; placed is what has reached a bin.
      A receipt is finished when the two agree and nothing is left to place. Short counts are normal —
      the rest of the order carries on in its own document. A receipt marked to settle arrived with more
      than the order asked for, or less: that gap is waiting for someone, and until it is closed the
      extra sits in a bin without being in the books.</div>`;
  box.querySelectorAll("tbody tr").forEach(el => { el.onclick = () => openRcv(el.dataset.id); });
  pgW.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

/* ── Detail ────────────────────────────────────────── */
async function loadDetail(id){
  const seq = ++detailSeq;
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  /* 오피스 판 1 · 판정 30 — 창고 쪽 상태(po_receipt_detail 에는 없다)를 함께 읽는다 · 읽기 실패는 줄을 비울 뿐 화면을 막지 않는다 */
  const [r1, r2] = await Promise.all([
    sb.rpc("po_receipt_detail", { p_receipt_id: id }),
    sb.rpc("wms_recv_state",   { p_receipt_id: id }),
  ]);
  const { data, error } = r1;
  curWms = (r2 && !r2.error && r2.data) ? r2.data : null;
  if(curWms && (curWms.completed_by || curWms.reopened_by) && !staffNamesR){
    const st = await sb.from("ims_staff").select("id,name");
    staffNamesR = Object.fromEntries(((st && st.data) || []).map(x => [x.id, x.name]));
  }
  if(seq !== detailSeq) return;
  if(error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(error.message)}</div></div>`; return; }
  if(!data){ box.innerHTML = '<div class="card"><div class="msg">That receipt is gone.</div></div>'; return; }

  const h = data.header, t = data.totals || {}, lines = data.lines || [];
  curHeader = h;
  /* ⭐ Only a draft can be worked on. Once confirmed the quantities have been taken
     into the books and the order has been split against them. */
  const ed = h.status === "draft" && canWrite;
  const toPlace = Number(t.counted || 0) - Number(t.placed || 0);

  /* Last bin is asked for once per render, for every product on the receipt — one
     round trip instead of one per line. ⚠️ Only ims_last_bin knows where it comes
     from; when the ledger arrives its inside changes and this call does not. */
  const pids = [...new Set(lines.map(l => l.product_id).filter(Boolean))];
  if(pids.length){
    const lb = await sb.rpc("ims_last_bin", { p_product_ids: pids, p_warehouse_id: h.warehouse_id });
    if(seq !== detailSeq) return;
    lastBins = (lb && lb.data) || {};
  } else lastBins = {};

  const acts = ['<button class="pobtn" data-act="wide">&lsaquo; All receipts</button>'];
  if(ed) acts.push('<button class="pobtn go" data-act="confirm">Confirm</button>');
  if(ed) acts.push('<button class="pobtn bad" data-act="del">Delete</button>');
  acts.push(`<button class="pobtn" data-act="po">Open ${esc(h.po_number || "PO")}</button>`);

  /* ⚠️ Same two-column key/value table the other document screens use — .kv inside
     .invgrid. Do not invent a shape here; the header must read the same everywhere. */
  const kvTbl = (rows) => `<table class="kv"><tbody>${
    rows.map(x => `<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</tbody></table>`;

  box.innerHTML = `
    <div class="card">
      <div class="invbar">
        <h2 class="mono" style="margin:0">${esc(h.receipt_number)}</h2>
        <span class="chips">${stChip(h.status)}${h.po_status ? `<span class="tag">PO ${esc(h.po_status)}</span>` : ""}</span>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">${acts.join("")}</div>
      <div style="margin-top:10px;font-size:12.5px;color:var(--muted)">
        <span id="headMsg"></span>
      </div>
      <div class="gap">
        <div class="g"><b>${qty(t.ordered)}</b><span>Ordered</span></div>
        <div class="g"><b>${qty(t.counted)}</b><span>Counted</span></div>
        <div class="g ${toPlace > 0 ? "bad" : "ok"}"><b>${qty(toPlace)}</b><span>To place</span></div>
        <div class="g"><b>${esc(t.counted_lines)} / ${esc(t.lines)}</b><span>Lines counted</span></div>
        <div class="g ${Number(t.over_lines) > 0 ? "bad" : ""}"><b>${esc(t.over_lines ?? 0)} / ${esc(t.short_lines ?? 0)}</b><span>Lines over · short of the invoice</span></div>
      </div>
      <div class="invsub"><div class="invgrid">${kvTbl([
        ["SUPPLIER", esc(h.supplier_name || "")],
        ["WAREHOUSE", esc(h.warehouse_name || "")],
        ["RECEIVED ON", dim(h.received_on)]
      ])}${kvTbl([
        ["PURCHASE ORDER", `<span class="mono">${esc(h.po_number || "")}</span>${
          h.po_split_from_number
            ? ` <span class="dim">· split from ${esc(h.po_split_from_number)}</span>` : ""}`],
        ["STARTED BY", `${esc(h.created_by_name || "—")} <span class="dim">${imsTs(h.created_at)}</span>`],
        ["CONFIRMED", h.confirmed_at
          ? `${esc(h.confirmed_by_name || "—")} <span class="dim">${imsTs(h.confirmed_at)}</span>` : "—"],
        ["WAREHOUSE WORK", wmsStateLine(curWms)]   // 위 「WAREHOUSE」 는 창고 이름 · 이 줄은 창고 Complete 상태
      ])}</div></div>
      ${(h.po_split_to || []).length
        ? `<div class="invsub">The rest of this order carries on as ${
            (h.po_split_to || []).map(p =>
              `<a href="po.html?po=${encodeURIComponent(p.po_number)}"><span class="mono">${esc(p.po_number)}</span></a>`
            ).join(" · ")}.</div>` : ""}
      ${(data.warnings || []).length
        ? `<div class="invsub">${(data.warnings || []).map(w => "⚠ " + esc(warnText(w))).join(" · ")}</div>` : ""}
    </div>

    ${h.status === "draft" ? `
    <div class="card">
      <div class="stage">
        <button data-stage="count" class="${stage === "count" ? "on" : ""}">① Count</button>
        <button data-stage="putaway" class="${stage === "putaway" ? "on" : ""}">② Put away</button>
      </div>
      ${stage === "count" ? countTable(lines, ed) : putawayTable(lines, ed)}
    </div>` : receivedTable(data.receipt_lines || [])}
    ${diffsCard(data.diffs || [], canWrite && h.status !== "cancelled")}`;

  /* The difference rows carry ids, not row objects — look the row back up so the dialog
     shows the same numbers the table does, from one source. */
  const diffById = (id) => (data.diffs || []).find(x => x.id === id);
  box.querySelectorAll("[data-frag]").forEach(b => {
    b.onclick = () => openFragments(diffById(b.dataset.frag));
  });
  box.querySelectorAll("[data-settle]").forEach(b => {
    b.onclick = () => openSettle(diffById(b.dataset.settle));
  });
  box.querySelectorAll("[data-reopen]").forEach(b => {
    b.onclick = () => reopenDiff(diffById(b.dataset.reopen));
  });
  box.querySelectorAll("[data-offpo]").forEach(b => {
    b.onclick = () => openOffPo(diffById(b.dataset.offpo));
  });
  box.querySelectorAll("[data-offinv]").forEach(b => {
    b.onclick = () => openOffInv(diffById(b.dataset.offinv));
  });
  /* ⑤-6c3 · 판정 44 — WMS Admin 의 「Decide in Purchase Receipts」 가 ?diff= 로 가리킨 줄을 한 번 짚는다 */
  if(focusDiff){
    const row = box.querySelector(`tr[data-diff="${CSS.escape(focusDiff)}"]`);
    focusDiff = null;
    if(row){
      row.scrollIntoView({ block:"center" });
      row.style.outline = "2px solid #f59e0b"; row.style.background = "#fffbeb";
      const hit = diffById(row.dataset.diff);
      if(hit && hit.kind === "off_po" && !hit.resolved_at && canWrite) openOffPo(hit);
      if(hit && hit.kind === "off_invoice" && !hit.resolved_at && canWrite) openOffInv(hit);   // ⑱-3 판정 88 ⑧
    }
  }

  box.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.act;
      if(a === "wide") showWide();
      if(a === "po")   window.location.href = "po.html?po=" + encodeURIComponent(h.po_number || "");
      if(a === "del")  deleteRcv(h);
      if(a === "confirm") confirmRcv(h, t, toPlace);
    };
  });
  box.querySelectorAll("[data-stage]").forEach(b => {
    b.onclick = () => { stage = b.dataset.stage; reload(); };
  });

  if(h.status !== "draft") return;
  if(stage === "count") wireCount(h, ed); else wirePutaway(h, ed);
}

/* ── Confirm ───────────────────────────────────────────
   The one moment on this screen that reaches the books. The work rows become receipt
   lines, the order loses what arrived, and whatever is still owed carries on as its
   own document with the next letter. None of it can be undone from here.

   ⚠️ The dialog spells out the consequence rather than asking "are you sure" — the
   purchase order number changes, and somebody reading it later needs to know why. */
/* 오피스 판 1 · 판정 30 — the warehouse's own «done»: Complete in the Receiving screen. Confirming before it is
   allowed (the office may know better), but the person should see it before pressing. */
function wmsStateLine(w){
  if(!w) return '<span class="dim">—</span>';
  const nm = (id) => esc((staffNamesR || {})[id] || "—");
  if(w.completed) return `Completed by ${nm(w.completed_by)} <span class="dim">${imsTs(w.completed_at)}</span>`;
  if(w.held) return '<span class="bad">On hold in the warehouse</span>';
  return '<span class="bad">Not marked complete in the warehouse yet</span>' +
    (w.reopened_at ? ` <span class="dim">· reopened by ${nm(w.reopened_by)} ${imsTs(w.reopened_at)}</span>` : "");
}

async function confirmRcv(h, t, toPlace){
  if(toPlace > 0){
    /* The database refuses this too — asking first just saves a round trip and says
       it in the same words. */
    say("headMsg", "err",
      `${qtyPlain(toPlace)} still has no bin. Put it away, or lower the count to what you actually placed.`);
    stage = "putaway"; reload(); return;
  }
  /* ⑱-3 · rulings 88 · 101 — measured against the confirmed invoice. The database counts the lines
     (totals.over_lines · short_lines); this screen does not add quantities up. Confirming no longer
     splits the order — the invoice already did — and the order closes. */
  const lines = [`Confirm ${h.receipt_number}?`, ""];
  lines.push(`${qtyPlain(t.counted)} counted will be received into stock, up to what the confirmed invoice expects.`);
  if(Number(t.short_lines) > 0) lines.push(`${t.short_lines} line(s) short of the invoice — kept as a difference for someone to settle.`);
  if(Number(t.over_lines) > 0) lines.push(`${t.over_lines} line(s) over the invoice — the extra becomes an off-invoice item (it must sit in one bin) for the office to decide.`);
  lines.push(`${h.po_number || "The order"} closes on confirm.`);
  /* 오피스 판 1 · 판정 30 — 막지 않는다 · 말한다 */
  if(curWms && !curWms.completed)
    lines.push("", curWms.held ? "The warehouse has this receipt ON HOLD — the count may still change."
                               : "The warehouse has not marked this receipt complete — the count may still change.");
  lines.push("", "This cannot be undone.");
  if(!confirm(lines.join("\n"))) return;

  say("headMsg", "", "Confirming…");
  const { data, error } = await sb.rpc("po_receipt_confirm", { p_receipt_id: h.id });
  if(error){ say("headMsg", "err", error.message); return; }

  /* ⭐ The order number may have changed under the person's feet. Say so plainly —
     finding out later from a list is worse. */
  const po = data.po || {}, sp = data.split, lg = data.ledger || {};
  const done = [];
  /* ⭐ What actually reached stock comes first — that is the point of confirming.
     The ledger only takes what was ordered, so a heavy delivery leaves part of itself
     off the books, sitting in a bin nobody has accounted for. Say that out loud here;
     the difference queue is the only other place it appears. */
  if(Number(lg.qty_posted) > 0) done.push(`${qtyPlain(lg.qty_posted)} went into stock.`);
  if(Number(lg.qty_excess) > 0)
    done.push(`${qtyPlain(lg.qty_excess)} more than the invoice arrived — it is in the bin as an off-invoice item, not in the books until it is decided below.`);
  if(po.number_before && po.number_after && po.number_before !== po.number_after)
    done.push(`${po.number_before} is now ${po.number_after}.`);
  if(sp && sp.remainder_number) done.push(`${qtyPlain(sp.remainder_qty)} still owed — carried on as ${sp.remainder_number}.`);   // 새 규칙에서는 늘 null(분할은 인보이스 확정) · 옛 모양이 오면 그대로 말한다
  else if(po.status === "closed") done.push(`${po.number_after || ""} is closed.`);
  const offInvRows = ((data.diffs && data.diffs.rows) || []).filter(x => x.kind === "off_invoice").length;
  if(offInvRows) done.push(`${offInvRows} off-invoice item(s) are waiting for a decision below.`);
  else if(data.diffs && (data.diffs.short || data.diffs.over))
    done.push("A difference was queued for someone to settle.");
  /* ⑯ · ruling 94 — confirmed charges (freight · duty) go onto cost at this moment. An error does not undo the receipt. */
  const ch = data.charges || {};
  if((ch.posted || []).length) done.push(`${ch.posted.length} confirmed charge(s) added to cost.`);
  if((ch.errors || []).length) done.push(`${ch.errors.length} charge(s) could not be added to cost — check the Charges screen: `
    + ch.errors.map(e => typeof e === "string" ? e : [e.charge_number, e.error || e.message].filter(Boolean).join(" ") || JSON.stringify(e)).join(" · "));
  if((data.warnings || []).includes("wms_not_completed")) done.push(warnText("wms_not_completed"));
  if(done.length) alert(done.join("\n"));
  reload();
}

/* alert() and confirm() take plain text — the html-escaping formatter would show tags. */
const qtyPlain = (v) => Number(v || 0).toLocaleString("en-CA", { maximumFractionDigits:3 });

/* ── What was actually received ────────────────────────
   After confirming, the work rows stop being the point: these are the lines the
   ledger will read one day. They are shown, not edited. */
function receivedTable(rows){
  if(!rows.length) return '<div class="card"><div class="msg">No receipt lines.</div></div>';
  return `<div class="card">
    <div class="invbar"><h3 style="margin:0">Received</h3></div>
    <table><thead><tr>
      <th class="num">#</th><th>Item</th><th>Bin</th><th class="num">Quantity</th><th>Received</th><th>By</th>
    </tr></thead><tbody>${rows.map(r => `<tr>
      <td class="num dim">${esc(r.line_no)}</td>
      <td><span class="mono">${esc(r.sku || "")}</span></td>
      <td><span class="mono">${esc(r.bin || "")}</span>${
        r.zone ? `<span class="dim" style="margin-left:6px">${esc(r.zone)}</span>` : ""}</td>
      <td class="num">${qty(r.qty_ea)}</td>
      <td>${dim(r.received_on)}</td>
      <td>${esc(r.received_by_name || "—")}</td>
    </tr>`).join("")}</tbody></table>
    <div class="invsub">These lines are the record of what arrived and where it went. They do not change.</div>
  </div>`;
}

/* ── Differences ───────────────────────────────────────
   Short is not the same as wrong — the supplier may simply be shipping in parts. But
   nobody sees WHY unless it is written down, so every gap waits here for a person:
   split shipment, out of stock, lost in transit, or a miscount. */
/* ⭐ Why a reason and not a free note: the whole point of keeping short lines is to tell
   a split shipment apart from a real shortage. Free text cannot be counted, so nobody
   could ever ask «how often did this supplier run out». The list is the database's — if a
   sixth case turns up, it is a migration, not a screen change. */
const SHORT_REASONS = [
  ["split_shipment", "Split shipment \u2014 the rest came on another document"],
  ["out_of_stock",   "Supplier was out of stock \u2014 the rest is not coming"],
  ["lost_damaged",   "Lost or damaged in transit \u2014 claim a credit"],
  ["miscount",       "We counted it wrong"],
  ["other",          "Something else \u2014 say what below"]
];

/* ⭐⭐ An over line asks a different question. Short asks why the goods are missing and
   changes nothing; over asks what the extra is WORTH, and the answer goes into the books.
   Free means nobody paid for it, so costing it like the rest would invent an asset out of
   nothing — the other two end in us paying, one way or the other, so they carry the order's
   own unit cost. That is the gain over the old way: a stock adjustment would have valued
   them at the warehouse average, and goods off the same shipment would end up worth
   different amounts. ⚠️ Returning the extra is not here — it almost never happens (Caleb),
   and a reason nobody picks is still a reason somebody has to keep working. */
const OVER_REASONS = [
  ["free",     "Supplier sent the extra for free \u2014 into stock at no cost"],
  ["billed",   "Supplier will invoice the extra \u2014 cost it like the rest of the order"],
  ["credited", "Supplier will take it off the next order \u2014 cost it like the rest"]
];
/* ⭐ ⑤-6c3 · 판정 43 — an off-PO line is a third question: the item was not on the order at all.
   The warehouse puts it away at once; a manager then decides once — take it (free, or billed at the
   invoice price) or send it back. ⚠️ It has its own function (po_receipt_diff_settle_off_po) — the short
   and over functions refuse it and say so. The list is the database's (po_receipt_diff_resolution_ck). */
const OFFPO_REASONS = [
  ["accepted_free",   "Accepted \u2014 free, into stock at no cost"],
  ["accepted_billed", "Accepted \u2014 billed, into stock at the invoice price"],
  ["rejected",        "Rejected \u2014 set aside and returned to the supplier"]
];
/* ⭐⭐ ⑱-3 · rulings 88 ⑧ · 99 — an off-invoice item (more than the confirmed invoice, or not on the order)
   has TWO decisions, not three: the goods are already on a shelf, so the only question is what they are
   worth. A return to the supplier is separate work (ruling 99). The list is the database's
   (po_receipt_diff_resolution_kind_ck); the function is po_receipt_diff_settle_off_invoice.
   ⚠️ The same words as the old off-PO pair, on purpose — the office reads one vocabulary. */
const OFFINV_REASONS = [
  ["accepted_free",   "Accepted \u2014 free, into stock at no cost"],
  ["accepted_billed", "Accepted \u2014 billed, into stock at the invoice price"]
];
const reasonsFor  = (kind) => kind === "over" ? OVER_REASONS : (kind === "off_po" ? OFFPO_REASONS : (kind === "off_invoice" ? OFFINV_REASONS : SHORT_REASONS));
const reasonLabel = (v) =>
  ([...SHORT_REASONS, ...OVER_REASONS, ...OFFPO_REASONS].find(r => r[0] === v) || [v, v])[1];

/* ── Differences ───────────────────────────────────────
   Short is not the same as wrong — the supplier may simply be shipping in parts. But
   nobody sees WHY unless it is written down, so every gap waits here for a person.

   ⭐ The hard part of that judgement is not on this receipt at all: the order may have
   split, and the rest may already have arrived on the next document. So each row carries
   what the WHOLE order family received — «12 of 12» — and unfolds into the pieces.
   ⚠️ The screen does not add that up. po_family_lines does, because the same sum has to
   come out the same everywhere. */
function diffsCard(rows, ed){
  if(!rows.length) return "";
  const open = rows.filter(r => !r.resolved_at).length;
  return `<div class="card">
    <div class="invbar"><h3 style="margin:0">Differences</h3>
      <span class="chips">${open ? `<span class="chip bad">${open} open</span>` : '<span class="chip good">all settled</span>'}</span></div>
    <table><thead><tr>
      <th class="num">#</th><th>Item</th><th>Kind</th><th class="num">Expected</th>
      <th class="num">Received</th><th class="num">Difference</th><th>The whole order</th><th>Settled</th>
    </tr></thead><tbody>${rows.map(r => {
      const f = r.family || {};
      const whole = f.ordered_total === undefined || f.ordered_total === null
        ? '<span class="dim">—</span>'
        : `${qty(f.received_total)} of ${qty(f.ordered_total)}` +
          (Number(f.still_owed) > 0
            ? ` <span class="bad">· ${qty(f.still_owed)} still owed</span>`
            : ' <span class="on">· all received</span>') +
          ((f.fragments || []).length > 1
            ? ` <button class="pobtn" data-frag="${r.id}">pieces</button>` : "");
      const offpo = r.kind === "off_po";
      const offinv = r.kind === "off_invoice";          // ⑱-3 판정 88 ⑧ — 줄 있음 = 인보이스 초과 · 줄 없음 = 주문에 없는 품목
      /* ⑤-6c3 — an off-PO row says where it sits, because «accepted» puts it into stock in that bin */
      const shelf = !(offpo || offinv) ? "" : (r.placed_at
          ? `<div class="dim" style="font-size:11.5px">on ${esc(r.bin || "?")} · put away by ${esc(r.placed_by_name || "—")} · ${imsTs(r.placed_at)}</div>`
          : `<div class="dim" style="font-size:11.5px">not on a shelf yet \u2014 the warehouse puts it away first</div>`);
      return `<tr data-diff="${esc(r.id)}">
      <td class="num dim">${esc(r.line_no ?? "")}</td>
      <td><span class="mono">${esc(r.sku || "")}</span>${shelf}</td>
      <td><span class="tag">${offpo ? "off-PO" : (offinv ? "off-invoice" : esc(r.kind))}</span></td>
      <td class="num">${qty(r.expected_qty)}</td>
      <td class="num">${qty(r.received_qty)}</td>
      <td class="num">${Number(r.diff_qty) > 0
          ? `<span class="bad">+${qty(r.diff_qty)}</span>`
          : `<span class="neutral">${qty(r.diff_qty)}</span>`}</td>
      <td style="font-size:12.5px">${offpo || (offinv && !r.po_line_id) ? '<span class="dim">not on the order</span>'
          : (offinv ? `<span class="dim">more than the invoice ·</span> ${whole}` : whole)}</td>
      <td>${offpo ? offPoSettledCell(r, ed) : offinv ? offInvSettledCell(r, ed) : r.resolved_at
          ? `${esc(reasonLabel(r.resolution))}
             <div class="dim" style="font-size:11.5px">${esc(r.resolved_by_name || "—")} · ${imsTs(r.resolved_at)}</div>
             ${r.resolution_note ? `<div class="dim" style="font-size:11.5px">${esc(r.resolution_note)}</div>` : ""}
             ${ed && r.kind !== "over"
                 ? `<button class="pobtn" data-reopen="${r.id}">Reopen</button>`
                 : (r.kind === "over" ? '<div class="dim" style="font-size:11.5px">in stock \u2014 cannot be reopened</div>' : "")}`
          : (ed && (r.kind === "short" || r.kind === "over")
              ? `<button class="pobtn go" data-settle="${r.id}">Settle</button>`
              : '<span class="dim">open</span>')}</td>
    </tr>`; }).join("")}</tbody></table>
    <div class="invsub">A short line may just be a split shipment, or it may be a shortage, a loss in
      transit, or a miscount \u2014 the order splitting does not tell them apart, which is why settling one
      asks for the reason. An over line is a different matter: the extra is sitting in the bin but not in
      the books, and settling it puts it there. What it is worth depends on why it came, so that is what
      the dialog asks. ⚠️ Once the extra is in the books an over line cannot be reopened — the ledger
      only ever adds, so undoing it needs an offsetting entry, which does not exist yet.
      An off-PO line was not on the order at all: the warehouse has already put it on a shelf, and
      deciding it either takes it into stock in that bin (free, or at the invoice price) or rejects it,
      in which case the warehouse takes it back off and sets it aside for the supplier.
      ⭐ Since 2026-09-29 an extra is an <b>off-invoice</b> line: more than the confirmed invoice, or not
      on the order at all. It already sits in one bin, and it is decided once — free or billed. There is
      no reject: the goods are in the building, and sending them back is separate work. Off-PO and over
      lines above this date keep their old decisions.</div>
  </div>`;
}

/* ⑤-6c3 — the «Settled» cell of an off-PO row. Accepted cannot be reopened (the ledger only adds);
   a rejection can, until the warehouse has taken it off the shelf. */
function offPoSettledCell(r, ed){
  if(!r.resolved_at){
    return ed ? `<button class="pobtn go" data-offpo="${esc(r.id)}">Decide</button>` : '<span class="dim">waiting for a decision</span>';
  }
  const who = `<div class="dim" style="font-size:11.5px">${esc(r.resolved_by_name || "—")} · ${imsTs(r.resolved_at)}</div>`;
  const note = r.resolution_note ? `<div class="dim" style="font-size:11.5px">${esc(r.resolution_note)}</div>` : "";
  if(String(r.resolution || "").startsWith("accepted")){
    const price = r.resolution === "accepted_billed" && r.unit_price != null ? ` <span class="dim">@ ${esc(Number(r.unit_price))} order currency</span>` : "";
    return `${esc(reasonLabel(r.resolution))}${price}${who}${note}
      <div class="dim" style="font-size:11.5px">in stock \u2014 cannot be reopened</div>`;
  }
  const shelf = r.removed_at
    ? `<div class="dim" style="font-size:11.5px">taken off ${esc(r.bin || "")} by ${esc(r.removed_by_name || "—")} · ${imsTs(r.removed_at)}</div>`
    : (r.bin ? `<div class="bad" style="font-size:11.5px">still on ${esc(r.bin)} \u2014 the warehouse takes it off</div>` : "");
  return `${esc(reasonLabel(r.resolution))}${who}${note}${shelf}
    ${ed && !r.removed_at ? `<button class="pobtn" data-reopen="${esc(r.id)}">Reopen</button>` : ""}`;
}

/* ⭐⭐ ⑤-6c3 · 판정 43 · 44 — deciding an off-PO line. One decision, one function
   (po_receipt_diff_settle_off_po): take it free, take it billed at the invoice price (in the order's
   currency — the database converts with the order's rate), or reject it. Accepting moves stock into the
   bin it already sits in and cannot be undone here; the dialog says so before the button.
   ⚠️ The price preview is only a preview — the database computes the cost that goes into the books. */
async function openOffPo(r){
  if(!r) return;
  const placed = !!r.placed_at;
  let cur = null, rate = null;
  if(curHeader && curHeader.po_id){
    const po = await sb.from("po").select("currency_id,exchange_rate").eq("id", curHeader.po_id).maybeSingle();
    if(po.data){
      rate = po.data.exchange_rate;
      if(po.data.currency_id){
        const c = await sb.from("ref_currency").select("code").eq("id", po.data.currency_id).maybeSingle();
        cur = c.data ? c.data.code : null;
      }
    }
  }
  modalOpen(`
    <h3 style="margin:0 0 4px">Decide an off-PO item</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:10px">
      ${esc(r.sku || "")} · ${qtyPlain(r.received_qty)} not on the order${
        placed ? ` · on <b>${esc(r.bin || "?")}</b> (put away by ${esc(r.placed_by_name || "—")})`
               : " · <b>not on a shelf yet</b>"}</div>
    ${placed ? "" : `<div class="msg" style="margin-bottom:10px">It can only be accepted once it is on a shelf \u2014
      the stock goes into the bin it sits in. It can be rejected now.</div>`}
    <div class="frow"><label>Decision</label>
      <select id="opRes">
        <option value="accepted_billed" ${placed ? "" : "disabled"}>${esc(OFFPO_REASONS[1][1])}</option>
        <option value="accepted_free" ${placed ? "" : "disabled"}>${esc(OFFPO_REASONS[0][1])}</option>
        <option value="rejected" ${placed ? "" : "selected"}>${esc(OFFPO_REASONS[2][1])}</option>
      </select></div>
    <div class="frow" id="opPriceRow"><label>Unit price${cur ? ` (${esc(cur)})` : ""}</label>
      <input id="opPrice" type="number" step="any" min="0" placeholder="from the supplier invoice"></div>
    <div id="opPreview" class="dim" style="font-size:12px;margin:-2px 0 6px"></div>
    <div class="frow"><label>Note</label><input id="opNote" placeholder="optional"></div>
    <div id="opWarn" class="msg" style="margin-top:8px"></div>
    <div id="opMsg" style="font-size:12.5px;margin-top:8px"></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="opGo">Save decision</button></div>`);

  const sel = document.getElementById("opRes"), pr = document.getElementById("opPrice");
  const sync = () => {
    const v = sel.value, billed = v === "accepted_billed";
    document.getElementById("opPriceRow").style.display = billed ? "" : "none";
    const p = Number(pr.value);
    document.getElementById("opPreview").textContent = (billed && p > 0 && rate && Number(rate) !== 1)
      ? `≈ ${p} × ${rate} = ${(p * Number(rate)).toFixed(4)} per unit in the base currency (the database computes the real figure)` : "";
    document.getElementById("opWarn").innerHTML = v === "rejected"
      ? (placed ? `Nothing goes into stock. The warehouse will be told to take ${qtyPlain(r.received_qty)} off <b>${esc(r.bin || "?")}</b> and set it aside for the supplier.`
                : "Nothing goes into stock.")
      : `${qtyPlain(r.received_qty)} go into stock in <b>${esc(r.bin || "?")}</b>${v === "accepted_free" ? " at no cost" : " at the invoice price"}. <b>This cannot be undone here.</b>`;
  };
  sel.onchange = sync; pr.oninput = sync; sync();

  document.getElementById("opGo").onclick = async () => {
    const v = sel.value;
    const price = v === "accepted_billed" ? Number(pr.value) : null;
    if(v === "accepted_billed" && !(price > 0)){ say("opMsg", "err", "Enter the unit price from the supplier invoice (more than 0)."); return; }
    say("opMsg", "", "Saving…");
    const { data, error } = await sb.rpc("po_receipt_diff_settle_off_po", {
      p_diff_id: r.id, p_resolution: v, p_unit_price: price, p_note: document.getElementById("opNote").value || null });
    if(error){ say("opMsg", "err", error.message); return; }
    modalClose();
    /* ⭐ Stock moved (or the warehouse has a job to do) — say so, the row going quiet is not the same as being told. */
    if(data && data.remove_from_bin){
      alert(`Rejected. Tell the warehouse: take ${qtyPlain(data.remove_from_bin.qty)} of ${r.sku || "this item"} off ${data.remove_from_bin.bin} and set it aside for the supplier.`);
    } else if(data && String(data.resolution || v).startsWith("accepted")){
      alert(`${qtyPlain(data.qty_added ?? r.received_qty)} of ${r.sku || "this item"} went into stock in ${data.bin || r.bin || "the bin"}`
        + (data.cost_source === "free" ? " at no cost." : `, costed at ${data.unit_cost} per unit.`));
    }
    reload();
  };
}

/* ⑱-3 · ruling 99 — the «Settled» cell of an off-invoice row. Two decisions, both into stock, and
   neither can be reopened (the ledger only adds) — so there is no Reopen button at all. */
function offInvSettledCell(r, ed){
  if(!r.resolved_at){
    return ed ? `<button class="pobtn go" data-offinv="${esc(r.id)}">Decide</button>` : '<span class="dim">waiting for a decision</span>';
  }
  const who = `<div class="dim" style="font-size:11.5px">${esc(r.resolved_by_name || "—")} · ${imsTs(r.resolved_at)}</div>`;
  const note = r.resolution_note ? `<div class="dim" style="font-size:11.5px">${esc(r.resolution_note)}</div>` : "";
  const price = r.resolution === "accepted_billed" && r.unit_price != null ? ` <span class="dim">@ ${esc(Number(r.unit_price))} order currency</span>` : "";
  return `${esc(reasonLabel(r.resolution))}${price}${who}${note}
    <div class="dim" style="font-size:11.5px">in stock \u2014 cannot be reopened</div>`;
}

/* ⭐⭐ ⑱-3 · rulings 88 ⑧ · 93 ⓓ · 99 — deciding an off-invoice item (po_receipt_diff_settle_off_invoice).
   Quantity = the extra (received − expected). Billed: the unit price may be left empty on a line that is
   on the order — the database takes the last confirmed invoice price of that line, then the order price
   (the answer says which: unit_price_source). An item not on the order has no line, so it needs a price.
   Accepting needs the bin (the stock goes into the bin it sits in) — the database refuses otherwise. */
async function openOffInv(r){
  if(!r) return;
  const placed = !!r.placed_at, onLine = !!r.po_line_id;
  const extra = Number(r.diff_qty != null ? r.diff_qty : (Number(r.received_qty) - Number(r.expected_qty)));
  let cur = null, rate = null;
  if(curHeader && curHeader.po_id){
    const po = await sb.from("po").select("currency_id,exchange_rate").eq("id", curHeader.po_id).maybeSingle();
    if(po.data){
      rate = po.data.exchange_rate;
      if(po.data.currency_id){
        const c = await sb.from("ref_currency").select("code").eq("id", po.data.currency_id).maybeSingle();
        cur = c.data ? c.data.code : null;
      }
    }
  }
  modalOpen(`
    <h3 style="margin:0 0 4px">Decide an off-invoice item</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:10px">
      ${esc(r.sku || "")} · ${onLine
        ? `${qtyPlain(extra)} more than the confirmed invoice (${qtyPlain(r.received_qty)} received · ${qtyPlain(r.expected_qty)} invoiced)`
        : `${qtyPlain(extra)} not on the order`}${
        placed ? ` · on <b>${esc(r.bin || "?")}</b> (put away by ${esc(r.placed_by_name || "—")})`
               : " · <b>not on a shelf yet</b>"}</div>
    ${placed ? "" : `<div class="msg err" style="margin-bottom:10px">It can be decided once it is on a shelf \u2014
      the stock goes into the bin it sits in. The warehouse puts it away first.</div>`}
    <div class="frow"><label>Decision</label>
      <select id="oiRes">
        <option value="accepted_billed">${esc(OFFINV_REASONS[1][1])}</option>
        <option value="accepted_free">${esc(OFFINV_REASONS[0][1])}</option>
      </select></div>
    <div class="frow" id="oiPriceRow"><label>Unit price${cur ? ` (${esc(cur)})` : ""}</label>
      <input id="oiPrice" type="number" step="any" min="0" placeholder="${onLine ? "empty = last confirmed invoice price" : "from the supplier invoice"}"></div>
    <div id="oiPreview" class="dim" style="font-size:12px;margin:-2px 0 6px"></div>
    <div class="frow"><label>Note</label><input id="oiNote" placeholder="optional"></div>
    <div id="oiWarn" class="msg" style="margin-top:8px"></div>
    <div id="oiMsg" style="font-size:12.5px;margin-top:8px"></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="oiGo" ${placed ? "" : "disabled"}>Save decision</button></div>`);

  const sel = document.getElementById("oiRes"), pr = document.getElementById("oiPrice");
  const sync = () => {
    const v = sel.value, billed = v === "accepted_billed";
    document.getElementById("oiPriceRow").style.display = billed ? "" : "none";
    const p = Number(pr.value);
    document.getElementById("oiPreview").textContent = (billed && p > 0 && rate && Number(rate) !== 1)
      ? `≈ ${p} × ${rate} = ${(p * Number(rate)).toFixed(4)} per unit in the base currency (the database computes the real figure)` : "";
    document.getElementById("oiWarn").innerHTML =
      `${qtyPlain(extra)} go into stock in <b>${esc(r.bin || "?")}</b>${v === "accepted_free" ? " at no cost" : " at the invoice price"}. <b>This cannot be undone here.</b>
       <div class="dim" style="font-size:11.5px;margin-top:4px">Sending it back to the supplier is separate work \u2014 not a decision here.</div>`;
  };
  sel.onchange = sync; pr.oninput = sync; sync();

  document.getElementById("oiGo").onclick = async () => {
    const v = sel.value;
    const raw = pr.value.trim();
    const price = v === "accepted_billed" && raw !== "" ? Number(raw) : null;
    if(v === "accepted_billed" && raw !== "" && !(price > 0)){ say("oiMsg", "err", "The unit price must be more than 0 — or leave it empty to use the invoice price."); return; }
    if(v === "accepted_billed" && price === null && !onLine){ say("oiMsg", "err", "This item is not on the order — enter the unit price from the supplier invoice (more than 0)."); return; }
    say("oiMsg", "", "Saving…");
    const { data, error } = await sb.rpc("po_receipt_diff_settle_off_invoice", {
      p_diff_id: r.id, p_resolution: v, p_unit_price: price, p_note: document.getElementById("oiNote").value || null });
    if(error){ say("oiMsg", "err", error.message); return; }
    modalClose();
    /* ⭐ Stock moved — say so, and say where the price came from when the database chose it. */
    const src = { entered:"the price entered", last_confirmed_invoice:"the last confirmed invoice price", po_line:"the order line price" };
    alert(`${qtyPlain(data && data.qty_added != null ? data.qty_added : extra)} of ${r.sku || "this item"} went into stock in ${(data && data.bin) || r.bin || "the bin"}`
      + (data && data.cost_source === "free" ? " at no cost."
         : `, costed at ${data ? data.unit_cost : "?"} per unit${data && data.unit_price_source ? ` (from ${src[data.unit_price_source] || data.unit_price_source})` : ""}.`));
    reload();
  };
}

/* The pieces behind «12 of 12» — which document brought what. Read-only. */
function openFragments(r){
  const f = r.family || {}, frags = f.fragments || [];
  modalOpen(`
    <h3 style="margin:0 0 4px">${esc(r.sku || "")} across the whole order</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:10px">
      ${qty(f.received_total)} received of ${qty(f.ordered_total)} ordered${
        Number(f.still_owed) > 0 ? ` · ${qty(f.still_owed)} still owed` : " · all received"}</div>
    <table><thead><tr><th>Document</th><th>Status</th><th class="num">Ordered</th><th class="num">Received</th></tr></thead>
      <tbody>${frags.map(x => `<tr>
        <td><span class="mono">${esc(x.po_number)}</span></td>
        <td>${esc(x.po_status)}</td>
        <td class="num">${qty(x.ordered)}</td>
        <td class="num">${qty(x.received)}</td>
      </tr>`).join("")}</tbody></table>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Close</button></div>`);
}

/* ⚠️ Settling a SHORT line changes no quantity anywhere — it records a judgement about one
   that already happened, which is why the dialog shows the numbers and asks only for the reason.
   ⭐⭐ Settling an OVER line does the opposite: it moves stock. The extra was left out of the
   books on purpose at confirm time, because nothing should gain a value that nobody chose. So
   this dialog says plainly what is about to happen, and it says it before the button, not after.
   ⚠️ The bin is not touched either way — the goods were put away when they arrived. Only the
   books move. */
function openSettle(r){
  const f = r.family || {};
  const over    = r.kind === "over";
  const extra   = Math.abs(Number(r.diff_qty) || (Number(r.received_qty) - Number(r.expected_qty)));
  const reasons = reasonsFor(r.kind);

  modalOpen(`
    <h3 style="margin:0 0 4px">Settle ${over ? "an over" : "a short"} line</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:10px">
      ${esc(r.sku || "")} · expected ${qty(r.expected_qty)} · received ${qty(r.received_qty)}<br>
      Across the whole order: ${qty(f.received_total)} of ${qty(f.ordered_total)}${
        Number(f.still_owed) > 0 ? ` · ${qty(f.still_owed)} still owed` : " · all received"}</div>
    ${over ? `<div class="msg" style="margin-bottom:10px">${qtyPlain(extra)} more than ordered arrived.
      Settling puts ${qtyPlain(extra)} into stock, in the bin they are already sitting in.
      The reason decides what they are worth. <b>This cannot be undone here.</b></div>` : ""}
    <div class="frow"><label>${over ? "Why the extra came" : "What happened"}</label>
      <select id="stReason">${reasons.map(x =>
        `<option value="${x[0]}">${esc(x[1])}</option>`).join("")}</select></div>
    <div class="frow"><label>Note</label><input id="stNote" placeholder="${
      over ? "optional" : "optional — required for «something else»"}"></div>
    <div id="stMsg" style="font-size:12.5px;margin-top:8px"></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="stGo">${over ? "Put it into stock" : "Settle"}</button></div>`);

  document.getElementById("stGo").onclick = async () => {
    say("stMsg", "", "Saving…");
    const note = document.getElementById("stNote").value || null;
    /* ⚠️ Two functions, not one with a flag: one records a judgement, the other writes to the
       ledger. Each refuses the other's kind and says which one to use instead. */
    const { data, error } = over
      ? await sb.rpc("po_receipt_diff_settle_over", {
          p_diff_id: r.id, p_resolution: document.getElementById("stReason").value, p_note: note })
      : await sb.rpc("po_receipt_diff_resolve", {
          p_diff_id: r.id, p_resolution: document.getElementById("stReason").value, p_note: note });
    if(error){ say("stMsg", "err", error.message); return; }
    modalClose();
    /* ⭐ Stock moved, so say so — the row going quiet is not the same as being told. */
    if(over && data) alert(`${qtyPlain(data.qty_added ?? extra)} went into stock`
      + (data.cost_source === "free" ? " at no cost." : ", costed like the rest of the order."));
    reload();
  };
}

async function reopenDiff(r){
  const why = prompt(`Reopen this line?\n\nIt was settled as «${reasonLabel(r.resolution)}».\nSay why you are reopening it — the old reason is kept in the note.`);
  if(why === null) return;
  const { error } = await sb.rpc("po_receipt_diff_reopen", { p_diff_id: r.id, p_note: why || null });
  if(error){ docErr(error); return; }
  reload();
}

/* ── ① Count ───────────────────────────────────────────
   Every PO line is shown, counted or not — a line with no row yet is exactly the
   line somebody still has to look for in the pallet. The box holds the LINE total
   in eaches, not a scan count: the database keeps one number per line and splits
   it into bins later. */
function countTable(lines, ed){
  return `<table><thead><tr>
      <th class="num">#</th><th>Item</th><th class="num">Ordered</th><th class="num">Invoiced</th>
      <th class="num">Received before</th><th class="num">Expected</th><th class="num">Counted</th><th class="num">Diff</th><th>Rows</th>
    </tr></thead><tbody>${lines.map(l => `<tr>
      <td class="num dim">${esc(l.line_no)}</td>
      <td><span class="mono">${esc(l.sku || "")}</span>
        ${l.supplier_sku ? `<span class="dim" style="font-size:11.5px"> · ${esc(l.supplier_sku)}</span>` : ""}
        <div class="dim" style="font-size:11.5px">${esc(l.product_name || "")}</div></td>
      <td class="num">${qty(l.ordered)}</td>
      <td class="num">${Number(l.invoiced) ? qty(l.invoiced) : '<span class="dim">—</span>'}</td>
      <td class="num">${Number(l.received_before) ? qty(l.received_before) : '<span class="dim">—</span>'}</td>
      <td class="num"><b>${qty(l.expected)}</b></td>
      <td class="num">${ed
          ? `<input class="qin" type="number" step="any" min="0" value="${esc(l.counted)}"
               data-prev="${esc(l.counted)}" data-line="${l.po_line_id}">`
          : qty(l.counted)}</td>
      <td class="num">${diffCell(l.counted, l.expected)}</td>
      <td class="dim" style="font-size:11.5px">${(l.work || []).length
          ? `${(l.work || []).length} row(s) · ${qty(l.allocated)} in bins` : "—"}</td>
    </tr>`).join("")}</tbody></table>
    <div class="invsub">Expected is what this receipt is measured against: the confirmed invoice, less what
      earlier receipts took in. Counting more than expected makes the extra an off-invoice item \u2014 it must
      sit in one bin, and the office decides it free or billed. Setting a count below what is already
      sitting in bins is refused: take it out of the bins first.</div>`;
}

function wireCount(h, ed){
  if(!ed) return;
  document.querySelectorAll("input[data-line]").forEach(inp => {
    inp.onchange = () => saveCount(h.id, inp);
  });
}

async function saveCount(receiptId, inp){
  const prev = inp.dataset.prev, val = Number(inp.value);
  if(!isFinite(val) || inp.value.trim() === ""){ inp.value = prev; return; }
  if(val < 0){ inp.value = prev; say("headMsg", "err", "A count cannot be negative."); return; }
  say("headMsg", "", "Saving…");
  const { error } = await sb.rpc("po_receipt_work_save", {
    p_receipt_id: receiptId, p_po_line_id: inp.dataset.line,
    p_qty_ea: val, p_count_method: "manual"
  });
  /* ⚠️ The refusal sentence is already written for a person — show it whole and put
     the old number back, because nothing was saved. */
  if(error){ inp.value = prev; say("headMsg", "err", error.message); return; }
  inp.dataset.prev = String(val);
  say("headMsg", "on", "Saved");
  reload();
}

/* ── ② Put away ────────────────────────────────────────
   Only lines that were actually counted appear here — there is nothing to carry for
   a line nobody found. Each work row is one bin. The row without a bin is the part
   of the line still standing on the floor. */
function putawayTable(lines, ed){
  const counted = lines.filter(l => Number(l.counted) > 0);
  if(!counted.length) return '<div class="msg">Nothing counted yet — count first.</div>';

  return `<table><thead><tr>
      <th class="num">#</th><th>Item</th><th class="num">Counted</th><th>Rows</th><th class="num">To place</th>
    </tr></thead><tbody>${counted.map(l => {
      const lb = lastBins[l.product_id];
      const left = Number(l.counted || 0) - Number(l.allocated || 0);
      return `<tr>
      <td class="num dim">${esc(l.line_no)}</td>
      <td><span class="mono">${esc(l.sku || "")}</span>
        <div class="dim" style="font-size:11.5px">${esc(l.product_name || "")}</div>
        ${lb ? `<div class="lastbin">Last time: <b>${esc(lb.bin)}</b>
                 <span class="dim">· ${esc(lb.received_on)}</span></div>` : ""}</td>
      <td class="num">${qty(l.counted)}</td>
      <td>${(l.work || []).map(w => `<div class="wrow">
            <span class="mono">${qty(w.qty_ea)}</span>
            <button class="binbtn ${w.bin_id ? "" : "none"}" data-bin="${w.id}"
              data-binid="${w.bin_id || ""}">${w.bin_id ? esc(w.bin) : "choose a bin"}</button>
            ${w.bin_id
              ? `<span class="dim" style="font-size:11.5px">${esc(w.putaway_by_name || "")}</span>`
              : (lb && ed
                  ? `<button class="pobtn" data-last="${w.id}" data-lastbin="${lb.bin_id}"
                       >Use ${esc(lb.bin)}</button>` : "")}
            ${ed && Number(w.qty_ea) > 1
              ? `<button class="pobtn" data-split="${w.id}" data-max="${w.qty_ea}">Split</button>` : ""}
            ${ed && w.bin_id
              ? `<button class="xbtn" data-undo="${w.id}"
                   title="Clear this bin — the quantity goes back to waiting for a place">↩</button>` : ""}
          </div>`).join("") || '<span class="dim">—</span>'}</td>
      <td class="num">${left > 0 ? `<span class="neutral">${qty(left)}</span>` : '<span class="dim">0</span>'}</td>
    </tr>`; }).join("")}</tbody></table>
    <div class="invsub">One row is one bin, and a row that has a bin has been put away — on this screen
      choosing the bin is the act. To spread a line over two bins, split it: the total never changes,
      part of it moves to a second row. Sending a part to a bin that already holds this line merges the
      two rows back into one, and ↩ clears a bin so that quantity is waiting for a place again.</div>`;
}

function wirePutaway(h, ed){
  document.querySelectorAll("[data-bin]").forEach(b => {
    b.onclick = () => { if(ed) openBinPicker(h, b.dataset.bin); };
  });
  if(!ed) return;
  document.querySelectorAll("[data-last]").forEach(b => {
    b.onclick = () => putaway(b.dataset.last, b.dataset.lastbin);
  });
  document.querySelectorAll("[data-split]").forEach(b => {
    b.onclick = () => openSplit(h, b.dataset.split, Number(b.dataset.max));
  });
  document.querySelectorAll("[data-undo]").forEach(b => {
    b.onclick = () => unassign(b.dataset.undo);
  });
}

/* ⭐ Clearing a bin is its own RPC, not a putaway with a flag turned off — the bin has
   to go too, or the row still claims a place it no longer has. If the line already has
   a row waiting for a place, the database merges this quantity into it. */
async function unassign(workId){
  say("headMsg", "", "Saving…");
  const { error } = await sb.rpc("po_receipt_work_unassign", { p_work_id: workId });
  if(error){ say("headMsg", "err", error.message); return; }
  say("headMsg", "on", "Saved");
  reload();
}

async function putaway(workId, binId, done){
  say("headMsg", "", "Saving…");
  const args = { p_work_id: workId, p_done: (done === false ? false : true) };
  /* ⚠️ Taking a row back out keeps its bin — only the "placed" flag drops. The RPC
     needs a bin either way, so send the one the row already has. */
  args.p_bin_id = binId || currentBinOf(workId);
  if(!args.p_bin_id){ say("headMsg", "err", "Pick a bin first."); return; }
  const { error } = await sb.rpc("po_receipt_work_putaway", args);
  if(error){ say("headMsg", "err", error.message); return; }
  modalClose();
  say("headMsg", "on", "Saved");
  reload();
}

/* The row's own bin, read off the button that drew it — the detail is the only
   source, and it was just rendered from the database. */
function currentBinOf(workId){
  const b = document.querySelector(`[data-bin="${workId}"]`);
  return (b && b.dataset.binid) || null;
}

/* ── Bin picker ────────────────────────────────────────
   ⚠️ A warehouse holds well over a thousand bins, which is past the row cap, so the
   list is always a search: the first 300 by name, then whatever the typing matches.
   A scanner types the whole bin name and presses Enter, and that is the fast path. */
function openBinPicker(h, workId){
  modalOpen(`
    <h3 style="margin:0 0 10px">Choose a bin</h3>
    <div class="frow"><input id="binq" placeholder="Scan or type a bin — ${esc(h.warehouse_name || "")}" autofocus></div>
    <div class="binlist" id="binlist"><div class="msg">Loading…</div></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button></div>`);

  const draw = async (term) => {
    let qy = sb.from("ref_bin").select("id,name,zone")
      .eq("warehouse_id", h.warehouse_id).eq("is_active", true);
    if(term) qy = qy.ilike("name", `%${term}%`);
    const { data, error } = await qy.order("name").limit(300);
    const box = document.getElementById("binlist");
    if(!box) return;
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if(!data.length){ box.innerHTML = '<div class="msg">No bin matches.</div>'; return; }
    box.innerHTML = data.map(b => `<div class="prow" data-pick="${b.id}">
        <span class="mono">${esc(b.name)}</span>
        ${b.zone ? `<span class="dim" style="margin-left:8px">${esc(b.zone)}</span>` : ""}
      </div>`).join("") +
      (data.length === 300 ? '<div class="msg dim">First 300 — type more to narrow.</div>' : "");
    box.querySelectorAll("[data-pick]").forEach(el => {
      el.onclick = () => putaway(workId, el.dataset.pick);
    });
  };

  const inp = document.getElementById("binq");
  imsQ("#binq", v => draw(v.trim()));
  /* A scan ends with Enter. If exactly one bin matches what was typed, take it. */
  inp.onkeydown = async (e) => {
    if(e.key !== "Enter") return;
    const term = inp.value.trim();
    if(!term) return;
    const { data } = await sb.from("ref_bin").select("id,name")
      .eq("warehouse_id", h.warehouse_id).eq("is_active", true)
      .ilike("name", term).limit(2);
    if(data && data.length === 1) putaway(workId, data[0].id);
  };
  draw("");
}

/* ── Split ─────────────────────────────────────────────
   ⚠️ The bin is asked for here, not afterwards. A row with no bin is the line's
   leftover and there is only ever one of those — splitting without a bin would
   make a second one. */
function openSplit(h, workId, max){
  modalOpen(`
    <h3 style="margin:0 0 10px">Split this row</h3>
    <div class="dim" style="font-size:12.5px;margin-bottom:10px">
      Move part of the ${esc(max)} to another bin. The rest stays where it is — the line total does not change.</div>
    <div class="frow"><label>Quantity to move</label>
      <input id="spq" type="number" step="any" min="1" max="${esc(max - 1)}" value="1"></div>
    <div class="frow"><label>Bin</label><input id="spb" placeholder="Scan or type a bin"></div>
    <div id="spHits" class="binlist"><div class="msg">Loading…</div></div>
    <div id="spMsg" style="font-size:12.5px;margin-top:8px"></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="spGo">Split</button></div>`);

  let picked = null;
  const hits = document.getElementById("spHits");

  /* ⚠️ The list is there from the moment the box opens — the same as the bin picker.
     Making a person type before anything appears is a different screen for the same
     job, and with no scanner in hand it just looks empty. */
  const drawHits = async (term) => {
    picked = null;
    let qy = sb.from("ref_bin").select("id,name,zone")
      .eq("warehouse_id", h.warehouse_id).eq("is_active", true);
    if(term) qy = qy.ilike("name", `%${term}%`);
    const { data, error } = await qy.order("name").limit(300);
    if(!hits) return;
    if(error){ hits.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if(!data.length){ hits.innerHTML = '<div class="msg">No bin matches.</div>'; return; }
    hits.innerHTML = data.map(b => `<div class="prow" data-pick="${b.id}" data-name="${esc(b.name)}">
        <span class="mono">${esc(b.name)}</span>
        ${b.zone ? `<span class="dim" style="margin-left:8px">${esc(b.zone)}</span>` : ""}
      </div>`).join("") +
      (data.length === 300 ? '<div class="msg dim">First 300 — type more to narrow.</div>' : "");
    hits.querySelectorAll("[data-pick]").forEach(el => {
      el.onclick = () => {
        picked = el.dataset.pick;
        hits.querySelectorAll(".prow").forEach(x => x.classList.remove("on"));
        el.classList.add("on");
        document.getElementById("spb").value = el.dataset.name;
      };
    });
  };
  imsQ("#spb", v => drawHits(v.trim()));
  drawHits("");

  document.getElementById("spGo").onclick = async () => {
    const n = Number(document.getElementById("spq").value);
    if(!isFinite(n) || n <= 0){ say("spMsg", "err", "Enter how many to move."); return; }
    if(!picked){ say("spMsg", "err", "Pick a bin from the list."); return; }
    say("spMsg", "", "Saving…");
    const { error } = await sb.rpc("po_receipt_work_split",
      { p_work_id: workId, p_qty_ea: n, p_bin_id: picked });
    if(error){ say("spMsg", "err", error.message); return; }
    modalClose(); reload();
  };
}

/* ── Delete ────────────────────────────────────────────
   Only a receipt that was never confirmed can go. The RPC is the one that decides —
   this only asks. */
async function deleteRcv(h){
  if(!confirm(`Delete receipt ${h.receipt_number}?\n\nEverything counted on it goes with it. The purchase order is untouched.`)) return;
  const { error } = await sb.rpc("po_receipt_delete", { p_receipt_id: h.id });
  if(error){ docErr(error); return; }
  showWide();
}

/* ── New receipt ───────────────────────────────────────
   A receipt opens against one confirmed order. If that order already has one open,
   the RPC refuses and names it — that sentence is the whole answer, so it is shown
   as it comes. */
async function openCreate(preselectPoId){
  modalOpen(`
    <h3 style="margin:0 0 10px">New receipt</h3>
    <div class="frow"><label>Purchase order</label>
      <input id="npq" placeholder="PO number or supplier" autofocus></div>
    <div id="npHits" class="binlist"><div class="msg">Type to find a confirmed order with a confirmed invoice.</div></div>
    <div class="frow" style="margin-top:10px"><label>Received on</label>
      <input id="npd" type="date" value="${torontoToday()}"></div>
    <div id="npMsg" style="font-size:12.5px;margin-top:8px"></div>
    <div class="frow" style="margin-top:10px"><span class="sp"></span>
      <button class="pobtn" onclick="modalClose()">Cancel</button>
      <button class="pobtn go" id="npGo">Start receiving</button></div>`);

  let picked = preselectPoId || null;
  const hits = document.getElementById("npHits");

  const draw = async (term) => {
    /* ⑱-3 · ruling 92 — an order is received only after the office confirmed its supplier invoice.
       The database refuses the rest too (po_receipt_create) — this list simply does not offer them. */
    let qy = sb.from("po_list").select("id,po_number,supplier_name,status,confirmed_invoiced_qty").eq("status", "confirmed").eq("has_confirmed_invoice", true);
    if(term) qy = qy.or(`po_number.ilike.%${term}%,supplier_name.ilike.%${term}%`);
    const { data, error } = await qy.order("po_number", { ascending:false }).limit(50);
    if(error){ hits.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    if(!data.length){ hits.innerHTML = '<div class="msg">No confirmed order with a confirmed invoice matches. An order without one is received after its invoice is confirmed (Purchase Invoices).</div>'; return; }
    hits.innerHTML = data.map(p => `<div class="prow ${p.id === picked ? "on" : ""}"
        data-pick="${p.id}" data-name="${esc(p.po_number)}">
        <span class="mono">${esc(p.po_number)}</span>
        <span style="margin-left:8px">${esc(p.supplier_name || "")}</span>
        <span class="dim" style="margin-left:8px">invoiced ${qty(p.confirmed_invoiced_qty)}</span></div>`).join("");
    hits.querySelectorAll("[data-pick]").forEach(el => {
      el.onclick = () => {
        picked = el.dataset.pick;
        hits.querySelectorAll(".prow").forEach(x => x.classList.remove("on"));
        el.classList.add("on");
      };
    });
  };

  imsQ("#npq", v => draw(v.trim()));
  draw("");

  document.getElementById("npGo").onclick = async () => {
    if(!picked){ say("npMsg", "err", "Pick a purchase order."); return; }
    say("npMsg", "", "Saving…");
    const { data, error } = await sb.rpc("po_receipt_create", {
      p_po_id: picked, p_received_on: document.getElementById("npd").value || null
    });
    if(error){ say("npMsg", "err", error.message); return; }
    modalClose();
    stage = "count";
    if((data.warnings || []).length) alert("⚠ " + data.warnings.join("\n⚠ "));
    openRcv(data.id);
  };
}

/* ── Start ─────────────────────────────────────────── */
imsAuth.start({ changePw:true, requireScreen:"receiving" }, async (client, meData) => {
  sb = client; me = meData;
  canWrite = imsAuth.canWrite("receiving");
  imsHeader(me);
  document.getElementById("buildTag").textContent = RCV_BUILD;

  const sup = await sb.from("supplier").select("id,name").eq("is_active", true).order("name");
  if(sup.data) document.getElementById("wsup").innerHTML =
    '<option value="">All suppliers</option>' +
    sup.data.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");

  const wh = await sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name");
  if(wh.data) document.getElementById("wwh").innerHTML =
    '<option value="">All warehouses</option>' +
    wh.data.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");

  const refilter = () => { pgW.reset(); loadWide(); };
  document.getElementById("wsup").onchange  = e => { supFilter = e.target.value; refilter(); };
  document.getElementById("wwh").onchange   = e => { whFilter  = e.target.value; refilter(); };
  document.getElementById("wst").onchange   = e => { stFilter  = e.target.value; refilter(); };
  document.getElementById("wfrom").onchange = e => { dateFrom  = e.target.value; refilter(); };
  document.getElementById("wto").onchange   = e => { dateTo    = e.target.value; refilter(); };
  imsQ("#wq", v => { q = v; refilter(); });
  document.getElementById("wclear").onclick = () => {
    q = ""; supFilter = ""; whFilter = ""; dateFrom = ""; dateTo = ""; stFilter = "open";
    ["wq","wsup","wwh","wfrom","wto"].forEach(i => document.getElementById(i).value = "");
    document.getElementById("wst").value = "open";
    refilter();
  };

  /* ⚠️ A read-only person can look at everything and change nothing. The buttons are
     simply not drawn — the database refuses as well, but being refused after pressing
     is a worse way to find out. */
  const nw = document.getElementById("wnew");
  if(canWrite) nw.onclick = () => openCreate(null); else nw.hidden = true;

  /* ?id=… opens one receipt · ?po_id=… starts a new one with that order already picked,
     which is how the purchase order screen hands over. */
  /* ⑤-6c3 · 판정 44 — WMS Admin hands over with ?receipt=…&diff=… (same window); ?id= still works. */
  const wantId = imsParam("id") || imsParam("receipt");
  focusDiff = imsParam("diff") || null;
  if(wantId){ openRcv(wantId); return; }
  const wantPo = imsParam("po_id");
  showWide();
  if(wantPo && canWrite) openCreate(wantPo);
});
</script>
