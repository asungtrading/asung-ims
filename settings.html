<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  nav.tables{width:210px;flex:0 0 210px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:6px;position:sticky;top:70px}
  nav.tables button{display:flex;justify-content:space-between;align-items:center;width:100%;
    border:0;background:none;border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;
    font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  nav.tables button:hover{background:#f2f4f8}
  nav.tables button.cur{background:#eef3ff;color:#3b5bdb}
  nav.tables .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
  nav.tables button.cur .cnt{color:#3b5bdb}
  .bar input[type=search]{width:220px}
  thead th{position:sticky;top:0}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
    font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .pomodal[hidden]{display:none}   /* set v2 — 운송사 고치기 창 */
  .pobox{max-width:560px}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
  /* set v3 — Backorder emails(판정 493 ~ 518 · mail_settings) */
  .mset{display:flex;flex-direction:column}
  .mrow{display:grid;grid-template-columns:200px 1fr;gap:6px 18px;padding:14px 16px;border-top:1px solid var(--line)}
  .mrow:first-child{border-top:0}
  .mrow .lbl{font-weight:600;font-size:13.5px}
  .mrow .lbl .who{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:3px}
  .mrow .ctl{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .mrow .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mrow input[type=text],.mrow input[type=number],.mrow select{border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px}
  .mrow input[type=text]{width:320px;max-width:100%}
  .mrow .note{font-size:12px;color:var(--muted)}
  .mrow .res{font-size:12.5px}
  .whs{display:flex;flex-direction:column;gap:8px}
  .wh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
  .wh .wn{min-width:170px;font-weight:600}
  .wh label{display:inline-flex;gap:4px;align-items:center;font-size:12.5px}
  .bigstate{font-size:15px;font-weight:700}
  .bigstate.on{color:var(--good)} .bigstate.off{color:var(--bad)}
  /* set v4 — Documents(판정 521 ~ 526 · doc-1a · 1b1 · 1b2) */
  .dl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:600}
  .dl input[type=text],.dl input[type=search],.dl textarea,.dl select{font-weight:400}
  .mrow textarea{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;width:100%;max-width:760px}
  .dbrs{display:flex;gap:12px;flex-wrap:wrap}
  .dbr{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:300px}
  .dbr label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
  .dbr input{width:100% !important}
  .dbrh{font-weight:700;font-size:13px}
  .dlogo{max-height:60px;max-width:260px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff}
  .dtabs{display:flex;gap:6px;flex-wrap:wrap}
  .dtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .dtab.cur{background:#eef3ff;border-color:#3b5bdb;color:#3b5bdb}
  table.dver{border-collapse:collapse;font-size:12.5px;max-width:860px}
  table.dver td,table.dver th{padding:6px 8px;border-top:1px solid var(--line);text-align:left}
  table.dver td.dact{display:flex;gap:6px}
  .dbody{font-family:var(--mono);font-size:12px;line-height:1.4;max-width:100% !important}
  .dchk{border-radius:10px;padding:9px 12px;font-size:12.5px;max-width:760px}
  .dchk.ok{background:#ecfdf3;border:1px solid #abefc6} .dchk.bad{background:#fef3f2;border:1px solid #fecdca}
  .dchkh{font-weight:700;margin-bottom:4px} .dchk ul{margin:4px 0 0 18px;padding:0}
  .dtog{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;margin-right:14px}
  @media (max-width:720px){ .mrow{grid-template-columns:1fr} }
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <nav class="tables" id="nav"></nav>
  <main>
    <div class="card">
      <div class="bar">
        <h2 id="tblName">—</h2>
        <span class="pill" id="tblNote"></span>
        <span class="sp"></span>
        <button class="pobtn" id="binLabels" hidden title="Print barcode labels for bins">Print labels…</button>
        <button class="pobtn go" id="addRow" hidden>+ Add carrier</button>
        <label><input type="checkbox" id="onlyActive"> Active only</label>
        <input type="search" id="q" placeholder="Search">
        <span class="range" id="range"></span>
        <button id="prev">←</button>
        <button id="next">→</button>
      </div>
      <div id="body"><div class="msg">Loading…</div></div>
    </div>
  </main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js?v=src1"></script>
<script src="ims-auth.js"></script>
<script src="ims-doc.js"></script>
<script src="ims-label.js?v=3"></script>
<script>
const SET_BUILD = "2026-10-29 · set v12";   // 대화 Claude — QuickBooks 칸(?t=qbo · qbo-1a ~ 1d · 판정 867 ~ 872): EF qbo status(토큰 없음) · Connect / Reconnect(같은 탭으로 Intuit → callback 302 → ?t=qbo&qbo=connected|error&why=) · Check connection(ping) · Disconnect(revoke + 지움) · 고정 회사 비우기(연결 없을 때) · 연락 한 줄(872) · admin 만 단추(870) ← set v11a: 대화 Claude — Caleb 화면 시험: Updated 칸이 이름 없이 「· 2026-10-28」(SQL 로 넣은 시험 값 · updated_by null) → 있는 것만 잇는다 ← set v11: 대화 Claude — fc-2d ④(판정 852 · 857 · asung-wms fc-2a b9d1216 · Caleb 판정 A = Settings 에만): Warehouse Edit 에 시간대(IANA 고르기 · Edmonton = America/Regina 857) · 문 닫는 시각(closes_at · 픽업 창의 끝) · 표에 두 칸 · 새 구역 「Carrier pickups」 — 창고마다 운송사(kind carrier · 켜진 것) 줄: 정기 픽업 · 마감 · 메모 · 누가 언제 · Save · Clear(창구 ref_carrier_pickup_set · 문 master — 화면은 master 만 고친다 · 마감이 문 닫는 시각보다 늦으면 빨강 · DB 도 거부) ← set v10a: 대화 Claude — Caleb 화면 시험: 꺼진 창고에는 Edit 없음 · 연결 상태 글자 색(초록 · 빨강)을 칸에 바로 ← set v10: 대화 Claude — fc-1c ① (판정 835 ~ 848 · asung-wms fc-1a 1157e98 · fc-1b e617671 · fc-1b3 e3a722c · fc-1b4 9da8a0e): Warehouse 표에 Edit — 담당자 · 전화 · 이메일 · Freightcom 계정(TOR · EDM) · 주소는 고치지 않는다(참조 적재가 덮는다) / Carrier 표에 Freightcom names 칸 · Edit 창에서 이름 여럿(창구 ref_carrier_fc_names_set) · Freightcom 이름 목록 자동 완성(EF services) / 왼쪽 목록에 「Shipping quotes」 — 운임 마크업 %(ims_config_set fc_markup_pct · master) · 창고별 Freightcom 연결 상태(EF status) · ?t=freight ← 2026-10-27 · set v9: 대화 Claude — lbl v1(Caleb 2026-10-27): Bin 표에 「Print labels…」 — 칸 이름 그대로 바코드(Code 128) · 창고 · 존(이름 앞 영문) · 검색 · 범위로 골라 한 번에(공용 ims-label.js) ← set v8c: 대화 Claude — manual-7b 이견 6 · Caleb 「운영에서 이미 나간다(켜져 있다)」: Wording & columns 의 안내 글 「Emails with documents arrive in a later version」 이 낡았다(문서 메일은 운영에서 돈다) → 「These are the subject and message of the email that carries this document.」 · 동작 무변 ← 2026-10-25 · set v8b: 대화 Claude — manual-7a 이견 3: Bin 표 안내 글이 개발 글(「2,675 rows — above the 1,000-row cap」)이었다 → 「Thousands of bins — search for the one you need」 · 동작 무변(페이지 나눠 읽기는 그대로) ← 2026-10-25 · set v8a: 대화 Claude — 판정 721 · 722(Caleb 2026-10-25 「화면도 바꾼다」 · 「지금 뺀다」): 화면 글에서 Cin7 을 뺀다 — 원천 표시 cin7 → 「before IMS」(imsSrc) · Source 칸 · Payment Term · Account 안내 글 · 동작 무변 ← 2026-10-24 · set v8: 대화 Claude — drive-3(판정 688 · 692 · 707): Google Drive 칸 — Start date(drive_since · 비면 보관도 없음) · Send to Drive(drive_enabled) · Shared drive id · Queue(drive_status · failed) · 바꾸기 admin 만 · ?t=drive ← 2026-10-23 · set v7a: 대화 Claude — Caleb 「지금 안쓰는 것들은 안보이게 … 숨기면 어떨까?」(A · 화면만 · DB 무변): Documents 판 목록은 쓰는 판 + 판 번호가 가장 높은 둘만 보이고 나머지는 「Show N older versions」 로 접는다(지우지 않는다 · 다섯 문서 탭 같은 규칙 · 탭을 바꾸면 다시 접힌다) ← set v7:   // 대화 Claude — bgr-1a(asung-wms e73c83c · 판정 636): Bin 표에 B-grade 칸 · 줄마다 Mark B-grade / Unmark 단추(창구 ref_bin_bgrade_set · master · 잔고 있는 칸 · 열린 B급 줄이 가리키는 칸은 DB 가 거부 · 거부 글 그대로) · 칸을 직접 update 하지 않는다(가드 트리거 IM636) ← set v6: 대화 Claude — svc-1a(asung-wms 2508980 · 판정 590 · 593 · 596 · 597): Services 탭(ref_service) — 이름 · 단가 · 매출 계정(빈칸 = DB 기본 _153_ Services) · 켜짐 · 메모 · 세금 칸 없음(593 · 오더 세율) · 이름은 만든 뒤 못 바꿈(IM538 · 538) · 단가 · 계정 · 메모 · 켜짐은 Edit 로 · 쓰기 = master(정책) · 지우기 없음 ← set v5b: 대화 Claude — rls-2(판정 568 · 572 ~ 574): 설정 저장 두 곳(Backorder emails mSave · Documents dCfgSave)을 inv_config 직접 update → 창구 ims_config_set(p_key, p_value, p_old) 로 · p_old = 화면이 본 값(다르면 changed_elsewhere · 문단 doc_branches 는 null = 검사 안 함) · 성공 = !error(거부는 전부 error.message · 옛 「.select() 1 행」 분기 뺌) ← set v5a: 대화 Claude — od-1 판정 538: DB 이름 잠금(IM538) 글 · ← set v5: 대화 Claude — fb-0 1번(판정 534 · 538): Brand · Category · Unit · Payment Term · Bin 을 master 쓰기 직원이 만들기 · 끄기 · 켜기 — 이름 바꾸기 없음(538 · 원장 · 세트 단위 · 결제조건 기본값이 이름 글자로 이어져 있다) · 새 행은 source 'manual'(기본값 'cin7' 함정 · fb-0 회신 1번) · 같은 이름(대소문자 무시 · bin 은 창고 안)이 있으면 막는다 · Payment term 은 Net days 필수 · Bin 은 창고 필수 ← set v4a: 대화 Claude — ims-doc v1a(Mustache 를 파일 안에) · 미리 보기 안내 글 「Type the invoice no.」 ← set v4: doc 화면 ①(판정 521 ~ 526 · asung-wms doc-1a 31c39cd · doc-1b1 dc3aa77 · doc-1b2 aedd043): 왼쪽 목록 맨 아래 「Documents」 — 회사 글(이름 · HST · 웹 · 지점 둘 · 약관 · 날짜 꼴) · 로고(doc-brand) = master(판정 525) · 문서 다섯 탭마다 판 목록 · 판 검사 · 새 판 저장 · 이 판 쓰기 = doc_template 열쇠(판정 522) · 실제 문서로 미리 보기(sandbox iframe · ims-doc.js) · 제목 · 칸 켜고 끄기 · 메일 글 = master ← set v3 2026-10-16: 대화 Claude — mail-4b(판정 493 ~ 518 · asung-wms mail-4a): 왼쪽 목록 맨 아래 「Backorder emails」 — 메일 설정 일곱(mail_settings 의 값 · 바꿀 수 있나 · 마지막 고친 사람) · 켜기 · 시험 돌려 보내기 = admin · 보내는 주소 · 이름 · 답장 · 창고마다 요일 · 시각 · 절반 비율 = master · 저장 = inv_config update(guard 가 검사 · 성공 = .select() 1 행) ← set v2 2026-10-13: 대화 Claude — ful-3b(판정 436 · 450): Carrier 표(ref_carrier) — 보기 + master 쓰기 직원은 더하기 · 이름 · Shopify 이름 · 송장 링크 틀 고치기 · 끄기(지우지 않음 — 옛 오더의 이름은 그대로) · 종류(carrier · pickup · delivery)는 만든 뒤 못 바꾼다(옛 오더의 메일 · 송장 뜻이 바뀐다) · 저장 성공 판정 = .select() 1 행 ← set v1(읽기 전용 · 판 글자 없음)
/* ─────────────────────────────────────────────────────────────
   Settings — ref_ 표 보기 (Carrier 만 고치기 — set v2)
   정본: docs/design/po-module.md §3-a · 화면 규칙 §10-j

   ⚠️ 표마다 칸이 다르다 — information_schema 실측(2026-09-15) 기준. 기억으로 쓰지 않는다.
   ⚠️ 캡·검색·색 규칙은 ims-ui.js / ims-ui.css 에 모여 있다.
   ───────────────────────────────────────────────────────────── */

/* 여러 표가 함께 쓰는 칸 — ⚠️ TABLES 보다 먼저 선언해야 한다(const 는 호이스팅되지 않는다) */
const C_ACTIVE = { key:"is_active", label:"Active", bool:1 };
const C_SOURCE = { key:"source",    label:"Source", mono:1, dim:1, get: r => imsSrc(r.source) };   // set v8a — 판정 721

const TABLES = [
  { t:"ref_brand",        label:"Brand",        note:"Product brands", edit:"ref", noun:"brand",   // set v5
    cols:[ C("name","Name") , C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_category",     label:"Category",     note:"Product categories", edit:"ref", noun:"category",   // set v5
    cols:[ C("name","Name"), C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_unit",         label:"Unit",         note:"Units of measure", edit:"ref", noun:"unit",   // set v5
    cols:[ C("name","Name"), C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_currency",     label:"Currency",     note:"Natural key is code",
    search:["code","name"], order:"code",
    cols:[ C("code","Code",{mono:1}), C("name","Name"), C("symbol","Symbol",{mono:1}), C_ACTIVE, C_SOURCE ] },

  { t:"ref_payment_term", label:"Payment Term", note:"Net days is the due date · Disc. days is the early-payment discount window", edit:"ref", noun:"payment term",   // set v5
    cols:[ C("name","Name"), C("net_days","Net days",{num:1}), C("discount_days","Disc. days",{num:1}),
           C("discount_percent","Disc. %",{num:1}), C("is_split","Split",{bool:1}), C_ACTIVE, C_SOURCE ] },

  { t:"ref_account",      label:"Account",      note:"Accounts are referred to by Code",
    search:["code","name"], order:"code",
    cols:[ C("code","Code",{mono:1}), C("name","Name"), C("account_class","Class"),
           C("account_type","Type"), C("for_payments","For payments",{bool:1}), C_ACTIVE ] },

  { t:"ref_warehouse",    label:"Warehouse",    note:"Warehouses — the shipping contact and Freightcom account are used for freight quotes", edit:"warehouse", noAdd:1,   // set v10 — 판정 848 · fc-1a
    cols:[ C("name","Name"), C("city","City"), C("state_province","Province"), C("country","Country"),
           C("contact_name","Contact",{dim:1}), C("phone","Phone",{mono:1,dim:1}), C("freightcom_account","Freightcom",{mono:1}),
           C("timezone","Time zone",{mono:1,dim:1}), { key:"closes_at", label:"Closes", mono:1, get:r => r.closes_at ? String(r.closes_at).slice(0,5) : "" },   // set v11 — 857 · 852
           C("is_default","Default",{bool:1}), C_ACTIVE ] },

  { t:"ref_bin",          label:"Bin",          note:"Thousands of bins — search for the one you need", edit:"ref", noun:"bin",   // set v5
    select:"*, ref_warehouse(name)",
    cols:[ C("name","Name",{mono:1}),
           { key:"warehouse", label:"Warehouse", get:r => r.ref_warehouse ? r.ref_warehouse.name : "" },
           C("zone","Zone"), C("is_staging","Staging",{bool:1}), C("is_bgrade","B-grade",{bool:1}), C_ACTIVE, C_SOURCE ] },   // set v7 — 판정 636

  /* set v2 — 판정 436 · 450: 운송사 — Ship & invoice 에서 고른다 · 종류가 손님 메일 · 송장을 정한다 */
  { t:"ref_carrier",      label:"Carrier",      note:"Picked at Ship & invoice — the kind decides email and tracking",
    edit:"carrier", order:"name", select:"*, ref_carrier_fc_name(name)",   // set v10 — 판정 847
    cols:[ C("name","Name"), { key:"kind", label:"Kind", get:r => KIND_LBL[r.kind] || r.kind },
           C("shopify_company","Shopify name",{dim:1}), { key:"fc_names", label:"Freightcom names", dim:1, get:r => fcNames(r).join(" · ") },
           C("tracking_url_template","Tracking link",{mono:1,dim:1}), C_ACTIVE ] },

  /* set v6 — svc-1a · 판정 590 ~ 597: 서비스 목록(서비스 오더의 비용 줄이 고른다) · 이름 잠금 · 단가 · 계정은 고칠 수 있다 */
  { t:"ref_service",      label:"Service",      note:"Billed on service orders as quantity × unit price — tax follows the order", edit:"service", noun:"service",
    select:"*, ref_account(code,name)",
    cols:[ C("name","Name"), { key:"unit_price", label:"Unit price", num:1, get:r => r.unit_price == null ? "" : Number(r.unit_price).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:4}) },
           { key:"account", label:"Sales account", get:r => r.ref_account ? r.ref_account.code + " " + r.ref_account.name : "" }, C_ACTIVE, C("note","Note",{dim:1}) ] },

  /* set v3 — 판정 493 ~ 518: 백오더 입고 알림 메일 설정(표가 아니라 설정 칸 일곱 — mail_settings) */
  { t:"mail", label:"Backorder emails", note:"Arrival emails to customers — on/off, sender, schedule", custom:"mail", nocount:1 },

  /* set v4 — 판정 521 ~ 526: 문서(인보이스 · 크레딧 노트 · SO · Ship Ready · Internal) — 회사 글 · 판 · 미리 보기 · 문서 글 */
  { t:"docs", label:"Documents", note:"Invoices, credit notes, sales orders — company details, layouts, preview", custom:"docs", nocount:1 },
  { t:"freight", label:"Shipping quotes", note:"Freightcom quotes — customer markup and the connection of each warehouse", custom:"freight", nocount:1 },   // set v10 — 판정 836 · 848
  { t:"pickup", label:"Carrier pickups", note:"Per warehouse — which carriers come on a regular run, and the cutoff for a same-day pickup", custom:"pickup", nocount:1 },   // set v11 — 판정 852
  { t:"drive", label:"Google Drive", note:"Invoices, credit notes and PO documents to the IMS Documents shared drive", custom:"drive", nocount:1 },   // set v8 — drive-3 · 판정 688 · 692 · 707
  { t:"qbo", label:"QuickBooks", note:"The IMS connection to the QuickBooks Online company — connect, check, disconnect", custom:"qbo", nocount:1 },   // set v12 — qbo-1a ~ 1d · 판정 867 ~ 872
];
const KIND_LBL = { carrier: "Carrier — tracking number · shipping email", pickup: "Pickup — customer collects", delivery: "Delivery — our truck" };

function C(key, label, o){ return Object.assign({ key, label }, o||{}); }

let sb=null, cur=TABLES[0], q="", onlyActive=false, counts={}, rows=[];
const pg = imsPage(100);

/* ── 그리기 ───────────────────────────────────────────── */
function drawNav(){
  document.getElementById("nav").innerHTML = TABLES.map((x,i)=>
    `<button data-i="${i}" class="${x===cur?"cur":""}">
       <span>${x.label}</span><span class="cnt">${counts[x.t]==null?"":counts[x.t].toLocaleString()}</span>
     </button>`).join("");
  document.querySelectorAll("nav.tables button").forEach(b=>{
    b.onclick = () => {
      cur = TABLES[+b.dataset.i]; pg.reset(); q="";
      document.getElementById("q").value=""; load();
    };
  });
}

function cellHtml(col, row){
  const v = col.get ? col.get(row) : row[col.key];
  // ⚠️ 색은 is_active 에만 — staging·default·split 은 false 가 정상이다(§10-j 3-e)
  if(col.bool) return yn(v, col.key === "is_active");
  return dim(v);
}

async function load(){
  document.getElementById("tblName").textContent = cur.label;   // ⭐ ref_ 는 화면에 보이지 않는다
  document.getElementById("tblNote").textContent = cur.note || "";
  document.getElementById("binLabels").hidden = cur.t !== "ref_bin";   // set v9 · lbl v1
  ["onlyActive", "q", "range", "prev", "next"].forEach(id => { const el = document.getElementById(id); (el.closest("label") || el).hidden = !!cur.custom; });   // set v3
  if(cur.custom === "mail"){ document.getElementById("addRow").hidden = true; drawNav(); await loadMail(); return; }
  if(cur.custom === "docs"){ document.getElementById("addRow").hidden = true; drawNav(); await loadDocs(); return; }   // set v4
  if(cur.custom === "drive"){ document.getElementById("addRow").hidden = true; drawNav(); await loadDrive(); return; }   // set v8
  if(cur.custom === "freight"){ document.getElementById("addRow").hidden = true; drawNav(); await loadFreight(); return; }   // set v10
  if(cur.custom === "pickup"){ document.getElementById("addRow").hidden = true; drawNav(); await loadPickups(); return; }   // set v11
  if(cur.custom === "qbo"){ document.getElementById("addRow").hidden = true; drawNav(); await loadQbo(); return; }   // set v12
  document.getElementById("addRow").hidden = !(cur.edit && canEdit()) || !!cur.noAdd;   // set v2 · set v10 — 창고는 더하지 않는다
  document.getElementById("addRow").textContent = "+ Add " + (cur.noun || "carrier");   // set v5
  document.getElementById("body").innerHTML = '<div class="msg">Loading…</div>';
  drawNav();

  let qry = sb.from(cur.t).select(cur.select || "*", { count:"exact" });
  if(onlyActive) qry = qry.eq("is_active", true);
  if(q){
    const fields = cur.search || ["name"];
    qry = qry.or(fields.map(f => `${f}.ilike.%${q}%`).join(","));   // ⚠️ 검색은 서버에서
  }
  qry = qry.order(cur.order || "name", { ascending:true });

  const { data, error } = await pg.run(qry);
  if(error){
    document.getElementById("body").innerHTML = `<div class="msg err">Could not load — ${esc(error.message)}</div>`;
    return;
  }
  counts[cur.t] = pg.total; drawNav();
  rows = data || [];   // set v2 — 고치기 창이 읽는다
  const ed = cur.edit && canEdit();

  if(!data.length){
    document.getElementById("body").innerHTML = '<div class="msg">No rows match.</div>';
  } else {
    const head = cur.cols.map(c=>`<th>${c.label}</th>`).join("") + (ed ? "<th></th>" : "");
    const trs = data.map(r =>
      "<tr>" + cur.cols.map(c=>{
        const cls = [c.num?"num":"", c.mono?"mono":"", c.dim?"dim":""].filter(Boolean).join(" ");
        return `<td class="${cls}">${cellHtml(c,r)}</td>`;
      }).join("") + (ed ? (cur.edit === "ref"
        ? `<td style="white-space:nowrap"><button class="pobtn" data-ract="${esc(r.id)}">${r.is_active ? "Switch off" : "Switch on"}</button>${cur.t === "ref_bin" && r.is_active ? ` <button class="pobtn" data-bgr="${esc(r.id)}">${r.is_bgrade ? "Unmark B-grade" : "Mark B-grade"}</button>` : ""}</td>`   // set v5 — 판정 538: 고치기 없음 · 끄기/켜기만 · set v7 — 판정 636: 칸의 B급 표시(활성 칸만)
        : (cur.t === "ref_warehouse" && !r.is_active ? "<td></td>" : `<td><button class="pobtn" data-edit="${esc(r.id)}">Edit</button></td>`)) : "") + "</tr>").join("");   // set v10a — 꺼진 창고는 고치지 않는다
    document.getElementById("body").innerHTML =
      `<table><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table>`;
    document.querySelectorAll("[data-edit]").forEach(b => { b.onclick = () => { const r = rows.find(x => x.id === b.dataset.edit); cur.edit === "service" ? openService(r) : cur.edit === "warehouse" ? openWarehouse(r) : openCarrier(r); }; });   // set v6 · set v10
    document.querySelectorAll("[data-ract]").forEach(b => { b.onclick = () => refToggle(rows.find(x => x.id === b.dataset.ract)); });   // set v5
    document.querySelectorAll("[data-bgr]").forEach(b => { b.onclick = () => bgradeToggle(rows.find(x => x.id === b.dataset.bgr)); });   // set v7
  }

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, load);
}

/* ── set v2 — 운송사 더하기 · 고치기(판정 436 · 450) ──────────
   ⚠️ 종류는 만든 뒤 못 바꾼다 · 끄기 = is_active false(지우지 않는다) · 성공 판정 = .select() 1 행 */
const canEdit = () => imsAuth.canWrite("master");
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
function openCarrier(r){
  const isNew = !r; r = r || { name:"", kind:"carrier", shopify_company:"", tracking_url_template:"", is_active:true };
  document.getElementById("modalBox").innerHTML = `
    <h4>${isNew ? "Add a carrier" : "Edit carrier — " + esc(r.name)}</h4>
    <div class="pbody">
      <div class="frow"><label>Name</label><input id="cName" type="search" autocomplete="off" value="${esc(r.name || "")}" placeholder="e.g. Canpar"></div>
      <div class="frow"><label>Kind</label><select id="cKind" ${isNew ? "" : "disabled"}>
        ${Object.keys(KIND_LBL).map(k => `<option value="${k}" ${k === r.kind ? "selected" : ""}>${esc(KIND_LBL[k])}</option>`).join("")}</select></div>
      ${isNew ? "" : '<div class="hint">The kind cannot change — it decides what old orders did. Switch this one off and add a new one instead.</div>'}
      <div id="cCarrierOnly">
        <div class="frow"><label>Shopify name</label><input id="cShop" type="search" autocomplete="off" value="${esc(r.shopify_company || "")}" placeholder="exactly as in Shopify's carrier list, e.g. Canada Post"></div>
        <div class="hint">Leave empty if Shopify does not know this carrier — the tracking number still goes out, without a link unless you give one below.</div>
        <div class="frow"><label>Tracking link</label><input id="cUrl" type="search" autocomplete="off" value="${esc(r.tracking_url_template || "")}" placeholder="https://…{number}"></div>
        <div class="hint">{number} is replaced by each tracking number. Leave empty when Shopify knows the carrier.</div>
        <div class="frow"><label>Freightcom names</label><textarea id="cFc" rows="3" style="flex:1;border:1px solid var(--line);border-radius:9px;padding:6px 9px;font:inherit;font-size:13px" placeholder="one per line, e.g. Maritime&#10;Maritime-Ontario">${esc(fcNames(r).join("\n"))}</textarea></div>
        <div class="frow"><label></label><input id="cFcPick" type="search" autocomplete="off" list="fcNameList" placeholder="type to find a Freightcom name, then press Add" style="flex:1"> <button class="pobtn" id="cFcAdd">Add</button><datalist id="fcNameList"></datalist></div>
        <div class="hint">The carrier name as Freightcom sends it in quotes — one carrier can have several (case and spaces do not matter). A quote from a carrier with no name here cannot be picked. Each name belongs to one carrier only.</div>
      </div>
      <div class="frow"><label>Active</label><input id="cAct" type="checkbox" style="flex:0" ${r.is_active ? "checked" : ""}> <span>Off = not offered at Ship & invoice (old orders keep the name)</span></div>
      <div id="cMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" id="cCancel">Cancel</button>
      <button class="pobtn go" id="cSave">Save</button>
    </div>`;
  document.getElementById("modal").hidden = false;
  const kindSync = () => { document.getElementById("cCarrierOnly").hidden = document.getElementById("cKind").value !== "carrier"; };
  document.getElementById("cKind").onchange = kindSync; kindSync();
  document.getElementById("cCancel").onclick = modalClose;
  const fcOld = fcNames(r).map(x => x.toLowerCase()).sort().join("|");   // set v10 — 바뀐 것만 창구로
  fcFillList();
  document.getElementById("cFcAdd").onclick = () => {
    const pick = document.getElementById("cFcPick"), ta = document.getElementById("cFc");
    let v = pick.value.trim();
    if(!v) return;
    const canon = (fcNameCache || []).find(x => x.toLowerCase() === v.toLowerCase()); if(canon) v = canon;   // 목록의 글자 그대로
    const have = ta.value.split("\n").map(x => x.trim()).filter(Boolean);
    if(!have.some(x => x.toLowerCase() === v.toLowerCase())) ta.value = have.concat([v]).join("\n");
    pick.value = "";
  };
  document.getElementById("cSave").onclick = async () => {
    const msg = document.getElementById("cMsg"), kind = document.getElementById("cKind").value, name = document.getElementById("cName").value.trim();
    if(!name){ msg.className = "err"; msg.textContent = "Give the carrier a name."; return; }
    const row = { name, is_active: document.getElementById("cAct").checked,
      shopify_company: kind === "carrier" ? (document.getElementById("cShop").value.trim() || null) : null,
      tracking_url_template: kind === "carrier" ? (document.getElementById("cUrl").value.trim() || null) : null };
    if(isNew) row.kind = kind;
    msg.className = ""; msg.textContent = "Saving…";
    const res = isNew ? await sb.from("ref_carrier").insert(row).select("id")
                      : await sb.from("ref_carrier").update(row).eq("id", r.id).select("id");
    if(res.error){ msg.className = "err"; msg.textContent = res.error.message; return; }
    if(!res.data || res.data.length !== 1){ msg.className = "err"; msg.textContent = "Nothing was saved — you may not have the right to change the carrier list."; return; }
    if(kind === "carrier"){   // set v10 — 판정 847: 이름은 창구로(표 직접 쓰기 닫힘)
      const names = document.getElementById("cFc").value.split("\n").map(x => x.trim()).filter(Boolean);
      if(names.map(x => x.toLowerCase()).sort().join("|") !== fcOld){
        const { error } = await sb.rpc("ref_carrier_fc_names_set", { p_carrier_id: res.data[0].id, p_names: names });
        if(error){
          msg.className = "err"; msg.textContent = "The carrier was saved, but the Freightcom names were not — " + error.message;
          document.getElementById("cCancel").textContent = "Close"; document.getElementById("cCancel").onclick = async () => { modalClose(); await load(); };
          return;
        }
      }
    }
    modalClose(); await load();
  };
}

/* ── set v10 — Freightcom 이름 · 창고 연락처 · 마크업(fc-1c ① · 판정 836 · 847 · 848) ──────────
   ⚠️ 운송사 이름은 창구 ref_carrier_fc_names_set(master · 통째 바꿈 · 남의 이름 · 두 번 거부 — 거부 글 그대로)
   ⚠️ 창고는 표 update(RLS master · 성공 = .select() 1 행) · 주소는 고치지 않는다 — 참조 적재(ImsRefLoad ref_warehouse)가 주소 칸을 보낸다(덮인다)
   ⚠️ 이름 자동 완성 = EF freightcom services(문 = sales 또는 fulfillment · 없으면 목록 없이 손으로) */
const fcNames = (r) => (r && Array.isArray(r.ref_carrier_fc_name) ? r.ref_carrier_fc_name.map(x => x.name) : []).sort((a, b) => a.localeCompare(b));
let fcNameCache = null;
async function fcFillList(){
  const dl = document.getElementById("fcNameList"); if(!dl) return;
  if(!fcNameCache){
    try {
      const { data, error } = await sb.functions.invoke("freightcom", { body:{ action:"services" } });
      if(error || !data || !data.ok) return;   // 권한 · 연결이 없으면 손으로 쓴다
      const raw = data.carriers || data.carrier_names || (Array.isArray(data.services) ? data.services.map(x => x.carrier_name) : []);
      fcNameCache = Array.from(new Set((raw || []).map(x => (typeof x === "string" ? x : (x && (x.carrier_name || x.name)) || "").trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b));
    } catch(e){ return; }
  }
  const el = document.getElementById("fcNameList"); if(!el) return;
  el.innerHTML = fcNameCache.map(n => `<option value="${esc(n)}"></option>`).join("");
}

function openWarehouse(r){
  const addr = [r.address_line1, r.address_line2, r.city, r.state_province, r.postal_code, r.country].filter(Boolean).join(", ");
  document.getElementById("modalBox").innerHTML = `
    <h4>Edit warehouse — ${esc(r.name)}</h4>
    <div class="pbody">
      <div class="frow"><label>Address</label><span class="dim">${esc(addr || "—")}</span></div>
      <div class="hint">The address is not edited here — it is kept in step with the reference data load.</div>
      <div class="frow"><label>Contact</label><input id="wWho" type="search" autocomplete="off" value="${esc(r.contact_name || "")}" placeholder="the person carriers call, e.g. Jan Ko"></div>
      <div class="frow"><label>Phone</label><input id="wPhone" type="search" autocomplete="off" value="${esc(r.phone || "")}" placeholder="10 digits, e.g. 416-792-2298"></div>
      <div class="frow"><label>Email</label><input id="wEmail" type="search" autocomplete="off" value="${esc(r.email || "")}" placeholder="e.g. info@asung.ca"></div>
      <div class="hint">Sent to the carrier as the ship-from contact on freight quotes and bookings. A quote is refused without a 10-digit phone.</div>
      <div class="frow"><label>Freightcom account</label><input id="wAcct" type="search" autocomplete="off" value="${esc(r.freightcom_account || "")}" placeholder="e.g. TOR" style="width:120px;text-transform:uppercase"></div>
      <div class="hint">2 – 10 letters or digits. Quotes from this warehouse use the Freightcom account with this key. Empty = no Freightcom quotes from this warehouse.</div>
      <div class="frow"><label>Time zone</label><select id="wTz">${WH_TZ.concat(WH_TZ.some(z => z[0] === r.timezone) || !r.timezone ? [] : [[r.timezone, r.timezone + " (current)"]]).map(z => `<option value="${esc(z[0])}" ${z[0] === (r.timezone || "America/Toronto") ? "selected" : ""}>${esc(z[1])}</option>`).join("")}</select></div>
      <div class="hint">Pickup times and carrier cutoffs at this warehouse are in this time zone. Edmonton uses America/Regina — Alberta stays on UTC-6 all year from Nov 1, 2026.</div>
      <div class="frow"><label>Closes at</label><input id="wClose" type="time" autocomplete="off" value="${esc(r.closes_at ? String(r.closes_at).slice(0,5) : "")}" style="width:130px"></div>
      <div class="hint">When the warehouse closes (24-hour). A booking made after this moves the pickup to the next day, and a pickup window ends here. Empty = not set (booking a pickup asks for an end time).</div>
      <div id="wMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" id="wCancel">Cancel</button>
      <button class="pobtn go" id="wSave">Save</button>
    </div>`;
  document.getElementById("modal").hidden = false;
  document.getElementById("wCancel").onclick = modalClose;
  document.getElementById("wSave").onclick = async () => {
    const msg = document.getElementById("wMsg");
    const phone = document.getElementById("wPhone").value.trim(), email = document.getElementById("wEmail").value.trim();
    const acct = document.getElementById("wAcct").value.trim().toUpperCase();
    const digits = phone.replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
    if(phone && digits.length !== 10){ msg.className = "err"; msg.textContent = "The phone needs 10 digits."; return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.className = "err"; msg.textContent = "That email does not look right."; return; }
    if(acct && !/^[A-Z0-9]{2,10}$/.test(acct)){ msg.className = "err"; msg.textContent = "The Freightcom account is 2 – 10 letters or digits, e.g. TOR."; return; }
    if((r.freightcom_account || "") !== acct && !confirm(acct ? `Use the Freightcom account ${acct} for quotes from ${r.name}?` : `Remove the Freightcom account from ${r.name}?\n\nNo Freightcom quotes can be made from this warehouse until one is set.`)) return;
    const tz = document.getElementById("wTz").value, closes = document.getElementById("wClose").value.trim();   // set v11 — 857 · 852
    if(closes && !/^([01]\d|2[0-3]):[0-5]\d$/.test(closes)){ msg.className = "err"; msg.textContent = "Closes at must be a time like 17:00."; return; }
    if((r.timezone || "America/Toronto") !== tz && !confirm(`Change the time zone of ${r.name} to ${tz}?\n\nPickup times and cutoffs for this warehouse are read in this time zone from now on.`)) return;
    const row = { contact_name: document.getElementById("wWho").value.trim() || null, phone: phone || null, email: email || null, freightcom_account: acct || null, timezone: tz, closes_at: closes || null };
    msg.className = ""; msg.textContent = "Saving…";
    const res = await sb.from("ref_warehouse").update(row).eq("id", r.id).select("id");
    if(res.error){ msg.className = "err"; msg.textContent = res.error.message; return; }
    if(!res.data || res.data.length !== 1){ msg.className = "err"; msg.textContent = "Nothing was saved — you may not have the right to change warehouses."; return; }
    modalClose(); await load();
  };
}

/* set v11 — 857: 고를 수 있는 시간대(IANA) · Edmonton 은 Regina(Alberta 가 2026-11-01 부터 늘 UTC-6 · DB 의 tz 자료는 모른다) · 지금 값이 목록에 없으면 「(current)」 로 더한다 */
const WH_TZ = [
  ["America/Toronto",   "America/Toronto — Ontario (Eastern)"],
  ["America/Regina",    "America/Regina — UTC-6 all year (use for Edmonton / Alberta)"],
  ["America/Winnipeg",  "America/Winnipeg — Manitoba (Central)"],
  ["America/Vancouver", "America/Vancouver — British Columbia (Pacific)"],
  ["America/Halifax",   "America/Halifax — Atlantic"],
];

/* ── set v11 — Carrier pickups(판정 852 · fc-2a ref_carrier_pickup · Caleb 판정 A = Settings 에만) ──────────
   ⚠️ 쓰기 = 창구 ref_carrier_pickup_set(p_carrier_id, p_warehouse_id, p {regular_pickup, cutoff "HH:MM" | "", note, delete}) · 문 = master(또는 그 창고 fulfillment — 화면은 master 만 고친다)
   ⚠️ 행 없음 = 모른다(정기 픽업 없음 · 마감 없음) · 마감은 창고 시간대 · 문 닫는 시각보다 늦으면 DB 가 거부 · Freightcom 이 진짜 마감을 주면 예약은 그것을 먼저 본다
   ⚠️ 운송사 = ref_carrier kind carrier · 켜진 것 · 창고 = 켜진 것 */
async function loadPickups(){
  const body = document.getElementById("body");
  body.innerHTML = '<div class="msg">Loading…</div>';
  const [wh, car, pk, st] = await Promise.all([
    sb.from("ref_warehouse").select("id,name,timezone,closes_at").eq("is_active", true).order("name"),
    sb.from("ref_carrier").select("id,name").eq("kind", "carrier").eq("is_active", true).order("name"),
    sb.from("ref_carrier_pickup").select("carrier_id,warehouse_id,regular_pickup,cutoff,note,updated_at,updated_by"),
    sb.from("ims_staff").select("id,name") ]);
  const err = wh.error || car.error || pk.error;
  if(err){ body.innerHTML = `<div class="msg err">Could not load — ${esc(err.message)}</div>`; return; }
  const ed = canEdit();
  const names = Object.fromEntries(((st && st.data) || []).map(x => [x.id, x.name]));
  const by = {}; (pk.data || []).forEach(x => { by[x.warehouse_id + "|" + x.carrier_id] = x; });
  const hm = (t) => t ? String(t).slice(0, 5) : "";
  const blocks = (wh.data || []).map(w => {
    const close = hm(w.closes_at);
    const trs = (car.data || []).map(c => {
      const x = by[w.id + "|" + c.id], cut = x ? hm(x.cutoff) : "", late = cut && close && cut > close;
      return `<tr data-pw="${esc(w.id)}" data-pc="${esc(c.id)}" data-has="${x ? 1 : 0}">
        <td><b>${esc(c.name)}</b>${x ? "" : ' <span class="dim">not set</span>'}</td>
        <td><label style="display:inline-flex;gap:5px;align-items:center"><input type="checkbox" data-k="reg" ${x && x.regular_pickup ? "checked" : ""} ${ed ? "" : "disabled"}> regular pickup</label></td>
        <td><input type="time" data-k="cut" value="${esc(cut)}" autocomplete="off" ${ed ? "" : "disabled"} style="width:120px${late ? ";border-color:var(--bad);color:var(--bad)" : ""}">${late ? ' <span style="color:var(--bad);font-size:11.5px">after closing</span>' : ""}</td>
        <td><input type="search" data-k="note" value="${esc((x && x.note) || "")}" autocomplete="off" placeholder="e.g. driver around 3 pm" ${ed ? "" : "disabled"} style="width:220px"></td>
        <td class="dim" style="font-size:11.5px">${x ? esc([names[x.updated_by] || "", x.updated_at ? String(x.updated_at).slice(0, 10) : ""].filter(Boolean).join(" · ")) : ""}</td>
        <td style="white-space:nowrap">${ed ? `<button class="pobtn" data-pact="save">Save</button>${x ? ' <button class="pobtn" data-pact="clear">Clear</button>' : ""}` : ""}<span class="res" style="margin-left:6px;font-size:12px"></span></td></tr>`;
    }).join("");

async function pickupSave(tr, act){
  const res = tr.querySelector(".res");

  if(act === "clear"){
    if(!confirm(`Clear the pickup settings of ${cname} at this warehouse?\n\nIt goes back to “not set” — no regular pickup, no cutoff.`)) return;
    p = { delete: true };
  } else {
    const cut = tr.querySelector('[data-k="cut"]').value.trim();
    if(cut && !/^([01]\d|2[0-3]):[0-5]\d$/.test(cut)){ res.className = "res err"; res.textContent = "A time like 16:30."; return; }
    p = { regular_pickup: tr.querySelector('[data-k="reg"]').checked, cutoff: cut, note: tr.querySelector('[data-k="note"]').value.trim() };
  }
  res.className = "res"; res.textContent = "Saving…";
  const { error } = await sb.rpc("ref_carrier_pickup_set", { p_carrier_id: tr.dataset.pc, p_warehouse_id: tr.dataset.pw, p });
  if(error){ res.className = "res err"; res.textContent = error.message; return; }
  await loadPickups();
  const again = document.querySelector(`#body tr[data-pw="${tr.dataset.pw}"][data-pc="${tr.dataset.pc}"] .res`);
  if(again){ again.className = "res on"; again.textContent = act === "clear" ? "Cleared." : "Saved."; }
}

const REF_NAME_HINT = {
  ref_brand:        "It cannot be renamed later — check the spelling first.",
  ref_category:     "It cannot be renamed later — check the spelling first.",
  ref_unit:         "It cannot be renamed later. A set's unit is its pack number — a 12-pack set uses the unit 12.",
  ref_payment_term: "It cannot be renamed later — customers and suppliers show this name.",
  ref_bin:          "It cannot be renamed later — use the spelling on the shelf label, e.g. A090203.",
};
function likeExact(v){ return v.replace(/[\\%_]/g, m => "\\" + m); }   // ilike 를 「대소문자 무시 같음」으로 — 와일드카드 글자를 막는다
function refErr(e){
  if(!e) return "";
  if(e.code === "42501") return "You don't have the right to change this list — it needs the master permission.";
  if(e.code === "IM538") return "Names cannot be changed — switch this one off and add a new one.";   // set v5a — od-1 이름 잠금 트리거
  if(e.code === "23505") return "That name already exists — switch off \"Active only\" and search for it; you can switch it on instead.";
  return e.message;
}
async function openRef(){

  const row = (label, input, hint) => `<div class="frow"><label>${label}</label>${input}</div>${hint ? `<div class="hint">${hint}</div>` : ""}`;

  if(t === "ref_bin") html += row("Warehouse", `<select id="rWh"><option value="">— pick a warehouse —</option>${whs.map(w => `<option value="${esc(w.id)}">${esc(w.name)}</option>`).join("")}</select>`);

  document.getElementById("modalBox").innerHTML = `

    if(!name) return bad("Give it a name.");
    const out = { name, source: "manual", is_active: true, note: document.getElementById("rNote").value.trim() || null };

      const wh = document.getElementById("rWh").value;
      if(!wh) return bad("Pick the warehouse this bin is in.");
      out.warehouse_id = wh; out.is_staging = document.getElementById("rStg").checked;

      if(dp !== "" && !(Number(dp) > 0 && Number(dp) <= 100)) return bad("Discount % must be more than 0 and at most 100.");
      if((dd === "") !== (dp === "")) return bad("Give both the discount days and the discount %, or leave both empty.");
      if(dd !== "" && Number(dd) > Number(net)) return bad("Discount days cannot be longer than Net days.");

    if(t === "ref_bin") dq = dq.eq("warehouse_id", out.warehouse_id);

    modalClose(); q = name; document.getElementById("q").value = name; pg.reset(); await load();
  };
