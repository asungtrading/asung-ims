<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  nav.tables{width:210px;flex:0 0 210px;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:6px;position:sticky;top:70px}
  nav.tables button{display:flex;justify-content:space-between;align-items:center;width:100%;
    border:0;background:none;border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;
    font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  nav.tables button:hover{background:#f2f4f8}
  nav.tables button.cur{background:#eef3ff;color:#3b5bdb}
  nav.tables .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
  nav.tables button.cur .cnt{color:#3b5bdb}
  .bar input[type=search]{width:220px}
  thead th{position:sticky;top:0}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
    font-size:11.5px;color:var(--muted);font-family:var(--mono)}
  .pomodal[hidden]{display:none}   /* set v2 — 운송사 고치기 창 */
  .pobox{max-width:560px}
  .hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <nav class="tables" id="nav"></nav>
  <main>
    <div class="card">
      <div class="bar">
        <h2 id="tblName">—</h2>
        <span class="pill" id="tblNote"></span>
        <span class="sp"></span>
        <button class="pobtn go" id="addRow" hidden>+ Add carrier</button>
        <label><input type="checkbox" id="onlyActive"> Active only</label>
        <input type="search" id="q" placeholder="Search">
        <span class="range" id="range"></span>
        <button id="prev">←</button>
        <button id="next">→</button>
      </div>
      <div id="body"><div class="msg">Loading…</div></div>
    </div>
  </main>
</div>

<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script>
const SET_BUILD = "2026-10-13 · set v2";   // 대화 Claude — ful-3b(판정 436 · 450): Carrier 표(ref_carrier) — 보기 + master 쓰기 직원은 더하기 · 이름 · Shopify 이름 · 송장 링크 틀 고치기 · 끄기(지우지 않음 — 옛 오더의 이름은 그대로) · 종류(carrier · pickup · delivery)는 만든 뒤 못 바꾼다(옛 오더의 메일 · 송장 뜻이 바뀐다) · 저장 성공 판정 = .select() 1 행 ← set v1(읽기 전용 · 판 글자 없음)
/* ─────────────────────────────────────────────────────────────
   Settings — ref_ 표 보기 (Carrier 만 고치기 — set v2)
   정본: docs/design/po-module.md §3-a · 화면 규칙 §10-j

   ⚠️ 표마다 칸이 다르다 — information_schema 실측(2026-09-15) 기준. 기억으로 쓰지 않는다.
   ⚠️ 캡·검색·색 규칙은 ims-ui.js / ims-ui.css 에 모여 있다.
   ───────────────────────────────────────────────────────────── */

/* 여러 표가 함께 쓰는 칸 — ⚠️ TABLES 보다 먼저 선언해야 한다(const 는 호이스팅되지 않는다) */
const C_ACTIVE = { key:"is_active", label:"Active", bool:1 };
const C_SOURCE = { key:"source",    label:"Source", mono:1, dim:1 };

const TABLES = [
  { t:"ref_brand",        label:"Brand",        note:"Product brands",
    cols:[ C("name","Name") , C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_category",     label:"Category",     note:"Product categories",
    cols:[ C("name","Name"), C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_unit",         label:"Unit",         note:"Units of measure",
    cols:[ C("name","Name"), C_ACTIVE, C_SOURCE, C("note","Note",{dim:1}) ] },

  { t:"ref_currency",     label:"Currency",     note:"Natural key is code",
    search:["code","name"], order:"code",
    cols:[ C("code","Code",{mono:1}), C("name","Name"), C("symbol","Symbol",{mono:1}), C_ACTIVE, C_SOURCE ] },

  { t:"ref_payment_term", label:"Payment Term", note:"Cin7 Duration is the discount window, not the due date",
    cols:[ C("name","Name"), C("net_days","Net days",{num:1}), C("discount_days","Disc. days",{num:1}),
           C("discount_percent","Disc. %",{num:1}), C("is_split","Split",{bool:1}), C_ACTIVE ] },

  { t:"ref_account",      label:"Account",      note:"Cin7 refers to accounts by Code",
    search:["code","name"], order:"code",
    cols:[ C("code","Code",{mono:1}), C("name","Name"), C("account_class","Class"),
           C("account_type","Type"), C("for_payments","For payments",{bool:1}), C_ACTIVE ] },

  { t:"ref_warehouse",    label:"Warehouse",    note:"Warehouses",
    cols:[ C("name","Name"), C("city","City"), C("state_province","Province"), C("country","Country"),
           C("is_default","Default",{bool:1}), C_ACTIVE ] },

  { t:"ref_bin",          label:"Bin",          note:"2,675 rows — above the 1,000-row cap",
    select:"*, ref_warehouse(name)",
    cols:[ C("name","Name",{mono:1}),
           { key:"warehouse", label:"Warehouse", get:r => r.ref_warehouse ? r.ref_warehouse.name : "" },
           C("zone","Zone"), C("is_staging","Staging",{bool:1}), C_ACTIVE ] },

  /* set v2 — 판정 436 · 450: 운송사 — Ship & invoice 에서 고른다 · 종류가 손님 메일 · 송장을 정한다 */
  { t:"ref_carrier",      label:"Carrier",      note:"Picked at Ship & invoice — the kind decides email and tracking",
    edit:"carrier", order:"name",
    cols:[ C("name","Name"), { key:"kind", label:"Kind", get:r => KIND_LBL[r.kind] || r.kind },
           C("shopify_company","Shopify name",{dim:1}), C("tracking_url_template","Tracking link",{mono:1,dim:1}), C_ACTIVE ] },
];
const KIND_LBL = { carrier: "Carrier — tracking number · shipping email", pickup: "Pickup — customer collects", delivery: "Delivery — our truck" };

function C(key, label, o){ return Object.assign({ key, label }, o||{}); }

let sb=null, cur=TABLES[0], q="", onlyActive=false, counts={}, rows=[];
const pg = imsPage(100);

/* ── 그리기 ───────────────────────────────────────────── */
function drawNav(){
  document.getElementById("nav").innerHTML = TABLES.map((x,i)=>
    `<button data-i="${i}" class="${x===cur?"cur":""}">
       <span>${x.label}</span><span class="cnt">${counts[x.t]==null?"":counts[x.t].toLocaleString()}</span>
     </button>`).join("");
  document.querySelectorAll("nav.tables button").forEach(b=>{
    b.onclick = () => {
      cur = TABLES[+b.dataset.i]; pg.reset(); q="";
      document.getElementById("q").value=""; load();
    };
  });
}

function cellHtml(col, row){
  const v = col.get ? col.get(row) : row[col.key];
  // ⚠️ 색은 is_active 에만 — staging·default·split 은 false 가 정상이다(§10-j 3-e)
  if(col.bool) return yn(v, col.key === "is_active");
  return dim(v);
}

async function load(){
  document.getElementById("tblName").textContent = cur.label;   // ⭐ ref_ 는 화면에 보이지 않는다
  document.getElementById("tblNote").textContent = cur.note || "";
  document.getElementById("addRow").hidden = !(cur.edit && canEdit());   // set v2
  document.getElementById("body").innerHTML = '<div class="msg">Loading…</div>';
  drawNav();

  let qry = sb.from(cur.t).select(cur.select || "*", { count:"exact" });
  if(onlyActive) qry = qry.eq("is_active", true);
  if(q){
    const fields = cur.search || ["name"];
    qry = qry.or(fields.map(f => `${f}.ilike.%${q}%`).join(","));   // ⚠️ 검색은 서버에서
  }
  qry = qry.order(cur.order || "name", { ascending:true });

  const { data, error } = await pg.run(qry);
  if(error){
    document.getElementById("body").innerHTML = `<div class="msg err">Could not load — ${esc(error.message)}</div>`;
    return;
  }
  counts[cur.t] = pg.total; drawNav();
  rows = data || [];   // set v2 — 고치기 창이 읽는다
  const ed = cur.edit && canEdit();

  if(!data.length){
    document.getElementById("body").innerHTML = '<div class="msg">No rows match.</div>';
  } else {
    const head = cur.cols.map(c=>`<th>${c.label}</th>`).join("") + (ed ? "<th></th>" : "");
    const trs = data.map(r =>
      "<tr>" + cur.cols.map(c=>{
        const cls = [c.num?"num":"", c.mono?"mono":"", c.dim?"dim":""].filter(Boolean).join(" ");
        return `<td class="${cls}">${cellHtml(c,r)}</td>`;
      }).join("") + (ed ? `<td><button class="pobtn" data-edit="${esc(r.id)}">Edit</button></td>` : "") + "</tr>").join("");
    document.getElementById("body").innerHTML =
      `<table><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table>`;
    document.querySelectorAll("[data-edit]").forEach(b => { b.onclick = () => openCarrier(rows.find(x => x.id === b.dataset.edit)); });
  }

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, load);
}

/* ── set v2 — 운송사 더하기 · 고치기(판정 436 · 450) ──────────
   ⚠️ 종류는 만든 뒤 못 바꾼다 · 끄기 = is_active false(지우지 않는다) · 성공 판정 = .select() 1 행 */
const canEdit = () => imsAuth.canWrite("master");
function modalClose(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
function openCarrier(r){
  const isNew = !r; r = r || { name:"", kind:"carrier", shopify_company:"", tracking_url_template:"", is_active:true };
  document.getElementById("modalBox").innerHTML = `
    <h4>${isNew ? "Add a carrier" : "Edit carrier — " + esc(r.name)}</h4>
    <div class="pbody">
      <div class="frow"><label>Name</label><input id="cName" type="search" autocomplete="off" value="${esc(r.name || "")}" placeholder="e.g. Canpar"></div>
      <div class="frow"><label>Kind</label><select id="cKind" ${isNew ? "" : "disabled"}>
        ${Object.keys(KIND_LBL).map(k => `<option value="${k}" ${k === r.kind ? "selected" : ""}>${esc(KIND_LBL[k])}</option>`).join("")}</select></div>
      ${isNew ? "" : '<div class="hint">The kind cannot change — it decides what old orders did. Switch this one off and add a new one instead.</div>'}
      <div id="cCarrierOnly">
        <div class="frow"><label>Shopify name</label><input id="cShop" type="search" autocomplete="off" value="${esc(r.shopify_company || "")}" placeholder="exactly as in Shopify's carrier list, e.g. Canada Post"></div>
        <div class="hint">Leave empty if Shopify does not know this carrier — the tracking number still goes out, without a link unless you give one below.</div>
        <div class="frow"><label>Tracking link</label><input id="cUrl" type="search" autocomplete="off" value="${esc(r.tracking_url_template || "")}" placeholder="https://…{number}"></div>
        <div class="hint">{number} is replaced by each tracking number. Leave empty when Shopify knows the carrier.</div>
      </div>
      <div class="frow"><label>Active</label><input id="cAct" type="checkbox" style="flex:0" ${r.is_active ? "checked" : ""}> <span>Off = not offered at Ship & invoice (old orders keep the name)</span></div>
      <div id="cMsg" style="margin-top:10px;font-size:12.5px"></div>
    </div>
    <div class="pfoot"><span class="sp"></span>
      <button class="pobtn" id="cCancel">Cancel</button>
      <button class="pobtn go" id="cSave">Save</button>
    </div>`;
  document.getElementById("modal").hidden = false;
  const kindSync = () => { document.getElementById("cCarrierOnly").hidden = document.getElementById("cKind").value !== "carrier"; };
  document.getElementById("cKind").onchange = kindSync; kindSync();
  document.getElementById("cCancel").onclick = modalClose;
  document.getElementById("cSave").onclick = async () => {
    const msg = document.getElementById("cMsg"), kind = document.getElementById("cKind").value, name = document.getElementById("cName").value.trim();
    if(!name){ msg.className = "err"; msg.textContent = "Give the carrier a name."; return; }
    const row = { name, is_active: document.getElementById("cAct").checked,
      shopify_company: kind === "carrier" ? (document.getElementById("cShop").value.trim() || null) : null,
      tracking_url_template: kind === "carrier" ? (document.getElementById("cUrl").value.trim() || null) : null };
    if(isNew) row.kind = kind;
    msg.className = ""; msg.textContent = "Saving…";
    const res = isNew ? await sb.from("ref_carrier").insert(row).select("id")
                      : await sb.from("ref_carrier").update(row).eq("id", r.id).select("id");
    if(res.error){ msg.className = "err"; msg.textContent = res.error.message; return; }
    if(!res.data || res.data.length !== 1){ msg.className = "err"; msg.textContent = "Nothing was saved — you may not have the right to change the carrier list."; return; }
    modalClose(); await load();
  };
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client;
  imsHeader(me);
  document.getElementById("buildTag").textContent = SET_BUILD;   // set v2
  document.getElementById("addRow").onclick = () => openCarrier(null);
  if(new URLSearchParams(location.search).get("t") === "carrier") cur = TABLES.find(x => x.t === "ref_carrier");   // set v2 — ?t=carrier
  document.getElementById("onlyActive").onchange = (e) => { onlyActive = e.target.checked; pg.reset(); load(); };
  imsQ("#q", (v) => { q = v; pg.reset(); load(); });
  await load();
});
</script>
</body>
</html>
