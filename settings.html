/* ── set v3 — Backorder emails(판정 493 ~ 518 · mail-1a 의 키 일곱 · mail-4a mail_settings) ──────────
   ⚠️ 판정은 DB 가 한다 — 바꿀 수 있나는 can_edit(admin 키 · master 키 · guard 와 같은 함수) · 값 모양 검사도 guard
   ⚠️ 저장 = 창구 ims_config_set(rls-2 · 판정 572 ~ 574 · 직원은 inv_config 를 읽기만) · old = 화면이 본 값 · 성공 = !error */
const DAYS = [[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"],[7,"Sun"]];
const TZS = [["America/Toronto","Toronto time"],["America/Edmonton","Edmonton time"]];
let mRows = {}, mWh = [];
async function loadMail(){
  const body = document.getElementById("body");
  body.innerHTML = '<div class="msg">Loading…</div>';
  const [st, wh] = await Promise.all([ sb.rpc("mail_settings"), sb.from("ref_warehouse").select("id,name").eq("is_active", true).order("name") ]);
  if(st.error){ body.innerHTML = `<div class="msg err">Could not load — ${esc(st.error.message)}</div>`; return; }
  mRows = {}; (st.data || []).forEach(r => { mRows[r.key] = r; });
  mWh = wh.data || [];
  const R = (k) => mRows[k] || { key: k, value: "", can_edit: false };
  const who = (r) => r.updated_at ? `<span class="who">Changed ${esc(imsTs(r.updated_at))}${r.updated_by_name ? " by " + esc(r.updated_by_name) : ""}</span>` : "";
  const lock = (r) => r.can_edit ? "" : `<span class="note">Only ${r.edit_level === "admin" ? "an admin" : "a manager with the master permission"} can change this.</span>`;
  const en = R("mail_enabled"), red = R("mail_redirect_to"), fr = R("mail_backorder_from"), fn = R("mail_backorder_from_name"), rt = R("mail_backorder_reply_to"), sc = R("mail_backorder_schedule"), pc = R("mail_backorder_min_fill_pct");
  let sched = {}; try{ sched = JSON.parse(sc.value || "{}"); }catch(e){ sched = {}; }
  const on = en.value === "on";
  const txt = (r, id, ph) => `<div class="line"><input type="text" id="${id}" autocomplete="off" placeholder="${esc(ph || "")}" ${r.can_edit ? "" : "disabled"}>${r.can_edit ? `<button class="pobtn" data-save="${esc(r.key)}" data-in="${id}">Save</button>` : ""}<span class="res" id="res_${esc(r.key)}"></span></div>`;
  body.innerHTML = `<div class="mset">
    <div class="mrow"><div class="lbl">Emails${who(en)}</div><div class="ctl">
      <div class="line"><span class="bigstate ${on ? "on" : "off"}">${on ? "On" : "Off"}</span>${en.can_edit ? `<button class="pobtn${on ? "" : " go"}" id="enTog">${on ? "Turn off" : "Turn on"}</button>` : ""}<span class="res" id="res_mail_enabled"></span></div>
      <span class="note">${on ? "Runs start on the scheduled mornings and emails go out." : "No runs start and nothing goes out. Emails that are already waiting stay waiting until this is on."}</span>${lock(en)}</div></div>
    <div class="mrow"><div class="lbl">Test mode — send every email to${who(red)}</div><div class="ctl">
      ${txt(red, "inRed", "empty = real customers")}
      <span class="note">When an address is here, every email goes to it instead of the customer, and the customer's address goes in the subject. Leave it empty for real customers. In the test database it cannot be empty while emails are on, and it must be an @asung.ca address.</span>${lock(red)}</div></div>
    <div class="mrow"><div class="lbl">Sent from${who(fr)}</div><div class="ctl">${txt(fr, "inFrom", "notifications@asung.ca")}<span class="note">The address customers see. It has to be set up in the ims@asung.ca mailbox as a "Send mail as" address, or Gmail refuses it.</span>${lock(fr)}</div></div>
    <div class="mrow"><div class="lbl">Sender name${who(fn)}</div><div class="ctl">${txt(fn, "inName", "Asung Trading")}${lock(fn)}</div></div>
    <div class="mrow"><div class="lbl">Replies go to${who(rt)}</div><div class="ctl">${txt(rt, "inReply", "info@asung.ca")}<span class="note">When a customer presses Reply. Empty = replies go to the "sent from" address.</span>${lock(rt)}</div></div>
    <div class="mrow"><div class="lbl">Schedule${who(sc)}</div><div class="ctl">
      <div class="whs">${mWh.map(w => { const x = sched[w.id]; return `<div class="wh" data-wh="${esc(w.id)}">
        <span class="wn">${esc(w.name)}</span>
        <label><input type="checkbox" class="whOn" ${x ? "checked" : ""} ${sc.can_edit ? "" : "disabled"}> Send for this branch</label>
        ${DAYS.map(([d, l]) => `<label><input type="checkbox" class="whDay" value="${d}" ${x && (x.days || []).includes(d) ? "checked" : ""} ${sc.can_edit ? "" : "disabled"}>${l}</label>`).join("")}
        <select class="whHour" ${sc.can_edit ? "" : "disabled"}>${Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${x && Number(x.hour) === h ? "selected" : (!x && h === 9 ? "selected" : "")}>${((h + 11) % 12) + 1}:00 ${h < 12 ? "AM" : "PM"}</option>`).join("")}</select>
        <select class="whTz" ${sc.can_edit ? "" : "disabled"}>${TZS.map(([z, l]) => `<option value="${z}" ${(x ? x.tz : (/edmonton/i.test(w.name) ? "America/Edmonton" : "America/Toronto")) === z ? "selected" : ""}>${l}</option>`).join("")}</select>
      </div>`; }).join("")}</div>
      <div class="line">${sc.can_edit ? '<button class="pobtn" id="schSave">Save schedule</button>' : ""}<span class="res" id="res_mail_backorder_schedule"></span></div>
      <span class="note">Each branch runs once on each checked morning at that hour in its own time. If the server misses the hour, the run still happens later that day. Holidays are not skipped.</span>${lock(sc)}</div></div>
    <div class="mrow"><div class="lbl">Part of a line that came in${who(pc)}</div><div class="ctl">
      <div class="line"><input type="number" id="inPct" min="1" max="100" step="1" style="width:90px" ${pc.can_edit ? "" : "disabled"}> % or more of the backordered quantity${pc.can_edit ? `<button class="pobtn" data-save="mail_backorder_min_fill_pct" data-in="inPct">Save</button>` : ""}<span class="res" id="res_mail_backorder_min_fill_pct"></span></div>
      <span class="note">When stock comes in (a purchase receipt or a transfer from another branch) and the customer's share is at least this much of the line, they get the email. Stock from returns, adjustments or counts is emailed only when the whole line can ship. Each line is emailed once.</span>${lock(pc)}</div></div>
  </div>`;
  /* 값은 속성이 아니라 DOM 으로(customers 선례 · 따옴표) */
  [["inRed", red], ["inFrom", fr], ["inName", fn], ["inReply", rt], ["inPct", pc]].forEach(([id, r]) => { const el = document.getElementById(id); if(el) el.value = r.value || ""; });
  body.querySelectorAll("[data-save]").forEach(b => { b.onclick = () => mSave(b.dataset.save, document.getElementById(b.dataset.in).value.trim()); });
  const tg = document.getElementById("enTog");
  if(tg) tg.onclick = () => {
    const goingOn = !on;
    const warn = goingOn
      ? ((red.value || "").trim() ? `Turn emails on? Test mode is set, so every email goes to ${red.value.trim()}.` : "Turn emails on? Real customers will get emails from the next scheduled morning.")
      : "Turn emails off? No runs will start until they are turned on again.";
    if(!confirm(warn)) return;
    mSave("mail_enabled", goingOn ? "on" : "off");
  };
  const ss = document.getElementById("schSave");
  if(ss) ss.onclick = () => {
    const out = {};
    let bad = "";
    body.querySelectorAll("[data-wh]").forEach(row => {
      if(!row.querySelector(".whOn").checked) return;
      const days = [...row.querySelectorAll(".whDay:checked")].map(x => Number(x.value));
      if(!days.length) bad = "Pick at least one day for each branch that sends — or untick \u201cSend for this branch\u201d.";
      out[row.dataset.wh] = { tz: row.querySelector(".whTz").value, days, hour: Number(row.querySelector(".whHour").value) };
    });
    if(bad){ const r = document.getElementById("res_mail_backorder_schedule"); r.className = "res err"; r.textContent = bad; return; }
    mSave("mail_backorder_schedule", JSON.stringify(out));
  };
}
async function mSave(key, value){
  const res = document.getElementById("res_" + key);
  if(res){ res.className = "res"; res.textContent = "Saving…"; }
  const old = mRows[key] ? (mRows[key].value ?? null) : null;   // set v5b — 화면이 본 값(그 사이 바뀌면 창구가 거부)
  const { error } = await sb.rpc("ims_config_set", { p_key: key, p_value: value, p_old: old });
  if(error){ if(res){ res.className = "res err"; res.textContent = error.message; } return; }
  await loadMail();
  const r2 = document.getElementById("res_" + key);
  if(r2){ r2.className = "res on"; r2.textContent = "Saved."; }
}

/* ── set v4 — Documents(판정 521 ~ 526 · doc-1a 31c39cd · doc-1b1 dc3aa77 · doc-1b2 aedd043) ──────────
   ⚠️ 판정은 DB 가 한다 — 판 올리기 · 쓰기 = doc_config().can_publish(판정 522 · ims_can_doc_template) · 글 고치기 = can_edit_text(판정 525 · master)
   ⚠️ 판 검사의 정본은 doc_template_upload(p_commit false) — 화면은 결과를 그리기만 한다
   ⚠️ 회사 글 = 창구 ims_config_set(rls-2 · 값 검사는 guard 그대로 · old = 화면이 본 값) · 문서 글 = rpc doc_setting_set
   ⚠️ 미리 보기는 sandbox iframe(ims-doc.js) — 판의 스크립트는 돌지 않는다 */
const DOC_DATE_FMTS = ["DDMONYYYY", "DD Mon YYYY", "YYYY-MM-DD", "MM/DD/YYYY", "DD/MM/YYYY", "Mon DD, YYYY"];
const DOC_REF_LBL = { final_invoice: "Invoice no.", internal_receipt: "Invoice no.", ship_ready: "Invoice no. (sample)", credit_note: "Credit note no.", sales_order: "SO no." };
let dCfg = null, dKind = "final_invoice", dVers = [], dDraft = "", dDraftNote = "", dCheck = null, dPrevRef = "";
let dVerAll = false;   // set v7a — 옛 판 펼침(탭을 바꾸면 다시 접힌다)

async function loadDocs(){
  const body = document.getElementById("body");
  body.innerHTML = '<div class="msg">Loading…</div>';
  const [cf, vl] = await Promise.all([ sb.rpc("doc_config"), sb.rpc("doc_template_list", { p_kind: null }) ]);
  if(cf.error){ body.innerHTML = `<div class="msg err">Could not load — ${esc(cf.error.message)}</div>`; return; }
  if(vl.error){ body.innerHTML = `<div class="msg err">Could not load the layout versions — ${esc(vl.error.message)}</div>`; return; }
  dCfg = cf.data || {}; dVers = vl.data || [];
  const ed = !!dCfg.can_edit_text, pub = !!dCfg.can_publish;
  const co = dCfg.company || {};
  const brs = Array.isArray(dCfg.branches) ? dCfg.branches : [];
  const br = (code) => brs.find(b => b.code === code) || { code, label: code === "TOR" ? "Toronto" : "Edmonton", line1: "", line2: "", phone: "", email: "" };
  const dis = ed ? "" : "disabled";
  const logoUrl = co.logo_path ? `${dCfg.public_base_url || ""}/storage/v1/object/public/doc-brand/${encodeURI(co.logo_path)}` : "";
  const brBox = (b) => `<div class="dbr" data-br="${esc(b.code)}">
      <div class="dbrh">${esc(b.code === "TOR" ? "Toronto" : "Edmonton")}</div>
      <label>Label <input type="text" class="bLabel" autocomplete="off" ${dis}></label>
      <label>Street <input type="text" class="bLine1" autocomplete="off" ${dis}></label>
      <label>City · province · postal <input type="text" class="bLine2" autocomplete="off" ${dis}></label>
      <label>Phone <input type="text" class="bPhone" autocomplete="off" ${dis}></label>
      <label>Email <input type="text" class="bEmail" autocomplete="off" ${dis}></label>
    </div>`;
  body.innerHTML = `<div class="mset">
    <div class="mrow"><div class="lbl">Company — on every document<span class="who">${ed ? "You can change these." : "Only an admin, a supervisor or someone with the master permission can change these."}</span></div><div class="ctl">
      <div class="line"><label class="dl">Name <input type="text" id="dcName" autocomplete="off" ${dis}></label></div>
      <div class="line"><label class="dl">HST no. <input type="text" id="dcHst" autocomplete="off" ${dis}></label><label class="dl">Website <input type="text" id="dcWeb" autocomplete="off" ${dis}></label></div>
      <div class="dbrs">${brBox(br("TOR"))}${brBox(br("EDM"))}</div>
      <span class="note">Both branches print at the top of every document. A branch with no street is left out.</span>
      <label class="dl">Terms &amp; conditions <textarea id="dcTerms" rows="5" ${dis}></textarea></label>
      <div class="line"><label class="dl">Date format <select id="dcDate" ${dis}>${DOC_DATE_FMTS.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select></label></div>
      <div class="line">${ed ? '<button class="pobtn go" id="dcSave">Save company details</button>' : ""}<span class="res" id="res_dc"></span></div>
    </div></div>
    <div class="mrow"><div class="lbl">Logo<span class="who">PNG or JPEG · up to 2 MB</span></div><div class="ctl">
      <div class="line">${logoUrl ? `<img class="dlogo" src="${esc(logoUrl)}" alt="Current logo">` : '<span class="note">No logo — the company name prints instead.</span>'}</div>
      ${ed ? `<div class="line"><input type="file" id="dcLogo" accept="image/png,image/jpeg"><button class="pobtn" id="dcLogoUp">Upload logo</button>${co.logo_path ? '<button class="pobtn" id="dcLogoOff">Remove logo</button>' : ""}<span class="res" id="res_logo"></span></div>` : ""}
    </div></div>
    <div class="mrow"><div class="lbl">Document</div><div class="ctl">
      <div class="dtabs">${imsDoc.KINDS.map(k => `<button class="dtab${k === dKind ? " cur" : ""}" data-kind="${k}">${esc(imsDoc.KIND_LBL[k])}</button>`).join("")}</div>
    </div></div>
    <div id="dKindBox"></div>
  </div>`;
  /* 값은 속성이 아니라 DOM 으로(따옴표 · set v3 선례) */
  const setv = (id, v) => { const el = document.getElementById(id); if(el) el.value = v == null ? "" : v; };
  setv("dcName", co.name); setv("dcHst", co.hst); setv("dcWeb", co.website); setv("dcTerms", co.terms); setv("dcDate", dCfg.date_format || "DDMONYYYY");
  body.querySelectorAll("[data-br]").forEach(box => { const b = br(box.dataset.br);
    box.querySelector(".bLabel").value = b.label || ""; box.querySelector(".bLine1").value = b.line1 || ""; box.querySelector(".bLine2").value = b.line2 || "";
    box.querySelector(".bPhone").value = b.phone || ""; box.querySelector(".bEmail").value = b.email || ""; });
  const sv = document.getElementById("dcSave"); if(sv) sv.onclick = () => dSaveCompany(co, brs);
  const lu = document.getElementById("dcLogoUp"); if(lu) lu.onclick = dUploadLogo;
  const lo = document.getElementById("dcLogoOff"); if(lo) lo.onclick = async () => { if(!confirm("Remove the logo? Documents will print the company name instead.")) return; const ok = await dCfgSave("doc_logo_path", "", "res_logo", co.logo_path ?? null); if(ok) await loadDocs(); };
  body.querySelectorAll("[data-kind]").forEach(b => { b.onclick = () => { if(dKind !== b.dataset.kind){ dKind = b.dataset.kind; dDraft = ""; dDraftNote = ""; dCheck = null; dVerAll = false; } loadDocs(); }; });
  drawKind();
}

async function dCfgSave(key, value, resId, old){
  const res = document.getElementById(resId);
  const { error } = await sb.rpc("ims_config_set", { p_key: key, p_value: value, p_old: old === undefined ? null : old });   // set v5b — old 없으면 null(검사 안 함)
  if(error){ if(res){ res.className = "res err"; res.textContent = `${key}: ${error.message}`; } return false; }
  return true;
}

async function dSaveCompany(co, brs){
  const res = document.getElementById("res_dc");
  const g = (id) => document.getElementById(id).value;
  const branches = [...document.querySelectorAll("[data-br]")].map(box => ({ code: box.dataset.br,
    label: box.querySelector(".bLabel").value.trim(), line1: box.querySelector(".bLine1").value.trim(), line2: box.querySelector(".bLine2").value.trim(),
    phone: box.querySelector(".bPhone").value.trim(), email: box.querySelector(".bEmail").value.trim() }));
  const want = [ ["doc_company_name", g("dcName").trim(), co.name], ["doc_hst", g("dcHst").trim(), co.hst], ["doc_website", g("dcWeb").trim(), co.website],
                 ["doc_terms", g("dcTerms").replace(/\s+$/, ""), co.terms], ["doc_date_format", g("dcDate"), dCfg.date_format] ];
  const brOld = JSON.stringify(["TOR", "EDM"].map(c => { const b = brs.find(x => x.code === c) || {}; return { code: c, label: b.label || "", line1: b.line1 || "", line2: b.line2 || "", phone: b.phone || "", email: b.email || "" }; }));
  const brNew = JSON.stringify(branches);
  const todo = want.filter(([, v, old]) => v !== (old == null ? "" : old));
  if(brNew !== brOld) todo.push(["doc_branches", brNew, null]);
  if(!todo.length){ res.className = "res"; res.textContent = "No changes to save."; return; }
  res.className = "res"; res.textContent = "Saving…";
  for(const [k, v, old] of todo){ if(!(await dCfgSave(k, v, "res_dc", old))) return; }   // set v5b — old = 화면이 본 값(doc_branches 는 null)   // 하나라도 실패하면 거기서 멈춘다(앞의 것은 저장됨 — 문장에 키 이름이 나온다)
  await loadDocs();
  const r2 = document.getElementById("res_dc"); if(r2){ r2.className = "res on"; r2.textContent = `Saved (${todo.length}).`; }
}

async function dUploadLogo(){
  const res = document.getElementById("res_logo"), f = document.getElementById("dcLogo").files[0];
  if(!f){ res.className = "res err"; res.textContent = "Pick a PNG or JPEG file first."; return; }
  if(!/^image\/(png|jpeg)$/.test(f.type)){ res.className = "res err"; res.textContent = "Only PNG or JPEG."; return; }
  if(f.size > 2 * 1024 * 1024){ res.className = "res err"; res.textContent = "The file is over 2 MB."; return; }
  const path = `logo-${Date.now()}.${f.type === "image/png" ? "png" : "jpg"}`;   // 새 이름 — 캐시된 옛 로고가 보이지 않게
  res.className = "res"; res.textContent = "Uploading…";
  const up = await sb.storage.from("doc-brand").upload(path, f, { contentType: f.type, upsert: false });
  if(up.error){ res.className = "res err"; res.textContent = up.error.message; return; }
  if(await dCfgSave("doc_logo_path", path, "res_logo", (dCfg && dCfg.company) ? (dCfg.company.logo_path ?? null) : null)) await loadDocs();
}

function drawKind(){
  const box = document.getElementById("dKindBox"); if(!box) return;
  const ed = !!dCfg.can_edit_text, pub = !!dCfg.can_publish;
  const st = (dCfg.settings || {})[dKind] || {};
  const act = (dCfg.active || {})[dKind];
  const vers = dVers.filter(v => v.kind === dKind);
  /* set v7a — 쓰는 판과 판 번호가 가장 높은 둘만 늘 보인다(되돌리기에 쓰는 바로 앞 판 · 쓰다 만 새 판) · 나머지는 접는다 */
  const keep = new Set(vers.slice().sort((a, b) => Number(b.version) - Number(a.version)).slice(0, 2).map(v => v.id));
  vers.forEach(v => { if(v.is_active) keep.add(v.id); });
  const nHidden = vers.filter(v => !keep.has(v.id)).length;
  const versShown = dVerAll ? vers : vers.filter(v => keep.has(v.id));
  const dis = ed ? "" : "disabled";
  const tog = (key, label, def) => { const on = (st[key] == null ? def : st[key] === "true"); return `<label class="dtog"><input type="checkbox" data-tog="${key}" ${on ? "checked" : ""} ${dis}> ${label}</label>`; };
  box.innerHTML = `
    <div class="mrow"><div class="lbl">Layout in use</div><div class="ctl">
      <div class="line"><span class="bigstate ${act ? "on" : "off"}">${act ? "Version " + esc(String(act.version)) : "None yet"}</span>${act ? `<span class="note">since ${esc(imsTs(act.set_at))}</span>` : '<span class="note">This document cannot print until a layout is in use.</span>'}</div>
      ${vers.length ? `<table class="dver"><thead><tr><th>Version</th><th>Note</th><th>Uploaded</th><th>Checks</th><th></th></tr></thead><tbody>${versShown.map(v => `<tr>
        <td class="mono">v${esc(String(v.version))}${v.is_active ? ' <span class="pill">in use</span>' : ""}</td>
        <td>${esc(v.note || "")}</td><td class="dim">${esc(imsTs(v.uploaded_at))}${v.uploaded_by_name ? " · " + esc(v.uploaded_by_name) : ""}</td>
        <td>${v.ok ? "Passed" : '<span class="err">Failed</span>'}</td>
        <td class="dact"><button class="pobtn" data-vopen="${esc(v.id)}">Open</button>${pub && v.ok && !v.is_active ? `<button class="pobtn go" data-vuse="${esc(v.id)}" data-vno="${esc(String(v.version))}">Use this version</button>` : ""}</td></tr>`).join("")}</tbody></table>${nHidden ? `<div class="line"><button class="pobtn" id="dVerMore">${dVerAll ? "Hide older versions" : `Show ${nHidden} older version${nHidden > 1 ? "s" : ""}`}</button><span class="note">Older versions are kept — nothing is deleted.</span></div>` : ""}` : '<span class="note">No versions uploaded yet.</span>'}
    </div></div>
    <div class="mrow"><div class="lbl">Layout file<span class="who">${pub ? "Check → preview → save → use. Saving does not change what prints until you press Use this version." : "Only an admin, or a supervisor with the Document templates key, can upload or switch layouts."}</span></div><div class="ctl">
      ${pub ? '<div class="line"><input type="file" id="dFile" accept=".html,.htm,text/html"><span class="note">or paste below</span></div>' : ""}
      <textarea id="dBody" rows="10" class="mono dbody" spellcheck="false" placeholder="${pub ? "Paste a layout here, or open a version above" : "Open a version above to read it"}"></textarea>
      ${pub ? `<div class="line"><input type="text" id="dNote" autocomplete="off" placeholder="What changed (shown in the version list)" style="width:420px"><button class="pobtn" id="dChk">Check</button><button class="pobtn go" id="dSaveV" ${dCheck && dCheck.ok ? "" : "disabled"}>Save as new version</button><span class="res" id="res_dv"></span></div>` : ""}
      <div id="dChkOut"></div>
    </div></div>
    <div class="mrow"><div class="lbl">Preview<span class="who">${dKind === "ship_ready" ? "Ship Ready is filled at Ship &amp; invoice — here an issued invoice stands in." : "Uses a real document. Nothing is saved or sent."}</span></div><div class="ctl">
      <div class="line"><label class="dl">${esc(DOC_REF_LBL[dKind])} <input type="search" id="dRef" autocomplete="off" style="width:170px"></label>
        <button class="pobtn" id="dPrevBox">Preview the layout in the box</button>${act ? '<button class="pobtn" id="dPrevAct">Preview the layout in use</button>' : ""}<span class="res" id="res_prev"></span></div>
      <div id="dPrev"></div>
    </div></div>
    <div class="mrow"><div class="lbl">Wording &amp; columns<span class="who">${ed ? "Saved one by one." : "Only an admin, a supervisor or someone with the master permission can change these."}</span></div><div class="ctl">
      <label class="dl">Title <input type="text" id="dsTitle" autocomplete="off" ${dis}></label>
      <div class="line">${tog("show_upc", "UPC column", true)}${tog("show_comment", "Line comments", true)}${tog("show_charge_code", "Account code on freight lines", false)}</div>
      ${dKind === "internal_receipt" ? "" : `<label class="dl">Email subject <input type="text" id="dsSubj" autocomplete="off" ${dis}></label>
      <label class="dl">Email message <textarea id="dsBody" rows="5" ${dis}></textarea></label>
      <span class="note">You can use the same {{names}} as the layout, e.g. {{invoice.number}}. These are the subject and message of the email that carries this document.</span>`}
      <div class="line">${ed ? '<button class="pobtn go" id="dsSave">Save wording &amp; columns</button>' : ""}<span class="res" id="res_ds"></span></div>
    </div></div>`;
  const ta = document.getElementById("dBody"); ta.value = dDraft;
  if(!pub) ta.readOnly = true;
  ta.oninput = () => { dDraft = ta.value; dCheck = null; const s = document.getElementById("dSaveV"); if(s) s.disabled = true; document.getElementById("dChkOut").innerHTML = ""; };
  const nt = document.getElementById("dNote"); if(nt){ nt.value = dDraftNote; nt.oninput = () => { dDraftNote = nt.value; }; }
  document.getElementById("dsTitle").value = st.title || "";
  const sj = document.getElementById("dsSubj"); if(sj) sj.value = st.mail_subject || "";
  const sb2 = document.getElementById("dsBody"); if(sb2) sb2.value = st.mail_body || "";
  document.getElementById("dRef").value = dPrevRef;
  document.getElementById("dRef").oninput = (e) => { dPrevRef = e.target.value; };
  const fi = document.getElementById("dFile");
  if(fi) fi.onchange = async () => { const f = fi.files[0]; if(!f) return; dDraft = await f.text(); ta.value = dDraft; dCheck = null; document.getElementById("dChkOut").innerHTML = ""; document.getElementById("dSaveV").disabled = true; };
  const ck = document.getElementById("dChk"); if(ck) ck.onclick = dRunCheck;
  const sv = document.getElementById("dSaveV"); if(sv) sv.onclick = dSaveVersion;
  if(dCheck) dDrawCheck();
  { const mv = document.getElementById("dVerMore"); if(mv) mv.onclick = () => { dVerAll = !dVerAll; drawKind(); }; }   // set v7a
  box.querySelectorAll("[data-vopen]").forEach(b => { b.onclick = async () => {
    const { data, error } = await sb.rpc("doc_template_get", { p_template_id: b.dataset.vopen });
    if(error || !data){ alert(error ? error.message : "That version was not found."); return; }
    dDraft = data.body || ""; dDraftNote = ""; dCheck = null; drawKind();
  }; });
  box.querySelectorAll("[data-vuse]").forEach(b => { b.onclick = async () => {
    if(!confirm(`Use version ${b.dataset.vno} for every ${imsDoc.KIND_LBL[dKind].toLowerCase()} from now on? Documents already printed or sent do not change.`)) return;
    const { error } = await sb.rpc("doc_template_publish", { p_template_id: b.dataset.vuse });
    if(error){ alert(error.message); return; }
    await loadDocs();
  }; });
  document.getElementById("dPrevBox").onclick = () => dPreview(document.getElementById("dBody").value, "the layout in the box");
  const pa = document.getElementById("dPrevAct"); if(pa) pa.onclick = async () => {
    const { data, error } = await sb.rpc("doc_template_get", { p_template_id: act.template_id });
    if(error || !data){ const r = document.getElementById("res_prev"); r.className = "res err"; r.textContent = error ? error.message : "The layout in use was not found."; return; }
    dPreview(data.body, "version " + act.version);
  };
  const ss = document.getElementById("dsSave"); if(ss) ss.onclick = () => dSaveWording(st);
}

async function dRunCheck(){
  const res = document.getElementById("res_dv"), body = document.getElementById("dBody").value;
  if(!body.trim()){ res.className = "res err"; res.textContent = "There is no layout to check."; return; }
  res.className = "res"; res.textContent = "Checking…";
  const { data, error } = await sb.rpc("doc_template_upload", { p_kind: dKind, p_body: body, p_note: null, p_commit: false });
  if(error){ res.className = "res err"; res.textContent = error.message; return; }
  dCheck = Object.assign({ next_version: data.next_version }, data.check || {});
  res.textContent = "";
  dDrawCheck();
  document.getElementById("dSaveV").disabled = !dCheck.ok;
}
function dDrawCheck(){
  const out = document.getElementById("dChkOut"); if(!out || !dCheck) return;
  const lines = (a) => (a || []).map(p => typeof p === "string" ? p : (p.message || JSON.stringify(p)) + (p.tag ? ` — ${p.tag}` : ""));
  const pr = lines(dCheck.problems), wa = lines(dCheck.warnings);
  out.innerHTML = `<div class="dchk ${dCheck.ok ? "ok" : "bad"}">
    <div class="dchkh">${dCheck.ok ? `Passed — this would be saved as version ${esc(String(dCheck.next_version || ""))}.` : "Not accepted — fix these and check again:"}</div>
    ${pr.length ? `<ul>${pr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${wa.length ? `<div class="note">Warnings:</div><ul>${wa.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
  </div>`;
}
async function dSaveVersion(){
  const res = document.getElementById("res_dv"), body = document.getElementById("dBody").value, note = (document.getElementById("dNote").value || "").trim();
  if(!note){ res.className = "res err"; res.textContent = "Say what changed in one line — it shows in the version list."; return; }
  res.className = "res"; res.textContent = "Saving…";
  const { data, error } = await sb.rpc("doc_template_upload", { p_kind: dKind, p_body: body, p_note: note, p_commit: true });
  if(error){ res.className = "res err"; res.textContent = error.message; return; }
  if(!data || !data.committed){ dCheck = Object.assign({ next_version: data && data.next_version }, (data && data.check) || {}); dDrawCheck(); res.className = "res err"; res.textContent = "Not saved — the checks did not pass."; return; }
  dDraftNote = ""; dCheck = null;
  await loadDocs();
  const r2 = document.getElementById("res_dv"); if(r2){ r2.className = "res on"; r2.textContent = `Saved as version ${data.version}. It is not in use until you press Use this version.`; }
}

async function dFindRef(kind, raw){
  const v = String(raw || "").trim(); if(!v) throw new Error(`Type the ${DOC_REF_LBL[kind].replace(/ \(sample\)$/, "").toLowerCase()} to preview with.`);
  if(kind === "credit_note"){
    const { data, error } = await sb.from("so_credit").select("id").eq("credit_number", v).limit(1);
    if(error) throw new Error(error.message); if(!data.length) throw new Error(`No credit note ${v}.`); return { credit_id: data[0].id };
  }
  if(kind === "sales_order"){
    const n = /^\d+$/.test(v) ? "SO-" + v : v.toUpperCase();
    const { data, error } = await sb.from("so").select("id").eq("so_number", n).limit(1);
    if(error) throw new Error(error.message); if(!data.length) throw new Error(`No sales order ${n}.`); return { so_id: data[0].id };
  }
  const { data, error } = await sb.from("so_invoice").select("id").eq("invoice_number", v).limit(1);
  if(error) throw new Error(error.message); if(!data.length) throw new Error(`No invoice ${v}.`); return { invoice_id: data[0].id };
}
async function dPreview(body, what){
  const res = document.getElementById("res_prev"), box = document.getElementById("dPrev");
  if(!String(body || "").trim()){ res.className = "res err"; res.textContent = "There is no layout in the box — paste one or open a version."; return; }
  res.className = "res"; res.textContent = "Loading…";
  try{
    const ref = await dFindRef(dKind, document.getElementById("dRef").value);
    const dk = dKind === "ship_ready" ? "final_invoice" : dKind;
    const d = await imsDoc.data(sb, dk, ref);
    let doc = (d && d.docs && d.docs[0]) || null;
    if(!doc) throw new Error("The document came back empty.");
    if(dKind === "ship_ready") doc = imsDoc.shipReadySample(doc);
    const html = await imsDoc.render(body, doc);
    imsDoc.frame(box, html, { title: "Preview — " + what });
    res.className = "res on"; res.textContent = `Showing ${what}.`;
  }catch(e){ res.className = "res err"; res.textContent = e.message; box.innerHTML = ""; }
}

async function dSaveWording(st){
  const res = document.getElementById("res_ds");
  const want = [["title", document.getElementById("dsTitle").value.trim()]];
  document.querySelectorAll("[data-tog]").forEach(c => want.push([c.dataset.tog, c.checked ? "true" : "false"]));
  const sj = document.getElementById("dsSubj"); if(sj) want.push(["mail_subject", sj.value.trim()]);
  const bd = document.getElementById("dsBody"); if(bd) want.push(["mail_body", bd.value.replace(/\s+$/, "")]);
  const defs = { show_upc: "true", show_comment: "true", show_charge_code: "false" };
  const todo = want.filter(([k, v]) => v !== (st[k] == null ? (defs[k] || "") : st[k]) && !(k === "title" && v === "" && st[k] == null));
  if(!todo.length){ res.className = "res"; res.textContent = "No changes to save."; return; }
  if(todo.some(([k, v]) => k === "title" && v === "")){ res.className = "res err"; res.textContent = "The title cannot be empty once set — type the title you want."; return; }
  res.className = "res"; res.textContent = "Saving…";
  for(const [k, v] of todo){
    const { error } = await sb.rpc("doc_setting_set", { p_kind: dKind, p_key: k, p_value: v });
    if(error){ res.className = "res err"; res.textContent = `${k}: ${error.message}`; return; }
  }
  await loadDocs();
  const r2 = document.getElementById("res_ds"); if(r2){ r2.className = "res on"; r2.textContent = `Saved (${todo.length}).`; }
}

/* ── set v8 — Google Drive(drive-3 · 판정 688 · 692 · 702 · 707) ──────────
   ⚠️ 값은 drive_status()(읽기) · 저장은 창구 ims_config_set(old = 화면이 본 값) · 바꾸기는 admin 만(판정 707 · 창구가 다시 본다)
   ⚠️ drive_since 가 비어 있으면 보관 PDF 도 드라이브 일도 생기지 않는다 — 컷오버 날 첫 발행 전에 2026-11-01(판정 692)
   ⚠️ drive_enabled 는 「드라이브로 올리기」만 — 보관 PDF 는 since 만 있으면 발행 직후 찍힌다(drive-1 이견 1) */
let dSt = null;
async function loadDrive(){
  const body = document.getElementById("body");
  body.innerHTML = '<div class="msg">Loading…</div>';
  const { data, error } = await sb.rpc("drive_status");
  if(error){ body.innerHTML = `<div class="msg err">Could not load — ${esc(error.message)}</div>`; return; }
  dSt = data || {};
  const me = (window.imsAuth && imsAuth.me) || {};
  const admin = me.role === "admin";
  const on = !!dSt.enabled, since = dSt.since || "", root = dSt.root_id || "";
  const lock = admin ? "" : '<span class="note">Only an admin can change this.</span>';
  const counts = dSt.counts || {};
  const cnt = Object.keys(counts).sort().map(k => `<span class="tag">${esc(k)} ${esc(counts[k])}</span>`).join(" ") || '<span class="dim">none yet</span>';
  const failed = (dSt.failed || []).map(f => `<div class="note"><b>${esc(f.kind)}</b> ${esc(f.file_name || "")} — ${esc(f.last_error || "")} <span class="dim">(${esc(imsTs(f.updated_at))} · tries ${esc(f.attempts)})</span></div>`).join("");
  body.innerHTML = `<div class="mset">
    <div class="mrow"><div class="lbl">Start date</div><div class="ctl">
      <div class="line"><input type="date" id="dvSince" ${admin ? "" : "disabled"}>${admin ? '<button class="pobtn" id="dvSinceSave">Save</button> <button class="pobtn" id="dvSinceClear">Clear</button>' : ""}<span class="res" id="res_drive_since"></span></div>
      <span class="note">${since ? `Invoices and credit notes issued on or after <b>${esc(since)}</b> get a kept copy (the PDF as it looked when issued) and go to Drive. Documents uploaded on a PO or charge from this date go too.` : "<b>Empty — nothing is kept for Drive.</b> No kept copies are made and nothing is queued. On cutover day, put 2026-11-01 here before the first invoice is issued."}</span>${lock}</div></div>
    <div class="mrow"><div class="lbl">Send to Drive</div><div class="ctl">
      <div class="line"><span class="bigstate ${on ? "on" : "off"}">${on ? "On" : "Off"}</span>${admin ? `<button class="pobtn${on ? "" : " go"}" id="dvTog">${on ? "Turn off" : "Turn on"}</button>` : ""}<span class="res" id="res_drive_enabled"></span></div>
      <span class="note">${on ? "Waiting files go to the shared drive every minute." : "Nothing goes to Drive. Kept copies are still made at issue (when a start date is set) and wait here until this is on."}</span>${lock}</div></div>
    <div class="mrow"><div class="lbl">Shared drive</div><div class="ctl">
      <div class="line"><input type="text" id="dvRoot" autocomplete="off" style="width:280px" ${admin ? "" : "disabled"}>${admin ? '<button class="pobtn" id="dvRootSave">Save</button>' : ""}${root ? ` <a class="lnk" href="https://drive.google.com/drive/folders/${esc(root)}" target="_blank" rel="noopener">Open in Drive</a>` : ""}<span class="res" id="res_drive_root_id"></span></div>
      <span class="note">The id of the shared drive "IMS Documents" (the part after /folders/ in its address). ims@asung.ca must be a Contributor there. Change it only for a test drive.</span>${lock}</div></div>
    <div class="mrow"><div class="lbl">Queue</div><div class="ctl">
      <div class="line">${cnt}</div>
      <span class="note">Waiting: ${esc(dSt.pending ?? 0)} · folders made: ${esc(dSt.folders ?? 0)}. The worker runs every minute.</span>
      ${failed ? `<div style="margin-top:6px"><b class="off">Failed</b>${failed}</div>` : ""}</div></div>
  </div>`;
  document.getElementById("dvSince").value = since;
  document.getElementById("dvRoot").value = root;
  const b1 = document.getElementById("dvSinceSave"); if(b1) b1.onclick = () => {
    const v = document.getElementById("dvSince").value;
    if(!v){ const r = document.getElementById("res_drive_since"); r.className = "res err"; r.textContent = "Pick a date, or press Clear."; return; }
    if(!confirm(`Set the start date to ${v}?\n\nInvoices and credit notes issued from this date get a kept copy for Drive.`)) return;
    dSave("drive_since", v, since);
  };
  const b2 = document.getElementById("dvSinceClear"); if(b2) b2.onclick = () => {
    if(!since){ return; }
    if(!confirm("Clear the start date?\n\nNo kept copies are made and nothing new is queued until a date is set again.")) return;
    dSave("drive_since", "", since);
  };
  const b3 = document.getElementById("dvTog"); if(b3) b3.onclick = () => {
    const goingOn = !on;
    if(!confirm(goingOn ? `Turn sending to Drive on?\n\nWaiting files go to ${root ? "the shared drive " + root : "the shared drive"} from the next minute.` : "Turn sending to Drive off?\n\nFiles keep waiting here until it is on again.")) return;
    dSave("drive_enabled", goingOn ? "on" : "off", on ? "on" : "off");
  };
  const b4 = document.getElementById("dvRootSave"); if(b4) b4.onclick = () => {
    const v = document.getElementById("dvRoot").value.trim();
    if(!confirm(`Change the shared drive id to ${v}?\n\nNew folders and files go there.`)) return;
    dSave("drive_root_id", v, root);
  };
}
async function dSave(key, value, old){
  const res = document.getElementById("res_" + key);
  if(res){ res.className = "res"; res.textContent = "Saving…"; }
  const { error } = await sb.rpc("ims_config_set", { p_key: key, p_value: value, p_old: old });
  if(error){ if(res){ res.className = "res err"; res.textContent = error.message; } return; }
  await loadDrive();
  const r2 = document.getElementById("res_" + key);
  if(r2){ r2.className = "res on"; r2.textContent = "Saved."; }
}

/* ── set v12 — QuickBooks(qbo-1a ~ 1d · 판정 867 ~ 872) ──────────
   ⚠️ 값은 EF qbo 의 status(창구 qbo_status · 토큰 칸 없음 — 처리방침 §4 「not shown on staff screens」)
   ⚠️ 연결 · 다시 연결 · 끊기 · 확인 · 고정 회사 비우기는 admin 만(870) — 화면은 단추만 숨긴다 · EF · DB 가 다시 본다
   ⚠️ Connect 는 같은 탭으로 Intuit 에 간다 → callback(302 · 고정 주소)이 ?t=qbo&qbo=connected | error&why=<낱말> 로 돌려보낸다
   ⚠️ 싱크(인보이스 · 결제 보내기)는 아직 없다 — 이 칸은 연결만 */
const QBO_WHY = {
  denied:   "You chose not to connect on the QuickBooks page. Nothing changed.",
  state:    "The connect link expired or was already used. Press Connect again.",
  exchange: "QuickBooks did not finish the sign-in. Press Connect again.",
  realm:    "That is a different QuickBooks company from the one this IMS is tied to. Nothing was saved.",
  save:     "The connection could not be saved. Press Connect again — if it repeats, contact the administrator.",
  env:      "The connection belongs to the other environment (sandbox or production). Disconnect first, then connect."
};
let qboFlash = null;   // Intuit 에서 돌아온 결과 — 한 번만 보인다
async function qboCall(action){
  const r = await sb.functions.invoke("qbo", { body:{ action }, region:"ca-central-1" });
  if(!r.error) return { data: r.data || {} };
  let msg = String((r.error && r.error.message) || r.error);
  try{ const j = await r.error.context.json(); if(j && (j.error || j.message)) msg = j.error || j.message; }catch(e){}
  return { err: msg };
}
async function loadQbo(after){
  const body = document.getElementById("body");
  body.innerHTML = '<div class="msg">Loading…</div>';
  const { data: st, err } = await qboCall("status");
  if(err){ body.innerHTML = `<div class="msg err">Could not load — ${esc(err)}</div>`; return; }
  const admin = !!st.caller_is_admin;
  const status = st.status || "none";
  const envLbl = (e) => e === "production" ? "Production" : e === "sandbox" ? "Sandbox (test company)" : (e || "—");
  const sec = st.secrets || {};
  const keysOk = !!(sec.client_id && sec.client_secret);
  const lock = admin ? "" : '<span class="note">Only an IMS admin can connect or disconnect.</span>';
  const state = status === "connected" ? '<span class="bigstate on">Connected</span>'
              : status === "needs_reconnect" ? '<span class="bigstate off">Reconnect needed</span>'
              : '<span class="bigstate">Not connected</span>';
  let btns = "";
  if(admin){
    if(status === "none") btns = '<button class="pobtn go" id="qbConnect">Connect to QuickBooks</button>';
    else if(status === "needs_reconnect") btns = '<button class="pobtn go" id="qbConnect">Reconnect</button> <button class="pobtn" id="qbDisc">Disconnect</button>';
    else btns = (st.env_mismatch ? "" : '<button class="pobtn" id="qbPing">Check connection</button> ') + '<button class="pobtn" id="qbDisc">Disconnect</button>';   // 환경이 어긋나면 EF 가 ping 을 거부한다 — 끊기만
  }
  const why = status === "connected"
      ? "The IMS can reach this QuickBooks company. Nothing is sent to the books yet — sending invoices and payments comes later."
      : status === "needs_reconnect"
      ? "QuickBooks stopped accepting this connection — the approval ran out, or the app was disconnected inside QuickBooks. Press Reconnect and approve again on the QuickBooks page."
      : "Press Connect, sign in as an admin of the QuickBooks company, and approve. You come back to this page when it is done.";
  const flash = qboFlash
      ? `<div class="mrow"><div class="lbl">Just now</div><div class="ctl"><span class="res ${qboFlash.ok ? "on" : "err"}">${qboFlash.ok ? "Connected to QuickBooks." : esc(QBO_WHY[qboFlash.why] || "Connecting did not finish. Press Connect again.")}</span></div></div>`
      : "";
  qboFlash = null;
  const pins = Object.entries(st.pinned_realm || {});
  const pinHere = (st.pinned_realm || {})[st.qbo_env] || "";
  body.innerHTML = `<div class="mset">
    ${flash}
    <div class="mrow"><div class="lbl">Connection</div><div class="ctl">
      <div class="line">${state}${btns}<span class="res" id="qbRes"></span></div>
      <span class="note">${why}</span>${lock}</div></div>
    ${st.env_mismatch ? `<div class="mrow"><div class="lbl">Environment</div><div class="ctl"><span class="res err">This connection is for ${esc(envLbl(st.env))}, but the IMS is now set to ${esc(envLbl(st.qbo_env))}. Disconnect it, then connect again.</span></div></div>` : ""}
    ${status !== "none" ? `<div class="mrow"><div class="lbl">Company</div><div class="ctl">
      <div class="line"><b>${esc(st.company_name || "(name not read yet — press Check connection)")}</b></div>
      <span class="note">Company ID ${esc(st.realm_id || "—")} · ${esc(envLbl(st.env))}</span></div></div>
    <div class="mrow"><div class="lbl">Connected by</div><div class="ctl">
      <div class="line">${esc(st.connected_by || "—")}${st.connected_at ? ` <span class="dim">${esc(imsTs(st.connected_at))}</span>` : ""}</div></div></div>
    <div class="mrow"><div class="lbl">Approval good until</div><div class="ctl">
      <div class="line">${st.refresh_expires_at ? esc(imsTs(st.refresh_expires_at)) : "—"}</div>
      <span class="note">QuickBooks asks for a fresh approval by this date — press Reconnect before then. The IMS renews its access every day${st.last_refresh_at ? ` (last ${esc(imsTs(st.last_refresh_at))})` : ""} and emails the administrator if the connection drops.</span></div></div>` : ""}
    ${st.last_error ? `<div class="mrow"><div class="lbl">Last problem</div><div class="ctl">
      <span class="res err">${esc(st.last_error)}</span>${st.last_error_at ? `<span class="note">${esc(imsTs(st.last_error_at))}</span>` : ""}</div></div>` : ""}
    ${admin ? `<div class="mrow"><div class="lbl">Setup</div><div class="ctl">
      <div class="line">${esc(envLbl(st.qbo_env))} · app keys ${keysOk ? '<span class="on">on file</span>' : '<b class="off">missing</b>'}</div>
      ${keysOk ? "" : '<span class="note">The QuickBooks app keys are not set on the server, so Connect cannot work. They are added by the administrator, not on this page.</span>'}
      <div class="line">${pins.length ? pins.map(([e, id]) => `<span class="tag">${e === "production" ? "Production" : "Sandbox"}: company ${esc(id)}</span>`).join(" ") : '<span class="dim">No company tied yet — the first connection ties it.</span>'}${pinHere && status === "none" ? ' <button class="pobtn" id="qbUnpin">Untie company</button>' : ""}</div>
      <span class="note">The IMS stays tied to the first QuickBooks company it connects to, so records never point at the wrong books. Untie only when the company itself really changed — and only while not connected.</span></div></div>` : ""}
    <div class="mrow"><div class="lbl">Help</div><div class="ctl">
      <span class="note">Connection problems? Contact the IMS administrator: <a class="lnk" href="mailto:caleb@asung.ca">caleb@asung.ca</a></span></div></div>
  </div>`;
  const res = (ok, t) => { const r = document.getElementById("qbRes"); if(r){ r.className = "res " + (ok ? "on" : "err"); r.textContent = t; } };
  if(after) res(after.ok, after.text);
  const bC = document.getElementById("qbConnect"); if(bC) bC.onclick = async () => {
    if(!keysOk){ res(false, "The app keys are missing on the server."); return; }
    bC.disabled = true; res(true, "Opening QuickBooks…");
    const { data, err: e } = await qboCall("start");
    const u = data && (data.url || data.authorize_url);
    if(e || !u){ bC.disabled = false; res(false, e || "QuickBooks did not give a sign-in address. Try again."); return; }
    location.href = u;   // 같은 탭 — 허락 뒤 callback 이 ?t=qbo 로 돌려보낸다
  };
  const bP = document.getElementById("qbPing"); if(bP) bP.onclick = async () => {
    bP.disabled = true; res(true, "Checking…");
    const { data, err: e } = await qboCall("ping");
    if(e){ await loadQbo({ ok:false, text: e }); return; }
    await loadQbo({ ok:true, text: "QuickBooks answered" + (data.company_name ? " — " + data.company_name : "") + "." });
  };
  const bD = document.getElementById("qbDisc"); if(bD) bD.onclick = async () => {
    if(!confirm("Disconnect QuickBooks?\n\nThe IMS signs out of the QuickBooks company and deletes its connection details. Nothing can be sent to the books until someone connects again.")) return;
    bD.disabled = true; res(true, "Disconnecting…");
    const { data, err: e } = await qboCall("disconnect");
    if(e){ await loadQbo({ ok:false, text: e }); return; }
    await loadQbo({ ok: data.revoked !== false, text: data.revoked === false
      ? "Removed from the IMS, but QuickBooks did not confirm the sign-out. In QuickBooks, open Apps and disconnect Asung IMS there too."
      : "Disconnected." });
  };
  const bU = document.getElementById("qbUnpin"); if(bU) bU.onclick = async () => {
    if(!confirm(`Untie the IMS from QuickBooks company ${pinHere}?\n\nThe next connection can then be to a different company. Do this only if the company really changed.`)) return;
    bU.disabled = true;
    const { error } = await sb.rpc("qbo_realm_clear", { p_env: st.qbo_env });
    await loadQbo(error ? { ok:false, text: error.message } : { ok:true, text: "Company untied." });
  };
}

/* ── 시작 ─────────────────────────────────────────────── */
imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client;
  imsHeader(me);
  document.getElementById("buildTag").textContent = SET_BUILD;   // set v2
  document.getElementById("addRow").onclick = () => (cur.edit === "ref" ? openRef() : cur.edit === "service" ? openService(null) : openCarrier(null));   // set v5 · v6
  if(new URLSearchParams(location.search).get("t") === "carrier") cur = TABLES.find(x => x.t === "ref_carrier");   // set v2 — ?t=carrier
  if(new URLSearchParams(location.search).get("t") === "mail") cur = TABLES.find(x => x.t === "mail");   // set v3 — ?t=mail
  if(new URLSearchParams(location.search).get("t") === "docs") cur = TABLES.find(x => x.t === "docs");   // set v4 — ?t=docs
  if(new URLSearchParams(location.search).get("t") === "drive") cur = TABLES.find(x => x.t === "drive");   // set v8 — ?t=drive
  if(new URLSearchParams(location.search).get("t") === "freight") cur = TABLES.find(x => x.t === "freight");   // set v10 — ?t=freight
  if(new URLSearchParams(location.search).get("t") === "warehouse") cur = TABLES.find(x => x.t === "ref_warehouse");   // set v10 — ?t=warehouse
  if(new URLSearchParams(location.search).get("t") === "pickup") cur = TABLES.find(x => x.t === "pickup");   // set v11 — ?t=pickup
  if(new URLSearchParams(location.search).get("t") === "qbo"){   // set v12 — ?t=qbo · Intuit 에서 돌아오면 &qbo=connected | error&why=
    cur = TABLES.find(x => x.t === "qbo");
    const sp = new URLSearchParams(location.search), r = sp.get("qbo");
    if(r === "connected") qboFlash = { ok:true };
    else if(r === "error") qboFlash = { ok:false, why: sp.get("why") || "" };
    if(r) history.replaceState(null, "", "settings.html?t=qbo");   // 새로 고침에 같은 알림이 또 뜨지 않게
  }
  document.getElementById("onlyActive").onchange = (e) => { onlyActive = e.target.checked; pg.reset(); load(); };
  document.getElementById("binLabels").onclick = () => imsLabel.open({ sb, kind:"bin" });   // set v9
  imsQ("#q", (v) => { q = v; pg.reset(); load(); });
  await load();
});
</script>
