<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Families · Asung IMS</title>
<link rel="stylesheet" href="ims-ui.css">
<style>
  /* 이 화면에만 있는 것 — 공통은 ims-ui.css */
  .list{width:330px;flex:0 0 330px}
  .list .rows{max-height:calc(100vh - 225px)}
  .list select{width:100%}
  .list .row{padding:8px 12px}
  .list .row .sk{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .list .row.cur .sk{color:#3b5bdb}
  .list .row .nm{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{display:flex;flex-direction:column;gap:14px}
  /* 넓은 목록 — 이 화면 몫만(공통 #wide · .wfilt 는 ims-ui.css · 판정 209) */
  #wide td.sk{font-family:var(--mono);font-weight:600;white-space:nowrap}
  #wide tr.off td{color:var(--muted)}
  #wide .wfilt .flt{flex:0 1 170px;min-width:120px}
  .head .acts{display:flex;gap:8px;align-items:center;margin-top:10px}
  /* fam v5a — 창 안의 입력칸(.sofield 는 공통 css 에 없어 브라우저 기본 진한 테두리가 나왔다 · Add member · Options · New family 창 모두) */
  .pobox input.sofield,.pobox input[type=search]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:12.5px;color:var(--ink);background:#fff;min-width:0;box-sizing:border-box}
  .pobox input.sofield:focus,.pobox input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .pobox input.sofield::placeholder,.pobox input[type=search]::placeholder{color:#a3acb9}
  /* New family 창 — 라벨 폭 · 옵션 셋을 한 줄 격자로(넘쳐 가로 스크롤이 생겼다) · 안내는 선 없는 옅은 상자 */
  .nfw .frow label{min-width:96px}
  .nfw .axes{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .nfw .hint{font-size:12px;color:var(--muted);background:#f7f8fa;border-radius:8px;padding:8px 10px;margin:2px 0 14px;line-height:1.45}
  .nfw h5{margin:4px 0 8px;font-size:12.5px}
  .nfw #nfMem table{font-size:12.5px}
  .nfw #nfMem .msg{padding:14px 0;text-align:center}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="dim" style="font-size:10.5px" id="buildTag"></span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<section id="wide" hidden>
  <div class="card">
    <div class="wfilt">
      <input type="search" id="wq" placeholder="Search family SKU or name">
      <input list="brandList" id="wbrand" placeholder="Brand" class="flt">
      <select id="waxis"><option value="">All option axes</option></select>
      <label style="font-size:12.5px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="wactive" checked> Active only</label>
      <button class="pobtn" id="wclear">Clear</button>
      <span class="sp"></span>
      <button class="pobtn" id="wprod" title="Open the Products screen">Products</button>
      <button class="pobtn" id="wnewfamNew" hidden title="Opens the New family window on the Products screen — for SKUs that do not exist yet">New family (new SKUs)</button>
      <button class="pobtn go" id="wnewfam" hidden>New family from existing SKUs</button>
    </div>
    <div id="wrows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="wrange"></span><span class="sp"></span>
      <button id="wprev">←</button><button id="wnext">→</button>
    </div>
  </div>
</section>
<datalist id="brandList"></datalist>

<div class="wrap" id="wrapBox" hidden>
  <section class="list" id="listPanel">
    <div class="top">
      <input type="search" id="q" placeholder="Search family SKU or name">
      <select id="axis"><option value="">All option axes</option></select>
      <div class="opts">
        <input list="brandList" id="brand" placeholder="Brand" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px">
        <label><input type="checkbox" id="onlyActive" checked> Active only</label>
      </div>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a family.</div></div></main>
</div>
<div class="pomodal" id="modal" hidden><div class="pobox" id="modalBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-ui.js"></script>
<script src="ims-auth.js"></script>
<script src="ims-desc.js"></script>
<script src="ims-shop.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Families — product_family 1,141 (읽기 전용) · fam v2a(2026-10-01)
   ⭐ 판정 209: 처음은 넓은 목록(#wide · PO · Products 와 같은 두 모드) · 고르면 좁은 목록 + 상세 · ☰ List · ‹ All families
   ⭐ 판정 210: 이 화면은 메뉴에 남는다(판정 203 고침) — family 를 family SKU · 이름으로 찾고 훑는 곳 · family 머리 고치기는 뒤에 여기로
   정본: docs/design/po-module.md §3-d

   ⭐ 패밀리는 느슨한 묶음이다(Caleb 2026-09-15).
      안 묶여도 재고·발주가 안 깨진다 — 안 묶인 제품이 4,161 있고 그것이 정상이다.
      Shopify 에서 한 상품의 변형으로 보일지를 정하는 축이라 묶고 푸는 것이 판매 쪽 판단이다.
   ⚠️ product_bom(디스플레이↔낱개)과 다르다 — 그쪽은 재고가 실제로 흐르는 단단한 묶음이다.

   실측 2026-09-15
     패밀리당 제품 수   1개 11 · 2~5개 913 · 6~20개 197 · 21개 이상 20 · ⭐ 빈 패밀리 0
     옵션 축            Color 436 · Size 312 · Formula 68 · Type 49 · Style 45 · ⚠️ color 38
                        ⚠️⚠️ Color 와 color 가 갈려 있다 — 같은 축인데 대소문자가 다르다.
                             Shopify 로 내보낼 때 변형 옵션 이름이 상품마다 갈린다. 정리 목록에 있다.
     둘째 축이 있는 패밀리는 33개뿐 (Color×Size 22 · Size×Formula 11) · 셋째 축 없음
   ───────────────────────────────────────────────────────────── */

const FAM_BUILD = "fam v5b";   // 대화 Claude — Caleb 「링크를 두자 · product 로 넘어가는 링크는 글자로만 되어 있어서 통일성이 없어」: 넓은 목록 오른쪽을 단추 셋으로 — Products(글자 링크였다) · New family (new SKUs)(products.html?new=family → Products 의 New family 창 · 판정 200 · master 쓰기만 보임) · New family from existing SKUs · 동작 무변 ← fam v5a: 대화 Claude — Caleb 「레이아웃이 좀 별로네 · 라인이 너무 강해서」: .sofield 가 공통 css 에 없어 브라우저 기본 테두리 → 이 화면 <style> 에 창 안 입력칸 꼴(Add member · Options · New family 모두) · New family 창 옵션 셋을 격자 한 줄(가로 넘침 · Option 3 잘림) · 안내는 선 없는 옅은 상자 · 동작 무변 ← fam v5: 대화 Claude — fam-new-1(판정 652 · 653): 넓은 목록의 「New family from existing SKUs」 — 머리(이름 · SKU 비우면 첫 SKU + FAM · 옵션 축 이름 1 ~ 3 · 메모 · 브랜드 · 분류 · 단위는 첫 SKU 에서) + 구성원(찾아 넣기 · SKU 마다 옵션 값) → product_family_from_skus 검사 → 확인(다른 family 에서 옮김 · 옛 family 가 빔) → 저장 → 새 family 열기 · Shopify 안내 한 줄 ← fam v4:   // 대화 Claude — Caleb 「지금 IMS내에서 기존의 패밀리 멤버를 추가하거나 빼려면 어떻게 해야 해?」 → 「지금쓰자」: 구성원 고치기(DB 는 prod-4a 부터 product_update op family_join · family_leave · family_option 이 있었고 부르는 화면이 없었다) — Members 카드에 「Add member…」(SKU · 이름 찾기 → 옵션 값 → 검사 → 경고 확인 → 저장) · 줄마다 「Options」(옵션 값 고치기 · old = 화면이 본 값) · 「Remove」(family_leave · old = family SKU) · master 쓰기만 · 표에 셋째 옵션 열 · 안내: 이어진 Shopify 상품은 다음 보내기에서 변형이 더해지고 빠진다(판정 557) ← fam v3: 대화 Claude — shop-2c(판정 404 ~ 415): Shopify 카드(ims-shop.js · 스토어마다 보냄 켜기 · 끄기 · Send now · Open in Shopify · Shopify 첫 사진 고르기 = web_image_id) ← fam v2b: 대화 Claude — 판정 381 · 401 · 402(desc-1b 9184853): 머리 카드 아래 Description 카드 — 이 화면의 첫 쓰기(설명만 · 그리기 · 편집기 · 저장은 ims-desc.js · master 만 단추) ← fam v2a
let sb=null, q="", axis="", brand="", onlyActive=true, curId=null, canEdit=false;   // fam v4 — canEdit = master 쓰기
const pg = imsPage(100);

/* ⭐ 검색·필터를 바꾸면 오른쪽을 비운다. 페이지를 넘길 때는 두지 않는다(2026-09-15 · Caleb). */
function clearDetail(){
  curId = null;
  document.getElementById("detail").innerHTML =
    '<div class="card"><div class="msg">Select a family.</div></div>';
}

/* ⚠️ 옵션 축 이름이 갈려 있다(2026-09-15 실측) — Color 463 / color 38 · Flavor 4 / Flavour 3.
   ⭐ 화면에서만 합친다. 데이터는 Cin7 에서 온 값이라 고쳐도 다음 재적재가 되돌린다.
   ⚠️ 명백한 것만 넣는다 — Size/Volume/Length, Type/Style/Design/Shape 는 실무에서
      구별하는 것일 수 있어 합치지 않는다. 필요해지면 그때 늘린다.
   ⬜ Shopify 연동 때는 데이터를 정리해야 한다(우리 칸을 두거나 Cin7 을 고치거나). */
const AXIS_ALIAS = {
  "color":   "Color",
  "Flavour": "Flavor",
  "flavour": "Flavor",
  "flavor":  "Flavor",
  "size":    "Size",
};
const canonAxis = n => AXIS_ALIAS[n] || n;
/* 고른 축에 해당하는 원문들 — 검색은 원문으로 걸어야 한다 */
const axisVariants = canon =>
  [canon].concat(Object.keys(AXIS_ALIAS).filter(k => AXIS_ALIAS[k] === canon && k !== canon));


/* ⭐ 목록 질의 한 곳 — 넓은 목록 · 좁은 목록이 같은 필터 · 같은 쪽 pg(100 줄) */
function listQuery(){
  let qry = sb.from("product_family")
    .select("id,sku,name,brand_name,category_name,option1_name,option2_name,option3_name,is_active", { count:"exact" });
  if(onlyActive) qry = qry.eq("is_active", true);
  if(brand) qry = qry.eq("brand_name", brand);
  if(axis){
    const vs = axisVariants(axis);
    qry = vs.length > 1
      ? qry.or(vs.map(v => `option1_name.eq.${v}`).join(","))
      : qry.eq("option1_name", axis);
  }
  if(q) qry = qry.or(`sku.ilike.%${q}%,name.ilike.%${q}%`);
  return qry.order("sku");
}

/* ── 두 모드(판정 209) ───────────────────────────────── */
function syncCtl(){
  document.getElementById("q").value = q;        document.getElementById("wq").value = q;
  document.getElementById("axis").value = axis;  document.getElementById("waxis").value = axis;
  document.getElementById("brand").value = brand; document.getElementById("wbrand").value = brand;
  document.getElementById("onlyActive").checked = onlyActive; document.getElementById("wactive").checked = onlyActive;
}
function showWide(){
  curId = null; syncCtl();
  document.getElementById("wide").hidden = false;
  document.getElementById("wrapBox").hidden = true;
  loadWide();
}
async function openFamily(id){
  curId = id; syncCtl();
  document.getElementById("wide").hidden = true;
  document.getElementById("wrapBox").hidden = false;
  document.getElementById("listPanel").hidden = false;
  loadList(); await loadDetail(id);
}

/* ── 넓은 목록 — 열: Family SKU · Name · Brand · Category · Options · Variants · Sets · Active ── */
let wideSeq = 0;
async function loadWide(){
  const seq = ++wideSeq;
  const box = document.getElementById("wrows");
  const { data, error } = await pg.run(listQuery());
  if(seq !== wideSeq) return;
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  const rows = data || [];
  /* 변형 · 세트 수 — 이 쪽의 family 들만 · ⚠️ 1,000 행 캡 — 쪽을 넘겨 다 읽는다 */
  const nV = {}, nS = {};
  if(rows.length){
    const ids = rows.map(r => r.id);
    for(let from = 0; ; from += 1000){
      const { data: m, error: me } = await sb.from("product").select("family_id,parent_product_id")
        .in("family_id", ids).order("id").range(from, from + 999);
      if(me || !m) break;
      m.forEach(x => { const t = x.parent_product_id ? nS : nV; t[x.family_id] = (t[x.family_id] || 0) + 1; });
      if(m.length < 1000) break;
    }
    if(seq !== wideSeq) return;
  }
  const axes = r => [r.option1_name, r.option2_name, r.option3_name].filter(Boolean).map(esc).join(" × ");
  box.innerHTML = rows.length ? `<table><thead><tr>
      <th>Family SKU</th><th>Name</th><th>Brand</th><th>Category</th><th>Options</th>
      <th class="num">Variants</th><th class="num">Sets</th><th>Active</th></tr></thead>
    <tbody>${rows.map(r => `<tr data-id="${r.id}" class="${r.is_active ? "" : "off"}">
      <td class="sk">${esc(r.sku)}</td><td>${esc(r.name)}</td>
      <td>${dim(r.brand_name)}</td><td>${dim(r.category_name)}</td><td>${axes(r) || '<span class="dim">—</span>'}</td>
      <td class="num">${nV[r.id] || 0}</td><td class="num">${nS[r.id] ? nS[r.id] : '<span class="dim">—</span>'}</td>
      <td>${yn(r.is_active)}</td></tr>`).join("")}</tbody></table>`
    : '<div class="msg">No families match.</div>';
  box.querySelectorAll("tbody tr").forEach(tr => { tr.onclick = () => openFamily(tr.dataset.id); });
  pg.render({ range:"#wrange", prev:"#wprev", next:"#wnext" }, loadWide);
}

/* ── 좁은 목록 ───────────────────────────────────────── */
async function loadList(){
  const { data, error } = await pg.run(listQuery());
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }

  document.getElementById("rows").innerHTML = data.length ? data.map(r => `
    <div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <div class="sk">${esc(r.sku)}
        ${r.option1_name ? `<span class="tag">${esc(r.option1_name)}${r.option2_name?" · "+esc(r.option2_name):""}</span>` : ""}</div>
      <div class="nm">${esc(r.name)}</div>
    </div>`).join("") : '<div class="msg">No families match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  pg.render({ range:"#range", prev:"#prev", next:"#next" }, loadList);
}

async function loadDetail(id){
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [f, mem] = await Promise.all([
    sb.from("product_family").select("*").eq("id", id).maybeSingle(),
    sb.from("product").select("id,sku,name,is_active,parent_product_id,pack_factor,option1_value,option2_value,option3_value,uom_name")
      .eq("family_id", id).order("sku").range(0, 499),
  ]);
  if(f.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(f.error.message)}</div></div>`; return; }
  const r = f.data, all = mem.data || [];
  const singles = all.filter(x => !x.parent_product_id);
  const sets    = all.filter(x =>  x.parent_product_id);

  const chips = [
    `<span class="chip">${esc(r.brand_name || "no brand")}</span>`,
    `<span class="chip">${esc(r.category_name || "no category")}</span>`,
    `<span class="chip">${esc(r.uom_name || "")}</span>`,
    `<span class="chip">${esc(r.source)}</span>`,
  ];
  const axes = [r.option1_name, r.option2_name, r.option3_name].filter(Boolean);
  if(axes.length) chips.push(`<span class="chip">${axes.map(esc).join(" × ")}</span>`);

  const row = (x, edit) => `<tr>
      <td>${dim(x.option1_value)}</td>
      ${r.option2_name ? `<td>${dim(x.option2_value)}</td>` : ""}
      ${r.option3_name ? `<td>${dim(x.option3_value)}</td>` : ""}
      <td class="mono"><a class="lnk" href="products.html?id=${esc(x.id)}">${esc(x.sku)}</a></td>
      <td>${esc(x.name)}</td>
      <td class="mono">${dim(x.uom_name)}</td>
      <td>${yn(x.is_active)}</td>${edit ? `<td style="white-space:nowrap"><button class="pobtn" data-fopt="${esc(x.id)}">Options</button> <button class="pobtn" data-fleave="${esc(x.id)}" title="Take this SKU out of the family — it stays a product on its own">Remove</button></td>` : ""}</tr>`;

  const head = [r.option1_name || "Option", r.option2_name, r.option3_name, "SKU", "Name", "UOM", "Active"].filter(Boolean);
  /* fam v4 — 구성원 고치기는 Members 표에만(세트는 낱개를 따른다 · set_not_family_member) */
  const tbl = (title, rows, edit) => (rows.length || edit) ? `
    <div class="card"><h3 class="ims-sec" data-sec="${title === "Members" ? "variants" : "sets"}">${title} <span class="n">${rows.length}</span></h3>
      ${edit ? `<div style="margin:0 0 8px"><button class="pobtn" data-fjoin="1">Add member…</button></div>` : ""}
      ${rows.length ? `<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}${edit ? "<th></th>" : ""}</tr></thead>
      <tbody>${rows.map(x => row(x, edit)).join("")}</tbody></table>` : '<div class="msg">No members yet.</div>'}
      ${edit ? `<div class="note">Adding or removing a member changes how the family appears in Shopify: once the family is linked and sent, the next push adds or removes that variant on the family's Shopify product. A removed SKU stays a product on its own.</div>` : ""}</div>` : "";

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="sk">${esc(r.sku)}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
        <div class="acts">
          <button class="pobtn" data-act="toglist" title="Show or hide the list on the left">&#9776; List</button>
          <button class="pobtn" data-act="wide">&lsaquo; All families</button>
        </div>
      </div>
      <div class="note">Family is a loose grouping — it decides how variants appear in Shopify.
        It does not affect stock or purchasing.</div>
    </div>
    ${imsShop.card("family")}
    ${imsDesc.card("family", r)}
    ${tbl("Members", singles, canEdit)}
    ${tbl("Sets in this family", sets, false)}
  `;
  box.querySelector('[data-act="toglist"]').onclick = () => { const lp = document.getElementById("listPanel"); lp.hidden = !lp.hidden; };
  box.querySelector('[data-act="wide"]').onclick = showWide;
  imsDesc.wire(box, { kind:"family", row: r, sb, onChanged: async () => { await loadDetail(id); } });   // fam v2b — 설명 카드(ims-desc.js)
  imsShop.wire(box, { kind:"family", row: r, sb, members: singles.map(x => ({ id: x.id, sku: x.sku })) });   // fam v3 — Shopify 카드(ims-shop.js)
  /* fam v4 — 구성원 고치기 */
  const reload = async () => { await loadDetail(id); };
  const jb = box.querySelector("[data-fjoin]"); if(jb) jb.onclick = () => openJoin(r, axes, reload);
  box.querySelectorAll("[data-fopt]").forEach(b => { b.onclick = () => openOptions(r, axes, singles.find(x => x.id === b.dataset.fopt), reload); });
  box.querySelectorAll("[data-fleave]").forEach(b => { b.onclick = () => leaveFamily(r, singles.find(x => x.id === b.dataset.fleave), reload); });
}

/* ══ fam v4 — 구성원 고치기(product_update op family_join · family_leave · family_option · master 쓰기) ══
   ⭐ 검사(p_commit false) → 막기면 보이고 끝 · 경고면 보이고 확인 → 저장(p_ack = 경고 key) — products.html runWindow 와 같은 흐름
   ⭐ old = 화면이 본 값(family_leave 는 family SKU · family_option 은 지금 옵션 값들) — 그 사이 누가 바꿨으면 changed_elsewhere */
function showModal(html){ document.getElementById("modalBox").innerHTML = html; document.getElementById("modal").hidden = false; }
function closeModal(){ document.getElementById("modal").hidden = true; document.getElementById("modalBox").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape" && !document.getElementById("modal").hidden) closeModal(); });
function famResult(d, onGo){
  const li = x => `<li>${x.sku ? `<span class="mono">${esc(x.sku)}</span> — ` : ""}${esc(x.message)}</li>`;
  const blocks = d.blocks || [], warns = d.warnings || [];
  const body = d.error ? `<div class="msg err">${esc(d.error)}</div>`
    : `${blocks.length ? `<div style="font-weight:600;margin:4px 0">Not saved — fix these first</div><ul>${blocks.map(li).join("")}</ul>` : ""}
       ${warns.length ? `<div style="font-weight:600;margin:4px 0">${blocks.length ? "Also" : "Please confirm"}</div><ul>${warns.map(li).join("")}</ul>` : ""}`;
  const go = (!d.error && !blocks.length && onGo) ? '<button class="pobtn go" data-m="go">Save anyway</button>' : "";
  showModal(`<h4>${d.error ? "Could not save" : blocks.length ? "Not saved" : "Check before saving"}</h4><div class="pbody">${body}</div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">${go ? "Cancel" : "Close"}</button>${go}</div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = closeModal;
  const g = document.querySelector('#modalBox [data-m="go"]'); if(g) g.onclick = onGo;
}
async function famRun(changes, onDone){
  showModal('<h4>Checking…</h4><div class="pbody"><div class="msg">Checking with the server…</div></div>');
  const r1 = await sb.rpc("product_update", { p_changes: changes, p_commit: false, p_ack: [] });
  if(r1.error){ famResult({ error: r1.error.message }); return; }
  const d1 = r1.data || {};
  if((d1.blocks || []).length){ famResult(d1); return; }
  const commit = async (ack) => {
    showModal('<h4>Saving…</h4><div class="pbody"><div class="msg">Saving…</div></div>');
    const r2 = await sb.rpc("product_update", { p_changes: changes, p_commit: true, p_ack: ack });
    if(r2.error){ famResult({ error: r2.error.message }); return; }
    const d2 = r2.data || {};
    if(d2.committed){ closeModal(); await onDone(); return; }
    if((d2.blocks || []).length){ famResult(d2); return; }
    famResult(d2, () => commit((d2.warnings || []).map(w => w.key)));   // 그 사이 바뀌었다 — 새 경고를 다시 보인다
  };
  if(!(d1.warnings || []).length) return commit([]);
  famResult(d1, () => commit(d1.warnings.map(w => w.key)));
}
const optInputs = (axes, vals) => axes.map((a, i) => `<div class="frow"><label>${esc(a)}</label><input class="sofield" data-fov="${i}" value="${esc((vals || [])[i] || "")}" style="flex:1"></div>`).join("");
const readOpts = () => Array.from(document.querySelectorAll("#modalBox [data-fov]")).map(i => i.value.trim());
function openJoin(fam, axes, onDone){
  let pick = null;
  showModal(`<h4>Add a member — <span class="mono">${esc(fam.sku)}</span></h4>
    <div class="pbody">
      <input type="search" id="fjQ" placeholder="SKU or product name" autocomplete="off" style="width:100%">
      <div id="fjHits" style="max-height:240px;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px"><div class="msg">Type to search.</div></div>
      <div id="fjPick" style="margin-top:10px"></div>
      ${axes.length ? optInputs(axes, []) : '<div class="msg err">This family has no option axis — set one on the family first.</div>'}
      <div class="note" style="margin-top:6px">Only a single product that is not in another family can join (a set follows its single). Each member needs its own option value${axes.length > 1 ? "s" : ""}.</div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" id="fjGo" disabled>Check and add</button></div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = closeModal;
  const draw = async (t) => {
    const box = document.getElementById("fjHits"); if(!box) return;
    if(!t){ box.innerHTML = '<div class="msg">Type to search.</div>'; return; }
    const tt = String(t).replace(/[,()"\\]/g, "%");
    const { data, error } = await sb.from("product").select("id,sku,name,family_id,parent_product_id,is_active")
      .is("parent_product_id", null).or(`sku.ilike.%${tt}%,name.ilike.%${tt}%`).order("sku").limit(40);
    if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    box.innerHTML = (data || []).length ? data.map(p => `<div class="row" data-fp="${esc(p.id)}" style="padding:7px 10px;border-bottom:1px solid #f1f3f7;cursor:pointer;${p.family_id ? "opacity:.55" : ""}">
        <span class="mono">${esc(p.sku)}</span> <span class="dim" style="font-size:12px">${esc(p.name || "")}</span>${p.family_id ? ' <span class="tag">in a family</span>' : ""}${p.is_active ? "" : ' <span class="tag">inactive</span>'}</div>`).join("")
      : '<div class="msg">No single product matches.</div>';
    box.querySelectorAll("[data-fp]").forEach(el => { el.onclick = () => {
      const p = data.find(x => x.id === el.dataset.fp); pick = p;
      document.getElementById("fjPick").innerHTML = `Adding <b class="mono">${esc(p.sku)}</b> ${esc(p.name || "")}${p.family_id ? ' <span class="off">— already in a family: remove it there first</span>' : ""}`;
      document.getElementById("fjGo").disabled = !axes.length;
    }; });
  };
  imsQ("#fjQ", draw);
  setTimeout(() => { const i = document.getElementById("fjQ"); if(i) i.focus(); }, 30);
  document.getElementById("fjGo").onclick = () => {
    if(!pick) return;
    const opts = readOpts();
    famRun([{ op: "family_join", sku: pick.sku, family_sku: fam.sku, options: opts }], onDone);
  };
}
function openOptions(fam, axes, m, onDone){
  if(!m) return;
  const old = axes.map((a, i) => [m.option1_value, m.option2_value, m.option3_value][i] || "");
  showModal(`<h4>Option values — <span class="mono">${esc(m.sku)}</span></h4>
    <div class="pbody">${optInputs(axes, old)}<div class="note" style="margin-top:6px">Two members of one family cannot have the same option values.</div></div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" id="foGo">Check and save</button></div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = closeModal;
  document.getElementById("foGo").onclick = () => famRun([{ op: "family_option", sku: m.sku, options: readOpts(), old: old }], onDone);
}
/* ══ fam v5 — 기존 SKU 들로 새 family(판정 652 · 653 · product_family_from_skus) ══
   ⭐ 흐름은 famRun 과 같다 — 검사(p_commit false) → 막기면 보이고 끝 · 경고면 확인 → 저장(p_ack = 경고 key)
   ⭐ 다른 family 에 든 SKU 는 옮긴다(경고 moves_from_family) · 옛 family 가 비면 따로 경고(old_family_emptied · 머리는 남는다)
   ⚠️ 브랜드 · 분류 · 단위는 보내지 않는다 — DB 가 첫 SKU 의 값을 쓴다 · 머리 SKU 를 비우면 첫 SKU + FAM(판정 182) */
async function famRunNew(fam, items, onDone){
  showModal('<h4>Checking…</h4><div class="pbody"><div class="msg">Checking with the server…</div></div>');
  const r1 = await sb.rpc("product_family_from_skus", { p_family: fam, p_items: items, p_commit: false, p_ack: [] });
  if(r1.error){ famResult({ error: r1.error.message }); return; }
  const d1 = r1.data || {};
  if((d1.blocks || []).length){ famResult(d1); return; }
  const commit = async (ack) => {
    showModal('<h4>Saving…</h4><div class="pbody"><div class="msg">Saving…</div></div>');
    const r2 = await sb.rpc("product_family_from_skus", { p_family: fam, p_items: items, p_commit: true, p_ack: ack });
    if(r2.error){ famResult({ error: r2.error.message }); return; }
    const d2 = r2.data || {};
    if(d2.committed){ closeModal(); await onDone(d2); return; }
    if((d2.blocks || []).length){ famResult(d2); return; }
    famResult(d2, () => commit((d2.warnings || []).map(w => w.key)));
  };
  if(!(d1.warnings || []).length) return commit([]);
  famResult(d1, () => commit(d1.warnings.map(w => w.key)));
}
function openNewFamily(){
  const st = { name: "", sku: "", ax: ["", "", ""], note: "", mem: [] };   // mem = [{id, sku, name, fam, opts:[]}]
  const axes = () => st.ax.map(x => x.trim()).filter((x, i, a) => x && (i === 0 || a[i - 1]));
  showModal(`<h4>New family from existing SKUs</h4>
    <div class="pbody nfw" style="max-height:70vh;overflow:auto">
      <div class="frow"><label>Family name</label><input class="sofield" id="nfName" style="flex:1" autocomplete="off" placeholder="e.g. Shea Curl Cream"></div>
      <div class="frow"><label>Family SKU</label><input class="sofield" id="nfSku" style="flex:1" autocomplete="off" placeholder="leave blank = first SKU + FAM"></div>
      <div class="frow"><label>Options</label><div class="axes"><input class="sofield" id="nfA0" autocomplete="off" placeholder="Option 1 — e.g. Color"><input class="sofield" id="nfA1" autocomplete="off" placeholder="Option 2 (optional)"><input class="sofield" id="nfA2" autocomplete="off" placeholder="Option 3 (optional)"></div></div>
      <div class="frow"><label>Note</label><input class="sofield" id="nfNote" style="flex:1" autocomplete="off"></div>
      <div class="hint">Brand, category and unit come from the first SKU. Each member needs its own option value${""}s — two members cannot have the same values.</div>
      <h5>Members</h5>
      <input type="search" id="nfQ" placeholder="Find a SKU or product name to add" autocomplete="off" style="width:100%">
      <div id="nfHits" style="max-height:180px;overflow:auto;margin-top:6px;border:1px solid var(--line);border-radius:10px" hidden></div>
      <div id="nfMem" style="margin-top:8px"></div>
      <div class="hint" style="margin:12px 0 0">A SKU already in another family moves out of it into this one — you will be asked to confirm. If that old family is on Shopify, the SKU drops from that Shopify product until this new family is listed.</div>
    </div>
    <div class="pfoot"><span class="sp"></span><button class="pobtn" data-m="close">Cancel</button><button class="pobtn go" id="nfGo">Check and create</button></div>`);
  document.querySelector('#modalBox [data-m="close"]').onclick = closeModal;
  const drawMem = () => {
    const box = document.getElementById("nfMem"); if(!box) return;
    const ax = axes();
    if(!st.mem.length){ box.innerHTML = '<div class="msg">No members yet — find SKUs above.</div>'; return; }
    box.innerHTML = `<table><thead><tr><th>SKU</th><th>Name</th>${ax.map(a => `<th>${esc(a)}</th>`).join("")}<th></th></tr></thead><tbody>${st.mem.map((m, i) => `<tr>
        <td class="mono">${esc(m.sku)}${i === 0 ? ' <span class="tag" title="The family takes its brand, category and unit from this SKU">first</span>' : ""}</td>
        <td>${esc(m.name || "")}${m.fam ? `<div class="off" style="font-size:11.5px">moves out of ${esc(m.fam)}</div>` : ""}</td>
        ${ax.map((a, j) => `<td><input class="sofield" data-nfo="${i}:${j}" value="${esc(m.opts[j] || "")}" style="width:110px" autocomplete="off"></td>`).join("")}
        <td><button class="xbtn" data-nfrm="${i}" title="Remove">&#10005;</button></td></tr>`).join("")}</tbody></table>`;
    box.querySelectorAll("[data-nfo]").forEach(inp => { inp.oninput = () => { const [i, j] = inp.dataset.nfo.split(":").map(Number); st.mem[i].opts[j] = inp.value; }; });
    box.querySelectorAll("[data-nfrm]").forEach(b => { b.onclick = () => { st.mem.splice(Number(b.dataset.nfrm), 1); drawMem(); }; });
  };
  [0, 1, 2].forEach(i => { document.getElementById("nfA" + i).oninput = (e) => { st.ax[i] = e.target.value; drawMem(); }; });
  const hits = document.getElementById("nfHits");
  const draw = async (t) => {
    if(!t){ hits.hidden = true; return; }
    hits.hidden = false;
    const tt = String(t).replace(/[,()"\\]/g, "%");
    const { data, error } = await sb.from("product").select("id,sku,name,family_id,parent_product_id,is_active")
      .is("parent_product_id", null).eq("is_active", true).or(`sku.ilike.%${tt}%,name.ilike.%${tt}%`).order("sku").limit(40);
    if(error){ hits.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
    hits.innerHTML = (data || []).length ? data.map(p => `<div class="row" data-nfp="${esc(p.id)}" style="padding:7px 10px;border-bottom:1px solid #f1f3f7;cursor:pointer">
        <span class="mono">${esc(p.sku)}</span> <span class="dim" style="font-size:12px">${esc(p.name || "")}</span>${p.family_id ? ' <span class="tag">in a family</span>' : ""}${st.mem.some(m => m.id === p.id) ? ' <span class="tag">added</span>' : ""}</div>`).join("")
      : '<div class="msg">No active single product matches.</div>';
    hits.querySelectorAll("[data-nfp]").forEach(el => { el.onclick = async () => {
      const p = data.find(x => x.id === el.dataset.nfp);
      if(!p || st.mem.some(m => m.id === p.id)) return;
      let fam = "";
      if(p.family_id){ const f = await sb.from("product_family").select("sku,name").eq("id", p.family_id).maybeSingle(); fam = f.data ? `${f.data.name} (${f.data.sku})` : "another family"; }
      st.mem.push({ id: p.id, sku: p.sku, name: p.name, fam: fam, opts: [] });
      document.getElementById("nfQ").value = ""; hits.hidden = true; drawMem();
      document.getElementById("nfQ").focus();
    }; });
  };
  imsQ("#nfQ", draw);
  drawMem();
  setTimeout(() => { const i = document.getElementById("nfName"); if(i) i.focus(); }, 30);
  document.getElementById("nfGo").onclick = () => {
    const name = document.getElementById("nfName").value.trim();
    const ax = axes();
    if(!name){ alert("Type the family name."); return; }
    if(!ax.length){ alert("Type at least the Option 1 name (e.g. Color)."); return; }
    if(!st.mem.length){ alert("Add at least one SKU."); return; }
    const fam = { name: name, option1_name: ax[0] };
    if(ax[1]) fam.option2_name = ax[1];
    if(ax[2]) fam.option3_name = ax[2];
    const sku = document.getElementById("nfSku").value.trim(); if(sku) fam.sku = sku;
    const note = document.getElementById("nfNote").value.trim(); if(note) fam.note = note;
    const items = st.mem.map(m => ({ sku: m.sku, options: ax.map((a, j) => String(m.opts[j] || "").trim()) }));
    famRunNew(fam, items, async (d) => { const id = d.family && d.family.id; if(id) await openFamily(id); else showWide(); });
  };
}
function leaveFamily(fam, m, onDone){
  if(!m) return;
  if(!confirm(`Take ${m.sku} out of family ${fam.sku}?\n\nIt stays a product on its own (stock, prices and orders are not touched). Its option values are cleared. On Shopify, the next push of this family drops the variant.`)) return;
  famRun([{ op: "family_leave", sku: m.sku, old: fam.sku }], onDone);
}

imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client;
  imsHeader(me);
  canEdit = imsAuth.canWrite("master");   // fam v4 — product_update 의 문(ims_require_write master)
  { const nf = document.getElementById("wnewfam"); if(canEdit){ nf.hidden = false; nf.onclick = openNewFamily; } }   // fam v5
  document.getElementById("wprod").onclick = () => { location.href = "products.html"; };   // fam v5b — 글자 링크 → 단추(같은 줄의 단추와 같은 꼴)
  { const nn = document.getElementById("wnewfamNew"); if(canEdit){ nn.hidden = false; nn.onclick = () => { location.href = "products.html?new=family"; }; } }   // fam v5b — 새 SKU 로 새 family 는 Products 의 창(판정 200) · 문만 하나 더
  document.getElementById("buildTag").textContent = FAM_BUILD;
  document.getElementById("axis").onchange = e => { axis = e.target.value; pg.reset(); clearDetail(); loadList(); };
  document.getElementById("brand").onchange = e => { brand = e.target.value.trim(); pg.reset(); clearDetail(); loadList(); };
  document.getElementById("onlyActive").onchange = e => { onlyActive = e.target.checked; pg.reset(); clearDetail(); loadList(); };
  imsQ("#q", v => { q = v; pg.reset(); clearDetail(); loadList(); });
  document.getElementById("waxis").onchange = e => { axis = e.target.value; pg.reset(); loadWide(); };
  document.getElementById("wbrand").onchange = e => { brand = e.target.value.trim(); pg.reset(); loadWide(); };
  document.getElementById("wactive").onchange = e => { onlyActive = e.target.checked; pg.reset(); loadWide(); };
  imsQ("#wq", v => { q = v; pg.reset(); loadWide(); });
  document.getElementById("wclear").onclick = () => { q = ""; axis = ""; brand = ""; onlyActive = true; syncCtl(); pg.reset(); loadWide(); };
  /* 브랜드 목록 — family 가 쓰는 브랜드(이름 칸 · 판정 143 의 복사 이름) */
  try {
    const bs = new Set();
    for(let from = 0; ; from += 1000){
      const { data } = await sb.from("ref_brand").select("name").eq("is_active", true).order("name").range(from, from + 999);
      (data||[]).forEach(x => bs.add(x.name));
      if(!data || data.length < 1000) break;
    }
    document.getElementById("brandList").innerHTML = [...bs].map(n => `<option value="${esc(n)}">`).join("");
  } catch(e) {}

  /* 옵션 축 목록 — 1,141행을 다 읽어 고유값을 뽑는다(캡 아래라 두 번이면 된다) */
  const seen = {};
  for(let p=0; p<2; p++){
    const { data } = await sb.from("product_family").select("option1_name").range(p*1000, p*1000+999);
    (data||[]).forEach(x => {
      if(!x.option1_name) return;
      const k = canonAxis(x.option1_name);      // ⭐ 합쳐서 센다
      seen[k] = (seen[k]||0)+1;
    });
    if(!data || data.length < 1000) break;
  }
  document.getElementById("axis").innerHTML = '<option value="">All option axes</option>' +
    Object.keys(seen).sort((a,b)=> seen[b]-seen[a])
      .map(k => `<option value="${esc(k)}">${esc(k)} (${seen[k]})</option>`).join("");
  document.getElementById("waxis").innerHTML = document.getElementById("axis").innerHTML;

  /* ?id= 는 바로 상세(Products 의 Family 링크) · 그 밖은 넓은 목록 */
  const wantId = new URLSearchParams(location.search).get("id");
  if(wantId) await openFamily(wantId);
  else showWide();
});
