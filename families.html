<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Families · Asung IMS</title>
<style>
  :root{ --line:#e5e9ef; --muted:#6b7686; --ink:#12161c; --bg:#f7f8fa; --accent:#2f6df6; }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Inter",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:8px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header .brand{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px}
  header .sp{flex:1}
  header .who{font-size:13px;color:var(--muted)}
  header button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  header button:hover{background:#f2f4f8}

  .wrap{display:flex;gap:16px;padding:16px 18px;align-items:flex-start}
  .list{width:330px;flex:0 0 330px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px}
  .list .top{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .list input[type=search]{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px}
  .list input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,109,246,.12)}
  .list select{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12.5px}
  .list .rows{max-height:calc(100vh - 225px);overflow:auto}
  .list .row{padding:8px 12px;border-bottom:1px solid #f1f3f7;cursor:pointer}
  .list .row:hover{background:#fafbfd}
  .list .row.cur{background:#eef3ff}
  .list .row .sk{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .list .row.cur .sk{color:#3b5bdb}
  .list .row .nm{font-size:13px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list .row .tag{font-size:10px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:999px;padding:0 6px}
  .list .foot{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
  .list .foot .sp{flex:1}
  .list .foot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .list .foot button:disabled{opacity:.45;cursor:default}
  .range{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--muted)}

  main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;font-family:ui-monospace,Menlo,monospace;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .card h3 .n{color:var(--ink);font-weight:700}
  .head{padding:16px}
  .head .sk{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted)}
  .head .nm{font-size:19px;font-weight:700;margin:3px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
  .note{padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);background:#fafbfd}

  table{border-collapse:collapse;width:100%;font-size:13px}
  thead th{background:#fafbfd;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);
    font-size:10.5px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  tbody td{padding:7px 12px;border-bottom:1px solid #f1f3f7;vertical-align:top}
  tbody tr:hover{background:#fafbfd}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .dim{color:#9aa4b2}
  .on{color:#16a34a;font-weight:600} .off{color:#b42318;font-weight:600}
  .lnk{color:var(--accent);text-decoration:none}
  .lnk:hover{text-decoration:underline}
  .msg{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}
  .err{color:#dc2626;font-weight:600}
</style>
</head>
<body>

<header>
  <span class="brand">ASUNG IMS</span>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <button title="Main menu">☰ Menu</button>
  <button id="logoutBtn">Sign Out</button>
</header>

<div class="wrap">
  <section class="list">
    <div class="top">
      <input type="search" id="q" placeholder="Search family SKU or name">
      <select id="axis"><option value="">All option axes</option></select>
    </div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
    <div class="foot">
      <span class="range" id="range"></span><span class="sp"></span>
      <button id="prev">←</button><button id="next">→</button>
    </div>
  </section>

  <main id="detail"><div class="card"><div class="msg">Select a family.</div></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="ims-config.js"></script>
<script src="ims-auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Families — product_family 1,141 (읽기 전용)
   정본: docs/design/po-module.md §3-d

   ⭐ 패밀리는 느슨한 묶음이다(Caleb 2026-09-15).
      안 묶여도 재고·발주가 안 깨진다 — 안 묶인 제품이 4,161 있고 그것이 정상이다.
      Shopify 에서 한 상품의 변형으로 보일지를 정하는 축이라 묶고 푸는 것이 판매 쪽 판단이다.
   ⚠️ product_bom(디스플레이↔낱개)과 다르다 — 그쪽은 재고가 실제로 흐르는 단단한 묶음이다.

   실측 2026-09-15
     패밀리당 제품 수   1개 11 · 2~5개 913 · 6~20개 197 · 21개 이상 20 · ⭐ 빈 패밀리 0
     옵션 축            Color 436 · Size 312 · Formula 68 · Type 49 · Style 45 · ⚠️ color 38
                        ⚠️⚠️ Color 와 color 가 갈려 있다 — 같은 축인데 대소문자가 다르다.
                             Shopify 로 내보낼 때 변형 옵션 이름이 상품마다 갈린다. 정리 목록에 있다.
     둘째 축이 있는 패밀리는 33개뿐 (Color×Size 22 · Size×Formula 11) · 셋째 축 없음
   ───────────────────────────────────────────────────────────── */

const PAGE = 100;
let sb=null, page=0, q="", axis="", total=0, curId=null;

/* ⚠️ 옵션 축 이름이 갈려 있다(2026-09-15 실측) — Color 463 / color 38 · Flavor 4 / Flavour 3.
   ⭐ 화면에서만 합친다. 데이터는 Cin7 에서 온 값이라 고쳐도 다음 재적재가 되돌린다.
   ⚠️ 명백한 것만 넣는다 — Size/Volume/Length, Type/Style/Design/Shape 는 실무에서
      구별하는 것일 수 있어 합치지 않는다. 필요해지면 그때 늘린다.
   ⬜ Shopify 연동 때는 데이터를 정리해야 한다(우리 칸을 두거나 Cin7 을 고치거나). */
const AXIS_ALIAS = {
  "color":   "Color",
  "Flavour": "Flavor",
  "flavour": "Flavor",
  "flavor":  "Flavor",
  "size":    "Size",
};
const canonAxis = n => AXIS_ALIAS[n] || n;
/* 고른 축에 해당하는 원문들 — 검색은 원문으로 걸어야 한다 */
const axisVariants = canon =>
  [canon].concat(Object.keys(AXIS_ALIAS).filter(k => AXIS_ALIAS[k] === canon && k !== canon));

const esc = v => String(v==null?"":v).replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const dim = v => (v===null||v===undefined||v==="") ? '<span class="dim">—</span>' : esc(v);
const yn  = v => v===true ? '<span class="on">✓</span>' : v===false ? '<span class="off">✗</span>' : '<span class="dim">—</span>';

async function loadList(){
  const from = page*PAGE, to = from+PAGE-1;
  let qry = sb.from("product_family")
    .select("id,sku,name,brand_name,option1_name,option2_name", { count:"exact" });
  if(axis){
    const vs = axisVariants(axis);
    qry = vs.length > 1
      ? qry.or(vs.map(v => `option1_name.eq.${v}`).join(","))
      : qry.eq("option1_name", axis);
  }
  if(q) qry = qry.or(`sku.ilike.%${q}%,name.ilike.%${q}%`);

  const { data, count, error } = await qry.order("sku").range(from, to);
  if(error){ document.getElementById("rows").innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  total = count || 0;

  document.getElementById("rows").innerHTML = data.length ? data.map(r => `
    <div class="row ${r.id===curId?"cur":""}" data-id="${r.id}">
      <div class="sk">${esc(r.sku)}
        ${r.option1_name ? `<span class="tag">${esc(r.option1_name)}${r.option2_name?" · "+esc(r.option2_name):""}</span>` : ""}</div>
      <div class="nm">${esc(r.name)}</div>
    </div>`).join("") : '<div class="msg">No families match.</div>';

  document.querySelectorAll(".list .row").forEach(el => {
    el.onclick = () => { curId = el.dataset.id; loadList(); loadDetail(curId); };
  });

  if(curId && !data.some(r => r.id === curId)){
    curId = null;
    document.getElementById("detail").innerHTML = '<div class="card"><div class="msg">Select a family.</div></div>';
  }

  const f = total ? from+1 : 0, t2 = Math.min(from+data.length, total);
  document.getElementById("range").textContent = `${f.toLocaleString()}–${t2.toLocaleString()} / ${total.toLocaleString()}`;
  document.getElementById("prev").disabled = page===0;
  document.getElementById("next").disabled = (from+PAGE) >= total;
}

async function loadDetail(id){
  const box = document.getElementById("detail");
  box.innerHTML = '<div class="card"><div class="msg">Loading…</div></div>';

  const [f, mem] = await Promise.all([
    sb.from("product_family").select("*").eq("id", id).maybeSingle(),
    sb.from("product").select("id,sku,name,is_active,parent_product_id,pack_factor,option1_value,option2_value,option3_value,uom_name")
      .eq("family_id", id).order("sku").range(0, 499),
  ]);
  if(f.error){ box.innerHTML = `<div class="card"><div class="msg err">${esc(f.error.message)}</div></div>`; return; }
  const r = f.data, all = mem.data || [];
  const singles = all.filter(x => !x.parent_product_id);
  const sets    = all.filter(x =>  x.parent_product_id);

  const chips = [
    `<span class="chip">${esc(r.brand_name || "no brand")}</span>`,
    `<span class="chip">${esc(r.category_name || "no category")}</span>`,
    `<span class="chip">${esc(r.uom_name || "")}</span>`,
    `<span class="chip">${esc(r.source)}</span>`,
  ];
  const axes = [r.option1_name, r.option2_name, r.option3_name].filter(Boolean);
  if(axes.length) chips.push(`<span class="chip">${axes.map(esc).join(" × ")}</span>`);

  const row = x => `<tr>
      <td>${dim(x.option1_value)}</td>
      ${r.option2_name ? `<td>${dim(x.option2_value)}</td>` : ""}
      <td class="mono"><a class="lnk" href="products.html?id=${esc(x.id)}">${esc(x.sku)}</a></td>
      <td>${esc(x.name)}</td>
      <td class="mono">${dim(x.uom_name)}</td>
      <td>${yn(x.is_active)}</td></tr>`;

  const head = [r.option1_name || "Option", r.option2_name, "SKU", "Name", "UOM", "Active"].filter(Boolean);
  const tbl = (title, rows) => rows.length ? `
    <div class="card"><h3>${title} <span class="n">${rows.length}</span></h3>
      <table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(row).join("")}</tbody></table></div>` : "";

  box.innerHTML = `
    <div class="card">
      <div class="head">
        <div class="sk">${esc(r.sku)}</div>
        <div class="nm">${esc(r.name)}</div>
        <div class="chips">${chips.join("")}</div>
      </div>
      <div class="note">Family is a loose grouping — it decides how variants appear in Shopify.
        It does not affect stock or purchasing.</div>
    </div>
    ${tbl("Members", singles)}
    ${tbl("Sets in this family", sets)}
  `;
}

imsAuth.start({ changePw:true }, async (client, me) => {
  sb = client;
  document.getElementById("who").textContent = me.name + " · " + me.role;
  document.getElementById("logoutBtn").onclick = () => imsAuth.signOut();

  document.getElementById("prev").onclick = () => { if(page>0){ page--; loadList(); } };
  document.getElementById("next").onclick = () => { page++; loadList(); };
  document.getElementById("axis").onchange = e => { axis = e.target.value; page=0; loadList(); };

  let timer=null;
  document.getElementById("q").addEventListener("input", e => {
    clearTimeout(timer);
    timer = setTimeout(()=>{ q = e.target.value.trim(); page=0; loadList(); }, 250);
  });

  /* 옵션 축 목록 — 1,141행을 다 읽어 고유값을 뽑는다(캡 아래라 두 번이면 된다) */
  const seen = {};
  for(let p=0; p<2; p++){
    const { data } = await sb.from("product_family").select("option1_name").range(p*1000, p*1000+999);
    (data||[]).forEach(x => {
      if(!x.option1_name) return;
      const k = canonAxis(x.option1_name);      // ⭐ 합쳐서 센다
      seen[k] = (seen[k]||0)+1;
    });
    if(!data || data.length < 1000) break;
  }
  document.getElementById("axis").innerHTML = '<option value="">All option axes</option>' +
    Object.keys(seen).sort((a,b)=> seen[b]-seen[a])
      .map(k => `<option value="${esc(k)}">${esc(k)} (${seen[k]})</option>`).join("");

  const wantId = new URLSearchParams(location.search).get("id");
  await loadList();
  if(wantId){ curId = wantId; await loadDetail(wantId); }
});
</script>
</body>
</html>
